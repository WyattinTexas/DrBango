<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JUMPR Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0B16">
<style>
  :root {
    --bg:#0E0B16; --panel:#171226; --panel2:#1E1732; --line:#2C2344;
    --ink:#EDE9F6; --muted:#8D85A3; --violet:#A78BFA; --violet-deep:#7C5CFF;
    --amber:#F5B455; --ok:#6EE7A8; --bad:#F87171;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--ink);
    font:16px/1.45 -apple-system, system-ui, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 40px; min-height:100svh; }
  .wrap { max-width:560px; margin:0 auto; padding:12px 16px; }
  header { display:flex; align-items:center; gap:10px; padding:10px 2px 14px; }
  .logo { font-size:22px; font-weight:800; letter-spacing:-0.02em; }
  .logo span { color:var(--violet); }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--muted); flex:0 0 auto; }
  .dot.ok { background:var(--ok); box-shadow:0 0 8px rgba(110,231,168,.6); }
  .dot.stale { background:var(--amber); }
  .dot.dead { background:var(--bad); }
  .macline { font-family:var(--mono); font-size:11.5px; color:var(--muted); flex:1;
    display:flex; align-items:center; gap:6px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:14px; margin-bottom:12px; }
  .label { font-family:var(--mono); font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--muted); margin:0 0 8px; }
  .statrow { display:flex; gap:8px; flex-wrap:wrap; font-family:var(--mono); font-size:12px; }
  .chip { background:var(--panel2); border:1px solid var(--line); border-radius:8px;
    padding:6px 9px; color:var(--muted); }
  .chip b { color:var(--ink); font-weight:600; }
  .chip.hot { border-color:var(--violet); }
  .chip.hot b { color:var(--violet); }

  .bar { height:8px; border-radius:5px; background:var(--panel2); border:1px solid var(--line);
    overflow:hidden; margin-top:10px; }
  .bar i { display:block; height:100%; width:0%;
    background:linear-gradient(90deg, var(--violet-deep), var(--violet)); transition:width .6s; }

  .task { display:flex; gap:10px; align-items:baseline; padding:9px 2px;
    border-bottom:1px solid var(--line); }
  .task:last-child { border-bottom:none; }
  .st { font-family:var(--mono); font-size:11px; flex:0 0 86px; }
  .st.done { color:var(--ok); } .st.running { color:var(--amber); }
  .st.queue { color:var(--muted); } .st.blocked { color:var(--bad); }
  .task p { margin:0; flex:1; font-size:13.5px; color:var(--ink); }
  .task.queue p { color:var(--muted); }
  .task small { display:block; font-family:var(--mono); font-size:10.5px; color:var(--muted); }
  @media (prefers-reduced-motion: no-preference) {
    .st.running { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity:.45; } }
  }
  .ship { font-family:var(--mono); font-size:12px; color:var(--ink);
    padding:7px 2px; border-bottom:1px solid var(--line); word-break:break-word; }
  .ship:last-child { border-bottom:none; }
  .ship b { color:var(--amber); }
  .loglines { font-family:var(--mono); font-size:11px; color:var(--muted);
    line-height:1.7; margin:0; white-space:pre-wrap; word-break:break-word; }
  .empty { color:var(--muted); font-size:13.5px; margin:0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🦘 <span>JUMPR</span> board</div>
    <div class="macline" id="macline"><span class="dot" id="dot"></span> connecting…</div>
  </header>

  <div class="card">
    <p class="label">Starspell chain · Skylar's Mac</p>
    <div class="statrow" id="chips"><span class="chip">waiting for first report…</span></div>
    <div class="bar"><i id="barfill"></i></div>
  </div>

  <div class="card">
    <p class="label">Jumps</p>
    <div id="tasks"><p class="empty">—</p></div>
  </div>

  <div class="card">
    <p class="label">Shipped this chain</p>
    <div id="ships"><p class="empty">Nothing pushed yet.</p></div>
  </div>

  <div class="card">
    <p class="label">Chain log</p>
    <p class="loglines" id="log">—</p>
  </div>
</div>

<script>
"use strict";
const URL_ = "https://testroom-75200-default-rtdb.firebaseio.com/jumpr_local/starspell/status.json";
const $ = id => document.getElementById(id);
let S = null;

function ago(sec) {
  if (sec < 90) return Math.round(sec) + "s";
  if (sec < 5400) return Math.round(sec/60) + "m";
  return (sec/3600).toFixed(1) + "h";
}
function esc(s) { const d = document.createElement("span"); d.textContent = s; return d.innerHTML; }

function render() {
  if (!S) return;
  const now = Date.now()/1000, age = now - S.ts;
  const tasks = S.tasks || [];
  const done = tasks.filter(t => t.state === "done").length;
  const blocked = tasks.filter(t => t.state === "blocked").length;
  const queued = tasks.filter(t => t.state === "queue").length;
  const finished = !S.alive && queued === 0 && !S.running;

  const dot = $("dot"), line = $("macline");
  dot.className = "dot " + (age < 75 ? "ok" : age < 300 ? "stale" : "dead");
  line.innerHTML = ""; line.append(dot,
    age < 75 ? ` live · ${ago(age)} ago` : ` last report ${ago(age)} ago`);

  const state = finished ? "🌅 <b>FINISHED</b>" :
                S.alive ? "⛓ chain <b>RUNNING</b>" : "⏸ chain <b>PAUSED</b>";
  const chips = [
    `<span class="chip ${S.alive ? "hot" : ""}">${state}</span>`,
    `<span class="chip">jumps <b>${done}</b>/${tasks.length}</span>`,
    `<span class="chip">account <b>claude-${esc(S.account)}</b></span>`
  ];
  if (blocked) chips.push(`<span class="chip">blocked <b>${blocked}</b></span>`);
  if (S.running && S.running_since)
    chips.push(`<span class="chip">now <b>${ago(now - S.running_since)}</b> in</span>`);
  $("chips").innerHTML = chips.join("");
  $("barfill").style.width = tasks.length ? (100 * done / tasks.length) + "%" : "0%";

  const ICON = { done:"✓ done", running:"🦘 jumping", queue:"· queued", blocked:"✕ blocked" };
  $("tasks").innerHTML = tasks.map(t => `
    <div class="task ${t.state}">
      <span class="st ${t.state}">${ICON[t.state] || t.state}</span>
      <p>${esc(t.title || t.file)}<small>${esc(t.file)}</small></p>
    </div>`).join("") || '<p class="empty">No tasks.</p>';

  const ships = (S.changelog || []).map(l => `<div class="ship">${esc(l)}</div>`).join("");
  $("ships").innerHTML = ships ||
    (S.beta3_head ? `<div class="ship">beta3 head: <b>${esc(S.beta3_head)}</b></div>` :
     '<p class="empty">Nothing pushed yet.</p>');
  if (ships && S.beta3_head)
    $("ships").innerHTML += `<div class="ship">beta3 head: <b>${esc(S.beta3_head)}</b></div>`;

  $("log").textContent = (S.chain_log || []).join("\n") || "—";
}

async function poll() {
  try {
    const r = await fetch(URL_ + "?x=" + Date.now());
    if (r.ok) { const j = await r.json(); if (j && j.ts) S = j; }
  } catch (e) { /* offline — keep last */ }
  render();
}
poll();
setInterval(poll, 10000);
setInterval(render, 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
</script>
</body>
</html>
