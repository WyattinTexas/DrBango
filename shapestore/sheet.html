<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THE PARTS COUNTER — Shape Store character sheets</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐲</text></svg>">
<style>
:root{ --paper:#F2EBD8; --ink:#2A2620; --gold:#D9A544; --bg:#1D241A; --panel:#28301F; --cream:#EDE4CC; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; background:var(--bg); color:var(--cream); font-family:"Trebuchet MS",Verdana,sans-serif;
  -webkit-user-select:none; user-select:none; padding-bottom:60px;}
h1,h2,.wm,.bub{font-family:Impact,"Arial Black",sans-serif; letter-spacing:1px; font-weight:normal;}
header{padding:14px 16px 6px; text-align:center;}
header .wm{font-size:26px; color:var(--gold); text-shadow:1px 1px 0 #14180C;}
header small{display:block; color:#8A8A72; font-size:11px; letter-spacing:2px; font-family:"Trebuchet MS";}
/* the shopkeeper asks */
#asks{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; padding:10px 12px;}
.bub{background:var(--paper); color:#4A4432; border:3px solid #B8A888; border-radius:14px; padding:8px 14px;
  font-size:14px; cursor:pointer; position:relative;}
.bub.on{border-color:var(--gold); color:var(--ink); box-shadow:0 0 0 2px var(--gold);}
/* the example stays with you */
#hero{position:sticky; top:0; z-index:10; background:linear-gradient(var(--bg) 82%, transparent);
  display:flex; justify-content:center; padding:6px 0 14px;}
#heroCard{background:var(--paper); border:3px solid var(--gold); border-radius:14px; padding:6px 10px; text-align:center;
  box-shadow:0 8px 30px #000A;}
#heroCard svg{display:block; width:190px; height:190px; transition:width 0.25s ease, height 0.25s ease;}
#heroCard .nm{font-size:12px; font-weight:bold; color:#4A4432; letter-spacing:1px;}
#mix{display:block; margin:6px auto 0; background:var(--gold); color:#2A2010; border:none; border-radius:9px;
  padding:7px 14px; font-weight:bold; font-size:13px; cursor:pointer; font-family:inherit;}
/* scrolled: the toy steps back so the shelves stay visible */
body.scrolled #heroCard svg{width:118px; height:118px;}
body.scrolled #mix{padding:4px 10px; font-size:11px;}
body.scrolled #heroCard .nm{font-size:10px;}
/* the sheet */
#sheet{max-width:760px; margin:0 auto; padding:0 12px;}
.sec{margin:16px 0;}
.sec h2{font-size:15px; color:var(--gold); border-bottom:1px solid #4A5740; padding-bottom:4px; margin:0 0 8px;}
.sec h2 small{color:#8A8A72; font-size:10px; letter-spacing:1px; font-family:"Trebuchet MS"; font-weight:normal;}
.chips{display:flex; gap:8px; flex-wrap:wrap;}
.chip{background:var(--paper); border:3px solid transparent; border-radius:10px; padding:4px; cursor:pointer; text-align:center; width:86px;}
.chip svg{display:block; width:76px; height:56px; margin:0 auto;}
.chip div{font-size:9px; font-weight:bold; color:#4A4432; letter-spacing:.5px; margin-top:2px; text-transform:uppercase;}
.chip.on{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold);}
.chip:active{transform:scale(0.96);}
footer{text-align:center; color:#57574A; font-size:10px; letter-spacing:1px; padding:26px 0 10px;}
@media (pointer:coarse){ .chip{width:96px;} .chip svg{width:86px; height:62px;} }
</style>
</head>
<body>
<header>
  <div class="wm">THE PARTS COUNTER</div>
  <small>THE SHAPE STORE · PICK A PART, THE TOY WEARS IT</small>
</header>
<div id="asks"></div>
<div id="hero">
  <div id="heroCard">
    <svg id="heroSvg" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="nm" id="heroName"></div>
    <button id="mix" onclick="mixUp()">🎲 MIX ONE UP</button>
  </div>
</div>
<div id="sheet"></div>
<footer>EVERY PART IS A REAL GVT MOLD PIECE — TAP CHIPS, BUILD A TOY</footer>

/* ================= THE COUNTER ================= */
let CUR=0;
const PICKS={};   // key -> {slotId: index}
function C(){ return CHARS[CUR]; }
function picks(){ const c=C(); if(!PICKS[c.key]){ PICKS[c.key]={}; c.slots.forEach(s=>PICKS[c.key][s.id]=s.d||0); } return PICKS[c.key]; }
function slotSVG(slot){ const p=picks(); const v=slot.v[p[slot.id]]||slot.v[0]; return slot.wrap? '<g transform="'+slot.wrap+'">'+v.s+'</g>' : v.s; }
function heroStr(){
  const c=C();
  return c.layers.map(l=> typeof l==='string'? l : slotSVG(c.slots.find(s=>s.id===l.slot))).join('');
}
function renderHero(){
  const c=C();
  $('heroSvg').setAttribute('viewBox', c.vb);
  $('heroSvg').innerHTML = heroStr();
  $('heroName').textContent = c.name;
}
function chipSVG(slot, v){
  let inner=v.s;
  if(!inner){ const b=slot.chipVB.split(' ').map(Number);
    inner='<text x="'+(b[0]+b[2]/2)+'" y="'+(b[1]+b[3]/2+3)+'" text-anchor="middle" font-size="'+Math.round(b[3]/3)+'" fill="#B8A888" font-family="Trebuchet MS">·</text>'; }
  return '<svg xmlns="'+NS+'" viewBox="'+slot.chipVB+'">'+inner+'</svg>';
}
function renderSheet(){
  const c=C(), p=picks();
  $('sheet').innerHTML = c.slots.map(slot=>
    '<div class="sec"><h2>'+slot.label+(slot.note? ' <small>· '+slot.note+'</small>':'')+'</h2><div class="chips">'
    + slot.v.map((v,i)=>'<div class="chip'+(p[slot.id]===i?' on':'')+'" onclick="pick(\''+slot.id+'\','+i+')">'+chipSVG(slot,v)+'<div>'+v.n+'</div></div>').join('')
    +'</div></div>').join('');
}
function pick(slotId, i){
  picks()[slotId]=i;
  renderHero();
  const c=C();
  document.querySelectorAll('.sec').forEach((sec,si)=>{
    if(c.slots[si].id!==slotId) return;
    sec.querySelectorAll('.chip').forEach((ch,ci)=>ch.classList.toggle('on', ci===i));
  });
}
function mixUp(){
  const c=C(), p=picks();
  c.slots.forEach(s=>{ p[s.id]=Math.floor(Math.random()*s.v.length); });
  renderHero(); renderSheet();
}
function setChar(i){
  CUR=i;
  document.querySelectorAll('.bub').forEach((b,bi)=>b.classList.toggle('on', bi===i));
  renderHero(); renderSheet();
  scrollTo({top:0, behavior:'smooth'});
}
$('asks').innerHTML = CHARS.map((c,i)=>'<div class="bub'+(i===0?' on':'')+'" onclick="setChar('+i+')">'+c.ask+'</div>').join('');
addEventListener('scroll',()=>document.body.classList.toggle('scrolled', scrollY>130), {passive:true});
renderHero(); renderSheet();
</script>
