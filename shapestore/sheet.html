<!doctype html>
<html lang="en">

<title>THE SHAPE STORE — Character Maker</title>
<link rel="icon" href="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%22undefined%22%3E%3Cellipse%20cx%3D%2272%22%20cy%3D%22130%22%20rx%3D%2254%22%20ry%3D%228%22%20fill%3D%22%23000%22%20opacity%3D%220.28%22%2F%3E%3Cpath%20d%3D%22M92%20100%20Q124%20100%20132%2070%20Q135%2058%20128%2056%20Q122%2070%20108%2082%20Q98%2092%2092%20100%20z%22%20fill%3D%22%234E8C4A%22%2F%3E%3Cpath%20d%3D%22M56%2056%20l6%20-12%206%2012%20z%22%20fill%3D%22%233D6E3B%22%2F%3E%3Cpath%20d%3D%22M70%2053%20l6%20-13%206%2013%20z%22%20fill%3D%22%233D6E3B%22%2F%3E%3Cpath%20d%3D%22M84%2058%20l6%20-11%206%2011%20z%22%20fill%3D%22%233D6E3B%22%2F%3E%3Cpath%20d%3D%22M42%20116%20Q30%2096%2040%2074%20Q52%2052%2082%2056%20Q110%2060%20112%2090%20Q113%20114%2088%20122%20Q62%20128%2042%20116%20z%22%20fill%3D%22%234E8C4A%22%2F%3E%3Cpath%20d%3D%22M54%20116%20Q48%20100%2056%2086%20Q68%2074%2086%2078%20Q100%2082%2098%20104%20Q94%20118%2076%20120%20Q62%20122%2054%20116%20z%22%20fill%3D%22%236FB05E%22%2F%3E%3Cpath%20d%3D%22M62%2096%20Q54%2098%2052%20106%22%20stroke%3D%22%234E8C4A%22%20stroke-width%3D%226%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%2F%3E%3Ccircle%20cx%3D%2252%22%20cy%3D%22107%22%20r%3D%223%22%20fill%3D%22%234E8C4A%22%2F%3E%3Cpath%20d%3D%22M74%2094%20Q94%2094%2096%20120%20Q96%20128%2086%20128%20L64%20128%20Q60%20116%2064%20104%20Q68%2094%2074%2094%20z%22%20fill%3D%22%233D6E3B%22%2F%3E%3Cpath%20d%3D%22M84%20128%20l7%20-3%20M92%20128%20l7%20-3%20M76%20128%20l7%20-3%22%20stroke%3D%22%232f5730%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M50%2070%20Q22%2062%2012%2074%20Q8%2082%2016%2084%20L48%2084%20Q54%2076%2050%2070%20z%22%20fill%3D%22%234E8C4A%22%2F%3E%3Cpath%20d%3D%22M48%2086%20Q26%2090%2018%2099%20Q28%20101%2042%2098%20Q52%2095%2050%2088%20z%22%20fill%3D%22%233D6E3B%22%2F%3E%3Cpath%20d%3D%22M18%2084%20l3%206%203%20-6%20z%20M27%2084%20l3%206%203%20-6%20z%20M36%2084%20l3%206%203%20-6%20z%22%20fill%3D%22%23F5EFD8%22%2F%3E%3Cpath%20d%3D%22M25%2090%20l3%20-5%203%205%20z%20M35%2090%20l3%20-5%203%205%20z%22%20fill%3D%22%23F5EFD8%22%2F%3E%3Cpath%20d%3D%22M33%2065%20Q41%2061%2049%2066%22%20stroke%3D%22%233D6E3B%22%20stroke-width%3D%223.5%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2273%22%20r%3D%226%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2237%22%20cy%3D%2274%22%20r%3D%223%22%20fill%3D%22%231a1208%22%2F%3E%3Ccircle%20cx%3D%2219%22%20cy%3D%2275%22%20r%3D%222%22%20fill%3D%22%232a3a24%22%2F%3E%3C%2Fsvg%3E">
<style>
:root{ --paper:#F2EBD8; --ink:#2A2620; --gold:#D9A544; --goldD:#8a6a24; --bg:#1D241A; --panel:#28301F;
  --line:#4A5740; --cream:#EDE4CC; --board:#D9C89E; --pol:#FDFBF4;
  --cchip:clamp(76px, 21vmin, 150px); --tchip:clamp(108px, 31vmin, 230px); }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
/* the iOS shell turns the OUTER webview scroll OFF — every room scrolls its own
   inner panel. Body is a fixed frame; exactly one room is on stage at a time. */
body{margin:0; background:var(--bg); color:var(--cream); font-family:"Trebuchet MS",Verdana,sans-serif;
  -webkit-user-select:none; user-select:none; height:100dvh; overflow:hidden;}
.disp{font-family:Impact,"Arial Black",sans-serif; letter-spacing:1px; font-weight:normal;}
button{font-family:inherit; cursor:pointer;}
.room{position:fixed; inset:0; display:none; animation:roomin .18s ease;}
@keyframes roomin{from{opacity:.35;}}
body.view-shelf #roomShelf{display:flex;}
body.view-toy #roomToy, body.view-tray #roomToy{display:flex;}

/* ============ ROOM 1 — THE SCRAPBOOK SHELF ============ */
#roomShelf{flex-direction:column; background:var(--board);}
#shelfScroll{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 44px;}
#shelfTitle{width:max-content; max-width:100%; margin:0 auto 20px; transform:rotate(-1.5deg); background:var(--pol);
  border:1px solid #C9B68C; box-shadow:0 2px 6px #0004; padding:4px 22px;
  font-size:clamp(18px,4.6vw,28px); color:var(--goldD); letter-spacing:3px; white-space:nowrap;}
#shelfBoard{max-width:940px; margin:0 auto; display:grid; grid-template-columns:repeat(2,1fr);
  gap:24px 18px; position:relative;}
@media (min-width:700px){ #shelfBoard{grid-template-columns:repeat(3,1fr);} }
@media (min-width:1050px){ #shelfBoard{grid-template-columns:repeat(4,1fr);} }
/* pasted-in photo cards — tilt and stagger are DETERMINISTIC by position, so the
   book always looks the same; the paste-in stagger plays once per boot */
.pcard{background:var(--pol); border:1px solid #C9B68C; box-shadow:0 3px 10px #0007;
  padding:12px 9px 3px; text-align:center; position:relative; cursor:pointer; min-width:0;
  transform:rotate(var(--tilt,0deg)) translateY(var(--dy,0px));
  animation:pastein .3s ease backwards;}
.pcard:active{transform:rotate(var(--tilt,0deg)) translateY(var(--dy,0px)) scale(.96);}
#shelfBoard.settled .pcard{animation:none;}
@keyframes pastein{from{opacity:0; transform:rotate(var(--tilt,0deg)) translateY(var(--dy,0px)) scale(.65);}}
.pcard:nth-child(6n+1){--tilt:-2.6deg;}
.pcard:nth-child(6n+2){--tilt:2.2deg; --dy:9px;}
.pcard:nth-child(6n+3){--tilt:1.6deg; --dy:-3px;}
.pcard:nth-child(6n+4){--tilt:-2.1deg; --dy:7px;}
.pcard:nth-child(6n+5){--tilt:2.8deg;}
.pcard:nth-child(6n){--tilt:-1.4deg; --dy:5px;}
.pcard::before{content:""; position:absolute; top:-8px; left:50%; width:46px; height:15px;
  transform:translateX(-50%) rotate(-5deg); background:rgba(217,165,68,.5);
  border-left:1px dashed #FFF8; border-right:1px dashed #FFF8;}
.pcard:nth-child(even)::before{transform:translateX(-50%) rotate(4deg);}
.pcard svg{display:block; width:100%; height:clamp(110px,24vmin,190px); pointer-events:none;}
.pcard .pn{font-family:Impact,"Arial Black",sans-serif; letter-spacing:1.5px; color:#4A4432;
  font-size:clamp(13px,3.4vw,19px); padding:3px 0 7px;}
.pcard.desk{background:#FBF7EA; border-style:dashed;}
.pcard.desk::before{display:none;}
.pcard.desk .clip{position:absolute; top:-11px; left:9px; width:26px; height:32px; transform:rotate(8deg);}
.pcard.desk .clip svg{width:100%; height:100%;}
.washi{grid-column:1/-1; justify-self:center; transform:rotate(-1.2deg); background:rgba(217,165,68,.45);
  border-left:2px dashed #FFF8; border-right:2px dashed #FFF8; padding:4px 28px;
  font-size:clamp(13px,3vw,17px); letter-spacing:4px; color:#5b4a20;}
.doodle{position:absolute; pointer-events:none;}
.doodle svg{width:100%; height:100%; display:block;}

/* ============ ROOM 2 & 3 — THE TOY and THE TRAY ============ */
#roomToy{flex-direction:column; background:var(--bg);}
#toyWrap{flex:1; min-height:0; display:flex; flex-direction:column; position:relative;}
#gbar{position:absolute; top:calc(env(safe-area-inset-top,0px) + 8px); left:10px; right:10px;
  display:flex; justify-content:space-between; align-items:flex-start; z-index:5; pointer-events:none;}
#gbar .grp{display:flex; gap:10px;}
.gbtn{width:64px; height:64px; border-radius:16px; background:var(--panel); border:2px solid var(--line);
  display:flex; align-items:center; justify-content:center; pointer-events:auto; padding:0;}
.gbtn:active{transform:scale(.93);}
.gbtn svg{width:38px; height:38px;}
#toyName{position:absolute; top:calc(env(safe-area-inset-top,0px) + 14px); left:50%; transform:translateX(-50%);
  font-size:15px; letter-spacing:2px; color:var(--gold); pointer-events:none; z-index:4;
  text-shadow:1px 1px 0 #14180C;}
#toyStage{flex:1; min-height:0; display:flex; align-items:center; justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 36px) 12px 6px; position:relative;}
#heroSvg{width:100%; height:100%; touch-action:manipulation;}
#heroSvg .landpart{filter:drop-shadow(0 0 2.5px #D9A544) drop-shadow(0 0 6px rgba(217,165,68,0.9));}
#landed{display:none; position:absolute; top:calc(env(safe-area-inset-top,0px) + 78px); left:50%;
  transform:translateX(-50%); background:var(--gold); color:#2A2010; border-radius:12px; padding:7px 16px;
  font-size:16px; font-weight:bold; letter-spacing:.5px; white-space:nowrap; box-shadow:0 3px 10px #0008;
  pointer-events:none; z-index:6; align-items:center; gap:8px;}
#landed.on{display:flex; animation:landpop .3s ease;}
#landed svg{width:22px; height:22px;}
@keyframes landpop{from{transform:translateX(-50%) scale(.55); opacity:0;}}

/* the dock: the parts counter, or ONE open tray — never both */
#dock{flex:none; background:var(--panel); border-top:2px solid var(--line);
  padding:9px 9px calc(env(safe-area-inset-bottom,0px) + 9px); display:flex; flex-direction:column; min-height:0;}
#counterRow{display:flex; gap:10px; overflow-x:auto; -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain; scrollbar-width:none; align-items:stretch;}
#counterRow::-webkit-scrollbar{display:none;}
.cchip{flex:none; width:var(--cchip); height:var(--cchip); background:var(--paper);
  border:3px solid #B8A888; border-radius:18px; display:flex; align-items:center; justify-content:center;
  padding:6px; cursor:pointer;}
.cchip:active{transform:scale(.94);}
.cchip svg{width:100%; height:100%; pointer-events:none;}
.cchip .dye{width:72%; aspect-ratio:1; border-radius:50%; border:4px solid #0006;}
.cchip.ghost svg{opacity:.35;}
#tray{display:none; flex-direction:column; min-height:0;}
body.view-tray #counterRow{display:none;}
body.view-tray #tray{display:flex;}
#trayHead{display:flex; align-items:center; gap:10px; padding:0 4px 7px;}
#trayName{flex:1; font-family:Impact,"Arial Black",sans-serif; font-weight:normal;
  font-size:clamp(15px,4vmin,21px); letter-spacing:2px; color:var(--gold);}
#trayClose{width:72px; height:44px; border-radius:12px; background:#3A4530; border:2px solid var(--line);
  display:flex; align-items:center; justify-content:center; padding:0;}
#trayClose svg{width:30px; height:30px;}
#trayChips{display:flex; gap:12px; overflow-x:auto; -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain; scrollbar-width:none; align-items:stretch;}
#trayChips::-webkit-scrollbar{display:none;}
.chip{flex:none; width:var(--tchip); background:var(--paper); border:4px solid transparent;
  border-radius:20px; padding:8px 8px 5px; cursor:pointer; text-align:center; position:relative;
  display:flex; flex-direction:column;}
.chip:active{transform:scale(.96);}
.chip svg{width:100%; height:calc(var(--tchip) - 46px); pointer-events:none;}
.chip .cn{font-weight:bold; font-size:clamp(12px,3vmin,16px); color:#4A4432; letter-spacing:.5px;
  text-transform:uppercase; padding-top:4px;}
.chip.on{border-color:var(--gold); box-shadow:0 0 0 2px var(--gold);}
.chip .dye{width:calc(var(--tchip) - 62px); aspect-ratio:1; border-radius:50%; margin:2px auto; border:4px solid #0006;}
.chip .del,.chip .rst{position:absolute; top:-9px; width:34px; height:34px; border-radius:50%;
  background:#fff; border:2px solid #8A2F26; color:#8A2F26; font-size:17px; font-weight:bold;
  display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px #0006; z-index:2;}
.chip .del{right:-9px;}
.chip .rst{left:-9px;}
.chip.pencil{background:#E8DFC6; border:4px dashed #B8A888;}
.chip.landchip{border-color:var(--gold); animation:chipland 1.4s ease;}
@keyframes chipland{0%{box-shadow:0 0 0 2px var(--gold), 0 0 24px 6px rgba(217,165,68,.85);}
  100%{box-shadow:0 0 0 2px var(--gold), 0 0 0 0 rgba(217,165,68,0);}}

/* a phone on its side / any wide screen: the dock stands at the toy's right hand */
@media (orientation:landscape){
  #roomToy{flex-direction:row;}
  #dock{width:clamp(200px, 36vw, 380px); border-top:none; border-left:2px solid var(--line);
    padding:10px calc(env(safe-area-inset-right,0px) + 10px) calc(env(safe-area-inset-bottom,0px) + 10px) 10px;}
  #counterRow{flex-direction:column; overflow:hidden auto; align-items:center; flex:1; min-height:0;}
  #trayChips{flex-direction:column; overflow:hidden auto; align-items:center; flex:1; min-height:0;}
  #toyStage{padding:calc(env(safe-area-inset-top,0px) + 32px) 8px 8px calc(env(safe-area-inset-left,0px) + 8px);}
}
/* the game's own law: the dogs' pat tongue (.dogTng) sleeps until the pat — hidden here too, carried in every export */
.dogTng{opacity:0;}
</style>
</head>
<body>
<div class="room" id="roomShelf">
  <div id="shelfScroll">
    <div id="shelfTitle" class="disp">THE SHAPE STORE</div>
    <div id="shelfBoard"></div>
  </div>
</div>
<div class="room" id="roomToy">
  <div id="toyWrap">
    <div id="gbar">
      <button class="gbtn" id="shelfBtn" title="THE SHELF"></button>
      <span class="grp">
        <button class="gbtn" id="brushBtn" title="DRAW ON ME"></button>
        <button class="gbtn" id="deskBtn" title="THE DRAWING DESK"></button>
      </span>
    </div>
    <div id="toyName" class="disp"></div>
    <div id="toyStage">
      <svg id="heroSvg" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="landed"></div>
    </div>
  </div>
  <div id="dock">
    <div id="counterRow"></div>
    <div id="tray">
      <div id="trayHead">
        <div id="trayName"></div>
        <button id="trayClose" title="BACK TO THE TOY"></button>
      </div>
      <div id="trayChips"></div>
    </div>
  </div>
</div>
<script>
'use strict';
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);

/* ================= SHARED FACE KITS (glyph frame: (0,0) center, eyes at ±14) ================= */
const EYES=[
 {n:'buttons', s:'<ellipse cx="-14" cy="0" rx="5" ry="6" fill="PUP"/><ellipse cx="14" cy="0" rx="5" ry="6" fill="PUP"/>'},
 {n:'sparkle', s:'<circle cx="-14" cy="0" r="6.6" fill="#fff" stroke="INK" stroke-width="1.6"/><circle cx="-15.5" cy="0.8" r="3.2" fill="#1a1208"/><circle cx="-13" cy="-1.8" r="1.2" fill="#fff"/><circle cx="14" cy="0" r="6.6" fill="#fff" stroke="INK" stroke-width="1.6"/><circle cx="12.5" cy="0.8" r="3.2" fill="#1a1208"/><circle cx="15" cy="-1.8" r="1.2" fill="#fff"/>'},
 {n:'happy', s:'<path d="M-20 2 Q-14 -6 -8 2 M8 2 Q14 -6 20 2" stroke="PUP" stroke-width="4" fill="none" stroke-linecap="round"/>'},
 {n:'dizzy', s:'<path d="M-18 -4 L-10 4 M-10 -4 L-18 4 M10 -4 L18 4 M18 -4 L10 4" stroke="PUP" stroke-width="3.6" stroke-linecap="round"/>'},
 {n:'stars', s:'<path d="M-14 -6 V6 M-20 0 H-8 M14 -6 V6 M8 0 H20" stroke="PUP" stroke-width="3.4" stroke-linecap="round"/>'},
 {n:'sleepy', s:'<path d="M-19 -2 Q-14 3 -9 -2 M9 -2 Q14 3 19 -2" stroke="PUP" stroke-width="3.6" fill="none" stroke-linecap="round"/><path d="M-13 4 l3 2 M11 4 l3 2" stroke="PUP" stroke-width="2" stroke-linecap="round"/>'},
 {n:'swirl', s:'<path d="M-10 0 A4.6 4.6 0 1 1 -14 -4.6 A2.6 2.6 0 1 0 -11.5 -1" stroke="PUP" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M18 0 A4.6 4.6 0 1 1 14 -4.6 A2.6 2.6 0 1 0 16.5 -1" stroke="PUP" stroke-width="2.6" fill="none" stroke-linecap="round"/>'},
];
const BROWS=[
 {n:'fierce', s:'<path d="M-22 -4 L-8 2 M22 -4 L8 2" stroke="INK" stroke-width="4" stroke-linecap="round"/>'},
 {n:'calm', s:'<path d="M-21 0 Q-14 -4 -7 -1 M7 -1 Q14 -4 21 0" stroke="INK" stroke-width="3.6" fill="none" stroke-linecap="round"/>'},
 {n:'raised', s:'<path d="M-20 2 Q-14 -7 -8 -1 M8 -1 Q14 -7 20 2" stroke="INK" stroke-width="3.6" fill="none" stroke-linecap="round"/>'},
 {n:'flat', s:'<path d="M-20 0 H-8 M8 0 H20" stroke="INK" stroke-width="4" stroke-linecap="round"/>'},
 {n:'worried', s:'<path d="M-20 2 L-8 -3 M20 2 L8 -3" stroke="INK" stroke-width="4" stroke-linecap="round"/>'},
 {n:'one up', s:'<path d="M-20 -3 Q-13 -8 -7 -4 M8 1 H20" stroke="INK" stroke-width="3.8" fill="none" stroke-linecap="round"/>'},
];
const MOUTHS=[
 {n:'smirk', s:'<path d="M-12 0 Q0 7 12 -2 L12 -2 Q14 -3 15 -6" stroke="PUP" stroke-width="3.6" fill="none" stroke-linecap="round"/>'},
 {n:'big grin', s:'<path d="M0 -3 C11 -3 14 3 12.5 8 C9.5 14 -9.5 14 -12.5 8 C-14 3 -11 -3 0 -3 z" fill="DKM" stroke="INK" stroke-width="3"/><path d="M-9 0 L-6 5 L-3 0 L0 5 L3 0 L6 5 L9 0" stroke="#fff" stroke-width="3.4" fill="none"/>'},
 {n:'laugh', s:'<path d="M-11 -2 Q0 0 11 -2 Q10 11 0 11 Q-10 11 -11 -2 z" fill="#7A2A22" stroke="INK" stroke-width="2.6" stroke-linejoin="round"/><path d="M-6 7.5 Q0 12 6 7.5 Q0 15 -6 7.5 z" fill="#E8863A"/>'},
 {n:'hmm', s:'<path d="M-9 2 H9" stroke="PUP" stroke-width="3.6" stroke-linecap="round"/>'},
 {n:'wavy', s:'<path d="M-12 2 Q-8 -2 -4 2 Q0 6 4 2 Q8 -2 12 2" stroke="PUP" stroke-width="3.4" fill="none" stroke-linecap="round"/>'},
 {n:'ooo', s:'<ellipse cx="0" cy="2" rx="4.6" ry="5.6" fill="DKM" stroke="INK" stroke-width="2.6"/>'},
 {n:'fang', s:'<path d="M-12 0 Q0 8 12 0" stroke="PUP" stroke-width="3.6" fill="none" stroke-linecap="round"/><path d="M6 2.6 l2.6 6 l3 -5.2" fill="#F5EFD8" stroke="#B8A888" stroke-width="1.4" stroke-linejoin="round"/>'},
 {n:'tongue', s:'<path d="M-12 -1 Q0 6 12 -1" stroke="PUP" stroke-width="3.6" fill="none" stroke-linecap="round"/><path d="M-1 3 Q-1 12 4 12 Q9 12 8 4.5 Q4 6.5 -1 3 z" fill="#E8863A" stroke="#B05E20" stroke-width="1.6" stroke-linejoin="round"/>'},
];
function kit(base, ink, pup, dkm){ return base.map(v=>({n:v.n, s:v.s.split('INK').join(ink).split('PUP').join(pup).split('DKM').join(dkm)})); }
function rewrap(list, t){ return list.map(v=>({n:v.n, s:'<g transform="'+t+'">'+v.s+'</g>'})); }

/* ================= THE GVT ARMY MOLD — lifted verbatim from the game ================= */
const AHEAD='<circle cx="0" cy="0" r="8" fill="currentColor"/><path d="M -11 0 a 11 11 0 0 1 22 0 z" fill="currentColor"/><rect x="-12.5" y="-2.5" width="25" height="4.5" rx="2.2" fill="currentColor"/>';
const ABASE='<ellipse cx="60" cy="129" rx="33" ry="7.5" fill="#000" opacity="0.28"/><ellipse cx="60" cy="126" rx="33" ry="7.5" fill="currentColor"/>';

(function(){

 const sail=(x1,x2,yt,yb)=>{
   const w=x2-x1, mx=(x1+x2)/2, arc=w*0.10, sw=w*0.13;
   return '<path d="M'+x1+' '+yt+' Q'+mx+' '+(yt-arc)+' '+x2+' '+yt

     +' Q'+mx+' '+(yb+w*0.30)+' '+(x1+w*0.04)+' '+yb
     +' Q'+(x1-sw)+' '+((yt+yb)/2)+' '+x1+' '+yt+' z" fill="#F2C24E" stroke="#B8862A" stroke-width="1.7"/>'
     +'<path d="M'+x1+' '+yt+' Q'+mx+' '+(yt-arc)+' '+x2+' '+yt

/* ================= MY DRAWINGS — every gallery save can walk up to the counter =================
   The shop's own serialization + v1 offset migration, lifted verbatim from index.html
   so a saved drawing's pieces read (and round-trip) exactly as the shop draws them. */
const r2=n=>Math.round(n*100)/100;
function userT(s){ const sx=(s.scale||1)*(s.flip?-1:1), sy=s.scale||1;
  return 'translate('+r2(s.x)+' '+r2(s.y)+') rotate('+r2(s.rot||0)+') scale('+r2(sx)+' '+r2(sy)+')'; }
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function rawStr(s){ const at={...s.attrs};
  let inner='<'+s.tag+' '+Object.keys(at).map(k=>k+'="'+esc(at[k])+'"').join(' ')+'/>';
  if(s.wrapT) inner='<g transform="'+esc(s.wrapT)+'">'+inner+'</g>';
  return '<g transform="translate('+r2(s.x||0)+' '+r2(s.y||0)+')">'+inner+'</g>'; }
function shapeStr(s){ const inner=s.t==='group'? s.kids.map(rawStr).join('') : rawStr({...s,x:0,y:0});
  return '<g transform="'+userT(s)+'">'+inner+'</g>'; }
function shapeMatrix(s){ const a=(s.rot||0)*Math.PI/180, cs=Math.cos(a), sn=Math.sin(a);
  const sx=(s.scale||1)*(s.flip?-1:1), sy=s.scale||1;
  return {a:cs*sx, b:sn*sx, c:-sn*sy, d:cs*sy, e:s.x, f:s.y}; }
function applyM(m,p){ return {x:m.a*p.x+m.c*p.y+m.e, y:m.b*p.x+m.d*p.y+m.f}; }
function migrateDoc(d){
  if(!d || (d.v||1)>=2) return d;
  for(const s of (d.shapes||[])) if(s.t!=='group'&&(s.x||s.y)){
    const p=applyM(shapeMatrix(s),{x:s.x||0,y:s.y||0});
    s.x=r2(p.x); s.y=r2(p.y);
  }
  d.v=2; return d;
}
function loadGal(){ try{ return JSON.parse(localStorage.getItem('ss.gallery')||'[]'); }catch(e){ return []; } }
/* a saved drawing becomes a character: each visible top-level piece is a slot
   with ONE design ("as drawn") — tap it, edit it, it lands BACK IN THE SAVE */
function galChar(it){
  const doc=migrateDoc(JSON.parse(JSON.stringify(it.doc||{})));
  const wide=doc.board==='wide', bw=wide?1280:140, bh=wide?640:140;
  const slots=[], layers=[], seen={};
  (doc.shapes||[]).forEach((s,i)=>{
    if(s.hide) return;   // hidden layers stay out, same as exports
    const base=String(s.label||s.tag||'PIECE').toUpperCase();
    seen[base]=(seen[base]||0)+1;
    slots.push({id:'p'+i, galIdx:i, plabel:s.label||s.tag||'PIECE',
      label:esc(base+(seen[base]>1? ' '+seen[base] : '')),
      v:[{n:'as drawn', s:shapeStr(s), raw:true}]});
    layers.push({slot:'p'+i});
  });
  return {key:'gal:'+it.id, gal:it.id, galName:it.name, board:doc.board||'creature',
    name:it.name, ask:esc(it.name), vb:'0 0 '+bw+' '+bh, layers, slots};
}
const ALL=CHARS.concat(loadGal().map(galChar));

/* THE STORE REMEMBERS: wear rides ss.wear {charKey:{slotId:vi}} and the last
   character rides ss.lastChar — the KEY, never the index (gallery growth shifts
   indices). The return legs from the desk (below) still win over lastChar. */
let CUR=0, LANDED=null, CAME_HOME=false, wearWarned=false;
(function(){ try{ const k=localStorage.getItem('ss.lastChar'); if(k!=null){ const i=ALL.findIndex(c=>c.key===k); if(i>=0) CUR=i; } }catch(e){} })();
const PICKS=(function(){ try{ const w=JSON.parse(localStorage.getItem('ss.wear')||'{}'); if(w && typeof w==='object' && !Array.isArray(w)) return w; }catch(e){} return {}; })();
function saveWear(){
  try{ const w={}; for(const k in PICKS) if(k.slice(0,4)!=='gal:') w[k]=PICKS[k];   // drawings have no variants to wear
    localStorage.setItem('ss.wear', JSON.stringify(w));
  }catch(e){ if(!wearWarned){ wearWarned=true; alert('Storage is full.'); } }   // once — never an alert per tap
}
function saveLast(){ try{ localStorage.setItem('ss.lastChar', C().key); }catch(e){} }

function customs(){ try{ return JSON.parse(localStorage.getItem('ss.counterCustom')||'{}'); }catch(e){ return {}; } }
function saveCustoms(c){ try{ localStorage.setItem('ss.counterCustom',JSON.stringify(c)); }catch(e){ alert('Storage is full.'); } }
/* overrides: editing a part REPLACES its design in place — the toy comes back
   wearing what you drew, saved for good. The ✕ on the chip's top-left corner
   restores the original. Keyed {char:{slot:{variantIndex: svg}}}. */
function overs(){ try{ return JSON.parse(localStorage.getItem('ss.counterOver')||'{}'); }catch(e){ return {}; } }
function saveOvers(o){ try{ localStorage.setItem('ss.counterOver',JSON.stringify(o)); }catch(e){ alert('Storage is full.'); } }
function vlist(slot){
  const ov=(overs()[C().key]||{})[slot.id]||{};
  const stock=slot.v.map((v,i)=> (ov[i]!=null && !v.c)? {n:v.n, s:ov[i], raw:true, over:true, oi:i} : v);
  const cu=customs(); const mine=(cu[C().key]||{})[slot.id]||[];
  return stock.concat(mine.map(m=>({n:m.n, s:m.s, raw:true, custom:true})));
}
function resetOver(slotId, vi){
  if(!confirm('Put the original back?')) return;
  const ov=overs(); const m=(ov[C().key]||{})[slotId];
  if(m){ delete m[vi]; saveOvers(ov); }
  renderHero(); renderCounter(); if(TRAY) renderTray();
}
function picks(){ const c=C(); if(!PICKS[c.key]) PICKS[c.key]={}; const p=PICKS[c.key];
  c.slots.forEach(s=>{ const v=p[s.id]; if(typeof v!=='number' || !(v>=0)) p[s.id]=s.d||0; });   // merge saved wear over defaults; junk heals to the default (clamps at every read do the rest)
  return p; }
function curVar(slot){ const l=vlist(slot); return l[Math.min(picks()[slot.id]||0, l.length-1)]; }
/* slot frames — wrap = the seat (char coords → the part's own frame); pin = a
   named pivot group INSIDE the seat (the dogs' .dogHeadG / .dogwagG: two-level
   frames, never flattened, so the export keeps the game's pivots); pivot() = a
   pose transform about the seat's origin. Raw (returned) variants already live
   in char coords: no wrap, but a pose still turns them about the same point.
   neutral = the un-posed part (the edit hand-off rides to the shop un-posed). */
function slotSVG(slot, neutral){
  const v=curVar(slot); if(v.c) return '';
  const pv=(!neutral && slot.pivot)? slot.pivot() : '';
  if(slot.wrap && !v.raw){ const inner=slot.pin? '<g class="'+slot.pin+'">'+v.s+'</g>' : v.s; return '<g transform="'+slot.wrap+(pv?' '+pv:'')+'">'+inner+'</g>'; }
  if(slot.wrap && v.raw && pv) return '<g transform="'+slot.wrap+' '+pv+' '+invT(slot.wrap)+'">'+v.s+'</g>';
  return v.s;
}
function invT(t){ const m=/translate\(\s*(-?[\d.]+)[ ,]+(-?[\d.]+)\s*\)/.exec(t); return m? 'translate('+(-m[1])+','+(-m[2])+')' : ''; }
/* the dye rack: one hex on PLASTIC / currentColor (the army plastics) — or a
   whole palette (the dogs' COATS: coat on currentColor + shade/cream/ear tokens) */
function dyeVar(){ const c=C(); const p=c.slots.find(s=>s.id==='plastic'); return p? curVar(p) : null; }
function dyeOf(){ const v=dyeVar(); return v? v.c : null; }
function dyeStr(s){ const v=dyeVar(); if(!v||!v.c) return s; s=s.split('PLASTIC').join(v.c); if(v.map) for(const k in v.map) s=s.split(k).join(v.map[k]); return s; }
function heroStr(){
  const c=C();
  let s=c.layers.map(l=> typeof l==='string'? l : typeof l==='function'? l() : '<g data-slot="'+l.slot+'">'+slotSVG(c.slots.find(x=>x.id===l.slot))+'</g>').join('');
  return dyeStr(s);
}
function renderHero(){
  const c=C();
  $('heroSvg').setAttribute('viewBox', c.vb);
  $('heroSvg').innerHTML = heroStr();
  $('toyName').textContent = deEmoji(c.name);
  applyLandGlow();   // a part fresh home from the desk keeps its glow through rebuilds
}
function chipSVG(slot, v){
  if(v.c) return '<div class="dye" style="background:'+(v.puck||v.c)+'"></div>';   // a palette puck may wear its whole coat
  const vb = v.raw? (slot.cropC||C().vb) : slot.chipVB;
  let inner= typeof v.chip==='function'? v.chip() : (v.chip||v.s);   // a chip may show more than it wears (the dogs' POSES preview the whole dog)
  if(inner && /currentColor|PLASTIC|DOG(SHADE|CREAM|EAR)\b|BEAR(CREAM|SLEEVE)\b|BK(COAT|DEEP|LIT|SHN)\b/.test(inner)){ const dye=dyeOf()||'#7FA35C'; inner='<g style="color:'+dye+'">'+dyeStr(inner.split('PLASTIC').join(dye))+'</g>'; }   // the dogs' coat tokens, the battery bears' fur/sleeve/coat tokens (SS-BEARS-01)
  if(!inner){ const b=vb.split(' ').map(Number);
    inner='<text x="'+(b[0]+b[2]/2)+'" y="'+(b[1]+b[3]/2+3)+'" text-anchor="middle" font-size="'+Math.round(b[3]/3)+'" fill="#B8A888" font-family="Trebuchet MS">·</text>'; }
  return '<svg xmlns="'+NS+'" viewBox="'+vb+'">'+inner+'</svg>';
}
/* ============ THE DOCK: the parts counter, or ONE open tray ============ */
function cchipHTML(s){
  const has=x=>!!(x && ((x.s||'').length || x.c || x.chip));
  const v=curVar(s);
  let inner, ghost=false;
  if(has(v)) inner=chipSVG(s,v);
  else{ const g=vlist(s).find(has);   /* the ghost rule: a blank-worn slot shows its first design faded */
    if(g){ inner=chipSVG(s,g); ghost=true; } else inner=chipSVG(s,v); }
  return '<div class="cchip'+(ghost?' ghost':'')+'" data-slot="'+s.id+'">'+inner+'</div>';
}
function renderCounter(){
  $('counterRow').innerHTML = C().slots.map(cchipHTML).join('')
    + (C().gal? '' : '<div class="cchip" data-dice="1">'+ICONS.dice+'</div>');   // a drawing has nothing to shuffle
}
function refreshCounterChip(slotId){
  const s=C().slots.find(x=>x.id===slotId); if(!s) return;
  const el=$('counterRow').querySelector('.cchip[data-slot="'+slotId+'"]');
  if(el) el.outerHTML=cchipHTML(s);
}
function editableSlot(s){ return s.edit!==false && vlist(s).some(v=>!v.c); }   // dye racks have nothing to draw; pose racks never enter the desk
function renderTray(){
  const c=C(), s=c.slots.find(x=>x.id===TRAY); if(!s) return;
  $('trayName').textContent = deEmoji(s.label)+(s.note? ' · '+deEmoji(s.note) : '');
  const l=vlist(s), worn=Math.min(picks()[s.id]||0, l.length-1);
  $('trayChips').innerHTML = l.map((v,i)=>
    '<div class="chip'+(i===worn?' on':'')+'" data-i="'+i+'">'
    +(v.custom? '<span class="del" data-del="'+(i-s.v.length)+'">✕</span>':'')
    +(v.over? '<span class="rst" title="restore the original" data-rst="'+v.oi+'">✕</span>':'')
    +chipSVG(s,v)+'<div class="cn">'+deEmoji(v.n)+'</div></div>').join('')
  + (editableSlot(s)? '<div class="chip pencil" data-pencil="1">'+ICONS.pencil+'<div class="cn">DRAW MY OWN</div></div>' : '');
}
function ringTray(i){
  document.querySelectorAll('#trayChips .chip').forEach(ch=>ch.classList.toggle('on', ch.getAttribute('data-i')===String(i)));
}
function pick(slotId, i){
  const c=C(), slot=c.slots.find(s=>s.id===slotId), l=vlist(slot);
  const worn=Math.min(picks()[slotId]||0, l.length-1);
  if(!c.gal && worn===i && l[i] && !l[i].c && slot.edit!==false){ editPart(slotId); return; }   /* tap the worn design again = the fast door to the desk */
  if(c.gal){ ringTray(i); return; }   /* a drawing's one design is always worn — the PENCIL chip is the door */
  picks()[slotId]=i; saveWear();
  renderHero();
  if(slotId==='plastic' || c.refresh){ renderCounter(); if(TRAY) renderTray(); }   // dye retints every chip; a preview rack (the dogs' POSES) follows every pick
  else { refreshCounterChip(slotId); if(TRAY===slotId) ringTray(i); }
}
function delCustom(slotId, mi){
  if(!confirm('Take this part off your shelf?')) return;
  const cu=customs(); const arr=(cu[C().key]||{})[slotId]||[];
  arr.splice(mi,1); saveCustoms(cu);
  const slot=C().slots.find(s=>s.id===slotId);
  picks()[slotId]=Math.min(picks()[slotId]||0, vlist(slot).length-1); saveWear();
  renderHero(); renderCounter(); if(TRAY) renderTray();
}
function mixUp(){
  const c=C(), p=picks();
  c.slots.forEach(s=>{ p[s.id]=Math.floor(Math.random()*vlist(s).length); });
  saveWear();
  renderHero(); renderCounter(); if(TRAY) renderTray();
}

/* the NO EMOJI law: names and labels render through this — pictures carry meaning */
function deEmoji(s){ return String(s).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu,'').replace(/^\s+|\s+$/g,''); }
/* THE ICON SHOP: every icon drawn in the store's molded-plastic idiom — never emoji */
const ICONS={
 dice:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect x="5" y="5" width="30" height="30" rx="7" fill="#F2EBD8" stroke="#B8A888" stroke-width="3"/><circle cx="13.5" cy="13.5" r="3" fill="#2A2620"/><circle cx="26.5" cy="13.5" r="3" fill="#2A2620"/><circle cx="20" cy="20" r="3" fill="#2A2620"/><circle cx="13.5" cy="26.5" r="3" fill="#2A2620"/><circle cx="26.5" cy="26.5" r="3" fill="#2A2620"/></svg>',
 pencil:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><g transform="rotate(45 20 20)"><rect x="14.5" y="3" width="11" height="24" rx="2" fill="#D9A544" stroke="#8a6a24" stroke-width="2"/><rect x="14.5" y="3" width="11" height="5.5" rx="2" fill="#C0473A" stroke="#8A2F26" stroke-width="1.4"/><polygon points="14.5,27 25.5,27 20,36.5" fill="#EDD9B0" stroke="#8a6a24" stroke-width="2" stroke-linejoin="round"/><circle cx="20" cy="34" r="2" fill="#2A2620"/></g></svg>',
 brush:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><g transform="rotate(45 20 20)"><rect x="17" y="2.5" width="6" height="14" rx="2.5" fill="#8A6238" stroke="#5b3a22" stroke-width="1.6"/><rect x="15.8" y="16" width="8.4" height="5" rx="1.5" fill="#B8C4D0" stroke="#6B757D" stroke-width="1.4"/><path d="M16 21 Q20 20 24 21 L23 30 Q20 34 17 30 z" fill="#D9A544" stroke="#8a6a24" stroke-width="1.6" stroke-linejoin="round"/></g></svg>',
 desk:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect x="5" y="7" width="30" height="26" rx="4" fill="#F2EBD8" stroke="#B8A888" stroke-width="2.6"/><path d="M12 25 L23.5 13.5 L27.5 17.5 L16 29 L11 30 z" fill="#D9A544" stroke="#8a6a24" stroke-width="1.8" stroke-linejoin="round"/></svg>',
 shelf:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect x="3" y="16.5" width="34" height="4" rx="2" fill="#8A6238" stroke="#5b3a22" stroke-width="1.2"/><rect x="3" y="32" width="34" height="4" rx="2" fill="#8A6238" stroke="#5b3a22" stroke-width="1.2"/><circle cx="11.5" cy="10.5" r="5.5" fill="#C0473A" stroke="#8A2F26" stroke-width="1.6"/><rect x="21.5" y="6" width="10.5" height="10.5" rx="2" fill="#4E8C4A" stroke="#2f5730" stroke-width="1.6"/><polygon points="13,31.5 19.5,22 26,31.5" fill="#3FA0C8" stroke="#2A6E90" stroke-width="1.6" stroke-linejoin="round"/></svg>',
 spark:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><path d="M20 3.5 L23.6 16.4 L36.5 20 L23.6 23.6 L20 36.5 L16.4 23.6 L3.5 20 L16.4 16.4 z" fill="#D9A544" stroke="#8a6a24" stroke-width="1.6" stroke-linejoin="round"/><circle cx="31" cy="8.5" r="2.2" fill="#D9A544"/><circle cx="8" cy="31" r="1.7" fill="#D9A544"/></svg>',
 lip:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><path d="M10 15.5 L20 25.5 L30 15.5" fill="none" stroke="#D9A544" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
 clip:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><path d="M14 32 L14 12 A6 6 0 0 1 26 12 L26 27 A4 4 0 0 1 18 27 L18 15" fill="none" stroke="#6B757D" stroke-width="3.4" stroke-linecap="round"/></svg>',
 scrib:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 24"><path d="M4 16 Q12 4 20 14 Q28 24 36 12 Q44 2 56 10" fill="none" stroke="#8a6a24" stroke-width="3" stroke-linecap="round" opacity=".55"/></svg>'
};
/* ---- 🖌 DRAW ON ME: the whole dressed toy hops onto your paper as ONE
   grouped shape — your drawing stays, the toy joins it, and the shop's own
   double-tap / TAKE APART opens him piece by piece. ---- */
function drawOnToy(){
  const c=C();
  let svg=heroStr();
  const dye=dyeOf(); if(dye) svg=svg.split('currentColor').join(dye);
  try{
    localStorage.setItem('ss.place', JSON.stringify({svg, label:c.name, vb:c.vb, pins:!!c.pins}));   // pins: keep the game's pivot classes through the shop
    location.href='index.html?place=1';
  }catch(e){ alert('Storage is full.'); }
}
/* ---- 🛠 the edit loop: this part rides to the shop, comes back a chip ---- */
function editPart(slotId){
  const c=C(), slot=c.slots.find(s=>s.id===slotId);
  if(c.gal){   /* a piece of a SAVED DRAWING — the shop edits it and puts it
                  back INSIDE the save itself (index.html does the surgery) */
    try{
      localStorage.setItem('ss.edit', JSON.stringify({gal:c.gal, idx:slot.galIdx, plabel:slot.plabel,
        label:c.galName+' — '+slot.plabel, svg:slot.v[0].s, vb:c.vb, board:c.board}));
      location.href='index.html?edit=1';
    }catch(e){ alert('Storage is full.'); }
    return;
  }
  if(slot.edit===false) return;   // a pose rack: nothing to draw — the chips are the choice (no pencil chip is ever rendered for it)
  let svg=slotSVG(slot, true);   // the un-posed part
  const dye=dyeOf(); if(dye) svg=dyeStr(svg).split('currentColor').join(dye);
  const vi=Math.min(picks()[slotId]||0, vlist(slot).length-1);   // WHICH design is being redrawn
  let vb=c.vb;
  if(c.seat){   // a small mold (the dogs live in the game's ~40-unit frame) rides to the paper scaled up on its seat; the return leg undoes it
    const st=c.seat(slot); svg='<g transform="translate('+st.x+','+st.y+') scale('+st.k+')">'+svg+'</g>'; vb='0 0 140 140';
  }
  try{
    localStorage.setItem('ss.edit', JSON.stringify({char:c.key, slot:slotId, vi, label:c.name+' '+slot.label, svg, vb, pins:!!c.pins}));
    location.href='index.html?edit=1';
  }catch(e){ alert('Storage is full.'); }
}
(function(){  /* a part came home from the shop — it BECOMES the part (saved),
                 and the chip's top-left ✕ can always restore the original */
  let out=null; try{ out=JSON.parse(localStorage.getItem('ss.editOut')||'null'); }catch(e){}
  if(!out) return;
  localStorage.removeItem('ss.editOut');
  const ci=CHARS.findIndex(x=>x.key===out.char); if(ci<0||!out.svg) return;
  CUR=ci;
  const slot=CHARS[ci].slots.find(s=>s.id===out.slot); if(!slot) return;
  if(CHARS[ci].seat){ const st=CHARS[ci].seat(slot); out.svg='<g transform="scale('+st.ik+') translate('+(-st.x)+','+(-st.y)+')">'+out.svg+'</g>'; }   // off the paper seat, back into char coords
  const pushMyOwn=()=>{   // pre-vi edits (or a vanished custom) land as a MY OWN chip
    const cu=customs(); cu[out.char]=cu[out.char]||{}; cu[out.char][out.slot]=cu[out.char][out.slot]||[];
    cu[out.char][out.slot].push({n:'MY OWN'+(cu[out.char][out.slot].length? ' '+(cu[out.char][out.slot].length+1):''), s:out.svg});
    saveCustoms(cu);
    picks()[out.slot]=vlist(slot).length-1;
  };
  if(typeof out.vi==='number' && out.vi<slot.v.length){
    const ov=overs(); ov[out.char]=ov[out.char]||{}; ov[out.char][out.slot]=ov[out.char][out.slot]||{};
    ov[out.char][out.slot][out.vi]=out.svg; saveOvers(ov);
    picks()[out.slot]=out.vi;
  } else if(typeof out.vi==='number'){
    const cu=customs(); const m=((cu[out.char]||{})[out.slot]||[])[out.vi-slot.v.length];
    if(m){ m.s=out.svg; saveCustoms(cu); picks()[out.slot]=out.vi; }
    else pushMyOwn();
  } else pushMyOwn();
  saveWear();
  LANDED={slot:out.slot};   // THE HOMECOMING fires after the boot render
})();
(function(){   /* a drawing's piece came home — land on that drawing, wearing it */
  const gb=localStorage.getItem('ss.galBack'); if(gb==null) return;
  localStorage.removeItem('ss.galBack');
  let gid=gb, gidx=null;   // new legs carry JSON {gal,idx}; legacy legs a bare id string
  try{ const j=JSON.parse(gb); if(j && typeof j==='object' && j.gal!=null){ gid=j.gal; gidx=j.idx; } }catch(e){}
  const i=ALL.findIndex(c=>c.gal===gid);
  if(i>=0){ CUR=i; if(gidx!=null) LANDED={slot:'p'+gidx}; else CAME_HOME=true; }   // a spliced-OUT piece has no slot — land on the toy, no glow
})();
/* ============ ROOM 1 — THE SCRAPBOOK SHELF ============
   Every toy is a pasted-in photo of THEIR toy (the wear map dresses the portraits).
   The CUR-swap is the poseChip trick: heroStr reads the global. */
function portrait(i){
  const k=CUR; CUR=i; let s='';
  try{ s='<svg xmlns="'+NS+'" viewBox="'+C().vb+'">'+heroStr()+'</svg>'; }catch(e){}
  CUR=k; return s;
}
function deskCard(){   /* ON MY DESK: a loose sketch paperclipped into the book — a DOOR,
                          never a character (the shop's gal splice knows nothing of it).
                          Mid-edit the desk holds a lone part; thumb the PARKED toy instead. */
  try{
    const parked=localStorage.getItem('ss.parked');
    const raw=parked!=null? parked : localStorage.getItem('ss.cur');
    if(!raw) return '';
    const d0=JSON.parse(raw); if(!d0 || !d0.shapes) return '';
    const doc=migrateDoc(d0);
    const vis=(doc.shapes||[]).filter(s=>!s.hide); if(!vis.length) return '';
    const wide=doc.board==='wide';
    return '<div class="pcard desk" data-desk="1"><span class="clip">'+ICONS.clip+'</span>'
      +'<svg xmlns="'+NS+'" viewBox="0 0 '+(wide?1280:140)+' '+(wide?640:140)+'">'+vis.map(s=>shapeStr(s)).join('')+'</svg>'
      +'<div class="pn">ON MY DESK</div></div>';
  }catch(e){ return ''; }
}
function buildShelf(){
  let h='', washi=false, shelfTag=null;
  ALL.forEach((c,i)=>{
    if(c.gal && !washi){ h+='<div class="washi disp">MY DRAWINGS</div>'; washi=true; }   // the divider = a strip of washi tape
    else if(c.shelf && c.shelf!==shelfTag){ h+='<div class="washi disp">'+esc(c.shelf)+'</div>'; shelfTag=c.shelf; }   // a named section of the cast (THE BATTERY's bears, SS-BEARS-01)
    h+='<div class="pcard" data-ci="'+i+'" style="animation-delay:'+Math.min(i*70,900)+'ms">'+portrait(i)
      +'<div class="pn">'+esc(deEmoji(c.name))+'</div></div>';
  });
  h+=deskCard();
  h+='<span class="doodle" style="right:-6px; top:-30px; width:30px; height:30px;">'+ICONS.spark+'</span>'
    +'<span class="doodle" style="left:-8px; bottom:-16px; width:22px; height:22px; opacity:.7;">'+ICONS.spark+'</span>'
    +'<span class="doodle" style="left:4%; top:-32px; width:64px; height:26px;">'+ICONS.scrib+'</span>';
  const b=$('shelfBoard'); b.innerHTML=h;
  b.classList.toggle('settled', shelfOpened);   // the paste-in stagger plays once per boot
  shelfOpened=true;
}
/* THE HOMECOMING: a part came back from the desk — land with its tray already
   open, the new design ringed and shimmering, the toy part aglow. Filter + CSS
   only (steady-toy law): nothing moves, nothing is picked, the beat clears
   itself, and the next tap is an ordinary tap. */
let landSlot=null;
function applyLandGlow(){
  document.querySelectorAll('#heroSvg [data-slot]').forEach(g=>
    g.classList.toggle('landpart', landSlot!==null && g.getAttribute('data-slot')===landSlot));
}
function landOn(slotId){
  const c=C(), s=c.slots.find(x=>x.id===slotId); if(!s) return;
  openTray(slotId);
  landSlot=slotId; applyLandGlow();
  const worn=Math.min(picks()[slotId]||0, vlist(s).length-1);
  const chip=$('trayChips').querySelector('.chip[data-i="'+worn+'"]');
  if(chip){ chip.classList.add('landchip'); chip.scrollIntoView({behavior:'smooth', inline:'center', block:'center'}); }
  const tag=$('landed');
  tag.innerHTML=ICONS.spark+'<span>'+(c.gal? 'YOU CHANGED '+deEmoji(s.label) : 'HIS NEW '+deEmoji(s.label).replace(/^THE /,''))+'!</span>';
  tag.classList.add('on');
  setTimeout(()=>{ landSlot=null; applyLandGlow(); const lc=document.querySelector('.landchip'); if(lc) lc.classList.remove('landchip'); tag.classList.remove('on'); },1600);
}
/* ONE TAP: a part on the toy opens its tray; empty space tucks the tray away.
   r9 law holds — a tray open rebuilds the DOCK, never the svg under the finger. */
$('heroSvg').addEventListener('pointerdown',e=>{
  const g=e.target.closest && e.target.closest('[data-slot]');
  if(g) openTray(g.getAttribute('data-slot'));
  else if(ROOM==='tray') closeTray();
});
$('toyStage').addEventListener('pointerdown',e=>{ if(e.target===$('toyStage') && ROOM==='tray') closeTray(); });
$('counterRow').addEventListener('click',e=>{
  const ch=e.target.closest('.cchip'); if(!ch) return;
  if(ch.hasAttribute('data-dice')) mixUp(); else openTray(ch.getAttribute('data-slot'));
});
$('trayChips').addEventListener('click',e=>{
  const del=e.target.closest('.del'); if(del){ delCustom(TRAY, +del.getAttribute('data-del')); return; }
  const rst=e.target.closest('.rst'); if(rst){ resetOver(TRAY, +rst.getAttribute('data-rst')); return; }
  const ch=e.target.closest('.chip'); if(!ch) return;
  if(ch.hasAttribute('data-pencil')){ editPart(TRAY); return; }
  pick(TRAY, +ch.getAttribute('data-i'));
});
$('trayClose').onclick=closeTray;
$('shelfBoard').addEventListener('click',e=>{
  const c=e.target.closest('.pcard'); if(!c) return;
  if(c.hasAttribute('data-desk')){ location.href='index.html?draw=1'; return; }
  setChar(+c.getAttribute('data-ci'));
});
$('shelfBtn').innerHTML=ICONS.shelf; $('brushBtn').innerHTML=ICONS.brush;
$('deskBtn').innerHTML=ICONS.desk;  $('trayClose').innerHTML=ICONS.lip;
$('shelfBtn').onclick=openShelf;
$('brushBtn').onclick=drawOnToy;
$('deskBtn').onclick=function(){ location.href='index.html?draw=1'; };
/* the store opens: a homecoming lands on the toy with its tray aglow; a known kid
   lands on their last character; the very first visit opens the scrapbook */
renderHero(); renderCounter();
if(LANDED){ const l=LANDED; LANDED=null; setRoom('toy'); saveLast(); requestAnimationFrame(()=>landOn(l.slot)); }   // a return leg moved CUR — remember it
else if(CAME_HOME){ setRoom('toy'); saveLast(); }
else if(localStorage.getItem('ss.lastChar')!=null){ setRoom('toy'); }
else openShelf();   // the very first visit: the scrapbook, and no lastChar until they CHOOSE
</script>
