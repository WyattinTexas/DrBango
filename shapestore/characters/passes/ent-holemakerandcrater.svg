<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 190">
<!-- A HOLE'S BIRTH in three beats (CARD-ICN-P1 part 1): the heavy icicle's shadow (2.6 s), the strike, the crater that is a yeti hole with its eyes. The plate's own grammar (rugPlateCaves: the ice #EEF3F8, the hole #03070A 40x24 with a pale lip, the ice-glow pool). -->
<defs><radialGradient id="pool" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#C4EAFF" stop-opacity=".85"/><stop offset=".45" stop-color="#AADCF8" stop-opacity=".42"/><stop offset="1" stop-color="#AADCF8" stop-opacity="0"/></radialGradient>
<radialGradient id="eye" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#DFF6FF"/><stop offset=".5" stop-color="#7FC4E8" stop-opacity=".9"/><stop offset="1" stop-color="#7FC4E8" stop-opacity="0"/></radialGradient>
<linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B141C"/><stop offset="1" stop-color="#0B141C" stop-opacity="0"/></linearGradient></defs>
<g font-family="-apple-system,Helvetica,Arial" font-weight="800" font-size="12" fill="#1F4256" letter-spacing=".06em">
<!-- beat 1: the shadow -->
<rect x="0" y="0" width="210" height="190" fill="#EEF3F8"/><rect x="0" y="0" width="210" height="70" fill="url(#dark)"/>
<ellipse cx="105" cy="128" rx="34" ry="15" fill="#06101A" opacity=".5"/>
<path d="M90 0 L120 0 L105 78 Z" fill="#DCEBF7" stroke="#8FB2C8" stroke-width="2"/><path d="M98 6 L104 60" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/><path d="M104 10 L106 70" stroke="#6E92AA" stroke-width="1.4" opacity=".7"/>
<text x="105" y="170" text-anchor="middle">1 · THE SHADOW · 2.6 s</text>
<!-- beat 2: the strike -->
<rect x="225" y="0" width="210" height="190" fill="#EEF3F8"/><rect x="225" y="0" width="210" height="70" fill="url(#dark)"/>
<g stroke="#DDF1FC" stroke-width="3" stroke-linecap="round"><path d="M330 112 L300 86 M330 112 L372 92 M330 112 L352 150 M330 112 L296 140 M330 112 L338 70"/></g>
<g fill="#DCEBF7" stroke="#8FB2C8" stroke-width="1.5"><path d="M292 84 L302 80 L298 94 Z M368 90 L380 94 L370 102 Z M350 148 L360 150 L352 160 Z M292 140 L286 150 L300 146 Z"/></g>
<ellipse cx="330" cy="120" rx="30" ry="12" fill="#C9DCE9" opacity=".9"/><ellipse cx="330" cy="120" rx="18" ry="7" fill="#9FBFD6" opacity=".7"/>
<g fill="none" stroke="#9FBFD6" stroke-width="1.6"><path d="M300 126 L282 134 L270 150 M360 118 L384 124 L396 140 M318 130 L310 160 M344 128 L356 158"/></g>
<text x="330" y="170" text-anchor="middle">2 · THE STRIKE · the crack</text>
<!-- beat 3: the crater, a yeti hole -->
<rect x="450" y="0" width="210" height="190" fill="#EEF3F8"/><rect x="450" y="0" width="210" height="70" fill="url(#dark)"/>
<rect x="455" y="20" width="200" height="200" fill="url(#pool)"/>
<g fill="none" stroke="#9FBFD6" stroke-width="1.4" opacity=".8"><path d="M520 124 L498 134 L484 152 M590 116 L612 122 L626 138 M540 130 L532 162 M570 130 L584 160 M534 110 L520 96 M578 108 L594 92"/></g>
<ellipse cx="555" cy="122" rx="48" ry="29" fill="#2B3B48" opacity=".55"/>
<ellipse cx="555" cy="122" rx="40" ry="24" fill="#03070A"/>
<path d="M515 122 A40 24 0 0 0 595 122" fill="none" stroke="#BFE3F7" stroke-opacity=".55" stroke-width="3"/>
<ellipse cx="543" cy="121" rx="6" ry="4" fill="url(#eye)"/><ellipse cx="567" cy="121" rx="6" ry="4" fill="url(#eye)"/>
<ellipse cx="543" cy="121" rx="2.6" ry="2.1" fill="#DFF6FF"/><ellipse cx="567" cy="121" rx="2.6" ry="2.1" fill="#DFF6FF"/>
<text x="555" y="170" text-anchor="middle">3 · A HOLE · the eyes light</text>
</g>
</svg>
