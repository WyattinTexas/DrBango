<!-- THE PILGRIM (CARD-THP TURKEY HUNT: THE HOLD, design/turkey-hardpoint-1101; Isaac 11/1/2026: "hold it from the turkeys and pilgrims that are trying to take it"). The Tan army's own man in his Sunday best: a tall black hat with a brass buckle, a white collar, buckle shoes, a musket (one loud shot every 2.4 s; THE BLUNDERBUSS is his HARD gear: a bell-mouthed spread that knocks a man out of the ring). He marches to the cornucopia's ring and kneels inside it: a holder who shoots. The style guide (Laura 10/14): tonal panels, outlines a shade darker at 0.6x and 55 %, crisp lines, rich colour. The 120x140 mold box, the feet on the molds' floor (y 128). Proposed FDEF.pilgrim, w 46. -->
