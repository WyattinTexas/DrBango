<!-- THE PILGRIM (CARD-THP TURKEY HUNT: THE HOLD, design/turkey-hardpoint-1101; Isaac 11/1/2026: "hold it from the turkeys and pilgrims that are trying to take it", and his 18:40 word: "using the actual game art ... as it would look in game"). THE GAME MOLD of the look prototype (kit/build/sec_thp.js: SPRITES_SRC.pilgrim): the Tan rifleman's own mold in a fixed tan (#C09E6C) with the costume in fixed hexes, a placeholder in the game's hand for the build; the final pass from the style guide (Laura 10/14) by Al or Laura. The tall black hat with the brass buckle, the white collar, the buckle shoes, the musket (one loud shot every 2.4 s, 2 pips); THE BLUNDERBUSS is his HARD gear (a bell-mouthed spread that knocks a man out of the ring). He marches from the east to the cornucopia's ring and kneels inside it: a holder who shoots. The 120x140 mold box, the feet on the molds' floor. -->
