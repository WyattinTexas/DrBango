<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <!-- THE TELEPORT RING: Raziya's proposal 11/8 (CARD-RBF round 2): court units of the palace arrive by magic near the line or the toy box, with a flashy ring and its own sound -->
  <ellipse cx="70" cy="116" rx="44" ry="9" fill="#000" fill-opacity=".16"/>
  <!-- the ring on the floor, two ellipses of light -->
  <ellipse cx="70" cy="112" rx="46" ry="12" fill="none" stroke="#7FB0F5" stroke-width="3.5"/>
  <ellipse cx="70" cy="112" rx="34" ry="8" fill="#DCEBFF" fill-opacity=".55" stroke="#2A63B8" stroke-width="2"/>
  <!-- the column of light, a gnome's shape half arrived inside it -->
  <path d="M34 112 L 44 30 L 96 30 L 106 112 Z" fill="#9FD1FF" fill-opacity=".38"/>
  <g opacity=".85">
    <ellipse cx="70" cy="96" rx="16" ry="8" fill="#4C7A2E"/>
    <rect x="56" y="66" width="28" height="30" rx="8" fill="#5B8F3A" stroke="#22262E" stroke-width="2"/>
    <circle cx="70" cy="58" r="12" fill="#F2C9A6" stroke="#22262E" stroke-width="2"/>
    <path d="M56 56 L 70 18 L 84 56 Z" fill="#C8392B" stroke="#22262E" stroke-width="2"/>
  </g>
  <!-- sparkles -->
  <g fill="#FFFFFF">
    <path d="M28 52 l3 -8 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 Z"/>
    <path d="M110 40 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 Z"/>
    <path d="M102 84 l2 -5 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 Z"/>
  </g>
  <!-- the shimmer bands -->
  <path d="M40 48 L 100 48" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="2"/>
  <path d="M38 72 L 102 72" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="2"/>
</svg>
