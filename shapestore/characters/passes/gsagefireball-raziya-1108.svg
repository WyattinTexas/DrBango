<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <!-- THE SAGE'S FIREBALL: Raziya's proposal 11/8 (CARD-RBF round 2): the gnome sage hurls a fireball with travel time; up close it bursts on a clump of infantry -->
  <defs>
    <radialGradient id="core" cx="0.42" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#FFF6CF"/><stop offset="0.35" stop-color="#FFD54A"/><stop offset="0.75" stop-color="#FF7A2A"/><stop offset="1" stop-color="#C2411A"/>
    </radialGradient>
  </defs>
  <ellipse cx="70" cy="122" rx="30" ry="6" fill="#000" fill-opacity=".18"/>
  <!-- the trail, three tongues flung back and up -->
  <path d="M34 92 C 12 86, 10 62, 30 48 C 26 66, 36 74, 44 80 Z" fill="#FF7A2A" fill-opacity=".85"/>
  <path d="M40 104 C 16 110, 8 92, 20 78 C 22 94, 34 96, 46 94 Z" fill="#FFB347" fill-opacity=".9"/>
  <path d="M46 72 C 30 60, 34 40, 52 34 C 44 48, 50 60, 58 64 Z" fill="#FFD54A" fill-opacity=".9"/>
  <!-- the ball -->
  <circle cx="82" cy="76" r="34" fill="url(#core)" stroke="#22262E" stroke-width="2.4"/>
  <circle cx="72" cy="66" r="9" fill="#FFF6CF" fill-opacity=".85"/>
  <!-- a few sparks -->
  <circle cx="118" cy="44" r="3" fill="#FFD54A"/><circle cx="110" cy="112" r="2.5" fill="#FF7A2A"/><circle cx="52" cy="22" r="2" fill="#FFB347"/>
  <!-- the sage's green bolt color on the rim, so it reads as HIS fire -->
  <path d="M60 104 C 70 112, 92 112, 104 100" fill="none" stroke="#7BE3A0" stroke-width="3" stroke-linecap="round" stroke-opacity=".9"/>
</svg>
