<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
<!-- AN ICE BOULDER with its LEE (CARD-ICN-P1 part 5): the lobby's ice boulders (caveMid: #3E5A72 with a #8FB2C8 shine) brought onto the fight's floor as cover, in the style guide's tonal panels; a man stands in the lee, the fish splats on the rock's face. -->
<rect x="0" y="0" width="320" height="200" fill="#EEF3F8"/>
<ellipse cx="120" cy="140" rx="200" ry="40" fill="#C9DCE9" opacity=".35"/>
<path d="M200 60 L300 60 Q312 100 300 150 L200 150 Z" fill="#BFE3F7" opacity=".32"/>
<text x="250" y="48" font-family="-apple-system,Helvetica,Arial" font-size="12" font-weight="800" fill="#1F4256" text-anchor="middle" letter-spacing=".08em">THE LEE</text>
<ellipse cx="130" cy="150" rx="78" ry="16" fill="#000" opacity=".16"/>
<path d="M62 118 L80 76 L120 60 L176 66 L204 100 L198 140 L160 156 L92 152 L60 136 Z" fill="#2F4A60"/>
<path d="M62 118 L80 76 L120 60 L176 66 L204 100 L150 92 L112 96 L84 108 Z" fill="#7FA3BE"/>
<path d="M84 108 L112 96 L150 92 L204 100 L198 140 L160 156 L92 152 L60 136 L62 118 Z" fill="#4D7291"/>
<path d="M112 96 L150 92 L146 150 L96 150 Z" fill="#3F6482" opacity=".8"/>
<path d="M62 118 L80 76 L120 60 L176 66 L204 100 L198 140 L160 156 L92 152 L60 136 Z" fill="none" stroke="#223849" stroke-opacity=".55" stroke-width="2.4"/>
<path d="M84 108 L112 96 L150 92 L204 100 M112 96 L96 150 M150 92 L146 150" fill="none" stroke="#223849" stroke-opacity=".45" stroke-width="1.6"/>
<path d="M86 72 Q120 58 170 68" fill="none" stroke="#FFFFFF" stroke-width="3" opacity=".8"/>
<path d="M82 76 L120 62 L170 68 L160 74 L118 70 L92 82 Z" fill="#EEF3F8" opacity=".9"/>
<!-- the fish splat on the near face -->
<g transform="translate(70 104) rotate(-20)"><path d="M-14 0 C-10 -9 4 -9 12 0 C4 9 -10 9 -14 0 Z" fill="#8FB2C8" stroke="#2B3138" stroke-width="2"/><path d="M12 0 L23 -8 L23 8 Z" fill="#8FB2C8" stroke="#2B3138" stroke-width="2"/><circle cx="-8" cy="-2" r="1.9" fill="#0B1218"/></g>
<g fill="none" stroke="#DDF1FC" stroke-width="3"><path d="M44 96 L36 90 M46 110 L36 116 M58 120 L54 130"/></g>
<text x="40" y="150" font-family="-apple-system,Helvetica,Arial" font-size="11" font-weight="800" fill="#1F4256" letter-spacing=".06em">SPLAT</text>
<!-- the man in the lee: a green soldier -->
<g transform="translate(250 104)"><ellipse cx="0" cy="34" rx="14" ry="4" fill="#000" opacity=".2"/><path d="M-8 30 L-6 10 L6 10 L8 30 Z" fill="#3E7A3E"/><rect x="-10" y="-6" width="20" height="18" rx="4" fill="#4E944E"/><circle cx="0" cy="-14" r="8" fill="#5FA85F"/><path d="M-10 -16 L10 -16 L8 -22 L-8 -22 Z" fill="#3E7A3E"/><path d="M10 0 L26 -6" stroke="#2B3138" stroke-width="3" stroke-linecap="round"/><path d="M-8 30 L-6 10 L6 10 L8 30 Z M-10 -6 h20 v18 h-20 Z" fill="none" stroke="#1F4B1F" stroke-opacity=".55" stroke-width="2"/></g>
<text x="250" y="164" font-family="-apple-system,Helvetica,Arial" font-size="11" font-weight="800" fill="#1F4256" text-anchor="middle" letter-spacing=".06em">THE MORTAR</text>
<!-- the thrower's side -->
<path d="M8 100 L30 100" stroke="#8E2A3A" stroke-width="3" stroke-linecap="round" marker-end="url(#a)"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8E2A3A"/></marker></defs>
<text x="8" y="90" font-family="-apple-system,Helvetica,Arial" font-size="11" font-weight="800" fill="#8E2A3A" letter-spacing=".06em">THE THROW</text>
</svg>
