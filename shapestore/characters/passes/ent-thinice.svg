<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 190">
<!-- THE FLASH-FREEZE in three beats (CARD-ICN-P1 part 3): water wells from the struck floor and runs a tongue toward the stream, the steam and the racing cracks, THIN ICE: pale, crazed, walkable, with a yeti's eyes glowing up through it before he breaks out. The plate's grammar: the rim's dark #0B141C, the stream's black ice #0E1B29, the frost #DCEBF7 / #BFE3F7 / #8FB2C8. -->
<defs><radialGradient id="eye2" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#DFF6FF"/><stop offset=".5" stop-color="#7FC4E8" stop-opacity=".9"/><stop offset="1" stop-color="#7FC4E8" stop-opacity="0"/></radialGradient>
<linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EEF3F8"/><stop offset=".55" stop-color="#5B6F80"/><stop offset="1" stop-color="#0B141C"/></linearGradient></defs>
<g font-family="-apple-system,Helvetica,Arial" font-weight="800" font-size="12" fill="#1F4256" letter-spacing=".06em">
<!-- beat 1: the water -->
<rect x="0" y="0" width="210" height="190" fill="url(#rim)"/>
<ellipse cx="150" cy="60" rx="34" ry="20" fill="#03070A"/>
<path d="M150 70 C140 90 110 100 90 120 C76 134 70 150 66 170" fill="none" stroke="#1E3A52" stroke-width="26" stroke-linecap="round"/>
<path d="M150 70 C140 90 110 100 90 120 C76 134 70 150 66 170" fill="none" stroke="#15283A" stroke-width="16" stroke-linecap="round"/>
<g fill="none" stroke="#5B8FB0" stroke-width="1.6" opacity=".8"><path d="M136 86 Q142 90 148 86 M110 108 Q116 112 122 108 M86 130 Q92 134 98 130 M74 152 Q80 156 86 152"/></g>
<text x="105" y="180" text-anchor="middle" fill="#EEF3F8">1 · THE WATER WELLS UP</text>
<!-- beat 2: the steam and the cracks -->
<rect x="225" y="0" width="210" height="190" fill="url(#rim)"/>
<ellipse cx="375" cy="60" rx="34" ry="20" fill="#03070A"/>
<path d="M375 70 C365 90 335 100 315 120 C301 134 295 150 291 170" fill="none" stroke="#6E92AA" stroke-width="26" stroke-linecap="round"/>
<path d="M375 70 C365 90 335 100 315 120 C301 134 295 150 291 170" fill="none" stroke="#9FBFD6" stroke-width="16" stroke-linecap="round" opacity=".8"/>
<g fill="none" stroke="#DCEBF7" stroke-width="1.5"><path d="M360 86 L344 92 L336 104 M332 112 L318 118 L312 132 M308 140 L298 150 M352 96 L360 110"/></g>
<g fill="#FFFFFF" opacity=".85"><ellipse cx="340" cy="78" rx="12" ry="8"/><ellipse cx="326" cy="64" rx="9" ry="6"/><ellipse cx="312" cy="112" rx="10" ry="7"/><ellipse cx="300" cy="98" rx="7" ry="5"/></g>
<text x="330" y="180" text-anchor="middle" fill="#EEF3F8">2 · THE STEAM · 3 s</text>
<!-- beat 3: thin ice, a hole in it -->
<rect x="450" y="0" width="210" height="190" fill="url(#rim)"/>
<ellipse cx="600" cy="60" rx="34" ry="20" fill="#03070A"/>
<path d="M600 70 C590 90 560 100 540 120 C526 134 520 150 516 170" fill="none" stroke="#BFE3F7" stroke-width="30" stroke-linecap="round"/>
<path d="M600 70 C590 90 560 100 540 120 C526 134 520 150 516 170" fill="none" stroke="#DCEBF7" stroke-width="20" stroke-linecap="round"/>
<g fill="none" stroke="#8FB2C8" stroke-width="1.2" opacity=".8"><path d="M586 86 L572 92 L566 104 M558 112 L544 118 L538 132 M534 140 L524 150 M578 96 L584 110 M548 124 L556 134"/></g>
<ellipse cx="548" cy="126" rx="7" ry="5" fill="url(#eye2)" opacity=".9"/><ellipse cx="566" cy="112" rx="7" ry="5" fill="url(#eye2)" opacity=".9"/>
<ellipse cx="548" cy="126" rx="2.4" ry="1.9" fill="#DFF6FF" opacity=".8"/><ellipse cx="566" cy="112" rx="2.4" ry="1.9" fill="#DFF6FF" opacity=".8"/>
<text x="555" y="180" text-anchor="middle" fill="#EEF3F8">3 · THIN ICE · eyes under it</text>
</g>
</svg>
