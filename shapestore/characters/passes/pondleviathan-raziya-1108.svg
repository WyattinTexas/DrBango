<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200">
  <!-- THE POND LEVIATHAN: a giant frog hidden in Princess Croak's pond, proposed by Raziya 11/8/2026 for the higher difficulties
       (the tongue yoink and an area water spit). A sketch for the character sheet's tile; not in the game. -->
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb9d8"/><stop offset="1" stop-color="#3f7fa6"/>
    </linearGradient>
  </defs>
  <rect width="240" height="200" fill="#f6f1e4"/>
  <!-- the pond -->
  <ellipse cx="120" cy="150" rx="112" ry="38" fill="#8a9a6b"/>
  <ellipse cx="120" cy="148" rx="104" ry="32" fill="url(#water)"/>
  <!-- the body under the water (a dark shape) -->
  <path d="M28 150 Q60 118 120 122 Q180 118 212 150 Q180 160 120 160 Q60 160 28 150Z" fill="#2f6a52" opacity="0.55"/>
  <!-- the head breaking the surface -->
  <path d="M46 138 Q50 92 120 90 Q190 92 194 138 Q160 146 120 146 Q80 146 46 138Z" fill="#4e9a5e" stroke="#20462c" stroke-width="3" stroke-linejoin="round"/>
  <path d="M60 136 Q120 126 180 136" fill="none" stroke="#20462c" stroke-width="2.5" opacity="0.6"/>
  <!-- the eyes on their bumps -->
  <ellipse cx="80" cy="92" rx="24" ry="20" fill="#4e9a5e" stroke="#20462c" stroke-width="3"/>
  <ellipse cx="160" cy="92" rx="24" ry="20" fill="#4e9a5e" stroke="#20462c" stroke-width="3"/>
  <circle cx="80" cy="92" r="13" fill="#f3d56b" stroke="#20462c" stroke-width="2.5"/>
  <circle cx="160" cy="92" r="13" fill="#f3d56b" stroke="#20462c" stroke-width="2.5"/>
  <ellipse cx="82" cy="92" rx="4" ry="9" fill="#1b1b1b"/>
  <ellipse cx="158" cy="92" rx="4" ry="9" fill="#1b1b1b"/>
  <!-- the mouth line and the tongue reaching for a man -->
  <path d="M64 130 Q120 150 176 130" fill="none" stroke="#20462c" stroke-width="3" stroke-linecap="round"/>
  <path d="M120 138 Q150 112 196 62" fill="none" stroke="#e2607a" stroke-width="7" stroke-linecap="round"/>
  <circle cx="198" cy="60" r="8" fill="#e2607a" stroke="#8a2d44" stroke-width="2"/>
  <!-- a tiny green soldier at the tongue's end -->
  <g transform="translate(204 44) scale(0.9)">
    <circle cx="0" cy="-10" r="4" fill="#5b8f3a" stroke="#2c4a1c" stroke-width="1.5"/>
    <path d="M0 -6 L0 6 M-6 -2 L6 -2 M0 6 L-4 14 M0 6 L4 14" fill="none" stroke="#5b8f3a" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- the water spit ring -->
  <ellipse cx="120" cy="150" rx="60" ry="14" fill="none" stroke="#dff1fa" stroke-width="3" opacity="0.8"/>
  <ellipse cx="120" cy="150" rx="84" ry="22" fill="none" stroke="#dff1fa" stroke-width="2" opacity="0.5"/>
  <!-- ripples -->
  <path d="M30 156 q10 -4 20 0 t20 0" fill="none" stroke="#dff1fa" stroke-width="2" opacity="0.7"/>
  <path d="M170 158 q10 -4 20 0 t20 0" fill="none" stroke="#dff1fa" stroke-width="2" opacity="0.7"/>
</svg>
