<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140">
<!-- THE SNAPPER (CARD-ICN-P1 THE CAVES RE-DRAWN, design/ice-caves-redrawn-1101; Raziya 11/1/2026: "some sharp-toothed fish with legs? for wackiness factor"). The cave family's fish (the lobby's cvFishSVG blue-grey #8FB2C8 kept as its highlight band) grown a maw of needle teeth, one big gold eye and two orange chicken legs. The style guide (Laura 10/14): flat tonal panels (a light top, a deeper foot), outlines a shade darker than the fill at 0.6x width and 55% opacity, drawn lines crisp, colour rich. The 120x140 mold box, the feet on the molds' floor (y 128). Drawn at w 30 in the fight (FDEF.snapper, proposed). -->
<g stroke-linecap="round" stroke-linejoin="round">
<ellipse cx="60" cy="131" rx="30" ry="5" fill="#000" opacity="0.18"/>
<!-- the legs: orange chicken legs, three toes each, the knee bent -->
<g fill="none" stroke="#E59A3C" stroke-width="7"><path d="M48 96 L44 112 L50 126"/><path d="M74 96 L78 112 L72 126"/></g>
<g fill="none" stroke="#9A5F18" stroke-opacity=".55" stroke-width="4.2"><path d="M48 96 L44 112 L50 126"/><path d="M74 96 L78 112 L72 126"/></g>
<g fill="none" stroke="#4A2E0C" stroke-width="2.4"><path d="M50 126 L40 132 M50 126 L48 134 M50 126 L58 131"/><path d="M72 126 L62 131 M72 126 L74 134 M72 126 L82 132"/></g>
<!-- the tail fin -->
<path d="M90 76 L112 58 L108 78 L112 98 Z" fill="#4A7A99"/>
<path d="M90 76 L112 58 L108 78 L112 98 Z" fill="none" stroke="#2F5468" stroke-opacity=".55" stroke-width="2.4"/>
<!-- the body: the deep foot panel, then the light top panel -->
<path d="M26 78 C30 100 48 108 66 106 C84 104 96 92 94 76 C92 60 80 50 62 50 C44 50 28 60 26 78 Z" fill="#3E6A88"/>
<path d="M27 74 C34 56 48 48 64 50 C80 52 92 62 94 76 C84 72 70 70 58 72 C46 74 36 76 27 74 Z" fill="#5E8FB0"/>
<path d="M36 60 C46 54 60 52 74 56 C80 58 84 60 88 64 C78 62 64 62 52 64 C46 65 40 64 36 60 Z" fill="#8FB2C8" opacity=".9"/>
<path d="M26 78 C30 100 48 108 66 106 C84 104 96 92 94 76 C92 60 80 50 62 50 C44 50 28 60 26 78 Z" fill="none" stroke="#2A4A60" stroke-opacity=".55" stroke-width="2.4"/>
<!-- the dorsal fin + a side fin -->
<path d="M56 50 L62 34 L70 38 L78 30 L80 52 Z" fill="#4A7A99"/><path d="M56 50 L62 34 L70 38 L78 30 L80 52 Z" fill="none" stroke="#2F5468" stroke-opacity=".55" stroke-width="2.4"/>
<path d="M70 86 L84 96 L74 100 Z" fill="#4A7A99"/><path d="M70 86 L84 96 L74 100 Z" fill="none" stroke="#2F5468" stroke-opacity=".55" stroke-width="2.4"/>
<!-- THE MAW: the upper jaw, the dropped lower jaw, the red inside, the needle teeth -->
<path d="M26 78 C14 80 10 86 12 94 C14 100 26 104 38 102 C44 101 50 96 52 90 C48 84 40 80 26 78 Z" fill="#8E2A3A"/>
<path d="M14 92 C18 98 28 100 38 99 C44 98 48 95 50 91 C42 92 30 94 22 92 Z" fill="#C04A5A"/>
<path d="M26 78 C14 80 10 86 12 94 C14 100 26 104 38 102 C44 101 50 96 52 90 C48 84 40 80 26 78 Z" fill="none" stroke="#5A1A26" stroke-opacity=".55" stroke-width="2.4"/>
<path d="M12 72 C18 66 30 66 40 70 C46 72 50 76 52 82 C44 82 34 80 26 80 C18 80 14 78 12 72 Z" fill="#5E8FB0"/>
<path d="M12 72 C18 66 30 66 40 70 C46 72 50 76 52 82 C44 82 34 80 26 80 C18 80 14 78 12 72 Z" fill="none" stroke="#2A4A60" stroke-opacity=".55" stroke-width="2.4"/>
<g fill="#FFFFFF" stroke="#2B3138" stroke-width="1.2"><path d="M16 78 L19 88 L22 79 Z M23 80 L26 91 L29 81 Z M30 81 L33 93 L36 82 Z M37 81 L40 92 L43 81 Z M44 80 L47 89 L50 80 Z"/>
<path d="M16 95 L19 86 L22 96 Z M24 97 L27 87 L30 98 Z M32 98 L35 88 L38 98 Z M40 97 L43 89 L46 96 Z"/></g>
<!-- the big gold eye, a glint -->
<circle cx="40" cy="64" r="9.5" fill="#FFFFFF"/><circle cx="40" cy="64" r="9.5" fill="none" stroke="#2A4A60" stroke-opacity=".55" stroke-width="1.8"/>
<circle cx="41.5" cy="65" r="6" fill="#F2C75C"/><circle cx="42.5" cy="65.5" r="3.2" fill="#0B1218"/><circle cx="38.5" cy="62" r="1.6" fill="#FFFFFF"/>
<!-- the gill line (crisp) and the wet shine along the back -->
<path d="M52 60 Q54 72 50 84" fill="none" stroke="#2A4A60" stroke-width="1.6" opacity=".7"/>
<path d="M46 55 Q62 48 80 55" fill="none" stroke="#FFFFFF" stroke-width="2.2" opacity=".75"/>
</g>
</svg>
