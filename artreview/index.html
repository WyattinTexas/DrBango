<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art Critics Panel — Full Card Review</title>
<style>
:root {
  --bg: #0f0f1a; --surface: #1a1a2e; --surface2: #16213e; --border: #2a2a4a;
  --text: #e8e8e8; --text2: #8888aa; --accent: #e94560;
  --magma: #ff6348; --moonstone: #7ee8fa;
  --use: #2ecc71; --rework: #f39c12; --scrap: #e74c3c;
  --rolling: #7dbd3b; --volcanic: #ff6348; --original: #9b59b6;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background:var(--bg); color:var(--text); }
.app { max-width:1600px; margin:0 auto; padding:16px; }

header { text-align:center; padding:16px 0 20px; border-bottom:2px solid var(--border); margin-bottom:24px; }
header h1 { font-size:26px; font-weight:800; background:linear-gradient(135deg, var(--magma), var(--moonstone)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
header .sub { color:var(--text2); font-size:13px; margin-top:4px; }

/* ── DASHBOARD ── */
.dashboard { display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:12px; margin-bottom:24px; }
.stat-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px; text-align:center; }
.stat-card .stat-num { font-size:28px; font-weight:800; }
.stat-card .stat-label { font-size:11px; color:var(--text2); text-transform:uppercase; letter-spacing:1px; margin-top:2px; }
.stat-card .stat-sub { font-size:12px; color:var(--text2); margin-top:4px; }

/* ── ISSUES ── */
.issues-banner { background:var(--surface); border:1px solid var(--scrap); border-radius:10px; padding:16px 20px; margin-bottom:24px; }
.issues-banner h3 { font-size:14px; color:var(--scrap); text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; }
.issues-banner .issue-row { display:flex; gap:8px; align-items:flex-start; margin-bottom:6px; font-size:13px; }
.issues-banner .issue-icon { font-weight:800; color:var(--scrap); min-width:20px; }
.issues-banner .issue-count { background:var(--scrap); color:#fff; font-size:10px; font-weight:700; padding:1px 6px; border-radius:8px; margin-left:4px; }

/* ── CRITICS ── */
.critics-row { display:flex; gap:12px; margin-bottom:20px; overflow-x:auto; padding-bottom:4px; }
.mini-critic { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 14px; text-align:center; min-width:100px; flex-shrink:0; }
.mini-critic svg { display:block; margin:0 auto 6px; }
.mini-critic .mc-name { font-size:12px; font-weight:700; }
.mini-critic .mc-role { font-size:10px; color:var(--moonstone); }

/* ── FILTERS ── */
.filter-bar { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
.filter-bar .filter-label { font-size:11px; color:var(--text2); text-transform:uppercase; letter-spacing:1px; margin-right:4px; }
.fbtn { font-size:11px; font-weight:600; padding:5px 14px; border-radius:16px; border:1px solid var(--border); background:var(--surface); color:var(--text2); cursor:pointer; transition:all 0.15s; }
.fbtn:hover, .fbtn.active { border-color:var(--moonstone); color:var(--text); }
.fbtn.active { background:var(--surface2); }
.filter-sep { width:1px; height:20px; background:var(--border); margin:0 4px; }

/* ── CARD GRID ── */
.card-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap:14px; }
.card-item { background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; transition:border-color 0.2s, transform 0.15s; cursor:default; }
.card-item:hover { border-color:var(--text2); transform:translateY(-2px); }
.card-item .ci-img { height:180px; background:#111; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
.card-item .ci-img img { max-width:100%; max-height:100%; object-fit:contain; }
.card-item .ci-img .ci-set { position:absolute; top:6px; left:8px; font-size:9px; font-weight:600; padding:2px 8px; border-radius:8px; color:#fff; }
.set-rolling { background:rgba(125,189,59,0.8); }
.set-volcanic { background:rgba(255,99,72,0.8); }
.set-original { background:rgba(155,89,182,0.8); }
.ci-body { padding:10px 12px 12px; }
.ci-body .ci-name { font-size:14px; font-weight:700; margin-bottom:2px; }
.ci-body .ci-char { font-size:11px; color:var(--text2); margin-bottom:6px; }
.ci-scores { display:flex; gap:4px; align-items:center; margin-bottom:6px; }
.ci-pip { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:#fff; position:relative; cursor:pointer; transition:transform 0.15s; }
.ci-pip:hover { transform:scale(1.3); z-index:2; }
.ci-pip .tt { display:none; position:absolute; bottom:calc(100% + 6px); left:50%; transform:translateX(-50%); background:#111; border:1px solid var(--border); border-radius:6px; padding:8px 10px; width:240px; font-size:11px; font-weight:400; color:var(--text); text-align:left; line-height:1.4; z-index:100; pointer-events:none; box-shadow:0 4px 16px rgba(0,0,0,0.6); }
.ci-pip .tt .tn { font-weight:700; color:var(--moonstone); margin-bottom:2px; }
.ci-pip:hover .tt { display:block; }
.ci-bottom { display:flex; align-items:center; justify-content:space-between; padding-top:6px; border-top:1px solid var(--border); }
.ci-avg { font-size:18px; font-weight:800; }
.ci-badge { font-size:10px; font-weight:700; padding:3px 10px; border-radius:12px; text-transform:uppercase; letter-spacing:0.5px; }
.badge-use { background:var(--use); color:#000; }
.badge-rework { background:var(--rework); color:#000; }
.badge-scrap { background:var(--scrap); color:#fff; }
.ci-issue { font-size:10px; color:var(--rework); margin-top:4px; line-height:1.3; }

.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--use); color:#000; font-size:13px; font-weight:600; padding:8px 20px; border-radius:8px; opacity:0; transition:opacity 0.3s; pointer-events:none; z-index:1000; }
.toast.show { opacity:1; }

.sort-bar { display:flex; gap:6px; margin-bottom:16px; align-items:center; }
</style>
</head>
<body>
<div class="app">

<header>
  <h1>Art Critics Panel — Full Review</h1>
  <div class="sub">77 cards reviewed with real art analysis across Rolling Hills + Volcanic Isles</div>

<!-- Dashboard -->
<div class="dashboard" id="dashboard"></div>

<!-- Issues -->
<div class="issues-banner" id="issuesBanner"></div>

<!-- Filters -->
<div class="filter-bar" id="filterBar">
  <span class="filter-label">Set:</span>
  <button class="fbtn active" data-set="all">All</button>
  <button class="fbtn" data-set="rolling">Rolling Hills</button>
  <button class="fbtn" data-set="volcanic">Volcanic Isles</button>
  <button class="fbtn" data-set="original">Originals</button>
  <div class="filter-sep"></div>
  <span class="filter-label">Verdict:</span>
  <button class="fbtn active" data-verdict="all">All</button>
  <button class="fbtn" data-verdict="use">Use It</button>

  <div class="filter-sep"></div>

  <button class="fbtn active" data-sort="score">Score</button>

</div>

<script>
const C = [
  {id:'tyler',name:'Tyler',color:'#3498db'},
  {id:'marcia',name:'Marcia',color:'#e94560'},
  {id:'dan',name:'Dan',color:'#2ecc71'},
  {id:'sooyun',name:'Soo-Yun',color:'#9b59b6'},
  {id:'ray',name:'Ray',color:'#f39c12'},
];

// s=scores[5], q=quotes[5], v=verdict, set, img, issue (optional)
const D = [
  // ═══ ROLLING HILLS ═══
  {n:'Barnaby',ch:'Fence post creature in farmland',set:'rolling',img:'../testroom/art/barnaby.webp',
   s:[6,7,6,8,6],v:'use',q:["Kinda lonely looking but I like his vibe","Good sense of place and character weight","A little somber for kids but not scary","Beautiful ink and wash, fence textures are genuine","Quiet card, won't move product fast but adds set depth"]},
  {n:'Biscuit',ch:'Warm bread creature on windowsill',set:'rolling',img:'../testroom/art/biscuit.webp',
   s:[9,8,10,8,9],v:'use',q:["I WANT TO HUG HIM. He looks so warm and soft!","Great composition, warm light framing, reads perfectly","The coziest card I've ever seen. My kids fought over it","Lovely warm washes, the steam is genuine wet-on-wet","Comfort food in card form. Parents and kids both love this"]},
  {n:'Bramble',ch:'Spindly twig creature with one big eye',set:'rolling',img:'../testroom/art/bramble.webp',
   s:[7,8,7,9,7],v:'use',q:["He's weird but cool? Like a forest robot","Excellent character design -- instantly memorable silhouette","A bit odd but my kids thought he was funny, not scary","Outstanding ink work on the branches, wildflowers are pure watercolor","Unique enough to be a fan favorite for the artsy crowd"]},
  {n:'Bumble',ch:'Fuzzy bumblebee in flowers',set:'rolling',img:'../testroom/art/bumble.webp',
   s:[9,7,9,8,8],v:'use',q:["BUMBLE IS SO FLUFFY! Best bee ever!","Good circular composition, the flower frame works well","Bees! My daughter loves bees. Instant favorite","Nice loose washes in the flowers, the bee's fuzz has good texture","Cute critters sell. Bumble is a reliable performer"]},
  {n:'Cluck',ch:'Proud rooster on fence at sunrise',set:'rolling',img:'../testroom/art/cluck.webp',
   s:[7,7,8,7,7],v:'use',q:["A chicken ghost? That's funny. I like the sunrise","Clean composition, the backlight effect works at card size","Fun and age-appropriate. My kids giggled","Decent watercolor, the sunrise wash is nice, rooster is a bit tight","Chickens are charming. Good common card"]},
  {n:'Cricket',ch:'Moth creature on fence post under moon',set:'rolling',img:'../testroom/art/cricket.webp',
   s:[7,6,7,7,6],v:'use',q:["Cute little night bug! The moon is cool","Decent character but a bit small in the frame","Sweet and gentle. Good bedtime card energy","Nice blue washes, the moonlight technique is solid","Quiet card. Fine for the set but won't be a standout"]},
  {n:'Dewdrop',ch:'Water spirit rising from forest stream',set:'rolling',img:'../testroom/art/dewdrop.webp',
   s:[7,7,8,8,7],v:'use',q:["Pretty! Like a water fairy coming out of the creek","Good environmental storytelling, creature reads well","Gentle and magical. My kids loved the forest setting","Beautiful light through trees, water reflections are genuine","Nature spirits have broad appeal. Solid mid-tier card"]},
  {n:'Drizzle',ch:'Ghostly white form in wildflower meadow',set:'rolling',img:'../testroom/art/drizzle.webp',
   s:[6,6,7,8,5],v:'rework',q:["Pretty but... what is it? I can barely see the creature","The creature dissolves into the background too much","Gentle energy but my kids couldn't find the character","Beautiful restraint in the washes, very authentic watercolor","Too subtle. Needs more creature presence to sell as a card"],
   issue:'Creature too subtle -- hard to identify at card size'},
  {n:'Dusk',ch:'Figure on cliff at purple/pink sunset',set:'rolling',img:'../testroom/art/dusk.webp',
   s:[6,5,6,9,5],v:'rework',q:["The colors are insane but the person is tiny","Gorgeous painting, terrible card art. Figure is 5% of the image","Pretty sunset but where's the creature my kids can bond with?","Exceptional watercolor -- the purple-to-peach gradient is museum quality","This is a phone wallpaper, not a card. I need a CHARACTER"],
   issue:'Creature is tiny -- reads as landscape art, not card art'},
  {n:'Farmer Jeff',ch:'White ghost in straw hat waving',set:'rolling',img:'../testroom/art/farmer_jeff.jpg',
   s:[7,5,8,5,6],v:'rework',q:["Haha a ghost farmer! He's waving at me! Friendly dude!","The character concept is great -- a friendly ghost farmer. The pixel art style is charming but reads very differently from adjacent cards","Cute! My kids liked the friendly farmer waving. Great energy","The pixel art style is bold and has its own charm. But placed next to the other Rolling Hills watercolors, the visual gap is jarring","Good character, but the pixel art look might confuse buyers about the game's art direction"],
   issue:'Pixel art style creates a jarring visual gap next to the painterly Rolling Hills cards'},
  {n:'Fiddle',ch:'Stick figure playing fiddle under moon',set:'rolling',img:'../testroom/art/fiddle.webp',
   s:[8,8,8,9,8],v:'use',q:["A skeleton playing violin on a hill? That's beautiful and cool","Excellent silhouette, the moonlight framing is textbook, dynamic pose","Musical and whimsical. Not scary at all. My kids were enchanted","Beautiful wet-on-wet sky, the figure's movement is captured with confident strokes","This is the kind of card that makes people say 'this game has great art'"]},
  {n:'Grandmother Willow',ch:'Ancient tree with wise face by lake',set:'rolling',img:'../testroom/art/grandmother_willow.webp',
   s:[6,7,6,7,6],v:'use',q:["A tree with a face! Kinda spooky but wise looking","Good character integration with the tree form. Moon adds depth","A little dark and moody. My younger kids weren't sure about it","Nice ink-wash technique on the bark, the reflections work well","Tree spirits are classic. Decent mid-tier card"]},
  {n:'Harvest Moon',ch:'Wheat figure in golden field under moon',set:'rolling',img:'../testroom/art/harvest_moon.webp',
   s:[7,8,7,8,7],v:'use',q:["She looks like she's made of wheat! Pretty and mysterious","Elegant composition, the vertical figure against horizontal field works","Mystical but not scary. The golden palette feels warm and safe","Lovely golden washes, the wheat texture is well-observed","Good set piece for the rural theme. Evocative art"]},
  {n:'Haystack Hank',ch:'Hay creature on fence post at sunset',set:'rolling',img:'../testroom/art/haystack_hank.jpg',
   s:[8,7,9,8,8],v:'use',q:["Aww he's like a little hay buddy! The sunset is so pretty","Good character on a simple stage. Clean read at any size","Adorable! The barn in the background sets the scene perfectly","Warm sunset washes, the hay texture is genuine dry-brush. Paper shows","Cute rural character with instant personality. Parents love this energy"]},
  {n:'Honeybun',ch:'Golden honey blob with smile, dripping honey, bees',set:'rolling',img:'../testroom/art/honeybun.jpg',
   s:[10,8,10,9,9],v:'use',q:["HONEYBUN IS THE BEST CARD EVER. I want to eat him! ...wait","Joyful composition, the dripping honey creates natural motion, great palette","Pure happiness. My kids ALL love this one. Zero concerns.","Gorgeous golden washes on visible paper, the honey drips are real wet media","This is your second chase card after Magma Twins. Merch goldmine"]},
  {n:'Lurk',ch:'Dark creature with yellow eyes peeking over log in swamp',set:'rolling',img:'../testroom/art/lurk.jpg',
   s:[8,8,7,8,7],v:'use',q:["The eyes are SO creepy-cute! Like he's watching you from the swamp","Smart composition -- minimal creature, maximum personality through the eyes alone","Spooky-cute, not actually scary. My kids wanted to know what he's hiding","Excellent ink-wash willows, the blue-green palette is cohesive and genuine","Mystery sells. Kids love the 'what IS that?' factor"]},
  {n:'Moonreach',ch:'Large white creature with crown and vegetable basket',set:'rolling',img:'../testroom/art/moonreach.jpg',
   s:[9,8,10,8,9],v:'use',q:["He's like a big fluffy king bringing you food!! I love him!!","Charming character with great personality, the village context adds story","THE most lovable card in the set. My kids want him to be real","Lovely soft washes, the village details are delicate watercolor work","This is a mascot. Box art candidate. Sells the warmth of the entire game"]},
  {n:'Mossy',ch:'Green moss blob sleeping on forest log',set:'rolling',img:'../testroom/art/mossy.webp',
   s:[9,7,9,8,8],v:'use',q:["MOSSY! He's so sleepy and round! I want a plushie!","Good form language -- round = friendly. The log gives scale. Clear read","Perfectly gentle. My kids said 'he looks cozy.' Exactly right","Nice granulating greens, the mushrooms are a lovely detail, paper shows","The plushie potential is obvious. Round, green, sleepy = instant merch"]},
  {n:'Mother Nature',ch:'Flower figure running across green hillside',set:'rolling',img:'../testroom/art/mother_nature.webp',
   s:[8,9,9,8,9],v:'use',q:["She's made of flowers! That's so cool and pretty!","Exceptional composition -- movement, color, joy. This is professional-grade","Breathtaking. My kids said 'she's beautiful.' Box art material","The petal scatter effect is lovely, the greens are luminous. Slight digital feel","This is the card you put on the marketing materials. Aspirational art"]},
  {n:'Mulch',ch:'Autumn leaf/twig creature sitting in fallen leaves',set:'rolling',img:'../testroom/art/mulch.webp',
   s:[6,7,7,8,6],v:'use',q:["He looks tired but kinda cool? Like a leaf person resting","Good character design, the sitting pose has personality","Peaceful autumn spirit. Not exciting but not concerning either","Lovely warm watercolor, the leaf textures are well-observed","Decent filler for the set. Won't be a chase card but adds depth"]},
  {n:'Old Mill',ch:'Overgrown water mill, creature merged with structure',set:'rolling',img:'../testroom/art/old_mill.webp',
   s:[5,6,6,7,5],v:'rework',q:["Is the mill alive? Or is there something hiding? I can't tell","The mill painting is good but where's the creature? It's architecture, not a character","My kids thought it was just a building. Needs a more obvious creature","Nice watercolor on the moss and water, technically solid environment work","Mills don't sell cards. If there's a creature here, make it obvious"],
   issue:'Creature identity unclear -- reads as environment painting'},
  {n:'Patches',ch:'Patchwork rabbit in rocking chair on porch',set:'rolling',img:'../testroom/art/patches.webp',
   s:[8,8,10,8,8],v:'use',q:["A bunny made of quilts!! Sitting on grandma's porch!! Amazing!!","Excellent character with narrative depth. The quilt texture is unique. Warm palette","This card made my kids say 'I love him.' That's all I need to hear","Beautiful warm washes, the patchwork pattern is painted with care. Porch details lovely","Emotional connection is the strongest sell. This card makes people FEEL something"]},
  {n:'Pebbles',ch:'Round stone creature in stream at sunset',set:'rolling',img:'../testroom/art/pebbles.webp',
   s:[6,6,7,7,5],v:'rework',q:["Cute little rock in a river! But he's kinda hard to see","The creature blends into the riverbed too much. Needs more contrast","Sweet but very quiet. My kids almost missed him. Needs to pop more","Nice sunset washes and water technique. The creature is understated","Too subtle for retail. The creature needs to stand out from the environment"],
   issue:'Creature blends into environment -- needs more contrast/presence'},
  {n:'Penny',ch:'Hedgehog creature in autumn forest with golden light',set:'rolling',img:'../testroom/art/penny.webp',
   s:[8,7,9,8,7],v:'use',q:["A little hedgehog spirit! She's collecting leaves! So cute!","Good character in a rich environment. The golden light is effective","Adorable autumn energy. My daughter claimed this as 'her card'","Warm golden washes with nice leaf detail. Genuine watercolor feel","Hedgehog creatures always test well with the 6-10 demo. Solid pick"]},
  {n:'Pudge',ch:'Fat happy frog sitting in pond',set:'rolling',img:'../testroom/art/pudge.webp',
   s:[9,7,9,8,8],v:'use',q:["PUDGE IS SO FAT AND HAPPY! He's just vibing in his pond!","Good form -- the roundness communicates friendliness instantly. Clean read","My kids laughed. In a good way. They love Pudge","Nice soft greens, the water lilies are a lovely touch, good paper showing","Pudge is a vibe. This is the card that shows your game has personality"]},
  {n:'Riverbed',ch:'Misty blue stream with twisted branch',set:'rolling',img:'../testroom/art/riverbed.webp',

   issue:'NO CREATURE -- pure landscape painting'},
  {n:'Rustler',ch:'Autumn leaf figure dancing in pumpkin field',set:'rolling',img:'../testroom/art/rustler.jpg',
   s:[8,8,8,8,8],v:'use',q:["A leaf tornado person dancing with pumpkins!! So cool and seasonal!","Dynamic composition with great movement. The spiral form reads clearly","Fun autumn energy! My kids loved the pumpkins. Festive and appropriate","Beautiful leaf textures and movement in watercolor. The field is well-painted","Seasonal appeal is great for marketing. This card screams 'fall game night'"]},

   s:[7,7,7,8,7],v:'use',q:["A grumpy mushroom! Haha he looks like my grandpa when he wakes up!","Good character design. The red cap against the forest greens reads well","Grumpy but clearly not scary. Like a cartoon old man. Kids thought it was funny","Nice forest watercolor with good moss and bark textures. Authentic technique","Grumpy characters have cult followings (Grumpy Cat, Oscar the Grouch). Good niche pick"]},
  {n:'The Flickers',ch:'Tiny flame spirits above campfire under stars',set:'original',img:'../testroom/art/the_flickers.jpg',
   s:[10,8,9,8,9],v:'use',q:["LITTLE FIRE BABIES! Floating over a campfire under the stars! MAGICAL!","Multi-character scene executed well. Each flame has personality. Night sky framing is strong","Enchanting. Cozy campfire energy. My kids were mesmerized. This is how fire should feel","Beautiful night sky washes, warm-cool contrast is genuine watercolor. Each flame is painted with care","Studio Ghibli energy. Universal appeal. The kind of card people show non-gamers to explain the art style"]},
  {n:'Smithy',ch:'Small figure by standing stone near glowing pool in forest',set:'original',img:'../testroom/art/smithy.webp',
   s:[6,5,6,7,5],v:'rework',q:["Pretty forest but the creature is really small. I want to see him better","The environment dominates. Creature is maybe 10% of the frame. That's a landscape, not a portrait","Nice magical setting but my kids couldn't identify the character easily","Lovely atmospheric watercolor. The glowing pool is well-done. Forest has depth","Same note as Glow Worm and Geode -- creature needs to fill the frame"],
   issue:'Creature too small in frame -- environment dominates'},
];

// ── COMPUTED ──
function avg(s) { return (s.reduce((a,b)=>a+b,0)/s.length).toFixed(1); }
function sc(s) { return s<=2?'var(--scrap)':s<=4?'#e67e22':s<=6?'var(--rework)':s<=7?'#7dbd3b':s<=8?'var(--use)':'#16a085'; }
function ac(a) { const n=parseFloat(a); return n<4?'var(--scrap)':n<6?'var(--rework)':n<7.5?'#7dbd3b':'var(--use)'; }

// Dashboard
const dash = document.getElementById('dashboard');
const sets = {rolling:'Rolling Hills',volcanic:'Volcanic Isles',original:'Originals'};
const setColors = {rolling:'var(--rolling)',volcanic:'var(--volcanic)',original:'var(--original)'};
let totalUse=0,totalRework=0,totalScrap=0;
let setStats = {};
Object.keys(sets).forEach(k => setStats[k] = {cards:0,total:0,use:0,rework:0,scrap:0,noCre:0,digital:0});
D.forEach(c => {
  const a = parseFloat(avg(c.s));
  setStats[c.set].cards++;
  setStats[c.set].total += a;
  setStats[c.set][c.v]++;
  if (c.v==='use') totalUse++;
  if (c.v==='rework') totalRework++;
  if (c.v==='scrap') totalScrap++;
  if (c.issue && c.issue.includes('NO CREATURE')) setStats[c.set].noCre++;
});

dash.innerHTML = `
  <div class="stat-card"><div class="stat-num" style="color:var(--text)">${D.length}</div><div class="stat-label">Cards Reviewed</div></div>
  <div class="stat-card"><div class="stat-num" style="color:var(--use)">${totalUse}</div><div class="stat-label">Use It</div><div class="stat-sub">${(totalUse/D.length*100).toFixed(0)}% of cards</div></div>
  <div class="stat-card"><div class="stat-num" style="color:var(--rework)">${totalRework}</div><div class="stat-label">Rework</div></div>
  <div class="stat-card"><div class="stat-num" style="color:var(--scrap)">${totalScrap}</div><div class="stat-label">Scrap</div></div>
  ${Object.keys(sets).map(k => {
    const st = setStats[k];
    const a = st.cards ? (st.total/st.cards).toFixed(1) : '0';
    return `<div class="stat-card"><div class="stat-num" style="color:${setColors[k]}">${a}</div><div class="stat-label">${sets[k]} Avg</div><div class="stat-sub">${st.use} use / ${st.rework} rework / ${st.scrap} scrap</div></div>`;
  }).join('')}
`;

// Issues
const ib = document.getElementById('issuesBanner');
const noCreCards = D.filter(c=>c.issue&&c.issue.includes('NO CREATURE'));
const scaryCards = D.filter(c=>c.issue&&(c.issue.includes('scary')||c.issue.includes('intense')));
const lostCards = D.filter(c=>c.issue&&(c.issue.includes('lost')||c.issue.includes('tiny')||c.issue.includes('too small')||c.issue.includes('environment dominates')));
const toneCards = D.filter(c=>c.issue&&(c.issue.includes('tone')||c.issue.includes('somber')||c.issue.includes('palette mismatch')||c.issue.includes('funeral')||c.issue.includes('jarring')));
ib.innerHTML = `<h3>Critical Issues Found</h3>
  <div class="issue-row"><span class="issue-icon">1</span>No creature at all <span class="issue-count">${noCreCards.length}</span> -- ${noCreCards.map(c=>c.n).join(', ')}</div>
  <div class="issue-row"><span class="issue-icon">2</span>Too scary for 8+ demo <span class="issue-count">${scaryCards.length}</span> -- ${scaryCards.map(c=>c.n).join(', ')}</div>
  <div class="issue-row"><span class="issue-icon">3</span>Creature lost in environment <span class="issue-count">${lostCards.length}</span> -- ${lostCards.map(c=>c.n).join(', ')}</div>
  <div class="issue-row"><span class="issue-icon">4</span>Wrong tone or palette for set <span class="issue-count">${toneCards.length}</span> -- ${toneCards.map(c=>c.n).join(', ')}</div>
`;

// Rendering
let currentSet = 'all', currentVerdict = 'all', currentSort = 'score';

function render() {
  const grid = document.getElementById('cardGrid');
  let cards = [...D];
  if (currentSet !== 'all') cards = cards.filter(c => c.set === currentSet);
  if (currentVerdict !== 'all') cards = cards.filter(c => c.v === currentVerdict);
  if (currentSort === 'score') cards.sort((a,b) => parseFloat(avg(b.s)) - parseFloat(avg(a.s)));
  else cards.sort((a,b) => a.n.localeCompare(b.n));

  grid.innerHTML = cards.map(card => {
    const a = avg(card.s);
    const pips = card.s.map((s,i) => `<div class="ci-pip" style="background:${sc(s)}">${s}<div class="tt"><div class="tn">${C[i].name} -- ${s}/10</div>${card.q[i]}</div></div>`).join('');
    const badge = card.v==='use'?'badge-use':card.v==='rework'?'badge-rework':'badge-scrap';
    const label = card.v==='use'?'USE IT':card.v==='rework'?'REWORK':'SCRAP';
    const setClass = 'set-'+card.set;
    const setLabel = sets[card.set] || card.set;
    const issueHtml = card.issue ? `<div class="ci-issue">${card.issue}</div>` : '';
    return `<div class="card-item" data-set="${card.set}" data-verdict="${card.v}">
      <div class="ci-img"><img src="${card.img}" alt="${card.n}" loading="lazy"/><span class="ci-set ${setClass}">${setLabel}</span></div>
      <div class="ci-body">
        <div class="ci-name">${card.n}</div>
        <div class="ci-char">${card.ch}</div>
        <div class="ci-scores">${pips}</div>
        <div class="ci-bottom">
          <span class="ci-avg" style="color:${ac(a)}">${a}</span>
          <span class="ci-badge ${badge}">${label}</span>
        </div>
        ${issueHtml}
      </div>
    </div>`;
  }).join('');
}

document.querySelectorAll('.fbtn[data-set]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.fbtn[data-set]').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  currentSet = b.dataset.set;
  render();
}));
document.querySelectorAll('.fbtn[data-verdict]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.fbtn[data-verdict]').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  currentVerdict = b.dataset.verdict;
  render();
}));
document.querySelectorAll('.fbtn[data-sort]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.fbtn[data-sort]').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  currentSort = b.dataset.sort;
  render();
}));

render();
</script>
</body>
</html>
