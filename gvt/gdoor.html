<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://nationgame.live https://accounts.google.com http://127.0.0.1:* http://localhost:*; img-src 'self' data: https://*.googleusercontent.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; script-src 'self' 'unsafe-inline' https://accounts.google.com; frame-src https://accounts.google.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>Green vs Tan · Sign in</title>
<!-- CARD-GDR THE GOOGLE DOOR ON ANDROID (design/android-google-door-1010/00-BUILD-GDR.md; Wyatt 10/10/2026 by phone: "Signing in on android tablet we tried to go
     through good and nothing would load"). The Android app is a web view, and Google signs nobody in inside one: the app's button opens THIS page in Chrome
     (#k=<the app's 32-hex key>&l=<lang>). Google's own button works here; the token is parked at HQ under the key (POST /gvt/gdr/put, server v121) and the app,
     asking HQ while it waits, takes it once and signs in exactly as a browser does (HQ's /gvt/link checks it). This page keeps nothing and reads nothing else. -->
<style>
  :root{--bg:#2E3A22;--bg2:#1F2817;--ink:#F3E9CF;--dim:#C9BC97;--tan:#D9B97A;--ok:#9BD46A;--err:#F28B6B}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg2);color:var(--ink);font-family:"Arial Black",Impact,system-ui,sans-serif}
  body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 90% at 50% 20%,#4A5C34 0%,var(--bg) 45%,var(--bg2) 100%);
    padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
  main{width:100%;max-width:560px;text-align:center}
  .crest{font-size:clamp(30px,8vw,52px);letter-spacing:.06em;line-height:1;color:var(--tan);text-shadow:0 3px 0 #000,0 0 24px rgba(0,0,0,.4)}
  .crest b{color:var(--ok)}
  h1{margin:22px 0 10px;font-size:clamp(20px,5vw,30px);letter-spacing:.05em}
  p{margin:0 auto 18px;max-width:30em;font:600 clamp(15px,3.8vw,19px)/1.4 system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--dim)}
  #gsiHost{display:flex;justify-content:center;min-height:44px;margin:8px 0 14px}
  .back{display:inline-block;margin-top:6px;padding:16px 30px;border-radius:14px;background:var(--tan);color:#2A1F08;text-decoration:none;font-size:clamp(17px,4.4vw,22px);letter-spacing:.05em;box-shadow:0 4px 0 #7A6230}
  .back:active{transform:translateY(3px);box-shadow:0 1px 0 #7A6230}
  .ok{color:var(--ok)} .err{color:var(--err)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="crest">GREEN <b>VS</b> TAN</div>
  <h1 id="head"></h1>
  <p id="line"></p>
  <div id="gsiHost"></div>
  <a id="back" class="back" hidden></a>
</main>
<script>
(function(){
  const CLIENT='972602551061-qlbq1drqfoh45gto7hr91cs78n2d3ki7.apps.googleusercontent.com';   // index.html's GOOGLE_WEB_CLIENT (HQ's GVT_GOOGLE_CLIENT)
  const NET='https://nationgame.live/gvt';
  const BACK='intent://playgvt.net/join#Intent;scheme=https;package=com.corkscrewgames.gvt;end';   // the app's own link filter: the app comes to the front, nothing reloads
  const W={
    en:['SIGN IN WITH GOOGLE','Sign in here, then go back to Green vs Tan. Your army waits for you there.','SIGNED IN!','Go back to Green vs Tan. It finishes signing you in.','BACK TO THE GAME',"COULDN'T SIGN IN. TRY AGAIN.",'Open this page from the Green vs Tan app.','Google did not load. Check the connection and try again.'],
    de:['MIT GOOGLE ANMELDEN','Melde dich hier an und geh dann zurück zu Green vs Tan. Deine Armee wartet dort.','ANGEMELDET!','Geh zurück zu Green vs Tan. Dort wird die Anmeldung abgeschlossen.','ZURÜCK ZUM SPIEL','ANMELDUNG FEHLGESCHLAGEN. VERSUCH ES NOCHMAL.','Öffne diese Seite aus der Green-vs-Tan-App.','Google wurde nicht geladen. Prüfe die Verbindung und versuch es nochmal.'],
    es:['INICIA SESIÓN CON GOOGLE','Inicia sesión aquí y vuelve a Green vs Tan. Tu ejército te espera allí.','¡SESIÓN INICIADA!','Vuelve a Green vs Tan. Allí termina de iniciar tu sesión.','VOLVER AL JUEGO','NO SE PUDO INICIAR SESIÓN. INTÉNTALO DE NUEVO.','Abre esta página desde la app de Green vs Tan.','Google no cargó. Revisa la conexión e inténtalo de nuevo.'],
    ru:['ВХОД ЧЕРЕЗ GOOGLE','Войди здесь и вернись в Green vs Tan. Твоя армия ждёт тебя там.','ВХОД ВЫПОЛНЕН!','Вернись в Green vs Tan: там вход завершится.','НАЗАД В ИГРУ','НЕ УДАЛОСЬ ВОЙТИ. ПОПРОБУЙ ЕЩЁ РАЗ.','Открой эту страницу из приложения Green vs Tan.','Google не загрузился. Проверь связь и попробуй ещё раз.'],
    ja:['Googleでログイン','ここでログインしたら、Green vs Tanにもどってね。きみの軍隊がまってるよ。','ログインできた！','Green vs Tanにもどってね。そこでログインがおわるよ。','ゲームにもどる','ログインできなかった。もういちどためしてね。','このページはGreen vs Tanのアプリからひらいてね。','Googleがよみこめなかった。つうしんをたしかめて、もういちどためしてね。'],
    ko:['Google로 로그인','여기서 로그인한 뒤 Green vs Tan으로 돌아가세요. 군대가 기다리고 있어요.','로그인 완료!','Green vs Tan으로 돌아가세요. 거기서 로그인이 끝나요.','게임으로 돌아가기','로그인하지 못했어요. 다시 시도하세요.','Green vs Tan 앱에서 이 페이지를 여세요.','Google을 불러오지 못했어요. 연결을 확인하고 다시 시도하세요.'],
    zh:['使用 Google 登录','在这里登录，然后回到 Green vs Tan。你的军队在那里等你。','登录成功！','回到 Green vs Tan，登录会在那里完成。','返回游戏','登录失败，请再试一次。','请从 Green vs Tan 应用打开此页面。','Google 没有加载。请检查网络后再试一次。'],
    ar:['تسجيل الدخول باستخدام Google','سجّل الدخول هنا، ثم عُد إلى Green vs Tan. جيشك ينتظرك هناك.','تم تسجيل الدخول!','عُد إلى Green vs Tan، وهناك يكتمل تسجيل دخولك.','العودة إلى اللعبة','تعذّر تسجيل الدخول. حاول مرة أخرى.','افتح هذه الصفحة من تطبيق Green vs Tan.','لم يتم تحميل Google. تحقّق من الاتصال وحاول مرة أخرى.']
  };
  const q=new URLSearchParams(String(location.hash||'').replace(/^#/,''));
  const K=String(q.get('k')||''); const keyOk=/^[a-f0-9]{32}$/.test(K);
  let L=String(q.get('l')||'').toLowerCase().slice(0,2); if(!W[L]) L=String(navigator.language||'en').toLowerCase().slice(0,2); if(!W[L]) L='en';
  const w=W[L]; document.documentElement.lang=L; if(L==='ar') document.documentElement.dir='rtl';
  const $=id=>document.getElementById(id);
  const say=(h,l,cls)=>{ $('head').textContent=h; $('head').className=cls||''; $('line').textContent=l; };
  const back=$('back'); back.href=BACK; back.textContent=w[4];
  try{ history.replaceState(null,'',location.pathname); }catch(e){}   // the key leaves the address bar (and Chrome's history line) the moment it is read
  if(!keyOk){ say(w[0], w[6]); window.__gdr={state:'nokey'}; return; }
  say(w[0], w[1]); window.__gdr={state:'ready', k:K};
  let busy=0;
  function cred(resp){
    const tok=resp && resp.credential; if(!tok || busy) return; busy=1;
    window.__gdr.state='sending';
    fetch(NET+'/gdr/put',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device:K, k:K, tok:String(tok)})})
      .then(r=>r.json()).then(r=>{ busy=0;
        if(r && r.ok){ window.__gdr.state='parked'; say(w[2], w[3], 'ok'); $('gsiHost').hidden=true; back.hidden=false; }
        else { window.__gdr.state='refused'; say(w[0], w[5], 'err'); } })
      .catch(()=>{ busy=0; window.__gdr.state='down'; say(w[0], w[5], 'err'); });
  }
  window.gdoorCred=cred;   // the rig's door (Google's own pop-up cannot run headless)
  const s=document.createElement('script'); s.src='https://accounts.google.com/gsi/client'; s.async=true;
  s.onload=()=>{ try{
      google.accounts.id.initialize({ client_id:CLIENT, callback:cred, auto_select:false, cancel_on_tap_outside:true });
      google.accounts.id.renderButton($('gsiHost'), { theme:'filled_blue', size:'large', shape:'pill', text:'signin_with', locale:L });
      window.__gdr.btn=1;
    }catch(e){ say(w[0], w[7], 'err'); } };
  s.onerror=()=>{ window.__gdr.state='nogoogle'; say(w[0], w[7], 'err'); };
  document.head.appendChild(s);
})();
</script>
</body>
