<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dog Tag Dials · Green vs Tan</title><meta name="description" content="Green vs Tan: every dog-tag cost, bounty and paycheck by game mode, ready to change."><meta name="robots" content="noindex">
<style>
:root{--bg:#f4f1e8;--card:#fffdf6;--ink:#22241c;--mute:#5d6152;--line:#d9d3bf;--green:#3f6b2a;--tan:#8a6527;--hi:#fff1c2;--hiInk:#4a3800;--red:#a8321f;--in:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#16180f;--card:#20231a;--ink:#ece8da;--mute:#a7ab98;--line:#3a3e2e;--green:#8cc46a;--tan:#d6b276;--hi:#3d3415;--hiInk:#ffe7a1;--red:#ff9c88;--in:#12140c;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:17px/1.5 -apple-system,system-ui,"Segoe UI",sans-serif;padding:0 14px 60px}
main{max-width:1060px;margin:0 auto}
h1{font-size:30px;margin:18px 0 4px;color:var(--green);letter-spacing:.01em}
.lead{margin:4px 0 10px;max-width:70ch}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2px solid var(--line);padding:10px 0;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.count{font-weight:800;font-size:18px;margin-right:auto}.count.on{color:var(--red)}
button,select,input,textarea{font:inherit;color:inherit}
.btn{border:2px solid var(--green);background:var(--green);color:#fff;border-radius:10px;padding:9px 14px;font-weight:800;cursor:pointer}
@media (prefers-color-scheme:dark){.btn{color:#10140a}}
.btn.ghost{background:transparent;color:var(--green)}.btn:disabled{opacity:.45;cursor:default}
select,#q{border:1px solid var(--line);background:var(--in);border-radius:10px;padding:9px 10px;max-width:100%}
h2{font-size:21px;margin:30px 0 2px;color:var(--green)}.sub{color:var(--mute);margin:0 0 8px;font-size:15.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
.rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));column-gap:22px;padding:4px 14px 10px}
.row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);min-height:52px}
.row .l{flex:1;min-width:0}.row .l b{font-weight:600;display:block;overflow-wrap:anywhere}.row .l small{color:var(--mute);font-size:12.5px;font-family:ui-monospace,Menlo,monospace;overflow-wrap:anywhere}
.row .was{color:var(--mute);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.row input{width:96px;text-align:right;border:1.5px solid var(--line);background:var(--in);border-radius:9px;padding:8px 8px;font-weight:700;font-variant-numeric:tabular-nums;font-size:17px}
.row.ch{background:var(--hi);color:var(--hiInk);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:8px}.row.ch input{border-color:var(--tan)}.row.ch .was{color:var(--hiInk)}
.undo{border:0;background:none;font-size:20px;line-height:1;cursor:pointer;padding:4px;visibility:hidden;color:inherit}.row.ch .undo{visibility:visible}
.gh{grid-column:1/-1;font-weight:800;color:var(--tan);font-size:14px;letter-spacing:.08em;margin:12px 0 0}
details.pet>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer}details.pet>summary::-webkit-details-marker{display:none}
details.pet>summary img{width:64px;height:64px;object-fit:contain;flex:none}
.pn{flex:1;min-width:0}.pn b{font-size:19px;color:var(--green)}.pn span{display:block;color:var(--mute);font-size:14.5px}
.chip{background:var(--hi);color:var(--hiInk);border-radius:99px;padding:2px 10px;font-weight:800;font-size:13.5px;white-space:nowrap}.chip[hidden]{display:none}
.dark{border:1px solid var(--line);border-radius:99px;padding:1px 9px;font-size:12.5px;color:var(--mute);margin-left:6px;white-space:nowrap}
.arrow{color:var(--mute);font-size:14px;transition:transform .15s}details[open]>summary .arrow{transform:rotate(90deg)}
.lvt{margin:2px 14px 0;font-size:15px;border-collapse:collapse}.lvt td,.lvt th{padding:3px 12px 3px 0;text-align:right;font-variant-numeric:tabular-nums}.lvt td:first-child,.lvt th:first-child{text-align:left}.lvt th{color:var(--mute);font-weight:600;font-size:13px}
.lvt tr.hp td{font-weight:800;color:var(--green)}
.wrap{overflow-x:auto}
.note{padding:0 14px 12px}.note textarea{width:100%;min-height:54px;border:1.5px solid var(--line);background:var(--in);border-radius:9px;padding:8px}
.lad{margin:0 14px 10px;font-size:14.5px;color:var(--mute)}.lad summary{cursor:pointer;font-weight:700}.lad li{margin:3px 0}.lad b{color:var(--ink)}
.sum{background:var(--card);border:2px solid var(--green);border-radius:14px;padding:10px 14px;margin:14px 0}
.sum table{width:100%;border-collapse:collapse;font-size:16px}.sum td,.sum th{padding:6px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}.sum td:first-child,.sum th:first-child{text-align:left}
.sum th{color:var(--mute);font-size:13px;font-weight:600}.sum td.d{font-weight:800}.sum td.up{color:var(--green)}.sum td.dn{color:var(--red)}
#out{width:100%;min-height:150px;border:1.5px solid var(--line);background:var(--in);border-radius:10px;padding:10px;font:14px/1.45 ui-monospace,Menlo,monospace;margin-top:8px}
#outbox[hidden]{display:none}.tiny{color:var(--mute);font-size:14px}
</style></head><body><main>

","label":"Start purse: Mom's raid","v":260,"code":"MOM_TAGS","hint":""},{"id":"momP","label":"Mom's raid: pour (tags)","v":20,"code":"","hint":""},{"id":"momT","label":"Mom's raid: pour every (s)","v":5,"code":"","hint":""},{"id":"mom3","label":"Mom's raid, round 3 and up: kills \u00d7","v":1.5,"code":"momP3TagX","hint":""},{"id":"sRoom","label":"Start purse: Defend the Room","v":240,"code":"","hint":""},{"id":"room","label":"Defend the Room: tags a wave cleared","v":30,"code":"","hint":""}]}]};
const KEY='gvt-tune-'+DATA.kind+'-v1'; let ST={v:{},n:{}};
try{ const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&s.v) ST={v:s.v||{},n:s.n||{}}; }catch(e){}
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(ST)); }catch(e){} };
const $=(s,r)=>(r||document).querySelector(s), el=(t,c,h)=>{ const e=document.createElement(t); if(c) e.className=c; if(h!=null) e.innerHTML=h; return e; };
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=v=>{ if(typeof v!=='number'||!isFinite(v)) return String(v); return String(+v.toFixed(4)); };
const ROWS={};   // full id → {row, base, where, el, input}
function stepOf(v){ const a=Math.abs(v); if(Number.isInteger(v)) return a>=200?10:a>=40?5:1; return a<1?0.05:a<10?0.1:0.5; }
function cur(id){ const r=ROWS[id]; return (id in ST.v)? ST.v[id] : r.base; }
function mkRow(fid,row,where){
  const d=el('div','row'); d.innerHTML='<div class="l"><b>'+esc(row.label)+'</b>'+(row.code||row.hint?'<small>'+esc([row.hint,row.code].filter(Boolean).join(' · '))+'</small>':'')+'</div><span class="was"></span><input type="number" inputmode="decimal" step="'+stepOf(row.v)+'" aria-label="'+esc(where+': '+row.label)+'"><button class="undo" title="Put it back" aria-label="Put it back">↺</button>';
  const inp=$('input',d); ROWS[fid]={row,base:row.v,where,el:d,input:inp}; inp.value=fmt(cur(fid));
  inp.addEventListener('input',()=>{ const x=parseFloat(inp.value); if(inp.value===''||!isFinite(x)||x===row.v) delete ST.v[fid]; else ST.v[fid]=x; save(); paint(fid); refresh(); });
  inp.addEventListener('blur',()=>{ if(inp.value==='') inp.value=fmt(row.v); });
  $('.undo',d).addEventListener('click',()=>{ delete ST.v[fid]; inp.value=fmt(row.v); save(); paint(fid); refresh(); });
  paint(fid); return d;
}
function paint(fid){ const r=ROWS[fid], on=fid in ST.v; r.el.classList.toggle('ch',on); $('.was',r.el).textContent=on?'was '+fmt(r.base):''; }
function changesText(){
  const ids=Object.keys(ST.v).filter(i=>ROWS[i]), notes=Object.keys(ST.n).filter(k=>ST.n[k]&&ST.n[k].trim());
  const L=[(DATA.kind==='pets'?'PET CHANGES':'DOG TAG CHANGES')+' · Green vs Tan v'+DATA.cv+' · '+(ids.length+notes.length)+' change'+(ids.length+notes.length===1?'':'s')];
  let last=''; for(const i of Object.keys(ROWS)){ if(!(i in ST.v)) continue; const r=ROWS[i]; if(r.where!==last){ L.push(''); L.push(r.where); last=r.where; } L.push('- '+r.row.label+(r.row.code?' ['+r.row.code+']':'')+': '+fmt(r.base)+' -> '+fmt(ST.v[i])); }
  for(const k of notes){ L.push(''); L.push('NOTE · '+k+': '+ST.n[k].trim()); }
  return L.join('\n');
}
function refresh(){
  const n=Object.keys(ST.v).filter(i=>ROWS[i]).length+Object.keys(ST.n).filter(k=>ST.n[k]&&ST.n[k].trim()).length;
  const c=$('#count'); c.textContent=n? n+' change'+(n===1?'':'s')+' saved on this device' : 'No changes yet'; c.classList.toggle('on',!!n);
  $('#copy').disabled=!n; $('#reset').disabled=!n; if(!n) $('#outbox').hidden=true; else if(!$('#outbox').hidden) $('#out').value=changesText();
  if(DATA.kind==='pets') for(const p of DATA.pets){ const m=Object.keys(ST.v).filter(i=>i.indexOf(p.k+'|')===0).length+((ST.n[p.name]||'').trim()?1:0); const ch=$('#chip-'+p.k); ch.hidden=!m; ch.textContent=m+' changed'; }
  if(DATA.kind==='tags') sums();
}
$('#copy').addEventListener('click',async()=>{ const t=changesText(); $('#outbox').hidden=false; const o=$('#out'); o.value=t; let ok=false;
  try{ await navigator.clipboard.writeText(t); ok=true; }catch(e){ try{ o.focus(); o.select(); ok=document.execCommand('copy'); }catch(e2){} }
  $('#outmsg').textContent=ok? 'Copied. Paste it in Discord and it becomes the order to change the game.' : 'Select the text below, copy it, and paste it in Discord.'; });
let armed=0; $('#reset').addEventListener('click',()=>{ const b=$('#reset'); if(!armed){ armed=1; b.textContent='TAP AGAIN TO RESET'; setTimeout(()=>{ armed=0; b.textContent='RESET ALL'; },3000); return; }
  armed=0; b.textContent='RESET ALL'; ST={v:{},n:{}}; save(); for(const i in ROWS){ ROWS[i].input.value=fmt(ROWS[i].base); paint(i); } document.querySelectorAll('.note textarea').forEach(t=>t.value=''); refresh(); });

const app=$('#app'); $('#h1').textContent=DATA.title.toUpperCase();
if(DATA.kind==='pets'){
  $('#lead').innerHTML='All '+DATA.pets.length+' pets, read from the game as it is today (v'+esc(DATA.cv)+'). Tap a pet, change any number, and it is saved here. Nothing changes in the game until you press <b>COPY MY CHANGES</b> and paste it in Discord. Distances are the game\'s own: <b>28 = one metre</b>. Times are seconds.';
  const tools=$('#tools'); tools.innerHTML='<select id="jump" aria-label="Go to a pet"><option value="">Go to a pet…</option>'+DATA.pets.map(p=>'<option value="'+p.k+'">'+esc(p.name)+'</option>').join('')+'</select> <button class="btn ghost" id="openall">OPEN ALL</button>';
  const G=[['damage','DAMAGE'],['health','HEALTH AND HEALING'],['effects','EFFECTS: reach, timing, slows, the upgraded steps']];
  const allc=el('div','card'); const ar=el('div','rows'); ar.appendChild(el('div','gh','EVERY PET')); for(const r of DATA.all) ar.appendChild(mkRow('all|'+r.id,r,'EVERY PET')); allc.appendChild(ar); app.appendChild(allc);
  for(const p of DATA.pets){
    const d=el('details','card pet'); d.id='p-'+p.k;
    d.innerHTML='<summary>'+(p.img?'<img alt="" decoding="async" src="'+p.img+'">':'')+'<div class="pn"><b>'+esc(p.name)+'</b>'+(p.live?'':'<span class="dark" style="display:inline">not live yet</span>')+'<span>'+esc(p.line||p.door)+'</span></div><span class="chip" id="chip-'+p.k+'" hidden></span><span class="arrow">▶</span></summary>';
    if(p.lv.length){ const w=el('div','wrap'); w.innerHTML='<table class="lvt"><tr><th>WHAT HE DOES TODAY</th><th>level 1</th><th>level 50</th><th>level 100</th></tr>'+p.lv.map(x=>'<tr'+(x.hp?' class="hp"':'')+'><td>'+esc(x.label)+'</td>'+x.v.map(v=>'<td>'+fmt(v)+'</td>').join('')+'</tr>').join('')+'</table>'; d.appendChild(w); }
    const rows=el('div','rows'); for(const [g,h] of G){ const rs=p.rows.filter(r=>r.g===g); if(!rs.length) continue; rows.appendChild(el('div','gh',h)); for(const r of rs) rows.appendChild(mkRow(p.k+'|'+r.id,r,p.name)); } d.appendChild(rows);
    if(p.lad.length){ const l=el('details','lad'); l.innerHTML='<summary>His upgrades every ten levels</summary><ul>'+p.lad.map(x=>'<li><b>'+x.lv+' · '+esc(x.name)+'</b>'+(x.pa?' ('+esc(x.pa)+')':'')+': '+esc(x.line)+'</li>').join('')+'</ul>'; d.appendChild(l); }
    const n=el('div','note'); n.innerHTML='<textarea placeholder="Anything else to change about '+esc(p.name)+', in your own words" aria-label="A note about '+esc(p.name)+'"></textarea>'; const ta=$('textarea',n); ta.value=ST.n[p.name]||''; ta.addEventListener('input',()=>{ ST.n[p.name]=ta.value; save(); refresh(); }); d.appendChild(n);
    app.appendChild(d);
  }
  $('#jump').addEventListener('change',e=>{ const k=e.target.value; if(!k) return; const d=$('#p-'+k); d.open=true; d.scrollIntoView({block:'start'}); window.scrollBy(0,-70); e.target.value=''; });
  let all=0; $('#openall').addEventListener('click',e=>{ all=!all; document.querySelectorAll('details.pet').forEach(d=>d.open=all); e.target.textContent=all?'CLOSE ALL':'OPEN ALL'; });
  for(const p of DATA.pets) if(Object.keys(ST.v).some(i=>i.indexOf(p.k+'|')===0)||(ST.n[p.name]||'').trim()) $('#p-'+p.k).open=true;
} else {
  $('#lead').innerHTML='Every dog-tag number, read from the game as it is today (v'+esc(DATA.cv)+'): what things cost, what a kill pays, and what each kind of fight pours into the purse. Change any number and the box below shows what it adds up to. Nothing changes in the game until you press <b>COPY MY CHANGES</b> and paste it in Discord.';
  const s=el('div','sum'); s.innerHTML='<b>WHAT IT ADDS UP TO</b> <span class="tiny">dog tags a minute from the paycheck alone, kills not counted</span><div class="wrap"><table id="sumt"></table></div>'; app.appendChild(s);
  for(const sec of DATA.sections){ app.appendChild(el('h2','',esc(sec.h))); if(sec.sub) app.appendChild(el('p','sub',esc(sec.sub))); const c=el('div','card'), rs=el('div','rows'); for(const r of sec.rows) rs.appendChild(mkRow(r.id,r,sec.h)); c.appendChild(rs); app.appendChild(c); }
}
function sums(){
  const calc=g=>{ const R=Math.round, m=(tick,t)=>R(tick*60/t);
    return [['Campaign, playing alone',m(R(g('base')*g('p1')),g('campT'))],['Campaign, 4 friends (each)',m(R(g('base')*g('p4')*g('grp')),g('campT'))],
      ['Battlefields 1v1, regular map',m(R(g('base')*g('v1')*g('mReg')*g('p1')),g('bfT'))],['Battlefields 2v2, regular map',m(R(g('base')*g('team')*g('mReg')*g('p2')),g('bfT'))],
      ['Battlefields 2v2, long map',m(R(g('base')*g('team')*g('mLong')*g('p2')),g('bfT'))],
      ['Desert / Tundra team fight (with its pour)',R(R(g('base')*g('team')*g('mWest')*g('dX'))*60/g('bfT')+R(g('dPour')*g('team')*g('mWest')*g('dX'))*60/g('dT'))],
      ["Mom's raid: the pour",m(g('momP'),g('momT'))],['Top hat',m(g('hat'),g('hatT'))],
      ['A rifleman kill, 1v1 regular map (tags)',R(g('bounty.rifleman')*g('v1')*g('mReg'))],['A tank kill, team fight regular map (tags)',R(g('bounty.bftank')*g('team')*g('mReg'))]]; };
  const A=calc(i=>ROWS[i].base), B=calc(cur);
  $('#sumt').innerHTML='<tr><th>Kind of fight</th><th>today</th><th>with your changes</th></tr>'+A.map((a,i)=>{ const b=B[i][1], c=b>a[1]?'up':b<a[1]?'dn':''; return '<tr><td>'+esc(a[0])+'</td><td>'+fmt(a[1])+'</td><td class="d '+c+'">'+fmt(b)+(c?' ('+(b>a[1]?'+':'')+fmt(b-a[1])+')':'')+'</td></tr>'; }).join('');
}
$('#foot').textContent='Read from Green vs Tan v'+DATA.cv+'. Your changes are kept on this device only.';
refresh();
</script></body></html>
