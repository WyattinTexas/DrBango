<style>

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink)}

.btn.ghost{background:transparent;color:var(--green)}.btn:disabled{opacity:.45;cursor:default}

.rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));column-gap:22px;padding:4px 14px 10px}
.row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);min-height:52px}
.row .l{flex:1;min-width:0}.row .l b{font-weight:600;display:block;overflow-wrap:anywhere}.row .l small{color:var(--mute);font-size:12.5px;font-family:ui-monospace,Menlo,monospace;overflow-wrap:anywhere}
.row .was{color:var(--mute);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}

.dark{border:1px solid var(--line);border-radius:99px;padding:1px 9px;font-size:12.5px;color:var(--mute);margin-left:6px;white-space:nowrap}
.arrow{color:var(--mute);font-size:14px;transition:transform .15s}details[open]>summary .arrow{transform:rotate(90deg)}

.glance .vb{color:var(--mute);font-size:13px;margin-left:6px}.glance .up{color:var(--green);font-weight:800}.glance .dn{color:var(--red);font-weight:800}.glance tr.ch .up,.glance tr.ch .dn{color:inherit}

.nohit{margin:8px 14px 0;color:var(--mute);font-size:14.5px}
@media (max-width:600px){.bar{gap:6px;padding:6px 0;padding-top:calc(6px + env(safe-area-inset-top,0px))}.count{font-size:15px;flex-basis:100%;margin:0}.bar .btn{padding:7px 7px;font-size:12.5px;border-radius:9px}.bar select{padding:7px 4px;font-size:13.5px;max-width:102px}#openall{display:none}h1{font-size:25px}}

","label":"Start purse: Mom's raid","v":260,"code":"MOM_TAGS","hint":""},{"id":"momP","label":"Mom's raid: pour (tags)","v":20,"code":"","hint":""},{"id":"momT","label":"Mom's raid: pour every (s)","v":5,"code":"","hint":""},{"id":"mom3","label":"Mom's raid, round 3 and up: kills \u00d7","v":1.5,"code":"momP3TagX","hint":""},{"id":"sRoom","label":"Start purse: Defend the Room","v":240,"code":"","hint":""},{"id":"room","label":"Defend the Room: tags a wave cleared","v":30,"code":"","hint":""}]}]};
const KEY='gvt-tune-'+DATA.kind+'-v1'; let ST={v:{},n:{},c:{}};

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=v=>{ if(typeof v!=='number'||!isFinite(v)) return String(v); return String(+v.toFixed(4)); };
const ROWS={};   // full id → {row, base, where, el, input}
function stepOf(v){ const a=Math.abs(v); if(Number.isInteger(v)) return a>=200?10:a>=40?5:1; return a<1?0.05:a<10?0.1:0.5; }
function cur(id){ const r=ROWS[id]; return (id in ST.v)? ST.v[id] : r.base; }
function mkRow(fid,row,where){

function paint(fid){ const r=ROWS[fid], on=fid in ST.v; if(r.draw) return r.draw(); r.el.classList.toggle('ch',on); $('.was',r.el).textContent=on?'was '+fmt(r.base):''; }
function nEdits(){ let n=Object.keys(ST.v).filter(i=>ROWS[i]).length+Object.keys(ST.n).filter(k=>ST.n[k]&&ST.n[k].trim()).length; for(const g of CUR) n+=g.edits(); return n; }
function changesText(){
  const G={}, order=[], add=(w,l)=>{ if(!G[w]){ G[w]=[]; order.push(w); } G[w].push(l); };

  for(const i of Object.keys(ROWS)){ if(!(i in ST.v)) continue; const r=ROWS[i]; add(r.where,'- '+r.row.label+(r.row.code?' ['+r.row.code+']':'')+': '+fmt(r.base)+' -> '+fmt(ST.v[i])); }
  const notes=Object.keys(ST.n).filter(k=>ST.n[k]&&ST.n[k].trim()), n=nEdits();

  for(const k of notes){ L.push(''); L.push('NOTE · '+k+': '+ST.n[k].trim()); }
