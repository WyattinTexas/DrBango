<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- Green vs Tan: A DAY IN THE LIFE OF A TAN SOLDIER, the Tan Army's own PSA. The film, on the whole screen: the wide cut when the screen is wide, the upright cut when it is tall. -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>A Day in the Life of a Tan Soldier · Green vs Tan</title>
<meta property="og:title" content="A Day in the Life of a Tan Soldier">
<meta property="og:description" content="They call us the bad guys? Come spend a day with one. A Tan Army film.">
<meta property="og:type" content="video.other">
<meta property="og:image" content="https://playgvt.net/tan-psa.jpg">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
video{position:fixed;left:0;top:0;width:100%;height:100%;object-fit:contain;background:#000}
</style></head>
<body>
<video id="v" controls playsinline preload="metadata" poster="tan-psa.jpg"></video>
<script>
(function(){
  var v=document.getElementById('v'), tall=window.matchMedia('(orientation: portrait)');
  function pick(){
    var want=tall.matches? 'tan-psa-tall.mp4' : 'tan-psa.mp4';
    if(v.getAttribute('data-film')===want) return;
    var t=v.currentTime||0, going=!v.paused&&!v.ended;
    v.setAttribute('data-film',want); v.src=want;
    if(t>0){ var once=function(){ v.removeEventListener('loadedmetadata',once); try{ v.currentTime=t; }catch(e){} if(going){ var p=v.play(); if(p&&p.catch) p.catch(function(){}); } }; v.addEventListener('loadedmetadata',once); }
  }
  pick();
  if(tall.addEventListener) tall.addEventListener('change',pick); else if(tall.addListener) tall.addListener(pick);
})();
</script>
</body></html>
