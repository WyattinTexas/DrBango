<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8DC063">
<title>Green vs Tan · Landscape</title>
<!-- CARD-PUP (J3, 11/4/2026): THE UPGRADE PLAYABLE, Isaac's design, a kit prototype for his go. The game's own drawings (HEAD v29.72). -->
<style>
:root{ --ox:0px; --cw:100vw; --f:"Avenir Next Condensed","Arial Narrow","Roboto Condensed","Helvetica Neue",Arial,sans-serif;
  --ink:#151a16; --gold:#ffd24a; --cream:#fff6dc; --trayH:116px; }
html,body{ margin:0; height:100%; overflow:hidden; background:#8DC063; touch-action:none; overscroll-behavior:none;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; }
#cv{ position:fixed; left:0; top:0; width:100vw; height:100vh; height:100dvh; display:block; }
#hud{ position:fixed; top:0; bottom:0; left:var(--ox); width:var(--cw); pointer-events:none; font-family:var(--f); font-weight:800; color:#fff; }
.ol{ text-shadow:0 2px 0 var(--ink), 1.5px 0 0 var(--ink), -1.5px 0 0 var(--ink), 0 -1.5px 0 var(--ink), 1px 1px 0 var(--ink), -1px 1px 0 var(--ink), 1px -1px 0 var(--ink), -1px -1px 0 var(--ink); }
button{ font:inherit; color:inherit; border:0; margin:0; padding:0; background:none; -webkit-appearance:none; appearance:none; cursor:pointer; touch-action:manipulation; }

/* THE STORE DOOR: the app icon and PLAY NOW, top left (the screenshot's plate) */
#plate{ position:absolute; top:calc(env(safe-area-inset-top,0px) + 10px + var(--tabsH,0px)); left:10px; display:flex; flex-direction:column; align-items:center; gap:5px; pointer-events:auto; }
#icon{ width:52px; height:52px; border-radius:12px; box-shadow:0 0 0 2px rgba(20,30,16,.75), 0 3px 6px rgba(0,0,0,.3); display:block; }
#playNow{ font-size:12px; letter-spacing:.4px; padding:3px 9px 2px; border-radius:7px; background:linear-gradient(#63a64b,#3d742e); border:2px solid #1d3a15; box-shadow:0 2px 0 #1d3a15; }

/* ABOVE THE TROOPS: the dog tags (left), the eliminations bar (right) */
#row{ position:absolute; left:8px; right:8px; bottom:calc(env(safe-area-inset-bottom,0px) + var(--trayH) + 18px); height:44px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
#purse{ height:40px; min-width:88px; padding:0 14px 0 6px; box-sizing:border-box; border-radius:14px; background:rgba(22,26,24,.86); display:flex; align-items:center; gap:6px; font-size:25px; box-shadow:0 2px 0 rgba(0,0,0,.25); }
#purse img{ width:42px; height:38px; display:block; }
#purse b{ font-weight:800; display:inline-block; min-width:2ch; }
#elim{ flex:0 1 59%; display:flex; align-items:center; position:relative; height:44px; }
#elimBadge{ position:relative; z-index:2; width:44px; height:44px; flex:none; border-radius:50%; box-sizing:border-box; border:3px solid #352406;
  background:radial-gradient(circle at 34% 28%, #fff8c2 0%, #ffd94a 38%, #f0a619 74%, #c97c0a 100%); box-shadow:0 2px 0 rgba(0,0,0,.35), inset 0 -3px 0 rgba(120,60,0,.35); display:flex; align-items:center; justify-content:center; }
#elimBadge svg{ width:30px; height:30px; display:block; }
#elimTrack{ position:relative; flex:1; height:26px; margin-left:-14px; border-radius:0 13px 13px 0; background:#0f1a22; border:2.5px solid #070c10; border-left:0; overflow:hidden; box-shadow:0 2px 0 rgba(0,0,0,.25); }
#elimFill{ position:absolute; left:0; top:0; bottom:0; width:0; background:linear-gradient(180deg,#fffdf2 0%,#f6e7bd 60%,#e9d39a 100%); }
#elimTrack.max #elimFill{ background:linear-gradient(180deg,#fff3a0 0%,#ffd23f 55%,#e3a10f 100%); }
#elimTxt{ position:absolute; left:14px; right:4px; top:0; bottom:0; display:flex; align-items:center; justify-content:center; font-size:14.5px; letter-spacing:.3px; white-space:nowrap; }

/* THE TROOPS: four cards across the bottom, over the lawn (no band behind them) */
#tray{ position:absolute; left:8px; right:8px; bottom:calc(env(safe-area-inset-bottom,0px) + 10px); height:var(--trayH); display:grid; grid-template-columns:repeat(4,1fr); gap:6px; pointer-events:auto; }
.card{ position:relative; border-radius:13px; background:linear-gradient(180deg,#2d3531 0%,#1c2220 100%); border:2px solid #3e4a42; box-shadow:0 3px 0 rgba(0,0,0,.38);
  display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:7px 2px 6px; box-sizing:border-box; overflow:hidden; }
.card .nm{ font-size:14px; letter-spacing:.2px; white-space:nowrap; }
.card .art{ height:58px; width:auto; max-width:94%; display:block; object-fit:contain; filter:drop-shadow(0 2px 0 rgba(0,0,0,.25)); }
.card .pr{ font-size:23px; line-height:1; }
.card .pr.sm{ font-size:15px; letter-spacing:.3px; padding-top:5px; }
.card.no .art{ opacity:.45; } .card.no .pr{ color:#ff9b86; }
.card.busy .art{ opacity:.5; }
.card.press{ transform:scale(.93); }
.card .chip{ position:absolute; top:30px; right:5px; width:18px; height:18px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#fff3a0,#ffc82e 60%,#d58c0b); border:1.5px solid #3a2506; display:none; }
.card .chip svg{ width:14px; height:14px; margin:0 0 0 0; display:block; position:relative; left:0.5px; top:0.5px; }
.card.up .chip{ display:block; }
#tray.hide{ visibility:hidden; }

/* THE UPGRADE POP-UP: the fight is frozen behind it (?pop=tray: the choice rises in the tray and the fight runs) */
#pop{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; pointer-events:auto; background:rgba(8,16,8,.46); }
#pop.on{ display:flex; }
#popCard{ width:92%; max-width:384px; box-sizing:border-box; padding:14px 12px 14px; border-radius:24px; background:linear-gradient(180deg,#34442f 0%,#1b231a 100%);
  border:3px solid #d2ae4b; box-shadow:0 12px 34px rgba(0,0,0,.5), inset 0 0 0 2px rgba(255,255,255,.07); transform-origin:50% 60%; }
.popTop{ display:flex; align-items:center; justify-content:center; gap:10px; }
.popTop .bdg{ width:40px; height:40px; border-radius:50%; box-sizing:border-box; border:3px solid #352406; background:radial-gradient(circle at 34% 28%, #fff8c2 0%, #ffd94a 38%, #f0a619 74%, #c97c0a 100%); display:flex; align-items:center; justify-content:center; flex:none; }
.popTop .bdg svg{ width:27px; height:27px; }
#popTitle{ font-size:35px; color:var(--gold); letter-spacing:.5px; line-height:1; }
#popSub{ text-align:center; font-size:15px; color:#efe6c6; margin-top:4px; letter-spacing:1px; }
.choices{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:11px; }
.choice{ position:relative; border-radius:18px; padding:8px 4px 11px; box-sizing:border-box; overflow:hidden; display:flex; flex-direction:column; align-items:center;
  background:radial-gradient(circle at 50% 40%, rgba(255,232,140,.6) 0%, rgba(255,232,140,0) 60%), linear-gradient(180deg,#46603a 0%,#263322 100%); border:3px solid #9cbc63; box-shadow:0 4px 0 rgba(0,0,0,.35); }
.choice.blue{ background:radial-gradient(circle at 50% 40%, rgba(110,185,255,.7) 0%, rgba(110,185,255,0) 62%), linear-gradient(180deg,#22405f 0%,#111d2c 100%); border-color:#4DA6FF; }
.choice.red{ background:radial-gradient(circle at 50% 40%, rgba(255,95,95,.66) 0%, rgba(255,95,95,0) 62%), linear-gradient(180deg,#56211f 0%,#2a1111 100%); border-color:#FF4D4D; }
.choice .cArt{ height:128px; width:100%; display:flex; align-items:flex-end; justify-content:center; }
.choice .cArt img{ height:122px; width:auto; display:block; filter:drop-shadow(0 4px 2px rgba(0,0,0,.35)); }
.choice .cName{ font-size:23px; margin-top:4px; line-height:1.05; text-align:center; }
.choice .cLine{ font-size:15px; color:#ffe9a8; margin-top:3px; letter-spacing:.6px; }
.choice.blue .cLine{ color:#bfe0ff; } .choice.red .cLine{ color:#ffc4c4; }
.choice .shine{ position:absolute; top:-20%; bottom:-20%; width:36%; left:-60%; background:linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.28) 50%, rgba(255,255,255,0) 100%); transform:skewX(-14deg); pointer-events:none; }
.choice.picked{ border-color:#fff; box-shadow:0 0 0 3px rgba(255,255,255,.5), 0 4px 0 rgba(0,0,0,.35); }
.choice.gone{ opacity:.25; }
/* the tray seat for the choice (?pop=tray) */
#pop.tray{ inset:auto 0 calc(env(safe-area-inset-bottom,0px) + 4px) 0; height:auto; background:none; align-items:flex-end; }
#pop.tray #popCard{ width:calc(100% - 12px); max-width:none; padding:8px 8px 8px; border-radius:18px; min-height:calc(var(--trayH) + 52px); box-sizing:border-box; }
#pop.tray #popTitle{ font-size:24px; } #pop.tray .popTop .bdg{ width:30px; height:30px; } #pop.tray .popTop .bdg svg{ width:20px; height:20px; }
#pop.tray #popSub{ display:none; } #pop.tray .choices{ margin-top:6px; }
#pop.tray .choice{ flex-direction:row; padding:4px 6px; gap:6px; justify-content:flex-start; }
#pop.tray .choice .cArt{ height:74px; width:62px; flex:none; } #pop.tray .choice .cArt img{ height:70px; }
#pop.tray .choice .cTxt{ display:flex; flex-direction:column; align-items:flex-start; } #pop.tray .choice .cName{ font-size:18px; text-align:left; } #pop.tray .choice .cLine{ font-size:13px; }

/* LANDSCAPE: the field a tall column in the middle; the dog tags and the bar on the left, the four troops two by two on the right */
html.land #hud{ left:0; width:100vw; }
html.land #row{ left:12px; right:auto; bottom:calc(env(safe-area-inset-bottom,0px) + 14px); width:calc(var(--side) - 24px); height:auto; flex-direction:column; align-items:stretch; gap:10px; }
html.land #purse{ align-self:flex-start; } html.land #elim{ flex:none; width:100%; }
html.land #tray{ left:auto; right:12px; bottom:calc(env(safe-area-inset-bottom,0px) + 14px); width:calc(var(--side) - 24px); height:calc(var(--trayH) * 2 + 6px); grid-template-columns:repeat(2,1fr); grid-template-rows:repeat(2,1fr); }
html.land #pop.tray{ left:auto; right:6px; width:calc(var(--side) - 12px); }

/* THE GLOVE (the game's vector glove) */
#hand{ position:absolute; left:0; top:0; width:62px; height:78px; pointer-events:none; z-index:50; display:none; transform-origin:35.4% 13.3%; }
#hand svg{ width:100%; height:100%; display:block; filter:drop-shadow(2px 4px 2px rgba(0,0,0,.28)); }

/* THE END: PLAY NOW over the live field, the fireworks above the fallen box */
#end{ position:absolute; left:0; right:0; top:50%; display:none; flex-direction:column; align-items:center; gap:12px; pointer-events:auto; transform-origin:50% 50%; transform:translateY(-50%); }   /* ROUND 6: centred in the middle */
/* ROUND 6 (Isaac 15:04): the red border when the player is hit: solid red at the screen's edges, fading away toward the centre; it flashes on every hit */
#hurt{ position:fixed; left:0; top:0; width:100vw; height:100vh; height:100dvh; pointer-events:none; opacity:0;
  background:radial-gradient(ellipse closest-side at 50% 50%, rgba(214,26,26,0) 52%, rgba(214,26,26,0.45) 76%, rgba(200,14,14,0.85) 92%, rgba(190,10,10,1) 100%); }
#endWord.lose{ color:#ffd0c8; }
/* ROUND 5 (Isaac 14:45): 3 s after the end card pops up, a gray overlay comes over the whole battlefield so the end card is the focus */
#endDim{ position:fixed; left:0; top:0; width:100vw; height:100vh; height:100dvh; background:rgba(26,29,26,0.64); opacity:0; pointer-events:none; }
#end.on{ display:flex; }
#endIcon{ width:62px; height:62px; border-radius:15px; box-shadow:0 0 0 3px rgba(20,30,16,.8), 0 6px 14px rgba(0,0,0,.35); }
#endBtn{ font-size:38px; letter-spacing:1px; padding:12px 36px 10px; border-radius:20px; color:#3b2600; background:linear-gradient(180deg,#fff08a 0%,#ffd23f 45%,#f2a91a 100%);
  border:3px solid #6b4600; box-shadow:0 6px 0 #6b4600, 0 14px 26px rgba(0,0,0,.35); text-shadow:0 1px 0 rgba(255,255,255,.6); }
#endWord{ font-size:30px; color:#fff; letter-spacing:1px; }
/* ROUND 11 (Isaac 20:58): PLAY NOW keeps flashing: a shine sweeps across it (its place set by the game's clock) */
.bshine{ position:absolute; top:-25%; bottom:-25%; left:0; width:30%; pointer-events:none; transform:translateX(-160%) skewX(-18deg);
  background:linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.75) 50%, rgba(255,255,255,0) 100%); }

/* ROUND 18 (Isaac 11/5 08:56): THE LANDSCAPE PLAYABLE (a design pass). The whole screen, edge to edge, nothing across the bottom but the cards (Wyatt 10/5):
   the troop cards float over the lawn at the bottom left, the dog tags and the eliminations bar in the row just above them (Isaac's own portrait layout, turned
   on its side), the store door top left. */
html.wide #hud{ left:0; width:100vw; }
html.wide #plate{ top:calc(env(safe-area-inset-top,0px) + 8px); left:calc(env(safe-area-inset-left,0px) + 10px); gap:4px; }
html.wide #icon{ width:40px; height:40px; border-radius:10px; }
html.wide #playNow{ font-size:10.5px; padding:2px 7px 1px; }
html.wide #tray{ left:calc(env(safe-area-inset-left,0px) + 10px); right:auto; bottom:calc(env(safe-area-inset-bottom,0px) + 6px); height:72px; width:auto; display:flex; gap:5px; }
html.wide .card{ width:70px; flex:none; padding:4px 1px 5px; border-radius:11px; }
html.wide .card .nm{ font-size:10.5px; letter-spacing:0; }
html.wide .card .art{ height:35px; }
html.wide .card .pr{ font-size:17px; } html.wide .card .pr.sm{ font-size:10px; padding-top:3px; }
html.wide .card .chip{ top:17px; right:3px; width:14px; height:14px; } html.wide .card .chip svg{ width:11px; height:11px; }
html.wide #row{ left:calc(env(safe-area-inset-left,0px) + 10px); right:auto; width:var(--trayW,450px); bottom:calc(env(safe-area-inset-bottom,0px) + 6px + 72px + 6px); height:34px; }
html.wide #purse{ height:32px; min-width:70px; font-size:20px; padding:0 10px 0 4px; border-radius:11px; } html.wide #purse img{ width:32px; height:29px; }
html.wide #elim{ flex:0 1 64%; height:34px; } html.wide #elimBadge{ width:34px; height:34px; border-width:2.5px; } html.wide #elimBadge svg{ width:22px; height:22px; }
html.wide #elimTrack{ height:20px; margin-left:-12px; } html.wide #elimTxt{ font-size:12px; left:12px; }
html.wide #popCard{ width:auto; max-width:520px; padding:10px 14px 12px; }
html.wide #popTitle{ font-size:27px; } html.wide #popSub{ font-size:13px; margin-top:2px; } html.wide .choices{ margin-top:8px; gap:12px; }
html.wide .choice{ width:200px; padding:6px 4px 8px; } html.wide .choice .cArt{ height:92px; } html.wide .choice .cArt img{ height:88px; }
html.wide .choice .cName{ font-size:19px; } html.wide .choice .cLine{ font-size:13px; }

/* ROUND 19 (Isaac 11/5 10:06): the difficulty tab top right (R18-Q3's REC); a phone held upright: TURN YOUR PHONE SIDEWAYS (the fight waits) */
html.wide #pop{ z-index:40; }   /* round 20 (Isaac 10:33): no arrow over the JETPACK card (the bar's badge showed through) */
#diffL{ position:fixed; z-index:60; top:calc(env(safe-area-inset-top,0px) + 8px); right:calc(env(safe-area-inset-right,0px) + 8px); margin:0; }
/* ROUND 24 (Isaac 12:09 + 12:19): the map tabs A B C D, top left beside the PLAY NOW plate (the difficulty well's twin; the difficulty stays top right) */
#mapL{ position:fixed; z-index:60; top:calc(env(safe-area-inset-top,0px) + 8px); left:calc(env(safe-area-inset-left,0px) + 88px); display:flex; align-items:center; gap:2px; height:34px; padding:0 3px; box-sizing:border-box; border-radius:11px; background:rgba(0,0,0,.38); border:2px solid rgba(255,255,255,.16); pointer-events:auto; }
#mapL .ltab{ flex:none; width:40px; min-width:0; height:24px; padding:0; border:0; border-radius:8px; background:transparent; color:#eef3e6; font-family:var(--f); font-size:15px; font-weight:800; display:flex; align-items:center; justify-content:center; gap:5px; cursor:pointer; pointer-events:auto; -webkit-tap-highlight-color:transparent; }
#mapL .ltab i{ width:11px; height:11px; border-radius:3px; display:block; flex:none; box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.35); }
#mapL .ltab.on{ background:linear-gradient(180deg,#fff08a,#ffd23f 55%,#f2a91a); color:#3b2600; box-shadow:inset 0 0 0 1.5px #6b4600; }
#turn{ position:fixed; inset:0; z-index:200; display:none; flex-direction:column; align-items:center; justify-content:center; gap:20px; background:radial-gradient(circle at 50% 40%, #2c3b26 0%, #121a10 78%); color:#fff; font-family:var(--f); font-weight:800; }
html.portrait #turn{ display:flex; }
#white{ position:fixed; inset:0; z-index:5; pointer-events:none; background:#fff; opacity:0; }
#turn .tphone{ width:62px; height:108px; border-radius:14px; border:5px solid #fff; box-sizing:border-box; position:relative; animation:tturn 1.9s ease-in-out infinite; }
#turn .tphone::after{ content:''; position:absolute; left:50%; bottom:6px; width:14px; height:4px; margin-left:-7px; border-radius:2px; background:#fff; }
#turn .ttxt{ font-size:23px; letter-spacing:.6px; text-align:center; padding:0 28px; line-height:1.15; }
@keyframes tturn{ 0%,22%{ transform:rotate(0deg); } 55%,100%{ transform:rotate(-90deg); } }
/* ROUND 10 (Isaac 20:42): THE MAP TABS across the top (five maps, the same playable); the store door sits under them */
html.tabs{ --tabsH:46px; }
#mapTabs{ position:fixed; left:0; right:0; top:0; z-index:60; display:none; gap:6px; padding:calc(env(safe-area-inset-top,0px) + 6px) 8px 6px; box-sizing:border-box;
  background:linear-gradient(180deg, rgba(14,18,13,.94), rgba(14,18,13,.82)); box-shadow:0 2px 10px rgba(0,0,0,.35); font-family:var(--f); }
html.tabs #mapTabs{ display:flex; }
.mtab{ flex:1; min-width:0; height:34px; border-radius:10px; border:2px solid rgba(255,255,255,.16); background:rgba(255,255,255,.07); color:#eef3e6;
  font-size:13.5px; font-weight:800; letter-spacing:.05em; display:flex; align-items:center; justify-content:center; gap:5px; pointer-events:auto; white-space:nowrap; }
.mtab i{ width:12px; height:12px; border-radius:4px; display:block; flex:none; box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.35); }
.mtab.on{ background:linear-gradient(180deg,#fff08a,#ffd23f 55%,#f2a91a); color:#3b2600; border-color:#6b4600; }
/* ROUND 17 (Isaac 11/5 07:45): four map tabs, A B C D (each keeps its colour chip), and THE DIFFICULTY TAB at the top right: EASY · MEDIUM · HARD in one well,
   the lit one in the game's own tier metal (the tier rings: bronze #C08347, silver #C9CFD8, gold #E8C24A); the unlit two in their metal's ink */
.mtab{ font-size:17px; letter-spacing:0; gap:6px; }
.dtabs{ flex:none; display:flex; align-items:center; gap:2px; height:34px; padding:0 3px; box-sizing:border-box; border-radius:11px; margin-left:2px;
  background:rgba(0,0,0,.38); border:2px solid rgba(255,255,255,.16); pointer-events:auto; }
.dtab{ height:24px; padding:0 8px; border:0; border-radius:8px; background:transparent; font-family:var(--f); font-size:12.5px; font-weight:800; letter-spacing:.06em;
  white-space:nowrap; pointer-events:auto; cursor:pointer; -webkit-tap-highlight-color:transparent; }
.dtab.d-easy{ color:#E3A86C; } .dtab.d-medium{ color:#D9DEE5; } .dtab.d-hard{ color:#F2CF5A; }
.dtab.on{ text-shadow:0 1px 0 rgba(255,255,255,.45); }
.dtab.on.d-easy{ background:linear-gradient(180deg,#EDBB86,#C08347 58%,#93602E); color:#2a1606; box-shadow:inset 0 0 0 1.5px #5e3815; }
.dtab.on.d-medium{ background:linear-gradient(180deg,#FFFFFF,#C9CFD8 58%,#9AA3AF); color:#1d242d; box-shadow:inset 0 0 0 1.5px #4d5560; }
.dtab.on.d-hard{ background:linear-gradient(180deg,#FFF1A6,#E8C24A 58%,#B48C1C); color:#352300; box-shadow:inset 0 0 0 1.5px #6b4a00; }
@media (max-width:359px){ .dtab{ padding:0 5px; font-size:11px; letter-spacing:.03em; } .mtab i{ display:none; } }

/* ROUND 7 (Isaac 15:25): THE FIREWORKS OVER THE DIM, on the end screen's own layer (#fxcv: above the gray and the end screen's backdrop, under its words);
   and FIVE END SCREENS (?end=1..5) more Green vs Tan, for him to pick one. Each is the whole screen, nothing across the bottom (Wyatt 10/5). */
#fxcv{ position:fixed; left:0; top:0; width:100vw; height:100vh; height:100dvh; pointer-events:none; }
#endBack{ position:fixed; left:0; top:0; width:100vw; height:100vh; height:100dvh; pointer-events:none; display:none; overflow:hidden; }
#endBack.on{ display:block; }
#endBack > *{ position:absolute; }
#endV{ position:absolute; left:50%; top:50%; width:393px; height:760px; transform-origin:50% 50%; transform:translate(-50%,-50%); display:none; pointer-events:none; }
#endV.on{ display:block; }
#endV > *{ position:absolute; }
#endV .fw img{ display:block; width:100%; height:100%; filter:drop-shadow(0 4px 3px rgba(0,0,0,.35)); }
.evC{ left:0; width:393px; display:flex; justify-content:center; pointer-events:none; }
.evBtn{ position:relative; overflow:hidden; pointer-events:auto; font-size:38px; letter-spacing:1px; padding:12px 34px 10px; border-radius:20px; color:#3b2600; background:linear-gradient(180deg,#fff08a 0%,#ffd23f 45%,#f2a91a 100%);
  border:3px solid #6b4600; box-shadow:0 6px 0 #6b4600, 0 14px 26px rgba(0,0,0,.35); text-shadow:0 1px 0 rgba(255,255,255,.6); white-space:nowrap; opacity:0; }

    g.fill(); g.globalAlpha = 1;
  }
  function drawFloes(x0, w, t, spans) {   // ice floes on the winter moat: pale plates drifting down with the current, under the bridges like the duck
    ctx.save(); ctx.beginPath(); ctx.rect(x0 - 40, -200, w + 80, L.H + 400); for (const by of spans) ctx.rect(x0 - 40, by - LV.gw / 2, w + 80, LV.gw); ctx.clip('evenodd');
    const span = L.H + 120; ctx.lineWidth = 1; ctx.globalAlpha = 1;   // the glints before leave their own alpha on the pen
    for (let i = 0; i < 7; i++) { const y = -60 + ((i * 83.7 + t * 21) % span), x = x0 + w * (0.3 + 0.4 * ((i * 0.618) % 1)) + Math.sin(t * 0.8 + i) * 2, s = 4.5 + (i % 3) * 2;
      ctx.save(); ctx.translate(x, y); ctx.rotate(i * 1.3 + t * 0.05); ctx.fillStyle = 'rgba(240,246,252,0.94)'; ctx.strokeStyle = 'rgba(140,168,200,0.9)';
      ctx.beginPath(); ctx.moveTo(-s, -s * 0.4); ctx.lineTo(-s * 0.2, -s * 0.8); ctx.lineTo(s * 0.9, -s * 0.3); ctx.lineTo(s * 0.6, s * 0.6); ctx.lineTo(-s * 0.5, s * 0.7); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); }
    ctx.restore();
  }
  function buildMapL() {   // the map tabs A B C D: a dark well at the top left beside the PLAY NOW plate (the field there is clear of the road; under the difficulty
    // tab it hid tan's mortar crew in the courtyard), the twin of the difficulty well, each tab with its colour chip
    const m = document.createElement('div'); m.id = 'mapL'; m.setAttribute('role', 'tablist'); m.setAttribute('aria-label', 'Maps');
    m.innerHTML = MAP_IDS.map(id => '<button class="ltab" type="button" role="tab" data-map="' + id + '" aria-label="Map ' + MAP_LETTER[id] + '"><i style="background:' + MAP_SWATCH[id] + '"></i>' + MAP_LETTER[id] + '</button>').join('');
    for (const b of m.querySelectorAll('.ltab')) b.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); setMap(b.dataset.map); SFX.snap(); });
    document.body.appendChild(m); syncTabs();
  }

  // ---------------- BOOT ----------------
  let last = 0, MANUAL = false;
  function frame(ts) {
    if (MANUAL) return; if (L.portrait) { last = ts; requestAnimationFrame(frame); return; }   // round 19: the fight waits while the phone is held upright
    const dt = Math.min(0.05, last ? (ts - last) / 1000 : 0.016); last = ts;
    const sp = S.mode === 'win' ? 1 : SPEED;   // round 7: the end screen always at its own pace (a ?speed= demo reaches it sooner)
    try { tick(dt * sp); render(dt * sp); } catch (e) { S.stats.errs++; if (S.stats.errs < 4) console.error(e); }
    requestAnimationFrame(frame);
  }
  function start() {
    const tu = tagURI(40); $('tagIco').src = tu; $('icon').src = ART.icon; $('endIcon').src = ART.icon;
    $('hand').innerHTML = '<svg viewBox="0 0 192 240">' + ART.glove + '</svg>';
    S.stats.diff = DIFF; buildTabs(); buildTray(); layout();   // round 10: the tabs first (the store door sits under them; layout reads it) · round 17: the difficulty it opened on
    // frame one is the live field: their first men are already on their way down the path
    for (const f of [0.50, 0.545, 0.59]) { const u = mkUnit('t', 'tanrifle', LV.camera ? sAtX(LV.view * f) : sAtX(LV.moat * (f + 0.12)), rr(-13, 13)); S.f.push(u); }   // round 18: the first three already on the lawn, in sight
    cannonStart(); buildDiffL(); buildMapL();   // round 19 · round 24: the map tabs (top left, beside the PLAY NOW plate)
    S.mode = 'play'; if (OPENER) showOpener(); syncHUD(0);   // round 8: THE FACE-OFF opens the playable
    $('playNow').addEventListener('pointerdown', e => { e.preventDefault(); cta('plate'); });
    $('endBtn').addEventListener('pointerdown', e => { e.preventDefault(); if (S.endKind === 'lose') restart(); else cta('end'); });
    document.addEventListener('pointerdown', audioOn, { passive: true });
    window.addEventListener('resize', () => { try { layout(); evFit(); } catch (e) {} });
    requestAnimationFrame(frame);
  }
  window.PUP = {
    get S() { return S; }, get P() { return P; }, L, BOX, buy: tapCard, pick: pickChoice, cta,
    manual(on) { MANUAL = !!on; if (!on) { last = 0; requestAnimationFrame(frame); } },
    advance(dt, n) { for (let i = 0; i < (n || 1); i++) tick(dt); render(dt); },
    speed(x) { SPEED = x; },
    state() { const alive = a => a.filter(u => !u.dead); return { mode: S.mode, t: +S.t.toFixed(2), wall: +S.wall.toFixed(2), tags: Math.floor(S.tags), elim: S.elim, stage: S.stage, jet: S.jet, big: S.big, saber: S.saber,
      g: alive(S.g).map(u => u.type + (u.jet ? '+jet' : '') + (u.big ? '+big' : '') + (u.saber ? '+' + u.saber : '')), f: alive(S.f).length, box: +BOX.hp.toFixed(1), boxDead: BOX.dead, pick: S.pick ? { n: S.pick.n, chosen: S.pick.chosen } : null, cta: S.cta, stats: S.stats, len: +P.len.toFixed(0), entry: ENTRY,
      turrets: S.f.filter(u => u.fix && !u.dead).map(u => ({ seat: u.fixSeat, hp: +u.hp.toFixed(1), pop: +(u.pop || 0).toFixed(2), x: Math.round(u.x), y: Math.round(u.y) })), seats: TSEAT.map(t => [Math.round(t.x), Math.round(t.y)]),
      opener: OP.on ? +(S.wall - OP.t0).toFixed(2) : (OP.done ? 'done' : 'off'), openerStats: S.stats.opener || null,
      boxS: BOX_S, plen: +P.len.toFixed(0), endTap: S.stats.endTap == null ? null : S.stats.endTap, endV: EV.n, evOn: EV.on, evT: EV.on ? +(S.wall - S.endOn).toFixed(2) : null, fxDrawn: fxDirty, fw: S.fw.length,
      endKind: S.endKind, leaks: S.stats.leaks, hits: S.stats.hits, firstHit: S.stats.firstHit, defeatAt: S.stats.defeat, lastPlay: +S.lastPlay.toFixed(2), redT: +S.redT.toFixed(2),
      duck: S.duckY != null ? +S.duckY.toFixed(1) : null, maxTxt: document.getElementById('elimTxt').textContent,
      mapTabs: Array.from(document.querySelectorAll('#mapL .ltab')).map(b => b.textContent + (b.classList.contains('on') ? '*' : '')).join(' '), maps: S.stats.maps || null,
      cannon: LV.cannon ? { st: CN.st, free: S.stats.cannonFreeAt || null, mount: S.stats.cannonMount || null, manned: S.stats.cannonManned || null, fired: S.stats.cannonFired || null, hit: S.stats.cannonHit || null } : null, portrait: !!L.portrait, diff: DIFF,
      v: LVN, lv: LV.name, cam: +CAM.x.toFixed(1), troops: LV.troops, db: LV.drawbridge ? { up: DB.up, hp: +DB.hp.toFixed(1), max: DB.max, at: S.stats.dbDown || null } : null, map: MAP === 'lawn' ? 'original' : MAP, mapL: MAP_LETTER[MAP] || null, diff: DIFF, dk: DIFF_K[DIFF], boxMax: +BOX.max.toFixed(1), tabs: TABS ? Array.from(document.querySelectorAll('#mapTabs .mtab')).map(b => b.dataset.map + (b.classList.contains('on') ? '*' : '')).join(',') : null, endAt: S.stats.endAt, dimAt: S.stats.dimAt, dim: +(getComputedStyle(document.getElementById('endDim')).opacity), icon: (ART.icon || '').length, mortars: S.f.filter(u => u.type === 'tanmort').length, shells: S.rk.filter(r => r.lob).length,
      tide: S.tide.st, tiders: S.f.filter(f => f.tide && !f.dead).length,
      sarge: (S.sarge.unit && !S.sarge.unit.dead) ? { saber: S.sarge.unit.saber || null, st: S.sarge.unit.sb ? S.sarge.unit.sb.st : null, tkCd: +(S.sarge.unit.tkCd || 0).toFixed(2), x: Math.round(S.sarge.unit.x), y: Math.round(S.sarge.unit.y) } : null, tkReady: tkReady() }; },
    tk: () => tkCast(), restart, ev: EV, evv: EVV, op: OP, setMap, setDiff, DIFF_K, win: () => boxDown(), fwZone: () => fwZone(),   // win: the rigs' way to the end screen without a whole fight
  };
  loadArt().then(start);
})();
