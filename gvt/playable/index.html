<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8DC063">
<title>Green vs Tan · Playable</title>
<!-- CARD-PUP (J3, 11/4/2026): THE UPGRADE PLAYABLE, Isaac's design, a kit prototype for his go. The game's own drawings (HEAD v29.72). -->
<style>
:root{ --ox:0px; --cw:100vw; --f:"Avenir Next Condensed","Arial Narrow","Roboto Condensed","Helvetica Neue",Arial,sans-serif;
  --ink:#151a16; --gold:#ffd24a; --cream:#fff6dc; --trayH:116px; }
html,body{ margin:0; height:100%; overflow:hidden; background:#8DC063; touch-action:none; overscroll-behavior:none;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; }
#cv{ position:fixed; left:0; top:0; width:100vw; height:100vh; height:100dvh; display:block; }
#hud{ position:fixed; top:0; bottom:0; left:var(--ox); width:var(--cw); pointer-events:none; font-family:var(--f); font-weight:800; color:#fff; }
.ol{ text-shadow:0 2px 0 var(--ink), 1.5px 0 0 var(--ink), -1.5px 0 0 var(--ink), 0 -1.5px 0 var(--ink), 1px 1px 0 var(--ink), -1px 1px 0 var(--ink), 1px -1px 0 var(--ink), -1px -1px 0 var(--ink); }
button{ font:inherit; color:inherit; border:0; margin:0; padding:0; background:none; -webkit-appearance:none; appearance:none; cursor:pointer; touch-action:manipulation; }

/* THE STORE DOOR: the app icon and PLAY NOW, top left (the screenshot's plate) */
#plate{ position:absolute; top:calc(env(safe-area-inset-top,0px) + 10px); left:10px; display:flex; flex-direction:column; align-items:center; gap:5px; pointer-events:auto; }
#icon{ width:52px; height:52px; border-radius:12px; box-shadow:0 0 0 2px rgba(20,30,16,.75), 0 3px 6px rgba(0,0,0,.3); display:block; }
#playNow{ font-size:12px; letter-spacing:.4px; padding:3px 9px 2px; border-radius:7px; background:linear-gradient(#63a64b,#3d742e); border:2px solid #1d3a15; box-shadow:0 2px 0 #1d3a15; }

/* ABOVE THE TROOPS: the dog tags (left), the eliminations bar (right) */
#row{ position:absolute; left:8px; right:8px; bottom:calc(env(safe-area-inset-bottom,0px) + var(--trayH) + 18px); height:44px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
#purse{ height:40px; min-width:88px; padding:0 14px 0 6px; box-sizing:border-box; border-radius:14px; background:rgba(22,26,24,.86); display:flex; align-items:center; gap:6px; font-size:25px; box-shadow:0 2px 0 rgba(0,0,0,.25); }
#purse img{ width:42px; height:38px; display:block; }
#purse b{ font-weight:800; display:inline-block; min-width:2ch; }
#elim{ flex:0 1 59%; display:flex; align-items:center; position:relative; height:44px; }
#elimBadge{ position:relative; z-index:2; width:44px; height:44px; flex:none; border-radius:50%; box-sizing:border-box; border:3px solid #352406;
  background:radial-gradient(circle at 34% 28%, #fff8c2 0%, #ffd94a 38%, #f0a619 74%, #c97c0a 100%); box-shadow:0 2px 0 rgba(0,0,0,.35), inset 0 -3px 0 rgba(120,60,0,.35); display:flex; align-items:center; justify-content:center; }
#elimBadge svg{ width:30px; height:30px; display:block; }
#elimTrack{ position:relative; flex:1; height:26px; margin-left:-14px; border-radius:0 13px 13px 0; background:#0f1a22; border:2.5px solid #070c10; border-left:0; overflow:hidden; box-shadow:0 2px 0 rgba(0,0,0,.25); }
#elimFill{ position:absolute; left:0; top:0; bottom:0; width:0; background:linear-gradient(180deg,#fffdf2 0%,#f6e7bd 60%,#e9d39a 100%); }
#elimTrack.max #elimFill{ background:linear-gradient(180deg,#fff3a0 0%,#ffd23f 55%,#e3a10f 100%); }
#elimTxt{ position:absolute; left:14px; right:4px; top:0; bottom:0; display:flex; align-items:center; justify-content:center; font-size:14.5px; letter-spacing:.3px; white-space:nowrap; }

/* THE TROOPS: four cards across the bottom, over the lawn (no band behind them) */
#tray{ position:absolute; left:8px; right:8px; bottom:calc(env(safe-area-inset-bottom,0px) + 10px); height:var(--trayH); display:grid; grid-template-columns:repeat(4,1fr); gap:6px; pointer-events:auto; }
.card{ position:relative; border-radius:13px; background:linear-gradient(180deg,#2d3531 0%,#1c2220 100%); border:2px solid #3e4a42; box-shadow:0 3px 0 rgba(0,0,0,.38);
  display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:7px 2px 6px; box-sizing:border-box; overflow:hidden; }
.card .nm{ font-size:14px; letter-spacing:.2px; white-space:nowrap; }
.card .art{ height:58px; width:auto; max-width:94%; display:block; object-fit:contain; filter:drop-shadow(0 2px 0 rgba(0,0,0,.25)); }
.card .pr{ font-size:23px; line-height:1; }
.card .pr.sm{ font-size:15px; letter-spacing:.3px; padding-top:5px; }
.card.no .art{ opacity:.45; } .card.no .pr{ color:#ff9b86; }
.card.busy .art{ opacity:.5; }
.card.press{ transform:scale(.93); }
.card .chip{ position:absolute; top:30px; right:5px; width:18px; height:18px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#fff3a0,#ffc82e 60%,#d58c0b); border:1.5px solid #3a2506; display:none; }
.card .chip svg{ width:14px; height:14px; margin:0 0 0 0; display:block; position:relative; left:0.5px; top:0.5px; }
.card.up .chip{ display:block; }
#tray.hide{ visibility:hidden; }

/* THE UPGRADE POP-UP: the fight is frozen behind it (?pop=tray: the choice rises in the tray and the fight runs) */
#pop{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; pointer-events:auto; background:rgba(8,16,8,.46); }
#pop.on{ display:flex; }
#popCard{ width:92%; max-width:384px; box-sizing:border-box; padding:14px 12px 14px; border-radius:24px; background:linear-gradient(180deg,#34442f 0%,#1b231a 100%);
  border:3px solid #d2ae4b; box-shadow:0 12px 34px rgba(0,0,0,.5), inset 0 0 0 2px rgba(255,255,255,.07); transform-origin:50% 60%; }
.popTop{ display:flex; align-items:center; justify-content:center; gap:10px; }
.popTop .bdg{ width:40px; height:40px; border-radius:50%; box-sizing:border-box; border:3px solid #352406; background:radial-gradient(circle at 34% 28%, #fff8c2 0%, #ffd94a 38%, #f0a619 74%, #c97c0a 100%); display:flex; align-items:center; justify-content:center; flex:none; }
.popTop .bdg svg{ width:27px; height:27px; }
#popTitle{ font-size:35px; color:var(--gold); letter-spacing:.5px; line-height:1; }
#popSub{ text-align:center; font-size:15px; color:#efe6c6; margin-top:4px; letter-spacing:1px; }
.choices{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:11px; }
.choice{ position:relative; border-radius:18px; padding:8px 4px 11px; box-sizing:border-box; overflow:hidden; display:flex; flex-direction:column; align-items:center;
  background:radial-gradient(circle at 50% 40%, rgba(255,232,140,.6) 0%, rgba(255,232,140,0) 60%), linear-gradient(180deg,#46603a 0%,#263322 100%); border:3px solid #9cbc63; box-shadow:0 4px 0 rgba(0,0,0,.35); }
.choice.blue{ background:radial-gradient(circle at 50% 40%, rgba(110,185,255,.7) 0%, rgba(110,185,255,0) 62%), linear-gradient(180deg,#22405f 0%,#111d2c 100%); border-color:#4DA6FF; }
.choice.red{ background:radial-gradient(circle at 50% 40%, rgba(255,95,95,.66) 0%, rgba(255,95,95,0) 62%), linear-gradient(180deg,#56211f 0%,#2a1111 100%); border-color:#FF4D4D; }
.choice .cArt{ height:128px; width:100%; display:flex; align-items:flex-end; justify-content:center; }
.choice .cArt img{ height:122px; width:auto; display:block; filter:drop-shadow(0 4px 2px rgba(0,0,0,.35)); }
.choice .cName{ font-size:23px; margin-top:4px; line-height:1.05; text-align:center; }
.choice .cLine{ font-size:15px; color:#ffe9a8; margin-top:3px; letter-spacing:.6px; }
.choice.blue .cLine{ color:#bfe0ff; } .choice.red .cLine{ color:#ffc4c4; }
.choice .shine{ position:absolute; top:-20%; bottom:-20%; width:36%; left:-60%; background:linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.28) 50%, rgba(255,255,255,0) 100%); transform:skewX(-14deg); pointer-events:none; }
.choice.picked{ border-color:#fff; box-shadow:0 0 0 3px rgba(255,255,255,.5), 0 4px 0 rgba(0,0,0,.35); }
.choice.gone{ opacity:.25; }
/* the tray seat for the choice (?pop=tray) */
#pop.tray{ inset:auto 0 calc(env(safe-area-inset-bottom,0px) + 4px) 0; height:auto; background:none; align-items:flex-end; }
#pop.tray #popCard{ width:calc(100% - 12px); max-width:none; padding:8px 8px 8px; border-radius:18px; min-height:calc(var(--trayH) + 52px); box-sizing:border-box; }
#pop.tray #popTitle{ font-size:24px; } #pop.tray .popTop .bdg{ width:30px; height:30px; } #pop.tray .popTop .bdg svg{ width:20px; height:20px; }
#pop.tray #popSub{ display:none; } #pop.tray .choices{ margin-top:6px; }
#pop.tray .choice{ flex-direction:row; padding:4px 6px; gap:6px; justify-content:flex-start; }
#pop.tray .choice .cArt{ height:74px; width:62px; flex:none; } #pop.tray .choice .cArt img{ height:70px; }
#pop.tray .choice .cTxt{ display:flex; flex-direction:column; align-items:flex-start; } #pop.tray .choice .cName{ font-size:18px; text-align:left; } #pop.tray .choice .cLine{ font-size:13px; }

/* LANDSCAPE: the field a tall column in the middle; the dog tags and the bar on the left, the four troops two by two on the right */
html.land #hud{ left:0; width:100vw; }
html.land #row{ left:12px; right:auto; bottom:calc(env(safe-area-inset-bottom,0px) + 14px); width:calc(var(--side) - 24px); height:auto; flex-direction:column; align-items:stretch; gap:10px; }
html.land #purse{ align-self:flex-start; } html.land #elim{ flex:none; width:100%; }
html.land #tray{ left:auto; right:12px; bottom:calc(env(safe-area-inset-bottom,0px) + 14px); width:calc(var(--side) - 24px); height:calc(var(--trayH) * 2 + 6px); grid-template-columns:repeat(2,1fr); grid-template-rows:repeat(2,1fr); }
html.land #pop.tray{ left:auto; right:6px; width:calc(var(--side) - 12px); }

/* THE GLOVE (the game's vector glove) */
#hand{ position:absolute; left:0; top:0; width:62px; height:78px; pointer-events:none; z-index:50; display:none; transform-origin:35.4% 13.3%; }
#hand svg{ width:100%; height:100%; display:block; filter:drop-shadow(2px 4px 2px rgba(0,0,0,.28)); }

/* THE END: PLAY NOW over the live field, the fireworks above the fallen box */
#end{ position:absolute; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 54px); display:none; flex-direction:column; align-items:center; gap:12px; pointer-events:auto; }
#end.on{ display:flex; }
#endIcon{ width:62px; height:62px; border-radius:15px; box-shadow:0 0 0 3px rgba(20,30,16,.8), 0 6px 14px rgba(0,0,0,.35); }
#endBtn{ font-size:38px; letter-spacing:1px; padding:12px 36px 10px; border-radius:20px; color:#3b2600; background:linear-gradient(180deg,#fff08a 0%,#ffd23f 45%,#f2a91a 100%);
  border:3px solid #6b4600; box-shadow:0 6px 0 #6b4600, 0 14px 26px rgba(0,0,0,.35); text-shadow:0 1px 0 rgba(255,255,255,.6); }
#endWord{ font-size:30px; color:#fff; letter-spacing:1px; }
</style>
</head>

<canvas id="cv"></canvas>
<div id="hud">
  <div id="plate"><img id="icon" alt=""><button id="playNow" class="ol" type="button">PLAY NOW</button></div>
  <div id="row">
    <div id="purse" class="ol"><img id="tagIco" alt=""><b id="tags">90</b></div>
    <div id="elim">
      <div id="elimBadge"><svg viewBox="0 0 30 30"><path d="M15 3 L26 15 H19.5 V27 H10.5 V15 H4 Z" fill="#fff" stroke="#352406" stroke-width="2.6" stroke-linejoin="round"/></svg></div>
      <div id="elimTrack"><div id="elimFill"></div><span id="elimTxt" class="ol">ELIMINATIONS 0/5</span></div>
    </div>
  </div>
  <div id="tray"></div>
  <div id="pop"><div id="popCard">
    <div class="popTop"><span class="bdg"><svg viewBox="0 0 30 30"><path d="M15 3 L26 15 H19.5 V27 H10.5 V15 H4 Z" fill="#fff" stroke="#352406" stroke-width="2.6" stroke-linejoin="round"/></svg></span><span id="popTitle" class="ol">UPGRADE!</span></div>
    <div id="popSub" class="ol">TAP ONE</div>
    <div class="choices" id="choices"></div>
  </div></div>
  <div id="end"><img id="endIcon" alt=""><div id="endWord" class="ol">VICTORY!</div><button id="endBtn" type="button">PLAY NOW</button></div>
  <div id="hand"></div>
</div>

  }

  // ---------------- DRAWING ----------------
  function txt(s, x, y, size, col, align) { ctx.font = '800 ' + size + 'px ' + FONT; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(2.5, size * 0.24); ctx.strokeStyle = '#151a16'; ctx.strokeText(s, x, y); ctx.fillStyle = col; ctx.fillText(s, x, y); }
  function hpBar(x, y, f, side) { const w = 26, h = 4; ctx.fillStyle = 'rgba(20,20,20,0.75)'; ctx.fillRect(x - w / 2 - 1, y - 1, w + 2, h + 2); ctx.fillStyle = side === 'g' ? '#7ED957' : '#E8C27A'; ctx.fillRect(x - w / 2, y, w * clamp(f, 0, 1), h); }
  function drawUnit(u) {
    const a = artOf(u), vb = ART.vb[a], img = spr(a, UH * L.k * L.dpr); if (!img) return;
    const w = UH * vb[2] / vb[3]; let rot = 0, alpha = 1, sink = 0, lift = u.alt;
    if (u.dead) { const f = u.fallT; rot = u.fallDir * Math.min(1, f / 0.42) * 1.36; alpha = f < 0.45 ? 1 : Math.max(0, 1 - (f - 0.45) / 1.1); sink = Math.min(3, f * 6); if (u.fix) { rot = u.fallDir * Math.min(1, f / 0.5) * 0.35; sink = Math.min(12, f * 26); } }
    else {
      const hurt = 1 + (1 - u.hp / u.max) * 1.3, tt = S.t + u.sway; rot = (u.moving ? Math.sin(tt * 7) * 0.05 : Math.sin(tt * 2.6) * 0.022) * hurt;
      if (u.jet) { lift += Math.sin(tt * 3.1) * 2.4; rot = rot * 0.5 + (u.moving ? 0.08 * u.face : 0); }
      if (u.swingT > 0) rot += u.face * 0.26 * Math.sin((0.22 - u.swingT) / 0.22 * Math.PI);
    }
    ctx.save(); ctx.globalAlpha = alpha; ctx.translate(u.x, u.y - lift + sink); ctx.rotate(rot);
    if (u.jet && !u.dead) {   // the pack's flames under him
      const fl = 7 + Math.sin(S.wall * 40 + u.id) * 2.5 + (u.moving ? 4 : 0);
      for (const [nx, ny] of [[-7.6, -13.2], [-3.2, -12.4]]) {
        const x = nx * u.face; const g = ctx.createLinearGradient(0, ny, 0, ny + fl); g.addColorStop(0, 'rgba(255,240,170,0.95)'); g.addColorStop(0.45, 'rgba(255,154,61,0.9)'); g.addColorStop(1, 'rgba(255,90,30,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x - 2.4, ny); ctx.lineTo(x + 2.4, ny); ctx.lineTo(x, ny + fl); ctx.closePath(); ctx.fill();
      }
    }
    if (u.fix && !u.dead && u.pop < 1) ctx.scale(1, Math.max(0.03, easeBack(u.pop)));   // the turret rises out of its pit
    ctx.scale(u.face, 1); ctx.drawImage(img, -w * 0.5, -UH * 0.9, w, UH);
    if (u.hurtT > 0) { ctx.globalAlpha = alpha * u.hurtT / 0.12 * 0.35; ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(img, -w * 0.5, -UH * 0.9, w, UH); }
    ctx.restore();
    if (!u.dead && u.hp < u.max) hpBar(u.x, u.y - lift - UH * 1.0, u.hp / u.max, u.side);
  }
  function drawBox() {
    const b = BOX, img = spr('toybox', BH * L.k * L.dpr); if (!img) return;
    const jx = b.jolt ? (Math.random() - 0.5) * 3 * b.jolt : 0; let sq = 1, alpha = 0.55 + 0.45 * (b.hp / b.max);
    let lean = 0, sink = 0; if (b.dead) { const a = Math.min(1, (S.wall - b.deadAt) / 0.45); lean = -0.07 * a; sink = 5 * a; alpha = 0.62; }
    ctx.save(); ctx.translate(b.x + jx, b.y + sink); ctx.rotate(lean); ctx.globalAlpha = alpha; ctx.drawImage(img, -BW / 2, -BH * 0.9, BW, BH);
    if (b.flash > 0 && !b.dead) { ctx.globalAlpha = b.flash * 0.3; ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(img, -BW / 2, -BH * 0.9, BW, BH); ctx.globalCompositeOperation = 'source-over'; }
    ctx.globalAlpha = 1;
    // (round 3: no cracks, on Isaac's word)
    ctx.restore();
    // the flag over the box: tan, and green once it falls
    const px = b.x + 36, top = b.y - BH * 0.9 * sq - 40, base = b.y - BH * 0.55 * sq;
    ctx.strokeStyle = '#3b2a18'; ctx.lineWidth = 2.6; ctx.beginPath(); ctx.moveTo(px, base); ctx.lineTo(px, top); ctx.stroke();
    ctx.fillStyle = '#e8d9a8'; ctx.beginPath(); ctx.arc(px, top - 1, 2.6, 0, 7); ctx.fill();
    const pen = (col, y) => { const wv = Math.sin(S.wall * 6) * 2.2; ctx.fillStyle = col; ctx.strokeStyle = 'rgba(30,22,10,0.8)'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(px, y); ctx.quadraticCurveTo(px - 14, y + 4 + wv, px - 27, y + 8 + wv); ctx.quadraticCurveTo(px - 14, y + 12 + wv * 0.6, px, y + 16); ctx.closePath(); ctx.fill(); ctx.stroke(); };
    const span = base - top - 18;
    if (S.flagT < 0) pen('#C09E6C', top + 2);
    else { const d = Math.min(1, S.flagT / 0.25), up = clamp((S.flagT - 0.25) / 1.0, 0, 1); if (d < 1) pen('#C09E6C', top + 2 + span * d); pen('#5E8F3E', top + 2 + span * (1 - up * up * (3 - 2 * up))); }
  }
  function drawBoxBar() {
    if (BOX.dead) return; const b = BOX, w = 96, h = 11, x = b.x - 8 - w / 2, y = b.y - BH * 0.9 - 22;
    ctx.fillStyle = '#2a0b0b'; roundRect(x - 2, y - 2, w + 4, h + 4, 5); ctx.fill();
    ctx.fillStyle = '#4a1616'; roundRect(x, y, w, h, 4); ctx.fill();
    const f = b.hp / b.max; if (f > 0) { const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, '#ff7a6a'); g.addColorStop(0.5, '#e8382c'); g.addColorStop(1, '#b51d16'); ctx.fillStyle = g; roundRect(x, y, w * f, h, 4); ctx.fill(); }
    const hx = x + 8, hy = y - 11; ctx.save(); ctx.translate(hx, hy); ctx.fillStyle = '#e8352a'; ctx.strokeStyle = '#151a16'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, 6); ctx.bezierCurveTo(-9, -1, -6, -9, 0, -4); ctx.bezierCurveTo(6, -9, 9, -1, 0, 6); ctx.closePath(); ctx.stroke(); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.beginPath(); ctx.arc(-3, -3, 1.4, 0, 7); ctx.fill(); ctx.restore();
    txt(String(Math.ceil(b.hp / b.max * 10000)), hx + 11, hy, 16, '#ffffff', 'left');
  }
  function roundRect(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function drawFx() {
    for (const f of S.fx) {
      if (f.t < 0) continue; const k = f.t / f.dur;
      if (f.k === 'ring') { ctx.strokeStyle = f.col; ctx.globalAlpha = 1 - k; ctx.lineWidth = f.w || 2; ctx.beginPath(); ctx.ellipse(f.x, f.y, f.r + (f.R - f.r) * k, (f.r + (f.R - f.r) * k) * 0.55, 0, 0, 7); ctx.stroke(); }
      else if (f.k === 'puff') { ctx.fillStyle = f.col; ctx.globalAlpha = (f.a || 0.85) * (1 - k); ctx.beginPath(); ctx.arc(f.x, f.y - k * 6, f.R * (0.5 + 0.5 * k), 0, 7); ctx.fill(); }
      else if (f.k === 'flash') { const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.R); g.addColorStop(0, 'rgba(255,250,220,0.95)'); g.addColorStop(0.5, 'rgba(255,190,80,0.6)'); g.addColorStop(1, 'rgba(255,140,40,0)'); ctx.globalAlpha = 1 - k; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, f.y, f.R, 0, 7); ctx.fill(); }
      else if (f.k === 'debris') { ctx.globalAlpha = 1 - k; ctx.fillStyle = '#6b4a2e'; ctx.fillRect(f.x - 1.5, f.y - 1.5, 3, 3); }
      else if (f.k === 'tracer') { ctx.globalAlpha = 1 - k; ctx.strokeStyle = f.col; ctx.lineWidth = f.w; ctx.beginPath(); ctx.moveTo(f.x1, f.y1); ctx.lineTo(f.x2, f.y2); ctx.stroke(); }
      else if (f.k === 'lick') { const g = ctx.createLinearGradient(f.x1, f.y1, f.x2, f.y2); g.addColorStop(0, 'rgba(255,240,160,0.95)'); g.addColorStop(0.6, 'rgba(255,140,40,0.85)'); g.addColorStop(1, 'rgba(255,70,20,0.2)'); ctx.globalAlpha = 1 - k * k; ctx.strokeStyle = g; ctx.lineCap = 'round'; ctx.lineWidth = 6 * (1 - k * 0.5); ctx.beginPath(); ctx.moveTo(f.x1, f.y1); ctx.quadraticCurveTo((f.x1 + f.x2) / 2, Math.min(f.y1, f.y2) - 10, f.x2, f.y2); ctx.stroke(); }
      else if (f.k === 'spark') { ctx.globalAlpha = 1 - k; ctx.fillStyle = f.col; ctx.beginPath(); ctx.arc(f.x + (k * 10 - 5), f.y - k * 8, 2.4 * (1 - k) + 0.6, 0, 7); ctx.fill(); }
      else if (f.k === 'slash') {
        const a0 = -1.25, a1 = 0.75, R = 34, prog = Math.min(1, k * 1.6);
        ctx.save(); ctx.translate(f.x, f.y); ctx.scale(f.face, 1); ctx.globalAlpha = 1 - k; ctx.lineCap = 'round';
        ctx.strokeStyle = f.col; ctx.lineWidth = 9; ctx.globalAlpha = (1 - k) * 0.45; ctx.beginPath(); ctx.arc(0, 0, R, a0, a0 + (a1 - a0) * prog); ctx.stroke();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.6; ctx.globalAlpha = 1 - k; ctx.beginPath(); ctx.arc(0, 0, R, a0 + (a1 - a0) * prog * 0.35, a0 + (a1 - a0) * prog); ctx.stroke();
        ctx.restore();
      }
      else if (f.k === 'ghost') { const img = spr(f.art, UH * L.k * L.dpr), vb = ART.vb[f.art]; if (img) { const w = UH * vb[2] / vb[3]; ctx.save(); ctx.globalAlpha = 0.38 * (1 - k); ctx.translate(f.x, f.y); ctx.scale(f.face, 1); ctx.drawImage(img, -w * 0.5, -UH * 0.9, w, UH); ctx.restore(); } }
      else if (f.k === 'dome') { const u = f.u; if (u && !u.dead) { const R = f.R * Math.min(1, f.t / 0.08); ctx.globalAlpha = 0.18 * (1 - k * 0.5); ctx.fillStyle = f.col; ctx.beginPath(); ctx.ellipse(u.x, u.y - 16, R, R * 0.62, 0, 0, 7); ctx.fill(); ctx.globalAlpha = 0.9; ctx.strokeStyle = f.col; ctx.lineWidth = 3; ctx.stroke(); ctx.globalAlpha = 0.7; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.2; ctx.stroke(); } }
      else if (f.k === 'arc') { const R = 20 + (f.R - 20) * (1 - Math.pow(1 - k, 2)); ctx.save(); ctx.translate(f.x, f.y); ctx.scale(f.face, 0.62); ctx.globalAlpha = 0.85 * (1 - k); ctx.strokeStyle = f.col; ctx.lineCap = 'round'; ctx.lineWidth = 10; ctx.beginPath(); ctx.arc(0, 0, R, -Math.PI / 2, Math.PI / 2); ctx.stroke(); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, R, -Math.PI / 2, Math.PI / 2); ctx.stroke(); ctx.restore(); }
      else if (f.k === 'tag') { const b = f.t < 0.24 ? Math.sin(f.t / 0.24 * Math.PI) * 7 : 0; ctx.globalAlpha = 1; drawTag(ctx, f.x, f.y - 6 - b, 9); }
      ctx.globalAlpha = 1;
    }
    ctx.globalAlpha = 1; ctx.lineCap = 'butt';
  }
  function drawDecals() {
    for (const d of S.decals) { ctx.globalAlpha = 0.28 * (1 - d.t / 7); ctx.fillStyle = '#3a2a1a'; ctx.beginPath(); ctx.ellipse(d.x, d.y, d.R, d.R * 0.45, 0, 0, 7); ctx.fill(); }
    for (const u of S.f) if (u.fix) { ctx.globalAlpha = u.dead ? 0.22 : 0.34; ctx.fillStyle = '#3c2e1c'; ctx.beginPath(); ctx.ellipse(u.x, u.y + 2, 30, 8, 0, 0, 7); ctx.fill(); }   // the turret's pit
    for (const u of S.g) if (u.jet && u.alt > 2) { ctx.globalAlpha = 0.24 * (1 - Math.min(1, u.alt / 90)); ctx.fillStyle = '#1d2a12'; ctx.beginPath(); ctx.ellipse(u.x, u.y, 15, 4.5, 0, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  function drawRockets() {
    for (const r of S.rk) {
      const ang = Math.atan2(r.y - (r.py ?? r.sy), r.x - (r.px ?? r.sx - 1)), s = r.big ? 1.7 : 1;
      ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(ang); ctx.fillStyle = '#2a2f24'; ctx.strokeStyle = '#11140f'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(0, 0, 7 * s, 2.6 * s, 0, 0, 7); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#c7b38a'; ctx.beginPath(); ctx.ellipse(5.4 * s, 0, 2.4 * s, 2 * s, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,180,70,0.9)'; ctx.beginPath(); ctx.moveTo(-7 * s, -1.6 * s); ctx.lineTo(-13 * s - Math.random() * 3, 0); ctx.lineTo(-7 * s, 1.6 * s); ctx.fill();
      ctx.restore();
    }
  }
  function drawFloats() { for (const f of S.fl) { const k = f.t / f.dur; ctx.globalAlpha = k < 0.75 ? 1 : 1 - (k - 0.75) / 0.25; txt(f.txt, f.x, f.y - k * 26, f.size, f.col); } ctx.globalAlpha = 1; }
  function drawFireworks() {
    for (const p of S.fw) {
      if (p.k === 'shell') { ctx.fillStyle = '#fff6d0'; ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, 7); ctx.fill(); ctx.fillStyle = 'rgba(255,220,150,0.5)'; ctx.beginPath(); ctx.arc(p.x - p.vx * 0.02, p.y - p.vy * 0.02, 1.6, 0, 7); ctx.fill(); }
      else if (p.k === 'spark') { const k = p.t / p.dur; ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.9 * (1 - k * k); ctx.strokeStyle = p.col; ctx.lineCap = 'round'; ctx.lineWidth = 2.6 * (1 - k) + 0.9; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.07, p.y - p.vy * 0.07); ctx.stroke(); ctx.fillStyle = '#fffbe8'; ctx.beginPath(); ctx.arc(p.x, p.y, 1.6 * (1 - k) + 0.5, 0, 7); ctx.fill(); ctx.globalCompositeOperation = 'source-over'; ctx.lineCap = 'butt'; }
      else if (p.k === 'bloom') { const k = p.t / p.dur; const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 40); g.addColorStop(0, 'rgba(255,255,240,0.9)'); g.addColorStop(1, 'rgba(255,255,240,0)'); ctx.globalAlpha = 1 - k; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, 40, 0, 7); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
  }
  function render(dt) {
    const d = L.dpr, k = L.k; ctx.setTransform(1, 0, 0, 1, 0, 0); if (LAWN) ctx.drawImage(LAWN, 0, 0);
    const sh = (S.shake > 0 && !RM) ? S.shake * 5 : 0, sx = sh ? (Math.random() * 2 - 1) * sh : 0, sy = sh ? (Math.random() * 2 - 1) * sh : 0;
    ctx.setTransform(d * k, 0, 0, d * k, d * (L.ox + sx * k), d * sy * k);
    drawLongGrass(); drawDecals();
    const list = S.g.concat(S.f); list.push(BOX); list.sort((a, b) => (a.y - (a.alt > 8 ? 0.01 : 0)) - (b.y - (b.alt > 8 ? 0.01 : 0)));
    for (const e of list) e === BOX ? drawBox() : drawUnit(e);
    drawRockets(); drawFx(); drawFloats(); drawBoxBar(); drawFireworks();
    syncHUD(dt);
  }

  // ---------------- BOOT ----------------
  let last = 0, MANUAL = false;
  function frame(ts) {
    if (MANUAL) return; const dt = Math.min(0.05, last ? (ts - last) / 1000 : 0.016); last = ts;
    try { tick(dt * SPEED); render(dt * SPEED); } catch (e) { S.stats.errs++; if (S.stats.errs < 4) console.error(e); }
    requestAnimationFrame(frame);
  }
  function start() {
    const tu = tagURI(40); $('tagIco').src = tu; $('icon').src = ART.icon; $('endIcon').src = ART.icon;
    $('hand').innerHTML = '<svg viewBox="0 0 192 240">' + ART.glove + '</svg>';
    buildTray(); layout();
    // frame one is the live field: their first men are already on their way down the path
    for (const f of [0.50, 0.545, 0.59]) { const u = mkUnit('t', 'tanrifle', P.len * f, rr(-13, 13)); S.f.push(u); }
    S.mode = 'play'; syncHUD(0);
    $('playNow').addEventListener('pointerdown', e => { e.preventDefault(); cta('plate'); });
    $('endBtn').addEventListener('pointerdown', e => { e.preventDefault(); cta('end'); });
    document.addEventListener('pointerdown', audioOn, { passive: true });
    window.addEventListener('resize', () => { try { layout(); } catch (e) {} });
    requestAnimationFrame(frame);
  }
  window.PUP = {
    get S() { return S; }, L, BOX, buy: tapCard, pick: pickChoice, cta,
    manual(on) { MANUAL = !!on; if (!on) { last = 0; requestAnimationFrame(frame); } },
    advance(dt, n) { for (let i = 0; i < (n || 1); i++) tick(dt); render(dt); },
    speed(x) { SPEED = x; },
    state() { const alive = a => a.filter(u => !u.dead); return { mode: S.mode, t: +S.t.toFixed(2), wall: +S.wall.toFixed(2), tags: Math.floor(S.tags), elim: S.elim, stage: S.stage, jet: S.jet, big: S.big, saber: S.saber,
      g: alive(S.g).map(u => u.type + (u.jet ? '+jet' : '') + (u.big ? '+big' : '') + (u.saber ? '+' + u.saber : '')), f: alive(S.f).length, box: +BOX.hp.toFixed(1), boxDead: BOX.dead, pick: S.pick ? { n: S.pick.n, chosen: S.pick.chosen } : null, cta: S.cta, stats: S.stats, len: +P.len.toFixed(0), entry: ENTRY,
      turrets: S.f.filter(u => u.fix && !u.dead).map(u => ({ seat: u.fixSeat, hp: +u.hp.toFixed(1), pop: +(u.pop || 0).toFixed(2), x: Math.round(u.x), y: Math.round(u.y) })), seats: TSEAT.map(t => [Math.round(t.x), Math.round(t.y)]),
      tide: S.tide.st, tiders: S.f.filter(f => f.tide && !f.dead).length,
      sarge: (S.sarge.unit && !S.sarge.unit.dead) ? { saber: S.sarge.unit.saber || null, st: S.sarge.unit.sb ? S.sarge.unit.sb.st : null, tkCd: +(S.sarge.unit.tkCd || 0).toFixed(2), x: Math.round(S.sarge.unit.x), y: Math.round(S.sarge.unit.y) } : null, tkReady: tkReady() }; },
    tk: () => tkCast(),
  };
  loadArt().then(start);
})();
