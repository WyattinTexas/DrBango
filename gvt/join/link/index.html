<!-- CARD-QRL LINK YOUR OTHER PHONE (design/qr-login-1023/00-DESIGN-QRL.md; Layla by her jumpr guest link 10/23/2026 07:30 EDT: "lets make a QR code for logins. so like if you download the game on a
     new device you can scan the QR code with you phone so it will link both accounts easier"; Wyatt 15:09 EDT: "Set it live. I approve it"): the QR on THE CODE face (SETTINGS → ACCOUNT → LINK YOUR OTHER
     PHONE on the new device) is https://playgvt.net/join/link/?s=L7K3HMQ2, the eight-letter L-code in the squad field. A phone that HAS the app never sees this page: its camera opens the app
     (CARD-INV-B's /join/* universal link / App Link; the shell hands the game the code, and the game reads an L-code as a link code: LINK A NEW DEVICE?). A camera that opened the browser instead
     (a desk, an Android phone that never verified the App Link, an Amazon tablet) is sent by the one line of script to the WEB GAME with the code (../../?join=L7K3HMQ2, the game's own cold lane):
     no store detour, since whoever scans has the game somewhere. A preview fetcher (iMessage's identifies itself as facebookexternalhit / Twitterbot) is never redirected: it reads the tags and leaves.
     The same page stands at playgvt.net/join/link/ and drbango.com/gvt/join/link/ (the three host lines differ, nothing else). The kit: design/qr-login-1023/build-qrl/page/ (src/link.html is the one
     source; mk_page.py writes both copies). join/friend/ and join/index.html are byte-still. -->

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#1a1512}
body{font-family:'Arial Narrow',Impact,'Helvetica Neue',Arial,sans-serif;font-weight:800;color:#EDEADF;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));overflow:hidden;text-transform:uppercase;text-align:center;
  background:radial-gradient(ellipse at 50% 45%,#1C2C36 0%,#0C1014 72%)}
main{width:100%;max-width:440px}
.logo .g{font-size:clamp(64px,22vw,112px);line-height:.95;letter-spacing:.04em;color:#7FA35C;text-shadow:0 0 22px rgba(127,163,92,.55)}
.logo .vs{display:block;font-size:clamp(18px,6vw,30px);letter-spacing:.55em;padding-left:.55em;color:#EDEADF;margin:6px 0}
.logo .t{font-size:clamp(64px,22vw,112px);line-height:.95;letter-spacing:.06em;color:#D2B489;text-shadow:0 0 22px rgba(210,180,137,.5)}
.tag{margin:22px auto 18px;font-size:clamp(15px,4.6vw,20px);letter-spacing:.14em}
.row{display:flex;gap:12px;justify-content:center}
.btn{display:flex;align-items:center;justify-content:center;flex:1 1 0;min-width:0;min-height:64px;padding:12px 10px;border-radius:40px;text-decoration:none;
  font-size:clamp(15px,4.4vw,21px);letter-spacing:.08em;border:4px solid #FFF3C4;color:#2a2008;background:#FFD24A}

<main>
  <div class="logo"><span class="g">GREEN</span><span class="vs">vs</span><span class="t">TAN</span></div>
  <p class="tag">LINK YOUR OTHER PHONE</p>
  <div class="row"><a class="btn" id="go" href="../../">OPEN GREEN VS TAN</a></div>
</main>
<script>try{var m=location.search.match(/[?&]s=([A-Za-z0-9]{8})(?:&|$)/);if(m)document.getElementById('go').href='../../?join='+m[1].toUpperCase();}catch(e){}</script>
