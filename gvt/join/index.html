<!DOCTYPE html>

<head>
<meta charset="utf-8">

<!-- CARD-INV-W THE JOIN PAGE (design/squad-text-invite-1006/00-DESIGN-INV.md section 3.2): a text's link lands here. Messages reads the Open Graph tags
     below for its rich card (the sender's phone fetches this page at compose time); the one line of script hands the friend straight to the game with the
     squad's code (../?join=CODE&by=SENDER). A preview fetcher (iMessage's identifies itself as facebookexternalhit / Twitterbot) is never redirected: it reads
     the tags and leaves. The same page stands at playgvt.net/join/ and drbango.com/gvt/join/ (the three host lines differ, nothing else).
     The kit: design/squad-text-invite-1006/build-inv-w/ (src/join.html is the one source; mk_join.sh writes both mirrors' copies). -->
<title>Join my squad in Green vs Tan</title>
<meta name="description" content="Plastic army men. Real friends. One tap and you're in.">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Green vs Tan">
<meta property="og:title" content="Join my squad in Green vs Tan">
<meta property="og:description" content="Plastic army men. Real friends. One tap and you're in.">
<meta property="og:image" content="https://drbango.com/gvt/join/og.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A squad's countries on the globe in Green vs Tan">
<meta property="og:url" content="https://drbango.com/gvt/join/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Join my squad in Green vs Tan">
<meta name="twitter:description" content="Plastic army men. Real friends. One tap and you're in.">
<meta name="twitter:image" content="https://drbango.com/gvt/join/og.jpg">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<script>if(!/facebookexternalhit|Facebot|Twitterbot|Slackbot|Discordbot|WhatsApp|LinkedInBot|TelegramBot|Googlebot|bingbot/i.test(navigator.userAgent))location.replace('../'+(function(q){var s=(q.match(/[?&]s=([A-Za-z0-9]{4,8})(?:&|$)/)||[])[1],b=(q.match(/[?&]by=([0-9A-Fa-f]{8,40})(?:&|$)/)||[])[1];return s?'?join='+s.toUpperCase()+(b?'&by='+b.toLowerCase():''):'';})(location.search));</script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#1a1512}
body{font-family:'Arial Narrow',Impact,'Helvetica Neue',Arial,sans-serif;font-weight:800;color:#EDEADF;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));overflow:hidden;text-transform:uppercase;text-align:center;
  background:radial-gradient(ellipse at 50% 45%,#1C2C36 0%,#0C1014 72%)}
main{width:100%;max-width:440px}
.logo .g{font-size:clamp(64px,22vw,112px);line-height:.95;letter-spacing:.04em;color:#7FA35C;text-shadow:0 0 22px rgba(127,163,92,.55)}
.logo .vs{display:block;font-size:clamp(18px,6vw,30px);letter-spacing:.55em;padding-left:.55em;color:#EDEADF;margin:6px 0}
.logo .t{font-size:clamp(64px,22vw,112px);line-height:.95;letter-spacing:.06em;color:#D2B489;text-shadow:0 0 22px rgba(210,180,137,.5)}
.tag{margin:22px auto 18px;font-size:clamp(15px,4.6vw,20px);letter-spacing:.14em}
.btn{display:flex;align-items:center;justify-content:center;width:100%;max-width:360px;min-height:64px;margin:0 auto;padding:12px 18px;border-radius:40px;text-decoration:none;
  font-size:clamp(17px,5vw,22px);letter-spacing:.1em;border:4px solid #FFF3C4;color:#2a2008;background:#FFD24A}
</style>
</head>
<body>
<main>
  <div class="logo"><span class="g">GREEN</span><span class="vs">vs</span><span class="t">TAN</span></div>
  <p class="tag">JOIN MY SQUAD</p>
  <a class="btn" href="../">OPEN THE GAME</a>
</main>
</body>
</html>
