<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOO! Spirit Battles — Overworld Adventure</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800;900&family=Press+Start+2P&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#080604;cursor:default}
canvas{position:absolute;top:0;left:0}
#bg{z-index:0;image-rendering:pixelated}
#bg:active{cursor:grabbing}
#game{z-index:1;pointer-events:none}
#fx{z-index:2;pointer-events:none}

#tip{
  position:absolute;pointer-events:none;z-index:100;
  background:rgba(8,4,2,.96);border:2px solid rgba(255,240,200,.25);border-radius:6px;
  padding:10px 16px;color:#f4e8c8;font-family:'Cinzel',serif;font-size:14px;line-height:1.4;
  max-width:260px;opacity:0;transition:opacity .15s;box-shadow:0 6px 24px rgba(0,0,0,.7);
}
#tip.on{opacity:1}
#tip b{font-size:16px;display:block;margin-bottom:4px}

#ctrl{position:absolute;bottom:12px;right:12px;z-index:50}
#ctrl button{
  background:rgba(8,4,2,.9);border:1px solid rgba(255,240,200,.15);border-radius:5px;
  color:#f4e8c8;font:8px 'Press Start 2P',monospace;padding:7px 12px;cursor:pointer;
}

/* ═══ GAME UI ═══ */
#hud{position:absolute;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;gap:12px;
  padding:8px 16px;background:rgba(8,4,2,.85);border-bottom:1px solid rgba(255,240,200,.1);
  font:13px 'Cinzel',serif;color:#f0e8d8;flex-wrap:wrap}
#hud-party{display:flex;gap:6px}
.hud-ghost{padding:4px 10px;border-radius:4px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);font-size:12px;cursor:pointer;position:relative}
.hud-ghost.active{border-color:#90e070;background:rgba(144,224,112,.12)}
.hud-ghost.ko{opacity:.4;text-decoration:line-through}
.hud-ghost .hp-bar{position:absolute;bottom:0;left:0;height:2px;background:#50c040;border-radius:0 0 4px 4px}
#hud-resources{display:flex;gap:8px;margin-left:auto;font:10px 'Press Start 2P',monospace}
.res-item{display:flex;align-items:center;gap:3px;opacity:.8}
.res-item span{color:#f0d860}
#hud-coins{padding:4px 10px;background:rgba(240,216,96,.15);border-radius:4px;font-weight:700;color:#f0d860}
#hud-seals{display:flex;gap:4px}
.seal{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.2);opacity:.3}
.seal.earned{opacity:1;box-shadow:0 0 6px rgba(255,200,100,.4)}
#hud-turn{font:9px 'Press Start 2P',monospace;opacity:.5}

#action-bar{position:absolute;bottom:50px;left:50%;transform:translateX(-50%);z-index:60;display:flex;gap:8px}
#action-bar button{
  background:rgba(8,4,2,.9);border:2px solid #90e070;border-radius:8px;
  color:#f0e8d8;font:700 14px 'Cinzel',serif;padding:12px 24px;cursor:pointer;
  transition:all .15s;text-transform:uppercase;letter-spacing:2px}
#action-bar button:hover{background:rgba(144,224,112,.15);transform:translateY(-2px)}
#action-bar button:disabled{opacity:.3;cursor:default;transform:none}

#modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center}
#modal{background:rgba(12,8,4,.97);border:2px solid rgba(255,240,200,.2);border-radius:12px;padding:24px 32px;
  max-width:500px;width:90%;color:#f0e8d8;font-family:'Cinzel',serif;box-shadow:0 12px 48px rgba(0,0,0,.8)}
#modal-title{font-size:22px;font-weight:800;margin-bottom:12px;text-align:center}
#modal-body{font-size:14px;line-height:1.6;margin-bottom:16px;font-family:'Crimson Text',serif}
#modal-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#modal-actions button{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,240,200,.2);border-radius:6px;
  color:#f0e8d8;font:600 13px 'Cinzel',serif;padding:8px 20px;cursor:pointer;transition:all .15s}
#modal-actions button:hover{background:rgba(255,255,255,.15);border-color:rgba(255,240,200,.4)}
#modal-actions button.primary{border-color:#90e070;color:#90e070}

/* ═══ BATTLE SCREEN ═══ */
#battle-screen{position:fixed;inset:0;z-index:250;background:linear-gradient(180deg,rgba(6,3,1,.98),rgba(15,8,4,.98));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  font-family:'Cinzel',serif;color:#f0e8d8;overflow-y:auto;padding:12px}
#b-enemy,#b-player{width:100%;max-width:480px}
.battle-side{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px}
.enemy-side{border-color:rgba(233,69,96,.3)}.player-side{border-color:rgba(46,204,113,.3)}
.side-label{font:700 10px 'Press Start 2P',monospace;letter-spacing:2px;color:#e94560;margin-bottom:8px}

/* Card components */
.card-normal{display:flex;gap:12px;align-items:center}
.card-portrait{width:72px;height:72px;border-radius:10px;object-fit:cover;border:2px solid rgba(255,255,255,.15);flex-shrink:0;background:rgba(255,255,255,.05)}
.card-portrait-placeholder{width:72px;height:72px;border-radius:10px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:rgba(255,255,255,.2);flex-shrink:0}
.card-battle-info{flex:1;min-width:0}
.card-name{font-size:16px;font-weight:800;margin-bottom:2px}
.card-ability-name{font-size:11px;font-weight:700;color:#f0d860;margin-bottom:2px}
.card-ability-desc{font:11px 'Crimson Text',serif;color:rgba(255,255,255,.5);margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hp-bar-outer{width:100%;height:14px;background:rgba(255,255,255,.08);border-radius:7px;overflow:hidden;position:relative}
.hp-bar-inner{height:100%;border-radius:7px;transition:width .5s ease}
.hp-bar-inner.healthy{background:linear-gradient(90deg,#2ecc71,#27ae60)}
.hp-bar-inner.warning{background:linear-gradient(90deg,#f39c12,#e67e22)}
.hp-bar-inner.critical{background:linear-gradient(90deg,#e94560,#c0392b)}
.hp-bar-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 9px 'Press Start 2P',monospace;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.card-normal.ko{opacity:.3;filter:grayscale(1)}

/* Sideline / mini cards */
.sideline-row{display:flex;gap:6px;margin-top:8px}
.card-mini{width:48px;height:56px;border-radius:8px;overflow:hidden;border:2px solid rgba(255,255,255,.12);position:relative;cursor:pointer;transition:all .2s;background:rgba(255,255,255,.05)}
.card-mini:hover{border-color:#d4a040;transform:scale(1.08)}
.card-mini.ko{opacity:.25;filter:grayscale(1);cursor:default}
.card-mini img{width:100%;height:40px;object-fit:cover;display:block}
.card-mini-placeholder{width:100%;height:40px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:rgba(255,255,255,.15)}
.mini-hp-bar{position:absolute;bottom:12px;left:0;right:0;height:3px;background:rgba(0,0,0,.4)}
.mini-hp-fill{height:100%}
.mini-hp-fill.healthy{background:#2ecc71}.mini-hp-fill.warning{background:#f39c12}.mini-hp-fill.critical{background:#e94560}
.mini-name{font:600 7px 'Cinzel',serif;text-align:center;padding:1px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:rgba(255,255,255,.7)}

.battle-resources{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.res-badge{font:9px 'Press Start 2P',monospace;background:rgba(255,255,255,.06);padding:2px 6px;border-radius:4px;color:#f0d860}

/* Large cards (roster panels) */
.card-large{width:200px;border:2px solid rgba(255,255,255,.15);border-radius:12px;overflow:hidden;background:rgba(255,255,255,.04);cursor:pointer;transition:all .2s;position:relative;flex-shrink:0}
.card-large:hover{transform:scale(1.03);box-shadow:0 0 16px rgba(212,160,64,.2)}
.card-large.active-card{border-color:#2ecc71;box-shadow:0 0 12px rgba(46,204,113,.2)}
.card-large.ko{opacity:.3;filter:grayscale(1)}
.card-large.swap-selected{border-color:#f0d860;box-shadow:0 0 16px rgba(240,216,96,.4);animation:pulse-border .8s ease-in-out infinite}
@keyframes pulse-border{0%,100%{box-shadow:0 0 0 0 rgba(240,216,96,.3)}50%{box-shadow:0 0 0 6px rgba(240,216,96,.15)}}
.card-rarity-bar{height:3px;width:100%}
.card-slot-num{position:absolute;top:6px;left:8px;font:900 18px 'Cinzel',serif;color:#d4a040;text-shadow:0 2px 6px rgba(0,0,0,.7);z-index:2}
.card-art{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:rgba(255,255,255,.05)}
.card-art-placeholder{width:100%;aspect-ratio:1;background:rgba(255,255,255,.05)}
.card-info{padding:10px 12px}
.card-hp{font:700 13px 'Cinzel',serif;color:#4ade80;margin-bottom:4px}
.card-hp .heart{color:#ef4444}
.card-rarity{font:700 9px 'Press Start 2P',monospace;letter-spacing:1px;margin-bottom:6px}

/* Party screen */
.party-header{text-align:center;margin-bottom:16px}
.party-header h2{font:900 22px 'Cinzel',serif;letter-spacing:3px}
.party-subtitle{font:12px 'Crimson Text',serif;color:rgba(255,255,255,.5);margin-top:4px}
.party-roster{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.party-done-btn{background:rgba(46,204,113,.15);border:2px solid #2ecc71;border-radius:8px;color:#2ecc71;font:700 14px 'Cinzel',serif;padding:10px 32px;cursor:pointer;margin-top:16px}
.party-actions{text-align:center}

/* Recruit screen */
.recruit-roster{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.recruit-option{cursor:pointer;position:relative;transition:all .2s}
.recruit-option:hover{transform:scale(1.1)}
.recruit-replace-label{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);font:700 8px 'Press Start 2P',monospace;color:#e94560;background:rgba(0,0,0,.8);padding:2px 6px;border-radius:4px;white-space:nowrap}

/* KO overlay */
#ko-overlay{position:absolute;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:10}
.ko-overlay-content{text-align:center;max-width:600px}
.ko-overlay-content h3{font:800 18px 'Cinzel',serif}
.ko-picker-grid{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.ko-option{cursor:pointer;transition:transform .2s}
.ko-option:hover{transform:scale(1.05)}

/* Dice & results */
#b-vs{font-size:22px;font-weight:900;color:#e94560;text-shadow:0 0 16px rgba(233,69,96,.3);margin:2px 0}
#b-dice-area{display:flex;gap:16px;align-items:center;justify-content:center;min-height:50px}
.dice-group{display:flex;gap:4px}
.die{width:38px;height:38px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.12);border-radius:8px;display:flex;align-items:center;justify-content:center;font:700 18px 'Press Start 2P',monospace;transition:all .3s}
.die.win{border-color:#2ecc71;color:#2ecc71;background:rgba(46,204,113,.08);box-shadow:0 0 8px rgba(46,204,113,.2)}
.die.lose{border-color:#e94560;color:#e94560;background:rgba(233,69,96,.08)}
.die.rolling{animation:diceRoll .4s ease-out}
@keyframes diceRoll{0%{transform:rotateZ(0) scale(.5);opacity:0}60%{transform:rotateZ(360deg) scale(1.1)}100%{transform:rotateZ(360deg) scale(1);opacity:1}}
#b-result{font:700 14px 'Cinzel',serif;min-height:20px;text-align:center}
#b-callout{font:700 13px 'Cinzel',serif;color:#f0d860;min-height:18px;text-align:center;transition:opacity .3s}
#b-log{font:12px 'Crimson Text',serif;opacity:.6;max-height:70px;overflow-y:auto;text-align:center;padding:0 16px;line-height:1.4;width:100%;max-width:480px}
#b-actions{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;justify-content:center}
#b-actions button{background:rgba(255,255,255,.06);border:2px solid rgba(255,240,200,.15);border-radius:8px;color:#f0e8d8;font:700 13px 'Cinzel',serif;padding:8px 20px;cursor:pointer;transition:all .15s}
#b-actions button:hover{background:rgba(255,255,255,.12)}
#b-actions button.attack{border-color:#e94560;color:#e94560}
#b-actions button.resource{border-color:#f0d860;color:#f0d860;font-size:10px;padding:6px 12px}

/* Starter screen cards */
.starter-card-wrap{cursor:pointer;transition:all .2s}
.starter-card-wrap:hover{transform:translateY(-6px)}

/* ═══ VICTORY SCREEN ═══ */
#victory-screen{position:fixed;inset:0;z-index:400;background:radial-gradient(ellipse at center,rgba(30,20,10,.95),rgba(6,3,1,.99));
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#f0e8d8;text-align:center;padding:20px}
#victory-screen.active{display:flex}
#victory-screen h1{font:900 42px 'Cinzel',serif;color:#f0d860;text-shadow:0 0 40px rgba(240,216,96,.4);letter-spacing:6px;animation:victoryPulse 2s ease-in-out infinite}
@keyframes victoryPulse{0%,100%{text-shadow:0 0 40px rgba(240,216,96,.4)}50%{text-shadow:0 0 80px rgba(240,216,96,.6),0 0 120px rgba(240,216,96,.2)}}
#victory-screen .crown{font-size:80px;animation:crownBounce 1s ease-out}
@keyframes crownBounce{0%{transform:scale(0) rotateZ(-20deg);opacity:0}60%{transform:scale(1.2) rotateZ(5deg)}100%{transform:scale(1) rotateZ(0);opacity:1}}
.victory-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;text-align:left;margin:16px 0}
.victory-stat{font:12px 'Crimson Text',serif}.victory-stat b{color:#f0d860;font-family:'Cinzel',serif}
.victory-party{display:flex;gap:8px;justify-content:center;margin:12px 0}
#victory-screen button{background:rgba(240,216,96,.15);border:2px solid #f0d860;border-radius:8px;color:#f0d860;font:700 16px 'Cinzel',serif;padding:12px 32px;cursor:pointer;margin-top:12px}

/* ═══ BOSS INTRO ═══ */
#boss-intro{position:fixed;inset:0;z-index:350;background:rgba(6,3,1,.97);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#f0e8d8}
#boss-intro.active{display:flex}
.boss-intro-art{width:160px;height:160px;border-radius:16px;object-fit:cover;border:3px solid #e94560;box-shadow:0 0 40px rgba(233,69,96,.3);animation:bossAppear .8s ease-out}
@keyframes bossAppear{0%{transform:scale(0.3);opacity:0;filter:blur(10px)}100%{transform:scale(1);opacity:1;filter:blur(0)}}
.boss-intro-name{font:900 36px 'Cinzel',serif;color:#e94560;text-shadow:0 0 30px rgba(233,69,96,.4);letter-spacing:4px}
.boss-intro-hp{font:700 14px 'Press Start 2P',monospace;color:#e05050}
.boss-intro-ability{font:700 16px 'Cinzel',serif;color:#f0d860}
.boss-intro-desc{font:14px 'Crimson Text',serif;color:rgba(255,255,255,.6);max-width:400px;font-style:italic}
#boss-intro button{background:rgba(233,69,96,.15);border:2px solid #e94560;border-radius:8px;color:#e94560;font:700 18px 'Cinzel',serif;padding:14px 40px;cursor:pointer;margin-top:8px;letter-spacing:3px}

/* ═══ BATTLE TRANSITION ═══ */
#battle-flash{position:fixed;inset:0;z-index:240;background:#fff;opacity:0;pointer-events:none;transition:opacity .15s}
#battle-flash.flash{opacity:.6;transition:none}

#starter-screen{position:fixed;inset:0;z-index:300;background:rgba(6,3,1,.98);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;color:#f0e8d8}
#starter-screen h2{font:800 28px 'Cinzel',serif;letter-spacing:3px}
#starter-choices{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.starter-card{background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.15);border-radius:10px;
  padding:16px 20px;width:180px;cursor:pointer;transition:all .2s;text-align:center}
.starter-card:hover{border-color:#90e070;background:rgba(144,224,112,.08);transform:translateY(-4px)}
.starter-card .s-name{font:700 16px 'Cinzel',serif;margin-bottom:4px}
.starter-card .s-hp{font:10px 'Press Start 2P',monospace;color:#50c040;margin-bottom:6px}
.starter-card .s-ability{font:600 12px 'Cinzel',serif;color:#f0d860;margin-bottom:4px}
.starter-card .s-desc{font:12px 'Crimson Text',serif;opacity:.7;font-style:italic}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="game"></canvas>
<canvas id="fx"></canvas>
<div id="tip"><b></b><span></span></div>
<div id="ctrl"><button onclick="resetView()">Reset View</button></div>

<!-- Game UI Panels -->
<div id="hud" style="display:none">
  <div id="hud-party"></div>
  <div id="hud-resources"></div>
  <div id="hud-coins"><span id="coin-count">3</span> Coins</div>
  <div id="hud-seals"></div>
  <div id="hud-turn">Turn <span id="turn-num">1</span></div>
  <button onclick="showPartyScreen()" style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:4px;color:#f0e8d8;font:9px 'Press Start 2P',monospace;padding:4px 10px;cursor:pointer">PARTY</button>
</div>

<div id="action-bar" style="display:none">
  <button id="btn-roll" onclick="doRollMovement()">ROLL TO MOVE</button>
  <button id="btn-action" style="display:none" onclick="doNodeAction()">EXPLORE</button>
  <button id="btn-end" style="display:none" onclick="endTurn()">END TURN</button>
</div>

<div id="modal-overlay" style="display:none">
  <div id="modal">
    <div id="modal-title"></div>
    <div id="modal-body"></div>
    <div id="modal-actions"></div>
  </div>
</div>

<div id="battle-screen" style="display:none">
  <div id="b-enemy" class="b-fighter enemy"></div>
  <div id="b-vs">VS</div>
  <div id="b-player" class="b-fighter player"></div>
  <div id="b-dice-area"></div>
  <div id="b-result"></div>
  <div id="b-callout"></div>
  <div id="b-log"></div>
  <div id="b-actions"></div>
</div>

<div id="battle-flash"></div>

<div id="boss-intro">
  <img class="boss-intro-art" id="boss-intro-art" src="">
  <div class="boss-intro-name" id="boss-intro-name"></div>
  <div class="boss-intro-hp" id="boss-intro-hp"></div>
  <div class="boss-intro-ability" id="boss-intro-ability"></div>
  <div class="boss-intro-desc" id="boss-intro-desc"></div>
  <button id="boss-intro-btn" onclick="dismissBossIntro()">FIGHT</button>
</div>

<div id="victory-screen">
  <div class="crown">👑</div>
  <h1>GRAND MASTER</h1>
  <p style="font:16px 'Cinzel',serif;color:rgba(255,255,255,.7)">You have defeated Valkin the Grand and claimed the Overworld.</p>
  <div class="victory-stats" id="victory-stats"></div>
  <div class="victory-party" id="victory-party"></div>
  <button onclick="deleteSave();location.reload()">NEW ADVENTURE</button>
</div>

<div id="starter-screen">
  <h2>Choose Your First Spiritkin</h2>
  <div id="starter-choices"></div>
</div>

<script src="cards_data.js"></script>
<script src="art_map.js"></script>
<script src="encounter_pools.js"></script>
<script src="engine.js"></script>
<script src="battle-ui.js"></script>
<script>
// ═══════════════════════════════════════
// TOP-DOWN PIXEL ART OVERWORLD
// Diamond layout: RH bottom → FV left / VI right → DC top
// ═══════════════════════════════════════

const PX=3,MW=420,MH=280;
const WW=MW*PX,WH=MH*PX;
const buf=document.createElement('canvas');
buf.width=MW;buf.height=MH;
const a=buf.getContext('2d');
a.imageSmoothingEnabled=false;

let sd=42;
function sr(s){sd=s}function rn(){sd=(sd*16807)%2147483647;return(sd-1)/2147483646}
function ri(a,b){return Math.floor(rn()*(b-a+1))+a}
function pk(a){return a[ri(0,a.length-1)]}
function lr(a,b,t){return a+(b-a)*Math.max(0,Math.min(1,t))}
function px(x,y,c){a.fillStyle=c;a.fillRect(Math.floor(x),Math.floor(y),1,1)}
function pr(x,y,w,h,c){a.fillStyle=c;a.fillRect(Math.floor(x),Math.floor(y),w,h)}

// ═══════ TOP-DOWN TERRAIN ═══════

function renderArt(){
  a.fillStyle='#1a4a10';a.fillRect(0,0,MW,MH);
  drawGrassBase();
  drawRollingHillsTD();
  drawFrostValleyTD();
  drawVolcanicIslesTD();
  drawDarkCastleTD();
  drawWaterFeatures();
  drawMainRoads();
}

function drawGrassBase(){
  sr(100);
  // Smooth blended terrain — green base everywhere, regions tint on top
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const cx=x/MW,cy=y/MH;
    const v=rn();

    // Start with green grass everywhere
    let r=45+v*20+Math.sin(x*0.05+y*0.04)*8;
    let g=95+v*25+Math.sin(x*0.04-y*0.03)*10;
    let b=28+v*12;

    // Region tints (additive blending, wide coverage)
    const fvDist=Math.sqrt(Math.pow(cx-0.15,2)+Math.pow(cy-0.35,2));
    const viDist=Math.sqrt(Math.pow(cx-0.85,2)+Math.pow(cy-0.35,2));
    const dcDist=Math.sqrt(Math.pow(cx-0.50,2)+Math.pow(cy-0.08,2));

    const fvT=Math.max(0,1-fvDist*2.2); // snow tint
    const viT=Math.max(0,1-viDist*2.2); // volcanic tint
    const dcT=Math.max(0,1-dcDist*2.8); // dark tint

    // Apply tints by lerping from green base
    if(fvT>0){r=lr(r,170+v*15,fvT);g=lr(g,180+v*12,fvT);b=lr(b,195+v*10,fvT)}
    if(viT>0){r=lr(r,75+v*15,viT);g=lr(g,58+v*10,viT);b=lr(b,48+v*8,viT)}
    if(dcT>0){r=lr(r,35+v*10,dcT);g=lr(g,28+v*8,dcT);b=lr(b,50+v*12,dcT)}

    px(x,y,`rgb(${Math.floor(r)},${Math.floor(g)},${Math.floor(b)})`);
  }
}

function drawRollingHillsTD(){
  sr(200);
  // Mario-style rounded hills (smooth bumps from above)
  for(const[hcx,hcy,hr,c1,c2]of[

    [50,245,11,'#4aa838','#3a9028'],[350,250,13,'#48a830','#389820'],
    [210,210,8,'#50b040','#40a030']
  ]){
    for(let dy=-hr;dy<=hr;dy++)for(let dx=-hr;dx<=hr;dx++){
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<=hr){

function drawFrostValleyTD(){
  sr(300);
  // Mountains — bigger, more prominent, with snow caps
  for(const[mx,my,ms]of[[25,30,16],[55,18,20],[90,22,14],[130,28,12],[40,55,10],[110,50,11],[145,40,9],[20,75,8]]){
    // Mountain body (darker base, lighter top)
    for(let r=ms;r>0;r-=1){
      const yt=r/ms;
      const baseR=140+yt*40,baseG=148+yt*38,baseB=160+yt*35;
      for(let dx=-r;dx<=r;dx++){
        const dy=r-Math.abs(dx);
        const ppx=mx+dx,ppy=my-Math.floor(dy/2);
        if(ppx>=0&&ppx<MW*0.38&&ppy>=0&&ppy<MH)
          px(ppx,ppy,`rgb(${Math.floor(baseR)},${Math.floor(baseG)},${Math.floor(baseB)})`);
      }
    }
    // Snow cap (top third)
    for(let r=Math.floor(ms*0.4);r>0;r-=1){
      for(let dx=-r;dx<=r;dx++){
        const dy=r-Math.abs(dx);
        const ppx=mx+dx,ppy=my-Math.floor(ms*0.3)-Math.floor(dy/2);
        if(ppx>=0&&ppx<MW*0.38&&ppy>=0&&ppy<MH)
          px(ppx,ppy,rn()>0.3?'#e8eef4':'#d8e4f0');
      }
    }
  }
  // Snow-covered pines
  for(let i=0;i<30;i++){
    const tx=ri(10,Math.floor(MW*0.35)),ty=ri(20,Math.floor(MH*0.50));
    const sz=2;
    for(let dy=-sz;dy<=sz;dy++)for(let dx=-sz;dx<=sz;dx++){
      if(dx*dx+dy*dy<=sz*sz)px(tx+dx,ty+dy,pk(['#1a3830','#1a4038']));
    }
    px(tx,ty-1,'#d8e4f0');px(tx+1,ty,'#c8d8e8');
  }
  // Frozen lake
  const lx=70,ly=100,lw=16,lh=9;
  for(let dy=-lh;dy<=lh;dy++)for(let dx=-lw;dx<=lw;dx++){
    if(dx*dx/(lw*lw)+dy*dy/(lh*lh)<=1)px(lx+dx,ly+dy,rn()>0.5?'#88b8d8':'#78a8c8');
  }
  // Ice crystals scattered
  for(let i=0;i<8;i++){
    const ix=ri(15,Math.floor(MW*0.34)),iy=ri(25,Math.floor(MH*0.48));
    pr(ix,iy,2,3,'#a0d0e8');px(ix,iy-1,'#c0e4f8');
  }
  // Snow patches (white splotches)
  for(let i=0;i<20;i++){
    const sx=ri(8,Math.floor(MW*0.36)),sy=ri(15,Math.floor(MH*0.52));
    const sw=ri(3,6),sh=ri(2,4);
    for(let dy=0;dy<sh;dy++)for(let dx=0;dx<sw;dx++){
      if(rn()>0.3)px(sx+dx,sy+dy,rn()>0.5?'#d4dce8':'#c8d4e0');
    }
  }
}

function drawVolcanicIslesTD(){
  sr(400);
  // Ocean along right edge
  for(let y=0;y<Math.floor(MH*0.55);y++){
    for(let x=Math.floor(MW*0.92);x<MW;x++){
      const edge=(x-MW*0.92)/(MW*0.08);
      if(rn()<0.3+edge*0.7)
        px(x,y,rn()>0.5?'#1860a0':'#2070b0');
    }
  }
  // Volcanic islands/coast
  for(let y=Math.floor(MH*0.15);y<Math.floor(MH*0.50);y++){
    const coastX=Math.floor(MW*0.90+Math.sin(y*0.08)*4);
    for(let x=coastX;x<coastX+3;x++){
      if(x>=0&&x<MW)px(x,y,rn()>0.5?'#a09068':'#908060');
    }
  }
  // Volcano caldera (prominent)
  const vx=365,vy=25,vr=18;
  for(let dy=-vr;dy<=vr;dy++)for(let dx=-vr;dx<=vr;dx++){
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d<=vr){
      const ppx=vx+dx,ppy=vy+dy;
      if(ppx>=0&&ppx<MW&&ppy>=0&&ppy<MH){
        if(d<5)px(ppx,ppy,pk(['#e85020','#d84018','#f06828']));
        else if(d<11)px(ppx,ppy,pk(['#504848','#585050']));
        else px(ppx,ppy,pk(['#3a3434','#403838']));
      }
    }
  }
  // Lava rivers flowing toward ocean
  for(const[sx,sy,ex,ey]of[[365,40,400,90],[360,38,390,120],[355,42,MW-5,70]]){
    let lx=sx,ly=sy;
    const steps=80;
    for(let s=0;s<steps;s++){
      const t=s/steps;
      lx=Math.floor(lr(sx,ex,t)+Math.sin(s*0.12)*3);
      ly=Math.floor(lr(sy,ey,t)+Math.cos(s*0.1)*2);
      const w=2-t;// thins as it flows
      for(let dx=-w;dx<=w;dx++){
        const ppx=lx+Math.floor(dx);
        if(ppx>=0&&ppx<MW&&ly>=0&&ly<MH)
          px(ppx,ly,pk(['#d04018','#e05828','#c83810']));
      }
    }
  }
  // Lava pools
  for(const[cx,cy,r]of[[330,80,7],[375,65,5],[310,110,6]]){
    for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
      if(dx*dx+dy*dy<=r*r){
        const ppx=cx+dx,ppy=cy+dy;
        if(ppx>=0&&ppx<MW)px(ppx,ppy,pk(['#d04018','#e06028','#e88038']));
      }
    }
  }
  // Rock formations
  for(let i=0;i<15;i++){
    const rx=ri(Math.floor(MW*0.65),MW-20),ry=ri(15,Math.floor(MH*0.48));
    const rr=ri(2,4);
    for(let dy=-rr;dy<=rr;dy++)for(let dx=-rr;dx<=rr;dx++){
      if(dx*dx+dy*dy<=rr*rr)px(rx+dx,ry+dy,pk(['#484040','#504848','#585050']));
    }
  }
  // Dead trees
  for(let i=0;i<8;i++){
    const tx=ri(Math.floor(MW*0.66),MW-20),ty=ri(20,Math.floor(MH*0.48));
    pxR(tx,ty,1,4,'#3a2820');px(tx-1,ty+1,'#3a2820');px(tx+1,ty,'#3a2820');
  }
  // function pxR alias
  function pxR(x,y,w,h,c){pr(x,y,w,h,c)}
}

function drawMainRoads(){
  sr(700);
  // Subtle dirt roads
  function road(x1,y1,x2,y2,w,c){
    const st=Math.max(Math.abs(x2-x1),Math.abs(y2-y1))*2;
    for(let i=0;i<=st;i++){
      const t=i/st;
      const cx=Math.floor(lr(x1,x2,t)+Math.sin(i*0.06)*1.5);
      const cy=Math.floor(lr(y1,y2,t)+Math.cos(i*0.08)*1);
      for(let dy=-w;dy<=w;dy++)for(let dx=-w;dx<=w;dx++){
        if(Math.abs(dx)+Math.abs(dy)<=w){
          const ppx=cx+dx,ppy=cy+dy;
          if(ppx>=0&&ppx<MW&&ppy>=0&&ppy<MH)px(ppx,ppy,c);
        }
      }
    }
  }
  road(210,240,210,155,2,'#a89060');
  road(210,155,100,100,2,'#a09068');
  road(100,100,75,55,2,'#9098a0');

  road(320,100,340,55,2,'#605850');
  road(75,55,185,35,2,'#706878');
  road(340,55,235,35,2,'#504858');
  road(115,90,305,90,2,'#908868');
}

const RG={rolling_hills:[168,216,110],frost_valley:[184,224,255],volcanic_isles:[255,138,64],dark_castle:[154,106,212]};

// ═══════ CANVAS ENGINE ═══════

const cvs=[document.getElementById('bg'),document.getElementById('game'),document.getElementById('fx')];
const[bCtx,gCtx,fCtx]=cvs.map(c=>c.getContext('2d'));
const tip=document.getElementById('tip');

let W,H,dpr=window.devicePixelRatio||1;
let camX=0,camY=0,camScale=1;
let drag=null,dragCam=null;
let hovNode=null,time=0;

function resize(){
  W=window.innerWidth;H=window.innerHeight;
  cvs.forEach(c=>{c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px'});
  const sx=W/WW,sy=H/WH;
  camScale=Math.min(sx,sy)*0.98;
  camX=(W-WW*camScale)/2;camY=(H-WH*camScale)/2;
}

function w2s(wx,wy){return{x:wx*WW*camScale+camX,y:wy*WH*camScale+camY}}
function s2w(sx,sy){return{x:(sx-camX)/(WW*camScale),y:(sy-camY)/(WH*camScale)}}

// ═══════ DRAWING ═══════

function drawBg(){
  const g=bCtx;g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
  g.fillStyle='#060404';g.fillRect(0,0,W,H);
  g.imageSmoothingEnabled=false;
  g.drawImage(buf,0,0,MW,MH,camX,camY,WW*camScale,WH*camScale);
}

function drawGame(){
  const g=gCtx;g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
  const t=time*0.002;

  // ── ROADS ──
  for(const[fi,ti]of edges){
    const na=nodes.find(n=>n.id===fi),nb=nodes.find(n=>n.id===ti);
    if(!na||!nb)continue;
    const p1=w2s(na.x,na.y),p2=w2s(nb.x,nb.y);
    const rg=RG[na.r]||RG[nb.r];

    // Road shadow
    g.save();g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=10*camScale;g.lineCap='round';
    const mx=(p1.x+p2.x)/2+Math.sin(fi*1.3)*6*camScale;
    const my=(p1.y+p2.y)/2+Math.cos(ti*1.7)*6*camScale;
    g.beginPath();g.moveTo(p1.x,p1.y);g.quadraticCurveTo(mx,my,p2.x,p2.y);g.stroke();
    // Road body
    g.strokeStyle=`rgba(${rg[0]},${rg[1]},${rg[2]},.15)`;g.lineWidth=8*camScale;
    g.beginPath();g.moveTo(p1.x,p1.y);g.quadraticCurveTo(mx,my,p2.x,p2.y);g.stroke();
    // Center
    g.strokeStyle=`rgba(${rg[0]},${rg[1]},${rg[2]},.3)`;g.lineWidth=3*camScale;
    g.beginPath();g.moveTo(p1.x,p1.y);g.quadraticCurveTo(mx,my,p2.x,p2.y);g.stroke();
    g.restore();
  }

  // ── NODES ──
  for(const node of nodes){
    const nt=NT[node.type];
    const pos=w2s(node.x,node.y);
    const isHov=hovNode===node;
    const isReachable=window._reachableNodes&&window._reachableNodes.has&&window._reachableNodes.has(node.id);
    const reachDist=isReachable?window._reachableNodes.get(node.id):0;
    const isPlayer=G&&G.currentNode===node.id;
    const isLocked=G&&!isRegionUnlocked(node.r);
    const isCleared=isEncounterCleared(node.id);
    const pulse=isReachable?.5+Math.sin(t*3+node.id)*.5:.85+Math.sin(t+node.id*.8)*.15;
    const isBoss=node.type==='boss'||node.type==='final';
    const sz=((isHov||isReachable)?nt.sz*1.2:nt.sz)*camScale*(isLocked?0.8:1);
    const[gr,gg,gb]=nt.gc;

    g.save();

    // Glow
    const glR=sz*(1.6+nt.ga)*pulse;
    const gl=g.createRadialGradient(pos.x,pos.y,sz*.2,pos.x,pos.y,glR);
    gl.addColorStop(0,`rgba(${gr},${gg},${gb},${.18*nt.ga*pulse})`);
    gl.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gl;g.beginPath();g.arc(pos.x,pos.y,glR,0,Math.PI*2);g.fill();

    // Shape
    g.beginPath();
    if(nt.sh==='hex'){for(let i=0;i<6;i++){const aa=Math.PI/3*i-Math.PI/6;g[i?'lineTo':'moveTo'](pos.x+sz*Math.cos(aa),pos.y+sz*Math.sin(aa))}g.closePath()}
    else if(nt.sh==='diamond'){g.moveTo(pos.x,pos.y-sz);g.lineTo(pos.x+sz*.7,pos.y);g.lineTo(pos.x,pos.y+sz);g.lineTo(pos.x-sz*.7,pos.y);g.closePath()}
    else if(nt.sh==='star'){for(let i=0;i<12;i++){const aa=Math.PI/6*i-Math.PI/2;const rd=i%2?sz*.5:sz;g[i?'lineTo':'moveTo'](pos.x+rd*Math.cos(aa),pos.y+rd*Math.sin(aa))}g.closePath()}
    else g.arc(pos.x,pos.y,sz,0,Math.PI*2);

    // Fill
    const fg=g.createRadialGradient(pos.x,pos.y-sz*.2,0,pos.x,pos.y,sz);
    fg.addColorStop(0,nt.col);fg.addColorStop(1,`rgba(${gr*.4|0},${gg*.4|0},${gb*.4|0},.9)`);
    g.fillStyle=fg;g.fill();

    // Border
    g.strokeStyle=isReachable?'#ffffff':isHov?'#fff':nt.col;
    g.lineWidth=(isReachable?4:isHov?3:2)*camScale;g.stroke();
    if(isReachable){g.strokeStyle='rgba(144,224,112,.6)';g.lineWidth=2*camScale;g.stroke();
      // Distance badge
      g.fillStyle='#90e070';g.font=`700 ${10*camScale}px 'Press Start 2P',monospace`;
      g.textAlign='center';g.textBaseline='middle';
      g.fillText(reachDist,pos.x+sz+8*camScale,pos.y-sz-4*camScale);
    }
    g.restore();

    // Icon inside
    g.save();
    const iconSz=isBoss?sz*.5:sz*.55;
    g.font=`${iconSz}px serif`;g.textAlign='center';g.textBaseline='middle';
    g.shadowColor='rgba(0,0,0,.6)';g.shadowBlur=2;
    if(isLocked){
      g.globalAlpha=0.35;g.fillStyle='#888';g.font=`${iconSz*1.2}px serif`;g.fillText('\uD83D\uDD12',pos.x,pos.y);
    } else if(node.type==='boss')g.fillText('\u2694\uFE0F',pos.x,pos.y);
    else if(node.type==='final')g.fillText('\uD83D\uDC51',pos.x,pos.y);
    else if(node.type==='camp'){g.fillText('\uD83D\uDD25',pos.x,pos.y)}
    else if(node.type==='shop'){g.fillText('\uD83D\uDCB0',pos.x,pos.y)}
    else if(node.type==='shrine'){g.fillStyle='#fff';g.fillText('\u2726',pos.x,pos.y)}
    else if(node.type==='encounter'){g.fillStyle='#fff';g.font=`bold ${iconSz}px serif`;g.fillText('!',pos.x,pos.y)}
    else if(node.type==='quest'){g.fillText('\uD83D\uDCDC',pos.x,pos.y)}
    else if(node.type==='event'){g.fillStyle='#fff';g.font=`bold ${iconSz*.9}px serif`;g.fillText('?',pos.x,pos.y)}
    else if(node.type==='start'){g.fillStyle='#fff';g.font=`bold ${iconSz*.8}px 'Cinzel'`;g.fillText('GO',pos.x,pos.y+1)}
    // Cleared checkmark
    if(isCleared&&!isLocked){
      g.fillStyle='#2ecc71';g.font=`bold ${sz*.8}px serif`;
      g.fillText('✓',pos.x+sz*.6,pos.y-sz*.4);
    }
    g.restore();

    // ── LABELS — strong outline, no backing ──
    const ls=Math.max(.65,camScale);

    // Helper: stroke text for readability (outline effect)
    function outlineText(text,x,y,font,color,baseline){
      g.save();
      g.font=font;g.textAlign='center';g.textBaseline=baseline;
      // Dark stroke outline (draw text multiple times offset)
      g.fillStyle='#000';
      const o=1.5*camScale;
      for(let dx=-o;dx<=o;dx+=o)for(let dy=-o;dy<=o;dy+=o){
        if(dx||dy)g.fillText(text,x+dx,y+dy);
      }
      // Main text
      g.fillStyle=color;
      g.fillText(text,x,y);
      g.restore();
    }

    // Type tag (above node)
    const tagFont=`700 ${Math.max(7,isBoss?9*ls:7.5*ls)}px 'Press Start 2P',monospace`;
    outlineText(nt.tag,pos.x,pos.y-sz-5*camScale,tagFont,nt.col,'bottom');

    // Name (below node)
    const nameFont=`800 ${Math.max(9,isBoss?13*ls:10*ls)}px 'Cinzel',serif`;
    const nameCol=isHov?`rgb(${gr},${gg},${gb})`:'#f0e8d8';
    outlineText(node.name,pos.x,pos.y+sz+5*camScale,nameFont,nameCol,'top');

    // Boss HP subtitle
    if(isBoss){
      const subFont=`700 ${Math.max(7,8*ls)}px 'Cinzel',serif`;
      const sub=node.type==='final'?'VALKIN THE GRAND \u00B7 12 HP':
        node.name.includes('Timber')?'5 HP':
        node.name.includes('Jay')?'7 HP':
        node.name.includes('Nerina')?'7 HP':'8 HP';
      outlineText(sub,pos.x,pos.y+sz+18*ls,subFont,`rgba(${gr},${gg},${gb},.9)`,'top');
    }
  }

  // Lantern on player position (or node 0 before game starts)
  const playerNode = G ? nodes.find(n=>n.id===G.currentNode) || nodes[0] : nodes[0];
  const sp=w2s(playerNode.x,playerNode.y);
  g.font=`${22*camScale}px serif`;g.textAlign='center';g.textBaseline='middle';
  g.fillText('\uD83C\uDFEE',sp.x,sp.y-28*camScale);
  g.save();
  g.font=`700 ${9*camScale}px 'Press Start 2P',monospace`;
  g.textAlign='center';g.shadowColor='rgba(0,0,0,1)';g.shadowBlur=4;
  g.fillStyle='rgba(100,200,255,.8)';
  g.fillText('YOU',sp.x,sp.y-40*camScale);
  g.restore();
}

// Particles
class Pt{
  constructor(r){this.r=r;this.reset()}
  reset(){
    if(this.r==='vi'){this.x=.62+rn()*.35;this.y=rn()*.55}
    else{this.x=rn()*.38;this.y=rn()*.55}
    this.sz=rn()*2+.5;this.sp=rn()*.0003+.0001;this.dr=(rn()-.5)*.0002;
    this.op=rn()*.4+.2;this.life=1;
  }
  update(){
    if(this.r==='vi'){this.y-=this.sp;this.life-=.002}
    else{this.y+=this.sp*.6;this.x+=Math.sin(time*.003+this.y*8)*.00008;this.life-=.0015}
    if(this.life<=0||this.y<0||this.y>1)this.reset();
  }
  draw(c){
    const p=w2s(this.x,this.y),s=this.sz*camScale,al=this.op*this.life;
    if(this.r==='vi'){c.fillStyle=`rgba(255,${100+rn()*80|0},20,${al})`;c.shadowColor='rgba(255,120,20,.3)';c.shadowBlur=s*3}
    else{c.fillStyle=`rgba(200,220,255,${al*.5})`;c.shadowColor='rgba(200,220,255,.2)';c.shadowBlur=s*2}
    c.beginPath();c.arc(p.x,p.y,s,0,Math.PI*2);c.fill();c.shadowBlur=0;
  }
}
const pts=[];for(let i=0;i<35;i++)pts.push(new Pt('vi'));for(let i=0;i<30;i++)pts.push(new Pt('fv'));

function drawFx(){
  const g=fCtx;g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
  for(const p of pts){p.update();p.draw(g)}
}

// ═══════ INTERACTION ═══════

function getNodeAt(sx,sy){
  const w=s2w(sx,sy);let c=null,d=Infinity;
  for(const n of nodes){
    const dx=(w.x-n.x)*WW,dy=(w.y-n.y)*WH;
    const dist=Math.sqrt(dx*dx+dy*dy),hr=NT[n.type].sz*2;
    if(dist<hr&&dist<d){c=n;d=dist}
  }return c;
}

cvs[0].style.cursor='grab';
cvs[0].addEventListener('mousemove',e=>{
  const r=cvs[0].getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  if(drag){camX=dragCam.x+(mx-drag.x);camY=dragCam.y+(my-drag.y);return}
  const nd=getNodeAt(mx,my);hovNode=nd;
  cvs[0].style.cursor=nd?'pointer':'grab';
  if(nd){
    tip.querySelector('b').textContent=nd.name;
    tip.querySelector('b').style.color=NT[nd.type].col;
    tip.querySelector('span').textContent=nd.desc;
    tip.classList.add('on');
    let tx=e.clientX+16,ty=e.clientY-10;
    if(tx+270>W)tx=e.clientX-280;if(ty+80>H)ty=e.clientY-90;
    tip.style.left=tx+'px';tip.style.top=ty+'px';
  }else tip.classList.remove('on');
});
cvs[0].addEventListener('mousedown',e=>{const r=cvs[0].getBoundingClientRect();drag={x:e.clientX-r.left,y:e.clientY-r.top};dragCam={x:camX,y:camY}});
cvs[0].addEventListener('mouseup',()=>drag=null);
cvs[0].addEventListener('mouseleave',()=>{drag=null;hovNode=null;tip.classList.remove('on')});
cvs[0].addEventListener('wheel',e=>{
  e.preventDefault();const r=cvs[0].getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  const old=camScale;camScale=Math.max(.4,Math.min(5,camScale*(e.deltaY>0?.92:1.08)));
  camX=mx-(mx-camX)*(camScale/old);camY=my-(my-camY)*(camScale/old);
},{passive:false});

function resetView(){
  const sx=W/WW,sy=H/WH;camScale=Math.min(sx,sy)*.98;
  camX=(W-WW*camScale)/2;camY=(H-WH*camScale)/2;
}

// ═══════ LOOP ═══════
let lck='';
function loop(ts){
  time=ts;
  const ck=`${camX.toFixed(1)},${camY.toFixed(1)},${camScale.toFixed(3)}`;
  if(ck!==lck){drawBg();lck=ck}
  drawGame();drawFx();
  requestAnimationFrame(loop);
}

window.addEventListener('resize',()=>{resize();lck=''});
resize();renderArt();requestAnimationFrame(loop);

// ═══════════════════════════════════════════════════════
// GAME LOGIC — ties engine.js to the map
// ═══════════════════════════════════════════════════════

let G = null; // Game state
let reachable = null; // Current reachable nodes for movement

// ── STARTER SELECTION ──
function showStarterScreen() {
  if (typeof renderStarterScreen === 'function') {
    renderStarterScreen();
    return;
  }
  // Fallback
  const starters = [ENGINE.getCard(28), ENGINE.getCard(16), ENGINE.getCard(20)];
  const el = document.getElementById('starter-choices');
  el.innerHTML = '';
  for (const card of starters) {
    const div = document.createElement('div');
    div.className = 'starter-card';
    div.innerHTML = `<div class="s-name">${card.name}</div><div class="s-hp">${card.maxHp} HP</div>`;
    div.onclick = () => startGame(card.id);
    el.appendChild(div);
  }
}

function startGame(cardId) {
  document.getElementById('starter-screen').style.display = 'none';
  G = ENGINE.createGameState(cardId);
  updateHUD();
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('action-bar').style.display = 'flex';
  showMessage('Welcome to the Overworld!', `You start at Toby's Cottage with ${ENGINE.getCard(cardId).name}. Roll to move!`);
}

// ── HUD ──
function updateHUD() {
  if (!G) return;
  // Party
  const partyEl = document.getElementById('hud-party');
  partyEl.innerHTML = '';
  for (const ghost of G.party.ghosts) {
    const div = document.createElement('div');
    div.className = 'hud-ghost' + (ghost === ENGINE.activeGhost(G.party) ? ' active' : '') + (ghost.ko ? ' ko' : '');
    div.textContent = `${ghost.name} ${ghost.hp}/${ghost.maxHp}`;
    const bar = document.createElement('div');
    bar.className = 'hp-bar';
    bar.style.width = (ghost.hp / ghost.maxHp * 100) + '%';
    div.appendChild(bar);
    partyEl.appendChild(div);
  }

  // Resources
  const resEl = document.getElementById('hud-resources');
  resEl.innerHTML = '';
  const res = G.party.resources;
  const icons = {luckyStone:'🍀',moonstone:'🌙',healingSeed:'🌱',surge:'⚡',iceShard:'❄️',sacredFire:'🔥'};
  for (const [key, icon] of Object.entries(icons)) {
    if (res[key] > 0) {
      const div = document.createElement('div');
      div.className = 'res-item';
      div.innerHTML = `${icon}<span>${res[key]}</span>`;
      resEl.appendChild(div);
    }
  }

  // Coins
  document.getElementById('coin-count').textContent = G.coins;

  // Turn
  document.getElementById('turn-num').textContent = G.turnNumber;

  // Seals
  const sealsEl = document.getElementById('hud-seals');
  sealsEl.innerHTML = '';
  const sealColors = {rolling_hills:'#90e070',frost_valley:'#80c8f0',volcanic_isles:'#e87830',dark_castle:'#9070c0'};
  for (const [region, color] of Object.entries(sealColors)) {
    const div = document.createElement('div');
    div.className = 'seal' + (G.seals.includes(region) ? ' earned' : '');
    div.style.borderColor = color;
    if (G.seals.includes(region)) div.style.background = color;
    sealsEl.appendChild(div);
  }
}

// ── MOVEMENT ──
function doRollMovement() {
  if (!G || !G.canMove) return;
  G.turnNumber++;
  const roll = ENGINE.rollMovement();
  G.movementRoll = roll;
  G.movesLeft = roll;
  G.canMove = false;

  // Calculate reachable nodes
  reachable = ENGINE.getReachableNodes(G.currentNode, roll, edges, nodes);

  // Highlight reachable nodes on map
  highlightReachable();

  document.getElementById('btn-roll').style.display = 'none';

  // Brief flash of roll result, then auto-dismiss so map is clickable
  showMessage('Movement Roll', `You rolled a <b>${roll}</b>! Click a highlighted node to move there.`);
  setTimeout(() => {
    hideModal();
    // Enable click-to-move AFTER modal is gone
    cvs[0].onclick = handleMapClick;
  }, 1200);
}

function highlightReachable() {
  // Filter out locked regions from reachable nodes
  const filtered = new Map();
  if (reachable) {
    for (const [id, dist] of reachable) {
      const node = nodes.find(n => n.id === id);
      if (node && isRegionUnlocked(node.r)) {
        filtered.set(id, dist);
      }
    }
  }
  window._reachableNodes = filtered;
}

function isRegionUnlocked(region) {
  if (!G) return true;
  if (region === 'rolling_hills') return true; // Always open
  if (region === 'frost_valley' || region === 'volcanic_isles') return G.bossesDefeated.includes('timber');
  if (region === 'dark_castle') return G.bossesDefeated.includes('kingJay') || G.bossesDefeated.includes('nerina');
  return true;
}

function handleMapClick(e) {
  if (!reachable) return;
  const r = cvs[0].getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const node = getNodeAt(mx, my);
  if (node && reachable.has(node.id)) {
    if (!isRegionUnlocked(node.r)) {
      showMessage('Region Locked', `Defeat ${node.r === 'dark_castle' ? 'King Jay or Nerina' : 'Timber'} to unlock this area.`);
      return;
    }
    moveToNode(node.id);
  }
}

function moveToNode(nodeId) {
  G.currentNode = nodeId;
  G.visitedNodes.add(nodeId);
  reachable = null;
  window._reachableNodes = new Map();
  cvs[0].onclick = null;

  // Update player position on map (re-render will handle it)
  updateHUD();

  // Show action button
  document.getElementById('btn-action').style.display = '';
  document.getElementById('btn-action').textContent = 'EXPLORE ' + nodes.find(n => n.id === nodeId).name.toUpperCase();
}

function doNodeAction() {
  const node = nodes.find(n => n.id === G.currentNode);
  if (!node) return;
  document.getElementById('btn-action').style.display = 'none';

  switch (node.type) {
    case 'start': showMessage(node.name, 'Home sweet home. Nothing to do here.'); endTurn(); break;
    case 'encounter': startEncounter(node); break;
    case 'event': doEvent(node); break;
    case 'camp': showCamp(node); break;
    case 'shop': showShop(node); break;
    case 'shrine': showShrine(node); break;
    case 'quest': showQuest(node); break;
    case 'boss': startBossBattle(node); break;
    case 'final': startBossBattle(node); break;
    default: endTurn();
  }
}

function endTurn() {
  G.canMove = true;
  G.movesLeft = 0;
  reachable = null;
  window._reachableNodes = new Map();
  document.getElementById('btn-roll').style.display = '';
  document.getElementById('btn-action').style.display = 'none';
  document.getElementById('btn-end').style.display = 'none';
  updateHUD();
  saveGame();
}

// ── SAVE / LOAD ──
function saveGame() {
  if (!G) return;
  const saveData = {
    party: {
      ghosts: G.party.ghosts.map(g => ({
        id: g.id, name: g.name, hp: g.hp, maxHp: g.maxHp, ko: g.ko,
        ability: g.ability, abilityDesc: g.abilityDesc, rarity: g.rarity, set: g.set,
        usedOncePerGame: g.usedOncePerGame, entryFired: g.entryFired
      })),
      activeIdx: G.party.activeIdx,
      resources: { ...G.party.resources }
    },
    coins: G.coins,
    items: G.items,
    quests: G.quests,
    seals: G.seals,
    currentNode: G.currentNode,
    visitedNodes: [...G.visitedNodes],
    revealedEncounters: G.revealedEncounters,
    turnNumber: G.turnNumber,
    bossesDefeated: G.bossesDefeated,
    regionsUnlocked: G.regionsUnlocked,
    gameOver: G.gameOver,
    won: G.won,
    clearedNodes: G._clearedNodes ? [...G._clearedNodes] : []
  };
  localStorage.setItem('boo_adventure_save', JSON.stringify(saveData));
}

function loadGame() {
  const raw = localStorage.getItem('boo_adventure_save');
  if (!raw) return null;
  try {
    const data = JSON.parse(raw);
    // Reconstruct game state
    const state = ENGINE.createGameState(data.party.ghosts[0].id);
    state.party.ghosts = data.party.ghosts;
    state.party.activeIdx = data.party.activeIdx;
    state.party.resources = data.party.resources;
    state.coins = data.coins;
    state.items = data.items || [];
    state.quests = data.quests || [];
    state.seals = data.seals || [];
    state.currentNode = data.currentNode;
    state.visitedNodes = new Set(data.visitedNodes || []);
    state.revealedEncounters = data.revealedEncounters || {};
    state.turnNumber = data.turnNumber || 0;
    state.bossesDefeated = data.bossesDefeated || [];
    state.regionsUnlocked = data.regionsUnlocked || ['rolling_hills'];
    state.gameOver = data.gameOver || false;
    state.won = data.won || false;
    state._clearedNodes = new Set(data.clearedNodes || []);
    return state;
  } catch (e) {
    console.error('Failed to load save:', e);
    return null;
  }
}

function deleteSave() {
  localStorage.removeItem('boo_adventure_save');
}

// ── ENCOUNTERS (BATTLES) ──
function startEncounter(node) {
  let cardId = G.revealedEncounters[node.id];
  if (!cardId) {
    const card = ENGINE.getEncounterCard(node.r, node.name);
    cardId = card.id;
    G.revealedEncounters[node.id] = cardId;
  }

  const card = ENGINE.getCard(cardId);

  // Show encounter preview (FIGHT or FLEE)
  if (typeof showEncounterPreview === 'function') {
    showEncounterPreview(card,
      () => { // FIGHT
        hideModal();
        document.getElementById('modal').style.maxWidth = '500px';
        doEncounterBattle(card, cardId, node);
      },
      () => { // FLEE
        hideModal();
        document.getElementById('modal').style.maxWidth = '500px';
        endTurn();
      }
    );
  } else {
    doEncounterBattle(card, cardId, node);
  }
}

function doEncounterBattle(card, cardId, node) {
  const enemyTeam = ENGINE.makeTeam([cardId]);

  showBattle(G.party, enemyTeam, false, () => {
    if (!ENGINE.isTeamDefeated(enemyTeam)) { endTurn(); return; }
    G.coins += 3;
    markEncounterCleared(node.id);

    // Use new recruit screen with full party management
    if (typeof showRecruitScreen === 'function') {
      showRecruitScreen(card, () => { updateHUD(); endTurn(); });
    } else {
      // Fallback
      if (G.party.ghosts.length < 5) G.party.ghosts.push(ENGINE.makeGhost(cardId));
      updateHUD(); endTurn();
    }
  });
}

// ── BATTLE SYSTEM (UI) ──
let battleState = null;

function showBattle(playerTeam, enemyTeam, isBoss, onComplete) {
  battleFlash();
  battleState = { playerTeam, enemyTeam, isBoss, onComplete, round: 0 };
  const screen = document.getElementById('battle-screen');
  screen.style.display = 'flex';
  document.getElementById('b-result').textContent = '';
  document.getElementById('b-callout').textContent = '';
  document.getElementById('b-dice-area').innerHTML = '';
  // Start battle music
  if (!window._battleMusic) {
    window._battleMusic = new Audio('../testroom/../boo/BGG.mp3');
    window._battleMusic.loop = true;
    window._battleMusic.volume = 0.3;
  }
  window._battleMusic.play().catch(() => {});
  updateBattleUI();
  showRollActions();
}

function showRollActions() {
  const actions = [];
  const res = battleState.playerTeam.resources;
  // Resource commit buttons
  if (res.healingSeed > 0) actions.push({text:`🌱 Heal (${res.healingSeed})`,cls:'resource',action:()=>{
    res.healingSeed--;const g=ENGINE.activeGhost(battleState.playerTeam);g.hp=Math.min(g.maxHp,g.hp+2);
    showCallout('+2 HP from Healing Seed','#50c040');updateBattleUI();showRollActions();
  }});
  if (res.surge > 0) actions.push({text:`⚡ Surge +1 die (${res.surge})`,cls:'resource',action:()=>{
    res.surge--;battleState.extraDice=(battleState.extraDice||0)+1;
    showCallout('+1 die from Surge!','#f0d860');showRollActions();
  }});
  // Item usage
  if (G && G.items) {
    const smoke = G.items.findIndex(i => i.id === 'smoke_bomb');
    if (smoke >= 0 && !battleState.isBoss) {
      actions.push({text:'💨 Smoke Bomb (flee)',cls:'resource',action:()=>{
        G.items.splice(smoke, 1); endBattle(); endTurn();
      }});
    }
    const crystal = G.items.findIndex(i => i.id === 'power_crystal');
    if (crystal >= 0) {
      actions.push({text:'💎 Power Crystal (+2 dmg)',cls:'resource',action:()=>{
        G.items.splice(crystal, 1); battleState.powerCrystal = true;
        showCallout('Power Crystal! +2 damage this battle','#f0d860'); showRollActions();
      }});
    }
    const horn = G.items.findIndex(i => i.id === 'battle_horn');
    if (horn >= 0 && !battleState.usedHorn) {
      actions.push({text:'📯 Battle Horn (reroll)',cls:'resource',action:()=>{
        battleState.usedHorn = true; G.items.splice(horn, 1);
        showCallout('Battle Horn! Rerolling...','#f0d860');
        doBattleRound(); // Just roll again
      }});
    }
  }
  actions.push({ text: 'ROLL DICE', cls: 'attack', action: () => doBattleRound() });
  setBattleActions(actions);
}

// Old renderFighter removed — now uses battle-ui.js renderBattleScreen()

function updateBattleUI() {
  if (typeof renderBattleScreen === 'function') {
    renderBattleScreen(battleState);
  }
}

function showCallout(text, color) {
  const el = document.getElementById('b-callout');
  el.textContent = text;
  el.style.color = color || '#f0d860';
  el.style.opacity = '1';
  setTimeout(() => el.style.opacity = '0', 1800);
}

function doBattleRound() {
  const bs = battleState;
  bs.round++;

  // Fire entry abilities on first round
  if (bs.round === 1) {
    const entryResult = { events: [] };
    ENGINE.triggerEntryAbility(bs.playerTeam, bs.enemyTeam, entryResult);
    ENGINE.triggerEntryAbility(bs.enemyTeam, bs.playerTeam, entryResult);
    if (entryResult.events.length) {
      logBattle(entryResult.events.join(' | '));
    }
  }

  const extraDice = bs.extraDice || 0;
  bs.extraDice = 0;
  const result = ENGINE.resolveBattleRound(bs.playerTeam, bs.enemyTeam, 3 + extraDice, 3);
  // Power Crystal bonus
  if (bs.powerCrystal && result.winner === 'a' && result.enemyDamageDealt > 0) {
    const target = ENGINE.activeGhost(bs.enemyTeam);
    target.hp = Math.max(0, target.hp - 2);
    if (target.hp <= 0) target.ko = true;
    result.enemyDamageDealt += 2;
    result.events.push('💎 Power Crystal: +2 damage!');
  }

  // Sound effects
  playSFX('dice');
  if (result.winner !== 'tie') {
    const dmg = result.winner === 'a' ? result.enemyDamageDealt : result.playerDamageDealt;
    setTimeout(() => {
      if (dmg >= 3) playSFX('dmg3');
      else if (dmg >= 2) playSFX('dmg2');
      else if (dmg >= 1) playSFX('dmg1');
      if (result.playerRoll.type === 'triples' || result.enemyRoll.type === 'triples') playSFX('triples');
    }, 400);
  }

  // Animated dice reveal
  const diceArea = document.getElementById('b-dice-area');
  const pWin = result.winner === 'a';
  const eWin = result.winner === 'b';
  diceArea.innerHTML = `
    <div class="dice-group">${result.playerDice.map(d => `<div class="die rolling ${pWin?'win':eWin?'lose':''}">${d}</div>`).join('')}</div>
    <div class="dice-group">${result.enemyDice.map(d => `<div class="die rolling ${eWin?'win':pWin?'lose':''}">${d}</div>`).join('')}</div>
  `;

  // Result text
  const resultEl = document.getElementById('b-result');
  const pRoll = ENGINE.describeRoll(result.playerRoll);
  const eRoll = ENGINE.describeRoll(result.enemyRoll);
  if (pWin) {
    resultEl.innerHTML = `<span style="color:#90e070">${pRoll} — WIN!</span> vs <span style="opacity:.5">${eRoll}</span>`;
    if (result.enemyDamageDealt > 0) showCallout(`${result.enemyDamageDealt} DAMAGE!`, '#e05050');
  } else if (eWin) {
    resultEl.innerHTML = `<span style="opacity:.5">${pRoll}</span> vs <span style="color:#e05050">${eRoll} — LOSE</span>`;
    if (result.playerDamageDealt > 0) showCallout(`${result.playerDamageDealt} DAMAGE!`, '#e05050');
  } else {
    resultEl.innerHTML = `<span style="color:#f0d860">TIE — ${pRoll}</span>`;
  }

  // Show ability events as callouts
  for (let i = 0; i < result.events.length; i++) {
    setTimeout(() => showCallout(result.events[i], '#f0d860'), 600 + i * 800);
  }

  // Log events
  for (const evt of result.events) logBattle(evt);

  updateBattleUI();

  // Check for battle end
  const pGhost = ENGINE.activeGhost(bs.playerTeam);
  const eGhost = ENGINE.activeGhost(bs.enemyTeam);

  if (eGhost.ko) {
    if (ENGINE.isTeamDefeated(bs.enemyTeam)) {
      logBattle('VICTORY!');
      setBattleActions([{ text: 'CONTINUE', cls: 'attack', action: () => endBattle() }]);
      return;
    }
    // Enemy has more ghosts — auto-swap to next alive
    const nextIdx = bs.enemyTeam.ghosts.findIndex((g, i) => i !== bs.enemyTeam.activeIdx && !g.ko);
    if (nextIdx >= 0) {
      bs.enemyTeam.activeIdx = nextIdx;
      logBattle(`${ENGINE.activeGhost(bs.enemyTeam).name} enters the battle!`);
      updateBattleUI();
    }
  }

  if (pGhost.ko) {
    const aliveCount = ENGINE.aliveGhosts(bs.playerTeam).length;
    if (aliveCount === 0) {
      logBattle('DEFEATED... Return to nearest camp.');
      setBattleActions([{ text: 'CONTINUE', action: () => { endBattle(); handleDefeat(); } }]);
      return;
    }
    // Let player choose swap
    showSwapModal(bs.playerTeam, () => {
      updateBattleUI();
      showRollActions();
    });
    return;
  }

  if (result.winner === 'tie') {
    // Auto re-roll on tie
    setBattleActions([{ text: 'RE-ROLL', cls: 'attack', action: () => doBattleRound() }]);
    return;
  }

  showRollActions();
}

function showSwapModal(team, callback) {
  if (typeof showKoSwapPicker === 'function') {
    showKoSwapPicker(team, battleState.enemyTeam, () => {
      updateBattleUI();
      callback();
    });
  } else {
    // Fallback: auto-pick first alive
    const alive = team.ghosts.findIndex((g, i) => i !== team.activeIdx && !g.ko);
    if (alive >= 0) team.activeIdx = alive;
    callback();
  }
}

function endBattle() {
  document.getElementById('battle-screen').style.display = 'none';
  document.getElementById('b-log').innerHTML = '';
  document.getElementById('b-dice-area').innerHTML = '';
  document.getElementById('b-result').textContent = '';
  document.getElementById('b-callout').textContent = '';
  if (window._battleMusic) window._battleMusic.pause();
  const cb = battleState.onComplete;
  battleState = null;
  if (cb) cb();
}

function handleDefeat() {
  // Revive all ghosts to 1 HP, lose half coins
  for (const g of G.party.ghosts) { g.ko = false; g.hp = 1; g.entryFired = false; }
  G.coins = Math.floor(G.coins / 2);
  updateHUD();
  endTurn();
}

function setBattleActions(actions) {
  const el = document.getElementById('b-actions');
  el.innerHTML = '';
  for (const a of actions) {
    const btn = document.createElement('button');
    btn.textContent = a.text;
    if (a.cls) btn.className = a.cls;
    btn.onclick = a.action;
    el.appendChild(btn);
  }
}

function logBattle(text) {
  const el = document.getElementById('b-log');
  el.innerHTML += `<div>${text}</div>`;
  el.scrollTop = el.scrollHeight;
}

// ── CAMP ──
function showCamp(node) {
  showModal(node.name, '<p>Welcome to camp. Choose an action:</p>', [
    { text: 'HEAL ALL (+full HP)', primary: true, action: () => {
      for (const g of G.party.ghosts) { g.hp = g.maxHp; g.ko = false; g.entryFired = false; }
      hideModal(); showMessage('Healed!', 'All Spiritkin restored to full HP.'); updateHUD(); endTurn();
    }},
    { text: 'TRAIN (3 coins, +1 max HP to active)', action: () => {
      if (G.coins >= 3) {
        G.coins -= 3;
        const ghost = ENGINE.activeGhost(G.party);
        ghost.maxHp += 1; ghost.hp += 1;
        hideModal(); showMessage('Training!', `${ghost.name} gained +1 max HP!`); updateHUD(); endTurn();
      } else { hideModal(); showMessage('Not enough coins', 'Need 3 coins to train.'); endTurn(); }
    }},
    { text: 'REST (+2 resources of choice)', action: () => {
      // Give 2 random resources
      const types = ['luckyStone','moonstone','healingSeed','surge','iceShard'];
      for (let i = 0; i < 2; i++) {
        const t = types[Math.floor(Math.random() * types.length)];
        ENGINE.addResource(G.party.resources, t, 1);
      }
      hideModal(); showMessage('Rested!', 'Gained 2 random resources.'); updateHUD(); endTurn();
    }},
    { text: 'Leave', action: () => { hideModal(); endTurn(); }}
  ]);
}

// ── SHOP ──
function showShop(node) {
  const items = ENGINE.getShopItems();
  const actions = items.map(item => ({
    text: `${item.name} (${item.cost} coins)`,
    action: () => {
      if (G.coins >= item.cost) {
        G.coins -= item.cost;
        G.items.push({ ...item });
        hideModal(); showMessage('Purchased!', `Got ${item.name}: ${item.desc}`); updateHUD(); endTurn();
      } else {
        hideModal(); showMessage('Not enough coins!', `${item.name} costs ${item.cost} coins.`); endTurn();
      }
    }
  }));
  actions.push({ text: 'Leave', action: () => { hideModal(); endTurn(); }});
  showModal(node.name, '<p>Browse the wares:</p>', actions);
}

// ── EVENTS ──
function doEvent(node) {
  const event = ENGINE.drawEvent();
  switch (event.type) {
    case 'battle':
      showMessage(event.name, event.desc);
      setTimeout(() => startEncounter(node), 1000);
      break;
    case 'reward':
      G.coins += event.reward.coins || 0;
      showMessage(event.name, `${event.desc} +${event.reward.coins} coins!`);
      updateHUD(); setTimeout(endTurn, 1500);
      break;
    case 'heal':
      for (const g of G.party.ghosts) g.hp = Math.min(g.maxHp, g.hp + 2);
      showMessage(event.name, event.desc); updateHUD(); setTimeout(endTurn, 1500);
      break;
    case 'resources':
      const types = ['luckyStone','moonstone','healingSeed','surge','iceShard'];
      ENGINE.addResource(G.party.resources, types[Math.floor(Math.random()*types.length)], 1);
      ENGINE.addResource(G.party.resources, types[Math.floor(Math.random()*types.length)], 1);
      showMessage(event.name, event.desc); updateHUD(); setTimeout(endTurn, 1500);
      break;
    case 'trap':
      const active = ENGINE.activeGhost(G.party);
      active.hp = Math.max(0, active.hp - 2);
      if (active.hp <= 0) active.ko = true;
      showMessage(event.name, `${active.name} takes 2 damage!`); updateHUD(); setTimeout(endTurn, 1500);
      break;
    case 'free_recruit':
      const freeCard = ENGINE.getEncounterCard(node.r);
      if (G.party.ghosts.length < 5) {
        G.party.ghosts.push(ENGINE.makeGhost(freeCard.id));
        showMessage(event.name, `${freeCard.name} joins your team!`);
      } else {
        showMessage(event.name, 'Your party is full!');
      }
      updateHUD(); setTimeout(endTurn, 1500);
      break;
    default:
      showMessage(event.name, event.desc); setTimeout(endTurn, 1500);
  }
}

// ── SHRINE ──
function showShrine(node) {
  showModal(node.name, `<p>${node.desc}</p><p>Shrines offer powerful one-time rewards.</p>`, [
    { text: 'Claim Reward', primary: true, action: () => {
      // Give a strong reward
      ENGINE.addResource(G.party.resources, 'firefly', 2);
      ENGINE.addResource(G.party.resources, 'moonstone', 2);
      hideModal(); showMessage('Shrine Blessing!', 'Gained 2 Magic Fireflies and 2 Moonstones!'); updateHUD(); endTurn();
    }},
    { text: 'Leave', action: () => { hideModal(); endTurn(); }}
  ]);
}

// ── QUEST ──
function showQuest(node) {
  showModal(node.name, '<p>A quest appears on the board...</p><p><i>Quest system coming soon! For now, gain 5 coins.</i></p>', [
    { text: 'Accept', primary: true, action: () => {
      G.coins += 5;
      hideModal(); showMessage('Quest Accepted!', '+5 coins as a placeholder reward.'); updateHUD(); endTurn();
    }}
  ]);
}

// ── BOSS BATTLE ──
function startBossBattle(node) {
  let bossKey;
  if (node.name.includes('Timber')) bossKey = 'timber';
  else if (node.name.includes('Jay')) bossKey = 'kingJay';
  else if (node.name.includes('Nerina')) bossKey = 'nerina';
  else if (node.name.includes('Lucy')) bossKey = 'lucy';
  else bossKey = 'valkin';

  if (G.bossesDefeated.includes(bossKey)) {
    showMessage('Already Defeated', `You've already beaten ${ENGINE.BOSSES[bossKey].name}!`);
    endTurn();
    return;
  }

  const boss = ENGINE.BOSSES[bossKey];

  // Show boss intro splash first
  showBossIntro(bossKey, () => {
    const enemyTeam = ENGINE.makeTeam([boss.cardId]);
    enemyTeam.ghosts[0].hp = boss.hp;
    enemyTeam.ghosts[0].maxHp = boss.hp;

    showBattle(G.party, enemyTeam, true, () => {
    if (ENGINE.isTeamDefeated(enemyTeam)) {
      G.bossesDefeated.push(bossKey);
      G.coins += 5;

      // Grant seal
      const regionMap = { timber: 'rolling_hills', kingJay: 'frost_valley', nerina: 'volcanic_isles', lucy: 'dark_castle' };
      if (regionMap[bossKey]) G.seals.push(regionMap[bossKey]);

      // Unlock regions
      if (bossKey === 'timber') {
        G.regionsUnlocked.push('frost_valley', 'volcanic_isles');
      } else if (bossKey === 'kingJay' || bossKey === 'nerina') {
        if (G.bossesDefeated.includes('kingJay') || G.bossesDefeated.includes('nerina')) {
          G.regionsUnlocked.push('dark_castle');
        }
      }

      if (bossKey === 'valkin') {
        G.won = true; G.gameOver = true;
        playSFX('win');
        setTimeout(() => showVictoryScreen(), 500);
      } else {
        showModal(
          `${boss.name} DEFEATED!`,
          `<p>+5 Spirit Coins! Region Seal earned!</p>`,
          [{ text: 'CONTINUE', primary: true, action: () => { hideModal(); updateHUD(); endTurn(); } }]
        );
      }
    } else {
      endTurn();
    }
    }); // end showBattle
  }); // end showBossIntro
}

// ── UI HELPERS ──
function showMessage(title, body, noAutoClose) {
  showModal(title, body, noAutoClose ? [] : [{ text: 'OK', action: () => hideModal() }]);
}

function showModal(title, body, actions) {
  document.getElementById('modal-title').innerHTML = title;
  document.getElementById('modal-body').innerHTML = body;
  const actEl = document.getElementById('modal-actions');
  actEl.innerHTML = '';
  for (const a of (actions || [])) {
    const btn = document.createElement('button');
    btn.textContent = a.text;
    if (a.primary) btn.className = 'primary';
    btn.onclick = a.action;
    actEl.appendChild(btn);
  }
  document.getElementById('modal-overlay').style.display = 'flex';
}

function hideModal() {
  document.getElementById('modal-overlay').style.display = 'none';
}

// GREAT FEATURES

// ── VICTORY SCREEN ──
function showVictoryScreen() {
  const el = document.getElementById('victory-screen');
  el.classList.add('active');
  // Stats
  const stats = document.getElementById('victory-stats');
  stats.innerHTML = `
    <div class="victory-stat"><b>Turns:</b> ${G.turnNumber}</div>
    <div class="victory-stat"><b>Party Size:</b> ${G.party.ghosts.length}</div>
    <div class="victory-stat"><b>Bosses Defeated:</b> ${G.bossesDefeated.length}</div>
    <div class="victory-stat"><b>Seals Earned:</b> ${G.seals.length}/4</div>
    <div class="victory-stat"><b>Coins:</b> ${G.coins}</div>
    <div class="victory-stat"><b>Nodes Visited:</b> ${G.visitedNodes.size}</div>
  `;
  // Show final party
  const partyEl = document.getElementById('victory-party');
  partyEl.innerHTML = G.party.ghosts.map(g => renderCard(g, {size:'mini'})).join('');
}

// ── BATTLE TRANSITION ──
function battleFlash() {
  const fl = document.getElementById('battle-flash');
  fl.classList.add('flash');
  setTimeout(() => fl.classList.remove('flash'), 150);
}

// ── SOUND EFFECTS ──
const SFX = {};
function loadSounds() {
  const sounds = {
    dice: '../boo/DiceRoll.mp3',
    dmg1: '../boo/1Damage.mp3',
    dmg2: '../boo/2Damage.mp3',
    dmg3: '../boo/3Damage.mp3',
    triples: '../boo/triples.mp3',
    special: '../boo/Special.mp3',
    shatter: '../boo/Shatter.mp3',
    win: '../boo/winningwhistle.mp3'
  };
  for (const [key, path] of Object.entries(sounds)) {
    SFX[key] = new Audio(path);
    SFX[key].volume = 0.4;
  }
}
function playSFX(name) {
  if (SFX[name]) { SFX[name].currentTime = 0; SFX[name].play().catch(() => {}); }
}

// ── BOSS INTRO ──
let _bossIntroCallback = null;
function showBossIntro(bossKey, callback) {
  const boss = ENGINE.BOSSES[bossKey];
  const card = ENGINE.getCard(boss.cardId);
  const art = typeof ART_MAP !== 'undefined' && ART_MAP[boss.cardId] ? '../testroom/' + ART_MAP[boss.cardId] : '';

  document.getElementById('boss-intro-art').src = art;
  document.getElementById('boss-intro-name').textContent = boss.name;
  document.getElementById('boss-intro-hp').textContent = boss.hp + ' HP';
  document.getElementById('boss-intro-ability').textContent = card ? card.ability : '';
  document.getElementById('boss-intro-desc').textContent = card ? card.desc : '';
  document.getElementById('boss-intro').classList.add('active');
  _bossIntroCallback = callback;
  playSFX('special');
}
function dismissBossIntro() {
  document.getElementById('boss-intro').classList.remove('active');
  if (_bossIntroCallback) { _bossIntroCallback(); _bossIntroCallback = null; }
}

// ── MAP COMPLETION MARKERS ──
// Track cleared encounters in game state
function markEncounterCleared(nodeId) {
  if (!G._clearedNodes) G._clearedNodes = new Set();
  G._clearedNodes.add(nodeId);
}
function isEncounterCleared(nodeId) {
  return G && G._clearedNodes && G._clearedNodes.has(nodeId);
}

// Load sounds on first interaction
document.addEventListener('click', function initSounds() {
  loadSounds();
  document.removeEventListener('click', initSounds);
}, { once: true });

// Player position + reachable nodes are handled inline via G state checks in drawGame

// ── INIT ──
setTimeout(() => {
  if (typeof ENGINE === 'undefined') { console.error('Engine not loaded!'); return; }

  // Try to load saved game
  const saved = loadGame();
  if (saved) {
    G = saved;
    document.getElementById('starter-screen').style.display = 'none';
    document.getElementById('hud').style.display = 'flex';
    document.getElementById('action-bar').style.display = 'flex';
    updateHUD();
    showMessage('Welcome Back!', `Loaded save — Turn ${G.turnNumber}, ${G.party.ghosts.length} ghosts.`);
  } else {
    showStarterScreen();
  }
}, 100);
