<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forest Room</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #a89868;
            font-family: -apple-system, sans-serif;
        }
        canvas { display: block; cursor: pointer; }

        #loading {
            position: fixed;
            inset: 0;
            background: #a89868;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.8s;
            color: #e8d8b0;
            font-size: 18px;
            letter-spacing: 2px;
        }
        #loading::after {
            content: '';
            width: 40px; height: 40px;
            border: 3px solid #e8d8b033;
            border-top-color: #e8d8b0;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-top: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            color: rgba(255,255,255,0.7);
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 13px;
            letter-spacing: 1px;
            z-index: 10;
            pointer-events: none;
            transition: opacity 3s;
        }
        #controls span {
            color: rgba(255,255,255,0.95);
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div id="loading">entering the forest</div>
    <canvas id="viewport"></canvas>
    <div id="controls">
        <span>WASD</span> move &nbsp;&middot;&nbsp;
        <span>SPACE</span> jump &nbsp;&middot;&nbsp;
        <span>MOUSE</span> look &nbsp;&middot;&nbsp;
        click to start
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="input.js"></script>
    <script src="collision.js"></script>
    <script src="scene.js"></script>
    <script src="character.js"></script>
    <script src="portals.js"></script>
    <script src="physics.js"></script>
    <script src="camera.js"></script>
    <script src="main.js"></script>
</body>
</html>
