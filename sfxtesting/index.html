<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FilmCow SFX Browser</title>
<style>
  :root {
    --bg: #14161a; --panel: #1d2026; --panel2: #23272f;
    --text: #e8eaed; --dim: #9aa0a8; --accent: #ffb454; --play: #4fc47f;
    --chip: #2c313a; --chip-hover: #3a4150;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--panel);
    padding: 14px 20px; border-bottom: 1px solid #000;
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  }
  header h1 { font-size: 17px; margin: 0; white-space: nowrap; }
  header h1 span { color: var(--accent); }
  #search {
    flex: 1; min-width: 200px; background: var(--panel2); border: 1px solid #3a4150;
    color: var(--text); padding: 9px 14px; border-radius: 8px; font-size: 15px; outline: none;
  }
  #search:focus { border-color: var(--accent); }
  #count { color: var(--dim); font-size: 13px; white-space: nowrap; }
  #vol { accent-color: var(--accent); width: 90px; }
  #favBtn {
    background: var(--chip); border: 1px solid #3a4150; color: var(--text);
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  #favBtn.active { background: var(--accent); color: #14161a; border-color: var(--accent); }
  main { padding: 12px 20px 80px; max-width: 1400px; margin: 0 auto; }
  .group { background: var(--panel); border-radius: 10px; padding: 10px 14px; margin: 8px 0; }
  .gname { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
  .gname .n { color: var(--dim); font-weight: 400; font-size: 13px; margin-left: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--chip); border-radius: 6px; padding: 5px 9px;
    cursor: pointer; font-size: 13px; user-select: none; color: var(--dim);
  }
  .chip:hover { background: var(--chip-hover); color: var(--text); }
  .chip.playing { background: var(--play); color: #10241a; font-weight: 600; }
  .chip .star { cursor: pointer; opacity: 0.35; font-size: 14px; }
  .chip .star:hover { opacity: 1; }
  .chip.faved .star { opacity: 1; color: var(--accent); }
  .chip.faved { border: 1px solid var(--accent); padding: 4px 8px; }
  #favPanel {
    position: fixed; right: 0; top: 0; bottom: 0; width: 340px; background: var(--panel2);
    border-left: 1px solid #000; padding: 16px; overflow-y: auto; z-index: 20;
    transform: translateX(100%); transition: transform 0.15s ease;
  }
  #favPanel.open { transform: translateX(0); }
  #favPanel h2 { margin: 0 0 10px; font-size: 15px; }
  #favPanel .fitem {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  #favPanel .fitem:hover { background: var(--chip); }
  #favPanel .fitem .rm { color: var(--dim); cursor: pointer; padding: 0 4px; }
  #favPanel .fitem .rm:hover { color: #ff6b6b; }
  #copyBtn, #closeFav {
    background: var(--chip); border: 1px solid #3a4150; color: var(--text);
    padding: 7px 12px; border-radius: 7px; cursor: pointer; font-size: 13px; margin: 0 6px 12px 0;
  }
  #copyBtn:hover, #closeFav:hover { background: var(--chip-hover); }
  #nowPlaying {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel);
    border-top: 1px solid #000; padding: 10px 20px; font-size: 14px; color: var(--dim);
    display: flex; gap: 12px; align-items: center; z-index: 15;
  }
  #nowPlaying b { color: var(--play); font-weight: 600; }
  .hint { color: var(--dim); font-size: 12px; margin-left: auto; }
</style>
</head>
<body>
<header>
  <h1>FilmCow <span>SFX</span></h1>
  <input id="search" type="search" placeholder="Search sounds… (e.g. footstep, door, punch, water)" autofocus>
  <span id="count"></span>
  <span title="Volume">🔊 <input id="vol" type="range" min="0" max="1" step="0.05" value="0.8"></span>
  <button id="favBtn">★ Favorites (<span id="favCount">0</span>)</button>
</header>
<main id="list"></main>
<div id="favPanel">
  <h2>★ Favorites</h2>
  <button id="copyBtn">Copy list</button>
  <button id="closeFav">Close</button>
  <div id="favList"></div>
</div>
<div id="nowPlaying">Click any chip to play. <b>·</b> Space = replay last <b>·</b> ←/→ = prev/next in group<span class="hint">★ star the keepers, then copy the list from Favorites</span></div>

// group by base name (strip trailing number)
const groups = new Map();
for (const f of FILES) {
  const name = f.replace(/\.(wav|mp3)$/i, '');
  const m = name.match(/^(.*?)\s*(\d+)$/);
  const base = m ? m[1] : name;
  if (!groups.has(base)) groups.set(base, []);
  groups.get(base).push(f);
}
for (const arr of groups.values()) {
  arr.sort((a, b) => {
    const na = parseInt((a.match(/(\d+)\.(wav|mp3)$/i) || [0, 0])[1]);
    const nb = parseInt((b.match(/(\d+)\.(wav|mp3)$/i) || [0, 0])[1]);
    return na - nb;
  });
}
const groupNames = [...groups.keys()].sort();

const audio = new Audio();
let favs = new Set(JSON.parse(localStorage.getItem('sfxFavs') || '[]'));
let lastPlayed = null;
let playingChip = null;

const listEl = document.getElementById('list');
const countEl = document.getElementById('count');
const searchEl = document.getElementById('search');
const volEl = document.getElementById('vol');
audio.volume = parseFloat(localStorage.getItem('sfxVol') || '0.8');
volEl.value = audio.volume;
volEl.oninput = () => { audio.volume = volEl.value; localStorage.setItem('sfxVol', volEl.value); };

function play(file, chip) {
  audio.src = encodeURIComponent(file);
  audio.play();
  lastPlayed = file;
  if (playingChip) playingChip.classList.remove('playing');
  playingChip = chip || null;
  if (playingChip) playingChip.classList.add('playing');
  document.querySelector('#nowPlaying b').textContent = file;
}
audio.onended = () => { if (playingChip) { playingChip.classList.remove('playing'); playingChip = null; } };

function toggleFav(file) {
  if (favs.has(file)) favs.delete(file); else favs.add(file);
  localStorage.setItem('sfxFavs', JSON.stringify([...favs]));
  document.getElementById('favCount').textContent = favs.size;
  renderFavs();
}

function render(filter) {
  listEl.innerHTML = '';
  const terms = filter.toLowerCase().split(/\s+/).filter(Boolean);
  let shownGroups = 0, shownFiles = 0;
  const frag = document.createDocumentFragment();
  for (const g of groupNames) {
    if (terms.length && !terms.every(t => g.toLowerCase().includes(t))) continue;
    const arr = groups.get(g);
    shownGroups++; shownFiles += arr.length;
    const div = document.createElement('div');
    div.className = 'group';
    const title = document.createElement('div');
    title.className = 'gname';
    title.innerHTML = g + ' <span class="n">' + arr.length + (arr.length === 1 ? ' file' : ' files') + '</span>';
    div.appendChild(title);
    const chips = document.createElement('div');
    chips.className = 'chips';
    for (const f of arr) {
      const m = f.match(/(\d+)\.(wav|mp3)$/i);
      const label = m ? m[1] : '▶';
      const chip = document.createElement('span');
      chip.className = 'chip' + (favs.has(f) ? ' faved' : '');
      chip.dataset.file = f;
      const star = document.createElement('span');
      star.className = 'star'; star.textContent = '★';
      star.onclick = (e) => { e.stopPropagation(); toggleFav(f); chip.classList.toggle('faved'); };
      chip.appendChild(document.createTextNode(label + ' '));
      chip.appendChild(star);
      chip.onclick = () => play(f, chip);
      chips.appendChild(chip);
    }
    div.appendChild(chips);
    frag.appendChild(div);
  }
  listEl.appendChild(frag);
  countEl.textContent = shownFiles + ' sounds / ' + shownGroups + ' groups';
}

let debounce;
searchEl.oninput = () => { clearTimeout(debounce); debounce = setTimeout(() => render(searchEl.value), 120); };

// favorites panel
const favPanel = document.getElementById('favPanel');
document.getElementById('favBtn').onclick = () => { favPanel.classList.toggle('open'); renderFavs(); };
document.getElementById('closeFav').onclick = () => favPanel.classList.remove('open');
document.getElementById('copyBtn').onclick = () => {
  navigator.clipboard.writeText([...favs].sort().join('\n'));
  document.getElementById('copyBtn').textContent = 'Copied!';
  setTimeout(() => document.getElementById('copyBtn').textContent = 'Copy list', 1200);
};
function renderFavs() {
  const el = document.getElementById('favList');
  el.innerHTML = '';
  for (const f of [...favs].sort()) {
    const d = document.createElement('div');
    d.className = 'fitem';
    const name = document.createElement('span');
    name.textContent = f;
    d.appendChild(name);
    const rm = document.createElement('span');
    rm.className = 'rm'; rm.textContent = '✕';
    rm.onclick = (e) => { e.stopPropagation(); toggleFav(f); render(searchEl.value); };
    d.appendChild(rm);
    d.onclick = () => play(f, null);
    el.appendChild(d);
  }
  if (!favs.size) el.innerHTML = '<div style="color:var(--dim);font-size:13px">Star sounds to collect them here, then copy the list.</div>';
}

// keyboard: space = replay, arrows = prev/next variant in group
document.addEventListener('keydown', (e) => {
  if (e.target === searchEl && e.key !== 'Escape') return;
  if (e.key === 'Escape') { searchEl.blur(); return; }
  if (e.key === ' ') { e.preventDefault(); if (lastPlayed) play(lastPlayed, playingChip); }
  if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && lastPlayed) {
    e.preventDefault();
    const name = lastPlayed.replace(/\.(wav|mp3)$/i, '');
    const m = name.match(/^(.*?)\s*(\d+)$/);
    const base = m ? m[1] : name;
    const arr = groups.get(base);
    if (!arr || arr.length < 2) return;
    let i = arr.indexOf(lastPlayed) + (e.key === 'ArrowRight' ? 1 : -1);
    i = (i + arr.length) % arr.length;
    const chip = document.querySelector('.chip[data-file="' + CSS.escape(arr[i]) + '"]');
    play(arr[i], chip);
    if (chip) chip.scrollIntoView({ block: 'nearest' });
  }
});

document.getElementById('favCount').textContent = favs.size;
render('');
</script>
