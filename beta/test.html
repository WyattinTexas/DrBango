<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;overflow:hidden}#game-container{width:100vw;height:100vh}</style>
</head>
<body>
<div id="game-container"></div>
<script src="vendor/phaser.min.js"></script>
<script src="game.js"></script>
<script>
// Straight into a run — the home page is for players, not the rig.
// ?class=warrior|ranger|mage picks the bag (default warrior).
// ?s=menu is the exception: it drives the home page by hand.
{
  const p = new URLSearchParams(location.search);
  if (p.get('s') !== 'menu') {
    window.RUNEFALL_AUTOSTART = p.get('class') || 'warrior';
  }
}
// Scenarios:
//   ?s=cascade — thrown 1 fuses a 1; result bounces to an in-range 2 -> 3.
//   ?s=push    — thrown 2 shoves a 1 into another 1; pushed dice must merge.
//   ?s=short   — the only 2 is far out of bounce range; chain must stop at 1.
//   ?s=pit     — a die placed in the shooting circle must be destroyed.
//   ?s=relic   — whetstone: a 1+1 merge must deal 3 (2 + 1), not 2.
//   ?s=shield  — shield 2 merged with a 2 must bank 2 block.
//   ?s=arrow   — arrow 2 into a lone enemy must deal double (4).
//   ?s=fire    — fire 2 must light every enemy, then burn 2 then 1.
window.addEventListener('load', () => {
  window.RUNEFALL_DEBUG = true;
  const scenario = new URLSearchParams(location.search).get('s') || 'cascade';
  setTimeout(() => {
    try {
      const game = window.__runefall;
      const scene = game.scene.keys.game;
      console.log('TEST(' + scenario + '): scene ok, seeded dice=' + scene.dice.length);
      if (scenario !== 'menu') [...scene.dice].forEach(d => scene.destroyDie(d));
      const mk = (x, y, v) => {
        const d = scene.makeDie(x, y, v, 'rest');
        d.restingSince = 0;
        return d;
      };
      let fireVec = { x: 0, y: -14 };
      if (scenario === 'cascade') {
        mk(scene.launcherPos.x, scene.H * 0.25, 1);
        mk(scene.W * 0.62, scene.H * 0.3, 2); // within default bounce range
        scene.nextValue = 1;
      } else if (scenario === 'push') {
        mk(scene.launcherPos.x, scene.H * 0.52, 1);
        mk(scene.launcherPos.x, scene.H * 0.36, 1);
        scene.nextValue = 2;
      } else if (scenario === 'short') {
        TUNE.BOUNCE_RANGE_FRAC = 2;  // as if tuned low via the panel
        TUNE.LAND_SLIDE = 0.5;
        mk(scene.launcherPos.x, scene.H * 0.25, 1);
        mk(scene.W * 0.93, scene.H * 0.15, 2); // far out of range
        scene.nextValue = 1;
      } else if (scenario === 'pit') {
        mk(scene.launcherPos.x + 5, scene.launcherPos.y, 3);
        fireVec = null;
      } else if (scenario === 'wild') {
        const wd = scene.makeDie(scene.launcherPos.x, scene.H * 0.3, 0, 'rest', 'wild');
        wd.restingSince = 0;
        scene.nextValue = 3;
      } else if (scenario === 'menu') {
        // real taps on the canvas: PLAY, then the MAGE card
        // headless Chrome never delivers DOM pointer events to Phaser, so
        // hit-test the point ourselves and fire the top object's handler —
        // still proves the button is where it looks and does what it says
        fireVec = null;
        const click = (x, y, what) => {
          const p = scene.input.activePointer;
          p.x = x; p.y = y; p.worldX = x; p.worldY = y;
          const hits = scene.input.hitTestPointer(p);
          console.log('TEST(menu): ' + what + ' at ' + Math.round(x) + ',' +
            Math.round(y) + ' hits=' + hits.length);
          // hit order isn't guaranteed, and only the button carries a
          // handler — the backdrop underneath ignores it
          for (const h of hits) h.emit('pointerdown', p);
        };
        click(scene.W / 2, scene.H * 0.42, 'PLAY');
        setTimeout(() => {
          const cardH = Math.min(128, scene.H * 0.18);
          const gap = Math.min(cardH + 16, scene.H * 0.24);
          click(scene.W / 2, scene.H * 0.17 + gap * 2 + cardH / 2, 'MAGE card');
        }, 500);
      } else if (scenario === 'shield' || scenario === 'arrow' || scenario === 'fire') {
        // each class die merges with a plain die of its own number
        const kind = scenario === 'shield' ? 'shield' :
          scenario === 'arrow' ? 'arrow' : 'fire';
        mk(scene.launcherPos.x, scene.H * 0.25, 2);
        scene.nextQueue[0] = { kind, value: 2 };
        scene.layoutLauncher();
      } else if (scenario === 'relic') {
        scene.relics = ['whetstone'];
        scene.drawRelics();
        mk(scene.launcherPos.x, scene.H * 0.25, 1);
        scene.nextValue = 1;
      } else if (scenario === 'bomb') {
        const bd = scene.makeDie(scene.launcherPos.x, scene.H * 0.3, 2, 'rest', 'bomb');
        bd.restingSince = 0;
        scene.nextValue = 2;
      }
      if (fireVec) {
        scene.setReady(true);
        scene.fire(fireVec);
        console.log('TEST(' + scenario + '): fired');
      }
      setTimeout(() => {
        const vals = scene.dice.map(d => d.value + ':' + d.state).join(', ');
        console.log('TEST RESULT ' + scenario +
          ' class=' + (scene.playerClass ? scene.playerClass.id : 'none') +
          ' modal=' + scene.modalOpen +
          ' bag=[' + scene.bag.map(e => e.kind + e.value).join(' ') + ']' +
          ' chain=' + scene.chain +
          ' best=' + scene.bestChain + ' dice=[' + vals + '] ready=' + scene.ready +
          ' loftCount=' + scene.loftCount +
          ' relics=[' + scene.relics.join(',') + ']' +
          ' block=' + scene.block +
          ' ehp=' + scene.enemies.map(e => e.hp + '/' + e.maxHp).join(',') +
          ' fire=' + scene.enemies.map(e => e.fire).join(','));
      }, scenario === 'pit' ? 2000 : 6500);
    } catch (e) {
      console.log('TEST ERROR: ' + e.message + '\n' + e.stack);
    }
  }, 1000);
});
</script>
</body>
</html>
