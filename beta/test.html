<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;overflow:hidden}#game-container{width:100vw;height:100vh}</style>
</head>
<body>
<div id="game-container"></div>
<script src="vendor/phaser.min.js"></script>
<script src="game.js"></script>
<script>
window.addEventListener('load', () => {
  setTimeout(() => {
    try {
      const game = window.__runefall;
      const scene = game.scene.keys.game;
      console.log('TEST: scene ok, seeded dice=' + scene.dice.length);
      // clear the seeded board
      [...scene.dice].forEach(d => scene.destroyDie(d));
      // two targets: a 1 straight up from the launcher, and a 2 off to the side
      const d1 = scene.makeDie(scene.launcherPos.x, scene.H * 0.25, 1, 'rest');
      const d2 = scene.makeDie(scene.W * 0.75, scene.H * 0.3, 2, 'rest');
      d1.restingSince = 0; d2.restingSince = 0;
      scene.nextValue = 1;
      scene.setReady(true);
      // fire straight up at the 1
      scene.fire({ x: 0, y: -14 });
      console.log('TEST: fired');
      setTimeout(() => {
        const vals = scene.dice.map(d => d.value + ':' + d.state).join(', ');
        console.log('TEST RESULT chain=' + scene.chain + ' best=' + scene.bestChain +
          ' dice=[' + vals + '] ready=' + scene.ready);
      }, 6000);
    } catch (e) {
      console.log('TEST ERROR: ' + e.message + '\n' + e.stack);
    }
  }, 1000);
});
</script>
</body>
</html>
