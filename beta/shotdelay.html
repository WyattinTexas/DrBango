<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;overflow:hidden;background:#0e1117}#game-container{width:100vw;height:100vh}</style>
</head>
<body>
<div id="game-container"></div>
<script src="vendor/phaser.min.js"></script>
<script src="game.js"></script>
<script>
// Optional scripted actions so the screenshot shows specific states.
document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(location.search);
  if (params.get('fire')) {
    setTimeout(() => {
      const scene = window.__runefall.scene.keys.game;
      scene.setReady(true);
      scene.fire({ x: parseFloat(params.get('vx') || '0'), y: parseFloat(params.get('vy') || '-12') });
    }, 5500);
  }
  if (params.get('tip')) {
    setTimeout(() => {
      const scene = window.__runefall.scene.keys.game;
      scene.spawnStones(1);
      scene.showTooltip(scene.W * 0.45, scene.H * 0.5, params.get('tip'));
    }, 6000);
  }
  if (params.get('enemytip')) {
    setTimeout(() => {
      const scene = window.__runefall.scene.keys.game;
      const e = scene.enemies[0];
      if (e) scene.showEnemyTip(e);
    }, 6000);
  }
  if (params.get('modal')) {
    setTimeout(() => {
      const scene = window.__runefall.scene.keys.game;
      const m = params.get('modal');
      if (m === 'bag') scene.openBag();
      else if (m === 'track') scene.openTrack();
      else if (m === 'shop') { scene.gold = 25; scene.level = 3; scene.openShop(); }
      else if (m === 'choose') { scene.openTrack(0, true); }
    }, 5500);
  }
});
</script>
<!-- /slow takes 8s to respond, holding the load event (and the
     screenshot trigger) open while the game runs in real time -->
<img src="/slow" style="display:none" alt="">
</body>
</html>
