<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Runefall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
  /* exposes iOS safe-area insets to the game via computed style */
  :root {
    --sal: env(safe-area-inset-left);
    --sar: env(safe-area-inset-right);
    --sab: env(safe-area-inset-bottom);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #2e2018;
    overflow: hidden;
    width: 100%;
    height: 100%;
    position: fixed;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  #game-container { width: 100%; height: 100%; }
  #rotate-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: #2e2018;
    color: #e8eaed;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    text-align: center;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
  }
  #rotate-overlay .icon { font-size: 52px; }
  #rotate-overlay .msg { font-size: 20px; font-weight: 600; }
  @media (orientation: portrait) {
    #rotate-overlay { display: flex; }
  }
  #tune-toggle {
    position: fixed;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 60;
    width: 34px;
    height: 34px;
    border-radius: 17px;
    border: 1px solid #6b4a33;
    background: rgba(40, 26, 16, 0.85);
    color: #ead9b8;
    font-size: 17px;
    line-height: 32px;
    text-align: center;
    padding: 0;
  }
  #tune-panel {
    position: fixed;
    right: 48px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 50;
    width: 190px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #6b4a33;
    background: rgba(40, 26, 16, 0.88);
    color: #ead9b8;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 12px;
  }
  #tune-panel.hidden { display: none; }
  #tune-panel h3 {
    margin: 0 0 6px;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: #c9b391;
  }
  #tune-panel label {
    display: block;
    margin-top: 8px;
  }
  #tune-panel .val { float: right; color: #ffd54a; }
  #tune-panel input[type=range] {
    width: 100%;
    margin: 4px 0 0;
    accent-color: #e4bf7e;
  }
</style>
</head>
<body>
<div id="game-container"></div>
<div id="rotate-overlay">
  <div class="icon">&#128241;&#8618;</div>
  <div class="msg">Rotate your device to landscape</div>
</div>
<button id="tune-toggle" aria-label="Tuning">&#9881;</button>
<div id="tune-panel" class="hidden">
  <h3>BOUNCE TUNING</h3>
  <label>Bounce range (&times;die) <span class="val" id="bounce-range-val"></span>
    <input type="range" id="bounce-range" min="1" max="8" step="0.25" value="4">
  </label>
  <label>Bounce height (&times;die) <span class="val" id="bounce-height-val"></span>
    <input type="range" id="bounce-height" min="0.4" max="2.5" step="0.1" value="1.5">
  </label>
  <label>Landing slide <span class="val" id="land-slide-val"></span>
    <input type="range" id="land-slide" min="0" max="8" step="0.25" value="3">
  </label>
  <label>Hop time (ms/px) <span class="val" id="hop-time-val"></span>
    <input type="range" id="hop-time" min="0.2" max="1.2" step="0.05" value="0.5">
  </label>
</div>
<script src="vendor/phaser.min.js"></script>
<script src="game.js?v=0.18.9"></script>
</body>
</html>
