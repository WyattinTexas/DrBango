<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Runefall — Phase 0</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #2e2018;
    overflow: hidden;
    width: 100%;
    height: 100%;
    position: fixed;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  #game-container { width: 100%; height: 100%; }
  #rotate-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: #2e2018;
    color: #e8eaed;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    text-align: center;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
  }
  #rotate-overlay .icon { font-size: 52px; }
  #rotate-overlay .msg { font-size: 20px; font-weight: 600; }
  @media (orientation: portrait) {
    #rotate-overlay { display: flex; }
  }
</style>
</head>
<body>
<div id="game-container"></div>
<div id="rotate-overlay">
  <div class="icon">&#128241;&#8618;</div>
  <div class="msg">Rotate your device to landscape</div>
</div>
<script src="vendor/phaser.min.js"></script>
<script src="game.js?v=0.3.0"></script>
</body>
</html>
