<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle of Origins — Phaser</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; overflow: hidden; }
  #game-container { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="game-container"></div>

<!-- Phaser Engine -->
<script src="node_modules/phaser/dist/phaser.min.js"></script>

<!-- Global State & Stubs (must load before core modules) -->
<script src="src/main.js"></script>
<script src="src/globals.js"></script>

<!-- Core Game Logic (ported from 2D version — pure JS, no DOM) -->
<script src="src/core/cards-data.js"></script>
<script src="src/core/battle.js"></script>
<script src="src/core/npcs.js"></script>
<script src="src/core/crafting.js"></script>
<script src="src/core/gathering.js"></script>
<script src="src/core/quests.js"></script>
<script src="src/core/professions.js"></script>
<script src="src/core/market.js"></script>
<script src="src/core/world-events.js"></script>
<script src="src/core/housing.js"></script>
<script src="src/core/achievements.js"></script>

<!-- Phaser Scenes (rendering layer) -->
<script src="src/scenes/BootScene.js"></script>
<script src="src/scenes/WorldScene.js"></script>
<script src="src/scenes/BattleScene.js"></script>

<!-- Initialize -->
<script>
  // Ensure player defaults after all scripts loaded
  ensurePlayerDefaults();
  // Try to load saved game
  loadGame();
  ensurePlayerDefaults();
  // Start Phaser
  const game = new Phaser.Game(config);
</script>
</body>
</html>
