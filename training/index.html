<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>World Class — Training</title>
<meta name="description" content="Your daily world-class pickleball training protocol. Build the aerobic engine, posterior chain, and explosive power.">
<meta name="theme-color" content="#0a0a0f">

<!-- PWA / iOS home-screen app -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="World Class">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">

<style>
:root{
  --bg:#0a0a0f; --surface:#12121a; --surface2:#1a1a26; --border:#2a2a3a;
  --text:#e8e8ef; --text2:#8888a0;
  --accent:#4f8cff; --green:#34d399; --orange:#f59e0b; --red:#ef4444;
  --purple:#a78bfa; --cyan:#22d3ee; --gold:#fbbf24;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.55;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  text-rendering:optimizeLegibility;
}
button{font-family:inherit;cursor:pointer;color:inherit}
.muted{color:var(--text2)}

/* ─── APP BAR ─── */
.appbar{
  flex:0 0 auto;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(180deg,#0d0d14,rgba(10,10,15,0.92));
  backdrop-filter:saturate(140%) blur(8px);
  border-bottom:1px solid var(--border);
  position:relative;z-index:20;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:0.5px;font-size:0.98em}
.brand .bolt{
  width:26px;height:26px;border-radius:7px;flex-shrink:0;
  background:linear-gradient(150deg,#1b2b4d,#0b1220);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 1px rgba(79,140,255,0.25),0 4px 12px rgba(0,0,0,0.4);
}
.brand .bolt svg{width:14px;height:14px}
.brand .sub{color:var(--text2);font-weight:600;font-size:0.7em;letter-spacing:1.5px;text-transform:uppercase;display:block;margin-top:-2px}
.streak{
  display:flex;align-items:center;gap:6px;
  background:var(--surface2);border:1px solid var(--border);
  padding:6px 11px;border-radius:999px;font-weight:800;font-size:0.9em;
}
.streak .flame{filter:grayscale(1) opacity(0.5);font-size:1.05em;transition:filter .3s}
.streak.hot .flame{filter:none}
.streak.hot{border-color:rgba(245,158,11,0.4)}
.streak .streak-n{min-width:0.7em;text-align:center}

/* ─── MAIN SCROLL AREA ─── */
#main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.panel{display:none;padding:14px 14px 30px;max-width:660px;margin:0 auto}
.panel.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ─── TAB BAR ─── */
.tabbar{
  flex:0 0 auto;display:flex;
  padding-bottom:env(safe-area-inset-bottom);
  background:linear-gradient(0deg,#0d0d14,rgba(10,10,15,0.92));
  backdrop-filter:saturate(140%) blur(8px);
  border-top:1px solid var(--border);position:relative;z-index:20;
}
.tab{
  flex:1;background:none;border:none;padding:9px 0 7px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--text2);font-size:0.66em;font-weight:700;letter-spacing:0.4px;
  transition:color .15s;
}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.active{color:var(--accent)}

/* ─── DAY NAV ─── */
.daynav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.daynav-btn{
  width:42px;height:42px;flex-shrink:0;border-radius:12px;
  background:var(--surface);border:1px solid var(--border);
  font-size:1.5em;font-weight:700;color:var(--text2);
  display:flex;align-items:center;justify-content:center;
}
.daynav-btn:active{background:var(--surface2)}
.daynav-center{flex:1;text-align:center}
.daynav-date{font-weight:700;font-size:1.02em}
.daynav-pill{display:inline-block;margin-top:2px;font-size:0.72em;font-weight:700;letter-spacing:0.4px;padding:2px 10px;border-radius:999px;border:1px solid transparent}
.daynav-pill.today{color:var(--green)}
.daynav-pill.jump{color:var(--accent);background:rgba(79,140,255,0.12);border-color:rgba(79,140,255,0.3)}

/* ─── HERO ─── */
.hero{
  padding:20px;border:2px solid var(--accent);border-radius:18px;margin-bottom:14px;
  background:linear-gradient(135deg,#0f1a2e,#0a1520);position:relative;overflow:hidden;
}
.hero::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--accent),var(--cyan),var(--green))}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.hero-label{font-size:0.78em;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:3px}
.hero-title{font-size:1.5em;font-weight:800;letter-spacing:-0.5px;line-height:1.2}
.hero-context{font-size:0.9em;color:var(--text2);line-height:1.5}
.ring{position:relative;width:64px;height:64px;flex-shrink:0}
.ring svg{width:100%;height:100%}
.ring-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:0.82em;font-weight:800;color:var(--accent)}

/* ─── CARDS / SECTIONS ─── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-bottom:12px;overflow:hidden}
.section-head{display:flex;align-items:center;gap:11px;padding:14px 16px;border-bottom:1px solid var(--border)}
.section-num{width:30px;height:30px;flex-shrink:0;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.95em}
.section-meta{flex:1;min-width:0}
.section-title{font-weight:700;font-size:0.98em;line-height:1.25}
.section-dur{font-size:0.76em;color:var(--text2);margin-top:1px}
.section-clock{font-size:0.78em;color:var(--text2);font-weight:600;flex-shrink:0}

/* ─── TODO ITEMS ─── */
.todo{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid rgba(42,42,58,0.5);align-items:flex-start}
.todo:last-child{border-bottom:none}
.todo:active{background:var(--surface2)}
.todo-check{
  width:24px;height:24px;flex-shrink:0;border-radius:7px;border:2px solid var(--border);
  margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.todo-check::after{content:'✓';color:#fff;font-size:0.85em;font-weight:800;opacity:0;transform:scale(0.5);transition:all .15s}
.todo.checked .todo-check{background:var(--green);border-color:var(--green)}
.todo.checked .todo-check::after{opacity:1;transform:scale(1)}
.todo-body{flex:1;min-width:0}
.todo-main{font-weight:600;font-size:0.95em;line-height:1.35;transition:color .15s}
.todo.checked .todo-main{color:var(--text2);text-decoration:line-through;text-decoration-color:rgba(136,136,160,0.5)}
.todo-hint{font-size:0.82em;color:var(--text2);margin-top:3px;line-height:1.45}

.footer-msg{text-align:center;color:var(--text2);font-size:0.88em;padding:14px 10px;font-style:italic}
.footer-msg.done{color:var(--green);font-weight:700;font-style:normal}
.rest-title{font-size:1.4em;font-weight:800;padding:18px 16px 4px}

/* ─── BREATHING TIMER ─── */
.bt{background:var(--surface2);border-top:1px solid var(--border);padding:18px 16px;text-align:center}
.panel#panel-breathe .bt{border:1px solid var(--border);border-radius:16px;margin-top:6px}
.bt-phase{font-size:1.05em;font-weight:800;color:var(--cyan);letter-spacing:0.5px;min-height:1.3em}
.bt-wave{position:relative;height:84px;margin:6px 0 2px}
.bt-svg{width:100%;height:72px;display:block}
.bt-wl{display:flex;justify-content:space-between;padding:0 2px}
.bt-wl span{font-size:0.62em;color:var(--text2);font-weight:600;letter-spacing:0.3px;transition:color .2s}
.bt-wl span.on{color:var(--cyan);font-weight:800}
.bt-count{font-size:2.2em;font-weight:800;line-height:1.1;margin-top:2px}
.bt-meta{display:flex;justify-content:center;gap:16px;font-size:0.72em;color:var(--text2);margin:6px 0 14px}
.bt-meta strong{color:var(--text)}
.bt-controls{display:flex;gap:8px;justify-content:center}
.bt-controls button{padding:11px 26px;border-radius:11px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:800;font-size:0.92em}
.bt-controls button:active{transform:scale(0.97)}
.bt-controls .bt-reset{background:transparent;color:var(--text2);border-color:var(--border)}
.bt-pips{display:flex;gap:5px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.bt-pip{width:8px;height:8px;border-radius:50%;background:var(--border);transition:all .2s}
.bt-pip.done{background:var(--cyan)}
.bt-pip.cur{background:var(--cyan);box-shadow:0 0 8px var(--cyan);transform:scale(1.25)}

/* ─── PLAN TAB ─── */
.plan-intro{color:var(--text2);font-size:0.86em;margin-bottom:16px;line-height:1.5}
.plan-group-title{font-size:0.78em;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent);margin:18px 2px 10px}
.plan-group-title:first-of-type{margin-top:0}
.day-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;transition:border-color .15s}
.day-card:active{background:var(--surface2)}
.day-card.is-today{border-color:var(--accent);box-shadow:0 0 0 1px rgba(79,140,255,0.3)}
.day-card.is-done{opacity:0.72}
.dc-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dc-day{font-weight:800;font-size:0.95em}
.dc-sub{color:var(--text2);font-size:0.78em;font-weight:600}
.dc-done{margin-left:auto;color:var(--green);font-weight:800;font-size:1.05em}
.dc-title{font-weight:700;font-size:1.02em;margin-bottom:9px;line-height:1.25}
.dc-pills{display:flex;flex-wrap:wrap;gap:5px}
.pill{font-size:0.68em;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}

/* ─── COACH TAB ─── */
.coach-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px}
.coach-card h2{font-size:1.15em;font-weight:800;margin-bottom:10px;letter-spacing:-0.3px}
.coach-card h3{font-size:0.95em;font-weight:800;color:var(--accent);margin:14px 0 6px}
.coach-card p{font-size:0.9em;color:#cfcfdc;margin-bottom:9px;line-height:1.55}
.coach-card p strong{color:var(--text)}
.coach-card.truth{border-color:#1a3050;background:linear-gradient(135deg,#0f1626,#0c0f1a)}
.principle{display:flex;gap:13px;margin-bottom:13px}
.p-num{font-size:1.5em;font-weight:800;color:var(--accent);opacity:0.45;flex-shrink:0;line-height:1;min-width:34px}
.principle h4{font-size:0.92em;font-weight:800;margin-bottom:3px}
.principle p{font-size:0.85em;margin-bottom:0}
.equip{margin-bottom:13px}
.equip:last-child{margin-bottom:0}
.equip h4{font-size:0.92em;font-weight:800;margin-bottom:3px}
.equip p{font-size:0.85em;margin-bottom:5px}
.tag{display:inline-block;font-size:0.68em;font-weight:700;padding:3px 10px;border-radius:999px}
.tag-power{background:rgba(245,158,11,0.15);color:var(--orange)}
.tag-cardio{background:rgba(239,68,68,0.15);color:var(--red)}
.tag-recovery{background:rgba(167,139,250,0.15);color:var(--purple)}
.tag-speed{background:rgba(34,211,238,0.15);color:var(--cyan)}
.zone-table{width:100%;border-collapse:collapse;font-size:0.8em;margin:6px 0 14px}
.zone-table th{text-align:left;color:var(--text2);font-weight:700;padding:7px 6px;border-bottom:1px solid var(--border);font-size:0.92em}
.zone-table td{padding:8px 6px;border-bottom:1px solid rgba(42,42,58,0.5);vertical-align:top}
.zone-table tr.z2-row td{background:rgba(52,211,153,0.07)}
.zone-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.z1{background:#60a5fa}.z2{background:#34d399}.z3{background:#fbbf24}.z4{background:#f97316}.z5{background:#ef4444}
.calc{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:6px}
.calc label{display:block;font-size:0.85em;font-weight:600;margin-bottom:9px}
.calc-row{display:flex;gap:8px;align-items:center}
.calc input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--border);border-radius:9px;color:var(--text);padding:11px 13px;font-size:1em;font-family:inherit}
.calc button{background:var(--accent);border:none;border-radius:9px;color:#fff;font-weight:800;padding:11px 20px;font-size:0.95em}
#coach-zones{margin-top:12px;font-size:0.85em;line-height:1.8}
#coach-zones .zr{display:flex;align-items:center}
.callout{background:rgba(79,140,255,0.08);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:12px 14px;font-size:0.85em;color:#cfcfdc;margin-top:14px}
.rules li{font-size:0.88em;color:#cfcfdc;margin:0 0 9px 18px;line-height:1.5}
.rules li strong{color:var(--text)}
.brmenu{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.br-opt{flex:1;max-width:110px;padding:11px 0;border-radius:11px;background:var(--surface);border:1px solid var(--border);color:var(--text2);font-weight:800;font-size:0.9em;text-align:center}
.br-opt.active{background:rgba(34,211,238,0.12);border-color:var(--cyan);color:var(--cyan)}
.breathe-head{text-align:center;margin-bottom:6px}
.breathe-head h2{font-size:1.2em;font-weight:800}
.breathe-head p{color:var(--text2);font-size:0.86em;margin-top:4px}

/* ─── INSTALL BANNER ─── */
.install{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 68px);z-index:30;
  background:var(--surface2);border:1px solid var(--accent);border-radius:14px;padding:13px 14px;
  display:flex;align-items:center;gap:12px;box-shadow:0 8px 30px rgba(0,0,0,0.5)}
.install-txt{flex:1;font-size:0.82em;line-height:1.4}
.install-txt strong{display:block;font-size:1.05em;margin-bottom:2px}
.install-x{background:none;border:none;color:var(--text2);font-size:1.3em;padding:0 4px}
.install button.go{background:var(--accent);border:none;color:#fff;font-weight:800;border-radius:9px;padding:9px 14px;font-size:0.85em}

/* ─── WARM-UP START BUTTON (on Wake Up Protocol card) ─── */
.warmup-start-btn{display:flex;align-items:center;gap:13px;width:calc(100% - 24px);margin:4px 12px 12px;padding:13px 15px;
  background:linear-gradient(135deg,rgba(251,191,36,0.18),rgba(245,158,11,0.10));
  border:1px solid rgba(251,191,36,0.45);border-radius:14px;text-align:left;transition:transform .12s ease,box-shadow .12s ease}
.warmup-start-btn:active{transform:scale(0.985)}
.warmup-start-btn .wsb-play{flex:0 0 auto;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  background:var(--gold);color:#1a1400;font-size:1.05em;box-shadow:0 4px 14px rgba(251,191,36,0.4)}
.warmup-start-btn .wsb-text{display:flex;flex-direction:column;min-width:0}
.warmup-start-btn .wsb-main{font-weight:800;font-size:0.98em;color:#fde68a;letter-spacing:.2px}
.warmup-start-btn .wsb-sub{font-size:0.72em;color:var(--text2);line-height:1.35;margin-top:1px}

/* ─── GUIDED WARM-UP PLAYER (full-screen) ─── */
.wp-overlay{position:fixed;inset:0;z-index:300;background:radial-gradient(120% 90% at 50% 0%,#16131f 0%,#0a0a0f 60%);
  display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .3s ease}
.wp-overlay.visible{opacity:1;pointer-events:auto}
.wp-top{display:flex;align-items:center;justify-content:space-between;padding:max(16px,env(safe-area-inset-top)) 18px 6px}
.wp-step{font-size:0.78em;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--text2)}
.wp-close{background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--text);
  width:34px;height:34px;border-radius:50%;font-size:1.2em;line-height:1;display:grid;place-items:center}
.wp-segs{display:flex;gap:5px;padding:8px 18px 4px}
.wp-segs span{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,0.09);overflow:hidden;position:relative}
.wp-segs span.done{background:var(--gold)}
.wp-segs span.active::after{content:"";position:absolute;inset:0;background:var(--gold);transform-origin:left;
  transform:scaleX(var(--segfill,0));transition:transform .25s linear}
.wp-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 24px;gap:6px}
.wp-cue{font-size:0.8em;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--gold);opacity:.9}
.wp-name{font-size:1.75em;font-weight:850;line-height:1.15;max-width:9em}
.wp-hint{font-size:0.92em;color:var(--text2);max-width:20em;line-height:1.5}
.wp-dial{position:relative;width:248px;height:248px;margin:14px 0 6px}
.wp-dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.wp-dial .track{fill:none;stroke:rgba(255,255,255,0.07);stroke-width:9}
.wp-dial .prog{fill:none;stroke:var(--gold);stroke-width:9;stroke-linecap:round;
  stroke-dasharray:710;stroke-dashoffset:710;transition:stroke-dashoffset .95s linear}
.wp-dial.breath .prog{stroke:var(--cyan)}
.wp-readout{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.wp-big{font-size:3.3em;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.wp-big.pulse{animation:wpPulse .5s ease}
@keyframes wpPulse{0%{transform:scale(1);color:var(--gold)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
.wp-sub{font-size:0.82em;color:var(--text2);font-weight:700;letter-spacing:1px;text-transform:uppercase}
.wp-reps{font-size:4.4em;font-weight:850;line-height:1;font-variant-numeric:tabular-nums}
.wp-reps small{display:block;font-size:0.2em;color:var(--text2);font-weight:700;letter-spacing:3px;text-transform:uppercase;margin-top:8px}
.wp-controls{display:flex;flex-direction:column;gap:10px;padding:8px 22px max(22px,env(safe-area-inset-bottom))}
.wp-primary{width:100%;padding:17px;border:none;border-radius:16px;font-size:1.05em;font-weight:850;letter-spacing:.3px;
  background:var(--gold);color:#1a1400;box-shadow:0 6px 22px rgba(251,191,36,0.32);transition:transform .1s ease}
.wp-primary:active{transform:scale(0.98)}
.wp-primary.ghost{background:rgba(255,255,255,0.08);color:var(--text);box-shadow:none;border:1px solid var(--border)}
.wp-row{display:flex;gap:10px}
.wp-row button{flex:1;padding:13px;border:1px solid var(--border);border-radius:14px;background:rgba(255,255,255,0.05);
  color:var(--text);font-weight:750;font-size:0.92em}
.wp-row button:disabled{opacity:.35}
.wp-row button:active{background:rgba(255,255,255,0.1)}
.wp-done-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:30px}
.wp-done-screen .chk{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:3em;
  background:rgba(52,211,153,0.15);color:var(--green);border:2px solid rgba(52,211,153,0.5)}
.wp-done-screen h2{font-size:1.6em;font-weight:850}
.wp-done-screen p{color:var(--text2);max-width:18em}
</style>
</head>
<body>

<header class="appbar">
  <div class="brand">

/* ═══════════════════ STATE + STORAGE ═══════════════════ */
const STORE_KEY = 'wc_progress_v1';
let viewDate = startOfToday();
let activeTab = 'today';
let coachBuilt = false;

function startOfToday(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
function fmtDateKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function parseKey(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmtMMSS(s){ return Math.floor(s/60)+':'+String(Math.round(s)%60).padStart(2,'0'); }
function loadProgress(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY))||{}; }catch(e){ return {}; } }
function saveProgress(o){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(o)); }catch(e){} }

function resolvedWorkout(date){
  const key = fmtDateKey(date);
  let w = WORKOUTS[key], dayLabel;
  if(w){ dayLabel = w.dayLabel; }
  else {
    const t = TEMPLATES[date.getDay()];
    if(!t) return null;
    w = JSON.parse(JSON.stringify(t));
    const start = new Date(PROGRAM_START+'T00:00:00');
    const diff = Math.floor((new Date(date.getFullYear(),date.getMonth(),date.getDate()) - start)/86400000);
    const wk = Math.max(1, Math.floor(diff/7)+1);
    const din = ((diff%7)+7)%7 + 1;
    dayLabel = `Week ${wk} Day ${din}`;
  }
  const sections = [ Object.assign({}, MORNING_ACTIVATION, { time: w.activationTime||'6:50 AM', _activation:true }), ...w.sections ];
  return { dayLabel, title:w.title, context:w.context, footer:w.footer, doneMessage:w.doneMessage, sections };
}

function computeStreak(){
  const store = loadProgress();
  let streak = 0;
  let d = startOfToday();
  if(!(store[fmtDateKey(d)] && store[fmtDateKey(d)].done)){ d.setDate(d.getDate()-1); }
  while(store[fmtDateKey(d)] && store[fmtDateKey(d)].done){ streak++; d.setDate(d.getDate()-1); }
  return streak;
}

/* ═══════════════════ TABS ═══════════════════ */
function setTab(tab){
  activeTab = tab;
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active', p.id==='panel-'+tab));
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  if(tab==='today') renderToday();
  else if(tab==='plan') renderPlan();
  else if(tab==='breathe') mountBreathe();
  else if(tab==='coach') renderCoach();
  scrollMainTop();
}
function scrollMainTop(){ const m=document.getElementById('main'); if(m) m.scrollTop=0; }

/* ═══════════════════ TODAY ═══════════════════ */
function shiftDay(delta){ viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth(), viewDate.getDate()+delta); renderToday(); scrollMainTop(); }
function goToday(){ viewDate = startOfToday(); renderToday(); scrollMainTop(); }
function openDate(date){ viewDate = new Date(date.getFullYear(), date.getMonth(), date.getDate()); setTab('today'); }
function openWeekday(wd){ let d=startOfToday(); for(let i=0;i<7;i++){ if(d.getDay()===wd) break; d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1); } openDate(d); }

function renderToday(){
  clearTimers();
  const panel = document.getElementById('panel-today');
  const key = fmtDateKey(viewDate);
  const isToday = key === fmtDateKey(startOfToday());
  const dateDisplay = `${DAY_NAMES[viewDate.getDay()]}, ${MONTH_NAMES[viewDate.getMonth()]} ${viewDate.getDate()}`;
  const w = resolvedWorkout(viewDate);

  let html = `<div class="daynav">
    <button class="daynav-btn" onclick="shiftDay(-1)" aria-label="Previous day">‹</button>
    <div class="daynav-center">
      <div class="daynav-date">${dateDisplay}</div>
      ${isToday ? '<div class="daynav-pill today">● Today</div>' : '<button class="daynav-pill jump" onclick="goToday()">Jump to today</button>'}
    </div>
    <button class="daynav-btn" onclick="shiftDay(1)" aria-label="Next day">›</button>
  </div>`;

  if(!w){ panel.innerHTML = html + `<div class="card"><div class="rest-title">Rest Day</div><div class="muted" style="padding:0 16px 18px">No workout scheduled. Recovery is training too.</div></div>`; return; }

  const store = loadProgress();
  const saved = store[key] || { checked:{} };
  let total = 0; w.sections.forEach(s=> total += s.items.length);

  html += `<div class="hero">
    <div class="hero-top">
      <div><div class="hero-label">${w.dayLabel}</div><div class="hero-title">${w.title}</div></div>
      <div class="ring"><svg viewBox="0 0 80 80">
        <circle cx="40" cy="40" r="34" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="5"/>
        <circle id="today-ring-fg" cx="40" cy="40" r="34" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="213.6" transform="rotate(-90 40 40)" style="transition:stroke-dashoffset .4s ease"/>
      </svg><div class="ring-text" id="today-ring-text">0/${total}</div></div>
    </div>
    <div class="hero-context">${w.context}</div>
  </div>`;

  w.sections.forEach((section, sIdx)=>{
    const c = COLOR_MAP[section.color] || COLOR_MAP.gold;
    html += `<div class="card">
      <div class="section-head">
        <span class="section-num" style="background:${c.bg};color:${c.text}">${sIdx+1}</span>
        <div class="section-meta"><div class="section-title">${section.title}</div><div class="section-dur">${section.duration}</div></div>
        <div class="section-clock">${section.time}</div>
      </div>`;
    if(section._activation){
      html += `<button class="warmup-start-btn" onclick="startWarmupPlayer()">
        <span class="wsb-play">▶</span>
        <span class="wsb-text"><span class="wsb-main">Start Guided Warm-Up</span><span class="wsb-sub">Hands-free · timers &amp; voice cues walk you through all 9 steps</span></span>
      </button>`;
    }
    section.items.forEach((item, iIdx)=>{
      const id = sIdx+':'+iIdx;
      const checked = (saved.checked && saved.checked[id]) ? ' checked' : '';
      html += `<div class="todo${checked}" data-item="${id}" onclick="toggleItem(this)"><div class="todo-check"></div><div class="todo-body"><div class="todo-main">${item.main}</div><div class="todo-hint">${item.hint}</div></div></div>`;
    });
    if(section.hasBreathingTimer){ html += `<div class="bt bt-mount" data-rounds="${section._activation?5:10}"></div>`; }
    html += `</div>`;
  });

  html += `<div class="footer-msg" id="today-footer">${w.footer}</div>`;
  panel.innerHTML = html;

  panel.querySelectorAll('.bt-mount').forEach(m=> createBreathTimer(m, parseInt(m.dataset.rounds)||10));
  const done = panel.querySelectorAll('.todo.checked').length;
  updateRingUI(done, total);
}

function toggleItem(el){
  el.classList.toggle('checked');
  if(navigator.vibrate) navigator.vibrate(8);
  commitToday();
}

function commitToday(){
  const panel = document.getElementById('panel-today');
  const items = panel.querySelectorAll('.todo');
  const total = items.length; if(!total) return;
  const checked = {}; let done = 0;
  items.forEach(it=>{ if(it.classList.contains('checked')){ checked[it.dataset.item]=1; done++; } });
  const key = fmtDateKey(viewDate);
  const store = loadProgress();
  const prev = store[key] || {};
  const rec = { checked, total, done: (done===total && total>0) ? 1 : 0 };
  if(rec.done) rec.completedAt = prev.completedAt || Date.now();
  store[key] = rec; saveProgress(store);
  updateRingUI(done, total);
  refreshStreakUI();
}

function updateRingUI(done, total){
  const panel = document.getElementById('panel-today');
  const fg = panel.querySelector('#today-ring-fg'); if(!fg) return;
  const circ = 2*Math.PI*34;
  fg.setAttribute('stroke-dashoffset', circ*(1-(total?done/total:0)));
  const txt = panel.querySelector('#today-ring-text'); txt.textContent = done+'/'+total;
  const foot = panel.querySelector('#today-footer');
  const w = resolvedWorkout(viewDate);
  if(done===total && total>0){
    fg.setAttribute('stroke','var(--green)'); txt.style.color='var(--green)';
    if(foot){ foot.textContent = (w&&w.doneMessage)||'All done. Great work.'; foot.classList.add('done'); }
  } else {
    fg.setAttribute('stroke','var(--accent)'); txt.style.color='var(--accent)';
    if(foot){ foot.textContent = (w&&w.footer)||''; foot.classList.remove('done'); }
  }
}

function refreshStreakUI(){
  const n = computeStreak();
  const chip = document.getElementById('streak-chip');
  chip.querySelector('.streak-n').textContent = n;
  chip.classList.toggle('hot', n>0);
}

function sectionPills(sections){
  return sections.map(s=>{ const c=COLOR_MAP[s.color]||COLOR_MAP.gold; const label=s.title.split(' — ')[0]; return `<span class="pill" style="background:${c.bg};color:${c.text}">${label}</span>`; }).join('');
}
function planCard(key, w, isTemplate, wd){
  const store = loadProgress();
  const done = !isTemplate && store[key] && store[key].done;

/* ═══════════════════ BREATHING TIMER (reusable wave) ═══════════════════ */
let _btUid = 0;
const _activeTimers = [];
function clearTimers(){ while(_activeTimers.length){ _activeTimers.pop().stop(); } }

function createBreathTimer(root, rounds){
  rounds = rounds || 10;
  const uid = ++_btUid;
  const SECS = 4, PHASES = ['Inhale','Hold','Exhale','Hold'];
  const totalSecs = rounds * SECS * 4;
  root.innerHTML = `
    <div class="bt-phase">Ready</div>
    <div class="bt-wave">
      <svg class="bt-svg" viewBox="0 0 400 100" preserveAspectRatio="none">
        <defs><linearGradient id="wfill${uid}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="rgba(34,211,238,0.16)"/><stop offset="100%" stop-color="rgba(34,211,238,0)"/>
        </linearGradient></defs>
        <path class="bt-fill" fill="url(#wfill${uid})"/>
        <path class="bt-path" fill="none" stroke="rgba(34,211,238,0.15)" stroke-width="2"/>
        <path class="bt-trail" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
        <circle class="bt-glow" r="10" fill="rgba(34,211,238,0.2)"/>
        <circle class="bt-dot" r="5" fill="#22d3ee"/>
      </svg>
      <div class="bt-wl"><span>Inhale</span><span>Hold</span><span>Exhale</span><span>Hold</span></div>
    </div>
    <div class="bt-count">4</div>
    <div class="bt-meta"><span>Round <strong class="bt-round">0</strong>/${rounds}</span><span>Elapsed <strong class="bt-elapsed">0:00</strong></span><span>Total ${fmtMMSS(totalSecs)}</span></div>
    <div class="bt-controls"><button class="bt-start" type="button">Start</button><button class="bt-reset" type="button">Reset</button></div>
    <div class="bt-pips"></div>`;
  const q = s=> root.querySelector(s);
  const pipsEl = q('.bt-pips');
  for(let i=0;i<rounds;i++){ const p=document.createElement('div'); p.className='bt-pip'; pipsEl.appendChild(p); }

  const VH=100, M=10, TOPy=M, BOTy=VH-M;
  const wp = `M 0,${BOTy} C 35,${BOTy} 65,${TOPy} 100,${TOPy} L 200,${TOPy} C 235,${TOPy} 265,${BOTy} 300,${BOTy} L 400,${BOTy}`;
  const pathEl = q('.bt-path'), trailEl = q('.bt-trail');
  q('.bt-fill').setAttribute('d', wp + ` L 400,${VH} L 0,${VH} Z`);
  pathEl.setAttribute('d', wp); trailEl.setAttribute('d', wp);
  let pathLen = 620; try{ pathLen = pathEl.getTotalLength() || 620; }catch(e){}
  trailEl.style.strokeDasharray = pathLen; trailEl.style.strokeDashoffset = pathLen;

  let running=false, paused=false, timer=null, raf=null, phase=0, sec=SECS, round=1, elapsed=0, lastTick=0;
  const wlSpans = root.querySelectorAll('.bt-wl span');

  function cycleProg(frac){ frac=frac||0; const pp=1-((sec-frac)/SECS); return Math.min(1, Math.max(0, (phase+Math.max(0,pp))/4)); }
  function posDot(p){
    if(!pathLen || !isFinite(pathLen)){ try{ pathLen = pathEl.getTotalLength()||620; }catch(e){ pathLen=620; } }
    let pt; try{ pt = pathEl.getPointAtLength(p*pathLen); }catch(e){ return; }
    q('.bt-dot').setAttribute('cx',pt.x); q('.bt-dot').setAttribute('cy',pt.y);
    q('.bt-glow').setAttribute('cx',pt.x); q('.bt-glow').setAttribute('cy',pt.y);
    trailEl.style.strokeDashoffset = pathLen*(1-p);
  }
  function labels(){ wlSpans.forEach((s,i)=> s.classList.toggle('on', i===phase)); }
  function pips(){ const c=pipsEl.children; for(let i=0;i<rounds;i++){ c[i].className='bt-pip'; if(i<round-1)c[i].classList.add('done'); else if(i===round-1&&running)c[i].classList.add('cur'); } }
  function render(frac){
    q('.bt-phase').textContent = running?PHASES[phase]:(paused?'Paused':'Ready');
    q('.bt-count').textContent = sec;
    q('.bt-round').textContent = (running||paused)?round:0;
    q('.bt-elapsed').textContent = fmtMMSS(elapsed);
    posDot(cycleProg(frac)); labels(); pips();
  }
  function animate(){ if(!running) return; const frac=Math.min((performance.now()-lastTick)/1000,1); posDot(cycleProg(frac)); raf=requestAnimationFrame(animate); }
  function tick(){
    elapsed++; sec--; lastTick=performance.now();
    if(sec<=0){
      phase++;
      if(phase>=4){
        phase=0;
        if(round>=rounds){
          running=false; q('.bt-phase').textContent='Complete'; q('.bt-count').textContent='✓'; q('.bt-start').textContent='Start';
          posDot(1); Array.from(pipsEl.children).forEach(p=>p.className='bt-pip done');
          clearInterval(timer); timer=null; cancelAnimationFrame(raf);
          if(navigator.vibrate) navigator.vibrate([60,40,60]);
          return;
        }
        round++;
      }
      sec=SECS;
    }
    render();
  }
  function start(){ running=true;paused=false;phase=0;sec=SECS;round=1;elapsed=0;lastTick=performance.now(); q('.bt-start').textContent='Pause'; render(); timer=setInterval(tick,1000); raf=requestAnimationFrame(animate); }
  function pause(){ running=false;paused=true;clearInterval(timer);timer=null;cancelAnimationFrame(raf); q('.bt-start').textContent='Resume'; render(); }
  function resume(){ running=true;paused=false;lastTick=performance.now(); q('.bt-start').textContent='Pause'; render(); timer=setInterval(tick,1000); raf=requestAnimationFrame(animate); }
  function reset(){ running=false;paused=false;clearInterval(timer);timer=null;cancelAnimationFrame(raf); phase=0;sec=SECS;round=1;elapsed=0; q('.bt-start').textContent='Start'; trailEl.style.strokeDashoffset=pathLen; render(); }

  q('.bt-start').addEventListener('click', ()=>{ if(!running&&!paused) start(); else if(running) pause(); else resume(); });
  q('.bt-reset').addEventListener('click', reset);
  posDot(0); render();

  const handle = { stop(){ running=false;paused=false;clearInterval(timer);timer=null;cancelAnimationFrame(raf); } };
  _activeTimers.push(handle);
  return handle;
}

/* ═══════════════════ GUIDED WARM-UP PLAYER ═══════════════════ */
const WP = {
  steps: MORNING_ACTIVATION.items,
  i: 0, running:false, paused:false, timerId:null, remaining:0, total:0,
  audioCtx:null, voiceReady:false, segs:[], boxPhase:0, boxRound:0
};
const WP_BOX = [['Inhale',4],['Hold',4],['Exhale',4],['Hold',4]];

function wpEl(id){ return document.getElementById(id); }

function startWarmupPlayer(){
  WP.i = 0; WP.running = false; WP.paused = false;
  const ov = wpEl('wpOverlay');
  wpEl('wpDone').style.display = 'none';
  wpEl('wpBody').style.display = 'flex';
  wpEl('wpControls').style.display = 'flex';
  // build progress segments
  const segWrap = wpEl('wpSegs'); segWrap.innerHTML = '';
  WP.segs = WP.steps.map(()=>{ const s=document.createElement('span'); segWrap.appendChild(s); return s; });
  ov.classList.add('visible'); ov.setAttribute('aria-hidden','false');
  document.body.style.overflow = 'hidden';
  // unlock audio + voice on this user gesture
  try{ WP.audioCtx = WP.audioCtx || new (window.AudioContext||window.webkitAudioContext)(); if(WP.audioCtx.state==='suspended') WP.audioCtx.resume(); }catch(e){}
  if('speechSynthesis' in window){ try{ speechSynthesis.getVoices(); WP.voiceReady = true; }catch(e){} }
  wpLoadStep(0, true);
}

function wpClosePlayer(){
  wpClearTimer();
  if('speechSynthesis' in window) try{ speechSynthesis.cancel(); }catch(e){}
  const ov = wpEl('wpOverlay');
  ov.classList.remove('visible'); ov.setAttribute('aria-hidden','true');
  document.body.style.overflow = '';
  WP.running = false;
}

function wpClearTimer(){ if(WP.timerId){ clearInterval(WP.timerId); WP.timerId = null; } }

function wpSay(text){
  if(!('speechSynthesis' in window) || !text) return;
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 1.0; u.pitch = 1.0; u.volume = 1.0; speechSynthesis.speak(u); }catch(e){}
}

function wpBeep(freq, dur, vol){
  if(!WP.audioCtx) return;
  try{
    const t = WP.audioCtx.currentTime;
    const o = WP.audioCtx.createOscillator(), g = WP.audioCtx.createGain();
    o.type='sine'; o.frequency.value = freq||880;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol||0.25, t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t+(dur||0.15));
    o.connect(g); g.connect(WP.audioCtx.destination); o.start(t); o.stop(t+(dur||0.15)+0.02);
  }catch(e){}
}

function wpUpdateSegs(frac){
  WP.segs.forEach((s,idx)=>{
    s.classList.toggle('done', idx < WP.i);
    s.classList.toggle('active', idx === WP.i);
    if(idx === WP.i) s.style.setProperty('--segfill', frac!=null?frac:0);
  });
}

function wpSetDial(frac, breath){
  const prog = wpEl('wpProg'); const C = 710;
  prog.style.strokeDashoffset = C - C*Math.max(0,Math.min(1,frac));
  wpEl('wpDial').classList.toggle('breath', !!breath);
}

function wpFmt(s){ const m=Math.floor(s/60); const ss=s%60; return m+':'+String(ss).padStart(2,'0'); }

function wpLoadStep(idx, first){
  wpClearTimer();
  WP.i = idx; WP.running = true; WP.paused = false;
  const step = WP.steps[idx];
  wpEl('wpStep').textContent = `Step ${idx+1} / ${WP.steps.length}`;
  wpEl('wpCue').textContent = step.cue || 'Warm Up';
  wpEl('wpName').textContent = step.main.split(' — ')[0];
  wpEl('wpHint').textContent = step.hint || '';
  wpEl('wpBack').disabled = idx === 0;
  wpEl('wpSkip').textContent = idx === WP.steps.length-1 ? 'Finish ›' : 'Skip ›';
  if(!first) wpSay(step.say || step.main);
  else setTimeout(()=>wpSay(step.say || step.main), 250);

  if(step.secs){ wpStartCountdown(step.secs); }
  else if(step.box){ wpStartBox(step.box); }
  else { wpStartReps(step); }
  wpUpdateSegs(0);
}

/* timed exercise (jumping jacks, plank) */
function wpStartCountdown(secs){
  WP.total = secs; WP.remaining = secs;
  wpEl('wpReadout').innerHTML = `<div class="wp-big" id="wpBig">${wpFmt(secs)}</div><div class="wp-sub">remaining</div>`;
  wpSetDial(1,false);
  const primary = wpEl('wpPrimary'); primary.textContent = 'Pause'; primary.classList.remove('ghost');
  primary.onclick = wpTogglePause;
  WP.timerId = setInterval(()=>{
    if(WP.paused) return;
    WP.remaining--;
    const big = wpEl('wpBig'); if(big) big.textContent = wpFmt(Math.max(0,WP.remaining));
    const frac = WP.remaining / WP.total;
    wpSetDial(frac,false); wpUpdateSegs(1-frac);
    if(WP.remaining<=3 && WP.remaining>0){ wpBeep(660,0.12,0.2); if(big) big.classList.add('pulse'); setTimeout(()=>big&&big.classList.remove('pulse'),300); }
    if(WP.remaining<=0){ wpClearTimer(); wpBeep(1040,0.3,0.3); if(navigator.vibrate) navigator.vibrate(60); wpNext(); }
  }, 1000);
}

/* box breathing (phases × rounds) */
function wpStartBox(rounds){
  WP.boxRound = 1; WP.boxPhase = 0; WP.remaining = WP_BOX[0][1];
  const primary = wpEl('wpPrimary'); primary.textContent = 'Pause'; primary.classList.remove('ghost'); primary.onclick = wpTogglePause;
  const draw = ()=>{
    const [label,len] = WP_BOX[WP.boxPhase];
    wpEl('wpReadout').innerHTML = `<div class="wp-big" id="wpBig" style="color:var(--cyan)">${WP.remaining}</div><div class="wp-sub">${label} · Round ${WP.boxRound}/${rounds}</div>`;
    wpSetDial(WP.remaining/len, true);
  };
  draw(); wpBeep(523,0.12,0.18);
  WP.timerId = setInterval(()=>{
    if(WP.paused) return;
    WP.remaining--;
    if(WP.remaining<=0){
      WP.boxPhase++;
      if(WP.boxPhase>=WP_BOX.length){ WP.boxPhase=0; WP.boxRound++; if(WP.boxRound>rounds){ wpClearTimer(); wpBeep(1040,0.3,0.3); if(navigator.vibrate) navigator.vibrate(60); wpNext(); return; } }
      WP.remaining = WP_BOX[WP.boxPhase][1];
      wpBeep(WP.boxPhase===0?523:WP.boxPhase===2?440:660, 0.12, 0.18);
      const lbl = WP_BOX[WP.boxPhase][0]; wpSay(lbl);
    }
    const segFrac = ((WP.boxRound-1)*WP_BOX.length + WP.boxPhase) / (rounds*WP_BOX.length);
    wpUpdateSegs(segFrac);
    draw();
  }, 1000);
}

/* rep-based exercise (tap when done) */
function wpStartReps(step){
  const n = step.reps;
  wpEl('wpReadout').innerHTML = n
    ? `<div class="wp-reps">${n}<small>reps</small></div>`
    : `<div class="wp-reps" style="font-size:2.6em">●<small>when ready</small></div>`;
  wpSetDial(1,false);
  const primary = wpEl('wpPrimary');
  primary.textContent = (WP.i === WP.steps.length-1) ? 'Finish ✓' : 'Done — Next ›';
  primary.classList.remove('ghost');
  primary.onclick = ()=>{ wpBeep(880,0.15,0.25); if(navigator.vibrate) navigator.vibrate(20); wpNext(); };
}

function wpTogglePause(){
  WP.paused = !WP.paused;
  wpEl('wpPrimary').textContent = WP.paused ? 'Resume' : 'Pause';
  if(WP.paused && 'speechSynthesis' in window) try{ speechSynthesis.cancel(); }catch(e){}
}

function wpNext(){
  if(WP.i >= WP.steps.length-1){ wpFinish(); return; }
  wpLoadStep(WP.i+1);
}
function wpBack(){ if(WP.i>0) wpLoadStep(WP.i-1); }
function wpSkip(){ wpClearTimer(); wpNext(); }

function wpFinish(){
  wpClearTimer();
  WP.segs.forEach(s=>{ s.classList.remove('active'); s.classList.add('done'); });
  if('speechSynthesis' in window) try{ speechSynthesis.cancel(); }catch(e){}
  wpSay('Warm-up complete. Now go train.');
  wpBeep(784,0.18,0.3); setTimeout(()=>wpBeep(1046,0.32,0.3),180);
  if(navigator.vibrate) navigator.vibrate([40,60,40]);
  wpEl('wpBody').style.display = 'none';
  wpEl('wpControls').style.display = 'none';
  wpEl('wpDone').style.display = 'flex';
  wpMarkActivationDone();
}

/* check off all Wake Up Protocol items in today's checklist */
function wpMarkActivationDone(){
  const panel = document.getElementById('panel-today');
  if(!panel) return;
  const todos = panel.querySelectorAll('.todo[data-item^="0:"]');
  todos.forEach(t=>{ if(!t.classList.contains('checked')) t.classList.add('checked'); });
  if(todos.length) commitToday();
}

wpEl('wpClose').addEventListener('click', wpClosePlayer);
wpEl('wpDoneClose').addEventListener('click', wpClosePlayer);
wpEl('wpBack').addEventListener('click', wpBack);
wpEl('wpSkip').addEventListener('click', wpSkip);

/* ═══════════════════ INIT ═══════════════════ */
renderToday();
refreshStreakUI();
if('serviceWorker' in navigator){ window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{})); }
// iOS install hint (only if not already installed)
if(/iphone|ipad|ipod/i.test(navigator.userAgent)) setTimeout(()=>showInstall('ios'), 1200);
</script>
