<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeffrey — BOO: Spirit Battles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-deep: #06060f;
            --bg-mid: #0c0c1e;
            --bg-surface: #111128;
            --bg-bubble-jeffrey: #141432;
            --bg-bubble-user: #1a1240;
            --border-subtle: rgba(90, 80, 160, 0.15);
            --border-glow: rgba(100, 140, 255, 0.25);
            --text-primary: #c8c4e0;
            --text-secondary: #7a7698;
            --text-jeffrey: #b0c8f0;
            --accent-blue: #5878d0;
            --accent-teal: #4a9898;
            --accent-ghost: #6a80c0;
            --glow-color: rgba(80, 120, 220, 0.12);
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Ambient background orbs */
        body::before {
            content: '';
            position: fixed;
            top: -20%;
            left: -10%;
            width: 50%;
            height: 50%;
            background: radial-gradient(circle, rgba(60, 80, 180, 0.06) 0%, transparent 70%);
            pointer-events: none;
            animation: drift 20s ease-in-out infinite alternate;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -15%;
            right: -10%;
            width: 45%;
            height: 45%;
            background: radial-gradient(circle, rgba(70, 130, 130, 0.05) 0%, transparent 70%);
            pointer-events: none;
            animation: drift 25s ease-in-out infinite alternate-reverse;
        }

        @keyframes drift {
            from { transform: translate(0, 0); }
            to { transform: translate(30px, -20px); }
        }

        /* Header */
        header {
            background: linear-gradient(180deg, var(--bg-mid) 0%, var(--bg-deep) 100%);
            padding: 18px 20px 14px;
            text-align: center;
            border-bottom: 1px solid var(--border-subtle);
            flex-shrink: 0;
            position: relative;
        }

        header h1 {
            font-family: 'Crimson Text', Georgia, serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-jeffrey);
            letter-spacing: 0.5px;
        }

        .ghost-icon {
            display: inline-block;
            opacity: 0.7;
            animation: float 3s ease-in-out infinite;
            margin-right: 6px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        header p {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 3px;
            letter-spacing: 0.3px;
        }

        /* Chat area */
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scrollbar-width: thin;
            scrollbar-color: var(--border-subtle) transparent;
        }

        #chat::-webkit-scrollbar { width: 5px; }
        #chat::-webkit-scrollbar-track { background: transparent; }
        #chat::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 3px; }

        /* Messages */
        .msg {
            max-width: 82%;
            padding: 11px 15px;
            border-radius: 14px;
            line-height: 1.55;
            font-size: 0.88rem;
            animation: msgIn 0.25s ease-out;
            position: relative;
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg.jeffrey {
            align-self: flex-start;
            background: var(--bg-bubble-jeffrey);
            border: 1px solid var(--border-subtle);
            border-bottom-left-radius: 4px;
            color: var(--text-jeffrey);
        }

        .msg.jeffrey .name {
            font-family: 'Crimson Text', Georgia, serif;
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--accent-ghost);
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .msg.user {
            align-self: flex-end;
            background: var(--bg-bubble-user);
            border: 1px solid rgba(100, 70, 160, 0.15);
            border-bottom-right-radius: 4px;
            color: #ccc0e8;
        }

        .msg.typing {
            align-self: flex-start;
            background: transparent;
            border: none;
            padding: 6px 15px;
            color: var(--text-secondary);
            font-style: italic;
            font-size: 0.78rem;
        }

        .typing-dots::after {
            content: '';
            animation: dots 1.4s steps(4, end) infinite;
        }

        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }

        /* Welcome */
        .welcome {
            text-align: center;
            padding: 50px 24px 30px;
            color: var(--text-secondary);
            max-width: 380px;
            margin: 0 auto;
        }

        .welcome h2 {
            font-family: 'Crimson Text', Georgia, serif;
            color: var(--accent-ghost);
            font-size: 1.15rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .welcome p {
            font-size: 0.78rem;
            line-height: 1.7;
        }

        .welcome .grumble {
            font-family: 'Crimson Text', Georgia, serif;
            font-style: italic;
            color: var(--text-secondary);
            font-size: 0.82rem;
            margin-top: 14px;
            opacity: 0.7;
        }

        /* Input */
        .input-bar {
            display: flex;
            gap: 8px;
            padding: 14px 16px;
            background: var(--bg-mid);
            border-top: 1px solid var(--border-subtle);
            flex-shrink: 0;
        }

        #msg-input {
            flex: 1;
            padding: 11px 16px;
            border: 1px solid var(--border-subtle);
            border-radius: 22px;
            background: var(--bg-surface);
            color: var(--text-primary);
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 0.88rem;
            outline: none;
            transition: border-color 0.2s;
        }

        #msg-input:focus {
            border-color: var(--border-glow);
        }

        #msg-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.6;
        }

        #send-btn {
            padding: 11px 18px;
            border: 1px solid var(--border-subtle);
            border-radius: 22px;
            background: var(--bg-surface);
            color: var(--accent-ghost);
            font-family: 'Inter', system-ui, sans-serif;
            font-weight: 600;
            font-size: 0.82rem;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            letter-spacing: 0.3px;
        }

        #send-btn:hover {
            background: var(--bg-bubble-jeffrey);
            border-color: var(--border-glow);
        }

        #send-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .char-count {
            font-size: 0.65rem;
            color: var(--text-secondary);
            text-align: right;
            padding: 0 20px;
            opacity: 0;
            transition: opacity 0.2s;
            margin-top: -2px;
        }

        .char-count.visible { opacity: 1; }
        .char-count.warn { color: #c07050; }

        /* Mobile */
        @media (max-width: 600px) {
            .msg { max-width: 90%; font-size: 0.84rem; }
            header h1 { font-size: 1.2rem; }
            header { padding: 14px 16px 12px; }
            .welcome { padding: 30px 16px 20px; }
            .welcome h2 { font-size: 1.05rem; }
        }
    </style>
</head>
<body>
    <header>
        <h1><span class="ghost-icon">&#9764;</span> Jeffrey</h1>
        <p>BOO: Spirit Battles &mdash; Resident Ghost</p>
    </header>

    <div id="chat">
        <div class="welcome">
            <h2>Oh. You again.</h2>
            <p>I'm Jeffrey. I've been haunting this corner of the Overworld since before your grandparents were born. Ask me about the BOO tournament, Spiritkin lore, or whatever. I'm not going anywhere.</p>
            <div class="grumble">"Not like I have a choice..."</div>
        </div>
    </div>

    <div class="input-bar">
        <input type="text" id="msg-input" placeholder="Talk to Jeffrey..." autocomplete="off" maxlength="500">
        <button id="send-btn">Send</button>
    </div>
    <div class="char-count" id="char-count"></div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');
        const charCount = document.getElementById('char-count');
        const MAX_LEN = 500;
        let history = [];
        let sending = false;

        function escapeHtml(text) {
            const el = document.createElement('span');
            el.textContent = text;
            return el.innerHTML;
        }

        function addMessage(text, role) {
            const welcome = chat.querySelector('.welcome');
            if (welcome) welcome.remove();

            const div = document.createElement('div');
            div.className = 'msg ' + role;

            if (role === 'jeffrey') {
                div.innerHTML = '<div class="name">Jeffrey</div>' + escapeHtml(text);
            } else {
                div.textContent = text;
            }

            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'msg typing';
            div.id = 'typing-indicator';
            div.innerHTML = '<span class="typing-dots">Jeffrey is grumbling</span>';
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function hideTyping() {
            const el = document.getElementById('typing-indicator');
            if (el) el.remove();
        }

        async function send() {
            const text = input.value.trim().slice(0, MAX_LEN);
            if (!text || sending) return;

            sending = true;
            sendBtn.disabled = true;
            input.value = '';
            charCount.classList.remove('visible');

            addMessage(text, 'user');
            showTyping();

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, history: history }),
                });

                const data = await res.json();
                hideTyping();

                if (data.error) {
                    addMessage('*static crackle* ...Spirit connection dropped. Try again.', 'jeffrey');
                } else {
                    history.push({ role: 'user', content: text });
                    history.push({ role: 'assistant', content: data.reply });
                    // Keep client-side history in sync with server limit
                    if (history.length > 40) {
                        history = history.slice(-40);
                    }
                    addMessage(data.reply, 'jeffrey');
                }
            } catch (err) {
                hideTyping();
                addMessage('*flickers* ...The Overworld connection is shaky. Give it another go.', 'jeffrey');
            }

            sending = false;
            sendBtn.disabled = false;
            input.focus();
        }

        // Event listeners
        sendBtn.addEventListener('click', send);

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) send();
        });

        input.addEventListener('input', function() {
            const len = input.value.length;
            if (len > 0) {
                charCount.textContent = len + ' / ' + MAX_LEN;
                charCount.classList.add('visible');
                charCount.classList.toggle('warn', len > 450);
            } else {
                charCount.classList.remove('visible');
            }
        });

        input.focus();
    </script>
</body>
</html>
