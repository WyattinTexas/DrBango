<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BILBO — Action Combat Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0612;
  --surface: #14101c;
  --surface2: #1c1828;
  --border: #2a2230;
  --text: #f4ecd8;
  --text2: #a09686;
  --text-dim: #6a6056;
  --gold: #d4a040;
  --gold-bright: #f0c560;
  --accent: #e94560;
  --magma: #ff6348;
  --moonstone: #7ee8fa;
  --hp-green: #27ae60;
  --hp-yellow: #f1c40f;
  --hp-red: #e74c3c;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow:hidden; user-select:none; }

/* Atmosphere */
.atmosphere {
  position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(ellipse 60% 50% at 30% 60%, rgba(126,232,250,0.06), transparent 60%),
    radial-gradient(ellipse 60% 50% at 70% 60%, rgba(233,69,96,0.06), transparent 60%),
    radial-gradient(ellipse 80% 40% at 50% 100%, rgba(212,160,64,0.08), transparent 60%),
    linear-gradient(180deg, #0e0820 0%, #0a0612 100%);
}

/* === BATTLE STAGE === */
.stage {
  width: 100vw; height: 100vh; position: relative; display: flex;
  flex-direction: column; align-items: center; justify-content: center;
}

/* Top HUD */
.hud {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; padding: 20px 30px; z-index: 10;
}
.hud-side { width: 280px; }
.hud-name { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
.hud-name.player-name { color: var(--moonstone); }
.hud-name.enemy-name { color: var(--magma); text-align: right; }
.hud-sub { font-size: 11px; color: var(--text-dim); margin-bottom: 6px; }
.hud-sub.right { text-align: right; }
.hp-bar { height: 14px; background: var(--surface2); border-radius: 7px; overflow: hidden; border: 1px solid var(--border); position: relative; }
.hp-fill { height: 100%; border-radius: 7px; transition: width 0.5s ease; }
.hp-fill.green { background: linear-gradient(90deg, #2ecc71, #27ae60); }
.hp-fill.yellow { background: linear-gradient(90deg, #f1c40f, #e67e22); }
.hp-fill.red { background: linear-gradient(90deg, #e74c3c, #c0392b); }
.hp-fill.enemy-fill { direction: rtl; }
.hp-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 10px; font-weight: 800; text-shadow: 0 1px 2px rgba(0,0,0,0.8); z-index: 2; }

/* Upgrade badges */
.hud-badges { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
.badge { font-size: 9px; padding: 2px 7px; border-radius: 8px; font-weight: 700; background: rgba(126,232,250,0.12); color: var(--moonstone); border: 1px solid rgba(126,232,250,0.25); }

/* Center round */
.round-hud {
  position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
  font-size: 12px; color: var(--text-dim); letter-spacing: 0.15em; font-weight: 700;
}

/* === FIGHTERS === */
.arena {
  display: flex; align-items: center; justify-content: center; gap: 120px;
  position: relative; width: 100%; max-width: 800px;
}
.fighter {
  position: relative; transition: transform 0.15s ease;
}
.fighter img {
  width: 180px; height: 220px; object-fit: contain;
  filter: drop-shadow(0 4px 20px rgba(0,0,0,0.5));
  transition: filter 0.2s, transform 0.2s;
}
.fighter.player-fighter img { transform-origin: center bottom; }
.fighter.enemy-fighter img { transform-origin: center bottom; }

/* Fighter animations */
.fighter.attack-lunge-right { animation: lungeRight 0.35s ease; }
.fighter.attack-lunge-left { animation: lungeLeft 0.35s ease; }
.fighter.hit-shake { animation: hitShake 0.4s ease; }
.fighter.dodge-back { animation: dodgeBack 0.4s ease; }
.fighter.ko-fall { animation: koFall 0.8s ease forwards; }
.fighter.power-up { animation: powerUp 0.5s ease; }
.fighter.block-flash { animation: blockFlash 0.3s ease; }

@keyframes lungeRight {
  0% { transform: translateX(0); }
  40% { transform: translateX(60px) scale(1.1); }
  100% { transform: translateX(0); }
}
@keyframes lungeLeft {
  0% { transform: translateX(0); }
  40% { transform: translateX(-60px) scale(1.1); }
  100% { transform: translateX(0); }
}
@keyframes hitShake {
  0% { transform: translateX(0); filter: brightness(2); }
  15% { transform: translateX(-12px); }
  30% { transform: translateX(10px); }
  45% { transform: translateX(-8px); }
  60% { transform: translateX(6px); }
  75% { transform: translateX(-3px); }
  100% { transform: translateX(0); filter: brightness(1); }
}
@keyframes dodgeBack {
  0% { transform: translateX(0); opacity: 1; }
  30% { transform: translateX(40px); opacity: 0.5; }
  100% { transform: translateX(0); opacity: 1; }
}
@keyframes koFall {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  60% { transform: translateY(20px) rotate(15deg); opacity: 0.6; }
  100% { transform: translateY(60px) rotate(25deg); opacity: 0.2; }
}
@keyframes powerUp {
  0% { transform: scale(1); filter: brightness(1); }
  50% { transform: scale(1.08); filter: brightness(1.5) drop-shadow(0 0 20px var(--moonstone)); }
  100% { transform: scale(1); filter: brightness(1); }
}
@keyframes blockFlash {
  0% { filter: brightness(1); }
  30% { filter: brightness(2) sepia(0.3); }
  100% { filter: brightness(1); }
}

/* VS divider */
.vs-divider {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
  font-size: 28px; font-weight: 900; color: rgba(212,160,64,0.15);
  text-shadow: 0 0 30px rgba(212,160,64,0.1);
}

/* Damage popup */
.dmg-popup {
  position: absolute; font-size: 36px; font-weight: 900; pointer-events: none;
  animation: dmgFloat 1s ease forwards; z-index: 50; text-shadow: 0 2px 8px rgba(0,0,0,0.6);
}
@keyframes dmgFloat {
  0% { transform: translateY(0) scale(0.5); opacity: 0; }
  20% { transform: translateY(-10px) scale(1.2); opacity: 1; }
  60% { transform: translateY(-40px) scale(1); opacity: 1; }
  100% { transform: translateY(-70px) scale(0.8); opacity: 0; }
}

/* === TIMING BAR (the core mechanic) === */
.timing-container {
  position: absolute; bottom: 160px; left: 50%; transform: translateX(-50%);
  width: 400px; text-align: center; z-index: 20;
  display: none;
}
.timing-container.active { display: block; }

.timing-label {
  font-size: 13px; font-weight: 700; margin-bottom: 8px; letter-spacing: 0.05em;
}
.timing-label.attack { color: var(--moonstone); }
.timing-label.defend { color: var(--magma); }
.timing-label.combo { color: var(--gold-bright); }

.timing-bar {
  width: 100%; height: 40px; background: var(--surface2); border-radius: 10px;
  border: 2px solid var(--border); position: relative; overflow: hidden;
}

/* Zones within timing bar */
.timing-zone {
  position: absolute; top: 0; height: 100%; border-radius: 4px;
}
.timing-zone.miss-zone { background: rgba(231,76,60,0.15); }
.timing-zone.good-zone { background: rgba(39,174,96,0.2); border: 1px solid rgba(39,174,96,0.4); }
.timing-zone.perfect-zone { background: rgba(240,197,96,0.3); border: 2px solid var(--gold-bright); box-shadow: 0 0 10px rgba(240,197,96,0.2); }

/* Cursor */
.timing-cursor {
  position: absolute; top: -2px; width: 5px; height: calc(100% + 4px);
  background: white; border-radius: 3px; z-index: 5;
  box-shadow: 0 0 8px white, 0 0 16px rgba(255,255,255,0.3);
}

.timing-hint {
  font-size: 11px; color: var(--text-dim); margin-top: 6px;
}

/* Timing result flash */
.timing-result-flash {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  font-size: 24px; font-weight: 900; z-index: 10; opacity: 0;
  transition: opacity 0.15s;
  text-shadow: 0 0 12px currentColor;
}
.timing-result-flash.show { opacity: 1; }
.timing-result-flash.perfect { color: var(--gold-bright); }
.timing-result-flash.good { color: var(--hp-green); }
.timing-result-flash.miss { color: var(--hp-red); }

/* === BOTTOM ACTION BAR === */
.action-bar {
  position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 12px; align-items: center; z-index: 10;
}
.action-btn {
  padding: 14px 36px; border: none; border-radius: 10px; font-size: 15px;
  font-weight: 800; cursor: pointer; transition: all 0.15s; letter-spacing: 0.03em;
}
.action-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none !important; }
.action-btn.attack-btn {
  background: linear-gradient(135deg, var(--moonstone), #4B9CD3);
  color: #0a0612;
}
.action-btn.attack-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(126,232,250,0.3); }
.action-btn.special-btn {
  background: linear-gradient(135deg, var(--gold), var(--gold-bright));
  color: #0a0612;
}
.action-btn.special-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(212,160,64,0.3); }
.action-btn.dodge-btn {
  background: linear-gradient(135deg, #374151, #4b5563);
  color: var(--text);
}

/* Narration */
.narration-bar {
  position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%);
  font-size: 14px; font-weight: 600; color: var(--gold-bright);
  text-align: center; min-height: 20px; opacity: 0; transition: opacity 0.3s;
  text-shadow: 0 0 12px rgba(240,197,96,0.3);
  max-width: 500px;
}
.narration-bar.show { opacity: 1; }

/* Battle log */
.battle-log {
  position: absolute; bottom: 30px; right: 20px; width: 260px;
  background: rgba(20,16,28,0.85); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 14px; max-height: 180px; overflow-y: auto; font-size: 11px;
  color: var(--text2); line-height: 1.7; backdrop-filter: blur(4px);
}
.log-entry { border-bottom: 1px solid rgba(42,34,48,0.4); padding: 3px 0; }
.log-entry:last-child { border-bottom: none; }
.log-a { color: var(--gold-bright); font-weight: 700; }
.log-d { color: var(--magma); font-weight: 700; }
.log-h { color: var(--hp-green); font-weight: 700; }
.log-t { color: var(--moonstone); font-weight: 700; }

/* Screen shake */
.stage.screen-shake { animation: screenShake 0.3s ease; }
@keyframes screenShake {
  0% { transform: translate(0); }
  20% { transform: translate(-4px, 2px); }
  40% { transform: translate(4px, -2px); }
  60% { transform: translate(-3px, 1px); }
  80% { transform: translate(2px, -1px); }
  100% { transform: translate(0); }
}

/* Intro overlay */
.intro-overlay {
  position: fixed; inset: 0; z-index: 100; background: rgba(10,6,18,0.95);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  backdrop-filter: blur(6px);
}
.intro-overlay.hidden { display: none; }
.intro-vs {
  display: flex; align-items: center; gap: 40px; margin-bottom: 30px;
}
.intro-fighter { text-align: center; }
.intro-fighter img { width: 150px; height: 180px; object-fit: contain; filter: drop-shadow(0 4px 20px rgba(0,0,0,0.5)); }
.intro-fighter-name { font-size: 20px; font-weight: 900; margin-top: 8px; }
.intro-fighter-name.p { color: var(--moonstone); }
.intro-fighter-name.e { color: var(--magma); }
.intro-fighter-sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
.intro-vs-text { font-size: 40px; font-weight: 900; color: var(--gold); }
.intro-start {
  padding: 16px 50px; border: none; border-radius: 12px;
  background: linear-gradient(135deg, var(--magma), var(--accent));
  color: white; font-size: 18px; font-weight: 900; cursor: pointer;
  transition: all 0.2s; letter-spacing: 0.05em;
}
.intro-start:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(233,69,96,0.4); }
.intro-badges { display: flex; gap: 6px; margin-top: 8px; justify-content: center; }

/* End overlay */
.end-overlay {
  position: fixed; inset: 0; z-index: 100; background: rgba(10,6,18,0.9);
  display: none; flex-direction: column; align-items: center; justify-content: center;
  backdrop-filter: blur(8px);
}
.end-overlay.active { display: flex; }
.end-title { font-size: 52px; font-weight: 900; margin-bottom: 8px; }
.end-title.victory { color: var(--gold-bright); text-shadow: 0 0 40px rgba(240,197,96,0.5); }
.end-title.defeat { color: var(--hp-red); text-shadow: 0 0 40px rgba(231,76,60,0.5); }
.end-sub { font-size: 15px; color: var(--text2); margin-bottom: 20px; }
.end-btn {
  padding: 14px 40px; border: none; border-radius: 10px; margin: 6px;
  background: linear-gradient(135deg, var(--gold), var(--gold-bright));
  color: #0a0612; font-size: 15px; font-weight: 800; cursor: pointer;
}

/* Combo counter */
.combo-display {
  position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
  font-size: 14px; font-weight: 800; color: var(--gold-bright); opacity: 0;
  transition: opacity 0.3s; text-shadow: 0 0 10px rgba(240,197,96,0.3);
}
.combo-display.show { opacity: 1; }

/* Particles */
.particle {
  position: absolute; width: 4px; height: 4px; border-radius: 50%;
  pointer-events: none; z-index: 40;
  animation: particleFly 0.6s ease forwards;
}
@keyframes particleFly {
  0% { transform: translate(0,0) scale(1); opacity: 1; }
  100% { transform: translate(var(--px), var(--py)) scale(0); opacity: 0; }
}

@media (max-width: 700px) {
  .arena { gap: 40px; }
  .fighter img { width: 120px; height: 150px; }
  .timing-container { width: 300px; }
  .hud-side { width: 160px; }
  .battle-log { display: none; }
}
</style>
</head>
<body>
<div class="atmosphere"></div>

<!-- === INTRO === -->
<div class="intro-overlay" id="intro">
  <div class="intro-vs">
    <div class="intro-fighter">
      <img src="wim.png" alt="Wim">
      <div class="intro-fighter-name p">Wim</div>
      <div class="intro-fighter-sub">Level 5 Spirit</div>
      <div class="intro-badges">
        <span class="badge">Phantom Rush</span>
        <span class="badge">Soul Surge</span>
        <span class="badge">Spirit Link</span>
      </div>
    </div>
    <div class="intro-vs-text">VS</div>
    <div class="intro-fighter">
      <img src="outlaw.png" alt="Outlaw">
      <div class="intro-fighter-name e">The Outlaw</div>
      <div class="intro-fighter-sub">Dark Castle Boss</div>
    </div>
  </div>
  <button class="intro-start" onclick="beginBattle()">FIGHT</button>
</div>

<!-- === BATTLE STAGE === -->
<div class="stage" id="stage">
  <!-- HUD -->
  <div class="hud">
    <div class="hud-side">
      <div class="hud-name player-name">Wim <span style="font-size:11px;opacity:0.6;">Lv.5</span></div>
      <div class="hud-sub">Phantom Rush / Soul Surge / Spirit Link</div>
      <div class="hp-bar">
        <div class="hp-fill green" id="pHpFill" style="width:100%"></div>
        <div class="hp-text" id="pHpText">12 / 12</div>
      </div>
      <div class="hud-badges">
        <span class="badge" id="badgeRush">Phantom Rush</span>
        <span class="badge" id="badgeSurge">Soul Surge</span>
        <span class="badge" id="badgeLink">Spirit Link</span>
      </div>
    </div>
    <div class="hud-side">
      <div class="hud-name enemy-name">The Outlaw</div>
      <div class="hud-sub right">Plunder / Smoke Bomb / Gold Hoard</div>
      <div class="hp-bar">
        <div class="hp-fill green enemy-fill" id="eHpFill" style="width:100%"></div>
        <div class="hp-text" id="eHpText">15 / 15</div>
      </div>
    </div>
  </div>
  <div class="round-hud" id="roundHud">ROUND 1</div>
  <div class="combo-display" id="comboDisplay"></div>

  <!-- Fighters -->
  <div class="arena" id="arena">
    <div class="fighter player-fighter" id="playerFighter">
      <img src="wim.png" alt="Wim" id="playerImg">
    </div>
    <div class="vs-divider">VS</div>
    <div class="fighter enemy-fighter" id="enemyFighter">
      <img src="outlaw.png" alt="Outlaw" id="enemyImg">
    </div>
  </div>

  <!-- Timing bar -->
  <div class="timing-container" id="timingContainer">
    <div class="timing-label" id="timingLabel">ATTACK</div>
    <div class="timing-bar" id="timingBar">
      <!-- zones injected dynamically -->
      <div class="timing-cursor" id="timingCursor"></div>
      <div class="timing-result-flash" id="timingFlash"></div>
    </div>
    <div class="timing-hint" id="timingHint">Press SPACE or TAP to strike!</div>
  </div>

  <!-- Narration -->
  <div class="narration-bar" id="narration"></div>

  <!-- Actions -->
  <div class="action-bar" id="actionBar">
    <button class="action-btn attack-btn" id="btnAttack" onclick="doAttack()">ATTACK</button>
    <button class="action-btn special-btn" id="btnSpecial" onclick="doSpecial()">SOUL SURGE</button>
  </div>

  <!-- Log -->
  <div class="battle-log" id="log"></div>
</div>

<!-- End overlay -->
<div class="end-overlay" id="endOverlay">
  <div class="end-title" id="endTitle"></div>
  <div class="end-sub" id="endSub"></div>
  <button class="end-btn" onclick="location.reload()">REMATCH</button>
</div>

<script>
// ===========================
// BILBO — Action Combat Engine
// ===========================

// --- STATE ---
let G = {
  pHp: 12, pMaxHp: 12,
  eHp: 15, eMaxHp: 15,
  round: 1,
  combo: 0,        // consecutive good/perfect hits
  surgeReady: true, // soul surge (special)
  linkHealUsed: false,
  phase: 'idle',   // idle | player-choose | timing | enemy-turn | done
  totalPerfects: 0,
  totalDmgDealt: 0,
};

// --- UTILS ---
function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

function logMsg(msg) {
  const el = document.getElementById('log');
  el.innerHTML += `<div class="log-entry">${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

function narrate(text, dur) {
  const el = document.getElementById('narration');
  el.textContent = text;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur || 2000);
}

function hpColor(ratio) {
  if (ratio > 0.5) return 'green';
  if (ratio > 0.25) return 'yellow';
  return 'red';
}

function updateHud() {
  const pR = Math.max(0, G.pHp) / G.pMaxHp;
  const eR = Math.max(0, G.eHp) / G.eMaxHp;
  const pFill = document.getElementById('pHpFill');
  const eFill = document.getElementById('eHpFill');
  pFill.style.width = (pR * 100) + '%';
  pFill.className = 'hp-fill ' + hpColor(pR);
  eFill.style.width = (eR * 100) + '%';
  eFill.className = 'hp-fill enemy-fill ' + hpColor(eR);
  document.getElementById('pHpText').textContent = `${Math.max(0,G.pHp)} / ${G.pMaxHp}`;
  document.getElementById('eHpText').textContent = `${Math.max(0,G.eHp)} / ${G.eMaxHp}`;
  document.getElementById('roundHud').textContent = `ROUND ${G.round}`;
}

function updateCombo() {
  const el = document.getElementById('comboDisplay');
  if (G.combo >= 2) {
    el.textContent = `${G.combo}x COMBO`;
    el.classList.add('show');
  } else {
    el.classList.remove('show');
  }
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    p.style.background = color;
    p.style.setProperty('--px', (Math.random() * 80 - 40) + 'px');
    p.style.setProperty('--py', (Math.random() * -60 - 20) + 'px');
    document.getElementById('stage').appendChild(p);
    setTimeout(() => p.remove(), 700);
  }
}

function spawnDmgPopup(targetId, text, color) {
  const target = document.getElementById(targetId);
  const rect = target.getBoundingClientRect();
  const popup = document.createElement('div');
  popup.className = 'dmg-popup';
  popup.textContent = text;
  popup.style.color = color;
  popup.style.left = (rect.left + rect.width/2 - 20) + 'px';
  popup.style.top = (rect.top) + 'px';
  document.body.appendChild(popup);
  setTimeout(() => popup.remove(), 1100);
}

function screenShake() {
  const s = document.getElementById('stage');
  s.classList.remove('screen-shake');
  void s.offsetWidth;
  s.classList.add('screen-shake');
  setTimeout(() => s.classList.remove('screen-shake'), 350);
}

function animFighter(id, cls, dur) {
  const el = document.getElementById(id);
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), dur || 400);
}

function setButtons(show, specialEnabled) {
  const bar = document.getElementById('actionBar');
  bar.style.display = show ? 'flex' : 'none';
  document.getElementById('btnSpecial').disabled = !specialEnabled;
  document.getElementById('btnSpecial').textContent = G.surgeReady ? 'SOUL SURGE' : 'SURGE (USED)';
}

// --- TIMING BAR ENGINE ---
let T = {
  active: false,
  anim: null,
  pos: 0,
  speed: 0.5,
  zones: [],  // {start, end, type:'perfect'|'good'}
  resolve: null,
  direction: 1, // 1=right, -1=left for bounce
  bounces: 0,
};

function buildTimingBar(type) {
  // type: 'attack' | 'defend' | 'special' | 'combo'
  const bar = document.getElementById('timingBar');
  const label = document.getElementById('timingLabel');
  const hint = document.getElementById('timingHint');

  // Clear old zones
  bar.querySelectorAll('.timing-zone').forEach(z => z.remove());

  T.zones = [];
  T.speed = 0.55;
  T.bounces = 0;

  if (type === 'attack') {
    label.textContent = 'ATTACK';
    label.className = 'timing-label attack';
    hint.textContent = 'Press SPACE or TAP to strike!';
    // One perfect zone, flanked by good zones
    const center = 40 + Math.random() * 20; // 40-60%
    T.zones.push({ start: center - 12, end: center + 12, type: 'good' });
    T.zones.push({ start: center - 4, end: center + 4, type: 'perfect' });
    T.speed = 0.5;
  } else if (type === 'defend') {
    label.textContent = 'DEFEND';
    label.className = 'timing-label defend';
    hint.textContent = 'Press SPACE or TAP to block!';
    const center = 35 + Math.random() * 30;
    T.zones.push({ start: center - 10, end: center + 10, type: 'good' });
    T.zones.push({ start: center - 3, end: center + 3, type: 'perfect' });
    T.speed = 0.65; // faster = harder to block
  } else if (type === 'special') {
    label.textContent = 'SOUL SURGE';
    label.className = 'timing-label combo';
    hint.textContent = 'THREE hits! Press SPACE for each!';
    // Multiple zones across the bar
    T.zones.push({ start: 15, end: 25, type: 'perfect' });
    T.zones.push({ start: 45, end: 55, type: 'perfect' });
    T.zones.push({ start: 72, end: 82, type: 'perfect' });
    T.speed = 0.35; // slower but you need 3 hits
  } else if (type === 'combo') {
    label.textContent = 'PHANTOM RUSH';
    label.className = 'timing-label combo';
    hint.textContent = 'Rapid strikes! SPACE for each hit!';
    T.zones.push({ start: 18, end: 28, type: 'perfect' });
    T.zones.push({ start: 40, end: 50, type: 'perfect' });
    T.zones.push({ start: 65, end: 75, type: 'perfect' });
    T.speed = 0.55;
  }

  // Render zones
  T.zones.forEach(z => {
    const div = document.createElement('div');
    div.className = 'timing-zone ' + z.type + '-zone';
    div.style.left = z.start + '%';
    div.style.width = (z.end - z.start) + '%';
    bar.appendChild(div);
  });
}

function startTimingBar(type) {
  return new Promise(resolve => {
    T.resolve = resolve;
    T.active = true;
    T.pos = 0;
    T.direction = 1;
    T.hits = [];  // for multi-hit types
    T.maxHits = (type === 'special' || type === 'combo') ? 3 : 1;
    T.currentZoneIdx = 0;
    T.type = type;

    buildTimingBar(type);

    const container = document.getElementById('timingContainer');
    const cursor = document.getElementById('timingCursor');
    const flash = document.getElementById('timingFlash');
    container.classList.add('active');
    flash.className = 'timing-result-flash';
    cursor.style.left = '0%';

    function animate() {
      if (!T.active) return;
      T.pos += T.speed * T.direction;

      // Bounce for multi-hit
      if (T.maxHits > 1) {
        if (T.pos >= 98) { T.direction = -1; T.bounces++; }
        if (T.pos <= 2 && T.direction === -1) { T.direction = 1; T.bounces++; }
        // End after enough bounces without enough hits
        if (T.bounces >= 3) {
          finishTimingBar();
          return;
        }
      } else {
        if (T.pos >= 100) {
          finishTimingBar();
          return;
        }
      }

      cursor.style.left = Math.min(98, Math.max(0, T.pos)) + '%';
      T.anim = requestAnimationFrame(animate);
    }
    T.anim = requestAnimationFrame(animate);
  });
}

function hitTimingBar() {
  if (!T.active) return;

  // Check what zone we're in
  let bestHit = 'miss';
  for (const z of T.zones) {
    if (T.pos >= z.start && T.pos <= z.end) {
      if (z.type === 'perfect' && (bestHit !== 'perfect')) bestHit = 'perfect';
      else if (z.type === 'good' && bestHit === 'miss') bestHit = 'good';
    }
  }

  T.hits.push(bestHit);

  // Flash result
  const flash = document.getElementById('timingFlash');
  flash.textContent = bestHit === 'perfect' ? 'PERFECT!' : bestHit === 'good' ? 'GOOD' : 'MISS';
  flash.className = 'timing-result-flash show ' + bestHit;
  setTimeout(() => flash.classList.remove('show'), 300);

  // If multi-hit and got enough, or single-hit, finish
  if (T.hits.length >= T.maxHits || T.maxHits === 1) {
    setTimeout(() => finishTimingBar(), 200);
  }
}

function finishTimingBar() {
  if (!T.active) return;
  T.active = false;
  cancelAnimationFrame(T.anim);

  // Pad hits array if they didn't hit enough
  while (T.hits.length < T.maxHits) T.hits.push('miss');

  const container = document.getElementById('timingContainer');
  setTimeout(() => {
    container.classList.remove('active');
    if (T.resolve) T.resolve(T.hits);
  }, 250);
}

// Input handlers
document.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (T.active) hitTimingBar();
  }
});
document.getElementById('timingBar').addEventListener('click', () => {
  if (T.active) hitTimingBar();
});
// Mobile tap on whole stage during timing
document.getElementById('stage').addEventListener('touchstart', e => {
  if (T.active) { e.preventDefault(); hitTimingBar(); }
}, { passive: false });

// --- COMBAT FLOW ---
function beginBattle() {
  document.getElementById('intro').classList.add('hidden');
  G.phase = 'player-choose';
  setButtons(true, G.surgeReady);
  narrate('Wim steps forward. Choose your action!', 2500);
  logMsg('Battle begins! <span class="log-a">Wim</span> vs <span class="log-d">The Outlaw</span>');
}

async function doAttack() {
  if (G.phase !== 'player-choose') return;
  G.phase = 'timing';
  setButtons(false);

  // Determine attack type — if combo >= 3, do Phantom Rush
  const isCombo = G.combo >= 2;
  const type = isCombo ? 'combo' : 'attack';

  if (isCombo) {
    narrate('Phantom Rush activated! Hit all 3 strikes!', 1500);
    logMsg('<span class="log-t">Phantom Rush</span> — triple strike incoming!');
    await wait(400);
  }

  const hits = await startTimingBar(type);

  // Calculate damage
  let totalDmg = 0;
  let perfectCount = 0;
  let goodCount = 0;

  if (type === 'combo') {
    // Each hit = 2 damage, perfect = 3
    hits.forEach(h => {
      if (h === 'perfect') { totalDmg += 3; perfectCount++; }
      else if (h === 'good') { totalDmg += 2; goodCount++; }
      else { totalDmg += 0; }
    });
  } else {
    // Single attack
    if (hits[0] === 'perfect') { totalDmg = 4; perfectCount = 1; }
    else if (hits[0] === 'good') { totalDmg = 2; goodCount = 1; }
    else { totalDmg = 1; } // glancing blow
  }

  // Combo bonus
  if (perfectCount > 0 || goodCount > 0) {
    G.combo++;
    if (G.combo >= 2) totalDmg += 1; // combo bonus
  } else {
    G.combo = 0;
  }

  updateCombo();
  G.totalDmgDealt += totalDmg;
  G.totalPerfects += perfectCount;

  // Animate
  await wait(200);
  animFighter('playerFighter', 'attack-lunge-right', 400);
  await wait(150);

  if (totalDmg > 0) {
    animFighter('enemyFighter', 'hit-shake', 450);
    screenShake();
    const eRect = document.getElementById('enemyFighter').getBoundingClientRect();
    spawnParticles(eRect.left + eRect.width/2, eRect.top + eRect.height/2, totalDmg >= 6 ? '#f0c560' : '#7ee8fa', totalDmg >= 6 ? 15 : 8);
    spawnDmgPopup('enemyFighter', '-' + totalDmg, totalDmg >= 6 ? '#f0c560' : '#ff6348');

    const qualLabel = perfectCount > 0 ? (perfectCount >= 3 ? 'DEVASTATING!' : 'Critical!') : 'Hit!';
    logMsg(`<span class="log-a">Wim</span> strikes! <span class="log-d">${totalDmg} damage</span> — ${qualLabel}`);
    narrate(`${qualLabel} ${totalDmg} damage!`, 1500);
  } else {
    logMsg(`<span class="log-a">Wim</span> swings — <span class="log-d">glancing blow! 1 damage</span>`);
    totalDmg = 1;
    narrate('Glancing blow...', 1200);
  }

  G.eHp -= totalDmg;
  updateHud();

  // Spirit Link — heal 1 on perfect hits
  if (perfectCount > 0 && G.pHp < G.pMaxHp) {
    await wait(300);
    const heal = Math.min(perfectCount, G.pMaxHp - G.pHp);
    G.pHp += heal;
    updateHud();
    spawnDmgPopup('playerFighter', '+' + heal, '#2ecc71');
    logMsg(`<span class="log-h">Spirit Link</span> — perfect hit heals ${heal} HP!`);
  }

  // Check KO
  if (G.eHp <= 0) {
    await wait(600);
    victory();
    return;
  }

  // Enemy turn
  await wait(800);
  await enemyTurn();
}

async function doSpecial() {
  if (G.phase !== 'player-choose' || !G.surgeReady) return;
  G.phase = 'timing';
  G.surgeReady = false;
  setButtons(false);

  narrate('SOUL SURGE! Channel the spirit energy!', 1800);
  logMsg('<span class="log-t">Soul Surge</span> — channeling!');
  animFighter('playerFighter', 'power-up', 500);
  await wait(600);

  const hits = await startTimingBar('special');

  let perfectCount = 0;
  hits.forEach(h => { if (h === 'perfect') perfectCount++; });
  G.totalPerfects += perfectCount;

  let totalDmg;
  let label;
  if (perfectCount === 3) {
    totalDmg = 12; label = 'MAXIMUM SURGE!';
  } else if (perfectCount === 2) {
    totalDmg = 8; label = 'Strong surge!';
  } else if (perfectCount === 1) {
    totalDmg = 5; label = 'Partial surge.';
  } else {
    totalDmg = 2; label = 'Fizzled...';
  }

  G.totalDmgDealt += totalDmg;

  await wait(200);
  animFighter('playerFighter', 'attack-lunge-right', 400);
  await wait(150);
  animFighter('enemyFighter', 'hit-shake', 450);
  screenShake();

  const eRect = document.getElementById('enemyFighter').getBoundingClientRect();
  const pColor = perfectCount >= 2 ? '#f0c560' : '#7ee8fa';
  spawnParticles(eRect.left + eRect.width/2, eRect.top + eRect.height/2, pColor, perfectCount >= 2 ? 20 : 10);
  spawnDmgPopup('enemyFighter', '-' + totalDmg, pColor);

  narrate(`${label} ${totalDmg} damage!`, 2000);
  logMsg(`<span class="log-a">Soul Surge</span> — <span class="log-d">${totalDmg} damage</span>! ${label}`);

  G.eHp -= totalDmg;
  G.combo = perfectCount > 0 ? G.combo + 1 : 0;
  updateCombo();
  updateHud();

  if (G.eHp <= 0) {
    await wait(600);
    victory();
    return;
  }

  await wait(800);
  await enemyTurn();
}

async function enemyTurn() {
  G.phase = 'enemy-turn';

  // Outlaw attacks with varying patterns
  const patterns = [
    { name: 'Plunder', baseDmg: 3, narr: 'The Outlaw lunges with a greedy strike!' },
    { name: 'Smoke Bomb', baseDmg: 2, narr: 'Smoke bomb! The Outlaw strikes from the shadows!' },
    { name: 'Gold Toss', baseDmg: 4, narr: 'The Outlaw hurls a heavy sack of gold!' },
  ];

  // Pick attack — Gold Toss only when below 50% HP
  let atk;
  if (G.eHp < G.eMaxHp * 0.5 && Math.random() < 0.4) {
    atk = patterns[2];
  } else {
    atk = patterns[Math.floor(Math.random() * 2)];
  }

  narrate(atk.narr, 1800);
  logMsg(`<span class="log-d">Outlaw</span> uses <span class="log-a">${atk.name}</span>!`);

  await wait(600);

  // Defense timing bar
  const hits = await startTimingBar('defend');

  let dmgTaken = atk.baseDmg;
  const result = hits[0];

  await wait(200);
  animFighter('enemyFighter', 'attack-lunge-left', 400);
  await wait(150);

  if (result === 'perfect') {
    dmgTaken = 0;
    animFighter('playerFighter', 'block-flash', 350);
    narrate('PERFECT BLOCK! No damage!', 1500);
    logMsg(`<span class="log-h">Perfect Block!</span> No damage taken!`);
    spawnDmgPopup('playerFighter', 'BLOCKED', '#f0c560');
    G.combo++;
    G.totalPerfects++;
  } else if (result === 'good') {
    dmgTaken = Math.max(1, Math.floor(dmgTaken / 2));
    animFighter('playerFighter', 'hit-shake', 400);
    screenShake();
    narrate(`Blocked! Reduced to ${dmgTaken} damage.`, 1500);
    logMsg(`Good block — <span class="log-d">${dmgTaken} damage</span> (reduced)`);
    spawnDmgPopup('playerFighter', '-' + dmgTaken, '#e67e22');
    const pRect = document.getElementById('playerFighter').getBoundingClientRect();
    spawnParticles(pRect.left + pRect.width/2, pRect.top + pRect.height/2, '#e67e22', 5);
  } else {
    animFighter('playerFighter', 'hit-shake', 400);
    screenShake();
    narrate(`${dmgTaken} damage! That hurt!`, 1500);
    logMsg(`Miss — <span class="log-d">${dmgTaken} damage</span> taken!`);
    spawnDmgPopup('playerFighter', '-' + dmgTaken, '#e74c3c');
    const pRect = document.getElementById('playerFighter').getBoundingClientRect();
    spawnParticles(pRect.left + pRect.width/2, pRect.top + pRect.height/2, '#e74c3c', 8);
    G.combo = 0;
  }

  updateCombo();
  G.pHp -= dmgTaken;
  updateHud();

  if (G.pHp <= 0) {
    await wait(600);
    defeat();
    return;
  }

  // Next round
  G.round++;
  await wait(600);
  G.phase = 'player-choose';
  setButtons(true, G.surgeReady);
  narrate('Your turn! Choose your action.', 2000);
}

function victory() {
  G.phase = 'done';
  animFighter('enemyFighter', 'ko-fall', 800);
  logMsg('<span class="log-a">The Outlaw</span> is defeated!');

  setTimeout(() => {
    const overlay = document.getElementById('endOverlay');
    const title = document.getElementById('endTitle');
    const sub = document.getElementById('endSub');
    overlay.classList.add('active');
    title.textContent = 'VICTORY';
    title.className = 'end-title victory';
    sub.textContent = `${G.round} rounds | ${G.totalPerfects} perfects | ${G.totalDmgDealt} total damage`;
  }, 1000);
}

function defeat() {
  G.phase = 'done';
  animFighter('playerFighter', 'ko-fall', 800);
  logMsg('<span class="log-d">Wim</span> has fallen...');

  setTimeout(() => {
    const overlay = document.getElementById('endOverlay');
    const title = document.getElementById('endTitle');
    const sub = document.getElementById('endSub');
    overlay.classList.add('active');
    title.textContent = 'DEFEATED';
    title.className = 'end-title defeat';
    sub.textContent = `Fell in round ${G.round} | ${G.totalPerfects} perfects`;
  }, 1000);
}
</script>
