<html lang="en">
<head>
<meta charset="UTF-8">

<title>Grocery Plan</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #fdf6e3;
  --card: #fff8ee;
  --card-border: #e8d5b7;
  --accent: #7b9e6b;
  --accent-dark: #5a7d4a;
  --header-bg: #6b8c5a;
  --warm: #c4956a;
  --warm-light: #f0e0cc;
  --text: #4a3728;
  --text-light: #8b7355;
  --check-green: #7b9e6b;
  --warn-orange: #d4883e;
  --good-green: #6a9e5a;
  --red-flag: #b35a4a;
  --shadow: rgba(74,55,40,0.08);
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Nunito', sans-serif;
  min-height: 100vh;
  line-height: 1.4;
}

.header {
  background: var(--header-bg);
  padding: 24px 20px 18px;
  text-align: center;
  border-bottom: 4px solid var(--accent-dark);
  position: sticky;
  top: 0;
  z-index: 100;
}

.header h1 { font-size: 26px; font-weight: 800; color: #fff; letter-spacing: 1px; }
.header .subtitle { font-size: 13px; color: #c8ddb8; margin-top: 2px; font-weight: 600; }

.progress-row {
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: 400px;
  margin: 10px auto 0;
}

.progress-label { font-size: 12px; color: #c8ddb8; font-weight: 700; white-space: nowrap; }

.progress-bar-bg {
  flex: 1;
  background: rgba(0,0,0,0.2);
  border-radius: 10px;
  height: 14px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #a8d48a, #e8d44d);
  border-radius: 10px;
  transition: width 0.4s ease;
}

.search-wrap { max-width: 680px; margin: 16px auto 0; padding: 0 16px; }

.search-wrap input {
  width: 100%;
  font-family: 'Nunito', sans-serif;
  font-size: 15px;
  font-weight: 600;
  padding: 10px 14px;
  border: 2px solid var(--card-border);
  border-radius: 10px;
  background: var(--card);
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}

.search-wrap input:focus { border-color: var(--accent); }
.search-wrap input::placeholder { color: #bba88a; }

.tabs {
  display: flex;
  justify-content: center;
  gap: 6px;
  padding: 16px 10px 4px;
  flex-wrap: wrap;
}

.tab {
  font-family: 'Nunito', sans-serif;
  font-size: 13px;
  font-weight: 700;
  padding: 8px 16px;
  border: 2px solid var(--card-border);
  border-radius: 10px;
  background: var(--card);
  color: var(--text-light);
  cursor: pointer;
  transition: all 0.2s;
}

.tab:hover { border-color: var(--accent); color: var(--text); }

.tab.active {
  background: var(--accent);
  border-color: var(--accent-dark);
  color: #fff;
}

.tab .tab-count { font-size: 11px; opacity: 0.7; margin-left: 4px; }

.content { max-width: 700px; margin: 12px auto; padding: 0 16px 60px; }
.panel { display: none; }
.panel.active { display: block; animation: fadeIn 0.25s ease; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.category { margin-bottom: 20px; }

.category-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: var(--warm-light);
  border-radius: 10px;
  margin-bottom: 6px;
  border: 2px solid var(--card-border);
}

.cat-icon { font-size: 26px; line-height: 1; }
.cat-title { font-size: 17px; font-weight: 800; color: var(--text); }

.cat-count {
  margin-left: auto;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-light);
  background: rgba(255,255,255,0.6);
  padding: 2px 8px;
  border-radius: 8px;
}

/* ITEMS */
.item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.15s;
  user-select: none;
}

.item:hover { background: rgba(123,158,107,0.08); }
.item.checked { opacity: 0.45; }
.item.checked .item-name { text-decoration: line-through; text-decoration-color: var(--check-green); }

.item-checkbox {
  width: 24px;
  height: 24px;
  min-width: 24px;
  border: 2px solid var(--card-border);
  border-radius: 6px;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  color: var(--check-green);
  transition: all 0.15s;
}

.item.checked .item-checkbox {
  border-color: var(--check-green);
  background: #e8f5e0;
}

/* ITEM IMAGE */
.item-img-wrap {
  width: 48px;
  height: 48px;
  min-width: 48px;
  border-radius: 10px;
  overflow: hidden;
  background: #fff;
  border: 2px solid var(--card-border);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.item-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.item-img-wrap .img-fallback {
  font-size: 24px;
  line-height: 1;
}

.item-info { flex: 1; min-width: 0; }
.item-name { font-size: 15px; font-weight: 700; color: var(--text); }

.item-note {
  font-size: 13px;
  color: var(--text-light);
  margin-top: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.item-note .good { color: var(--good-green); font-weight: 700; }
.item-note .warn { color: var(--warn-orange); font-weight: 700; }

/* MEAL CARDS */
.meal-section { margin-bottom: 20px; }

.meal-section-title {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: var(--warm-light);
  border-radius: 10px;
  border: 2px solid var(--card-border);
  margin-bottom: 8px;
}

.meal-section-title .cat-icon { font-size: 24px; }
.meal-section-title .cat-title { font-size: 16px; }

.meal-card {
  background: var(--card);
  border: 2px solid var(--card-border);
  border-radius: 10px;
  padding: 12px 16px;
  margin-bottom: 6px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 12px;
}

.meal-card:hover { border-color: var(--accent); transform: translateX(2px); }
.meal-card.expanded { border-color: var(--accent); background: #fff; }

.meal-img-wrap {
  width: 56px;
  height: 56px;
  min-width: 56px;
  border-radius: 10px;
  overflow: hidden;
  background: #fff;
  border: 2px solid var(--card-border);
  display: flex;
  align-items: center;
  justify-content: center;
}

.meal-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.meal-img-wrap .img-fallback { font-size: 28px; }

.meal-info { flex: 1; min-width: 0; }
.meal-name { font-size: 16px; font-weight: 800; color: var(--warm); }

.meal-desc {
  font-size: 13px;
  color: var(--text-light);
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease, margin 0.3s ease;
}

.meal-card.expanded .meal-desc { max-height: 80px; margin-top: 4px; }

.meal-benefit {
  font-size: 12px;
  font-weight: 700;
  color: var(--good-green);
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease, margin 0.3s ease;
}

.meal-card.expanded .meal-benefit { max-height: 40px; margin-top: 4px; }

/* RED FLAGS */
.flag-card {
  background: var(--card);
  border: 2px solid #e0c0b0;
  border-left: 5px solid var(--red-flag);
  border-radius: 10px;
  padding: 12px 16px;
  margin-bottom: 6px;
  display: flex;
  gap: 12px;
  align-items: flex-start;
}

.flag-icon { font-size: 20px; margin-top: 2px; }
.flag-name { font-size: 15px; font-weight: 800; color: var(--red-flag); }
.flag-found { font-size: 12px; font-weight: 600; color: var(--warn-orange); }
.flag-why { font-size: 13px; color: var(--text-light); margin-top: 1px; }

.reset-btn {
  position: fixed;
  bottom: 16px;
  right: 16px;
  font-family: 'Nunito', sans-serif;
  font-size: 12px;
  font-weight: 700;
  padding: 8px 16px;
  background: var(--card);
  border: 2px solid var(--card-border);
  border-radius: 10px;
  color: var(--text-light);
  cursor: pointer;
  z-index: 100;
  transition: all 0.15s;
}

.reset-btn:hover { border-color: var(--red-flag); color: var(--red-flag); }

@media (max-width: 500px) {
  .header h1 { font-size: 20px; }
  .tab { padding: 6px 12px; font-size: 12px; }
  .item-name { font-size: 14px; }
  .item-img-wrap { width: 40px; height: 40px; min-width: 40px; }
}

// ---- STATE ----
let checked = JSON.parse(localStorage.getItem('groceryChecked') || '{}');

// ---- BUILD ----
function buildTabs() {
  const tabsEl = document.getElementById('tabs');
  const panels = [
    { id: 'tj', label: '🟢 Trader Joe\'s' },
    { id: 'wm', label: '🔵 Walmart' },
    { id: 'meals', label: '🍽 Meals' },
    { id: 'flags', label: '🚩 Red Flags' },
  ];
  panels.forEach((p, i) => {
    const tab = document.createElement('div');
    tab.className = 'tab' + (i === 0 ? ' active' : '');
    tab.dataset.panel = p.id;
    tab.innerHTML = `${p.label}<span class="tab-count" id="count-${p.id}"></span>`;
    tab.onclick = () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.panel === p.id));
      document.querySelectorAll('.panel').forEach(el => el.classList.toggle('active', el.id === 'panel-' + p.id));
    };
    tabsEl.appendChild(tab);
  });
}

function buildStorePanel(id, store) {
  const panel = document.createElement('div');
  panel.className = 'panel' + (id === 'tj' ? ' active' : '');
  panel.id = 'panel-' + id;

  store.categories.forEach(cat => {
    const catDiv = document.createElement('div');
    catDiv.className = 'category';
    const icon = catIcons[cat.name] || '📦';
    const catChecked = cat.items.filter(item => checked[id + ':' + item.name]).length;

    catDiv.innerHTML = `<div class="category-header">
      <span class="cat-icon">${icon}</span>
      <span class="cat-title">${cat.name}</span>
      <span class="cat-count" data-cat="${id}:${cat.name}">${catChecked}/${cat.items.length}</span>
    </div>`;

    cat.items.forEach(item => {
      const key = id + ':' + item.name;
      const isChecked = checked[key];
      const div = document.createElement('div');
      div.className = 'item' + (isChecked ? ' checked' : '');
      div.dataset.key = key;
      div.dataset.cat = id + ':' + cat.name;
      div.dataset.search = item.name.toLowerCase() + ' ' + (item.note || '').toLowerCase();

      let noteHtml = item.note || '';
      if (item.good) noteHtml = `<span class="good">✓</span> ${noteHtml}`;
      if (item.warn) noteHtml = `<span class="warn">⚠</span> ${noteHtml}`;

      div.innerHTML = `
        <div class="item-checkbox">${isChecked ? '✓' : ''}</div>
        ${imgHtml(item.name, itemImages, 'item-img-wrap')}
        <div class="item-info">
          <div class="item-name">${item.name}</div>
          <div class="item-note">${noteHtml}</div>
        </div>`;
      div.onclick = () => toggleItem(div, key);
      catDiv.appendChild(div);
    });

    panel.appendChild(catDiv);
  });

  document.getElementById('content').appendChild(panel);
}

function buildMealsPanel() {
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.id = 'panel-meals';

  meals.forEach(sec => {
    const secDiv = document.createElement('div');

    secDiv.innerHTML = `<div class="meal-section-title">
      <span class="cat-icon">${sec.icon}</span>
      <span class="cat-title">${sec.section}</span>
    </div>`;

    sec.items.forEach(m => {
      const card = document.createElement('div');
      card.className = 'meal-card';
      card.dataset.search = m.name.toLowerCase() + ' ' + m.desc.toLowerCase();
      card.innerHTML = `
        ${imgHtml(m.name, mealImages, 'meal-img-wrap')}
        <div class="meal-info">
          <div class="meal-name">${m.name}</div>
          <div class="meal-desc">${m.desc}</div>
          <div class="meal-benefit">♥ ${m.benefit}</div>
        </div>`;
      card.onclick = () => card.classList.toggle('expanded');
      secDiv.appendChild(card);
    });

    panel.appendChild(secDiv);
  });

  document.getElementById('content').appendChild(panel);
}

function buildFlagsPanel() {
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.id = 'panel-flags';

  redFlags.forEach(f => {
    const card = document.createElement('div');
    card.className = 'flag-card';
    card.dataset.search = f.name.toLowerCase() + ' ' + f.found.toLowerCase() + ' ' + f.why.toLowerCase();
    card.innerHTML = `
      <div class="flag-icon">🚫</div>
      <div>
        <div class="flag-name">${f.name}</div>
        <div class="flag-found">Found in: ${f.found}</div>
        <div class="flag-why">${f.why}</div>
      </div>`;
    panel.appendChild(card);
  });

  document.getElementById('content').appendChild(panel);
}

// ---- INTERACTIONS ----
function toggleItem(div, key) {
  const isNowChecked = !checked[key];
  if (isNowChecked) checked[key] = true;
  else delete checked[key];

  div.classList.toggle('checked', isNowChecked);
  div.querySelector('.item-checkbox').textContent = isNowChecked ? '✓' : '';

  localStorage.setItem('groceryChecked', JSON.stringify(checked));
  updateProgress();
  updateCatCount(div.dataset.cat);
}

function updateProgress() {
  const total = document.querySelectorAll('.item').length;
  const done = Object.keys(checked).length;
  const pct = total > 0 ? (done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `${done} / ${total}`;
  updateStoreCounts();
}

function updateStoreCounts() {
  const stores = { tj: traderJoes, wm: walmart };
  ['tj', 'wm'].forEach(id => {
    let total = 0, done = 0;
    stores[id].categories.forEach(c => c.items.forEach(item => {
      total++;
      if (checked[id + ':' + item.name]) done++;
    }));
    const el = document.getElementById('count-' + id);
    if (el) el.textContent = ` ${done}/${total}`;
  });
}

function updateCatCount(catKey) {
  const el = document.querySelector(`.cat-count[data-cat="${catKey}"]`);
  if (!el) return;
  const items = document.querySelectorAll(`.item[data-cat="${catKey}"]`);
  const done = [...items].filter(i => i.classList.contains('checked')).length;
  el.textContent = `${done}/${items.length}`;
}

function resetAll() {
  if (!confirm('Clear all checked items?')) return;
  checked = {};
  localStorage.removeItem('groceryChecked');
  document.querySelectorAll('.item').forEach(el => {
    el.classList.remove('checked');
    el.querySelector('.item-checkbox').textContent = '';
  });
  updateProgress();
  document.querySelectorAll('.cat-count').forEach(el => {
    const items = document.querySelectorAll(`.item[data-cat="${el.dataset.cat}"]`);
    el.textContent = `0/${items.length}`;
  });
}

// SEARCH
document.getElementById('search').addEventListener('input', function() {
  const q = this.value.toLowerCase();
  document.querySelectorAll('[data-search]').forEach(el => {
    el.style.display = (!q || el.dataset.search.includes(q)) ? '' : 'none';
  });
  document.querySelectorAll('.category, .meal-section').forEach(sec => {
    const visible = sec.querySelectorAll('[data-search]:not([style*="display: none"])').length;
    sec.style.display = visible > 0 || !q ? '' : 'none';
  });
});
