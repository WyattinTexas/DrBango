<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>TRAIN SET</title>
<link rel="icon" href="data:,">
<!-- TRAINSET v1.6 -->
<meta name="trainset-version" content="1.6">
<style>
  /* ---- the toy chest chrome: GVT's dark wood, cream caps, gold accents ---- */
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ width:100%; height:100%; overflow:hidden; }
  body{
    background:#221910;
    background-image:repeating-linear-gradient(90deg,#241b11 0 118px,#1e1509 118px 122px);
    font-family:'Arial Black',Impact,'Arial Bold',sans-serif;
    color:#F7E9C4; user-select:none; -webkit-user-select:none;
    position:fixed; inset:0; touch-action:none;
  }
  canvas#cv{ position:absolute; inset:0; touch-action:none; }
  .chip{
    position:absolute; top:10px; z-index:5; background:rgba(20,14,8,0.82);
    border:2px solid #513a24; border-radius:12px; padding:7px 13px;
    font-size:15px; letter-spacing:1px; color:#F7E9C4; cursor:pointer;
  }
  #mark{ left:12px; cursor:default; color:#F2C531; }
  #mute{ right:12px; }
  #menuChip{ right:76px; }
  #backChip{ right:76px; display:none; }
  /* ---- the bedroom menu (E3): DOM chrome floats over the painted room ---- */
  #menu{
    position:absolute; inset:0; z-index:6; display:none; flex-direction:column;
    align-items:center; justify-content:flex-end; gap:14px;
    padding-bottom:calc(24px + env(safe-area-inset-bottom)); pointer-events:none;
  }
  #menu>*{ pointer-events:auto; }
  #mbtns{ display:flex; gap:14px; }   /* a ROW — EXPANSION-5's CAMPAIGN joins beside PLAY */
  .mbtn{
    background:linear-gradient(#3a2a18,#241a0e); border:3px solid #6e5130; border-radius:16px;
    color:#F7E9C4; font-family:inherit; font-size:24px; letter-spacing:3px;
    padding:16px 52px; cursor:pointer; box-shadow:0 10px 26px rgba(0,0,0,0.5);
  }
  .mbtn:active{ transform:translateY(2px); }
  #paint{ display:flex; align-items:center; gap:8px; background:rgba(20,14,8,0.82);
    border:2px solid #513a24; border-radius:14px; padding:7px 10px; }
  #paintCap{ font-size:10px; letter-spacing:1px; color:#8f7a52; margin-right:2px; }
  .sw{ background:#170f08; border:2px solid #513a24; border-radius:10px; padding:3px; cursor:pointer; }
  .sw canvas{ width:56px; height:34px; display:block; pointer-events:none; }
  .sw.on{ border-color:#F2C531; }
  /* ---- the level board (E5): ten cream tickets on toy-chest wood ---- */
  #board{ position:absolute; inset:0; z-index:6; display:none; align-items:center; justify-content:center; padding:12px; }
  #bpanel{ background:linear-gradient(#3a2a18,#241a0e); border:3px solid #6e5130; border-radius:20px;
    padding:18px 20px 14px; box-shadow:0 14px 44px rgba(0,0,0,0.55); text-align:center; max-width:min(94vw,760px); }
  #bpanel h1{ font-size:26px; letter-spacing:4px; color:#F2C531; }
  #bsub{ font-size:10px; letter-spacing:1px; color:#CBB88C; margin:6px 0 14px; }
  #tickets{ display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
  .tk{ position:relative; background:#F7E9C4; border:2px solid #B48A54; border-radius:11px;
    padding:10px 4px 8px; cursor:pointer; font-family:inherit; color:#3a2a18; min-width:86px; }
  .tk b{ display:block; font-size:24px; }
  .tk small{ display:block; font-size:7.5px; letter-spacing:0.4px; margin-top:3px; }
  .tk .star{ position:absolute; top:-10px; right:-8px; font-size:20px; transform:rotate(12deg); pointer-events:none;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,0.4)); }
  .tk.lock{ background:#241a0e; border-color:#513a24; color:#6d5c3d; cursor:default; }
  #bback{ margin-top:14px; background:none; border:none; color:#8f7a52; font-family:inherit;
    font-size:12px; letter-spacing:1px; cursor:pointer; padding:6px 8px; }
  #nextBtn{ position:absolute; left:50%; bottom:150px; transform:translateX(-50%); z-index:8; display:none;
    border-color:#F2C531; color:#F2C531; }
  #nextBtn:active{ transform:translateX(-50%) translateY(2px); }
  /* ---- the PLAY tray (E6): five giant round one-tap train buttons ---- */
  #ptray{
    position:absolute; left:0; right:0; bottom:0; z-index:6; display:none;
    background:linear-gradient(#3a2a18,#241a0e); border-top:3px solid #513a24;
    align-items:center; justify-content:center; gap:18px;
    padding:10px 10px calc(10px + env(safe-area-inset-bottom));
  }
  .tray{ width:78px; height:78px; border-radius:50%; background:#170f08; border:3px solid #513a24;
    cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; touch-action:none; }
  .tray canvas{ width:62px; height:38px; pointer-events:none; }
  .tray:active{ transform:translateY(2px); }
  /* ---- bottom bar ---- */
  #bar{
    position:absolute; left:0; right:0; bottom:0; z-index:6;
    background:linear-gradient(#3a2a18,#241a0e);
    border-top:3px solid #513a24;
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  }
  .pbtn{
    width:72px; background:#170f08; border:2px solid #513a24; border-radius:12px;
    padding:4px 2px 3px; text-align:center; cursor:grab; color:#CBB88C;
    display:flex; flex-direction:column; align-items:center; gap:1px; touch-action:none;
  }
  .pbtn canvas{ width:52px; height:52px; pointer-events:none; }
  .pbtn small{ font-size:8.5px; letter-spacing:0.5px; pointer-events:none; }
  #palTabs{ display:flex; flex-direction:column; gap:4px; }
  .ptab{ background:#170f08; border:2px solid #513a24; border-radius:9px; color:#8f7a52;
    font-family:inherit; font-size:9px; letter-spacing:1px; padding:5px 7px; cursor:pointer; }
  .ptab.on{ color:#F2C531; border-color:#F2C531; }
  .wig{ animation:wig 0.4s; }
  @keyframes wig{ 0%,100%{transform:rotate(0)} 25%{transform:rotate(-6deg)} 75%{transform:rotate(6deg)} }
  #shedBtn,#goBtn{
    border-radius:14px; border:3px solid #513a24; background:#170f08;
    color:#F7E9C4; font-family:inherit; font-size:16px; letter-spacing:1px;
    padding:14px 18px; cursor:pointer; min-width:96px;
  }
  #goBtn{ background:#1e4d1e; border-color:#2f7a2f; color:#CFF7C4; min-width:110px; font-size:19px; }
  #goBtn.run{ background:#5a1717; border-color:#8f2f2f; color:#F7C4C4; }
  #barSpace{ width:14px; }
  /* ---- the shed panel ---- */
  #shed{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) scale(0.92);
    width:min(92vw,560px); z-index:10; background:#241a12;
    border:3px solid #F2C531; border-radius:18px; padding:14px 16px 12px;
    box-shadow:0 18px 60px rgba(0,0,0,0.65); opacity:0; pointer-events:none;
    transition:opacity 0.15s, transform 0.15s;
  }
  #shed.open{ opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1); }
  #shed h2{ font-size:19px; letter-spacing:2px; color:#F2C531; margin-bottom:8px; }
  #shedX{ position:absolute; right:10px; top:8px; font-size:18px; padding:4px 10px;
    cursor:pointer; color:#CBB88C; border:none; background:none; font-family:inherit; }
  #parts{ display:flex; gap:8px; justify-content:center; margin-bottom:10px; flex-wrap:wrap; }
  .cbtn{ background:#170f08; border:2px solid #513a24; border-radius:10px;
    padding:3px 4px 2px; text-align:center; cursor:pointer; color:#CBB88C; }
  .cbtn canvas{ width:58px; height:40px; pointer-events:none; }
  .cbtn small{ display:block; font-size:8.5px; letter-spacing:0.5px; pointer-events:none; }
  #consistWrap{ background:#170f08; border:2px solid #513a24; border-radius:12px;
    padding:6px 8px 2px; margin-bottom:10px; text-align:center; }
  #consistWrap p{ font-size:9px; color:#8f7a52; letter-spacing:1px; margin-bottom:2px; }
  #consist{ width:100%; height:64px; touch-action:none; }
  #handle{
    border:2px dashed #F2C531; border-radius:12px; padding:13px 10px; text-align:center;
    font-size:15px; letter-spacing:1px; color:#F2C531; cursor:grab; touch-action:none;
  }
  #handle.home{ border-style:solid; cursor:pointer; }
  #shedFoot{ display:flex; justify-content:flex-end; align-items:center; margin-top:9px; }
  #tidy,#tidyYes,#tidyNo{ background:none; border:none; color:#8f7a52; font-family:inherit;
    font-size:11px; letter-spacing:1px; cursor:pointer; padding:4px 6px; }
  #tidyYes{ color:#FF7A5C; } #tidyNo{ color:#CFF7C4; }
  #tidyAsk{ display:none; font-size:11px; color:#CBB88C; } #tidyAsk.on{ display:inline; } #tidy.off{ display:none; }
  /* ---- toast + rotate ---- */
  #toast{
    position:absolute; left:50%; bottom:132px; transform:translateX(-50%);
    background:rgba(20,14,8,0.92); border:2px solid #F2C531; color:#F7E9C4;
    padding:9px 18px; border-radius:12px; font-size:14px; letter-spacing:1px;
    opacity:0; transition:opacity 0.2s; pointer-events:none; z-index:9; white-space:nowrap;
  }
  #toast.on{ opacity:1; }
  #rot{ display:none; position:absolute; inset:0; z-index:20; background:rgba(18,12,6,0.94);
    text-align:center; padding-top:34vh; font-size:19px; letter-spacing:1px; color:#F7E9C4; }
  #rot div{ font-size:52px; margin-bottom:14px; }
  @media (orientation:portrait) and (max-width:560px){ #rot{ display:block; } }
  @media (max-width:820px){
    .pbtn{ width:54px; } .pbtn canvas{ width:38px; height:38px; }
    #shedBtn,#goBtn{ padding:11px 10px; font-size:14px; min-width:72px; }
    #goBtn{ font-size:16px; min-width:84px; }
    #bar{ gap:4px; }
    #palSlot>span{ gap:4px !important; }
    .ptab{ font-size:8px; padding:4px 4px; }
    .mbtn{ font-size:17px; padding:11px 30px; letter-spacing:2px; }
    .tray{ width:58px; height:58px; }
    .tray canvas{ width:46px; height:28px; }
    #ptray{ gap:10px; padding:7px 8px calc(7px + env(safe-area-inset-bottom)); }
    .sw canvas{ width:44px; height:27px; }
    #paintCap{ display:none; }
    #menu{ gap:9px; padding-bottom:14px; }
    #bpanel{ padding:10px 10px 6px; }
    #bpanel h1{ font-size:18px; letter-spacing:2px; }
    #bsub{ margin:4px 0 8px; font-size:8px; }
    #tickets{ gap:6px; }
    .tk{ min-width:54px; padding:6px 2px 5px; }
    .tk b{ font-size:16px; } .tk small{ font-size:6px; }
    .tk .star{ font-size:14px; top:-7px; right:-5px; }
    #bback{ margin-top:8px; font-size:10px; }
    #nextBtn{ bottom:118px; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="chip" id="mark">🚂 TRAIN SET</div>
<div class="chip" id="mute">🔊</div>
<div class="chip" id="menuChip">🏠 MENU</div>
<div class="chip" id="backChip">🎫 LEVELS</div>
<div id="bar">
  <span id="palTabs"><button class="ptab on" id="tabTrack" type="button">TRACK</button><button class="ptab" id="tabScen" type="button">SCENERY</button><button class="ptab" id="tabTown" type="button">TOWN</button></span>
  <span id="palSlot" style="display:flex;gap:8px;"></span>
  <span id="barSpace"></span>
  <button id="shedBtn">THE SHED 🚂</button>
  <button id="goBtn">GO ▶</button>
</div>
<div id="ptray"></div>
<div id="shed">
  <h2>THE TRAIN SHED</h2>
  <button id="shedX">✕</button>
  <div id="parts"></div>
  <div id="consistWrap"><p>YOUR TRAIN — TAP A CAR TO UNCOUPLE IT</p><canvas id="consist"></canvas></div>
  <div id="handle">🚂 DRAG ME ONTO THE TRACK</div>
  <div id="shedFoot">
    <span>
      <button id="tidy">🧹 TIDY UP</button>
      <span id="tidyAsk">SWEEP THE WHOLE RUG CLEAN? <button id="tidyYes">YES</button> <button id="tidyNo">NO</button></span>
    </span>
  </div>
</div>
<div id="menu">
  <div id="mbtns"><button id="playBtn" class="mbtn" type="button">PLAY ▶</button><button id="campBtn" class="mbtn" type="button">CAMPAIGN 🎫</button><button id="buildBtn" class="mbtn" type="button">BUILD 🔨</button></div>
  <div id="paint"><span id="paintCap">PAINT SHOP</span><span id="swatches" style="display:flex;gap:6px;"></span></div>
</div>
<div id="board"><div id="bpanel">
  <h1>TEN LITTLE LINES</h1>
  <div id="bsub">BUILD A LINE THAT LOOPS — AND VISITS EVERY STATION</div>
  <div id="tickets"></div>
  <button id="bback" type="button">⬅ BACK TO THE BEDROOM</button>
</div></div>
<button id="nextBtn" class="mbtn" type="button">NEXT LEVEL ▶</button>
<div id="toast"></div>
<div id="rot"><div>🔁</div>TURN YOUR PHONE SIDEWAYS</div>
<script>
'use strict';
/* =====================================================================
   TRAIN SET — a little railroad on the GVT bedroom rug.
   Single file, no deps, works from file://. Sibling of Green vs Tan:
   the rug, the rail recipe, the train painter and the uniform-arc
   follower law all come from GVT (drawRug / WESTERN LAND / drawTrainCar).
   ===================================================================== */

// ---- world ----
const C=96, GW=12, GH=8, GX=72, GY=72;
const WORLD_W=GW*C+2*GX, WORLD_H=GH*C+2*GY;      // 1296 × 912
const SPEED=220;            // px/s down the line (Wyatt dial)
const GAP=78;               // car spacing along the arc — uniform arc, never uniform segment
const KART=0.8;             // car art scale vs GVT's original painter
const AX=20;                // half axle span used to sample a car's heading
const MAXCARS=6;
const STATION_PAUSE=1.2;
// ---- Wyatt dials (EXPANSION 1 — one const each) ----
const TREE_GREENS=['#33552F','#3C6236','#4E7F46']; // bottle-brush trio, dark → light
const RIVER_BLUE='#7CA7D8';                        // toy-water base (bank/sparkle derive below)
const PPL_COLS=['#4E7F46','#C0392B','#F2C531'];    // molded-plastic figure colours (pose 0/1/2)
const SW_DEFAULT=0;                                // splitter default hand: 0 = straight branch
const RUMBLE=1.0;                                  // bridge rumble volume
const RIVER_BANK='#4F6F9B', RIVER_LIGHT='#9DBFE6', RIVER_GLINT='#EAF3FC';
// ---- Wyatt dials (EXPANSION 2 — one const each) ----
const TOWN_SET=['house','shop','hall','barn','wtr'];  // building set list, palette order
const FENCE_COL='#F7E9C4';                            // picket cream (ranch brown alt: '#8a6544')
const ANIMAL_SET=['cow','sheep','chick'];             // animal set, palette order
const CHIRP_VOL=1.0;                                  // moo/baa/cluck loudness (already quiet-HUD quiet)
const REACT_R=1;                                      // react radius, cells — the train charms animals this close
const HERD_SPEED=1.0;                                 // herd idle tempo: graze / nibble / peck speed
// ---- Wyatt dials (EXPANSION 3 — one const each) ----
const MENU_PROPS=['sign','bed','toybox','blocks','door','lamp'];  // room props list
const ATT_SCALE=0.85;         // attract oval size (scale of the real 4×2 loop)
const ATT_SPEED=70;           // attract loop speed, px/s — slow; SPEED stays the game's
const PLAY_LABEL='PLAY ▶';    // button copy
const MENU_MUSIC=false;       // menu music: false = NONE (quiet-HUD default) · true = soft lullaby
// THE LIVERY LAW: the chosen colour paints ONLY the red livery parts — loco roof +
// cowcatcher, tender tub, caboose body. Wheels stay red-spoked, boiler stays dark,
// gold door stays gold, cargo cars untouched. m = body, d = dark stroke, s = cupola shade.
const LIVERY={
  red:   {m:'#C0392B', d:'#7E241A', s:'#8f2020'},   // byte-identical to the v1.2 art — never touch
  yellow:{m:'#D9A93B', d:'#8F6B1E', s:'#B08427'},   // the 4 non-red rows are dials — tune on the rug
  blue:  {m:'#3E6E9E', d:'#28486B', s:'#335C86'},
  green: {m:'#4E7F46', d:'#33552F', s:'#3C6236'},
  purple:{m:'#7B5AA6', d:'#523C73', s:'#664990'},
};
const SWATCHES=['red','yellow','blue','green','purple'];   // paint-shop order (RED is default)
// ---- Wyatt dials (EXPANSION 4 — one const each) ----
const LIFT=26;              // px of lift per elevation level (z=1 paints at y-LIFT)
const TRESTLE_SPACE=34;     // px between trestle bents under ramps and the spiral
const TRESTLE_COL='#8a683e', TRESTLE_DARK='#6B4A2C';   // trestle wood (GVT palette)
const SPIRAL_TURNS=1.5;     // drawn turns — quarter-multiples land the exit on a port
const SPIRAL_CELLS=2;       // footprint edge, cells (2 = a 2×2 tower)
const SHADOW_SOFT=1.0;      // elevated-shadow strength (0 = none, 1 = default)
// ---- Wyatt dials (EXPANSION 5 — one const each) ----
const CAMP_SEQ=true;          // unlock law: true = winning N opens N+1 · false = every ticket open
const CAMP_WIP=true;          // persist the current level's work-in-progress across reloads
const CAMP_STAR='⭐';         // the stamp on a finished ticket (star art)
const CAMP_WIN_WINDOW=90;     // the battery bar: every reference solution must win inside this many sim-seconds
const CAMP_LABEL='CAMPAIGN 🎫';   // the menu button copy (PLAY's new neighbour)
// + the LEVELS table below IS the per-level dial sheet: exact obstacle coords + goal-card copy
// ---- Wyatt dials (EXPANSION 6 — one const each) ----
const BUILD_LABEL='BUILD 🔨';        // the third big button: PLAY ▶ · CAMPAIGN 🎫 · BUILD 🔨
const PLAY_MARK='🚂 PLAY!';          // the wordmark chip while the wind-up rug is out
const PLAY_SPEED_R=[0.75,1.25];      // each tray train's own speed, random in this ×range
const PLAY_CAP=10;                   // the rug holds this many trains, then the indignant toot
const PLAY_RESPAWN=2;                // the NEVER-EMPTY law: seconds till a fresh red train chugs in
const TRAY_ORDER=['red','yellow','blue','green','purple'];  // tray colour order (E7's toy-box unlocks are IGNORED here — play shows all five, always)
const CRASH_TUMBLE=0.8;              // seconds of squash-and-tumble before a crashed train is gone
const PLAY_CLEAR=70;                 // px of loop arc a spawn must keep clear of every train (the spawn law's floor)
const PLAY_HOME_CARS=['tender','box'];        // the resident red train: loco + tender + boxcar, speed ×1
const PLAY_POOL=['box','tank','flat','cab'];  // tray spawns tow 1-2 random cars from this pool
// PLAYMAP — ONE const table like a campaign level: the wind-up figure-8. Two rings
// share the CROSSING at (5,4): the right ring leaves its E port and comes home into
// its N port, the left ring leaves the S port and comes home into the W port — one
// closed path through the diamond twice, so trains MEET there. That is the show.
// (Cells are dials; the SHAPE is the law: crossing shared, a short river under the
// right ring's south run crossed by a BRIDGE, STATION on the left ring's top straight
// so its pause bunches trains up — near-misses are free drama.)
const PLAYMAP={
  start:[3,6],                       // the resident train's home straight (left ring, bottom run)
  track:[                            // glued down, campaign-style — refuses drag with the wobble
    ['x',0,5,4],
    // the right ring: E port → row 4 east → up col 10 → row 2 west → down into the N port
    ['s',0,6,4],['br',0,7,4],['s',0,8,4],['s',0,9,4],['c',3,10,4],['s',1,10,3],['c',2,10,2],
    ['s',0,9,2],['s',0,8,2],['s',0,7,2],['s',0,6,2],['c',1,5,2],['s',1,5,3],
    // the left ring: S port → down col 5 → row 6 west → up col 1 → row 2 east → into the W port
    ['s',1,5,5],['c',3,5,6],['s',0,4,6],['s',0,3,6],['s',0,2,6],['c',0,1,6],
    ['s',1,1,5],['s',1,1,4],['s',1,1,3],['c',1,1,2],['st',0,2,2],['s',0,3,2],['c',2,4,2],
    ['s',1,4,3],['c',0,4,4],
  ],
  scen:[                             // dressed with existing kinds only, all glued
    ['rv',7,4],['rv',7,5],['rv',7,6],['rv',7,7],          // the short river under the bridge
    ['ppl',2,3,1],['ppl',3,3,0],                          // people by the station
    ['tree',0,1],['tree',11,1],['tree',6,3],['tree',2,4], // trees in the pockets
    ['bush',0,5],['bush',10,1],['bush',9,3],['bush',3,5],
    ['barn',9,5],['cow',10,6,0],['sheep',8,6,0],          // the bottom-right pocket farm
  ],
};

const TAU=Math.PI*2;
const perf=()=>performance.now()/1000;
const cvs=document.getElementById('cv');
let cx=cvs.getContext('2d');                     // rebindable: icons borrow the painters
let W=0,H=0,BAR=118,SC=1,OX=0,OY=0,DPR=1;

// ---- state ----
// TWO LEVELS (E4): grid holds elev-0 pieces, ramps, and the spiral (anchor + 'ref'
// stubs on its other cells); hgrid holds pure elev-1 pieces. A cell may hold one of
// each — over/under — except ramp/spiral cells, which claim both levels.
const grid=new Map();                 // "cx,cy" -> {t,r,elev, ra:{k}|null, pop, sel, latch}
const hgrid=new Map();                // "cx,cy" -> the elev-1 piece riding trestles above
const scen=new Map();                 // "cx,cy" -> {t:'bush'|'tree'|'rv'|'ppl', v, ra, pop, wave}
let RGRID=grid, HGRID=hgrid;          // the rail graph the riders read — the attract loop swaps
                                      // its own tiny oval in (menuUpdate/drawMenu), restores after
let SCREEN='menu';                    // 'menu' | 'game' — never persisted, boot always lands on the menu
let COLOR='red';                      // the train's livery (save v:3)
const AT={ grid:new Map(), hg:new Map(), cars:[], smoke:[], wheel:0, smokeT:0, musT:2 };   // the attract loop
let LIVE=false;                       // true only while the real consist advances (pass-latch writes)
let yayCd=0, pplSeq=0, chirpN=0;      // chirpN: charm chirps fired, for the rig
let consist=['tender','box'];         // cars behind the loco
const TRAIN={ placed:false, cars:[], F:true, running:false, pauseT:0, stKey:null,
              dist:0, startSig:null, goDist:0, revSinceGo:false };
let DRAG=null;
let hover=null;
let hintStage=0, lapDone=false;
let smoke=[], fx=[], confetti=[], lapCardT=0;
let wheelPhase=0, chugAcc=0, smokeT=0;
const key=(x,y)=>x+','+y;

// ---- piece geometry: port-to-port polylines with cumulative arc length ----
// ports: 0=N 1=E 2=S 3=W. Every path runs ports[0] -> ports[1].
// E4: a path may carry z (one 0..1 per point, PAINT-ONLY — riders keep the xy arc
// metric, the uniform-arc law is untouched) and pcell (which cell of a multi-cell
// prefab each endpoint lives in; null for every 1×1 piece).
function rotPtS(p,r,S){ let x=p[0],y=p[1]; for(let i=0;i<r;i++){ const t=x; x=S-y; y=t; } return [x,y]; }
const rotPt=(p,r)=>rotPtS(p,r,C);
function mkPath(ports,pts,r,z){
  const P=pts.map(p=>rotPt(p,r));
  const cum=[0]; for(let i=1;i<P.length;i++) cum.push(cum[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]));
  return { ports:ports.map(p=>p==null?null:(p+r)%4), pts:P, cum, len:cum[cum.length-1], z:z||null, pcell:null };
}
const arcPts=[]; for(let i=0;i<=10;i++){ const th=Math.PI-(Math.PI/2)*(i/10); arcPts.push([C+(C/2)*Math.cos(th),(C/2)*Math.sin(th)]); }
const swArc=[]; for(let i=0;i<=10;i++){ const a=-Math.PI/2+(Math.PI/2)*(i/10); swArc.push([(C/2)*Math.cos(a),C+(C/2)*Math.sin(a)]); }
// the RAMP: a straight whose polyline climbs z 0 -> 1, low port W, high port E at r0
const rampPts=[], rampZ=[]; for(let i=0;i<=8;i++){ rampPts.push([C*i/8,C/2]); rampZ.push(i/8); }
const BASE={
  s :[ {ports:[3,1], pts:[[0,C/2],[C,C/2]]} ],
  c :[ {ports:[0,1], pts:arcPts} ],
  x :[ {ports:[3,1], pts:[[0,C/2],[C,C/2]]}, {ports:[0,2], pts:[[C/2,0],[C/2,C]]} ],
  b :[ {ports:[0,null], pts:[[C/2,0],[C/2,C/2+10]]} ],
  st:[ {ports:[3,1], pts:[[0,C/2],[C,C/2]]} ],
  br:[ {ports:[3,1], pts:[[0,C/2],[C,C/2]]} ],                              // a straight in fancy dress
  sw:[ {ports:[3,1], pts:[[0,C/2],[C,C/2]]}, {ports:[3,2], pts:swArc} ],    // facing W; branches E / S
  rp:[ {ports:[3,1], pts:rampPts, z:rampZ} ],                               // the ramp: W low -> E high
};
const PATHS={};
for(const t in BASE){ PATHS[t]=[]; for(let r=0;r<4;r++) PATHS[t].push(BASE[t].map(b=>mkPath(b.ports,b.pts,r,b.z))); }
// THE SPIRAL (E4): one SPIRAL_CELLS² prefab — a lead-in, SPIRAL_TURNS around the
// tower, a lead-out one level up. Internally just a longer polyline with z ramping,
// so riders follow it natively under the uniform-arc law.
const SPN=SPIRAL_CELLS, SPS=SPN*C;
function spiralCells(ax,ay){ const o=[]; for(let dy=0;dy<SPN;dy++)for(let dx=0;dx<SPN;dx++) o.push([ax+dx,ay+dy]); return o; }
function edgePort(x,y){        // block-edge point -> {side, cell offset within the prefab}
  const cl=v=>Math.max(0,Math.min(SPN-1,Math.floor(v/C)));
  if(y>=SPS-0.5) return {side:2, cell:[cl(x),SPN-1]};
  if(y<=0.5)     return {side:0, cell:[cl(x),0]};
  if(x<=0.5)     return {side:3, cell:[0,cl(y)]};
  return {side:1, cell:[SPN-1,cl(y)]};
}
{
  const M=SPS/2, R=M-C/2, lead=M, sweep=SPIRAL_TURNS*TAU;
  const pts=[], z=[];
  for(let i=0;i<=8;i++) pts.push([C/2, SPS-lead*i/8]);                      // in: S edge, heading N
  const NA=Math.max(24,Math.round(sweep/(Math.PI/24)));
  for(let i=1;i<=NA;i++){ const a=Math.PI+sweep*i/NA; pts.push([M+R*Math.cos(a),M+R*Math.sin(a)]); }
  const aE=Math.PI+sweep, hx=-Math.sin(aE), hy=Math.cos(aE);                // exit heading = arc tangent
  const ex=M+R*Math.cos(aE), ey=M+R*Math.sin(aE);
  for(let i=1;i<=8;i++) pts.push([ex+hx*lead*i/8, ey+hy*lead*i/8]);
  const cum=[0]; for(let i=1;i<pts.length;i++) cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  for(let i=0;i<pts.length;i++) z.push(cum[i]/cum[cum.length-1]);           // z climbs 0 -> 1 over the ride
  PATHS.sp=[];
  for(let r=0;r<4;r++){
    const P=pts.map(p=>rotPtS(p,r,SPS));
    const cu=[0]; for(let i=1;i<P.length;i++) cu.push(cu[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]));
    const e0=edgePort(P[0][0],P[0][1]), e1=edgePort(P[P.length-1][0],P[P.length-1][1]);
    PATHS.sp.push([{ports:[e0.side,e1.side], pcell:[e0.cell,e1.cell], pts:P, cum:cu, len:cu[cu.length-1], z}]);
  }
}

function pieceAt(x,y){                            // the elev-0 layer (spiral stubs deref to the anchor)
  let pc=RGRID.get(key(x,y));
  if(pc&&pc.t==='ref') pc=RGRID.get(key(pc.ax,pc.ay));
  return pc||null;
}
const pieceHi=(x,y)=>HGRID.get(key(x,y))||null;   // the elev-1 layer
const pieceTop=(x,y)=>pieceHi(x,y)||pieceAt(x,y); // what a finger lands on: the visible top piece
const pieceOf=rd=>rd.el? pieceHi(rd.cx,rd.cy) : pieceAt(rd.cx,rd.cy);   // the piece a rider rides
const pathsOf=pc=>PATHS[pc.t][pc.r];
const spans2=pc=>pc.t==='rp'||pc.t==='sp';        // ramps + spiral claim BOTH levels of their cells
const scenAt=(x,y)=>scen.get(key(x,y))||null;
function mkPiece(t,r,sel,elev){
  return {t,r:(r|0)%4,elev:elev|0,ra:null,pop:0,sel:sel==null?(t==='sw'?SW_DEFAULT:0):(sel?1:0),latch:null};
}
// one writer for track placement — spiral spreads 'ref' stubs over its footprint
function setTrackPiece(t,r,sel,elev,x,y){
  const pc=mkPiece(t,r,sel,elev);
  if(t==='sp'){ pc.ax=x; pc.ay=y;
    for(const [x2,y2] of spiralCells(x,y)) grid.set(key(x2,y2),(x2===x&&y2===y)?pc:{t:'ref',ax:x,ay:y});
  } else (elev?hgrid:grid).set(key(x,y),pc);
  return pc;
}
function removeTrackPiece(x,y,pc){
  if(pc.t==='sp'){ for(const [x2,y2] of spiralCells(pc.ax,pc.ay)) grid.delete(key(x2,y2)); }
  else (pc.elev?hgrid:grid).delete(key(x,y));
}
// THE ONE-PREDICATE LAW: the drag ghost tint and the drop both call these, nobody else decides.
// E2 generalized it: every scenery kind carries a blocks-track flag in SCENDEF; the river's
// bridge exception stays special-cased here. Animals don't block — a cow between the rails is the toy.
function cellBlocksTrack(t,x,y){
  const s=scenAt(x,y); if(!s) return false;
  if(s.t==='rv') return t!=='br';       // only a bridge may span water
  return !!SCENDEF[s.t].blocks;
}
// E4 — ELEVATION IS INFERRED, NEVER CHOSEN. Every aligned mate votes for the level
// that would join it; the piece takes the level that joins the most (the ground on a
// tie, never floating without a vote). A mate at the WRONG height is merely passed
// by (that's how a line threads under or over — two pieces per cell), EXCEPT a
// ramp/spiral mate: its cells hold both levels, nothing can pass, the joint is a
// true abutment -> {ok:false, why:'ramp'} — NEEDS A RAMP!
// This is THE predicate: ghost tint, drop, and TS.place all ask it, nobody else decides.
function placeQuery(t,r,x,y){
  if(!PATHS[t]) return {ok:false,why:'oob'};
  r=(r|0)%4;
  const cells=t==='sp'? spiralCells(x,y) : [[x,y]];
  for(const [x2,y2] of cells){
    if(x2<0||y2<0||x2>=GW||y2>=GH) return {ok:false,why:'oob'};
    if(cellBlocksTrack(t,x2,y2)) return {ok:false,why:'scenery'};
  }
  const own=new Set(cells.map(c2=>key(c2[0],c2[1])));
  const climber=(t==='rp'||t==='sp');
  const votes=[0,0], hard=[false,false];
  for(const p of PATHS[t][r]){
    for(const end of [0,1]){
      const side=p.ports[end]; if(side==null) continue;
      const pz=p.z? Math.round(p.z[end?p.z.length-1:0]) : 0;   // this port's climb within the piece
      const [px,py]=p.pcell? [x+p.pcell[end][0], y+p.pcell[end][1]] : [x,y];
      const D=[[0,-1],[1,0],[0,1],[-1,0]][side];
      const nx=px+D[0], ny=py+D[1];
      if(own.has(key(nx,ny))) continue;
      const lo=pieceAt(nx,ny), hi=pieceHi(nx,ny);
      let m0=false, m1=false, climberMate=false;       // mate elevations aligned at this port
      for(const q of (hi&&hi!==lo? [lo,hi] : [lo])){
        if(!q) continue;
        for(const qp of pathsOf(q)) for(const qe of [0,1]){
          if(qp.ports[qe]!==(side+2)%4) continue;
          if(qp.pcell){ const qx=q.ax+qp.pcell[qe][0], qy=q.ay+qp.pcell[qe][1]; if(qx!==nx||qy!==ny) continue; }
          const me=(q.elev|0)+(qp.z? Math.round(qp.z[qe?qp.z.length-1:0]) : 0);
          if(me===0) m0=true; else if(me===1) m1=true;
          if(spans2(q)) climberMate=true;
        }
      }
      if(!m0&&!m1) continue;                           // nothing aligned — this port is free air
      for(const e of [0,1]){
        const pe=e+pz;
        if(pe>1){ hard[e]=true; continue; }            // level 2 is reserved
        if(pe? m1:m0) votes[e]++;                      // a mate at this height — joined
        else if(climberMate) hard[e]=true;             // abutting a climber at the wrong height
      }
    }
  }
  const free=e=>{                                      // is that level open on every footprint cell?
    for(const [x2,y2] of cells){
      const lo=pieceAt(x2,y2), hi=pieceHi(x2,y2);
      if(climber){ if(lo||hi) return false; }
      else if(e){ if(hi||(lo&&spans2(lo))) return false; }
      else if(lo) return false;
    }
    return true;
  };
  const okAt=e=>!hard[e] && free(e) && (e===0 || (votes[1]>0 && !climber));
  const c0=okAt(0), c1=okAt(1);
  if(c0&&c1) return {ok:true,elev:votes[1]>votes[0]?1:0};   // the level that joins more; ground on ties
  if(c0) return {ok:true,elev:0};
  if(c1) return {ok:true,elev:1};
  return {ok:false, why:(hard[0]||hard[1])?'ramp':'occupied'};
}
function canPlaceTrack(t,x,y,r){ return placeQuery(t,r|0,x,y).ok; }
function canPlaceScen(t,x,y){
  if(scenAt(x,y)) return false;
  const lo=pieceAt(x,y), hi=pieceHi(x,y);
  if(!lo&&!hi) return true;
  if(t==='rv') return !!lo&&lo.t==='br'&&!hi;   // a river may flow in under a ground bridge
  return !SCENDEF[t].blocks;                    // small critters may graze among (or under) the rails
}

// ---- riders on the graph (the GVT railPoint pattern) ----
// E4: riders carry el (which level's piece they ride). A joint only connects when the
// two port ELEVATIONS agree — a ramp's high port mates level-1 track, its low port the
// ground, and a mismatched joint is simply a dead end (boing), never a teleport.
function enter(rd,exitPort){
  const pc0=pieceOf(rd); if(!pc0) return false;
  const p0=pathsOf(pc0)[rd.pi];
  const end0=rd.dir>0?1:0;
  const exitElev=(pc0.elev|0)+(p0.z? Math.round(p0.z[end0?p0.z.length-1:0]) : 0);
  const fx=p0.pcell? rd.cx+p0.pcell[end0][0] : rd.cx;
  const fy=p0.pcell? rd.cy+p0.pcell[end0][1] : rd.cy;
  const D=[[0,-1],[1,0],[0,1],[-1,0]][exitPort];
  const nx=fx+D[0], ny=fy+D[1];
  if(nx<0||ny<0||nx>=GW||ny>=GH) return false;
  const entry=(exitPort+2)%4;
  const lo=pieceAt(nx,ny), hi=pieceHi(nx,ny);
  for(const pc of (hi&&hi!==lo? [lo,hi] : [lo])){
    if(!pc) continue;
    const ps=pathsOf(pc), base=pc.elev|0;
    if(pc.t==='sw'){
      // Splitter routing law. facing = ports[0] of both branch paths.
      //  · facing entry  -> the lever picks the branch
      //  · branch entry  -> trailing move, merge out the facing port (no derail, toy kindness)
      //  · PASS LATCH: the first LIVE rider of the consist latches its port-pair on the piece;
      //    every rider entering while the latch is live rides the latched pair (kills the
      //    follower trap AND makes mid-pass reversals retrace their own entry path).
      if(base!==exitElev) continue;
      const facing=ps[0].ports[0];
      let pi=-1;
      if(pc.latch && (pc.latch.a===entry||pc.latch.b===entry)) pi=pc.latch.pi;
      else if(entry===facing) pi=pc.sel?1:0;
      else if(ps[0].ports[1]===entry) pi=0;
      else if(ps[1].ports[1]===entry) pi=1;
      if(pi<0) continue;
      const p=ps[pi];
      rd.cx=nx; rd.cy=ny; rd.pi=pi; rd.el=base?1:0;
      if(p.ports[0]===entry){ rd.dir=1; rd.s=0; } else { rd.dir=-1; rd.s=p.len; }
      if(LIVE) pc.latch={pi,a:p.ports[0],b:p.ports[1]};
      return true;
    }
    for(let i=0;i<ps.length;i++){
      const p=ps[i];
      for(const e2 of [0,1]){
        if(p.ports[e2]!==entry) continue;
        if(base+(p.z? Math.round(p.z[e2?p.z.length-1:0]) : 0)!==exitElev) continue;
        if(p.pcell){ if(pc.ax+p.pcell[e2][0]!==nx || pc.ay+p.pcell[e2][1]!==ny) continue; }
        rd.cx=p.pcell? pc.ax:nx; rd.cy=p.pcell? pc.ay:ny;
        rd.pi=i; rd.el=base?1:0;
        if(e2===0){ rd.dir=1; rd.s=0; } else { rd.dir=-1; rd.s=p.len; }
        return true;
      }
    }
  }
  return false;
}
function advance(rd,dist){
  let moved=0;
  for(let guard=0; guard<400 && dist>1e-6; guard++){
    const pc=pieceOf(rd); if(!pc) return {ok:false,moved};
    const path=pathsOf(pc)[rd.pi];
    if(rd.dir>0){
      const room=path.len-rd.s;
      if(dist<=room){ rd.s+=dist; return {ok:true,moved:moved+dist}; }
      moved+=room; dist-=room;
      const ex=path.ports[1];
      if(ex==null || !enter(rd,ex)){ rd.s=path.len; return {ok:false,moved}; }
    } else {
      const room=rd.s;
      if(dist<=room){ rd.s-=dist; return {ok:true,moved:moved+dist}; }
      moved+=room; dist-=room;
      const ex=path.ports[0];
      if(!enter(rd,ex)){ rd.s=0; return {ok:false,moved}; }
    }
  }
  return {ok:true,moved};
}
function back(rd,dist){ rd.dir*=-1; const r=advance(rd,dist); rd.dir*=-1; return r; }
const clone=rd=>({cx:rd.cx,cy:rd.cy,pi:rd.pi,dir:rd.dir,s:rd.s,el:rd.el|0});
function pos(rd){
  const pc=pieceOf(rd); if(!pc) return {x:GX,y:GY,ang:0,z:0};
  const p=pathsOf(pc)[rd.pi], s=Math.max(0,Math.min(p.len,rd.s));
  let i=1; while(i<p.cum.length-1 && p.cum[i]<s) i++;
  const a=p.pts[i-1], b=p.pts[i], L=p.cum[i]-p.cum[i-1]||1, k=(s-p.cum[i-1])/L;
  let ang=Math.atan2(b[1]-a[1],b[0]-a[0]); if(rd.dir<0) ang+=Math.PI;
  const z=p.z? p.z[i-1]+(p.z[i]-p.z[i-1])*k : (pc.elev|0);
  return { x:GX+rd.cx*C+a[0]+(b[0]-a[0])*k, y:GY+rd.cy*C+a[1]+(b[1]-a[1])*k, ang, z };
}

// ---- train assembly / placement ----
// THE CELL-KEY AUDIT (E4): every cell-keyed behavior — this lock, the station re-arm,
// the splitter pass-latch, lap detection — now keys on (cell, elev), so a train crossing
// the top never trips the track beneath it, and vice versa.
function trainCells(){
  const s=new Set();
  for(const c of TRAIN.cars){
    const pc=pieceOf(c.rd);
    if(pc&&pc.t==='sp'){ for(const [x2,y2] of spiralCells(pc.ax,pc.ay)){ s.add(key(x2,y2)+':0'); s.add(key(x2,y2)+':1'); } }
    else{ s.add(key(c.rd.cx,c.rd.cy)+':'+(c.rd.el?1:0)); if(pc&&pc.t==='rp') s.add(key(c.rd.cx,c.rd.cy)+':1'); }
  }
  return s;
}
function trainOn(x,y,pc){                 // is the train using THIS piece (at its level)?
  if(!TRAIN.placed) return false;
  const tc=trainCells();
  if(spans2(pc)||pc.t==='sp') return tc.has(key(x,y)+':0')||tc.has(key(x,y)+':1');
  return tc.has(key(x,y)+':'+(pc.elev?1:0));
}
function placeTrainAt(cxl,cyl,prefEl){
  // prefEl asks for a specific level and FAILS if that slot is empty — placement
  // asserts stay elevation-aware; the kid's drop (no prefEl) takes the visible top
  const pc=prefEl==null? pieceTop(cxl,cyl) : (prefEl? pieceHi(cxl,cyl):pieceAt(cxl,cyl));
  if(!pc) return false;
  if(pc.t==='sp'){ cxl=pc.ax; cyl=pc.ay; }
  const p0=pathsOf(pc)[0];
  const loco={cx:cxl,cy:cyl,pi:0,dir:1,s:p0.len/2,el:(pc.elev|0)?1:0};
  const n=1+consist.length, need=GAP*(n-1)+34;
  const probe=clone(loco), r=back(probe,need);
  if(!r.ok){
    const extra=need-r.moved, f=advance(loco,extra+2);
    if(!f.ok) return false;
    const probe2=clone(loco), r2=back(probe2,need);
    if(!r2.ok) return false;
  }
  TRAIN.cars=[{type:'loco',rd:loco,face:1,squash:0}];
  for(let i=1;i<n;i++){
    const rd=clone(loco); back(rd,GAP*i);
    TRAIN.cars.push({type:consist[i-1],rd,face:1,squash:0});
  }
  TRAIN.placed=true; TRAIN.F=true; TRAIN.pauseT=0; TRAIN.stKey=null; TRAIN.startSig=null;
  return true;
}
function trainHome(quiet){
  if(TRAIN.placed && !quiet){ for(const c of TRAIN.cars){ const p=pos(c.rd); puff(p.x,p.y-8-LIFT*(p.z||0),16); } SND.pop(); }
  TRAIN.placed=false; TRAIN.running=false; TRAIN.cars=[];
  for(const pc of grid.values()) pc.latch=null;
  for(const pc of hgrid.values()) pc.latch=null;
  goBtnSync(); shedSync();
}
function reverseTrain(){
  const lead=TRAIN.F? TRAIN.cars[0] : TRAIN.cars[TRAIN.cars.length-1];
  lead.squash=1;
  for(const c of TRAIN.cars){ c.rd.dir*=-1; c.face*=-1; }
  TRAIN.F=!TRAIN.F; TRAIN.revSinceGo=true; SND.boing();
}
function goTrain(){
  if(!TRAIN.placed) return false;
  TRAIN.running=true;
  const lc=TRAIN.cars[0].rd;
  TRAIN.startSig=key(lc.cx,lc.cy)+':'+(lc.el?1:0)+':'+lc.pi+':'+lc.dir; TRAIN.goDist=0;
  TRAIN.revSinceGo=false;                  // a campaign win wants a TRUE loop, not a ping-pong
  if(CAMP.on) CAMP.visited=new Set();      // station visits count "since GO" (E5 win law)
  goBtnSync(); return true;
}

// ---- update ----
function update(dt){
  for(const pc of grid.values()){
    if(pc.ra){ pc.ra.k-=dt*8; if(pc.ra.k<=0) pc.ra=null; }
    if(pc.pop>0) pc.pop=Math.max(0,pc.pop-dt*5);
    if(pc.wob>0) pc.wob=Math.max(0,pc.wob-dt*2.5);
  }
  for(const pc of hgrid.values()){
    if(pc.ra){ pc.ra.k-=dt*8; if(pc.ra.k<=0) pc.ra=null; }
    if(pc.pop>0) pc.pop=Math.max(0,pc.pop-dt*5);
    if(pc.wob>0) pc.wob=Math.max(0,pc.wob-dt*2.5);
  }
  for(const s of scen.values()){
    if(s.ra){ s.ra.k-=dt*8; if(s.ra.k<=0) s.ra=null; }
    if(s.pop>0) s.pop=Math.max(0,s.pop-dt*5);
    if(s.wave>0) s.wave-=dt;
  }
  if(yayCd>0) yayCd-=dt;
  for(const c of TRAIN.cars) if(c.squash>0) c.squash=Math.max(0,c.squash-dt*4);

  if(TRAIN.placed && TRAIN.running){
    if(TRAIN.pauseT>0){ TRAIN.pauseT-=dt; }
    else{
      const d=SPEED*dt;
      const lead=TRAIN.F? TRAIN.cars[0] : TRAIN.cars[TRAIN.cars.length-1];
      const probe=clone(lead.rd), r=advance(probe,d);
      const step=r.ok? d : Math.max(0,r.moved-0.5);
      if(step>1e-4){
        const lr0=TRAIN.cars[0].rd, locoPrev=key(lr0.cx,lr0.cy)+':'+(lr0.el?1:0);
        LIVE=true; for(const c of TRAIN.cars) advance(c.rd,step); LIVE=false;
        TRAIN.dist+=step; TRAIN.goDist+=step;
        wheelPhase+=step/8;
        chugAcc+=step; if(chugAcc>52){ chugAcc=0;
          const lp=pieceOf(TRAIN.cars[0].rd);
          SND.chuff(!!lp&&lp.t==='br'); }
        // THE CHARM LAW: people wave, cows look up, sheep hop, chickens flap at a passing
        // train — one shared chirp gate (yayCd) so passes never stack noise.
        for(const c of TRAIN.cars){
          for(let dy=-REACT_R;dy<=REACT_R;dy++) for(let dx=-REACT_R;dx<=REACT_R;dx++){
            const s=scen.get(key(c.rd.cx+dx,c.rd.cy+dy));
            if(s && SCENDEF[s.t].react && !(s.wave>0)){
              s.wave=1.3;
              if(yayCd<=0){ yayCd=3; chirpN++; SND[CHIRP[s.t]](); }
            }
          }
        }
        smokeT-=dt; if(smokeT<=0){ smokeT=0.16; stackPuff(); }
        // station: the loco crossing a platform's centre — keyed (cell, elev), so a
        // high train crossing above a ground station never dings it (the E4 audit)
        const lc=TRAIN.cars[0].rd, lpc=pieceOf(lc), lk=key(lc.cx,lc.cy)+':'+(lc.el?1:0);
        if(lpc && lpc.t==='st'){
          const mid=pathsOf(lpc)[lc.pi].len/2;
          if(Math.abs(lc.s-mid)<step+0.6 && TRAIN.stKey!==lk){
            TRAIN.stKey=lk; TRAIN.pauseT=STATION_PAUSE; SND.ding();
            if(CAMP.on) CAMP.visited.add(lk);       // pause-visited, since GO (the E5 win check)
          }
        }
        if(lk!==locoPrev){
          if(TRAIN.stKey && TRAIN.stKey!==lk) TRAIN.stKey=null;
          // a lap — the loco re-enters where GO was pressed, same heading, SAME LEVEL.
          // Free play keeps its once-per-save FIRST LAP! card; the campaign listens to the
          // very same machinery every lap and never touches the free-play flag.
          const sig=lk+':'+lc.pi+':'+lc.dir;
          if(TRAIN.startSig && sig===TRAIN.startSig && TRAIN.goDist>3*C){
            if(CAMP.on) campLap();
            else if(!lapDone){ lapDone=true; firstLap(); }
          }
        }
      }
      if(!r.ok) reverseTrain();
    }
  }
  // pass-latch upkeep: a latch lives while any car BODY overlaps the splitter cell.
  // Body = rider centre probed ±30px along its own path — this bridges the tiny
  // between-cars gap on the short curve branch (no mid-consist lever flip can tear
  // the train) yet releases the points the moment the train is truly clear.
  let hasLatch=false;
  for(const pc of grid.values()) if(pc.latch){ hasLatch=true; break; }
  if(!hasLatch) for(const pc of hgrid.values()) if(pc.latch){ hasLatch=true; break; }
  if(hasLatch){
    const occ=new Set();
    if(TRAIN.placed) for(const c of TRAIN.cars){
      occ.add(key(c.rd.cx,c.rd.cy)+':'+(c.rd.el?1:0));
      const f=clone(c.rd); if(advance(f,30).moved>0) occ.add(key(f.cx,f.cy)+':'+(f.el?1:0));
      const b=clone(c.rd); if(back(b,30).moved>0) occ.add(key(b.cx,b.cy)+':'+(b.el?1:0));
    }
    for(const [k,pc] of grid) if(pc.latch && !occ.has(k+':0')) pc.latch=null;
    for(const [k,pc] of hgrid) if(pc.latch && !occ.has(k+':1')) pc.latch=null;
  }
  for(const s of smoke){ s.t+=dt; s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy-=8*dt; }
  smoke=smoke.filter(s=>s.t<s.dur);
  for(const e of fx) e.t+=dt;
  fx=fx.filter(e=>e.t<e.dur);
  for(const p of confetti){ p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=260*dt; p.rot+=p.vr*dt; }
  confetti=confetti.filter(p=>p.t<p.dur);
  if(lapCardT>0) lapCardT-=dt;
  if(goalT>0) goalT-=dt;
  if(winT>0) winT-=dt;
}
function puffLoco(loco){                 // one stack puff from any loco (E6: play trains puff too)
  const p=pos(loco.rd);
  const artAng=p.ang+(loco.face<0?Math.PI:0);
  const flip=Math.cos(artAng)<0;
  const lx=18*KART, ly=(flip?28:-28)*KART;
  const ca=Math.cos(artAng), sa=Math.sin(artAng);
  smoke.push({ x:p.x+ca*lx-sa*ly, y:p.y+sa*lx+ca*ly-LIFT*(p.z||0), t:0, dur:1.1,
               vx:(Math.random()-0.5)*14, vy:-34, r:3+Math.random()*2 });
}
function stackPuff(){
  if(!TRAIN.placed||!TRAIN.cars.length) return;

}
function puff(x,y,R){ fx.push({k:'puff',x,y,R,t:0,dur:0.4}); }
function confettiBurst(n){

function rr(x,y,w,h,r){
  cx.beginPath();
  cx.moveTo(x+r,y); cx.lineTo(x+w-r,y); cx.quadraticCurveTo(x+w,y,x+w,y+r);
  cx.lineTo(x+w,y+h-r); cx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  cx.lineTo(x+r,y+h); cx.quadraticCurveTo(x,y+h,x,y+h-r);
  cx.lineTo(x,y+r); cx.quadraticCurveTo(x,y,x+r,y); cx.closePath();
}
// the GVT bedroom rug, verbatim recipe (v1.47 crimson)
function drawRug(){

  cx.strokeStyle='#4A1A12'; cx.lineWidth=56; cx.strokeRect(0,0,WORLD_W,WORLD_H);
  cx.strokeStyle='#8F4634'; cx.lineWidth=7; cx.strokeRect(42,42,WORLD_W-84,WORLD_H-84);
  cx.globalAlpha=0.5; cx.fillStyle='#4A1A12';
  [[112,112],[WORLD_W-112,112],[112,WORLD_H-112],[WORLD_W-112,WORLD_H-112]]
    .forEach(p=>{ cx.beginPath(); cx.arc(p[0],p[1],13,0,7); cx.fill(); });
  cx.globalAlpha=0.35; cx.strokeStyle='#7A3627'; cx.lineWidth=2;
  for(let y=90;y<WORLD_H-60;y+=56){ cx.beginPath(); cx.moveTo(30,y); cx.lineTo(WORLD_W-30,y); cx.stroke(); }
  cx.globalAlpha=1;
}
function addPoly(P2,pts,ox,oy){
  P2.moveTo(ox+pts[0][0],oy+pts[0][1]);
  for(let i=1;i<pts.length;i++) P2.lineTo(ox+pts[i][0],oy+pts[i][1]);

// ---- rivers: cell water that reads its shape from its neighbours (track-connectivity idea) ----
function riverMask(x,y){
  let m=0, s;
  if((s=scenAt(x,y-1))&&s.t==='rv') m|=1;
  if((s=scenAt(x+1,y))&&s.t==='rv') m|=2;
  if((s=scenAt(x,y+1))&&s.t==='rv') m|=4;
  if((s=scenAt(x-1,y))&&s.t==='rv') m|=8;
  return m;
}
// the fence reads its shape from its neighbours exactly like the river — no rotation verb
function fenceMask(x,y){
  let m=0, s;
  if((s=scenAt(x,y-1))&&s.t==='fence') m|=1;
  if((s=scenAt(x+1,y))&&s.t==='fence') m|=2;
  if((s=scenAt(x,y+1))&&s.t==='fence') m|=4;
  if((s=scenAt(x-1,y))&&s.t==='fence') m|=8;
  return m;
}
function drawRivers(){
  let any=false;
  const chan=new Path2D(), ponds=[], fills=[];
  for(const [k,s] of scen){
    if(s.t!=='rv') continue; any=true;
    const [x,y]=k.split(',').map(Number), mx=GX+x*C+C/2, my=GY+y*C+C/2, m=riverMask(x,y);
    // a 2×2 (or bigger) block of water: fill the square between the four cell centres,
    // else the channel strokes leave a rug-coloured hole in the pond's middle (E5 ponds)
    if((m&2)&&(m&4)){ const d=scenAt(x+1,y+1); if(d&&d.t==='rv') fills.push([mx,my]); }
    if(!m){ ponds.push([mx,my]); continue; }
    if(m&1){ chan.moveTo(mx,my); chan.lineTo(mx,my-C/2); }
    if(m&2){ chan.moveTo(mx,my); chan.lineTo(mx+C/2,my); }
    if(m&4){ chan.moveTo(mx,my); chan.lineTo(mx,my+C/2); }
    if(m&8){ chan.moveTo(mx,my); chan.lineTo(mx-C/2,my); }
  }
  if(!any) return;
  cx.lineCap='round'; cx.lineJoin='round';
  cx.strokeStyle=RIVER_BANK; cx.lineWidth=58; cx.stroke(chan);
  cx.fillStyle=RIVER_BLUE;
  for(const [mx,my] of fills) cx.fillRect(mx-1,my-1,C+2,C+2);
  cx.strokeStyle=RIVER_BLUE; cx.lineWidth=46; cx.stroke(chan);
  cx.globalAlpha=0.55; cx.strokeStyle=RIVER_LIGHT; cx.lineWidth=24; cx.stroke(chan); cx.globalAlpha=1;
  // sparkle combing — the GVT snow-combing recipe, in blue
  cx.globalAlpha=0.75; cx.strokeStyle=RIVER_GLINT; cx.lineWidth=3; cx.lineCap='butt';
  cx.setLineDash([7,21]); cx.stroke(chan); cx.setLineDash([]); cx.globalAlpha=1;
  for(const [mx,my] of ponds){
    cx.fillStyle=RIVER_BANK; cx.beginPath(); cx.arc(mx,my,31,0,7); cx.fill();
    cx.fillStyle=RIVER_BLUE; cx.beginPath(); cx.arc(mx,my,25,0,7); cx.fill();
    cx.globalAlpha=0.55; cx.fillStyle=RIVER_LIGHT; cx.beginPath(); cx.arc(mx,my,14,0,7); cx.fill();
    cx.globalAlpha=0.75; cx.strokeStyle=RIVER_GLINT; cx.lineWidth=3; cx.setLineDash([6,10]);
    cx.beginPath(); cx.arc(mx,my,17,0,7); cx.stroke(); cx.setLineDash([]); cx.globalAlpha=1;
  }
}
function drawRiverBlob(mx,my){
  cx.fillStyle=RIVER_BANK; cx.beginPath(); cx.arc(mx,my,31,0,7); cx.fill();
  cx.fillStyle=RIVER_BLUE; cx.beginPath(); cx.arc(mx,my,25,0,7); cx.fill();

function drawRiverGhost(x,y){

function drawScen(){

// drop-shadow ellipse per kind: [y, rx] (v1.1 values for bush/tree/ppl kept verbatim;
// the fence paints its own linear shadow so it has no entry)
const SCEN_SH={ bush:[27,24], tree:[27,20], ppl:[21,24],
  house:[30,30], shop:[30,32], hall:[30,32], barn:[31,34], wtr:[30,22],
  cow:[21,21], sheep:[19,16], chick:[15,8] };
function drawScenItem(s,ox,oy,t){
  // real cells land on integer grid coords; palette icons / free-drag ghosts land outside,
  // where fenceMask reads 0 (lone bit of fence) and the herd phase is just fixed.
  const gx=Math.round((ox-GX)/C), gy=Math.round((oy-GY)/C);
  const ph=((((gx*13+gy*29)%23)+23)%23/23 + (s.v|0)*0.37)*TAU;  // herd de-sync: random-fixed phase per cell
  cx.save(); cx.translate(ox+C/2,oy+C/2);
  if(s.pop>0){ const k2=1+0.16*s.pop; cx.scale(k2,k2); }
  if(s.ra) cx.rotate(Math.sin((1-s.ra.k)*18)*0.14*s.ra.k);   // happy rustle wiggle
  const sh=SCEN_SH[s.t];
  if(sh){
    cx.globalAlpha=0.25; cx.fillStyle='#000';
    cx.beginPath(); cx.ellipse(0,sh[0],sh[1],6.5,0,0,7); cx.fill();
    cx.globalAlpha=1;
  }
  if(s.t==='bush') drawBush();
  else if(s.t==='tree') drawTree();
  else if(s.t==='ppl') drawPerson(s,t);
  else if(s.t==='fence') drawFence(fenceMask(gx,gy));
  else if(s.t==='cow') drawCow(s,t,ph);
  else if(s.t==='sheep') drawSheep(s,t,ph);
  else if(s.t==='chick') drawChick(s,t,ph);
  else if(s.t==='house') drawHouse();
  else if(s.t==='shop') drawShop();
  else if(s.t==='hall') drawHall();
  else if(s.t==='barn') drawBarn();
  else if(s.t==='wtr') drawWTower();
  cx.restore();
}

  cx.strokeStyle='#6B4A2C'; cx.lineWidth=4.5;

  // wooden tank with bands + plank seams
  cx.fillStyle='#B48A54'; rr(-19,-34,38,28,4); cx.fill();

// ---- THE FENCE (E2): posts + two rails, auto-connecting like the river ----
function drawFence(m){
  const dirs=[[0,-C/2],[C/2,0],[0,C/2],[-C/2,0]];
  let segs=[]; for(let i=0;i<4;i++) if(m&(1<<i)) segs.push(dirs[i]);
  if(!segs.length) segs=[[-26,0],[26,0]];        // a lone bit of fence: little E–W run
  cx.lineCap='round'; cx.lineJoin='round';
  // ground shadow (no ellipse for the fence — it lays its own line)
  cx.globalAlpha=0.16; cx.strokeStyle='#000'; cx.lineWidth=10;
  cx.beginPath(); for(const [px,py] of segs){ cx.moveTo(0,5); cx.lineTo(px,py+5); } cx.stroke();
  cx.globalAlpha=1;
  // two rails out each run
  cx.strokeStyle=FENCE_COL; cx.lineWidth=3;
  cx.beginPath();
  for(const [px,py] of segs){
    const L=Math.hypot(px,py)||1, nx=-py/L*4, ny=px/L*4;
    cx.moveTo(nx,ny); cx.lineTo(px+nx,py+ny);
    cx.moveTo(-nx,-ny); cx.lineTo(px-nx,py-ny);
  }
  cx.stroke();
  // posts: centre + every 24px — neighbours re-draw the shared edge post in the same spot
  cx.lineWidth=5;
  cx.beginPath();
  const post=(px,py)=>{ cx.moveTo(px,py+5); cx.lineTo(px,py-8); };
  post(0,0);
  for(const [px,py] of segs){
    const L=Math.hypot(px,py), ux=px/L, uy=py/L;
    for(let d=24;d<=L+0.1;d+=24) post(ux*d,uy*d);
  }
  cx.stroke();
}
// ---- BASIC ANIMALS (E2): molded plastic, GVT palette; idle loops de-synced by ph ----
function drawCow(s,t,ph){
  const brown=(s.v%3)===2, hide=brown?'#7A553A':'#F7E9C4', patch=brown?'#5b3a22':'#23211E';
  const react=s.wave>0;
  const g=react?0:Math.max(0,Math.sin(t*0.9*HERD_SPEED+ph));      // grazing: head down … up
  const flick=react? Math.sin(t*16) : Math.sin(t*1.3+ph)*0.12;    // tail flick when the train passes
  if(s.v&1) cx.scale(-1,1);
  cx.lineJoin='round';
  cx.strokeStyle=patch; cx.lineWidth=4; cx.lineCap='round';
  cx.beginPath(); for(const lx of[-13,-6,7,13]){ cx.moveTo(lx,7); cx.lineTo(lx,20); } cx.stroke();
  cx.strokeStyle=hide; cx.lineWidth=3.2;
  cx.beginPath(); cx.moveTo(17,-5); cx.quadraticCurveTo(23,flick*5,21+flick*6,8); cx.stroke();
  cx.fillStyle=patch; cx.beginPath(); cx.arc(21+flick*6,9,2.6,0,7); cx.fill();
  cx.fillStyle=hide; rr(-18,-10,36,20,9); cx.fill();
  cx.strokeStyle=brown?'#5b3a22':'#CBB88C'; cx.lineWidth=1.8; rr(-18,-10,36,20,9); cx.stroke();
  cx.fillStyle=patch;
  cx.beginPath(); cx.ellipse(-7,-3,7,5.5,0.3,0,7); cx.fill();
  cx.beginPath(); cx.ellipse(8,3,5.5,4.5,-0.4,0,7); cx.fill();
  // head pivots at the shoulder: down to graze, up for the train
  cx.save(); cx.translate(-15,-5); cx.rotate(react? 0.18 : -g*1.0);
  cx.fillStyle=hide; rr(-17,-6,18,12,5); cx.fill();
  cx.strokeStyle=brown?'#5b3a22':'#CBB88C'; cx.lineWidth=1.8; rr(-17,-6,18,12,5); cx.stroke();
  cx.fillStyle='#B48A54'; rr(-18,0,8,6,2.6); cx.fill();
  cx.fillStyle=patch; cx.beginPath(); cx.ellipse(-2,-7,4.5,2.2,-0.35,0,7); cx.fill();
  cx.fillStyle='#23211E'; cx.beginPath(); cx.arc(-6,-3.5,1.5,0,7); cx.fill();
  cx.restore();
  cx.lineCap='butt';
}
function drawSheep(s,t,ph){
  const react=s.wave>0;
  let hop=0;
  if(react){ const k3=(1.3-s.wave)/0.38; if(k3<1) hop=Math.sin(Math.PI*Math.max(0,k3))*9; }  // startle-hop
  const nib=react?0:Math.pow(Math.max(0,Math.sin(t*1.15*HERD_SPEED+ph)),3);                  // nibbles
  if(s.v&1) cx.scale(-1,1);
  cx.translate(0,-hop);
  cx.lineJoin='round';
  cx.strokeStyle='#3A3733'; cx.lineWidth=3.4; cx.lineCap='round';
  cx.beginPath(); for(const lx of[-9,-3,4,10]){ cx.moveTo(lx,6); cx.lineTo(lx,17); } cx.stroke();
  const tuft=(x,y,r,col)=>{ cx.fillStyle=col; cx.beginPath(); cx.arc(x,y,r,0,7); cx.fill(); };
  tuft(-7,-2,8.5,'#EFE0BC'); tuft(8,-1,8,'#EFE0BC'); tuft(1,3,9,'#EFE0BC');
  tuft(-4,-5,8.5,'#F7E9C4'); tuft(5,-5,8,'#F7E9C4'); tuft(11,0,6.5,'#F7E9C4'); tuft(-9,1,7,'#F7E9C4');
  tuft(13,-4,3.4,'#F7E9C4');   // tail nub
  // dark face, pivots to nibble
  cx.save(); cx.translate(-11,-4); cx.rotate(react? 0.22 : -nib*0.75);
  cx.fillStyle='#3A3733'; rr(-9,-4,11,9,4); cx.fill();
  cx.beginPath(); cx.ellipse(0,-1,2.6,4,0.5,0,7); cx.fill();
  cx.fillStyle='#F7E9C4'; cx.beginPath(); cx.arc(-5.5,-1.5,1.2,0,7); cx.fill();
  tuft(0,-6,4.6,'#F7E9C4');    // wool cap
  cx.restore();
  cx.lineCap='butt';
}
function drawChick(s,t,ph){
  const react=s.wave>0;
  let hop=0, flap=false;
  if(react){ const k3=(1.3-s.wave)/0.5;
    if(k3<1){ hop=Math.abs(Math.sin(Math.PI*2*Math.max(0,k3)))*6; flap=true; } }  // flap-hop: two little bounces
  const peck=react?0:Math.pow(Math.max(0,Math.sin(t*2.1*HERD_SPEED+ph)),5);       // sharp little pecks
  if(s.v&1) cx.scale(-1,1);
  cx.translate(0,7-hop);
  cx.lineJoin='round';
  cx.strokeStyle='#F2C531'; cx.lineWidth=2; cx.lineCap='round';
  cx.beginPath(); cx.moveTo(-2,3); cx.lineTo(-2.6,8); cx.moveTo(2,3); cx.lineTo(2.6,8);
  cx.moveTo(-2.6,8); cx.lineTo(-4.4,8); cx.moveTo(2.6,8); cx.lineTo(4.4,8); cx.stroke();
  cx.fillStyle='#F7E9C4'; cx.beginPath(); cx.ellipse(0.5,-1,7.2,5.4,-0.12,0,7); cx.fill();
  cx.strokeStyle='#CBB88C'; cx.lineWidth=1.6; cx.beginPath(); cx.ellipse(0.5,-1,7.2,5.4,-0.12,0,7); cx.stroke();
  cx.fillStyle='#EFE0BC'; cx.beginPath(); cx.moveTo(5,-3); cx.lineTo(10.5,-8.5); cx.lineTo(7,-0.5); cx.closePath(); cx.fill();
  cx.strokeStyle='#CBB88C'; cx.lineWidth=2;
  if(flap){ cx.beginPath(); cx.moveTo(1,-3); cx.lineTo(9,-10); cx.stroke(); }
  else { cx.beginPath(); cx.arc(1,-1,3.4,-0.4,1.8); cx.stroke(); }
  // head pecks about the neck
  cx.save(); cx.translate(-4,-4); cx.rotate(react?-0.15:-peck*0.95);
  cx.fillStyle='#F7E9C4'; cx.beginPath(); cx.arc(-2.5,-3,3.9,0,7); cx.fill();
  cx.strokeStyle='#CBB88C'; cx.lineWidth=1.4; cx.beginPath(); cx.arc(-2.5,-3,3.9,0,7); cx.stroke();
  cx.fillStyle='#C0392B';
  cx.beginPath(); cx.arc(-3.6,-7.2,1.5,0,7); cx.arc(-1.6,-7.6,1.5,0,7); cx.fill();
  cx.beginPath(); cx.arc(-5,0.4,1.2,0,7); cx.fill();
  cx.fillStyle='#F2C531';
  cx.beginPath(); cx.moveTo(-6,-4.4); cx.lineTo(-9.5,-2.8); cx.lineTo(-6,-1.6); cx.closePath(); cx.fill();
  cx.fillStyle='#23211E'; cx.beginPath(); cx.arc(-4,-3.8,0.9,0,7); cx.fill();
  cx.restore();
  cx.lineCap='butt';
}
// ballast, ties, then the two rails — a dashed fat stroke IS a row of sleepers (GVT)
// E4 pipeline: ground three-pass -> elevated ground shadows -> trestles -> a z-SORTED
// item list (ramp/spiral deck chunks · the level-1 three-pass batch · every car by its
// own z). Within each level the three-pass seamless-join recipe holds untouched.
const EMPTY_MAP=new Map();
function batchTrack(list){            // the three-pass recipe over [ox,oy,pc] rows
  const bed=new Path2D(), rails=new Path2D();
  for(const [ox,oy,pc] of list){
    for(const p of pathsOf(pc)){
      addPoly(bed,p.pts,ox,oy);
      for(let i=0;i<p.pts.length-1;i++){
        const ax=ox+p.pts[i][0], ay=oy+p.pts[i][1], bx=ox+p.pts[i+1][0], by=oy+p.pts[i+1][1];
        const L=Math.hypot(bx-ax,by-ay)||1, nx=-(by-ay)/L*5.5, ny=(bx-ax)/L*5.5;
        rails.moveTo(ax+nx,ay+ny); rails.lineTo(bx+nx,by+ny);
        rails.moveTo(ax-nx,ay-ny); rails.lineTo(bx-nx,by-ny);
      }
    }
  }
  cx.lineJoin='round'; cx.lineCap='round';
  cx.strokeStyle='#9A8266'; cx.lineWidth=34; cx.globalAlpha=0.9; cx.stroke(bed); cx.globalAlpha=1;
  cx.lineCap='butt';
  cx.strokeStyle='#6B4A2C'; cx.lineWidth=24; cx.setLineDash([6,12]); cx.stroke(bed); cx.setLineDash([]);
  cx.strokeStyle='#4A423A'; cx.lineWidth=3; cx.stroke(rails);
  for(const [ox,oy,pc] of list) drawPieceDecor(pc,ox,oy);
}
function pathPD(p,s){                 // point + unit direction + z at arc length s
  s=Math.max(0,Math.min(p.len,s));
  let i=1; while(i<p.cum.length-1 && p.cum[i]<s) i++;
  const a=p.pts[i-1], b=p.pts[i], L=p.cum[i]-p.cum[i-1]||1, k=(s-p.cum[i-1])/L;
  return { x:a[0]+(b[0]-a[0])*k, y:a[1]+(b[1]-a[1])*k,
           dx:(b[0]-a[0])/L, dy:(b[1]-a[1])/L,
           z:p.z? p.z[i-1]+(p.z[i]-p.z[i-1])*k : 0 };
}
function chunkRanges(p){              // ~34px runs of a sloped path, painted low-to-high
  const out=[]; let i0=0;
  while(i0<p.pts.length-1){
    let i1=i0+1;
    while(i1<p.pts.length-1 && p.cum[i1]-p.cum[i0]<34) i1++;
    out.push([i0,i1]); i0=i1;
  }
  return out;
}
function strokePts(pts){ cx.beginPath(); cx.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++) cx.lineTo(pts[i][0],pts[i][1]); cx.stroke(); }
function slopeChunkPaint(p,i0,i1,ox,oy,railsOnly){
  const pts=[]; for(let i=i0;i<=i1;i++) pts.push([ox+p.pts[i][0], oy+p.pts[i][1]-LIFT*p.z[i]]);
  cx.lineJoin='round'; cx.lineCap='butt';
  if(!railsOnly){
    cx.strokeStyle='#9A8266'; cx.lineWidth=34; cx.globalAlpha=0.9;
    strokePts(pts); cx.globalAlpha=1;
  }
  cx.strokeStyle='#6B4A2C'; cx.lineWidth=24;
  cx.setLineDash([6,12]); cx.lineDashOffset=-p.cum[i0]; strokePts(pts);
  cx.setLineDash([]); cx.lineDashOffset=0;
  cx.strokeStyle='#4A423A'; cx.lineWidth=3;
  for(let i=0;i<pts.length-1;i++){
    const ax=pts[i][0], ay=pts[i][1], bx=pts[i+1][0], by=pts[i+1][1];
    const L=Math.hypot(bx-ax,by-ay)||1, nx=-(by-ay)/L*5.5, ny=(bx-ax)/L*5.5;
    cx.beginPath(); cx.moveTo(ax+nx,ay+ny); cx.lineTo(bx+nx,by+ny); cx.stroke();
    cx.beginPath(); cx.moveTo(ax-nx,ay-ny); cx.lineTo(bx-nx,by-ny); cx.stroke();
  }
}
// the soft shadow STAYS ON THE GROUND and shrinks with height — free depth
function slopeShadow(pc,ox,oy){
  if(SHADOW_SOFT<=0) return;
  cx.lineJoin='round'; cx.lineCap='round'; cx.strokeStyle='#000';
  const BANDS=5;
  for(let b2=0;b2<BANDS;b2++){
    const z0=b2/BANDS, z1=(b2+1)/BANDS, zm=(z0+z1)/2;
    const path=new Path2D(); let any=false;
    for(const p of pathsOf(pc)){
      if(!p.z) continue;
      let open=false;
      for(let i=0;i<p.pts.length-1;i++){
        const z=(p.z[i]+p.z[i+1])/2;
        if(z>=z0&&z<z1+(b2===BANDS-1?0.001:0)){
          if(!open){ path.moveTo(ox+p.pts[i][0],oy+p.pts[i][1]); open=true; any=true; }
          path.lineTo(ox+p.pts[i+1][0],oy+p.pts[i+1][1]);
        } else open=false;
      }
    }
    if(!any) continue;
    cx.globalAlpha=0.15*SHADOW_SOFT*(1-0.5*zm); cx.lineWidth=30-9*zm; cx.stroke(path);
  }
  cx.globalAlpha=1;
}
function hiShadow(rows){
  if(!rows.length||SHADOW_SOFT<=0) return;
  const path=new Path2D();
  for(const [ox,oy,pc] of rows) for(const p of pathsOf(pc)) addPoly(path,p.pts,ox,oy);
  cx.lineJoin='round'; cx.lineCap='round';
  cx.globalAlpha=0.075*SHADOW_SOFT; cx.strokeStyle='#000'; cx.lineWidth=21; cx.stroke(path);
  cx.globalAlpha=1;
}
// trestle bents: two wooden legs + a cross-brace, GVT wood palette
function postPair(wx,wy,dx,dy,h){
  if(h<6) return;
  const nx=-dy, ny=dx;
  cx.lineCap='round';
  for(const s2 of [-1,1]){
    const bx=wx+nx*13*s2, by=wy+ny*13*s2;
    cx.strokeStyle=TRESTLE_DARK; cx.lineWidth=6;
    cx.beginPath(); cx.moveTo(bx,by+2); cx.lineTo(bx,by-h); cx.stroke();
    cx.strokeStyle=TRESTLE_COL; cx.lineWidth=3.2;
    cx.beginPath(); cx.moveTo(bx,by+2); cx.lineTo(bx,by-h); cx.stroke();
  }
  cx.strokeStyle=TRESTLE_COL; cx.lineWidth=2.4;
  cx.beginPath(); cx.moveTo(wx+nx*13,wy+ny*13-h*0.45); cx.lineTo(wx-nx*13,wy-ny*13-h*0.45); cx.stroke();
  cx.lineCap='butt';
}
function slopeTrestles(pc,ox,oy){
  for(const p of pathsOf(pc)){
    if(!p.z) continue;
    for(let s=TRESTLE_SPACE*0.7; s<p.len-8; s+=TRESTLE_SPACE){
      const d=pathPD(p,s);
      postPair(ox+d.x,oy+d.y,d.dx,d.dy,LIFT*d.z-3);
    }
  }
}
function hiTrestles(pc,ox,oy){
  for(const p of pathsOf(pc)){
    for(const s of [11,p.len-11]){
      const d=pathPD(p,s);
      postPair(ox+d.x,oy+d.y,d.dx,d.dy,LIFT-3);
    }
  }
}
function idxAt(p,s){ let i=0; while(i<p.cum.length-1 && p.cum[i]<s) i++; return Math.max(0,i-1); }
function slopeItems(pc,ox,oy,items){
  for(const p of pathsOf(pc)){
    if(!p.z) continue;
    for(const [i0,i1] of chunkRanges(p))
      items.push({z:Math.min(p.z[i0],p.z[i1]), fn:()=>slopeChunkPaint(p,i0,i1,ox,oy,false)});
    // repaint the crest's ties+rails above the level-1 batch, so a mated high bed's
    // round cap never swallows the last few px of climbing rail at the joint
    items.push({z:1.0005, fn:()=>slopeChunkPaint(p,idxAt(p,p.len-20),p.pts.length-1,ox,oy,true)});
  }
}
function drawAnimPiece(row,S,lift){   // a piece mid-wiggle (rotate/pop/glued-wobble), drawn alone
  const [ox,oy,pc]=row;
  cx.save(); cx.translate(ox+S/2,oy+S/2-(lift||0));
  if(pc.ra) cx.rotate(-(Math.PI/2)*Math.max(0,pc.ra.k));
  if(pc.wob>0) cx.rotate(Math.sin(pc.wob*26)*0.05*pc.wob);   // the tiny "it's stuck" shiver (E5)
  if(pc.pop>0){ const s2=1+0.16*pc.pop; cx.scale(s2,s2); }
  cx.translate(-S/2,-S/2);
  if(pc.t==='rp'||pc.t==='sp'){
    for(const p of pathsOf(pc)) if(p.z) for(const [i0,i1] of chunkRanges(p)) slopeChunkPaint(p,i0,i1,0,0,false);
  } else drawPieceBody(pc,0,0);
  cx.restore();
}
function drawTrackAll(g,hg,carItems,midHook){
  const flat=[], anim=[], sloped=[], hflat=[], hanim=[];
  for(const [k,pc] of g){
    if(pc.t==='ref') continue;
    const [gx,gy]=k.split(',').map(Number), row=[GX+gx*C,GY+gy*C,pc];
    if(pc.t==='rp'||pc.t==='sp') sloped.push(row);
    else if(pc.ra||pc.pop>0||pc.wob>0) anim.push(row);
    else flat.push(row);
  }
  for(const [k,pc] of hg){
    const [gx,gy]=k.split(',').map(Number), row=[GX+gx*C,GY+gy*C,pc];
    if(pc.ra||pc.pop>0||pc.wob>0) hanim.push(row); else hflat.push(row);
  }
  batchTrack(flat);
  for(const row of anim) drawAnimPiece(row,C,0);
  for(const row of sloped) slopeShadow(row[2],row[0],row[1]);
  hiShadow(hflat.concat(hanim));
  for(const row of sloped) slopeTrestles(row[2],row[0],row[1]);
  for(const row of hflat) hiTrestles(row[2],row[0],row[1]);
  for(const row of hanim) hiTrestles(row[2],row[0],row[1]);
  if(midHook) midHook();
  const items=[];
  for(const row of sloped){
    if(row[2].ra||row[2].pop>0) items.push({z:0.0001, fn:()=>drawAnimPiece(row,row[2].t==='sp'?SPS:C,0)});
    else slopeItems(row[2],row[0],row[1],items);
  }
  if(hflat.length) items.push({z:1, fn(){ cx.save(); cx.translate(0,-LIFT); batchTrack(hflat); cx.restore(); }});
  for(const row of hanim) items.push({z:1.001, fn:()=>drawAnimPiece(row,C,LIFT)});
  if(carItems) for(const it of carItems) items.push(it);
  items.sort((a,b)=>a.z-b.z);
  for(const it of items) it.fn();
}
function drawTrack(g){ drawTrackAll(g||grid,EMPTY_MAP,null,null); }
// one piece painted whole (ghost, palette icons, animating pieces)
function drawPieceArt(pc,ox,oy){
  if(pc.t==='rp'||pc.t==='sp'){
    slopeShadow(pc,ox,oy); slopeTrestles(pc,ox,oy);
    for(const p of pathsOf(pc)) if(p.z) for(const [i0,i1] of chunkRanges(p)) slopeChunkPaint(p,i0,i1,ox,oy,false);
    return;
  }
  const lift=(pc.elev|0)?LIFT:0;
  if(lift){
    hiShadow([[ox,oy,pc]]); hiTrestles(pc,ox,oy);
    cx.save(); cx.translate(0,-lift);
    drawPieceBody(pc,ox,oy);
    cx.restore(); return;
  }
  drawPieceBody(pc,ox,oy);
}
function drawPieceBody(pc,ox,oy){
  cx.lineJoin='round';
  for(const p of pathsOf(pc)){
    cx.lineCap='round'; cx.strokeStyle='#9A8266'; cx.lineWidth=34; cx.globalAlpha=0.9;
    cx.beginPath(); cx.moveTo(ox+p.pts[0][0],oy+p.pts[0][1]);
    for(let i=1;i<p.pts.length;i++) cx.lineTo(ox+p.pts[i][0],oy+p.pts[i][1]);
    cx.stroke(); cx.globalAlpha=1; cx.lineCap='butt';
    cx.strokeStyle='#6B4A2C'; cx.lineWidth=24; cx.setLineDash([6,12]); cx.stroke(); cx.setLineDash([]);
    cx.strokeStyle='#4A423A'; cx.lineWidth=3;
    for(let i=0;i<p.pts.length-1;i++){
      const ax=ox+p.pts[i][0], ay=oy+p.pts[i][1], bx=ox+p.pts[i+1][0], by=oy+p.pts[i+1][1];

// sub-polyline of a path between arc lengths s0..s1 (for the frog gap + points blade)
function pathSeg(p,s0,s1){
  s0=Math.max(0,Math.min(p.len,s0)); s1=Math.max(0,Math.min(p.len,s1));
  const at=s=>{ let i=1; while(i<p.cum.length-1&&p.cum[i]<s) i++;
    const a=p.pts[i-1],b=p.pts[i],L=p.cum[i]-p.cum[i-1]||1,k=(s-p.cum[i-1])/L;
    return [a[0]+(b[0]-a[0])*k, a[1]+(b[1]-a[1])*k]; };
  const out=[at(s0)];
  for(let i=0;i<p.pts.length;i++) if(p.cum[i]>s0&&p.cum[i]<s1) out.push(p.pts[i]);
  out.push(at(s1));
  return out;
}

}

// cars-on-rails: pose sampled two axle points apart so headings stay honest in curves;
// on a climb the LIFTED axle points set the tilt, and z rides along for paint order
function carPose(c){
  const f=clone(c.rd), b=clone(c.rd);
  const rf=advance(f,AX), rb=back(b,AX);
  let ang,x,y,z;
  if(rf.moved>1||rb.moved>1){
    const pf=rf.ok||rf.moved>1? pos(f):pos(c.rd), pb=rb.ok||rb.moved>1? pos(b):pos(c.rd);
    ang=Math.atan2((pf.y-LIFT*pf.z)-(pb.y-LIFT*pb.z),pf.x-pb.x);
    x=(pf.x+pb.x)/2; y=(pf.y+pb.y)/2; z=(pf.z+pb.z)/2;
  } else { const p=pos(c.rd); ang=p.ang; x=p.x; y=p.y; z=p.z; }
  return {x,y,ang,z:z||0};
}
function drawCarsOnRails(cars,wheelRot){
  for(let i=cars.length-1;i>=0;i--){
    const c=cars[i], p=carPose(c);
    const artAng=p.ang+(c.face<0?Math.PI:0);
    drawCar(c.type,p.x,p.y,artAng,c.squash||0,wheelRot*(c.face<0?-1:1),null,p.z);
  }
}
// the rug train as z-items: TRAINS SORT INTO PAINT ORDER BY THEIR CURRENT z (E4 law),
// so a train slips under the high line and rides over it, fractional mid-ramp
function trainCarItems(){
  if(!TRAIN.placed) return null;
  const items=[];
  for(let i=TRAIN.cars.length-1;i>=0;i--){
    const c=TRAIN.cars[i], p=carPose(c);
    const artAng=p.ang+(c.face<0?Math.PI:0);
    items.push({z:p.z+0.05, fn:()=>drawCar(c.type,p.x,p.y,artAng,c.squash||0,wheelPhase*(c.face<0?-1:1),null,p.z)});
  }
  return items;
}
function drawGhosts(){

  const isScen=DRAG.kind==='newScen'||DRAG.kind==='moveScen';
  if(isPiece||isScen){
    cx.globalAlpha=0.18; cx.strokeStyle='#F7E9C4'; cx.lineWidth=2;
    for(let gx=0;gx<=GW;gx++) for(let gy=0;gy<=GH;gy++){
      const x=GX+gx*C, y=GY+gy*C;
      cx.beginPath(); cx.moveTo(x-5,y); cx.lineTo(x+5,y); cx.moveTo(x,y-5); cx.lineTo(x,y+5); cx.stroke();
    }

    const span=DRAG.t==='sp'? SPN:1;

function star5(px,py,k,col){                                // the toybox star, gone travelling

// the attract loop: a REAL 4×2 oval of real pieces, ridden by real riders
function buildAttract(){
  AT.grid.clear();
  const put=(x,y,t,r)=>AT.grid.set(key(x,y),mkPiece(t,r));
  put(0,0,'c',1); put(1,0,'s',0); put(2,0,'s',0); put(3,0,'c',2);
  put(0,1,'c',0); put(1,1,'s',0); put(2,1,'s',0); put(3,1,'c',3);
  RGRID=AT.grid; HGRID=AT.hg;
  try{
    const loco={cx:1,cy:0,pi:0,dir:1,s:48,el:0};
    AT.cars=[{type:'loco',rd:loco,face:1,squash:0}];
    const tail=['tender','cab'];                       // the loco + 2 cars, both in livery
    for(let i=1;i<=tail.length;i++){
      const rd=clone(loco); back(rd,GAP*i);
      AT.cars.push({type:tail[i-1],rd,face:1,squash:0});
    }
  } finally { RGRID=grid; HGRID=hgrid; }
}
function menuUpdate(dt){
  RGRID=AT.grid; HGRID=AT.hg;
  try{
    const step=ATT_SPEED*dt;
    for(const c of AT.cars) advance(c.rd,step);       // a closed oval — advance never fails
    AT.wheel+=step/8;
    AT.smokeT-=dt;
    if(AT.smokeT<=0){
      AT.smokeT=0.34;
      const loco=AT.cars[0], p=pos(loco.rd);
      const artAng=p.ang+(loco.face<0?Math.PI:0);
      const flip=Math.cos(artAng)<0;
      const lx=18*KART, ly=(flip?28:-28)*KART;
      const ca=Math.cos(artAng), sa=Math.sin(artAng);
      AT.smoke.push({ x:p.x+ca*lx-sa*ly, y:p.y+sa*lx+ca*ly, t:0, dur:1.2,
                      vx:(Math.random()-0.5)*10, vy:-30, r:3+Math.random()*2 });
    }
  } finally { RGRID=grid; HGRID=hgrid; }
  for(const s of AT.smoke){ s.t+=dt; s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy-=8*dt; }
  AT.smoke=AT.smoke.filter(s=>s.t<s.dur);
  if(MENU_MUSIC){ AT.musT-=dt; if(AT.musT<=0){ AT.musT=5.5; SND.lull(); } }
}

/* =====================================================================
   SOUND — small synth kit through one gate (GVT palette)
   ===================================================================== */
const AU={ctx:null,g:null,on:true};
function ac(){
  if(!AU.ctx){
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
    AU.ctx=new AC(); AU.g=AU.ctx.createGain(); AU.g.gain.value=0.5; AU.g.connect(AU.ctx.destination);
  }
  if(AU.ctx.state==='suspended') AU.ctx.resume();
  return AU.ctx;
}
function tone(f,dur,type,vol,slideTo,when){
  const a=ac(); if(!a||!AU.on) return;
  const t0=a.currentTime+(when||0);
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo),t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(vol,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(AU.g); o.start(t0); o.stop(t0+dur+0.05);
}
let NBUF=null;
function noise(dur,freq,vol,type,when){
  const a=ac(); if(!a||!AU.on) return;
  if(!NBUF){ NBUF=a.createBuffer(1,a.sampleRate*0.5,a.sampleRate);
    const d=NBUF.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  const t0=a.currentTime+(when||0);
  const s=a.createBufferSource(); s.buffer=NBUF; s.loop=true;
  const f=a.createBiquadFilter(); f.type=type||'bandpass'; f.frequency.value=freq; f.Q.value=1.1;
  const g=a.createGain();
  g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f); f.connect(g); g.connect(AU.g); s.start(t0); s.stop(t0+dur+0.05);
}

// one serializer, three callers: the save file, the free-play stash the campaign
// swaps out (E5 — FREE PLAY IS SACRED), and the campaign WIP (which drops glued rows)
function serWorld(){
  const g=[];
  for(const [k,pc] of grid){ if(pc.t==='ref') continue; g.push([k,pc.t,pc.r,pc.sel|0,pc.elev|0]); }
  for(const [k,pc] of hgrid) g.push([k,pc.t,pc.r,pc.sel|0,1]);
  const sc=[]; for(const [k,s] of scen) sc.push([k,s.t,s.v|0]);
  return { grid:g, scen:sc, consist:consist.slice(),
    train: TRAIN.placed? { cars:TRAIN.cars.map(c=>({t:c.type,cx:c.rd.cx,cy:c.rd.cy,pi:c.rd.pi,dir:c.rd.dir,s:c.rd.s,f:c.face,e:c.rd.el?1:0})), F:TRAIN.F } : null };
}
// apply a serialized world verbatim (load + the campaign's free-play restore)
function appWorld(d){
  grid.clear(); hgrid.clear(); scen.clear();
  TRAIN.placed=false; TRAIN.running=false; TRAIN.cars=[];
  // v:1 rows are [k,t,r] (no sel, no scen block) — they load clean, scenery empty.
  // v:1/v:2 carry no colour — they migrate to v:3 as RED (today's exact art).
  // v:1/v:2/v:3 rows carry no elev — they migrate to v:4 all on the ground.
  for(const [k,t,r,sel,elev] of (d.grid||[])){
    if(!PATHS[t]) continue;
    const [x,y]=k.split(',').map(Number);
    setTrackPiece(t,r,sel,t==='rp'||t==='sp'?0:(elev?1:0),x,y);
  }
  for(const [k,t,v] of (d.scen||[])) if(SCENDEF[t]) scen.set(k,{t,v:v|0,ra:null,pop:0,wave:0});
  if(Array.isArray(d.consist)) consist=d.consist.filter(t=>CARDEF[t]).slice(0,MAXCARS);
  if(d.train && d.train.cars && d.train.cars.length){
    let ok=true;
    const cars=d.train.cars.map(c=>{
      const rd={cx:c.cx,cy:c.cy,pi:c.pi,dir:c.dir>0?1:-1,s:+c.s||0,el:c.e?1:0};
      const pc=pieceOf(rd);
      if(!pc || !pathsOf(pc)[c.pi]) ok=false;
      return {type:c.t,rd,face:c.f<0?-1:1,squash:0};
    });
    if(ok){ TRAIN.cars=cars; TRAIN.placed=true; TRAIN.F=d.train.F!==false; }
  }
}
function save(){
  try{
    // v:5 — the rug fields are the FREE-PLAY world, always: while the campaign is on,
    // the stashed free-play snapshot is written back verbatim (never the level), and
    // the level's work-in-progress rides in camp.wip instead. Cleared on win.
    // E6: the wind-up rug stashes the same way and persists NOTHING of its own.
    const w=CAMP.on? FREE : (PLAY.on? PFREE : serWorld());
    localStorage.setItem('TRAINSET', JSON.stringify({
      v:5, grid:w.grid, scen:w.scen, consist:w.consist, color:COLOR, train:w.train,
      camp:{ done:[...CAMP.done], all:CAMP.all?1:0,
             wip: CAMP.on? (CAMP_WIP&&!CAMP.won? serWip():null) : (CAMP_WIP? CAMP.wip:null) },
      hints:hintStage, lap:lapDone, mute:!AU.on,
    }));
  }catch(e){}
}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem('TRAINSET')||'null'); if(!d) return;
    appWorld(d);
    COLOR=(d.color&&LIVERY[d.color])? d.color : 'red';
    hintStage=d.hints|0; lapDone=!!d.lap; AU.on=!d.mute;
    const cp=d.camp||{};   // v:1..v:4 saves carry no camp block — the campaign arrives fresh (v:5 migration)
    CAMP.done=new Set((cp.done||[]).filter(n=>n>=1&&n<=LEVELS.length));
    CAMP.all=!!cp.all;
    CAMP.wip=(CAMP_WIP&&cp.wip&&cp.wip.level>=1&&cp.wip.level<=LEVELS.length)? cp.wip : null;
  }catch(e){}
}
