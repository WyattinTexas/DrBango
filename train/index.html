// TS.camp.solve(n) builds it and the battery proves all ten win. A level whose
// reference stops fitting refuses to ship (battery red).
function ringRows(x0,y0,x1,y1,skip){    // a rectangle of track; skip = the glued station cells on it
  const rows=[], S=new Set((skip||[]).map(c2=>key(c2[0],c2[1])));
  const put=(t,r,x,y)=>{ if(!S.has(key(x,y))) rows.push([t,r,x,y]); };
  put('c',1,x0,y0); put('c',2,x1,y0); put('c',3,x1,y1); put('c',0,x0,y1);
  for(let x=x0+1;x<x1;x++){ put('s',0,x,y0); put('s',0,x,y1); }
  for(let y=y0+1;y<y1;y++){ put('s',1,x0,y); put('s',1,x1,y); }
  return rows;
}
const swapBr=(rows,cells)=>rows.map(r=>cells.some(c2=>c2[0]===r[2]&&c2[1]===r[3])? ['br',r[1],r[2],r[3]] : r);
const SOLVE=[
  { start:[5,2], rows:ringRows(4,2,7,5) },                                  // round the pond
  { start:[3,1], rows:ringRows(2,1,9,6) },                                  // round the meadow
  { start:[2,4], rows:ringRows(1,4,3,5,[[2,5]]) },                          // the little cottage loop
  { start:[4,2], rows:swapBr(ringRows(3,2,9,5),[[6,2],[6,5]]) },            // two bridges over the river
  { start:[2,1], rows:ringRows(1,1,11,6,[[10,6]]) },                        // the big detour round the paddock
  { start:[2,6], rows:ringRows(1,1,10,6,[[5,1]]) },                         // round both ponds
  { start:[2,1], rows:ringRows(0,1,11,6,[[10,1],[1,6]]) },                  // ring the whole street
  { start:[7,6], rows:swapBr(ringRows(6,1,10,6,[[9,1]]),[[6,4],[10,4]]) },  // bridge twice, east of the farm
  { start:[2,1], rows:ringRows(0,1,11,6,[[1,1],[10,6]]) },                  // ring the square
  { start:[7,5], rows:[ ['c',1,3,5],['s',0,4,5],['s',0,5,5],['s',0,6,5],['s',0,7,5],['s',0,8,5],
      ['c',3,9,5],['c',1,9,4],['c',2,11,4],['s',1,11,5],['c',3,11,6],
      ['s',0,10,6],['s',0,9,6],['s',0,8,6],['s',0,7,6],['s',0,6,6],['s',0,4,6],['c',0,3,6] ] },  // the grand tour
];
// the campaign's own state object — free play's grid/consist/save is NEVER touched
const CAMP={ on:false, level:0, won:false, tugT:false, stations:[], visited:new Set(),
             done:new Set(), all:false, wip:null };
let FREE=null;            // the stashed free-play world while a level is open
let goalT=0, winT=0;      // the goal card + the LINE COMPLETE! card
function campUnlocked(n){ return !CAMP_SEQ || CAMP.all || n===1 || CAMP.done.has(n-1); }
function serWip(){        // the level's work-in-progress — glued rows regenerate from LEVELS, never saved
  const g=[];
  for(const [k,pc] of grid){ if(pc.t==='ref'||pc.glued) continue; g.push([k,pc.t,pc.r,pc.sel|0,pc.elev|0]); }
  for(const [k,pc] of hgrid) g.push([k,pc.t,pc.r,pc.sel|0,1]);
  const sc=[]; for(const [k,s] of scen){ if(s.glued) continue; sc.push([k,s.t,s.v|0]); }
  return { level:CAMP.level, grid:g, scen:sc, consist:consist.slice() };
}
function clearPlayer(){   // sweep everything the PLAYER built; the glued land stays
  for(const [k,pc] of [...grid]){ if(pc.t==='ref'||pc.glued) continue;
    const [x,y]=k.split(',').map(Number); removeTrackPiece(x,y,pc); }
  for(const [k,pc] of [...hgrid]){ const [x,y]=k.split(',').map(Number); removeTrackPiece(x,y,pc); }
  for(const [k,s] of [...scen]) if(!s.glued) scen.delete(k);
  trainHome(true);
}
function campEnter(n){
  const L=LEVELS[n-1]; if(!L||!campUnlocked(n)) return false;
  if(CAMP.on){ if(CAMP_WIP&&!CAMP.won) CAMP.wip=serWip(); }
  else FREE=serWorld();                       // stash the kid's rug — restored verbatim on exit
  CAMP.on=true; CAMP.level=n; CAMP.won=false; CAMP.tugT=false;
  CAMP.visited=new Set(); winT=0;
  grid.clear(); hgrid.clear(); scen.clear();
  TRAIN.placed=false; TRAIN.running=false; TRAIN.cars=[];
  for(const g of L.glued) scen.set(key(g[1],g[2]),{t:g[0],v:g[3]|0,ra:null,pop:0,wave:0,glued:1});
  CAMP.stations=[];
  for(const st of L.stations){
    const pc=setTrackPiece('st',st[2]|0,null,0,st[0],st[1]); pc.glued=1;
    CAMP.stations.push(key(st[0],st[1])+':0');
  }
  if(CAMP_WIP && CAMP.wip && CAMP.wip.level===n){   // the level data may have moved under a saved wip — skip what no longer fits
    for(const [k,t,r,sel,elev] of (CAMP.wip.grid||[])){
      if(!PATHS[t]) continue;
      const [x,y]=k.split(',').map(Number), el=(t==='rp'||t==='sp')?0:(elev?1:0);
      const cells=t==='sp'? spiralCells(x,y) : [[x,y]];
      let ok=true;
      for(const [x2,y2] of cells){
        if(x2<0||y2<0||x2>=GW||y2>=GH||cellBlocksTrack(t,x2,y2)){ ok=false; break; }
        const lo=pieceAt(x2,y2);
        if(el? (pieceHi(x2,y2)||(lo&&spans2(lo))) : lo){ ok=false; break; }
      }
      if(ok) setTrackPiece(t,r,sel,el,x,y);
    }
    for(const [k,t,v] of (CAMP.wip.scen||[])){
      if(!SCENDEF[t]) continue;
      const [x,y]=k.split(',').map(Number);
      if(x>=0&&y>=0&&x<GW&&y<GH&&canPlaceScen(t,x,y)) scen.set(k,{t,v:v|0,ra:null,pop:0,wave:0});
    }
    consist=(CAMP.wip.consist||consist).filter(t=>CARDEF[t]).slice(0,MAXCARS);
  }
  goalT=4.2;
  $('mark').textContent='🎫 LEVEL '+n;
  showScreen('game'); goBtnSync(); shedSync(); save();
  return true;
}
function campExit(dest){
  if(!CAMP.on){ showScreen(dest); return; }
  CAMP.wip=(CAMP_WIP&&!CAMP.won)? serWip() : null;   // cleared on win, kept mid-build
  CAMP.on=false; CAMP.level=0; CAMP.won=false; goalT=0; winT=0;
  appWorld(FREE||{grid:[],scen:[],consist:consist,train:null}); FREE=null;
  $('mark').textContent='🚂 TRAIN SET';
  showScreen(dest); goBtnSync(); shedSync(); save();
}
function campLap(){          // the lap machinery fired inside a level
  if(CAMP.won) return;
  if(TRAIN.revSinceGo) return;                                 // a TRUE loop — ping-pongs don't count
  if(!CAMP.stations.every(k=>CAMP.visited.has(k))) return;     // ...AND every station pause-visited
  campWin();
}
function campWin(){
  CAMP.won=true; CAMP.done.add(CAMP.level); CAMP.wip=null;
  winT=3.6; SND.bugle(); SND.whistle();
  confettiBurst(CAMP.level===LEVELS.length? 180 : 90);         // GRAND OPENING! gets the double burst
  boardSync(); winSync(); save();
}
// a tug on the glued land: tiny wobble, one toast per level, then quiet
function gluedTug(pc,s){
  if(pc) pc.wob=1;
  if(s) s.ra={k:1};
  SND.tok();
  if(CAMP.on&&!CAMP.tugT){ CAMP.tugT=true; toast("IT'S PART OF THE LAND!"); }
}
function drawCampCards(){
  if(!CAMP.on) return;
  const L=LEVELS[CAMP.level-1]; if(!L) return;
  const card=(T,total,title,sub,subCol)=>{
    const k=Math.min(1,(total-T)*5), out=Math.min(1,T*2.5);
    cx.globalAlpha=Math.max(0,Math.min(k,out));
    const cw=Math.min(600,W-40), chh=112, x=(W-cw)/2, y=(H-BAR)/2-76;
    cx.fillStyle='#1e1610'; rr(x,y,cw,chh,16); cx.fill();
    cx.strokeStyle='#F2C531'; cx.lineWidth=4; rr(x,y,cw,chh,16); cx.stroke();
    cx.textAlign='center'; cx.fillStyle='#F2C531';
    let f=28; cx.font='bold '+f+'px "Arial Black",Impact,sans-serif';
    const w1=cx.measureText(title).width;
    if(w1>cw-36){ f=Math.max(13,Math.floor(f*(cw-36)/w1)); cx.font='bold '+f+'px "Arial Black",Impact,sans-serif'; }
    cx.fillText(title,W/2,y+46);
    cx.fillStyle=subCol; let f2=13; cx.font='bold 13px "Arial Black",Impact,sans-serif';
    const w2=cx.measureText(sub).width;
    if(w2>cw-30){ f2=Math.max(8,Math.floor(13*(cw-30)/w2)); cx.font='bold '+f2+'px "Arial Black",Impact,sans-serif'; }
    cx.fillText(sub,W/2,y+80);
    cx.globalAlpha=1;
  };
  if(goalT>0) card(goalT,4.2,'LEVEL '+CAMP.level+' — '+L.name,L.hint,'#F7E9C4');
  if(winT>0) card(winT,3.6,CAMP.level===LEVELS.length?'GRAND OPENING!':'LINE COMPLETE!',
                  L.name+'  '+CAMP_STAR,'#CFF7C4');
}
// ---- the level board: a wooden panel of ten numbered tickets ----

/* =====================================================================
   PLAY! — THE WIND-UP RUG (E6). The two-year-old's mode: a finished
   figure-8 already chugging when the lid opens, a tray of more trains
   to plop on, and exactly one rule — two trains that touch go BONK.
   No palette, no shed, no hints, no editing, no failure. PLAY persists
   NOTHING (stateless law): every visit boots this same lovely map with
   one red train, and the build/campaign saves are never read or
   written by this mode.
   ===================================================================== */
const PLAY={ on:false, trains:[], crashes:0, respawnT:0, nextId:1, loop:null };
let PFREE=null;               // the stashed build-rug world while the wind-up rug is out
// Walk the glued circuit once and rule it: (cell,elev,path) -> arc coordinate. The
// figure-8 is ONE closed path (it crosses its own diamond twice on different paths),
// so every rider and every spawn lives on this single ruler.
function buildLoopMap(){
  const st=PLAYMAP.track.find(row=>row[0]==='st')||PLAYMAP.track[0];
  const rd={cx:st[2],cy:st[3],pi:0,dir:1,s:0,el:0};
  const segs=[]; let d=0;
  for(let g=0; g<200; g++){
    const pc=pieceOf(rd), p=pathsOf(pc)[rd.pi];
    segs.push({k:key(rd.cx,rd.cy), el:rd.el|0, pi:rd.pi, dir:rd.dir, d0:d, len:p.len});
    d+=p.len;
    rd.s=rd.dir>0? p.len:0;
    if(!enter(rd, p.ports[rd.dir>0?1:0])) break;                      // can't happen on the glued loop
    if(rd.cx===st[2]&&rd.cy===st[3]&&rd.pi===0&&rd.dir===1) break;    // home again — the circuit closed
  }
  const by=new Map(); for(const sg of segs) by.set(sg.k+':'+sg.el+':'+sg.pi,sg);
  const home=by.get(key(PLAYMAP.start[0],PLAYMAP.start[1])+':0:0');
  PLAY.loop={ segs, by, len:d, home: home? home.d0+home.len/2 : 0 };
}
const loopCoord=rd=>{
  const sg=PLAY.loop && PLAY.loop.by.get(key(rd.cx,rd.cy)+':'+(rd.el?1:0)+':'+rd.pi);
  return sg? sg.d0+(sg.dir>0? rd.s : sg.len-rd.s) : null;
};
function riderAt(d){                  // materialize a rider at loop coordinate d
  const L=PLAY.loop.len; d=((d%L)+L)%L;
  for(const sg of PLAY.loop.segs){
    if(d<sg.d0||d>sg.d0+sg.len) continue;
    const off=d-sg.d0, [x,y]=sg.k.split(',').map(Number);
    return {cx:x,cy:y,pi:sg.pi,dir:sg.dir,s:sg.dir>0? off : sg.len-off,el:sg.el};
  }
  const sg=PLAY.loop.segs[PLAY.loop.segs.length-1], [x,y]=sg.k.split(',').map(Number);
  return {cx:x,cy:y,pi:sg.pi,dir:sg.dir,s:sg.dir>0?sg.len:0,el:sg.el};
}
// THE SPAWN LAW: the new train lands on the free stretch FARTHEST from every train —
// maximize the minimum arc distance over every car it will drop — and never into a
// cell any rider occupies RIGHT NOW (the diamond shares one cell between two arcs
// that are far apart on the ruler, so arc distance alone isn't enough).
function playSpot(n){
  const L=PLAY.loop.len, occ=[], cells=new Set();
  for(const tr of PLAY.trains){ if(tr.dying) continue;
    for(const c of tr.cars){ const lc=loopCoord(c.rd); if(lc!=null) occ.push(lc);
      cells.add(key(c.rd.cx,c.rd.cy)+':'+(c.rd.el?1:0)); } }
  if(!occ.length) return PLAY.loop.home;      // an empty rug: the resident's home straight
  let best=-1, bestD=null;
  const STEPS=Math.max(96,Math.round(L/12));
  for(let i=0;i<STEPS;i++){
    const d0=L*i/STEPS; let mn=Infinity, ok=true;
    for(let ci=0;ci<n;ci++){
      const dc=((d0-ci*GAP)%L+L)%L, r=riderAt(dc);
      if(cells.has(key(r.cx,r.cy)+':'+(r.el?1:0))){ ok=false; break; }
      for(const o of occ){ const ad=Math.abs(dc-o), dd=Math.min(ad,L-ad); if(dd<mn) mn=dd; }
    }
    if(ok&&mn>best){ best=mn; bestD=d0; }
  }
  return best>=PLAY_CLEAR? bestD : null;
}
// THE TAP IS THE WHOLE GESTURE (2-year-old law): a colour plops a whole train onto
// the rails, whistling. speed/cars are pinned only by the rig (deterministic batteries).
function playAdd(color,speed,cars){
  if(!PLAY.on||!LIVERY[color]) return {ok:false,why:'mode'};
  if(PLAY.trains.length>=PLAY_CAP) return {ok:false,why:'cap'};
  const tail=cars? cars.slice() : (()=>{ const o=['tender'], n=1+(Math.random()<0.5?0:1);
    for(let i=0;i<n;i++) o.push(PLAY_POOL[Math.floor(Math.random()*PLAY_POOL.length)]);
    return o; })();
  const spot=playSpot(1+tail.length);
  if(spot==null) return {ok:false,why:'full'};
  const head=riderAt(spot);
  const tr={ id:PLAY.nextId++, color,
    speed: speed!=null? Math.max(0.1,+speed) : PLAY_SPEED_R[0]+Math.random()*(PLAY_SPEED_R[1]-PLAY_SPEED_R[0]),
    cars:[{type:'loco',rd:head,face:1,squash:0}],
    pauseT:0, stKey:null, cellKey:null, dying:false, crashT:0, wheel:0, smokeT:0.2 };
  for(let i=1;i<=tail.length;i++){ const rd=clone(head); back(rd,GAP*i); tr.cars.push({type:tail[i-1],rd,face:1,squash:0}); }
  PLAY.trains.push(tr);
  SND.whistle(); const p=pos(head); puff(p.x,p.y-10,18);
  return {ok:true,id:tr.id};
}
// THE CRASH LAW: riders of two DIFFERENT trains on the same (cell, elev) — rear-end
// catch on the ring or side-on at the diamond — and BOTH go BONK: squash + stars +
// smoke, tumble-fade ~0.8s, gone. Everyone else keeps rolling. ⚠ (cell,elev) key,
// the E4 audit — never bare cell.
function playCrash(a,b,ck){
  const parts=ck.split(':'), el=+parts[1], [gx,gy]=parts[0].split(',').map(Number);
  const wx=GX+gx*C+C/2, wy=GY+gy*C+C/2-(el?LIFT:0);
  for(const tr of [a,b]){
    tr.dying=true; tr.crashT=CRASH_TUMBLE;
    for(const c of tr.cars){ c.squash=1;
      c.tum={vx:(Math.random()-0.5)*120, vy:-40-Math.random()*70, vr:(Math.random()-0.5)*12}; }
  }
  PLAY.crashes++;
  SND.bonk(); puff(wx,wy,26);
  fx.push({k:'stars',x:wx,y:wy,a:Math.random()*TAU,t:0,dur:0.9});
}
function playUpdate(dt){
  if(!PLAY.on) return;
  for(const tr of PLAY.trains) if(tr.dying){ tr.crashT-=dt;
    for(const c of tr.cars) if(c.squash>0) c.squash=Math.max(0,c.squash-dt*2.5); }
  PLAY.trains=PLAY.trains.filter(tr=>!tr.dying||tr.crashT>0);
  // THE NEVER-EMPTY LAW: an empty rug re-arms itself — a fresh red train in ~2s
  if(!PLAY.trains.length){
    PLAY.respawnT-=dt;
    if(PLAY.respawnT<=0){ PLAY.respawnT=PLAY_RESPAWN; playAdd('red',1,PLAY_HOME_CARS); }
  } else PLAY.respawnT=PLAY_RESPAWN;
  const live=PLAY.trains.filter(tr=>!tr.dying);
  let top=0;
  for(const tr of live){
    if(tr.pauseT>0){ tr.pauseT-=dt; continue; }       // paused at the platform (and catchable there)
    if(tr.speed>top) top=tr.speed;
    const step=SPEED*tr.speed*dt;
    for(const c of tr.cars) advance(c.rd,step);       // a closed glued loop — advance never dead-ends
    tr.wheel+=step/8;
    tr.smokeT-=dt; if(tr.smokeT<=0){ tr.smokeT=0.2; puffLoco(tr.cars[0]); }
    // THE CHARM LAW, shared gate: people wave, the herd startles, ≤1 chirp per pass
    for(const c of tr.cars){
      for(let dy=-REACT_R;dy<=REACT_R;dy++) for(let dx=-REACT_R;dx<=REACT_R;dx++){
        const s=scen.get(key(c.rd.cx+dx,c.rd.cy+dy));
        if(s && SCENDEF[s.t].react && !(s.wave>0)){
          s.wave=1.3;
          if(yayCd<=0){ yayCd=3; chirpN++; SND[CHIRP[s.t]](); }
        }
      }
    }
    // the station pause, per train, keyed (cell,elev) — the bunching machine
    const lc=tr.cars[0].rd, lpc=pieceOf(lc), lk=key(lc.cx,lc.cy)+':'+(lc.el?1:0);
    if(lpc&&lpc.t==='st'){
      const mid=pathsOf(lpc)[lc.pi].len/2;
      if(Math.abs(lc.s-mid)<step+0.6 && tr.stKey!==lk){ tr.stKey=lk; tr.pauseT=STATION_PAUSE; SND.ding(); }
    }
    if(lk!==tr.cellKey){ if(tr.stKey&&tr.stKey!==lk) tr.stKey=null; tr.cellKey=lk; }
  }
  // one chug clock for the whole rug, paced by the fastest runner (quiet-HUD: ten
  // trains chuffing independently would be a racket, not a toy)
  if(top>0){ chugAcc+=SPEED*top*dt;
    if(chugAcc>52){ chugAcc=0;
      const deep=live.some(tr=>{ const p=pieceOf(tr.cars[0].rd); return !!p&&p.t==='br'; });
      SND.chuff(deep); } }
  // the crash sweep: any two live trains sharing a (cell,elev) go BONK together
  const sets=live.map(tr=>{ const s=new Set();
    for(const c of tr.cars) s.add(key(c.rd.cx,c.rd.cy)+':'+(c.rd.el?1:0)); return s; });
  for(let i=0;i<live.length;i++){
    if(live[i].dying) continue;
    for(let j=i+1;j<live.length;j++){
      if(live[j].dying) continue;
      let hit=null;
      for(const k2 of sets[i]) if(sets[j].has(k2)){ hit=k2; break; }
      if(hit) playCrash(live[i],live[j],hit);
    }
  }
}
function playEnter(){
  if(PLAY.on||CAMP.on) return PLAY.on;
  PFREE=serWorld();                      // the build rug, stashed — restored verbatim on exit
  PLAY.on=true; PLAY.trains=[]; PLAY.crashes=0; PLAY.respawnT=PLAY_RESPAWN; PLAY.nextId=1;
  grid.clear(); hgrid.clear(); scen.clear();
  TRAIN.placed=false; TRAIN.running=false; TRAIN.cars=[];
  for(const g of PLAYMAP.scen) scen.set(key(g[1],g[2]),{t:g[0],v:g[3]|0,ra:null,pop:0,wave:0,glued:1});
  for(const [t,r,x,y] of PLAYMAP.track){ const pc=setTrackPiece(t,r,null,0,x,y); pc.glued=1; }
  buildLoopMap();
  playAdd('red',1,PLAY_HOME_CARS);       // one red train, already running — the lid opens mid-chug
  $('mark').textContent=PLAY_MARK;
  showScreen('play');
  return true;
}
function playExit(dest){
  if(!PLAY.on){ showScreen(dest); return; }
  PLAY.on=false; PLAY.trains=[]; PLAY.loop=null;
  appWorld(PFREE||{grid:[],scen:[],consist:consist,train:null}); PFREE=null;
  $('mark').textContent='🚂 TRAIN SET';
  showScreen(dest); goBtnSync(); shedSync();
}
function playLocoHit(wx,wy){             // a toddler finger on any car of any train
  for(const tr of PLAY.trains){ if(tr.dying) continue;
    for(const c of tr.cars){ const p=pos(c.rd);
      if(Math.hypot(wx-p.x, wy-(p.y-LIFT*(p.z||0)))<34) return tr; } }
  return null;
}
// play trains as z-items for the E4 paint pipeline; a dying consist tumbles and fades
function playCarItems(){
  const items=[];
  for(const tr of PLAY.trains){
    const liv=LIVERY[tr.color]||LIVERY.red;
    const tt=tr.dying? CRASH_TUMBLE-tr.crashT : 0;
    const fd=tr.dying? Math.max(0,tr.crashT/CRASH_TUMBLE) : 1;
    for(let i=tr.cars.length-1;i>=0;i--){
      const c=tr.cars[i], p=carPose(c), artAng=p.ang+(c.face<0?Math.PI:0);
      items.push({z:p.z+0.05, fn: tr.dying?
        ()=>drawCar(c.type, p.x+c.tum.vx*tt, p.y+c.tum.vy*tt+130*tt*tt, artAng+c.tum.vr*tt, c.squash, tr.wheel, liv, p.z, fd) :
        ()=>drawCar(c.type, p.x, p.y, artAng, c.squash||0, tr.wheel*(c.face<0?-1:1), liv, p.z)});
    }
  }
  return items;
}

cvs.addEventListener('pointerdown',e=>{
  if(SCREEN!=='game'&&SCREEN!=='play') return;   // the menu room is scenery — its buttons are DOM
  ac(); e.preventDefault();
  const [wx,wy]=worldXY(e);
  if(SCREEN==='play'){
    // E6: taps do what taps already do — a finger on a train gets first claim (whistle);
    // everything else falls through to the usual piece/scenery taps (wobble/charm/knock)
    const tr=playLocoHit(wx,wy);
    if(tr){ down={x:e.clientX,y:e.clientY,what:'ptrain',tr}; return; }
  }
  if(TRAIN.placed){
    const p=pos(TRAIN.cars[0].rd);
    if(Math.hypot(wx-p.x,wy-(p.y-LIFT*(p.z||0)))<36){ down={x:e.clientX,y:e.clientY,what:'loco'}; return; }
  }
  const cell=cellXY(wx,wy);
  if(cell && pieceTop(cell[0],cell[1])){
    down={x:e.clientX,y:e.clientY,what:'piece',cell};
    // splitter: tap = throw the points, so rotation moves to a long-press
    if(pieceTop(cell[0],cell[1]).t==='sw'){
      const d=down;
      d.lp=setTimeout(()=>{ if(down===d){ down=null; swRotate(cell[0],cell[1]); } },550);
    }
    return;
  }
  if(cell && scenAt(cell[0],cell[1])){ down={x:e.clientX,y:e.clientY,what:'scen',cell}; return; }

      if(TRAIN.placed && trainOn(gx,gy,pc)){

  }

},{passive:false});
window.addEventListener('pointerup',e=>{
  if(DRAG){
    const [wx,wy]=worldXY(e); hover=cellXY(wx,wy);
    if(DRAG.kind==='newPiece'||DRAG.kind==='movePiece'){
      // the drop asks THE predicate — the same one the ghost tint asked all along
      const q=hover? placeQuery(DRAG.t,DRAG.r,hover[0],hover[1]) : null;
      if(q&&q.ok){
        const pc=setTrackPiece(DRAG.t,DRAG.r,DRAG.sel,q.elev,hover[0],hover[1]); pc.pop=1;
        SND.tok(); puff(GX+hover[0]*C+C/2,GY+hover[1]*C+C/2,14);
        hintPass(0); if(grid.size>=3) hintPass(1);
        save();
      } else if(hover){
        if(DRAG.kind==='movePiece'){ setTrackPiece(DRAG.t,DRAG.r,DRAG.sel,DRAG.elev|0,DRAG.from[0],DRAG.from[1]); save(); }
        let msg='THAT SPOT IS TAKEN';
        if(q&&q.why==='ramp') msg='NEEDS A RAMP!';
        else if(q&&q.why==='scenery'){
          let s=null;
          for(const [x2,y2] of (DRAG.t==='sp'? spiralCells(hover[0],hover[1]):[hover])){
            const s2=scenAt(x2,y2); if(s2&&cellBlocksTrack(DRAG.t,x2,y2)){ s=s2; break; }
          }
          if(s){
            if(s.t==='rv') msg='ONLY A BRIDGE CAN CROSS THE RIVER!';
            else if(s.t==='fence') msg='THE FENCE IS IN THE WAY!';
            else if(SCENDEF[s.t].knock) msg='THE TOWN IS IN THE WAY!';
          }
        }
        toast(msg);
      } else {
        if(DRAG.kind==='movePiece'){ SND.pop(); puff(wx,wy,14); save(); }
      }
    }
    else if(DRAG.kind==='newScen'||DRAG.kind==='moveScen'){
      if(hover && canPlaceScen(DRAG.t,hover[0],hover[1])){
        scen.set(key(hover[0],hover[1]),{t:DRAG.t,v:DRAG.v|0,ra:null,pop:1,wave:0});
        SND.tok(); puff(GX+hover[0]*C+C/2,GY+hover[1]*C+C/2,14);
        save();
      } else if(hover){
        if(DRAG.kind==='moveScen'){ scen.set(key(DRAG.from[0],DRAG.from[1]),{t:DRAG.t,v:DRAG.v|0,ra:null,pop:0,wave:0}); save(); }
        toast(DRAG.t==='rv'&&pieceAt(hover[0],hover[1])?'WATER AND TRACK DON\'T MIX — TRY A BRIDGE!':'THAT SPOT IS TAKEN');
      } else {
        if(DRAG.kind==='moveScen'){ SND.pop(); puff(wx,wy,14); save(); }
      }
    }
    else if(DRAG.kind==='train'){
      let placedOk=false;
      if(hover && pieceTop(hover[0],hover[1])) placedOk=placeTrainAt(hover[0],hover[1]);
      if(placedOk){
        SND.clank(); hintPass(3);
        if(DRAG.wasRunning) goTrain();
      } else {
        if(hover && pieceTop(hover[0],hover[1])) toast('TOO SHORT FOR THIS TRAIN!');
        if(DRAG.prev){ TRAIN.cars=DRAG.prev.map(c=>({type:c.type,rd:clone(c.rd),face:c.face,squash:0})); TRAIN.placed=true; TRAIN.F=DRAG.prevF; }
        else toast('BACK IN THE SHED');
      }
      goBtnSync(); shedSync(); save();
    }
    DRAG=null; hover=null; return;
  }
  if(!down) return;
  if(down.lp){ clearTimeout(down.lp); down.lp=null; }
  const dist=Math.hypot(e.clientX-down.x,e.clientY-down.y);
  if(dist<8){
    if(down.what==='loco'){ SND.whistle(); for(let i=0;i<3;i++) setTimeout(stackPuff,i*90); }
    else if(down.what==='ptrain'){
      const tr=down.tr; SND.whistle();
      if(!tr.dying) for(let i=0;i<3;i++) setTimeout(()=>{ if(PLAY.on&&!tr.dying&&tr.cars.length) puffLoco(tr.cars[0]); },i*90);
    }
    else if(down.what==='piece'){
      const [gx,gy]=down.cell, pc=pieceTop(gx,gy);
      if(pc){
        if(pc.glued){ gluedTug(pc,null); }        // no rotating the glued land either
        else if(pc.t==='sw'){
          // TAP THE PIECE = THROW THE POINTS (rotation lives on a long-press)
          if(TRAIN.placed && (pc.latch || trainOn(gx,gy,pc))){ SND.toot(); toast('THE TRAIN IS USING THAT PIECE!'); }
          else { pc.sel^=1; SND.click(); save(); }
        }
        else if(TRAIN.placed && trainOn(gx,gy,pc)){
          if(TRAIN.running){ SND.toot(); toast('THE TRAIN IS USING THAT PIECE!'); }
          else { trainHome(false); pc.r=(pc.r+1)%4; pc.ra={k:1}; SND.click(); save(); }
        } else { pc.r=(pc.r+1)%4; pc.ra={k:1}; SND.click(); hintPass(1); save(); }
      }
    }
    else if(down.what==='scen'){
      const [gx,gy]=down.cell, s=scenAt(gx,gy);
      if(s){
        if(s.t==='ppl'){ s.wave=1.3; SND.yay(); }
        else if(s.t==='rv'){ fx.push({k:'rip',x:GX+gx*C+C/2,y:GY+gy*C+C/2,R:26,t:0,dur:0.5}); SND.bloop(); }
        else if(CHIRP[s.t]){ s.ra={k:1}; s.wave=1.3; SND[CHIRP[s.t]](); }   // animals wiggle AND chirp
        else if(SCENDEF[s.t].knock){ s.ra={k:1}; SND.tok(); }               // a wooden knock for the town
        else { s.ra={k:1}; SND.rustle(); }
      }
    }
    else if(down.what==='pal'){ wiggle(down.el); toast('DRAG IT ONTO THE RUG!'); }
    else if(down.what==='handle'){ toast('DRAG IT ONTO THE TRACK!'); }
  }
  down=null;
});

function withCtx(g,fn){ const old=cx; cx=g; try{ fn(); } finally{ cx=old; } }
function scenIcon(g,t){
  withCtx(g,()=>{
    if(t==='rv'){
      cx.lineCap='round'; cx.lineJoin='round';
      cx.strokeStyle=RIVER_BANK; cx.lineWidth=58;
      cx.beginPath(); cx.moveTo(-2,C/2); cx.lineTo(C+2,C/2); cx.stroke();
      cx.strokeStyle=RIVER_BLUE; cx.lineWidth=46;
      cx.beginPath(); cx.moveTo(-2,C/2); cx.lineTo(C+2,C/2); cx.stroke();
      cx.globalAlpha=0.55; cx.strokeStyle=RIVER_LIGHT; cx.lineWidth=24;
      cx.beginPath(); cx.moveTo(0,C/2); cx.lineTo(C,C/2); cx.stroke(); cx.globalAlpha=1;
      cx.globalAlpha=0.75; cx.strokeStyle=RIVER_GLINT; cx.lineWidth=3; cx.setLineDash([7,21]); cx.lineCap='butt';
      cx.beginPath(); cx.moveTo(4,C/2); cx.lineTo(C-4,C/2); cx.stroke(); cx.setLineDash([]); cx.globalAlpha=1;
    } else {
      const z=IZOOM[t];
      if(z){ cx.translate(C/2,C/2); cx.scale(z,z); cx.translate(-C/2,-C/2); }
      drawScenItem({t,v:t==='ppl'?1:0,ra:null,pop:0,wave:0},0,0,1.2);
    }
  });
}

    const g=cv2.getContext('2d'); g.setTransform(1.45,0,0,1.45,59,41);
    withCtx(g,()=>drawCar('loco',0,0,0,0,0.6,LIVERY[name]));
    b.addEventListener('click',()=>{
      ac();
      if(COLOR===name){ SND.click(); return; }
      COLOR=name; SND.chirp(); liveryChanged(); save();   // the attract train repaints next frame
    });
    sw.appendChild(b);
  }
  syncSwatches();
}
$('goBtn').addEventListener('click',()=>{
  ac();
  if(!TRAIN.placed){ wiggle($('shedBtn')); toast('BUILD YOUR TRAIN IN THE SHED FIRST!'); return; }
  if(TRAIN.running){ TRAIN.running=false; SND.click(); }
  else { goTrain(); SND.whistle(); hintPass(4); }
  goBtnSync(); save();
});
$('shedBtn').addEventListener('click',()=>{ ac(); shedShow(true); });
$('shedX').addEventListener('click',()=>shedShow(false));
$('handle').addEventListener('pointerdown',e=>{
  ac(); e.preventDefault();
  if(TRAIN.placed) return;                    // acts as a button then
  down={x:e.clientX,y:e.clientY,what:'handle'};
});
$('handle').addEventListener('click',()=>{
  if(TRAIN.placed){ trainHome(false); toast('BACK IN THE SHED'); shedSync(); goBtnSync(); save(); }
});
$('consist').addEventListener('click',e=>{
  const el=$('consist'), rect=el.getBoundingClientRect();
  const x=(e.clientX-rect.left)/rect.width*CONW;
  const i=Math.round((x-CON0)/CONSP);
  if(i<=0){ SND.toot(); return; }
  if(i>=1 && i<=consist.length){ consist.splice(i-1,1); SND.pop(); consistChanged(); }
});
$('tidy').addEventListener('click',()=>{ $('tidyAsk').classList.add('on'); $('tidy').classList.add('off'); });
$('tidyNo').addEventListener('click',()=>{ $('tidyAsk').classList.remove('on'); $('tidy').classList.remove('off'); });
$('tidyYes').addEventListener('click',()=>{
  if(CAMP.on) clearPlayer();                 // sweep the kid's line; the glued land stays put
  else { grid.clear(); hgrid.clear(); scen.clear(); trainHome(true); }
  SND.pop(); save();
  $('tidyAsk').classList.remove('on'); $('tidy').classList.remove('off');
  shedShow(false); toast('ALL TIDY!');
});
$('mute').addEventListener('click',()=>{ AU.on=!AU.on; if(AU.on){ ac(); SND.click(); } muteSync(); save(); });

// ---- boot ----
function resize(){
  W=innerWidth; H=innerHeight; DPR=Math.min(2,devicePixelRatio||1);
  BAR=SCREEN==='game'? ($('bar').offsetHeight||118)
     :SCREEN==='play'? ($('ptray').offsetHeight||104)      // the tray is the play mode's whole chrome
     :0;                                                   // the menu room + board get the whole window
  cvs.width=Math.round(W*DPR); cvs.height=Math.round(H*DPR);
  cvs.style.width=W+'px'; cvs.style.height=H+'px';
  SC=Math.min(W/WORLD_W,(H-BAR)/WORLD_H);
  OX=(W-WORLD_W*SC)/2; OY=(H-BAR-WORLD_H*SC)/2;
}
window.addEventListener('resize',resize);
load(); buildPalette(); buildParts(); buildMenu(); buildBoard(); buildTray(); buildAttract();
showScreen('menu'); goBtnSync(); shedSync(); muteSync();
let last=performance.now();
function frame(t){
  const dt=Math.min(0.05,(t-last)/1000); last=t;
  if(TS.auto){
    if(SCREEN==='game') update(dt);
    else if(SCREEN==='play'){ update(dt); playUpdate(dt); }             // the shared juice + the wind-up trains
    else menuUpdate(dt);                                                // the board keeps the bedroom alive behind it
  }
  if(SCREEN==='game'||SCREEN==='play') draw(); else drawMenu();
  requestAnimationFrame(frame);
}

// ---- debug rig (the GVT window.GVT pattern) — drive it headless ----
window.TS={
  auto:true,
  place(t,r,gx,gy){ const q=placeQuery(t,r|0,gx,gy); if(!q.ok) return false;
    setTrackPiece(t,r,null,q.elev,gx,gy); save(); return true; },
  query(t,r,gx,gy){ return placeQuery(t,r|0,gx,gy); },   // {ok,elev,why} — ghost AND drop ask this same fn
  remove(gx,gy,el){
    const pc=el==null? pieceTop(gx,gy) : (el? pieceHi(gx,gy):pieceAt(gx,gy));
    if(!pc||pc.glued) return false;
    if(TRAIN.placed && trainOn(gx,gy,pc)){ if(TRAIN.running) return false; trainHome(true); }
    removeTrackPiece(gx,gy,pc); save(); return true; },
  scen(t,v,gx,gy){ if(!SCENDEF[t]||gx<0||gy<0||gx>=GW||gy>=GH||!canPlaceScen(t,gx,gy)) return false;
    scen.set(key(gx,gy),{t,v:v|0,ra:null,pop:0,wave:0}); save(); return true; },
  unscen(gx,gy){ const ok=scen.delete(key(gx,gy)); if(ok) save(); return ok; },
  toggle(gx,gy,el){ const pc=el==null? pieceTop(gx,gy) : (el? pieceHi(gx,gy):pieceAt(gx,gy));
    if(!pc||pc.t!=='sw') return null;
    if(pc.glued) return false;
    if(TRAIN.placed && (pc.latch || trainOn(gx,gy,pc))) return false;
    pc.sel^=1; save(); return pc.sel; },
  canTrack(t,gx,gy,r){ return placeQuery(t,r|0,gx,gy).ok; },
  canScen(t,gx,gy){ return canPlaceScen(t,gx,gy); },
  clear(){ grid.clear(); hgrid.clear(); scen.clear(); trainHome(true); save(); },
  consist(arr){ consist=(arr||[]).filter(t=>CARDEF[t]).slice(0,MAXCARS); consistChanged(); return consist.slice(); },
  placeTrain(gx,gy,el){ const ok=placeTrainAt(gx,gy,el==null?null:el); goBtnSync(); shedSync(); save(); return ok; },
  go(){ const ok=goTrain(); save(); return ok; },
  stop(){ TRAIN.running=false; goBtnSync(); save(); },
  home(){ trainHome(true); save(); },
  menu(){ showScreen('menu'); return SCREEN; },
  play(){ showScreen('game'); return SCREEN; },
  color(name){ if(!LIVERY[name]) return false; COLOR=name; liveryChanged(); save(); return COLOR; },
  step(dt){ const d=dt||1/60;
    if(SCREEN==='game') update(d);
    else if(SCREEN==='play'){ update(d); playUpdate(d); }
    else menuUpdate(d); },
  xy(gx,gy){ return { x:OX+SC*(GX+gx*C+C/2), y:OY+SC*(GY+gy*C+C/2) }; },   // cell centre in client px (pointer rigs)
  // ---- the wind-up rug rig (E6) ----
  play:{
    enter(){ return playEnter(); },
    exit(){ if(PLAY.on) playExit('menu'); return SCREEN; },
    add(color,speed,cars){ return playAdd(color,speed,cars); },   // speed/cars pinned only by batteries
    count(){ return PLAY.trains.filter(t=>!t.dying).length; },
    get crashes(){ return PLAY.crashes; },
    state(){ return { on:PLAY.on, cap:PLAY_CAP, crashes:PLAY.crashes,
      loopLen:PLAY.loop? PLAY.loop.len:0, respawnT:PLAY.respawnT,
      trains:PLAY.trains.map(tr=>({ id:tr.id, color:tr.color, speed:tr.speed, dying:!!tr.dying,
        pauseT:tr.pauseT, d:loopCoord(tr.cars[0].rd),
        cars:tr.cars.map(c=>[c.rd.cx,c.rd.cy,c.rd.el?1:0]) })) }; },
  },
  // ---- the campaign rig (E5) ----
  camp:{
    winWindow:CAMP_WIN_WINDOW,
    open(){ showScreen('board'); return SCREEN; },
    enter(n){ return campEnter(n); },
    exit(){ campExit('board'); return SCREEN; },
    unlockAll(){ CAMP.all=true; save(); if(SCREEN==='board') boardSync(); return true; },
    reset(){ if(CAMP.on) campExit('board'); CAMP.done.clear(); CAMP.all=false; CAMP.wip=null; save(); boardSync(); return true; },
    // THE SOLVABILITY LAW: build level n's scripted reference solution, ready for GO.
    // Returns {ok:true} or {ok:false,why,at} — a level whose reference stops fitting refuses to ship.
    solve(n){
      if(!(CAMP.on&&CAMP.level===n)){ if(!campEnter(n)) return {ok:false,why:'locked'}; }
      clearPlayer();
      const S=SOLVE[n-1]; if(!S) return {ok:false,why:'no-solution'};
      for(const row of S.rows){
        const [t,r,x,y]=row, q=placeQuery(t,r,x,y);
        if(!q.ok) return {ok:false,why:q.why,at:row};
        setTrackPiece(t,r,null,q.elev,x,y);
      }
      if(!placeTrainAt(S.start[0],S.start[1],0)) return {ok:false,why:'train'};
      goBtnSync(); shedSync(); save();
      return {ok:true};
    },
    state(){ return { on:CAMP.on, level:CAMP.level, won:CAMP.won, all:CAMP.all,
      done:[...CAMP.done].sort((a,b)=>a-b), stations:CAMP.stations.slice(),
      visited:[...CAMP.visited], wip:CAMP.wip? CAMP.wip.level:null, tugToast:CAMP.tugT }; },
  },
  state(){ return { screen:SCREEN, color:COLOR,
    placed:TRAIN.placed, running:TRAIN.running, F:TRAIN.F,
    pieces:[...grid.values()].filter(pc=>pc.t!=='ref').length+hgrid.size,
    track:[...grid].filter(([k,pc])=>pc.t!=='ref').map(([k,pc])=>[k,pc.t,pc.r,pc.elev|0])
      .concat([...hgrid].map(([k,pc])=>[k,pc.t,pc.r,1])),
    consist:consist.slice(), lap:lapDone, hint:hintStage, pauseT:TRAIN.pauseT,
    scenery:scen.size, chirps:chirpN,
    scen:[...scen].map(([k,s])=>[k,s.t,s.v,+(s.wave>0)]),
    sw:[...grid].filter(([k,pc])=>pc.t==='sw').map(([k,pc])=>[k,pc.r,pc.sel,pc.latch?1:0,0])
      .concat([...hgrid].filter(([k,pc])=>pc.t==='sw').map(([k,pc])=>[k,pc.r,pc.sel,pc.latch?1:0,1])),
    camp:{ on:CAMP.on, level:CAMP.level, won:CAMP.won, done:[...CAMP.done].sort((a,b)=>a-b) },
    play:{ on:PLAY.on, count:PLAY.trains.filter(t=>!t.dying).length, crashes:PLAY.crashes },
    at:(()=>{ if(SCREEN==='game') return null;
      RGRID=AT.grid; HGRID=AT.hg; try{ const p=pos(AT.cars[0].rd); return {x:p.x,y:p.y}; } finally{ RGRID=grid; HGRID=hgrid; } })(),
    loco:TRAIN.placed? Object.assign({},TRAIN.cars[0].rd,pos(TRAIN.cars[0].rd)) : null,
    cars:TRAIN.cars.map(c=>{ const p=pos(c.rd); return {t:c.type,cx:c.rd.cx,cy:c.rd.cy,el:c.rd.el?1:0,x:p.x,y:p.y,z:p.z}; }) }; },
  mute(b){ AU.on=!b; muteSync(); },
};
requestAnimationFrame(frame);
</script>
