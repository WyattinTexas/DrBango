<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>&#8203;</title>
<style>
html,body{margin:0;height:100%;background:#fff;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#b{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#0f1115}
body.on{background:#0f1115}body.on #b{display:block}
</style>
</head>
<body>
<iframe id="b" title="" referrerpolicy="no-referrer"></iframe>
<script>
(function(){
  // Wyatt 10/21/2026 23:01 (WhatsApp): "Add it to drbango.com/whiteboard and make it appear like a blank page. But upon tapping
  // 3 times it shows the current board." Three taps inside 1.6 s anywhere on the page show the live board (the copy the Big Mac
  // pushes to the game box every 30 s; it refreshes itself); three taps again hide it. Nothing is remembered between visits.
  var SRC='https://nationgame.live/wb-61l3uy7dff2shtym/', taps=[], f=document.getElementById('b');
  function tap(e){
    var now=Date.now(); taps=taps.filter(function(t){return now-t<1600}); taps.push(now);
    if(taps.length>=3){ taps=[]; toggle(); }
  }
  function toggle(){
    var on=document.body.classList.toggle('on');
    if(on){ f.src=SRC+'?t='+now8(); } else { f.src='about:blank'; }
  }
  function now8(){ return String(Math.floor(Date.now()/30000)); }
  var cover=document.createElement('div'); cover.style.cssText='position:fixed;inset:0;z-index:2';
  // the cover takes the taps while the board is hidden; while it shows, the board's own page takes the touches, so the
  // hide gesture is three taps on the thin bar at the very top (above the board's title)
  cover.addEventListener('pointerdown',tap);
  document.body.appendChild(cover);
  var bar=document.createElement('div'); bar.style.cssText='position:fixed;top:0;left:0;right:0;height:14px;z-index:3';
  bar.addEventListener('pointerdown',tap);
  document.body.appendChild(bar);
  f.addEventListener('load',function(){ /* keep the cover under the board while it shows */ cover.style.display=document.body.classList.contains('on')?'none':''; });
  new MutationObserver(function(){ cover.style.display=document.body.classList.contains('on')?'none':''; }).observe(document.body,{attributes:true,attributeFilter:['class']});
})();
</script>
</body>
</html>
