<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Battle of Origins — Hype Ad</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --player:#4fc3f7;--enemy:#ef5350;--gold:#ffd54f;--dark:#0a0a14;
  --purple:#7c3aed;--purple-dark:#4c1d95;--green:#22c55e;
  --panel:rgba(10,10,20,0.85);
}
html,body{height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',system-ui,sans-serif;color:#fff;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-font-smoothing:antialiased;}

.app{position:relative;width:100%;max-width:430px;height:100%;margin:0 auto;overflow:hidden;}
.battle-screen{position:relative;width:100%;height:100%;display:flex;flex-direction:column;}

/* ── ARENA BACKGROUND ── */
.arena-bg{position:absolute;inset:0;z-index:0;
  background:
    radial-gradient(ellipse at 50% 45%, rgba(60,90,60,0.5) 0%, transparent 60%),
    linear-gradient(180deg, #2a4a3a 0%, #3a5a3a 25%, #4a6a4a 40%, #3a5a3a 60%, #1a2a1a 100%);}
.arena-bg::before{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 45%, transparent 40%, rgba(0,0,0,0.5) 100%);pointer-events:none;}
.arena-bg::after{content:'';position:absolute;top:0;left:0;right:0;height:25%;
  background:linear-gradient(180deg,rgba(70,120,170,0.3) 0%,transparent 100%);opacity:.5;}

/* ── DAMAGE FLASH ── */
.damage-flash{position:absolute;inset:0;z-index:90;pointer-events:none;opacity:0;transition:opacity .15s;}
.damage-flash.player-hit{background:radial-gradient(ellipse at 50% 80%,rgba(239,83,80,.4),transparent);opacity:1;}
.damage-flash.enemy-hit{background:radial-gradient(ellipse at 50% 20%,rgba(79,195,247,.4),transparent);opacity:1;}

/* ── SCREEN SHAKE ── */
.battle-screen.shake{animation:screenShake .3s ease-in-out;}
@keyframes screenShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* ══════════════════════════════════════
   HP PLATE UI — character-specific plates with baked-in portraits
   ══════════════════════════════════════ */
.hp-plate{position:relative;z-index:10;height:80px;}
.hp-plate-img{position:absolute;height:80px;width:auto;pointer-events:none;}

/* Player plate: left-aligned, portrait baked in on LEFT side */
.player-plate .hp-plate-img{left:-5px;top:0;}
.player-plate .hp-name{position:absolute;font-family:'Bangers',cursive;font-size:15px;letter-spacing:2px;
  color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);z-index:3;white-space:nowrap;left:72px;top:22px;}
.player-plate .hp-bar-track{position:absolute;height:10px;border-radius:3px;overflow:hidden;
  background:rgba(0,0,0,.3);z-index:3;left:68px;top:50px;width:95px;}
.player-plate .hp-text{position:absolute;font-family:'Bangers',cursive;font-size:12px;color:#fff;
  text-shadow:0 1px 2px #000;z-index:4;letter-spacing:1px;left:96px;top:47px;}

/* Enemy plate: right-aligned, portrait baked in on RIGHT side (Kodako plate is already oriented this way) */
.enemy-plate .hp-plate-img{right:-5px;top:0;}
.enemy-plate .hp-name{position:absolute;font-family:'Bangers',cursive;font-size:15px;letter-spacing:2px;
  color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);z-index:3;white-space:nowrap;right:72px;top:22px;text-align:right;}
.enemy-plate .hp-bar-track{position:absolute;height:10px;border-radius:3px;overflow:hidden;
  background:rgba(0,0,0,.3);z-index:3;right:68px;top:50px;width:95px;}
.enemy-plate .hp-text{position:absolute;font-family:'Bangers',cursive;font-size:12px;color:#fff;
  text-shadow:0 1px 2px #000;z-index:4;letter-spacing:1px;right:96px;top:47px;text-align:right;}

/* HP fill bar */
.hp-bar-fill{height:100%;border-radius:3px;transition:width .5s ease;position:relative;
  background:linear-gradient(90deg,#22c55e,#4ade80);}
.hp-bar-fill::after{content:'';position:absolute;top:0;left:0;right:0;height:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.25),transparent);border-radius:3px 3px 0 0;}
.hp-bar-fill.low{background:linear-gradient(90deg,#dc2626,#f87171);animation:hpPulse 1.5s ease-in-out infinite;}
.hp-bar-fill.mid{background:linear-gradient(90deg,#eab308,#facc15);}
@keyframes hpPulse{0%,100%{box-shadow:0 0 4px rgba(239,68,68,.4)}50%{box-shadow:0 0 12px rgba(239,68,68,.8)}}

/* ══════════════════════════════════════
   DICE ARENA (center) + ARENA SPRITES
   ══════════════════════════════════════ */
.dice-arena{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;z-index:5;min-height:0;gap:4px;}

/* Arena sprites — absolutely positioned, draggable in dev mode */
.arena-sprite{position:absolute;height:100px;width:auto;z-index:3;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.6));transition:filter .3s;}
.arena-sprite.active{height:125px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6)) drop-shadow(0 0 10px rgba(79,195,247,.5));}
.arena-sprite.dead{opacity:.25;filter:grayscale(1) drop-shadow(0 4px 8px rgba(0,0,0,.5));}
.arena-sprite.enemy-sprite{height:112px;}
.arena-sprite:hover{z-index:50;cursor:grab;}
.arena-sprite.dragging{cursor:grabbing;z-index:99;filter:drop-shadow(0 0 15px rgba(255,213,79,.8))!important;}

/* Dev toolbar */
.dev-bar{position:fixed;top:4px;right:4px;z-index:200;display:flex;gap:4px;}
.dev-bar button{padding:4px 10px;font-size:11px;background:#7c3aed;color:#fff;border:none;border-radius:4px;cursor:pointer;}
.dev-bar button:hover{background:#9333ea;}
.dev-bar pre{background:#000;color:#0f0;font-size:9px;padding:4px;border-radius:4px;max-width:200px;
  max-height:120px;overflow:auto;display:none;white-space:pre-wrap;}

.vs-text{font-family:'Bangers',cursive;font-size:64px;color:#fff;opacity:.15;
  text-shadow:0 0 20px rgba(255,255,255,.2);line-height:1;letter-spacing:4px;
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1;}

/* ══════════════════════════════════════
   3D DICE SYSTEM (ported from battle-dice-3d.js)
   ══════════════════════════════════════ */
#dice3d-arena{position:absolute;top:12%;left:5%;width:90%;height:48%;z-index:20;pointer-events:none;overflow:hidden;}
.die-physics{position:absolute;z-index:10;perspective:350px;pointer-events:none;}
.die-cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;}
.die-face{position:absolute;width:100%;height:100%;border-radius:11px;box-sizing:border-box;
  backface-visibility:hidden;
  background:linear-gradient(165deg,#f4ecd8 0%,#e8dcb8 35%,#d8c894 70%,#b8a878 100%);
  border:1px solid rgba(120,80,30,0.5);
  box-shadow:inset 0 -2px 4px rgba(120,80,30,0.25),inset 0 1px 2px rgba(255,255,240,0.5);}
.die-face.face-red{border-color:rgba(233,69,96,0.55);
  background:linear-gradient(165deg,#fce0d8 0%,#f4b8a8 35%,#d88878 70%,#a05050 100%);}
.die-face.face-blue{border-color:rgba(76,201,240,0.55);
  background:linear-gradient(165deg,#dcf0fc 0%,#a8d8ee 35%,#78a0c4 70%,#406088 100%);}
.face-front{transform:translateZ(var(--dh,28px));}
.face-back{transform:rotateY(180deg) translateZ(var(--dh,28px));}
.face-right{transform:rotateY(90deg) translateZ(var(--dh,28px));}
.face-left{transform:rotateY(-90deg) translateZ(var(--dh,28px));}
.face-top{transform:rotateX(-90deg) translateZ(var(--dh,28px));}
.face-bottom{transform:rotateX(90deg) translateZ(var(--dh,28px));}
.pip3d{position:absolute;width:9px;height:9px;border-radius:50%;background:#3a1f08;
  box-shadow:inset 0 1px 1px rgba(255,255,255,0.25),0 1px 2px rgba(0,0,0,0.3);}
.face-red .pip3d{background:#4a0e1a;}.face-blue .pip3d{background:#0a3050;}
.die-physics.settling .die-cube{transition:transform 0.35s cubic-bezier(0.25,0.1,0.25,1);}
.die-physics.settling{transition:left 0.7s cubic-bezier(0.25,1.1,0.5,1),top 0.7s cubic-bezier(0.25,1.1,0.5,1);}
.die-physics::after{content:'';position:absolute;bottom:-6px;left:8%;width:84%;height:10px;
  background:radial-gradient(ellipse,rgba(0,0,0,0.35),transparent 70%);border-radius:50%;pointer-events:none;}
/* Win highlights */
.die-physics.die-win-singles-3d{transform:scale(1.12);
  filter:drop-shadow(0 0 12px rgba(255,200,60,0.8)) drop-shadow(0 0 24px rgba(255,175,35,0.4));
  animation:dieWin3dPulse 1.3s ease-in-out infinite;}
.die-physics.die-win-singles-3d .die-face{border-color:#ffc83a!important;
  background:linear-gradient(165deg,#fff6cc 0%,#ffe27a 35%,#ffc83a 70%,#d79418 100%)!important;}
.die-physics.die-win-singles-3d .pip3d{background:#5a2a08!important;}
.die-physics.die-win-doubles-3d{transform:scale(1.18);
  filter:drop-shadow(0 0 16px rgba(255,205,70,0.95)) drop-shadow(0 0 36px rgba(255,180,45,0.55));
  animation:dieWin3dPulse 1.15s ease-in-out infinite;}
.die-physics.die-win-doubles-3d .die-face{border-color:#ffd448!important;
  background:linear-gradient(165deg,#fff6cc 0%,#ffe27a 35%,#ffc83a 70%,#d79418 100%)!important;}
.die-physics.die-win-doubles-3d .pip3d{background:#5a2a08!important;}
.die-physics.die-win-triples-3d{transform:scale(1.24);
  filter:drop-shadow(0 0 20px rgba(255,210,80,1)) drop-shadow(0 0 48px rgba(255,185,50,0.65));
  animation:dieWin3dTriples 0.95s ease-in-out infinite;}
.die-physics.die-win-triples-3d .die-face{border-color:#fff3a0!important;
  background:linear-gradient(165deg,#fffadd 0%,#fff08a 30%,#ffd448 65%,#e39918 100%)!important;}
.die-physics.die-win-triples-3d .pip3d{background:#4a1d02!important;}
.die-physics.die-loser-3d{opacity:0.42;transform:scale(0.92);filter:brightness(0.65) saturate(0.6);
  transition:opacity 0.4s,transform 0.4s,filter 0.4s;}
@keyframes dieWin3dPulse{
  0%,100%{filter:drop-shadow(0 0 12px rgba(255,200,60,0.8)) drop-shadow(0 0 24px rgba(255,175,35,0.4));}
  50%{filter:drop-shadow(0 0 18px rgba(255,210,80,1)) drop-shadow(0 0 36px rgba(255,185,50,0.6));}}
@keyframes dieWin3dTriples{
  0%,100%{filter:drop-shadow(0 0 20px rgba(255,210,80,1)) drop-shadow(0 0 48px rgba(255,185,50,0.65));}
  50%{filter:drop-shadow(0 0 28px rgba(255,220,100,1)) drop-shadow(0 0 60px rgba(255,195,60,0.8));}}

/* ── ROLL RESULT ── */
.roll-result{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;
  font-family:'Bangers',cursive;font-size:18px;letter-spacing:1px;padding:6px 18px;border-radius:20px;
  pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap;}
.roll-result.visible{opacity:1;}
.roll-result.win{background:rgba(34,197,94,.2);color:var(--green);border:1px solid var(--green);}
.roll-result.lose{background:rgba(239,83,80,.2);color:var(--enemy);border:1px solid var(--enemy);}
.roll-result.tie{background:rgba(255,255,255,.1);color:#aaa;border:1px solid rgba(255,255,255,.2);}

/* ── ABILITY POPUP ── */
.ability-popup{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.5);z-index:35;
  background:rgba(0,0,0,.85);border:2px solid var(--gold);border-radius:12px;padding:10px 24px;
  text-align:center;pointer-events:none;opacity:0;transition:all .2s;backdrop-filter:blur(4px);}
.ability-popup.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
.ability-popup .ab-name{font-family:'Bangers',cursive;font-size:18px;color:var(--gold);letter-spacing:1px;}
.ability-popup .ab-desc{font-size:11px;color:#ccc;margin-top:3px;}

/* ── FLOATING DAMAGE ── */
.float-dmg{position:absolute;z-index:40;font-family:'Bangers',cursive;font-size:36px;
  pointer-events:none;animation:floatUp .9s ease-out forwards;text-shadow:0 2px 4px rgba(0,0,0,.6);}
.float-dmg.player-dealt{color:var(--player);right:20%;top:25%;}
.float-dmg.enemy-dealt{color:var(--enemy);left:20%;bottom:35%;}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-50px) scale(1.3)}}

/* ══════════════════════════════════════
   BOTTOM AREA
   ══════════════════════════════════════ */
.bottom-area{position:relative;z-index:10;padding:0 0 6px;
  background:linear-gradient(transparent,rgba(0,0,0,.4) 30%,rgba(0,0,0,.6));}

.narrator-bar{background:rgba(0,0,0,.7);border-radius:8px;padding:8px 12px;margin:6px 10px;
  font-size:13px;color:#ccc;text-align:center;min-height:32px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,.05);backdrop-filter:blur(4px);}
.narrator-bar b{color:var(--gold);padding:0 2px;}

/* Team row — small card previews + roll button */
.team-row{display:flex;align-items:center;gap:8px;padding:4px 10px 8px;}
.team-cards{display:flex;gap:6px;flex:1;}
.team-card{width:0;flex:1;aspect-ratio:2.5/3.5;border-radius:8px;overflow:hidden;
  border:2px solid rgba(255,255,255,.12);position:relative;object-fit:cover;
  box-shadow:0 2px 8px rgba(0,0,0,.3);transition:all .25s;}
.team-card.active{border-color:var(--player);box-shadow:0 0 12px rgba(79,195,247,.3);}
.team-card.dead{opacity:.3;filter:grayscale(1);}

.roll-btn{width:56px;height:56px;border-radius:50%;border:3px solid var(--purple);
  background:linear-gradient(135deg,var(--purple-dark),var(--purple));
  color:#fff;font-size:24px;cursor:pointer;flex-shrink:0;
  box-shadow:0 0 20px rgba(124,58,237,.4);transition:all .2s;
  display:flex;align-items:center;justify-content:center;}
.roll-btn:active{transform:scale(.9);}
.roll-btn:disabled{opacity:.3;pointer-events:none;box-shadow:none;}
.roll-btn .play-icon{width:0;height:0;border-left:16px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:3px;}
@keyframes btnPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.roll-btn:not(:disabled){animation:btnPulse 1.2s ease-in-out infinite;}

/* ── GAME OVER ── */
.game-over{position:absolute;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
  flex-direction:column;text-align:center;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);padding:32px;}
.game-over.show{display:flex;}
.game-over .result{font-family:'Bangers',cursive;font-size:42px;letter-spacing:3px;margin-bottom:12px;}
.game-over .result.win{color:var(--gold);text-shadow:0 0 20px rgba(255,213,79,.4);}
.game-over .result.lose{color:var(--enemy);text-shadow:0 0 20px rgba(239,83,80,.4);}
.game-over .sub{font-size:14px;color:#aaa;max-width:280px;line-height:1.5;margin-bottom:28px;}
.game-over .replay-btn{font-family:'Bangers',cursive;font-size:20px;padding:12px 36px;border:none;border-radius:50px;
  cursor:pointer;background:linear-gradient(135deg,var(--purple),#9333ea);color:#fff;
  box-shadow:0 0 30px rgba(124,58,237,.5);letter-spacing:1px;}
.game-over .replay-btn:active{transform:scale(.95);}
</style>
</head>
<body>
<div class="dev-bar">
  <button onclick="exportPositions()">Export Positions</button>
  <pre id="devOutput"></pre>
</div>
<div class="app">
  <div class="battle-screen" id="battleScreen">
    <div class="arena-bg"></div>
    <div class="damage-flash" id="damageFlash"></div>

    <!-- Enemy HP Plate (top) -->
    <div class="top-hud">
      <div class="hp-plate enemy-plate">
        <img class="hp-plate-img" id="enemyPlateImg" src="assets/Kodaku_Health_UI.png" alt="">
        <div class="hp-name" id="enemyName"></div>
        <div class="hp-bar-track"><div class="hp-bar-fill" id="enemyHpFill" style="width:100%"></div></div>
        <div class="hp-text" id="enemyHpText"></div>
      </div>
    </div>

    <!-- Dice Arena -->
    <div class="dice-arena">
      <!-- VS removed -->

      <div class="roll-result" id="rollResult"></div>
    </div>
    <!-- 3D Dice Overlay -->
    <div id="dice3d-arena"></div>

    <!-- Arena Sprites (absolute, draggable) -->
    <div id="spriteLayer" style="position:absolute;inset:0;z-index:15;pointer-events:none;">
      <!-- sprites injected by JS -->
    </div>

    <div class="ability-popup" id="abilityPopup">
      <div class="ab-name" id="abName"></div>
      <div class="ab-desc" id="abDesc"></div>
    </div>

    <!-- Bottom Area -->
    <div class="bottom-area">
      <div class="hp-plate player-plate">
        <img class="hp-plate-img" id="playerPlateImg" src="assets/hp_ui.png" alt="">
        <div class="hp-name" id="playerName"></div>
        <div class="hp-bar-track"><div class="hp-bar-fill" id="playerHpFill" style="width:100%"></div></div>
        <div class="hp-text" id="playerHpText"></div>
      </div>
      <div class="narrator-bar" id="narrator">Tap <b>ROLL</b> to begin!</div>
      <div class="team-row">
        <div class="team-cards" id="teamCards"></div>
        <button class="roll-btn" id="rollBtn" onclick="doRoll()"><div class="play-icon"></div></button>
      </div>
    </div>

    <div class="game-over" id="gameOver">
      <div class="result" id="goResult"></div>
      <div class="sub" id="goSub"></div>
      <button class="replay-btn" onclick="restart()">PLAY AGAIN</button>
    </div>
  </div>
</div>

<script>
const IMG = '../tierlist/cards/';
const SFX_PATH = '../boo/';

// ── AUDIO ──
const sfx={roll:new Audio(SFX_PATH+'DiceRoll.mp3'),dmg1:new Audio(SFX_PATH+'1Damage.mp3'),
  dmg2:new Audio(SFX_PATH+'2Damage.mp3'),dmg3:new Audio(SFX_PATH+'3Damage.mp3'),
  special:new Audio(SFX_PATH+'Special.mp3'),triples:new Audio(SFX_PATH+'triples.mp3'),
  win:new Audio(SFX_PATH+'winningwhistle.mp3')};
Object.values(sfx).forEach(a=>{a.volume=0.5;a.preload='auto';});
function playSound(k){const s=sfx[k];if(!s)return;s.currentTime=0;s.play().catch(()=>{});}

// ── SPIRITKIN DATA ──
// Team: Gary, Shoo, Scallywags. Opponent: Kodako. Boss: Mountain King or Lucy.
const ALL_GHOSTS=[
  {name:"Gary",file:"gary.jpg",card:"assets/card_Gary.png",maxHp:6,ability:"Swarm",abilityDesc:"Before rolling, enemy takes 1 damage.",back:"assets/Back_Gary.png",plateImg:"assets/hp_ui.png"},
  {name:"Shoo",file:"shoo.jpg",card:"assets/card_Shoo.png",maxHp:5,ability:"Alpine Aura",abilityDesc:"Heal 1 HP after each roll.",back:"assets/Back_Shoo.png",plateImg:"assets/hp_ui.png"},
  {name:"Scallywags",file:"scallywags.jpg",card:"assets/card_Scallywags.png",maxHp:5,ability:"Plunder",abilityDesc:"Doubles steal 1 HP.",back:"assets/Back_Scallywags.png",plateImg:"assets/hp_ui.png"},
  {name:"Kodako",file:"kodako.jpg",maxHp:6,ability:"Swift",abilityDesc:"Roll 1-2-3: negate damage and deal 4.",front:"assets/Front_Kodako.png",plateImg:"assets/Kodaku_Health_UI.png"},
  {name:"The Mountain King",file:"mountain_king_leg.jpg",maxHp:9,ability:"Beast Mode",abilityDesc:"Doubles deal 2X damage.",front:"assets/Front_Kodako.png",plateImg:"assets/Kodaku_Health_UI.png"},
  {name:"Lucy",file:"lucy.jpg",maxHp:8,ability:"Blue Fire",abilityDesc:"Win a roll: +1 bonus damage.",front:"assets/Front_Kodako.png",plateImg:"assets/Kodaku_Health_UI.png"},
];

const PLAYER_TEAM=ALL_GHOSTS.filter(g=>["Gary","Shoo","Scallywags"].includes(g.name));
const OPPONENTS=ALL_GHOSTS.filter(g=>["Kodako"].includes(g.name));
const BOSSES=ALL_GHOSTS.filter(g=>["The Mountain King","Lucy"].includes(g.name));

// ── DICE ENGINE ──
function rollDice(n){const d=[];for(let i=0;i<n;i++)d.push(Math.floor(Math.random()*6)+1);return d;}
function analyzeRoll(dice){
  const sorted=[...dice].sort((a,b)=>b-a);const counts={};
  dice.forEach(d=>counts[d]=(counts[d]||0)+1);
  const maxCount=Math.max(...Object.values(counts));
  const matchVal=+Object.keys(counts).find(k=>counts[k]===maxCount);
  if(maxCount>=3)return{type:'triples',value:matchVal,damage:3,dice:sorted,matchDie:matchVal};
  if(maxCount===2){const pairVal=+Object.keys(counts).find(k=>counts[k]===2);
    const kicker=sorted.find(d=>d!==pairVal)||pairVal;
    return{type:'doubles',value:pairVal,kicker,damage:2,dice:sorted,matchDie:pairVal};}
  return{type:'singles',value:sorted[0],damage:1,dice:sorted,matchDie:null};
}
function compareRolls(pRoll,eRoll){
  const rank={singles:0,doubles:1,triples:2};
  if(state.player?.ability==='Protector'&&pRoll.type==='singles'&&eRoll.type==='doubles')return 1;
  if(state.enemy?.ability==='Protector'&&eRoll.type==='singles'&&pRoll.type==='doubles')return-1;
  const pR=rank[pRoll.type]??0,eR=rank[eRoll.type]??0;
  if(pR!==eR)return pR>eR?1:-1;
  if(pRoll.type==='triples')return pRoll.value>eRoll.value?1:pRoll.value<eRoll.value?-1:0;
  if(pRoll.type==='doubles'){if(pRoll.value!==eRoll.value)return pRoll.value>eRoll.value?1:-1;
    return(pRoll.kicker||0)>(eRoll.kicker||0)?1:(pRoll.kicker||0)<(eRoll.kicker||0)?-1:0;}
  for(let i=0;i<Math.max(pRoll.dice.length,eRoll.dice.length);i++){
    if((pRoll.dice[i]||0)>(eRoll.dice[i]||0))return 1;if((pRoll.dice[i]||0)<(eRoll.dice[i]||0))return-1;}
  return 0;
}
function typeLabel(t){return{triples:'TRIPLES!',doubles:'Doubles',singles:'Singles'}[t]||t;}

// ── ABILITY ENGINE ──
function applyAbilities(winner,loser,roll,baseDmg){
  let damage=baseDmg,effects=[];
  switch(winner.ability){
    case'Protector':if(roll.type==='singles'){damage+=1;effects.push({name:'Protector',desc:'+1 damage on singles!'});}break;
    case'One-two-one!':if(roll.type==='doubles'&&roll.value===1){damage*=3;effects.push({name:'One-two-one!',desc:'3X DAMAGE!'});}break;
    case'Slash':if(roll.dice.every(d=>d%2===1)){damage+=5;effects.push({name:'Slash',desc:'All odd! +5 damage!'});}break;
    case'Ambush':if(state.firstRoll){damage*=3;effects.push({name:'Ambush',desc:'First strike! 3X damage!'});}break;
    case'Swift':if(roll.dice.length>=3&&[1,2,3].every(n=>roll.dice.includes(n))){damage=4;effects.push({name:'Swift',desc:'1-2-3! Deal 4!'});}break;
    case'Blue Fire':damage+=1;effects.push({name:'Blue Fire',desc:'+1 bonus damage!'});break;
    case'Beast Mode':if(roll.type==='doubles'){damage*=2;effects.push({name:'Beast Mode',desc:'2X DAMAGE!'});}break;
    case'Snowball':if(roll.type==='doubles'){damage+=2;effects.push({name:'Snowball',desc:'Doubles +2!'});}break;
    case'Plunder':if(roll.type==='doubles'){damage+=1;effects.push({name:'Plunder',desc:'Steal 1 HP!'});}break;
  }
  return{damage,effects};
}
function applyDefense(defender,damage,attackRoll){
  if(defender.ability==='Stoic'){const hp=state.player===defender?state.playerHp:state.enemyHp;
    if(hp<6&&attackRoll.type==='singles')return{damage:0,blocked:true};}
  if(defender.ability==='Stone Form'&&attackRoll.type==='singles')return{damage:-3,blocked:false,counter:true};
  return{damage,blocked:false};
}

// ══════════════════════════════════════════════════════════════
// 3D DICE SYSTEM (ported from battle-dice-3d.js)
// ══════════════════════════════════════════════════════════════
const Dice3D = (function(){
  const PIP_LAYOUTS={1:['c'],2:['tr','bl'],3:['tr','c','bl'],4:['tl','tr','bl','br'],5:['tl','tr','c','bl','br'],6:['tl','ml','bl','tr','mr','br']};
  const PIP_STYLES={tl:'top:18%;left:18%',tr:'top:18%;right:18%',ml:'top:50%;left:18%;transform:translateY(-50%)',
    c:'top:50%;left:50%;transform:translate(-50%,-50%)',mr:'top:50%;right:18%;transform:translateY(-50%)',
    bl:'bottom:18%;left:18%',br:'bottom:18%;right:18%'};
  const FACE_TARGET={1:{rx:0,ry:0},2:{rx:0,ry:-90},3:{rx:90,ry:0},4:{rx:-90,ry:0},5:{rx:0,ry:90},6:{rx:0,ry:180}};

  function nearestSnap(cur,tgt){return tgt+Math.round((cur-tgt)/360)*360;}
  function pip3dHTML(val){return(PIP_LAYOUTS[val]||PIP_LAYOUTS[1]).map(p=>`<span class="pip3d" style="${PIP_STYLES[p]}"></span>`).join('');}
  function cube3dHTML(team){const c='face-'+team;
    return[['front',1],['back',6],['right',2],['left',5],['top',3],['bottom',4]]
      .map(([f,v])=>`<div class="die-face ${c} face-${f}">${pip3dHTML(v)}</div>`).join('');}

  const THROW_PROFILES=[
    (i,n)=>{const t=n>1?i/(n-1):0.5;return{vx:13+t*15,vy:-(25-t*20)};},
    (i,n)=>{const t=n>1?i/(n-1):0.5;return{vx:10+t*14,vy:-(20+t*4)};},
    (i,n)=>{const t=n>1?i/(n-1):0.5;return{vx:24+t*6,vy:-(8+t*10)};},
    (i,n)=>{const t=n>1?i/(n-1):0.5;return{vx:28-t*18,vy:-(10+t*12)};},
    (i,n)=>{const a=[0.15,0.55,0.85,0.35,0.7][i%5];return{vx:14+a*14,vy:-(6+(1-a)*20)};},
    (i,n)=>{const t=n>1?i/(n-1):0.5;return{vx:7+t*5,vy:-(9+t*3)};},
  ];
  function pickThrowProfile(count){
    const profile=THROW_PROFILES[Math.floor(Math.random()*THROW_PROFILES.length)];
    const noise=()=>1+(Math.random()-0.5)*0.25;
    return Array.from({length:count},(_,i)=>{const v=profile(i,count);return{vx:v.vx*noise()*1.15,vy:v.vy*noise()*1.15};});
  }
  function getBounceCoeff(d){return Math.max(0.3,0.65*Math.pow(0.8,d.bounceCount));}
  function getSurfaceFriction(s){return s>8?0.982:s>3?0.965:0.935;}
  function getRotFriction(s){return s>8?0.972:s>3?0.950:0.920;}

  let _physics={};
  function getArena(){return document.getElementById('dice3d-arena');}

  function showRolling(team,count){
    const arena=getArena();if(!arena||count===0)return;
    if(_physics[team]){cancelAnimationFrame(_physics[team].raf);_physics[team].els.forEach(e=>e.remove());}
    const W=arena.offsetWidth,H=arena.offsetHeight,dieSize=56,half=dieSize/2,pad=10;
    const minX=pad,maxX=W-pad-dieSize,minY=pad,maxY=H-pad-dieSize;
    const isRed=team==='enemy';
    const handX=isRed?maxX-10:minX+10,handY=isRed?minY+5:maxY-5;
    const throwVecs=pickThrowProfile(count);
    const dice=[],els=[];
    for(let i=0;i<count;i++){
      const die=document.createElement('div');die.className='die-physics';
      die.style.width=dieSize+'px';die.style.height=dieSize+'px';die.style.zIndex='100';
      die.style.setProperty('--dh',half+'px');
      die.innerHTML=`<div class="die-cube">${cube3dHTML(isRed?'red':'blue')}</div>`;
      arena.appendChild(die);els.push(die);
      const tv=throwVecs[i];
      dice.push({el:die,cube:die.querySelector('.die-cube'),
        x:handX+(Math.random()-0.5)*6,y:handY+(Math.random()-0.5)*6,
        vx:(isRed?-1:1)*tv.vx,vy:isRed?Math.abs(tv.vy):-Math.abs(tv.vy),
        rx:Math.random()*720,ry:Math.random()*720,rz:Math.random()*360,
        vrx:(Math.random()-0.5)*55,vry:(Math.random()-0.5)*55,vrz:(Math.random()-0.5)*40,
        bounceCount:0,value:0});
    }
    function step(){
      for(let a=0;a<dice.length;a++)for(let b=a+1;b<dice.length;b++){
        const da=dice[a],db=dice[b],dx=da.x-db.x,dy=da.y-db.y,dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<dieSize&&dist>0.1){const push=(dieSize-dist)*0.15,nx=dx/dist,ny=dy/dist;
          da.vx+=nx*push;da.vy+=ny*push;db.vx-=nx*push;db.vy-=ny*push;}}
      dice.forEach(d=>{
        d.x+=d.vx;d.y+=d.vy;d.rx+=d.vrx;d.ry+=d.vry;d.rz+=d.vrz;
        const speed=Math.abs(d.vx)+Math.abs(d.vy);const bc=getBounceCoeff(d);
        if(d.x<minX){d.x=minX;d.vx=Math.abs(d.vx)*bc;d.vry*=1.4;d.vrz*=1.3;d.bounceCount++;}
        if(d.x>maxX){d.x=maxX;d.vx=-Math.abs(d.vx)*bc;d.vry*=1.4;d.vrz*=1.3;d.bounceCount++;}
        if(d.y<minY){d.y=minY;d.vy=Math.abs(d.vy)*bc;d.vrx*=1.4;d.vrz*=1.3;d.bounceCount++;}
        if(d.y>maxY){d.y=maxY;d.vy=-Math.abs(d.vy)*bc;d.vrx*=1.4;d.vrz*=1.3;d.bounceCount++;}
        const fric=getSurfaceFriction(speed),rFric=getRotFriction(speed);
        d.vx*=fric;d.vy*=fric;d.vrx*=rFric;d.vry*=rFric;d.vrz*=rFric;
        if(speed<6){const str=0.08*(1-speed/6);
          d.rx+=(Math.round(d.rx/90)*90-d.rx)*str;d.ry+=(Math.round(d.ry/90)*90-d.ry)*str;d.rz+=(Math.round(d.rz/90)*90-d.rz)*str;}
        d.el.style.left=d.x+'px';d.el.style.top=d.y+'px';
        d.cube.style.transform=`rotateX(${d.rx}deg) rotateY(${d.ry}deg) rotateZ(${d.rz}deg)`;
      });
      _physics[team].raf=requestAnimationFrame(step);
    }
    _physics[team]={raf:requestAnimationFrame(step),dice,els,settled:false,values:[]};
  }

  function revealDice(team,values,onComplete){
    const physics=_physics[team];if(!physics||!physics.dice.length){if(onComplete)onComplete();return;}
    cancelAnimationFrame(physics.raf);
    const arena=getArena(),W=arena.offsetWidth,H=arena.offsetHeight,dieSize=56,gap=16;
    const isRed=team==='enemy';
    const totalW=values.length*dieSize+(values.length-1)*gap;
    const centerX=isRed?W*0.5:W*0.5;
    const startX=centerX-totalW/2;
    const trayY=isRed?H*0.35-15:H*0.65-14;
    values.forEach((v,i)=>{const d=physics.dice[i];if(!d)return;
      const tx=startX+i*(dieSize+gap),ty=trayY;
      const tgt=FACE_TARGET[v],frx=nearestSnap(d.rx,tgt.rx),fry=nearestSnap(d.ry,tgt.ry),frz=nearestSnap(d.rz,0);
      d.rx=frx;d.ry=fry;d.rz=frz;d.value=v;
      setTimeout(()=>{d.el.classList.add('settling');d.el.style.left=tx+'px';d.el.style.top=ty+'px';
        d.cube.style.transform=`rotateX(${frx}deg) rotateY(${fry}deg) rotateZ(${frz}deg)`;},i*80);
    });
    setTimeout(()=>{physics.settled=true;physics.values=values;
      physics.els.forEach(e=>e.style.zIndex='10');if(onComplete)onComplete();},values.length*80+750);
  }

  function highlightWin(team,rollResult){
    const physics=_physics[team];if(!physics||!physics.settled)return;
    const type=rollResult.type,value=rollResult.value;
    physics.dice.forEach(d=>{d.el.className='die-physics settling';
      if(d.value===value){
        if(type==='singles')d.el.classList.add('die-win-singles-3d');
        else if(type==='doubles')d.el.classList.add('die-win-doubles-3d');
        else d.el.classList.add('die-win-triples-3d');}});}

  function highlightLose(team){
    const physics=_physics[team];if(!physics||!physics.settled)return;
    physics.dice.forEach(d=>d.el.classList.add('die-loser-3d'));}

  function clear(team){if(_physics[team]){cancelAnimationFrame(_physics[team].raf);
    _physics[team].els.forEach(e=>e.remove());delete _physics[team];}}

  return{showRolling,revealDice,highlightWin,highlightLose,clear};
})();

// ── DRAG SYSTEM (dev tool) ──
function makeDraggable(el) {
  let startX, startY, origX, origY, dragging = false;

  function onDown(e) {
    e.preventDefault();
    e.stopPropagation();
    dragging = true;
    el.classList.add('dragging');
    origX = parseFloat(el.style.left);
    origY = parseFloat(el.style.top);
    const pt = e.touches ? e.touches[0] : e;
    startX = pt.clientX;
    startY = pt.clientY;
    document.addEventListener('mousemove', onMove, { passive: false });
    document.addEventListener('mouseup', onUp);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onUp);
  }

  function onMove(e) {
    if (!dragging) return;
    e.preventDefault();
    const pt = e.touches ? e.touches[0] : e;
    const dx = pt.clientX - startX;
    const dy = pt.clientY - startY;
    const appEl = document.querySelector('.app');
    const scale = appEl.getBoundingClientRect().width / 430;
    el.style.left = Math.round(origX + dx / scale) + 'px';
    el.style.top = Math.round(origY + dy / scale) + 'px';
  }

  function onUp() {
    dragging = false;
    el.classList.remove('dragging');
    const name = el.dataset.sprite;
    if (name && SPRITE_POS[name]) {
      SPRITE_POS[name].x = parseInt(el.style.left);
      SPRITE_POS[name].y = parseInt(el.style.top);
    }
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onUp);
  }

  el.addEventListener('mousedown', onDown);
  el.addEventListener('touchstart', onDown, { passive: false });
}

// ── COMBAT LOOP ──
async function doRoll(){
  if(state.rolling)return;state.rolling=true;$('rollBtn').disabled=true;

  // Swarm
  if(state.player.ability==='Swarm'){state.enemyHp-=1;updateHp();setNarrator('<b>Swarm!</b> Enemy takes 1 damage!');
    showAbilityPopup('Swarm','Enemy takes 1 damage!');playSound('special');await wait(700);
    if(state.enemyHp<=0){await handleKO(true);return;}}
  if(state.enemy.ability==='Swarm'){state.playerHp-=1;updateHp();
    setNarrator(state.enemy.name+'\'s <b>Swarm!</b> You take 1!');playSound('special');await wait(700);
    if(state.playerHp<=0){await handleKO(false);return;}}

  // Launch 3D dice
  Dice3D.clear('player');Dice3D.clear('enemy');
  playSound('roll');
  Dice3D.showRolling('player',3);Dice3D.showRolling('enemy',3);

  // Let physics run for a bit
  await wait(800);

  // Determine final values
  const pDice=rollDice(3),eDice=rollDice(3);

  // Settle dice to final values
  await new Promise(resolve=>{
    let done=0;
    Dice3D.revealDice('player',pDice,()=>{done++;if(done===2)resolve();});
    Dice3D.revealDice('enemy',eDice,()=>{done++;if(done===2)resolve();});
  });

  const pRoll=analyzeRoll(pDice),eRoll=analyzeRoll(eDice),result=compareRolls(pRoll,eRoll);
  await wait(200);

  if(result>0){
    showRollResult(typeLabel(pRoll.type)+' — YOU WIN!','win');
    Dice3D.highlightWin('player',pRoll);Dice3D.highlightLose('enemy');
    const{damage,effects}=applyAbilities(state.player,state.enemy,pRoll,pRoll.damage);
    const def=applyDefense(state.enemy,damage,pRoll);let finalDmg=def.damage;
    for(const eff of effects){showAbilityPopup(eff.name,eff.desc);playSound('special');await wait(500);}
    if(def.blocked){setNarrator(state.enemy.name+' <b>blocked</b>!');playSound('special');}
    else if(def.counter){state.playerHp+=finalDmg;updateHp();flashDamage(true);showFloatingDmg(3,false);shakeScreen();playSound('dmg3');
      showAbilityPopup('Stone Form','Counter! Deal 3!');setNarrator(state.enemy.name+'\'s <b>Stone Form!</b>');}
    else if(finalDmg>0){state.enemyHp-=finalDmg;updateHp();flashDamage(false);showFloatingDmg(finalDmg,true);shakeScreen();
      playSound(finalDmg>=3?'dmg3':finalDmg>=2?'dmg2':'dmg1');if(pRoll.type==='triples')playSound('triples');
      setNarrator('You rolled <b>'+typeLabel(pRoll.type).toLowerCase()+'</b> — <b>'+finalDmg+' damage</b>!');}
    if(state.enemyHp<=0){await wait(600);await handleKO(true);return;}
  }else if(result<0){
    showRollResult(typeLabel(eRoll.type)+' — ENEMY WINS!','lose');
    Dice3D.highlightWin('enemy',eRoll);Dice3D.highlightLose('player');
    const{damage,effects}=applyAbilities(state.enemy,state.player,eRoll,eRoll.damage);
    const def=applyDefense(state.player,damage,eRoll);let finalDmg=def.damage;
    for(const eff of effects){showAbilityPopup(eff.name,eff.desc);await wait(500);}
    if(def.blocked){setNarrator(state.player.name+' <b>blocked</b>!');playSound('special');}
    else if(def.counter){state.enemyHp-=3;updateHp();flashDamage(false);showFloatingDmg(3,true);shakeScreen();playSound('dmg3');
      showAbilityPopup('Stone Form','Counter!');if(state.enemyHp<=0){await wait(600);await handleKO(true);return;}}
    else if(finalDmg>0){state.playerHp-=finalDmg;updateHp();flashDamage(true);showFloatingDmg(finalDmg,false);shakeScreen();
      playSound(finalDmg>=3?'dmg3':finalDmg>=2?'dmg2':'dmg1');
      setNarrator('<b>'+state.enemy.name+'</b> rolled <b>'+typeLabel(eRoll.type).toLowerCase()+'</b> — <b>'+finalDmg+' damage</b>!');}
    if(state.playerHp<=0){await wait(600);await handleKO(false);return;}
  }else{
    showRollResult('TIE — Roll again!','tie');
    setNarrator('Both rolled <b>'+typeLabel(pRoll.type).toLowerCase()+'</b> — tie!');
  }

  state.turn++;state.firstRoll=false;syncTeamHp();await wait(400);
  state.rolling=false;$('rollBtn').disabled=false;
}

function syncTeamHp(){const t=state.team.find(g=>g.name===state.player.name);if(t)t.hp=state.playerHp;renderTeamCards();renderArenaSprites();}

async function handleKO(playerWon){
  state.rolling=false;
  if(playerWon){
    setNarrator('<b>'+state.enemy.name+'</b> is defeated!');playSound('triples');await wait(1200);
    state.oppIdx++;
    if(state.oppIdx<state.opponents.length){
      state.enemy={...state.opponents[state.oppIdx]};state.enemyHp=state.enemy.maxHp;
      state.turn=1;state.firstRoll=true;setupBattle();
      setNarrator('<b>'+state.enemy.name+'</b> enters the arena!');
    }else{playSound('win');$('goResult').textContent='VICTORY!';$('goResult').className='result win';
      $('goSub').textContent='You defeated them all! 100+ Spiritkin await.';$('gameOver').classList.add('show');}
  }else{
    setNarrator('<b>'+state.player.name+'</b> has fallen!');await wait(1000);
    const te=state.team.find(g=>g.name===state.player.name);if(te)te.hp=0;
    const alive=state.team.filter(g=>g.hp>0);
    if(alive.length>0){state.player={...alive[0]};state.playerHp=alive[0].hp;state.firstRoll=true;
      setupBattle();setNarrator('<b>'+state.player.name+'</b> steps up!');}
    else{$('goResult').textContent='DEFEATED!';$('goResult').className='result lose';
      $('goSub').textContent='The arena claims another. Every rematch tells a different story.';$('gameOver').classList.add('show');}
  }
}

function restart(){$('gameOver').classList.remove('show');initGame();}

function initGame(){
  const team=PLAYER_TEAM.map(g=>({...g,hp:g.maxHp}));
  state.player={...team[0]};state.playerHp=team[0].maxHp;state.team=team;
  const opp=OPPONENTS[0];const boss=BOSSES[Math.floor(Math.random()*BOSSES.length)];
  state.opponents=[{...opp},{...boss}];state.oppIdx=0;
  state.enemy={...state.opponents[0]};state.enemyHp=state.enemy.maxHp;
  state.turn=1;state.firstRoll=true;state.rolling=false;
  setupBattle();
}

initGame();
</script>
