// ══════════════════════════════════════════════════════════════════
// BATTLE OF ORIGINS — PHASER HYPE AD
// Interactive 60-second playable ad for Kickstarter
// ══════════════════════════════════════════════════════════════════

// ── SECTION 1: CONSTANTS & DATA ──────────────────────────────────

const DPR = Math.min(window.devicePixelRatio || 1, 3);
const W = 430, H = 932;
const IMG = '../tierlist/cards/';
const SFX_PATH = '../boo/';
const COLORS = {
  player: 0x4fc3f7, enemy: 0xef5350, gold: 0xffd54f,
  dark: 0x0a0a14, purple: 0x7c3aed, purpleDark: 0x4c1d95,
  green: 0x22c55e, yellow: 0xf1c40f, red: 0xe74c3c,
  white: 0xffffff, black: 0x000000,
};

const ALL_GHOSTS = [
  { name:"Gary", file:"gary.jpg", rarity:"common", maxHp:6, ability:"Swarm", abilityDesc:"Before rolling, enemy takes 1 damage." },
  { name:"Hector", file:"hector.jpg", rarity:"ghost-rare", maxHp:6, ability:"Protector", abilityDesc:"Singles beat doubles. +1 damage on singles." },
  { name:"Flora", file:"flora.jpg", rarity:"rare", maxHp:4, ability:"Restore", abilityDesc:"Roll doubles: +2 HP after damage." },
  { name:"Stone Cold", file:"stone_cold.jpg", rarity:"rare", maxHp:7, ability:"One-two-one!", abilityDesc:"Roll double 1's: deal 3X damage." },
  { name:"Pelter", file:"pelter.jpg", rarity:"rare", maxHp:5, ability:"Snowball", abilityDesc:"Doubles gain +2 damage." },
  { name:"Patrick", file:"patrick.jpg", rarity:"common", maxHp:3, ability:"Stone Form", abilityDesc:"Don't roll. If opponent rolls singles: negate damage, deal 3." },
  { name:"Wim", file:"wim.jpg", rarity:"rare", maxHp:6, ability:"Slash", abilityDesc:"+5 damage when all dice are odd." },
  { name:"Nikon", file:"nikon.jpg", rarity:"common", maxHp:6, ability:"Ambush", abilityDesc:"Win first roll: deal triple damage." },
  { name:"Kodako", file:"kodako.jpg", rarity:"common", maxHp:6, ability:"Swift", abilityDesc:"Roll 1-2-3: negate damage and deal 4." },
  { name:"Guard Thomas", file:"guard_thomas.jpg", rarity:"uncommon", maxHp:6, ability:"Stoic", abilityDesc:"Below 6 HP: immune to singles damage." },
  { name:"The Mountain King", file:"mountain_king_leg.jpg", rarity:"legendary", maxHp:9, ability:"Beast Mode", abilityDesc:"Doubles deal 2X damage." },
  { name:"Lucy", file:"lucy.jpg", rarity:"legendary", maxHp:8, ability:"Blue Fire", abilityDesc:"Win a roll: +1 bonus damage." },
];

const STARTERS = ALL_GHOSTS.filter(g => ["Gary","Hector","Flora","Stone Cold"].includes(g.name));
const OPPONENTS = ALL_GHOSTS.filter(g => ["Wim","Nikon","Kodako","Guard Thomas"].includes(g.name));
const BOSSES = ALL_GHOSTS.filter(g => g.rarity === 'legendary');

// ── SECTION 2: DICE ENGINE (from dice-engine.js) ────────────────

function rollDice(n) {
  const d = [];
  for (let i = 0; i < n; i++) d.push(Math.floor(Math.random() * 6) + 1);
  return d;
}

function analyzeRoll(dice) {
  const sorted = [...dice].sort((a, b) => b - a);
  const counts = {};
  dice.forEach(d => counts[d] = (counts[d] || 0) + 1);
  const maxCount = Math.max(...Object.values(counts));
  const matchVal = +Object.keys(counts).find(k => counts[k] === maxCount);
  if (maxCount >= 6) return { type:'sixcity', value:matchVal, damage:6, dice:sorted, matchDie:matchVal };
  if (maxCount === 5) return { type:'penta', value:matchVal, damage:5, dice:sorted, matchDie:matchVal };
  if (maxCount === 4) return { type:'quads', value:matchVal, damage:4, dice:sorted, matchDie:matchVal };
  if (maxCount === 3) return { type:'triples', value:matchVal, damage:3, dice:sorted, matchDie:matchVal };
  if (maxCount === 2) {
    const pairVal = +Object.keys(counts).find(k => counts[k] === 2);
    const kicker = sorted.find(d => d !== pairVal) || pairVal;
    return { type:'doubles', value:pairVal, kicker, damage:2, dice:sorted, matchDie:pairVal };
  }
  return { type:'singles', value:sorted[0], damage:1, dice:sorted, matchDie:null };
}

function compareRolls(pRoll, eRoll) {
  const rank = { singles:0, doubles:1, triples:2, quads:3, penta:4, sixcity:5 };
  if (state.player?.ability === 'Protector' && pRoll.type === 'singles' && eRoll.type === 'doubles') return 1;
  if (state.enemy?.ability === 'Protector' && eRoll.type === 'singles' && pRoll.type === 'doubles') return -1;
  const pR = rank[pRoll.type] ?? 0, eR = rank[eRoll.type] ?? 0;
  if (pR !== eR) return pR > eR ? 1 : -1;
  if (['triples','quads','penta','sixcity'].includes(pRoll.type)) return pRoll.value > eRoll.value ? 1 : pRoll.value < eRoll.value ? -1 : 0;
  if (pRoll.type === 'doubles') {
    if (pRoll.value !== eRoll.value) return pRoll.value > eRoll.value ? 1 : -1;
    return (pRoll.kicker||0) > (eRoll.kicker||0) ? 1 : (pRoll.kicker||0) < (eRoll.kicker||0) ? -1 : 0;
  }
  for (let i = 0; i < Math.max(pRoll.dice.length, eRoll.dice.length); i++) {
    if ((pRoll.dice[i]||0) > (eRoll.dice[i]||0)) return 1;
    if ((pRoll.dice[i]||0) < (eRoll.dice[i]||0)) return -1;
  }
  return 0;
}

function typeLabelText(type) {
  return { sixcity:'SIX CITY!!', penta:'PENTA!', quads:'QUADS!', triples:'TRIPLES!', doubles:'Doubles', singles:'Singles' }[type] || type;
}

// ── SECTION 3: ABILITY ENGINE ────────────────────────────────────

function applyAbilities(winner, loser, roll, baseDmg) {
  let damage = baseDmg;
  let effects = [];
  switch (winner.ability) {
    case 'Protector': if (roll.type === 'singles') { damage += 1; effects.push({name:'Protector',desc:'+1 damage on singles!'}); } break;
    case 'One-two-one!': if (roll.type === 'doubles' && roll.value === 1) { damage *= 3; effects.push({name:'One-two-one!',desc:'Double 1\'s! 3X DAMAGE!'}); } break;
    case 'Slash': if (roll.dice.every(d => d % 2 === 1)) { damage += 5; effects.push({name:'Slash',desc:'All odd! +5 damage!'}); } break;
    case 'Ambush': if (state.firstRoll) { damage *= 3; effects.push({name:'Ambush',desc:'First strike! 3X damage!'}); } break;
    case 'Swift':
      if (roll.dice.length >= 3 && [1,2,3].every(n => roll.dice.includes(n))) { damage = 4; effects.push({name:'Swift',desc:'1-2-3! Deal 4!'}); }
      break;
    case 'Blue Fire': damage += 1; effects.push({name:'Blue Fire',desc:'+1 bonus damage!'}); break;
    case 'Beast Mode': if (roll.type === 'doubles') { damage *= 2; effects.push({name:'Beast Mode',desc:'Doubles! 2X DAMAGE!'}); } break;
    case 'Snowball': if (roll.type === 'doubles') { damage += 2; effects.push({name:'Snowball',desc:'Doubles +2 damage!'}); } break;
  }
  return { damage, effects };
}

function applyDefense(defender, damage, attackRoll) {
  if (defender.ability === 'Stoic') {
    const hp = state.player === defender ? state.playerHp : state.enemyHp;
    if (hp < 6 && attackRoll.type === 'singles') return { damage: 0, blocked: true };
  }
  if (defender.ability === 'Stone Form') {
    if (attackRoll.type === 'singles') return { damage: -3, blocked: false, counter: true };
  }
  return { damage, blocked: false };
}

// ── SECTION 4: GAME STATE ────────────────────────────────────────

const state = {
  player: null, enemy: null, boss: null,
  playerHp: 0, enemyHp: 0, turn: 1, firstRoll: true,
  phase: 'splash', rolling: false, team: [],
};

function resetState() {
  state.player = null; state.enemy = null; state.boss = null;
  state.playerHp = 0; state.enemyHp = 0; state.turn = 1;
  state.firstRoll = true; state.phase = 'splash';
  state.rolling = false; state.team = [];
}

// ── SECTION 5: PIP PATTERNS ─────────────────────────────────────

const PIP_MAP = {
  1: [{x:0.5,y:0.5}],
  2: [{x:0.25,y:0.25},{x:0.75,y:0.75}],
  3: [{x:0.25,y:0.25},{x:0.5,y:0.5},{x:0.75,y:0.75}],
  4: [{x:0.25,y:0.25},{x:0.75,y:0.25},{x:0.25,y:0.75},{x:0.75,y:0.75}],
  5: [{x:0.25,y:0.25},{x:0.75,y:0.25},{x:0.5,y:0.5},{x:0.25,y:0.75},{x:0.75,y:0.75}],
  6: [{x:0.25,y:0.25},{x:0.75,y:0.25},{x:0.25,y:0.5},{x:0.75,y:0.5},{x:0.25,y:0.75},{x:0.75,y:0.75}],
};

// ── SECTION 6: HELPER — delay for async/await in Phaser ─────────

function delay(scene, ms) {
  return new Promise(r => scene.time.delayedCall(ms, r));
}

// ── SECTION 7: HIDPI CAMERA SETUP ───────────────────────────────

function setupHiDPI(scene) {
  // Game canvas is W*DPR × H*DPR. Zoom by DPR so scene code uses 430×932 coords.
  // Camera default scroll is (0,0) and centers on (gameW/2, gameH/2).
  // With zoom=DPR the visible area = gameW/DPR × gameH/DPR = W × H.
  // But camera "looks at" center of the canvas, so we need to scroll it
  // so the visible 430×932 region starts at (0,0).
  const cam = scene.cameras.main;
  cam.setZoom(DPR);
  // After zoom, camera shows a W×H window centered on its scroll position.
  // Default center = (gameW/2/DPR, gameH/2/DPR) = (W/2, H/2) in world coords.
  // That's exactly what we want — the camera will show (0,0)→(W,H).
}

// ── SECTION 8: HP COLOR HELPER ──────────────────────────────────

function hpColor(hp, maxHp) {
  const pct = hp / maxHp;
  if (pct > 0.5) return COLORS.green;
  if (pct > 0.25) return COLORS.yellow;
  return COLORS.red;
}

// ══════════════════════════════════════════════════════════════════
// BOOT SCENE — Asset loading
// ══════════════════════════════════════════════════════════════════

class BootScene extends Phaser.Scene {
  constructor() { super('BootScene'); }

  preload() {
    // Progress bar
    const cx = W/2, cy = H/2;
    const barW = 260, barH = 16;
    const bg = this.add.graphics();
    bg.fillStyle(0x222233, 1);
    bg.fillRoundedRect(cx - barW/2, cy - barH/2, barW, barH, 4);
    const fill = this.add.graphics();
    const txt = this.add.text(cx, cy - 30, 'Loading...', { fontSize: '16px', color: '#aaa', fontFamily: 'sans-serif' }).setOrigin(0.5);

    this.load.on('progress', (v) => {
      fill.clear();
      fill.fillStyle(COLORS.purple, 1);
      fill.fillRoundedRect(cx - barW/2 + 2, cy - barH/2 + 2, (barW - 4) * v, barH - 4, 3);
    });

    // Card portraits (12 used)
    ALL_GHOSTS.forEach(g => {
      this.load.image(g.name, IMG + g.file);
    });

    // Health bar UI
    this.load.image('hp_ui', 'assets/hp_ui.png');

    // Sound effects
    this.load.audio('sfx_roll', SFX_PATH + 'DiceRoll.mp3');
    this.load.audio('sfx_dmg1', SFX_PATH + '1Damage.mp3');
    this.load.audio('sfx_dmg2', SFX_PATH + '2Damage.mp3');
    this.load.audio('sfx_dmg3', SFX_PATH + '3Damage.mp3');
    this.load.audio('sfx_special', SFX_PATH + 'Special.mp3');
    this.load.audio('sfx_triples', SFX_PATH + 'triples.mp3');
    this.load.audio('sfx_win', SFX_PATH + 'winningwhistle.mp3');
    this.load.audio('sfx_shatter', SFX_PATH + 'Shatter.mp3');
  }

  create() {
    this.scene.start('SplashScene');
  }
}

// ══════════════════════════════════════════════════════════════════
// SPLASH SCENE — Hook screen
// ══════════════════════════════════════════════════════════════════

class SplashScene extends Phaser.Scene {
  constructor() { super('SplashScene'); }

  create() {
    setupHiDPI(this);
    const cx = W/2, cy = H/2;

    // Background gradient
    const bg = this.add.graphics();
    bg.fillGradientStyle(0x1a0a2e, 0x1a0a2e, 0x0a0a14, 0x0a0a14, 1);
    bg.fillRect(0, 0, W, H);

    // Radial purple glow
    const glow = this.add.graphics();
    glow.fillStyle(COLORS.purple, 0.12);
    glow.fillCircle(cx, cy - 100, 200);

    // Card fan
    const previewNames = ['Gary','Hector','Flora','Stone Cold','Wim'];
    const rotations = [-12, -6, 0, 6, 12];
    previewNames.forEach((name, i) => {
      const card = this.add.image(cx + (i - 2) * 65, 300, name)
        .setDisplaySize(70, 95)
        .setAngle(rotations[i]);
      // Subtle float
      this.tweens.add({
        targets: card, y: card.y - 4, duration: 1500 + i * 200,
        yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
      });
    });

    // Title
    this.add.text(cx, 420, 'BATTLE OF\nORIGINS', {
      fontSize: '52px', fontFamily: 'Bangers', color: '#ffd54f',
      align: 'center', lineSpacing: -8,
      stroke: '#000', strokeThickness: 3,
    }).setOrigin(0.5);

    // Subtitle
    this.add.text(cx, 500, 'SPIRITKIN ARENA', {
      fontSize: '13px', fontFamily: 'sans-serif', color: 'rgba(255,255,255,0.4)',
      letterSpacing: 8,
    }).setOrigin(0.5);

    // Play button
    const btnY = 590;
    const btnBg = this.add.graphics();
    btnBg.fillStyle(COLORS.purple, 1);
    btnBg.fillRoundedRect(cx - 110, btnY - 28, 220, 56, 28);
    const btnText = this.add.text(cx, btnY, 'PLAY NOW', {
      fontSize: '26px', fontFamily: 'Bangers', color: '#fff',
      letterSpacing: 2,
    }).setOrigin(0.5);

    // Button glow
    const btnGlow = this.add.graphics();
    btnGlow.fillStyle(COLORS.purple, 0.25);
    btnGlow.fillRoundedRect(cx - 120, btnY - 34, 240, 68, 34);
    btnGlow.setDepth(-1);

    // Button pulse
    const btnContainer = this.add.container(0, 0, [btnGlow, btnBg, btnText]);
    this.tweens.add({
      targets: btnContainer, scaleX: 1.04, scaleY: 1.04,
      duration: 800, yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
    });

    // Hit zone
    const hitZone = this.add.zone(cx, btnY, 220, 56).setInteractive({ useHandCursor: true });
    hitZone.on('pointerdown', () => {
      // Unlock audio on first tap
      if (this.sound && this.sound.locked) this.sound.unlock();
      this.cameras.main.fadeOut(300, 0, 0, 0);
      this.cameras.main.once('camerafadeoutcomplete', () => {
        this.scene.start('SelectScene');
      });
    });

    // Tagline
    this.add.text(cx, 660, 'A 60-second taste of the full game', {
      fontSize: '11px', fontFamily: 'sans-serif', color: 'rgba(255,255,255,0.25)',
    }).setOrigin(0.5);

    // Ambient particles
    const particles = this.add.particles(0, 0, null, {
      x: { min: 0, max: W },
      y: H + 10,
      lifespan: 4000,
      speed: { min: 15, max: 35 },
      angle: { min: 260, max: 280 },
      scale: { start: 0.3, end: 0 },
      alpha: { start: 0.4, end: 0 },
      frequency: 300,
      emitting: true,
    });
    // Use a tiny gold circle as particle texture
    const pGfx = this.make.graphics({ add: false });
    pGfx.fillStyle(COLORS.gold, 1);
    pGfx.fillCircle(4, 4, 4);
    pGfx.generateTexture('particle_gold', 8, 8);
    pGfx.destroy();
    particles.setTexture('particle_gold');

    this.cameras.main.fadeIn(300);
  }
}

// ══════════════════════════════════════════════════════════════════
// SELECT SCENE — Pick your fighter
// ══════════════════════════════════════════════════════════════════

class SelectScene extends Phaser.Scene {
  constructor() { super('SelectScene'); }

  create() {
    setupHiDPI(this);
    const cx = W/2;
    this.selected = null;
    this.cardContainers = [];

    // Background
    const bg = this.add.graphics();
    bg.fillGradientStyle(0x1a0a2e, 0x1a0a2e, 0x0a0a14, 0x0a0a14, 1);
    bg.fillRect(0, 0, W, H);

    // Title
    this.add.text(cx, 50, 'CHOOSE YOUR SPIRITKIN', {
      fontSize: '24px', fontFamily: 'Bangers', color: '#ffd54f',
      letterSpacing: 3, stroke: '#000', strokeThickness: 2,
    }).setOrigin(0.5);

    // 2x2 Grid
    const gridStartY = 100;
    const cardW = 170, cardH = 230, gap = 16;
    const gridW = cardW * 2 + gap;
    const startX = cx - gridW / 2 + cardW / 2;

    STARTERS.forEach((ghost, i) => {
      const col = i % 2, row = Math.floor(i / 2);
      const x = startX + col * (cardW + gap);
      const y = gridStartY + row * (cardH + gap) + cardH / 2;

      const container = this.add.container(x, y);

      // Card border
      const border = this.add.graphics();
      border.lineStyle(3, 0x333355, 1);
      border.strokeRoundedRect(-cardW/2, -cardH/2, cardW, cardH, 10);
      container.add(border);

      // Card image
      const img = this.add.image(0, 0, ghost.name).setDisplaySize(cardW - 6, cardH - 6);
      // Round corners via mask
      const maskShape = this.make.graphics({ add: false });
      maskShape.fillStyle(0xffffff);
      maskShape.fillRoundedRect(x - cardW/2 + 3, y - cardH/2 + 3, cardW - 6, cardH - 6, 8);
      img.setMask(maskShape.createGeometryMask());
      container.add(img);

      // Name label at bottom
      const nameBg = this.add.graphics();
      nameBg.fillStyle(0x000000, 0.7);
      nameBg.fillRoundedRect(-cardW/2 + 3, cardH/2 - 36, cardW - 6, 33, { bl: 8, br: 8, tl: 0, tr: 0 });
      container.add(nameBg);
      const nameText = this.add.text(0, cardH/2 - 20, ghost.name, {
        fontSize: '16px', fontFamily: 'Bangers', color: '#fff', letterSpacing: 1,
      }).setOrigin(0.5);
      container.add(nameText);

      // Glow (hidden)
      const glowGfx = this.add.graphics();
      glowGfx.lineStyle(3, COLORS.purple, 1);
      glowGfx.strokeRoundedRect(-cardW/2 - 2, -cardH/2 - 2, cardW + 4, cardH + 4, 12);
      glowGfx.setAlpha(0);
      container.add(glowGfx);

      container.setSize(cardW, cardH);
      container.setInteractive({ useHandCursor: true });
      container.ghostData = ghost;
      container.glowGfx = glowGfx;
      container.borderGfx = border;

      container.on('pointerdown', () => {
        // Deselect all
        this.cardContainers.forEach(c => {
          c.glowGfx.setAlpha(0);
          c.setScale(1);
        });
        // Select this one
        container.glowGfx.setAlpha(1);
        this.tweens.add({ targets: container, scaleX: 1.06, scaleY: 1.06, duration: 150, yoyo: true, ease: 'Back.easeOut' });
        this.selected = ghost;
        this.showConfirmBtn();
      });

      this.cardContainers.push(container);
    });

    // Confirm button (initially hidden)
    this.confirmBtn = this.add.container(cx, H - 60);
    const cBg = this.add.graphics();
    cBg.fillStyle(COLORS.purple, 1);
    cBg.fillRoundedRect(-140, -25, 280, 50, 25);
    this.confirmBtn.add(cBg);
    const cText = this.add.text(0, 0, 'ENTER THE ARENA', {
      fontSize: '22px', fontFamily: 'Bangers', color: '#fff', letterSpacing: 2,
    }).setOrigin(0.5);
    this.confirmBtn.add(cText);
    this.confirmBtn.setAlpha(0);
    this.confirmBtn.setSize(280, 50);

    const cHit = this.add.zone(cx, H - 60, 280, 50).setInteractive({ useHandCursor: true });
    cHit.setAlpha(0);
    this.confirmHit = cHit;
    cHit.on('pointerdown', () => {
      if (!this.selected) return;
      this.confirmSelection();
    });

    this.cameras.main.fadeIn(300);
  }

  showConfirmBtn() {
    this.tweens.add({ targets: this.confirmBtn, alpha: 1, duration: 250 });
    this.confirmHit.setAlpha(1);
  }

  confirmSelection() {
    state.player = { ...this.selected };
    state.playerHp = this.selected.maxHp;

    // Build team: player + 2 random other starters
    const others = STARTERS.filter(g => g.name !== this.selected.name)
      .sort(() => Math.random() - 0.5);
    state.team = [
      { ...state.player, hp: state.player.maxHp },
      { ...others[0], hp: others[0].maxHp },
      { ...others[1], hp: others[1].maxHp },
    ];

    // Pick opponent
    const opp = OPPONENTS[Math.floor(Math.random() * OPPONENTS.length)];
    state.enemy = { ...opp };
    state.enemyHp = opp.maxHp;
    state.turn = 1;
    state.firstRoll = true;
    state.phase = 'battle';

    this.cameras.main.fadeOut(200, 0, 0, 0);
    this.cameras.main.once('camerafadeoutcomplete', () => {
      this.scene.start('VSScene');
    });
  }
}

// ══════════════════════════════════════════════════════════════════
// VS SCENE — Dramatic intro
// ══════════════════════════════════════════════════════════════════

class VSScene extends Phaser.Scene {
  constructor() { super('VSScene'); }

  create() {
    setupHiDPI(this);
    const cx = W/2, cy = H/2;

    // Black bg
    this.add.rectangle(cx, cy, W, H, 0x000000);

    // Player portrait
    const pPortrait = this.createPortrait(cx - 100, cy - 20, state.player.name, COLORS.player);
    pPortrait.setScale(0).setAlpha(0);
    this.tweens.add({ targets: pPortrait, x: cx - 90, scaleX: 1, scaleY: 1, alpha: 1, duration: 400, ease: 'Back.easeOut' });

    // Player name
    const pName = this.add.text(cx - 90, cy + 60, state.player.name, {
      fontSize: '20px', fontFamily: 'Bangers', color: '#4fc3f7', letterSpacing: 1,
    }).setOrigin(0.5).setAlpha(0);
    this.tweens.add({ targets: pName, alpha: 1, duration: 300, delay: 200 });

    // Enemy portrait
    const ePortrait = this.createPortrait(cx + 100, cy - 20, state.enemy.name, COLORS.enemy);
    ePortrait.setScale(0).setAlpha(0);
    this.tweens.add({ targets: ePortrait, x: cx + 90, scaleX: 1, scaleY: 1, alpha: 1, duration: 400, ease: 'Back.easeOut', delay: 100 });

    // Enemy name
    const eName = this.add.text(cx + 90, cy + 60, state.enemy.name, {
      fontSize: '20px', fontFamily: 'Bangers', color: '#ef5350', letterSpacing: 1,
    }).setOrigin(0.5).setAlpha(0);
    this.tweens.add({ targets: eName, alpha: 1, duration: 300, delay: 300 });

    // VS slam
    const vsText = this.add.text(cx, cy - 20, 'VS', {
      fontSize: '72px', fontFamily: 'Bangers', color: '#ffd54f',
      stroke: '#000', strokeThickness: 6,
    }).setOrigin(0.5).setScale(3).setAlpha(0);

    this.tweens.add({
      targets: vsText, scaleX: 1, scaleY: 1, alpha: 1,
      duration: 500, delay: 300, ease: 'Bounce.easeOut',
      onComplete: () => this.cameras.main.shake(200, 0.01),
    });

    // Auto advance
    this.time.delayedCall(1800, () => {
      this.cameras.main.fadeOut(200, 0, 0, 0);
      this.cameras.main.once('camerafadeoutcomplete', () => {
        this.scene.start('ArenaScene');
      });
    });
  }

  createPortrait(x, y, textureKey, tintColor) {
    const size = 80;
    const container = this.add.container(x, y);

    // Glow circle behind
    const glow = this.add.graphics();
    glow.fillStyle(tintColor, 0.3);
    glow.fillCircle(0, 0, size/2 + 8);
    container.add(glow);

    // Portrait image with circular mask
    const img = this.add.image(0, 0, textureKey).setDisplaySize(size, size);
    const maskGfx = this.make.graphics({ add: false });
    maskGfx.fillStyle(0xffffff);
    maskGfx.fillCircle(x, y, size/2);
    img.setMask(maskGfx.createGeometryMask());
    container.add(img);

    // Border ring
    const ring = this.add.graphics();
    ring.lineStyle(3, tintColor, 1);
    ring.strokeCircle(0, 0, size/2);
    container.add(ring);

    return container;
  }
}

// ══════════════════════════════════════════════════════════════════
// ARENA SCENE — THE BATTLE
// ══════════════════════════════════════════════════════════════════

class ArenaScene extends Phaser.Scene {
  constructor() { super('ArenaScene'); }

  create() {
    setupHiDPI(this);
    const cx = W/2;
    this.rolling = false;

    // ── Arena Background ──
    this.drawArenaBackground();

    // ── Enemy HUD (top area) ──
    this.createEnemyHUD();

    // ── Center: VS + Dice ──
    this.createDiceArea();

    // ── Player HP Bar UI ──
    this.createPlayerHUD();

    // ── Narrator ──
    this.createNarrator();

    // ── Team Cards ──
    this.createTeamCards();

    // ── Roll Button ──
    this.createRollButton();

    // ── Damage Flash overlay ──
    this.damageFlash = this.add.rectangle(cx, H/2, W, H, 0xff0000, 0).setDepth(50);

    // ── Roll Result text ──
    this.rollResultText = this.add.text(cx, 400, '', {
      fontSize: '20px', fontFamily: 'Bangers', color: '#fff',
      stroke: '#000', strokeThickness: 3,
    }).setOrigin(0.5).setAlpha(0).setDepth(40);

    // Turn badge
    this.turnText = this.add.text(30, 20, 'TURN', {
      fontSize: '10px', fontFamily: 'sans-serif', color: 'rgba(255,255,255,0.5)',
    });
    this.turnNum = this.add.text(38, 34, String(state.turn), {
      fontSize: '28px', fontFamily: 'Bangers', color: '#fff',
    }).setOrigin(0.5, 0);

    this.cameras.main.fadeIn(300);
    this.updateAllHp();
  }

  drawArenaBackground() {
    const bg = this.add.graphics();
    // Sky gradient at top
    bg.fillGradientStyle(0x4a7aaa, 0x4a7aaa, 0x3a5a3a, 0x3a5a3a, 0.4);
    bg.fillRect(0, 0, W, 280);
    // Arena floor
    bg.fillGradientStyle(0x3a5a3a, 0x3a5a3a, 0x1a2a1a, 0x1a2a1a, 1);
    bg.fillRect(0, 280, W, H - 280);
    // Vignette
    bg.fillStyle(0x000000, 0.3);
    bg.fillRect(0, 0, W, 80);
    bg.fillRect(0, H - 200, W, 200);
  }

  // ── HEALTH BAR UI CONSTANTS ──
  // Source image: 980x468. Key regions (in source px):
  //   Portrait circle center: ~195, ~235 (radius ~145)
  //   Name bar: x 370-910, y 85-195
  //   HP bar (recessed): x 385-880, y 270-340
  // Display scale factor for 320px wide plate:

  // ── ENEMY HUD ──

  createEnemyHUD() {
    // Metallic plate — flipped, anchored top-right
    // Display size: 320w x 153h
    const plateW = 320, plateH = 153;
    const plateX = W + 8;  // pushed slightly off right edge for dramatic overlap
    const plateY = 85;
    const sc = plateW / 980; // ~0.327

    this.enemyHpUi = this.add.image(plateX, plateY, 'hp_ui')
      .setOrigin(1, 0.5)
      .setDisplaySize(plateW, plateH)
      .setFlipX(true)
      .setDepth(10);

    // Portrait — when flipped, the circle is on the RIGHT
    // Source circle center: 195, 235 → from right edge: 980-195=785
    // Flipped display: portrait X = plateX - (785 * sc) = plateX - 257
    // But since we originate from right: epX = plateX - (195 * sc)
    const epX = plateX - (195 * sc);
    const epY = plateY;
    const portraitR = 145 * sc; // ~47px radius

    this.enemyPortrait = this.add.image(epX, epY, state.enemy.name)
      .setDisplaySize(portraitR * 2 - 6, portraitR * 2 - 6).setDepth(12);
    const eMask = this.make.graphics({ add: false });
    eMask.fillStyle(0xffffff);
    eMask.fillCircle(epX, epY, portraitR - 4);
    this.enemyPortrait.setMask(eMask.createGeometryMask());

    // Enemy name — inside the top metallic bar
    // Source name bar: x 370-910, y ~120 center → flipped: from right edge
    // Flipped: name region center X ≈ plateX - ((370+910)/2 * sc) = plateX - 209
    const nameX = plateX - (640 * sc);
    const nameY = plateY - (235 - 140) * sc; // up from center to name bar
    this.enemyNameText = this.add.text(nameX, nameY, state.enemy.name, {
      fontSize: '15px', fontFamily: 'Bangers', color: '#fff', letterSpacing: 2,
      stroke: '#000', strokeThickness: 1,
    }).setOrigin(0.5).setDepth(13);

    // HP fill — inside the recessed bar
    // Source HP bar: x 385-880, y 270-340 → center y ~305
    this.enemyHpFill = this.add.graphics().setDepth(11);
    // HP text overlaid on bar
    const hpTextX = plateX - (632 * sc);
    const hpTextY = plateY + (305 - 235) * sc;
    this.enemyHpText = this.add.text(hpTextX, hpTextY, '', {
      fontSize: '12px', fontFamily: 'Bangers', color: '#fff',
      stroke: '#000', strokeThickness: 2,
    }).setOrigin(0.5).setDepth(13);

    // Store layout constants for updateEnemyHp
    this._eBar = {
      // Flipped: bar runs right-to-left. Right edge = plateX - (385*sc), left edge = plateX - (880*sc)
      right: plateX - (395 * sc),
      left: plateX - (870 * sc),
      top: plateY + (270 - 235) * sc,
      bottom: plateY + (335 - 235) * sc,
    };
  }

  updateEnemyHp() {
    const hp = Math.max(0, state.enemyHp);
    const max = state.enemy.maxHp;
    const pct = hp / max;
    const col = hpColor(hp, max);
    const b = this._eBar;
    const barW = b.right - b.left;
    const barH = b.bottom - b.top;
    const fillW = barW * pct;

    this.enemyHpFill.clear();
    // Dark bar background (slightly visible behind fill)
    this.enemyHpFill.fillStyle(0x000000, 0.4);
    this.enemyHpFill.fillRect(b.left, b.top, barW, barH);
    // Colored HP fill — fills from LEFT to RIGHT
    if (pct > 0) {
      this.enemyHpFill.fillStyle(col, 0.9);
      this.enemyHpFill.fillRect(b.left, b.top, fillW, barH);
      // Shine highlight on top
      this.enemyHpFill.fillStyle(0xffffff, 0.15);
      this.enemyHpFill.fillRect(b.left, b.top, fillW, barH * 0.35);
    }

    this.enemyHpText.setText(`${hp} / ${max}`);
  }

  // ── PLAYER HUD ──

  createPlayerHUD() {
    // Metallic plate — normal orientation, anchored bottom-left
    const plateW = 320, plateH = 153;
    const plateX = -8;  // pushed slightly off left edge
    const plateY = 570;
    const sc = plateW / 980; // ~0.327

    this.playerHpUi = this.add.image(plateX, plateY, 'hp_ui')
      .setOrigin(0, 0.5)
      .setDisplaySize(plateW, plateH)
      .setDepth(10);

    // Portrait — circle on the LEFT
    // Source circle center: 195, 235
    const ppX = plateX + (195 * sc);
    const ppY = plateY;
    const portraitR = 145 * sc;

    this.playerPortrait = this.add.image(ppX, ppY, state.player.name)
      .setDisplaySize(portraitR * 2 - 6, portraitR * 2 - 6).setDepth(12);
    const pMask = this.make.graphics({ add: false });
    pMask.fillStyle(0xffffff);
    pMask.fillCircle(ppX, ppY, portraitR - 4);
    this.playerPortrait.setMask(pMask.createGeometryMask());

    // Player name — inside top metallic bar
    const nameX = plateX + (640 * sc);
    const nameY = plateY - (235 - 140) * sc;
    this.playerNameText = this.add.text(nameX, nameY, state.player.name, {
      fontSize: '15px', fontFamily: 'Bangers', color: '#fff', letterSpacing: 2,
      stroke: '#000', strokeThickness: 1,
    }).setOrigin(0.5).setDepth(13);

    // HP fill
    this.playerHpFill = this.add.graphics().setDepth(11);
    // HP text
    const hpTextX = plateX + (632 * sc);
    const hpTextY = plateY + (305 - 235) * sc;
    this.playerHpText = this.add.text(hpTextX, hpTextY, '', {
      fontSize: '12px', fontFamily: 'Bangers', color: '#fff',
      stroke: '#000', strokeThickness: 2,
    }).setOrigin(0.5).setDepth(13);

    // Store layout constants for updatePlayerHp
    this._pBar = {
      left: plateX + (395 * sc),
      right: plateX + (870 * sc),
      top: plateY + (270 - 235) * sc,
      bottom: plateY + (335 - 235) * sc,
    };
  }

  updatePlayerHp() {
    const hp = Math.max(0, state.playerHp);
    const max = state.player.maxHp;
    const pct = hp / max;
    const col = hpColor(hp, max);
    const b = this._pBar;
    const barW = b.right - b.left;
    const barH = b.bottom - b.top;
    const fillW = barW * pct;

    this.playerHpFill.clear();
    // Dark bar background
    this.playerHpFill.fillStyle(0x000000, 0.4);
    this.playerHpFill.fillRect(b.left, b.top, barW, barH);
    // Colored HP fill
    if (pct > 0) {
      this.playerHpFill.fillStyle(col, 0.9);
      this.playerHpFill.fillRect(b.left, b.top, fillW, barH);
      // Shine highlight
      this.playerHpFill.fillStyle(0xffffff, 0.15);
      this.playerHpFill.fillRect(b.left, b.top, fillW, barH * 0.35);
    }

    this.playerHpText.setText(`${hp} / ${max}`);
  }

  updateAllHp() {
    this.updatePlayerHp();
    this.updateEnemyHp();
  }

  // ── DICE AREA ──

  createDiceArea() {
    const cx = W/2;
    // VS text
    this.vsText = this.add.text(cx, 370, 'VS', {
      fontSize: '80px', fontFamily: 'Bangers', color: '#ffffff',
      stroke: '#000', strokeThickness: 5,
    }).setOrigin(0.5).setAlpha(0.15).setDepth(5);

    // Create 6 dice
    this.playerDice = [];
    this.enemyDice = [];

    const pDicePos = [
      { x: cx - 80, y: 440 }, { x: cx, y: 460 }, { x: cx + 80, y: 435 }
    ];
    const eDicePos = [
      { x: cx - 70, y: 280 }, { x: cx + 10, y: 260 }, { x: cx + 80, y: 285 }
    ];

    for (let i = 0; i < 3; i++) {
      this.playerDice.push(this.createDie(pDicePos[i].x, pDicePos[i].y, COLORS.player, 0x1e3a5f));
      this.enemyDice.push(this.createDie(eDicePos[i].x, eDicePos[i].y, COLORS.enemy, 0x8b0000));
    }
  }

  createDie(x, y, borderColor, bgColor) {
    const size = 44;
    const container = this.add.container(x, y).setDepth(15);

    // Background
    const bg = this.add.graphics();
    bg.fillStyle(bgColor, 1);
    bg.fillRoundedRect(-size/2, -size/2, size, size, 8);
    bg.lineStyle(2, borderColor, 1);
    bg.strokeRoundedRect(-size/2, -size/2, size, size, 8);
    container.add(bg);

    // Pips container
    const pipsGfx = this.add.graphics();
    container.add(pipsGfx);

    // Question mark initially
    const qmark = this.add.text(0, 0, '?', {
      fontSize: '20px', fontFamily: 'Bangers', color: 'rgba(255,255,255,0.3)',
    }).setOrigin(0.5);
    container.add(qmark);

    container.dieSize = size;
    container.pipsGfx = pipsGfx;
    container.qmark = qmark;
    container.borderColor = borderColor;
    container.bgColor = bgColor;

    return container;
  }

  setDieValue(dieContainer, value) {
    const s = dieContainer.dieSize;
    const pips = PIP_MAP[value] || [];
    dieContainer.pipsGfx.clear();
    dieContainer.pipsGfx.fillStyle(0xffffff, 0.9);
    dieContainer.qmark.setVisible(false);
    pips.forEach(p => {
      dieContainer.pipsGfx.fillCircle(
        (p.x - 0.5) * (s - 12),
        (p.y - 0.5) * (s - 12),
        4
      );
    });
  }

  resetDice() {
    [...this.playerDice, ...this.enemyDice].forEach(d => {
      d.pipsGfx.clear();
      d.qmark.setVisible(true);
      d.setScale(1).setAlpha(1).setAngle(0);
    });
  }

  // ── NARRATOR ──

  createNarrator() {
    const cx = W/2;
    const narBg = this.add.graphics().setDepth(20);
    narBg.fillStyle(0x000000, 0.7);
    narBg.fillRoundedRect(15, 645, W - 30, 40, 8);
    narBg.lineStyle(1, 0xffffff, 0.05);
    narBg.strokeRoundedRect(15, 645, W - 30, 40, 8);

    this.narratorText = this.add.text(cx, 665, 'Tap ROLL to begin!', {
      fontSize: '13px', fontFamily: 'sans-serif', color: '#cccccc',
      align: 'center', wordWrap: { width: W - 60 },
    }).setOrigin(0.5).setDepth(21);
  }

  setNarrator(text) {
    this.narratorText.setText(text);
  }

  // ── TEAM CARDS ──

  createTeamCards() {
    this.teamCardImages = [];
    const startX = 55;
    const y = 740;
    const cardW = 60, cardH = 82;

    state.team.forEach((ghost, i) => {
      const x = startX + i * (cardW + 12);
      const img = this.add.image(x, y, ghost.name)
        .setDisplaySize(cardW, cardH)
        .setDepth(20);

      // Border
      const border = this.add.graphics().setDepth(21);
      const isActive = ghost.name === state.player.name;
      border.lineStyle(2, isActive ? COLORS.player : 0x333355, 1);
      border.strokeRoundedRect(x - cardW/2, y - cardH/2, cardW, cardH, 6);

      if (ghost.hp <= 0) {
        img.setAlpha(0.3).setTint(0x666666);
      }

      this.teamCardImages.push({ img, border, ghost });
    });
  }

  refreshTeamCards() {
    this.teamCardImages.forEach(tc => {
      tc.border.clear();
      const isActive = tc.ghost.name === state.player.name;
      tc.border.lineStyle(2, isActive ? COLORS.player : 0x333355, 1);
      const cardW = 60, cardH = 82;
      tc.border.strokeRoundedRect(
        tc.img.x - cardW/2, tc.img.y - cardH/2, cardW, cardH, 6
      );
      if (tc.ghost.hp <= 0) {
        tc.img.setAlpha(0.3).setTint(0x666666);
      } else {
        tc.img.setAlpha(1).clearTint();
      }
    });
  }

  // ── ROLL BUTTON ──

  createRollButton() {
    const bx = W - 55, by = 740;
    const r = 32;

    const btnGlow = this.add.graphics().setDepth(19);
    btnGlow.fillStyle(COLORS.purple, 0.3);
    btnGlow.fillCircle(bx, by, r + 6);

    const btnBg = this.add.graphics().setDepth(20);
    btnBg.fillStyle(COLORS.purpleDark, 1);
    btnBg.fillCircle(bx, by, r);
    btnBg.lineStyle(3, COLORS.purple, 1);
    btnBg.strokeCircle(bx, by, r);

    // Play triangle
    const tri = this.add.graphics().setDepth(21);
    tri.fillStyle(0xffffff, 1);
    tri.fillTriangle(bx - 8, by - 14, bx - 8, by + 14, bx + 14, by);

    this.rollBtnContainer = this.add.container(0, 0, [btnGlow, btnBg, tri]).setDepth(20);

    // Pulse
    this.tweens.add({
      targets: this.rollBtnContainer, scaleX: 1.05, scaleY: 1.05,
      duration: 700, yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
    });

    // Hit zone
    this.rollHitZone = this.add.zone(bx, by, r * 2, r * 2).setInteractive({ useHandCursor: true }).setDepth(22);
    this.rollHitZone.on('pointerdown', () => this.doRoll());
  }

  disableRoll() {
    this.rollHitZone.disableInteractive();
    this.rollBtnContainer.setAlpha(0.4);
  }

  enableRoll() {
    this.rollHitZone.setInteractive({ useHandCursor: true });
    this.rollBtnContainer.setAlpha(1);
  }

  // ── EFFECTS ──

  flashDamage(isPlayerHit) {
    this.damageFlash.setFillStyle(isPlayerHit ? 0xef5350 : 0x4fc3f7, 0.3);
    this.tweens.add({
      targets: this.damageFlash, alpha: { from: 0.6, to: 0 },
      duration: 200,
    });
  }

  showFloatingDmg(amount, isPlayerDealt) {
    const x = isPlayerDealt ? W - 80 : 80;
    const y = isPlayerDealt ? 200 : 500;
    const col = isPlayerDealt ? '#4fc3f7' : '#ef5350';
    const txt = this.add.text(x, y, '-' + amount, {
      fontSize: '40px', fontFamily: 'Bangers', color: col,
      stroke: '#000', strokeThickness: 3,
    }).setOrigin(0.5).setDepth(60);
    this.tweens.add({
      targets: txt, y: y - 60, alpha: 0, duration: 900,
      ease: 'Power2', onComplete: () => txt.destroy(),
    });
  }

  showAbilityPopup(name, desc) {
    const cx = W/2;
    const container = this.add.container(cx, 350).setDepth(70).setScale(0.5).setAlpha(0);

    const bg = this.add.graphics();
    bg.fillStyle(0x000000, 0.85);
    bg.fillRoundedRect(-120, -30, 240, 60, 10);
    bg.lineStyle(2, COLORS.gold, 1);
    bg.strokeRoundedRect(-120, -30, 240, 60, 10);
    container.add(bg);

    const nameText = this.add.text(0, -12, name, {
      fontSize: '18px', fontFamily: 'Bangers', color: '#ffd54f', letterSpacing: 1,
    }).setOrigin(0.5);
    container.add(nameText);

    const descText = this.add.text(0, 10, desc, {
      fontSize: '11px', fontFamily: 'sans-serif', color: '#ccc',
    }).setOrigin(0.5);
    container.add(descText);

    this.tweens.add({
      targets: container, scaleX: 1.1, scaleY: 1.1, alpha: 1,
      duration: 200, ease: 'Back.easeOut',
      onComplete: () => {
        this.tweens.add({
          targets: container, scaleX: 1, scaleY: 1,
          duration: 100,
          onComplete: () => {
            this.tweens.add({
              targets: container, alpha: 0, y: container.y - 20,
              duration: 400, delay: 300,
              onComplete: () => container.destroy(),
            });
          }
        });
      }
    });
  }

  showRollResult(text, type) {
    const colors = { win: '#22c55e', lose: '#ef5350', tie: '#aaaaaa' };
    this.rollResultText.setText(text);
    this.rollResultText.setColor(colors[type] || '#fff');
    this.tweens.add({
      targets: this.rollResultText, alpha: { from: 1, to: 0 },
      duration: 1500, delay: 300,
    });
  }

  playSound(key) {
    try { this.sound.play(key, { volume: 0.5 }); } catch(e) {}
  }

  // ── COMBAT LOOP ──

  async doRoll() {
    if (this.rolling) return;
    this.rolling = true;
    this.disableRoll();
    this.resetDice();

    // ── Pre-roll: Gary's Swarm ──
    if (state.player.ability === 'Swarm') {
      state.enemyHp -= 1;
      this.updateAllHp();
      this.setNarrator('Swarm! Enemy takes 1 damage!');
      this.showAbilityPopup('Swarm', 'Enemy takes 1 damage!');
      this.playSound('sfx_special');
      await delay(this, 700);
      if (state.enemyHp <= 0) { await this.handleKO(true); return; }
    }
    if (state.enemy.ability === 'Swarm') {
      state.playerHp -= 1;
      this.updateAllHp();
      this.setNarrator(state.enemy.name + '\'s Swarm! You take 1 damage!');
      this.playSound('sfx_special');
      await delay(this, 700);
      if (state.playerHp <= 0) { await this.handleKO(false); return; }
    }

    // ── Stone Form special flow ──
    if (state.player.ability === 'Stone Form') {
      await this.doStoneFormRoll();
      return;
    }

    // ── Normal roll ──
    this.playSound('sfx_roll');
    const pDice = rollDice(3);
    const eDice = rollDice(3);

    // Animate dice
    for (let frame = 0; frame < 7; frame++) {
      const fakeP = rollDice(3), fakeE = rollDice(3);
      for (let i = 0; i < 3; i++) {
        this.setDieValue(this.playerDice[i], fakeP[i]);
        this.setDieValue(this.enemyDice[i], fakeE[i]);
        this.tweens.add({ targets: this.playerDice[i], angle: { from: -10, to: 10 }, duration: 60, yoyo: true });
        this.tweens.add({ targets: this.enemyDice[i], angle: { from: 10, to: -10 }, duration: 60, yoyo: true });
      }
      await delay(this, 65);
    }

    // Final values
    for (let i = 0; i < 3; i++) {
      this.setDieValue(this.playerDice[i], pDice[i]);
      this.setDieValue(this.enemyDice[i], eDice[i]);
      this.playerDice[i].setAngle(0);
      this.enemyDice[i].setAngle(0);
    }

    const pRoll = analyzeRoll(pDice);
    const eRoll = analyzeRoll(eDice);
    const result = compareRolls(pRoll, eRoll);

    await delay(this, 350);

    if (result > 0) {
      // Player wins
      this.showRollResult(typeLabelText(pRoll.type) + ' - YOU WIN!', 'win');
      const { damage, effects } = applyAbilities(state.player, state.enemy, pRoll, pRoll.damage);
      const def = applyDefense(state.enemy, damage, pRoll);
      let finalDmg = def.damage;

      for (const eff of effects) {
        this.showAbilityPopup(eff.name, eff.desc);
        this.playSound('sfx_special');
        await delay(this, 500);
      }

      if (def.blocked) {
        this.setNarrator(state.enemy.name + ' blocked the attack!');
        this.playSound('sfx_special');
      } else if (def.counter) {
        state.playerHp += finalDmg; // negative
        this.updateAllHp();
        this.flashDamage(true);
        this.showFloatingDmg(3, false);
        this.cameras.main.shake(300, 0.015);
        this.playSound('sfx_dmg3');
        this.showAbilityPopup('Stone Form', 'Counter! Deal 3!');
        this.setNarrator(state.enemy.name + '\'s Stone Form! Counter 3 damage!');
      } else if (finalDmg > 0) {
        state.enemyHp -= finalDmg;
        this.updateAllHp();
        this.flashDamage(false);
        this.showFloatingDmg(finalDmg, true);
        this.cameras.main.shake(300, 0.015);
        this.playSound(finalDmg >= 3 ? 'sfx_dmg3' : finalDmg >= 2 ? 'sfx_dmg2' : 'sfx_dmg1');
        if (pRoll.type === 'triples' || pRoll.type === 'quads') this.playSound('sfx_triples');
        this.setNarrator('You rolled ' + typeLabelText(pRoll.type).toLowerCase() + ' - ' + finalDmg + ' damage!');
      }

      // Flora heal
      if (state.player.ability === 'Restore' && pRoll.type === 'doubles') {
        await delay(this, 400);
        state.playerHp = Math.min(state.player.maxHp, state.playerHp + 2);
        this.updateAllHp();
        this.showAbilityPopup('Restore', '+2 HP!');
        this.playSound('sfx_special');
      }

      if (state.enemyHp <= 0) { await delay(this, 600); await this.handleKO(true); return; }

    } else if (result < 0) {
      // Enemy wins
      this.showRollResult(typeLabelText(eRoll.type) + ' - ENEMY WINS!', 'lose');
      const { damage, effects } = applyAbilities(state.enemy, state.player, eRoll, eRoll.damage);
      const def = applyDefense(state.player, damage, eRoll);
      let finalDmg = def.damage;

      for (const eff of effects) {
        this.showAbilityPopup(eff.name, eff.desc);
        await delay(this, 500);
      }

      if (def.blocked) {
        this.setNarrator(state.player.name + ' blocked!');
        this.playSound('sfx_special');
      } else if (def.counter) {
        state.enemyHp -= 3;
        this.updateAllHp();
        this.flashDamage(false);
        this.showFloatingDmg(3, true);
        this.cameras.main.shake(300, 0.015);
        this.playSound('sfx_dmg3');
        this.showAbilityPopup('Stone Form', 'Counter! Deal 3!');
        this.setNarrator('Stone Form! Negated + dealt 3 damage!');
        if (state.enemyHp <= 0) { await delay(this, 600); await this.handleKO(true); return; }
      } else if (finalDmg > 0) {
        state.playerHp -= finalDmg;
        this.updateAllHp();
        this.flashDamage(true);
        this.showFloatingDmg(finalDmg, false);
        this.cameras.main.shake(300, 0.015);
        this.playSound(finalDmg >= 3 ? 'sfx_dmg3' : finalDmg >= 2 ? 'sfx_dmg2' : 'sfx_dmg1');
        this.setNarrator(state.enemy.name + ' rolled ' + typeLabelText(eRoll.type).toLowerCase() + ' - ' + finalDmg + ' damage!');
      }

      // Enemy Flora heal
      if (state.enemy.ability === 'Restore' && eRoll.type === 'doubles') {
        await delay(this, 400);
        state.enemyHp = Math.min(state.enemy.maxHp, state.enemyHp + 2);
        this.updateAllHp();
      }

      if (state.playerHp <= 0) { await delay(this, 600); await this.handleKO(false); return; }

    } else {
      // Tie
      this.showRollResult('TIE - Roll again!', 'tie');
      this.setNarrator('Both rolled ' + typeLabelText(pRoll.type).toLowerCase() + ' - tie!');
    }

    state.turn++;
    state.firstRoll = false;
    this.turnNum.setText(String(state.turn));
    this.syncTeamHp();

    await delay(this, 400);
    this.rolling = false;
    this.enableRoll();
  }

  async doStoneFormRoll() {
    const eDice = rollDice(3);
    this.playSound('sfx_roll');

    // Animate enemy dice only
    for (let frame = 0; frame < 6; frame++) {
      const fake = rollDice(3);
      for (let i = 0; i < 3; i++) {
        this.setDieValue(this.enemyDice[i], fake[i]);
        this.tweens.add({ targets: this.enemyDice[i], angle: { from: 10, to: -10 }, duration: 60, yoyo: true });
      }
      await delay(this, 70);
    }
    for (let i = 0; i < 3; i++) {
      this.setDieValue(this.enemyDice[i], eDice[i]);
      this.enemyDice[i].setAngle(0);
    }
    // Player dice show shield
    for (let i = 0; i < 3; i++) {
      this.playerDice[i].pipsGfx.clear();
      this.playerDice[i].qmark.setVisible(true).setText('\u{1F6E1}').setFontSize(18);
    }

    await delay(this, 400);
    const eRoll = analyzeRoll(eDice);

    if (eRoll.type === 'singles') {
      // Counter!
      state.enemyHp -= 3;
      this.updateAllHp();
      this.flashDamage(false);
      this.showFloatingDmg(3, true);
      this.cameras.main.shake(300, 0.015);
      this.playSound('sfx_dmg3');
      this.showAbilityPopup('Stone Form', 'Negate + deal 3!');
      this.setNarrator('Stone Form! Negated singles, dealt 3 damage!');
    } else {
      const dmg = eRoll.damage;
      state.playerHp -= dmg;
      this.updateAllHp();
      this.flashDamage(true);
      this.showFloatingDmg(dmg, false);
      this.cameras.main.shake(300, 0.015);
      this.playSound(dmg >= 3 ? 'sfx_dmg3' : dmg >= 2 ? 'sfx_dmg2' : 'sfx_dmg1');
      this.setNarrator(state.enemy.name + ' rolled ' + typeLabelText(eRoll.type).toLowerCase() + ' - ' + dmg + ' damage!');
    }

    if (state.enemyHp <= 0) { await delay(this, 600); await this.handleKO(true); return; }
    if (state.playerHp <= 0) { await delay(this, 600); await this.handleKO(false); return; }

    state.turn++;
    state.firstRoll = false;
    this.turnNum.setText(String(state.turn));
    this.syncTeamHp();
    await delay(this, 300);
    this.rolling = false;
    this.enableRoll();
  }

  syncTeamHp() {
    const t = state.team.find(g => g.name === state.player.name);
    if (t) t.hp = state.playerHp;
    this.refreshTeamCards();
  }

  async handleKO(playerWon) {
    this.rolling = false;
    if (playerWon) {
      this.setNarrator(state.enemy.name + ' is defeated!');
      this.playSound('sfx_triples');
      await delay(this, 1200);
      if (state.phase === 'boss-battle') {
        this.playSound('sfx_win');
        this.cameras.main.fadeOut(300, 0, 0, 0);
        this.cameras.main.once('camerafadeoutcomplete', () => {
          this.scene.start('CTAScene', { won: true });
        });
      } else {
        // Show boss reveal
        this.cameras.main.fadeOut(300, 0, 0, 0);
        this.cameras.main.once('camerafadeoutcomplete', () => {
          this.scene.start('BossScene');
        });
      }
    } else {
      this.setNarrator(state.player.name + ' has fallen!');
      this.playSound('sfx_shatter');
      await delay(this, 1000);

      // Mark current player as dead
      const teamEntry = state.team.find(g => g.name === state.player.name);
      if (teamEntry) teamEntry.hp = 0;

      const alive = state.team.filter(g => g.hp > 0);
      if (alive.length > 0) {
        state.player = { ...alive[0] };
        state.playerHp = alive[0].hp;
        state.firstRoll = true;

        // Re-enter with VS splash
        this.cameras.main.fadeOut(200, 0, 0, 0);
        this.cameras.main.once('camerafadeoutcomplete', () => {
          this.scene.start('VSScene');
        });
      } else {
        // Game over
        this.cameras.main.fadeOut(300, 0, 0, 0);
        this.cameras.main.once('camerafadeoutcomplete', () => {
          this.scene.start('CTAScene', { won: false });
        });
      }
    }
  }
}

// ══════════════════════════════════════════════════════════════════
// BOSS SCENE — Legendary reveal
// ══════════════════════════════════════════════════════════════════

class BossScene extends Phaser.Scene {
  constructor() { super('BossScene'); }

  create() {
    setupHiDPI(this);
    const cx = W/2, cy = H/2;

    // Dark red background
    const bg = this.add.graphics();
    bg.fillGradientStyle(0x2a0a0a, 0x2a0a0a, 0x0a0a14, 0x0a0a14, 1);
    bg.fillRect(0, 0, W, H);
    // Red radial glow
    const glow = this.add.graphics();
    glow.fillStyle(0xef5350, 0.1);
    glow.fillCircle(cx, cy - 80, 200);

    // Boss selection
    state.boss = { ...BOSSES[Math.floor(Math.random() * BOSSES.length)] };

    // Boss portrait
    const portraitSize = 160;
    const portrait = this.add.image(cx, cy - 80, state.boss.name)
      .setDisplaySize(portraitSize, portraitSize)
      .setScale(0.3).setAlpha(0);

    // Circular mask
    const maskGfx = this.make.graphics({ add: false });
    maskGfx.fillStyle(0xffffff);
    maskGfx.fillCircle(cx, cy - 80, portraitSize/2);
    portrait.setMask(maskGfx.createGeometryMask());

    // Portrait ring
    const ring = this.add.graphics();
    ring.lineStyle(4, COLORS.enemy, 1);
    ring.strokeCircle(cx, cy - 80, portraitSize/2 + 2);
    ring.setScale(0.3).setAlpha(0);

    // Glow behind portrait
    const pGlow = this.add.graphics();
    pGlow.fillStyle(COLORS.enemy, 0.15);
    pGlow.fillCircle(cx, cy - 80, portraitSize/2 + 15);
    pGlow.setScale(0.3).setAlpha(0);

    // Animate entry
    this.tweens.add({
      targets: [portrait, ring, pGlow], scaleX: 1, scaleY: 1, alpha: 1,
      duration: 800, ease: 'Back.easeOut',
    });

    this.playSound('sfx_special');

    // Boss name
    const nameText = this.add.text(cx, cy + 20, state.boss.name.toUpperCase(), {
      fontSize: '32px', fontFamily: 'Bangers', color: '#ef5350',
      letterSpacing: 3, stroke: '#000', strokeThickness: 3,
    }).setOrigin(0.5).setAlpha(0);
    this.tweens.add({ targets: nameText, alpha: 1, duration: 400, delay: 500 });

    // Title
    const titleText = this.add.text(cx, cy + 58, 'LEGENDARY SPIRITKIN', {
      fontSize: '11px', fontFamily: 'sans-serif', color: '#ffd54f',
      letterSpacing: 4,
    }).setOrigin(0.5).setAlpha(0);
    this.tweens.add({ targets: titleText, alpha: 1, duration: 400, delay: 600 });

    // Ability
    const abilityText = this.add.text(cx, cy + 100, state.boss.ability + ' — ' + state.boss.abilityDesc, {
      fontSize: '14px', fontFamily: 'sans-serif', color: '#cccccc',
      align: 'center', wordWrap: { width: 280 },
    }).setOrigin(0.5).setAlpha(0);
    this.tweens.add({ targets: abilityText, alpha: 1, duration: 400, delay: 700 });

    // Challenge button
    const btnY = cy + 180;
    const btnBg = this.add.graphics();
    btnBg.fillStyle(0xb71c1c, 1);
    btnBg.fillRoundedRect(cx - 100, btnY - 24, 200, 48, 24);

    const btnGlow = this.add.graphics();
    btnGlow.fillStyle(COLORS.enemy, 0.2);
    btnGlow.fillRoundedRect(cx - 108, btnY - 30, 216, 60, 30);

    const btnText = this.add.text(cx, btnY, 'CHALLENGE', {
      fontSize: '22px', fontFamily: 'Bangers', color: '#fff', letterSpacing: 2,
    }).setOrigin(0.5);

    const btnContainer = this.add.container(0, 0, [btnGlow, btnBg, btnText]).setAlpha(0);
    this.tweens.add({ targets: btnContainer, alpha: 1, duration: 300, delay: 900 });

    // Pulse
    this.tweens.add({
      targets: btnContainer, scaleX: 1.04, scaleY: 1.04,
      duration: 700, yoyo: true, repeat: -1, ease: 'Sine.easeInOut', delay: 1000,
    });

    const hitZone = this.add.zone(cx, btnY, 200, 48).setInteractive({ useHandCursor: true });
    hitZone.on('pointerdown', () => this.startBossBattle());

    this.cameras.main.fadeIn(300);
  }

  playSound(key) {
    try { this.sound.play(key, { volume: 0.5 }); } catch(e) {}
  }

  startBossBattle() {
    state.enemy = { ...state.boss };
    state.enemyHp = state.boss.maxHp;
    state.turn = 1;
    state.firstRoll = true;
    state.phase = 'boss-battle';

    this.cameras.main.fadeOut(200, 0, 0, 0);
    this.cameras.main.once('camerafadeoutcomplete', () => {
      this.scene.start('VSScene');
    });
  }
}

// ══════════════════════════════════════════════════════════════════
// CTA SCENE — Conversion screen
// ══════════════════════════════════════════════════════════════════

class CTAScene extends Phaser.Scene {
  constructor() { super('CTAScene'); }

  create(data) {
    setupHiDPI(this);
    const cx = W/2, cy = H/2;
    const won = data && data.won;

    // Background
    const bg = this.add.graphics();
    bg.fillGradientStyle(0x1a0a2e, 0x1a0a2e, 0x0a0a14, 0x0a0a14, 1);
    bg.fillRect(0, 0, W, H);

    // Result text
    const resultText = this.add.text(cx, cy - 120, won ? 'VICTORY!' : 'DEFEATED!', {
      fontSize: '48px', fontFamily: 'Bangers',
      color: won ? '#ffd54f' : '#ef5350',
      stroke: '#000', strokeThickness: 4,
    }).setOrigin(0.5).setScale(0.3).setAlpha(0);

    this.tweens.add({
      targets: resultText, scaleX: 1, scaleY: 1, alpha: 1,
      duration: 600, ease: 'Back.easeOut',
    });

    // Subtitle
    const subText = won
      ? 'You defeated ' + (state.boss?.name || 'the boss') + '! Think you can handle the full game? 100+ Spiritkin, epic battles, and a world to explore.'
      : 'The arena claims another challenger. 100+ Spiritkin and countless strategies await — every rematch tells a different story.';

    this.add.text(cx, cy - 40, subText, {
      fontSize: '14px', fontFamily: 'sans-serif', color: '#aaaaaa',
      align: 'center', wordWrap: { width: 280 }, lineSpacing: 4,
    }).setOrigin(0.5);

    // CTA button
    const btnY = cy + 60;
    const btnBg = this.add.graphics();
    btnBg.fillStyle(0xff8f00, 1);
    btnBg.fillRoundedRect(cx - 130, btnY - 24, 260, 48, 24);

    const btnGlow = this.add.graphics();
    btnGlow.fillStyle(COLORS.gold, 0.2);
    btnGlow.fillRoundedRect(cx - 136, btnY - 30, 272, 60, 30);

    const btnText = this.add.text(cx, btnY, 'BACK ON KICKSTARTER', {
      fontSize: '18px', fontFamily: 'Bangers', color: '#000', letterSpacing: 1,
    }).setOrigin(0.5);

    const btnContainer = this.add.container(0, 0, [btnGlow, btnBg, btnText]);
    this.tweens.add({
      targets: btnContainer, scaleX: 1.03, scaleY: 1.03,
      duration: 700, yoyo: true, repeat: -1, ease: 'Sine.easeInOut',
    });

    const ctaHit = this.add.zone(cx, btnY, 260, 48).setInteractive({ useHandCursor: true });
    ctaHit.on('pointerdown', () => {
      window.open('https://www.battleoforigins.com', '_blank');
    });

    // Play Again
    const replayText = this.add.text(cx, btnY + 60, 'Play Again', {
      fontSize: '16px', fontFamily: 'Bangers', color: '#7c3aed',
    }).setOrigin(0.5).setInteractive({ useHandCursor: true });
    replayText.on('pointerdown', () => {
      resetState();
      this.scene.start('SplashScene');
    });

    // Footer
    this.add.text(cx, H - 40, 'BATTLE OF ORIGINS  \u00b7  COMING SEPTEMBER 2026', {
      fontSize: '9px', fontFamily: 'sans-serif', color: '#444444', letterSpacing: 2,
    }).setOrigin(0.5);

    // Particles
    if (won) {
      // Confetti
      const colors = [0xffd54f, 0xef5350, 0x4fc3f7, 0x22c55e, 0x7c3aed];
      colors.forEach(col => {
        const gfx = this.make.graphics({ add: false });
        gfx.fillStyle(col, 1);
        gfx.fillRect(0, 0, 6, 6);
        gfx.generateTexture('confetti_' + col, 6, 6);
        gfx.destroy();
        this.add.particles(0, 0, 'confetti_' + col, {
          x: { min: 0, max: W }, y: -10,
          lifespan: 3000, speed: { min: 40, max: 100 },
          angle: { min: 80, max: 100 },
          rotate: { min: 0, max: 360 },
          scale: { start: 1, end: 0.3 },
          alpha: { start: 1, end: 0 },
          frequency: 200, quantity: 1,
        });
      });
    }

    // Play win sound
    if (won) {
      try { this.sound.play('sfx_win', { volume: 0.5 }); } catch(e) {}
    }

    this.cameras.main.fadeIn(400);
  }
}

// ══════════════════════════════════════════════════════════════════
// GAME INIT
// ══════════════════════════════════════════════════════════════════

// Wait for Bangers font to load
document.fonts.ready.then(() => {
  // Render at DPR-scaled resolution for crisp HiDPI output
  // Game logic uses 430×932 coordinates; camera zoom handles the mapping
  const gameW = Math.round(W * DPR);
  const gameH = Math.round(H * DPR);
  const config = {
    type: Phaser.AUTO,
    parent: 'game-container',
    width: gameW,
    height: gameH,
    backgroundColor: '#0a0a14',
    scale: {
      mode: Phaser.Scale.FIT,
      autoCenter: Phaser.Scale.CENTER_BOTH,
    },
    render: {
      antialias: true,
    },
    scene: [BootScene, SplashScene, SelectScene, VSScene, ArenaScene, BossScene, CTAScene],
  };

  const game = new Phaser.Game(config);
});
</script>
