<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>LADDER — Drill Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface-2: #1c1c1c;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --text-dim: #888;
    --accent: #c8ff00;
    --accent-dim: rgba(200, 255, 0, 0.15);
    --danger: #ff3b3b;
    --danger-dim: rgba(255, 59, 59, 0.12);
    --gold: #ffd700;
    --radius: 14px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
    overflow: hidden;
  }

  /* noise */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 200px;
    pointer-events: none;
    z-index: 0;
  }

  /* ladder bg decoration */
  .ladder-bg {
    position: fixed;
    right: -30px;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0.025;
    pointer-events: none;
    z-index: 0;
  }

  /* ── VIEWS ── */
  .view { display: none; flex-direction: column; height: 100%; }
  .view.active { display: flex; }

  #app {
    position: relative;
    z-index: 1;
    height: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding: 0 16px;
    padding-bottom: var(--safe-bottom);
  }

  /* ── HEADER ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 0 6px;
    flex-shrink: 0;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    letter-spacing: 4px;
    color: var(--accent);
    line-height: 1;
    cursor: pointer;
  }
  .logo span {
    color: var(--text-dim);
    font-size: 13px;
    letter-spacing: 2px;
    margin-left: 5px;
  }

  .header-actions {
    display: flex;
    gap: 6px;
  }

  .header-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-family: 'Barlow', sans-serif;
    font-weight: 600;
    font-size: 11px;
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: border-color 0.15s, color 0.15s;
  }
  .header-btn:active { border-color: var(--accent); color: var(--text); }
  .header-btn svg { width: 14px; height: 14px; }

  /* ── GROUP BAR ── */
  .group-bar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--accent-dim);
    border: 1px solid rgba(200, 255, 0, 0.2);
    border-radius: 10px;
    margin-bottom: 8px;
  }
  .group-bar .group-icon { font-size: 16px; }
  .group-bar .group-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: var(--accent);
    letter-spacing: 0.5px;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .group-bar .group-share-btn {
    background: var(--accent);
    color: #0a0a0a;
    border: none;
    border-radius: 6px;
    padding: 4px 10px;
    font-family: 'Barlow', sans-serif;
    font-weight: 700;
    font-size: 11px;
    cursor: pointer;
    letter-spacing: 0.5px;
  }
  .group-bar .group-share-btn:active { opacity: 0.8; }

  /* ── DRILL PICKER ── */
  .drill-picker {
    flex-shrink: 0;
    display: flex;
    gap: 6px;
    padding: 4px 0 8px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .drill-picker::-webkit-scrollbar { display: none; }

  .drill-chip {
    flex-shrink: 0;
    padding: 8px 14px;
    border-radius: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-family: 'Barlow', sans-serif;
    font-weight: 600;
    font-size: 13px;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .drill-chip.active {
    background: var(--accent);
    color: #0a0a0a;
    border-color: var(--accent);
  }
  .drill-chip:active { transform: scale(0.96); }

  /* ── PB STRIP ── */
  .pb-strip {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 8px;
  }
  .pb-strip .trophy { font-size: 18px; line-height: 1; }
  .pb-strip .pb-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-dim);
  }
  .pb-strip .pb-time {
    margin-left: auto;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    color: var(--gold);
    letter-spacing: 1px;
    line-height: 1;
  }
  .pb-strip .pb-time.empty {
    color: var(--text-dim);
    font-size: 13px;
    font-family: 'Barlow', sans-serif;
    font-weight: 500;
  }

  /* ── TIMER ZONE ── */
  .timer-zone {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 0;
  }

  .timer-display {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(64px, 20vw, 100px);
    letter-spacing: 2px;
    line-height: 1;
    color: var(--text);
    transition: color 0.15s;
    position: relative;
  }
  .timer-display.running { color: var(--accent); }
  .timer-display .hundredths { font-size: 0.5em; opacity: 0.7; }

  .pulse-ring {
    position: absolute;
    width: 180px; height: 180px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    opacity: 0;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.5);
    pointer-events: none;
  }
  .timer-display.running .pulse-ring {
    animation: pulse 1.5s ease-out infinite;
  }
  @keyframes pulse {
    0% { opacity: 0.4; transform: translate(-50%, -50%) scale(0.6); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.4); }
  }

  .go-btn {
    width: 100%;
    max-width: 360px;
    padding: 20px;
    border: none;
    border-radius: var(--radius);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 30px;
    letter-spacing: 6px;
    cursor: pointer;
    transition: transform 0.1s, background 0.15s;
    margin-top: 6px;
  }
  .go-btn:active { transform: scale(0.97); }
  .go-btn.ready { background: var(--accent); color: #0a0a0a; }
  .go-btn.stop {
    background: var(--danger); color: #fff;
    animation: btn-glow 1.2s ease-in-out infinite alternate;
  }
  @keyframes btn-glow {
    from { box-shadow: 0 0 20px rgba(255, 59, 59, 0.3); }
    to { box-shadow: 0 0 40px rgba(255, 59, 59, 0.5); }
  }

  /* ── TABS (Session / Leaderboard) ── */
  .tab-bar {
    flex-shrink: 0;
    display: flex;
    margin-top: 10px;
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    flex: 1;
    background: none;
    border: none;
    padding: 10px 0;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-dim);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
  }
  .tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  /* ── TAB CONTENT ── */
  .tab-content { display: none; flex: 1; min-height: 0; flex-direction: column; overflow: hidden; }
  .tab-content.active { display: flex; }

  /* ── SESSION CHART ── */
  .chart-container {
    flex-shrink: 0;
    padding: 10px 0 4px;
    position: relative;
  }
  .chart-container canvas {
    width: 100%;
    height: 120px;
    border-radius: 10px;
  }
  .chart-empty {
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 13px;
    background: var(--surface);
    border-radius: 10px;
    border: 1px solid var(--border);
  }

  /* ── RUN LIST ── */
  .run-list-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0 6px;
    flex-shrink: 0;
  }
  .run-list-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-dim);
  }
  .undo-btn {
    display: none;
    align-items: center;
    gap: 4px;
    background: var(--danger-dim);
    border: 1px solid rgba(255, 59, 59, 0.25);
    border-radius: 8px;
    padding: 5px 10px;
    font-family: 'Barlow', sans-serif;
    font-weight: 600;
    font-size: 11px;
    color: var(--danger);
    cursor: pointer;
    letter-spacing: 0.5px;
  }
  .undo-btn.visible { display: flex; }
  .undo-btn:active { background: rgba(255, 59, 59, 0.25); }
  .undo-btn svg { width: 12px; height: 12px; }

  .run-list {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 16px;
  }
  .run-list::-webkit-scrollbar { width: 0; }

  .run-item {
    display: flex;
    align-items: center;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 5px;
    animation: slideIn 0.2s ease-out;
  }
  .run-item.best {
    border-color: rgba(255, 215, 0, 0.3);
    background: rgba(255, 215, 0, 0.05);
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .run-num {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 13px;
    color: var(--text-dim);
    width: 26px;
    text-align: center;
    flex-shrink: 0;
  }
  .run-num.gold { color: var(--gold); }
  .run-info { flex: 1; min-width: 0; }
  .run-time {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 1px;
    line-height: 1;
  }
  .run-time .frac { font-size: 0.55em; opacity: 0.6; }
  .run-meta { font-size: 10px; color: var(--text-dim); margin-top: 1px; }
  .run-badge {
    flex-shrink: 0;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    padding: 3px 7px;
    border-radius: 6px;
    background: rgba(255, 215, 0, 0.12);
    color: var(--gold);
  }
  .run-delta {
    flex-shrink: 0;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.5px;
    margin-right: 6px;
  }
  .run-delta.faster { color: #4ade80; }
  .run-delta.slower { color: var(--danger); }

  /* ── LEADERBOARD TAB ── */
  .lb-list {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 10px 0 16px;
  }
  .lb-list::-webkit-scrollbar { width: 0; }

  .lb-item {
    display: flex;
    align-items: center;
    padding: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 5px;
  }
  .lb-item.you { border-color: rgba(200, 255, 0, 0.3); background: var(--accent-dim); }
  .lb-rank {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    width: 36px;
    text-align: center;
    flex-shrink: 0;
    color: var(--text-dim);
  }
  .lb-rank.r1 { color: var(--gold); }
  .lb-rank.r2 { color: #c0c0c0; }
  .lb-rank.r3 { color: #cd7f32; }
  .lb-info { flex: 1; min-width: 0; }
  .lb-name {
    font-family: 'Barlow', sans-serif;
    font-weight: 700;
    font-size: 15px;
    line-height: 1;
  }
  .lb-detail { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .lb-best {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    letter-spacing: 1px;
    flex-shrink: 0;
  }
  .lb-best .frac { font-size: 0.55em; opacity: 0.6; }

  .lb-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    line-height: 1.5;
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
    text-align: center;
  }
  .empty-state p { color: var(--text-dim); font-size: 13px; line-height: 1.5; }

  /* ── SETUP VIEW ── */
  .setup-view {
    justify-content: center;
    align-items: center;
    padding: 0 24px;
    text-align: center;
  }
  .setup-view .logo-big {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    letter-spacing: 6px;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .setup-view .tagline {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--text-dim);
    margin-bottom: 32px;
  }
  .setup-field {
    width: 100%;
    max-width: 320px;
    margin-bottom: 12px;
  }
  .setup-field label {
    display: block;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-dim);
    margin-bottom: 6px;
    text-align: left;
  }
  .setup-field input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    font-family: 'Barlow', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }
  .setup-field input::placeholder { color: #555; }
  .setup-field input:focus { border-color: var(--accent); }

  .setup-go-btn {
    width: 100%;
    max-width: 320px;
    padding: 18px;
    margin-top: 8px;
    border: none;
    border-radius: var(--radius);
    background: var(--accent);
    color: #0a0a0a;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 5px;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .setup-go-btn:active { transform: scale(0.97); }
  .setup-go-btn:disabled { opacity: 0.3; cursor: default; }

  .setup-or {
    color: var(--text-dim);
    font-size: 12px;
    margin: 16px 0;
  }
  .setup-solo-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 24px;
    font-family: 'Barlow', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: var(--text-dim);
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .setup-solo-btn:active { border-color: var(--text-dim); color: var(--text); }

  /* ── CLEAR BTN ── */
  .clear-btn {
    display: none;
    margin: 2px auto 8px;
    background: none;
    border: none;
    font-family: 'Barlow', sans-serif;
    font-size: 11px;
    font-weight: 500;
    color: #555;
    cursor: pointer;
    padding: 4px 10px;
  }
  .clear-btn.visible { display: block; }
  .clear-btn:active { color: var(--danger); }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 20px;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    z-index: 100;
    opacity: 0;
    transition: all 0.3s ease;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<svg class="ladder-bg" width="120" height="600" viewBox="0 0 120 600" fill="none">
  <rect x="10" y="0" width="8" height="600" rx="4" fill="white"/>
  <rect x="102" y="0" width="8" height="600" rx="4" fill="white"/>
  <rect x="10" y="40" width="100" height="6" rx="3" fill="white"/>
  <rect x="10" y="100" width="100" height="6" rx="3" fill="white"/>
  <rect x="10" y="160" width="100" height="6" rx="3" fill="white"/>
  <rect x="10" y="220" width="100" height="6" rx="3" fill="white"/>
  <rect x="10" y="280" width="100" height="6" rx="3" fill="white"/>
  <rect x="10" y="340" width="100" height="6" rx="3" fill="white"/>
  <rect x="10" y="400" width="100" height="6" rx="3" fill="white"/>
  <rect x="10" y="460" width="100" height="6" rx="3" fill="white"/>
  <rect x="10" y="520" width="100" height="6" rx="3" fill="white"/>
  <rect x="10" y="580" width="100" height="6" rx="3" fill="white"/>
</svg>

<div id="app">

  <!-- ════ SETUP VIEW ════ -->
  <div id="setupView" class="view setup-view">
    <div class="logo-big">LADDER</div>
    <div class="tagline">Agility Drill Timer</div>

    <div class="setup-field">
      <label>Your Name</label>
      <input type="text" id="setupName" placeholder="Enter your name" maxlength="24" autocomplete="off" spellcheck="false">
    </div>

    <div class="setup-field">
      <label>Group Code (optional)</label>
      <input type="text" id="setupGroup" placeholder="e.g. garage-crew" maxlength="30" autocomplete="off" spellcheck="false">
    </div>

    <button class="setup-go-btn" id="setupGoBtn">LET'S GO</button>

    <div class="setup-or">or</div>
    <button class="setup-solo-btn" id="setupSoloBtn">Train Solo</button>
  </div>

  <!-- ════ MAIN VIEW ════ -->
  <div id="mainView" class="view">

    <div class="header">
      <div class="logo" id="logoBtn">LADDER <span>DRILL TIMER</span></div>
      <div class="header-actions">
        <button class="header-btn" id="chartToggleBtn" title="Toggle chart">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        </button>
      </div>
    </div>

    <!-- Group bar (shown when in a group) -->
    <div class="group-bar" id="groupBar" style="display:none">
      <div class="group-icon">&#x1F465;</div>
      <div class="group-name" id="groupNameDisplay"></div>
      <button class="group-share-btn" id="shareBtn">INVITE</button>
    </div>

    <!-- Drill Picker -->
    <div class="drill-picker" id="drillPicker"></div>

    <!-- PB -->
    <div class="pb-strip">
      <div class="trophy">&#x1F3C6;</div>
      <div class="pb-label">Best</div>
      <div class="pb-time empty" id="pbDisplay">No runs</div>
    </div>

    <!-- Timer -->
    <div class="timer-zone">
      <div class="timer-display" id="timerDisplay">
        0<span class="hundredths">.00</span>
        <div class="pulse-ring"></div>
      </div>
      <button class="go-btn ready" id="goBtn">START</button>
    </div>

    <!-- Tabs -->
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="session">Session</button>
      <button class="tab-btn" data-tab="leaderboard">Leaderboard</button>
    </div>

    <!-- Session Tab -->
    <div class="tab-content active" id="tabSession">
      <div class="chart-container" id="chartContainer">
        <div class="chart-empty" id="chartEmpty">Run a few drills to see your session chart</div>
        <canvas id="sessionChart" style="display:none"></canvas>
      </div>

      <div class="run-list-header">
        <div class="run-list-title">This Session</div>
        <button class="undo-btn" id="undoBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          UNDO
        </button>
      </div>

      <div class="run-list" id="runList">
        <div class="empty-state" id="emptyRuns">
          <p>Hit START and run the ladder.<br>Your times show up here.</p>
        </div>
      </div>
      <button class="clear-btn" id="clearBtn">Clear session</button>
    </div>

    <!-- Leaderboard Tab -->
    <div class="tab-content" id="tabLeaderboard">
      <div class="lb-list" id="lbList">
        <div class="lb-empty" id="lbEmpty">
          <p>Best times for each person appear here.<br>Invite friends to compete!</p>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
  // ── DRILLS ──
  const DRILLS = [
    { id: 'icky', name: 'Icky Shuffle' },
    { id: '2in2out', name: '2-In 2-Out' },
    { id: 'side', name: 'Side Shuffle' },
    { id: 'bunny', name: 'Bunny Hops' },
    { id: 'ali', name: 'Ali Shuffle' },
  ];

  // ── STATE ──
  let userName = localStorage.getItem('ladder_name') || '';
  let groupId = '';
  let currentDrill = DRILLS[0].id;
  let isRunning = false;
  let startTime = 0;
  let animFrame = null;
  let chartVisible = true;

  // Storage key helpers
  function storageKey() {
    const g = groupId || '_solo';
    return `ladder_${g}_${currentDrill}`;
  }
  function allDataKey() {
    const g = groupId || '_solo';
    return `ladder_${g}_all`;
  }

  function getRuns() {
    return JSON.parse(localStorage.getItem(storageKey()) || '[]');
  }
  function saveRuns(runs) {
    localStorage.setItem(storageKey(), JSON.stringify(runs));
    // Also save to the all-data index for leaderboard
    saveToAllData(runs);
  }

  function saveToAllData(runs) {
    const key = allDataKey();
    const all = JSON.parse(localStorage.getItem(key) || '{}');
    if (!all[currentDrill]) all[currentDrill] = {};
    // Store best time per user for this drill
    const byUser = {};
    runs.forEach(r => {
      if (!byUser[r.name] || r.time < byUser[r.name].time) {
        byUser[r.name] = { time: r.time, date: r.date, count: 0 };
      }
      if (!byUser[r.name].count) byUser[r.name].count = 0;
      byUser[r.name].count++;
    });
    // Merge counts
    runs.forEach(r => {
      if (byUser[r.name]) {
        byUser[r.name].count = runs.filter(x => x.name === r.name).length;
      }
    });
    all[currentDrill] = byUser;
    localStorage.setItem(key, JSON.stringify(all));
  }

  // ── ELEMENTS ──
  const setupView = document.getElementById('setupView');
  const mainView = document.getElementById('mainView');
  const setupName = document.getElementById('setupName');
  const setupGroup = document.getElementById('setupGroup');
  const setupGoBtn = document.getElementById('setupGoBtn');
  const setupSoloBtn = document.getElementById('setupSoloBtn');
  const groupBar = document.getElementById('groupBar');
  const groupNameDisplay = document.getElementById('groupNameDisplay');
  const shareBtn = document.getElementById('shareBtn');
  const drillPicker = document.getElementById('drillPicker');
  const pbDisplay = document.getElementById('pbDisplay');
  const timerDisplay = document.getElementById('timerDisplay');
  const goBtn = document.getElementById('goBtn');
  const undoBtn = document.getElementById('undoBtn');
  const runList = document.getElementById('runList');
  const emptyRuns = document.getElementById('emptyRuns');
  const clearBtn = document.getElementById('clearBtn');
  const chartContainer = document.getElementById('chartContainer');
  const chartEmpty = document.getElementById('chartEmpty');
  const sessionChart = document.getElementById('sessionChart');
  const chartToggleBtn = document.getElementById('chartToggleBtn');
  const lbList = document.getElementById('lbList');
  const lbEmpty = document.getElementById('lbEmpty');
  const logoBtn = document.getElementById('logoBtn');
  const toast = document.getElementById('toast');

  // ── SETUP ──
  function checkAutoStart() {
    // If URL has a group hash, pre-fill
    const hash = location.hash.slice(1);
    if (hash) {
      setupGroup.value = hash;
    }
    // If returning user with a name, skip setup
    if (userName) {
      setupName.value = userName;
      if (hash) {
        groupId = hash;
        enterMain();
        return;
      }
      // If they had a previous group
      const prevGroup = localStorage.getItem('ladder_group') || '';
      if (prevGroup) {
        groupId = prevGroup;
        enterMain();
        return;
      }
      // Solo return
      enterMain();
      return;
    }
    setupView.classList.add('active');
  }

  function enterMain() {
    setupView.classList.remove('active');
    mainView.classList.add('active');
    localStorage.setItem('ladder_name', userName);
    if (groupId) {
      localStorage.setItem('ladder_group', groupId);
      location.hash = groupId;
      groupBar.style.display = 'flex';
      groupNameDisplay.textContent = groupId;
    } else {
      groupBar.style.display = 'none';
    }
    buildDrillPicker();
    render();
  }

  setupGoBtn.addEventListener('click', () => {
    userName = setupName.value.trim();
    if (!userName) { setupName.focus(); return; }
    groupId = setupGroup.value.trim().toLowerCase().replace(/[^a-z0-9\-]/g, '');
    enterMain();
  });

  setupSoloBtn.addEventListener('click', () => {
    userName = setupName.value.trim() || 'Me';
    groupId = '';
    enterMain();
  });

  // Enter key on inputs
  setupName.addEventListener('keydown', e => { if (e.key === 'Enter') setupGoBtn.click(); });
  setupGroup.addEventListener('keydown', e => { if (e.key === 'Enter') setupGoBtn.click(); });

  // Logo → back to setup
  logoBtn.addEventListener('click', () => {
    if (isRunning) return;
    mainView.classList.remove('active');
    setupView.classList.add('active');
    setupName.value = userName;
    setupGroup.value = groupId;
  });

  // ── SHARE ──
  shareBtn.addEventListener('click', () => {
    const url = location.origin + location.pathname + '#' + groupId;
    if (navigator.share) {
      navigator.share({ title: 'Join my Ladder group!', text: `Join "${groupId}" on Ladder Drill Timer`, url });
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(url);
      showToast('Link copied!');
    }
  });

  // ── DRILL PICKER ──
  function buildDrillPicker() {
    drillPicker.innerHTML = '';
    DRILLS.forEach(d => {
      const chip = document.createElement('button');
      chip.className = 'drill-chip' + (d.id === currentDrill ? ' active' : '');
      chip.textContent = d.name;
      chip.addEventListener('click', () => {
        if (isRunning) return;
        currentDrill = d.id;
        drillPicker.querySelectorAll('.drill-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        render();
      });
      drillPicker.appendChild(chip);
    });
  }

  // ── TIMER ──
  function formatTime(ms) {
    const secs = ms / 1000;
    const whole = Math.floor(secs);
    const frac = Math.floor((secs - whole) * 100).toString().padStart(2, '0');
    return { whole: whole.toString(), frac };
  }
  function formatStr(ms) {
    const t = formatTime(ms);
    return t.whole + '.' + t.frac;
  }

  function updateTimerEl(ms) {
    const t = formatTime(ms);
    timerDisplay.innerHTML = `${t.whole}<span class="hundredths">.${t.frac}</span><div class="pulse-ring"></div>`;
  }

  function tick() {
    if (!isRunning) return;
    updateTimerEl(performance.now() - startTime);
    animFrame = requestAnimationFrame(tick);
  }

  goBtn.addEventListener('click', () => {
    if (!isRunning) {
      isRunning = true;
      startTime = performance.now();
      goBtn.textContent = 'STOP';
      goBtn.classList.remove('ready');
      goBtn.classList.add('stop');
      timerDisplay.classList.add('running');
      tick();
    } else {
      isRunning = false;
      cancelAnimationFrame(animFrame);
      const elapsed = performance.now() - startTime;
      timerDisplay.classList.remove('running');
      goBtn.textContent = 'START';
      goBtn.classList.remove('stop');
      goBtn.classList.add('ready');
      updateTimerEl(elapsed);
      recordRun(elapsed);
    }
  });

  function recordRun(ms) {
    const runs = getRuns();
    runs.unshift({
      time: Math.round(ms),
      name: userName,
      date: Date.now()
    });
    saveRuns(runs);
    render();
  }

  // ── UNDO ──
  undoBtn.addEventListener('click', () => {
    const runs = getRuns();
    if (runs.length === 0) return;
    runs.shift();
    saveRuns(runs);
    render();
    updateTimerEl(0);
  });

  // ── CLEAR ──
  clearBtn.addEventListener('click', () => {
    const runs = getRuns();
    if (runs.length === 0) return;
    saveRuns([]);
    render();
    updateTimerEl(0);
  });

  // ── TABS ──
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab' + btn.dataset.tab.charAt(0).toUpperCase() + btn.dataset.tab.slice(1)).classList.add('active');
      if (btn.dataset.tab === 'leaderboard') renderLeaderboard();
    });
  });

  // ── CHART TOGGLE ──
  chartToggleBtn.addEventListener('click', () => {
    chartVisible = !chartVisible;
    chartContainer.style.display = chartVisible ? 'block' : 'none';
    chartToggleBtn.style.color = chartVisible ? 'var(--accent)' : 'var(--text-dim)';
  });

  // ── RENDER ──
  function render() {
    const runs = getRuns();
    const myRuns = runs.filter(r => r.name === userName);

    // PB
    if (myRuns.length === 0) {
      pbDisplay.textContent = 'No runs';
      pbDisplay.classList.add('empty');
    } else {
      const best = Math.min(...myRuns.map(r => r.time));
      pbDisplay.textContent = formatStr(best) + 's';
      pbDisplay.classList.remove('empty');
    }

    // Undo
    undoBtn.classList.toggle('visible', runs.length > 0 && runs[0].name === userName);
    clearBtn.classList.toggle('visible', runs.length > 2);

    // Run list
    if (runs.length === 0) {
      emptyRuns.style.display = 'flex';
      runList.querySelectorAll('.run-item').forEach(el => el.remove());
    } else {
      emptyRuns.style.display = 'none';
      const bestTime = Math.min(...runs.map(r => r.time));

      let html = '';
      runs.forEach((run, i) => {
        const isBest = run.time === bestTime;
        const t = formatTime(run.time);
        const runIndex = runs.length - i; // chronological order number

        // Delta from previous run (the one recorded before this one)
        let deltaHtml = '';
        if (i < runs.length - 1) {
          const prev = runs[i + 1]; // previous in time (runs are newest first)
          const diff = run.time - prev.time;
          if (Math.abs(diff) >= 10) {
            const sign = diff < 0 ? '-' : '+';
            const cls = diff < 0 ? 'faster' : 'slower';
            deltaHtml = `<div class="run-delta ${cls}">${sign}${formatStr(Math.abs(diff))}</div>`;
          }
        }

        html += `
          <div class="run-item${isBest ? ' best' : ''}">
            <div class="run-num${isBest ? ' gold' : ''}">${runIndex}</div>
            <div class="run-info">
              <div class="run-time">${t.whole}<span class="frac">.${t.frac}s</span></div>
              <div class="run-meta">${run.name} &middot; ${drillLabel(currentDrill)}</div>
            </div>
            ${deltaHtml}
            ${isBest ? '<div class="run-badge">PR</div>' : ''}
          </div>
        `;
      });

      runList.querySelectorAll('.run-item').forEach(el => el.remove());
      emptyRuns.insertAdjacentHTML('beforebegin', html);
    }

    // Chart
    renderChart(runs);
  }

  function drillLabel(id) {
    const d = DRILLS.find(x => x.id === id);
    return d ? d.name : id;
  }

  // ── SESSION CHART ──
  function renderChart(runs) {
    if (runs.length < 2) {
      chartEmpty.style.display = 'flex';
      sessionChart.style.display = 'none';
      return;
    }
    chartEmpty.style.display = 'none';
    sessionChart.style.display = 'block';

    const canvas = sessionChart;
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = 120 * dpr;
    canvas.style.height = '120px';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    const W = rect.width;
    const H = 120;

    // Data in chronological order (oldest first)
    const data = [...runs].reverse().map(r => r.time / 1000);
    const minVal = Math.min(...data);
    const maxVal = Math.max(...data);
    const range = maxVal - minVal || 1;
    const pad = { top: 18, bottom: 24, left: 8, right: 8 };
    const plotW = W - pad.left - pad.right;
    const plotH = H - pad.top - pad.bottom;

    function x(i) { return pad.left + (i / (data.length - 1)) * plotW; }
    function y(v) { return pad.top + plotH - ((v - minVal) / range) * plotH; }

    // Background
    ctx.fillStyle = '#141414';
    ctx.beginPath();
    ctx.roundRect(0, 0, W, H, 10);
    ctx.fill();

    // Grid lines
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 0.5;
    for (let i = 0; i <= 4; i++) {
      const gy = pad.top + (plotH / 4) * i;
      ctx.beginPath();
      ctx.moveTo(pad.left, gy);
      ctx.lineTo(W - pad.right, gy);
      ctx.stroke();
    }

    // Best time line
    const bestY = y(minVal);
    ctx.strokeStyle = 'rgba(255, 215, 0, 0.3)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(pad.left, bestY);
    ctx.lineTo(W - pad.right, bestY);
    ctx.stroke();
    ctx.setLineDash([]);

    // Area fill
    const gradient = ctx.createLinearGradient(0, pad.top, 0, H - pad.bottom);
    gradient.addColorStop(0, 'rgba(200, 255, 0, 0.15)');
    gradient.addColorStop(1, 'rgba(200, 255, 0, 0.0)');
    ctx.beginPath();
    ctx.moveTo(x(0), y(data[0]));
    for (let i = 1; i < data.length; i++) {
      ctx.lineTo(x(i), y(data[i]));
    }
    ctx.lineTo(x(data.length - 1), H - pad.bottom);
    ctx.lineTo(x(0), H - pad.bottom);
    ctx.closePath();
    ctx.fillStyle = gradient;
    ctx.fill();

    // Line
    ctx.beginPath();
    ctx.moveTo(x(0), y(data[0]));
    for (let i = 1; i < data.length; i++) {
      ctx.lineTo(x(i), y(data[i]));
    }
    ctx.strokeStyle = '#c8ff00';
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.stroke();

    // Dots
    data.forEach((v, i) => {
      const isBest = v === minVal;
      ctx.beginPath();
      ctx.arc(x(i), y(v), isBest ? 5 : 3, 0, Math.PI * 2);
      ctx.fillStyle = isBest ? '#ffd700' : '#c8ff00';
      ctx.fill();
      if (isBest) {
        ctx.strokeStyle = 'rgba(255, 215, 0, 0.4)';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    });

    // Labels: first, last, best
    ctx.font = '600 10px Barlow';
    ctx.textAlign = 'center';
    // First
    ctx.fillStyle = '#888';
    ctx.fillText(data[0].toFixed(2) + 's', x(0), y(data[0]) - 8);
    // Last
    if (data.length > 1) {
      ctx.fillStyle = '#c8ff00';
      ctx.fillText(data[data.length - 1].toFixed(2) + 's', x(data.length - 1), y(data[data.length - 1]) - 8);
    }
    // Run numbers at bottom
    ctx.fillStyle = '#555';
    ctx.font = '500 9px Barlow';
    if (data.length <= 20) {
      data.forEach((_, i) => {
        ctx.fillText(i + 1, x(i), H - 6);
      });
    } else {
      // Just show first, middle, last
      ctx.fillText('1', x(0), H - 6);
      ctx.fillText(Math.ceil(data.length / 2), x(Math.floor(data.length / 2)), H - 6);
      ctx.fillText(data.length, x(data.length - 1), H - 6);
    }
  }

  // ── LEADERBOARD ──
  function renderLeaderboard() {
    const key = allDataKey();
    const all = JSON.parse(localStorage.getItem(key) || '{}');
    const drillData = all[currentDrill] || {};
    const entries = Object.entries(drillData)
      .map(([name, d]) => ({ name, time: d.time, count: d.count || 0, date: d.date }))
      .sort((a, b) => a.time - b.time);

    if (entries.length === 0) {
      lbEmpty.style.display = 'flex';
      lbList.querySelectorAll('.lb-item').forEach(el => el.remove());
      return;
    }

    lbEmpty.style.display = 'none';
    let html = '';
    entries.forEach((e, i) => {
      const rank = i + 1;
      const t = formatTime(e.time);
      const isYou = e.name === userName;
      const rankCls = rank <= 3 ? ` r${rank}` : '';

      html += `
        <div class="lb-item${isYou ? ' you' : ''}">
          <div class="lb-rank${rankCls}">${rank}</div>
          <div class="lb-info">
            <div class="lb-name">${e.name}${isYou ? ' (you)' : ''}</div>
            <div class="lb-detail">${e.count} run${e.count !== 1 ? 's' : ''} &middot; ${drillLabel(currentDrill)}</div>
          </div>
          <div class="lb-best">${t.whole}<span class="frac">.${t.frac}s</span></div>
        </div>
      `;
    });

    lbList.querySelectorAll('.lb-item').forEach(el => el.remove());
    lbEmpty.insertAdjacentHTML('beforebegin', html);
  }

  // ── TOAST ──
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  }

  // ── KEYBOARD ──
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
      e.preventDefault();
      goBtn.click();
    }
  });

  // ── HASH CHANGE ──
  window.addEventListener('hashchange', () => {
    const hash = location.hash.slice(1);
    if (hash && hash !== groupId) {
      groupId = hash;
      localStorage.setItem('ladder_group', groupId);
      if (mainView.classList.contains('active')) {
        groupBar.style.display = 'flex';
        groupNameDisplay.textContent = groupId;
        render();
      }
    }
  });

  // ── INIT ──
  checkAutoStart();
})();
</script>
</body>
</html>
