<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOO! Spirit Battles — Build Your Squad</title>
<meta property="og:title" content="BOO! Spirit Battles — Build Your Squad">
<meta property="og:description" content="Browse ghost cards, read abilities, and build your dream 5-card team. Coming to Kickstarter September 2026.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@400;500;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --light: #67e8f9;
    --light-glow: rgba(103, 232, 249, 0.3);
    --shadow: #c084fc;
    --shadow-glow: rgba(192, 132, 252, 0.3);
    --bg: #080810;
    --card-bg: rgba(255,255,255,0.04);
    --gold: #fbbf24;
  }

  body {
    background: var(--bg);
    color: #e0e0e0;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse at 15% 30%, rgba(34, 211, 238, 0.05) 0%, transparent 50%),
      radial-gradient(ellipse at 85% 70%, rgba(124, 58, 237, 0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px 16px 100px;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 24px;
  }

  .header h1 {
    font-family: 'Creepster', cursive;
    font-size: 2.8rem;
    background: linear-gradient(135deg, #67e8f9, #22d3ee, #a78bfa, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 3px;
  }

  .header .subtitle {
    font-size: 0.95rem;
    color: #888;
    margin-top: 4px;
  }

  .header .subtitle span { color: var(--gold); font-weight: 700; }

  /* Squad Area - Fixed at top */
  .squad-section {
    position: sticky;
    top: 0;
    z-index: 100;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg) 85%, transparent 100%);
    padding: 16px 0 24px;
    margin-bottom: 16px;
  }

  .squad-bar {
    display: flex;
    align-items: stretch;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .squad-slot {
    width: 110px;
    height: 154px;
    border: 2px dashed rgba(255,255,255,0.15);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: default;
    transition: all 0.3s;
    background: rgba(255,255,255,0.02);
    flex-shrink: 0;
  }

  .squad-slot.empty-hint {
    flex-direction: column;
    gap: 4px;
    color: #444;
    font-size: 0.7rem;
  }

  .squad-slot.empty-hint .slot-num {
    font-family: 'Creepster', cursive;
    font-size: 1.4rem;
    opacity: 0.3;
  }

  .squad-slot.filled {
    border-color: transparent;
    cursor: pointer;
    overflow: hidden;
    background: none;
  }

  .squad-slot.filled img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
  }

  .squad-slot.filled .remove-btn {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 22px;
    height: 22px;
    background: rgba(0,0,0,0.8);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 50%;
    color: #ff6b6b;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s;
    line-height: 1;
  }

  .squad-slot.filled:hover .remove-btn { opacity: 1; }

  .squad-slot.light-slot { border-color: var(--light); box-shadow: 0 0 20px var(--light-glow); }
  .squad-slot.shadow-slot { border-color: var(--shadow); box-shadow: 0 0 20px var(--shadow-glow); }

  /* Synergy Display */
  .synergy-bar {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-top: 14px;
    flex-wrap: wrap;
    align-items: center;
  }

  .synergy-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    font-weight: 600;
    opacity: 0.4;
    transition: all 0.3s;
  }

  .synergy-item.active { opacity: 1; }

  .synergy-item .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  .synergy-item.light-synergy .dot { background: var(--light); box-shadow: 0 0 8px var(--light-glow); }
  .synergy-item.shadow-synergy .dot { background: var(--shadow); box-shadow: 0 0 8px var(--shadow-glow); }
  .synergy-item.balance-synergy .dot {
    background: linear-gradient(135deg, var(--light), var(--shadow));
    box-shadow: 0 0 8px rgba(150, 150, 250, 0.3);
  }

  .synergy-bonus {
    background: rgba(251, 191, 36, 0.15);
    border: 1px solid rgba(251, 191, 36, 0.3);
    color: var(--gold);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
    animation: pulseGold 2s infinite;
    display: none;
  }

  .synergy-bonus.visible { display: inline-block; }

  @keyframes pulseGold {
    0%, 100% { box-shadow: 0 0 8px rgba(251, 191, 36, 0.2); }
    50% { box-shadow: 0 0 16px rgba(251, 191, 36, 0.4); }
  }

  /* Squad Stats */
  .squad-stats {
    text-align: center;
    margin-top: 10px;
    font-size: 0.8rem;
    color: #666;
    min-height: 20px;
  }

  .squad-stats span { font-weight: 700; }
  .squad-stats .atk { color: #f87171; }
  .squad-stats .hp { color: #34d399; }

  /* Filter/Search */
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
  }

  .search-box {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 8px 14px;
    color: #e0e0e0;
    font-size: 0.85rem;
    font-family: 'Inter', sans-serif;
    width: 200px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-box:focus { border-color: rgba(103, 232, 249, 0.4); }
  .search-box::placeholder { color: #555; }

  .filter-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 8px 16px;
    color: #aaa;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
  }

  .filter-btn:hover { background: rgba(255,255,255,0.1); color: #e0e0e0; }
  .filter-btn.active { color: #fff; }
  .filter-btn.active[data-filter="light"] { background: rgba(103, 232, 249, 0.2); border-color: var(--light); }
  .filter-btn.active[data-filter="shadow"] { background: rgba(192, 132, 252, 0.2); border-color: var(--shadow); }
  .filter-btn.active[data-filter="all"] { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.3); }

  .sort-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 8px 14px;
    color: #aaa;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: all 0.2s;
  }

  .sort-btn:hover { background: rgba(255,255,255,0.1); color: #e0e0e0; }

  /* Card Grid */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
  }

  .ghost-card {
    background: var(--card-bg);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
  }

  .ghost-card:hover {
    transform: translateY(-4px);
    border-color: rgba(255,255,255,0.15);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  .ghost-card.in-squad {
    opacity: 0.35;
    pointer-events: none;
    transform: scale(0.97);
  }

  .ghost-card.squad-full:not(.in-squad) {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .ghost-card .card-image {
    width: 100%;
    aspect-ratio: 5/7;
    object-fit: cover;
    display: block;
  }

  .ghost-card .card-info {
    padding: 8px 10px 10px;
  }

  .ghost-card .card-name {
    font-weight: 700;
    font-size: 0.8rem;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .ghost-card .card-type {
    font-size: 0.65rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .ghost-card .card-type.light { color: var(--light); }
  .ghost-card .card-type.shadow { color: var(--shadow); }

  .ghost-card .card-stats {
    display: flex;
    gap: 10px;
    font-size: 0.7rem;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .ghost-card .card-stats .atk { color: #f87171; }
  .ghost-card .card-stats .hp { color: #34d399; }

  .ghost-card .card-ability {
    font-size: 0.65rem;
    color: #999;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .ghost-card .card-ability .ability-name { font-weight: 700; color: #ccc; }

  .ghost-card .rarity-indicator {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .rarity-common { background: #9ca3af; }
  .rarity-uncommon { background: #34d399; }
  .rarity-rare { background: #60a5fa; }
  .rarity-ghost-rare { background: #c084fc; }

  /* Card hover tooltip */
  .ghost-card .ability-tooltip {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(15, 15, 25, 0.95);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 12px 14px;
    width: 220px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 50;
    backdrop-filter: blur(10px);
    margin-bottom: 8px;
  }

  .ghost-card:hover .ability-tooltip { opacity: 1; }

  .ability-tooltip .tt-name {
    font-weight: 800;
    font-size: 0.85rem;
    margin-bottom: 2px;
  }

  .ability-tooltip .tt-type {
    font-size: 0.65rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  .ability-tooltip .tt-type.light { color: var(--light); }
  .ability-tooltip .tt-type.shadow { color: var(--shadow); }

  .ability-tooltip .tt-stats {
    display: flex;
    gap: 12px;
    font-size: 0.75rem;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .ability-tooltip .tt-ability {
    font-size: 0.75rem;
    color: #ccc;
    line-height: 1.4;
  }

  .ability-tooltip .tt-ability b { color: var(--gold); }

  /* Share section */
  .share-section {
    text-align: center;
    margin-top: 24px;
    display: none;
  }

  .share-section.visible { display: block; }

  .share-btn {
    background: linear-gradient(135deg, #67e8f9, #a78bfa);
    border: none;
    border-radius: 10px;
    padding: 12px 32px;
    color: #080810;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }

  .share-btn:hover { transform: scale(1.05); box-shadow: 0 4px 24px rgba(103, 232, 249, 0.3); }

  .squad-summary {
    margin-top: 14px;
    padding: 16px 20px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    display: inline-block;
    text-align: left;
    font-size: 0.8rem;
    line-height: 1.8;
    display: none;
  }

  .squad-summary.visible { display: inline-block; }

  /* Footer */
  .footer {
    text-align: center;
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  .footer .cta {
    font-family: 'Creepster', cursive;
    font-size: 1.3rem;
    color: var(--gold);
    margin-bottom: 6px;
  }

  .footer .sub {
    font-size: 0.75rem;
    color: #555;
  }

  .footer .sub a { color: var(--light); text-decoration: none; }
  .footer .sub a:hover { text-decoration: underline; }

  /* Reset button */
  .reset-btn {
    background: rgba(248, 113, 113, 0.1);
    border: 1px solid rgba(248, 113, 113, 0.3);
    border-radius: 8px;
    padding: 6px 14px;
    color: #f87171;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: all 0.2s;
    display: none;
  }

  .reset-btn.visible { display: inline-block; }
  .reset-btn:hover { background: rgba(248, 113, 113, 0.2); }

  /* Count badge */
  .count-badge {
    font-size: 0.8rem;
    color: #666;
    font-weight: 600;
  }

  .count-badge span { color: #e0e0e0; }

  /* Responsive */
  @media (max-width: 768px) {
    .header h1 { font-size: 2rem; }
    .squad-slot { width: 64px; height: 90px; }
    .squad-slot.empty-hint .slot-num { font-size: 1rem; }
    .card-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    .ghost-card .ability-tooltip { display: none; }
    .synergy-bar { gap: 12px; }
  }

  @media (max-width: 480px) {
    .squad-slot { width: 56px; height: 78px; }
    .card-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .controls { gap: 6px; }
    .search-box { width: 100%; }
  }

  /* Animation */
  @keyframes addToSquad {
    0% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  .squad-slot.just-added { animation: addToSquad 0.3s ease-out; }

  /* Hidden cards */
  .ghost-card.hidden { display: none; }

  /* Watermark */
  .watermark {
    position: fixed;
    bottom: 10px;
    right: 14px;
    font-size: 0.6rem;
    color: #333;
    letter-spacing: 1px;
    z-index: 200;
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>Build Your Squad</h1>
    <div class="subtitle">Choose <span>5 ghosts</span> for your team — discover Light & Shadow synergies</div>
  </div>

  <div class="squad-section">
    <div class="squad-bar" id="squadBar">
      <!-- 5 slots rendered by JS -->
    </div>
    <div class="synergy-bar" id="synergyBar">
      <div class="synergy-item light-synergy" id="lightCount">
        <div class="dot"></div>
        <span>Light: 0</span>
      </div>
      <div class="synergy-item shadow-synergy" id="shadowCount">
        <div class="dot"></div>
        <span>Shadow: 0</span>
      </div>
      <div class="synergy-bonus" id="synergyBonus"></div>
    </div>
    <div class="squad-stats" id="squadStats"></div>
  </div>

  <div class="controls">
    <input type="text" class="search-box" id="searchBox" placeholder="Search ghosts...">
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">All</button>
    <button class="filter-btn" data-filter="light" onclick="setFilter('light', this)">Light</button>
    <button class="filter-btn" data-filter="shadow" onclick="setFilter('shadow', this)">Shadow</button>
    <button class="sort-btn" onclick="cycleSort(this)">Sort: Rarity</button>
    <span class="count-badge" id="countBadge"></span>
    <button class="reset-btn" id="resetBtn" onclick="resetSquad()">Clear Squad</button>
  </div>

  <div class="card-grid" id="cardGrid"></div>

  <div class="share-section" id="shareSection">
    <button class="share-btn" onclick="shareSquad()">Share Your Squad</button>
    <div class="squad-summary" id="squadSummary"></div>
  </div>

  <div class="footer">
    <div class="cta">Coming to Kickstarter — September 2026</div>
    <div class="sub">
      <a href="https://www.corkscrewgames.com" target="_blank">corkscrewgames.com</a>
    </div>
  </div>
</div>

<div class="watermark">CORKSCREW GAMES</div>

  { name: "Tommy Salami", file: "tommy_salami.jpg", rarity: "common", affinity: "shadow", atk: 3, hp: 3, ability: "Hustle", abilityDesc: "Attack twice per round but deal 1 less damage per hit." },

const RARITY_ORDER = { 'ghost-rare': 0, 'rare': 1, 'uncommon': 2, 'common': 3 };
const RARITY_LABELS = { 'ghost-rare': 'Ghost Rare', 'rare': 'Rare', 'uncommon': 'Uncommon', 'common': 'Common' };

let squad = [null, null, null, null, null];
let currentFilter = 'all';
let currentSort = 'rarity';
let searchTerm = '';

function init() {
  renderSquadSlots();
  renderCards();
  updateCountBadge();
  document.getElementById('searchBox').addEventListener('input', (e) => {
    searchTerm = e.target.value.toLowerCase();
    filterCards();
  });
}

function renderSquadSlots() {
  const bar = document.getElementById('squadBar');
  bar.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const slot = document.createElement('div');
    slot.className = 'squad-slot';
    slot.id = `slot-${i}`;
    if (squad[i]) {
      const g = squad[i];
      slot.className = `squad-slot filled ${g.affinity}-slot`;
      slot.innerHTML = `
        <img src="../tierlist/cards/${g.file}" alt="${g.name}">
        <div class="remove-btn" onclick="removeFromSquad(${i}, event)">×</div>
      `;
      slot.classList.add('just-added');
      setTimeout(() => slot.classList.remove('just-added'), 300);
    } else {
      slot.className = 'squad-slot empty-hint';
      slot.innerHTML = `<div class="slot-num">${i + 1}</div><div>Empty</div>`;
    }
    bar.appendChild(slot);
  }
  updateSynergies();
  updateSquadStats();
  updateShareSection();
  updateCardStates();
}

function renderCards() {
  const grid = document.getElementById('cardGrid');
  grid.innerHTML = '';
  const sorted = getSortedGhosts();
  sorted.forEach(g => {
    const card = document.createElement('div');
    card.className = 'ghost-card';
    card.dataset.name = g.name.toLowerCase();
    card.dataset.affinity = g.affinity;
    card.dataset.rarity = g.rarity;
    if (squad.some(s => s && s.name === g.name)) card.classList.add('in-squad');
    if (squad.filter(Boolean).length >= 5 && !squad.some(s => s && s.name === g.name)) card.classList.add('squad-full');

    card.innerHTML = `
      <div class="rarity-indicator rarity-${g.rarity}"></div>
      <img class="card-image" src="../tierlist/cards/${g.file}" alt="${g.name}" loading="lazy">
      <div class="card-info">
        <div class="card-name">${g.name}</div>
        <div class="card-type ${g.affinity}">${g.affinity === 'light' ? '☀ Light' : '☾ Shadow'}</div>
        <div class="card-stats">
          <span class="atk">⚔ ${g.atk}</span>
          <span class="hp">♥ ${g.hp}</span>
        </div>
        <div class="card-ability"><span class="ability-name">${g.ability}</span></div>
      </div>
      <div class="ability-tooltip">
        <div class="tt-name">${g.name}</div>
        <div class="tt-type ${g.affinity}">${g.affinity === 'light' ? '☀ Light' : '☾ Shadow'} · ${RARITY_LABELS[g.rarity]}</div>
        <div class="tt-stats"><span class="atk">⚔ ATK ${g.atk}</span><span class="hp">♥ HP ${g.hp}</span></div>
        <div class="tt-ability"><b>${g.ability}:</b> ${g.abilityDesc}</div>
      </div>
    `;

    card.addEventListener('click', () => addToSquad(g));
    grid.appendChild(card);
  });
  updateCountBadge();
}

function getSortedGhosts() {
  let list = [...GHOSTS];
  if (currentSort === 'rarity') {
    list.sort((a, b) => RARITY_ORDER[a.rarity] - RARITY_ORDER[b.rarity]);
  } else if (currentSort === 'atk') {
    list.sort((a, b) => b.atk - a.atk || a.name.localeCompare(b.name));
  } else if (currentSort === 'hp') {
    list.sort((a, b) => b.hp - a.hp || a.name.localeCompare(b.name));
  } else if (currentSort === 'name') {
    list.sort((a, b) => a.name.localeCompare(b.name));
  }
  return list;
}

function addToSquad(ghost) {
  if (squad.some(s => s && s.name === ghost.name)) return;
  const emptyIdx = squad.indexOf(null);
  if (emptyIdx === -1) return;
  squad[emptyIdx] = ghost;
  renderSquadSlots();
  updateCardStates();
}

function removeFromSquad(idx, event) {
  event.stopPropagation();
  squad[idx] = null;
  renderSquadSlots();
  updateCardStates();
}

function resetSquad() {
  squad = [null, null, null, null, null];
  renderSquadSlots();
  updateCardStates();
}

function updateCardStates() {
  const cards = document.querySelectorAll('.ghost-card');
  const filled = squad.filter(Boolean).length;
  cards.forEach(card => {
    const name = card.dataset.name;
    const inSquad = squad.some(s => s && s.name.toLowerCase() === name);
    card.classList.toggle('in-squad', inSquad);
    card.classList.toggle('squad-full', filled >= 5 && !inSquad);
  });
  document.getElementById('resetBtn').classList.toggle('visible', filled > 0);
}

function updateSynergies() {
  const active = squad.filter(Boolean);
  const lightCount = active.filter(g => g.affinity === 'light').length;
  const shadowCount = active.filter(g => g.affinity === 'shadow').length;

  const lightEl = document.getElementById('lightCount');
  const shadowEl = document.getElementById('shadowCount');
  const bonusEl = document.getElementById('synergyBonus');

  lightEl.querySelector('span').textContent = `Light: ${lightCount}`;
  shadowEl.querySelector('span').textContent = `Shadow: ${shadowCount}`;
  lightEl.classList.toggle('active', lightCount > 0);
  shadowEl.classList.toggle('active', shadowCount > 0);

  // Synergy bonuses
  let bonus = '';
  if (lightCount >= 4) bonus = '☀ Light Dominion — All Light ghosts +2 HP';
  else if (shadowCount >= 4) bonus = '☾ Shadow Dominion — All Shadow ghosts +1 ATK';
  else if (lightCount >= 3) bonus = '☀ Light Surge — Team heals 1 HP/round';
  else if (shadowCount >= 3) bonus = '☾ Shadow Surge — Team deals +1 damage';
  else if (lightCount >= 2 && shadowCount >= 2) bonus = '⚖ Balance — All ghosts gain +1 HP and +1 ATK';
  else if (active.length >= 3 && lightCount > 0 && shadowCount > 0) bonus = '⚖ Harmony — Reduce all incoming damage by 1';

  bonusEl.textContent = bonus;
  bonusEl.classList.toggle('visible', bonus !== '');
}

function updateSquadStats() {
  const active = squad.filter(Boolean);
  const statsEl = document.getElementById('squadStats');
  if (active.length === 0) {
    statsEl.innerHTML = '';
    return;
  }
  const totalAtk = active.reduce((s, g) => s + g.atk, 0);
  const totalHp = active.reduce((s, g) => s + g.hp, 0);
  statsEl.innerHTML = `Squad Total: <span class="atk">⚔ ${totalAtk} ATK</span> · <span class="hp">♥ ${totalHp} HP</span> · ${active.length}/5 ghosts`;
}

function updateShareSection() {
  const section = document.getElementById('shareSection');
  const filled = squad.filter(Boolean).length;
  section.classList.toggle('visible', filled === 5);
}

function shareSquad() {
  const active = squad.filter(Boolean);
  if (active.length < 5) return;

  const lightCount = active.filter(g => g.affinity === 'light').length;
  const shadowCount = active.filter(g => g.affinity === 'shadow').length;
  const totalAtk = active.reduce((s, g) => s + g.atk, 0);
  const totalHp = active.reduce((s, g) => s + g.hp, 0);

  let text = `👻 My BOO! Spirit Battles Squad:\n\n`;
  active.forEach(g => {
    const icon = g.affinity === 'light' ? '☀' : '☾';
    text += `${icon} ${g.name} — ${g.ability} (ATK ${g.atk} / HP ${g.hp})\n`;
  });
  text += `\n⚔ ${totalAtk} ATK · ♥ ${totalHp} HP · ☀${lightCount} ☾${shadowCount}\n`;
  text += `\nBuild yours → corkscrewgames.com`;

  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      const summaryEl = document.getElementById('squadSummary');
      summaryEl.textContent = 'Copied to clipboard!';
      summaryEl.classList.add('visible');
      setTimeout(() => summaryEl.classList.remove('visible'), 2000);
    });
  }
}

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterCards();
}

function filterCards() {
  const cards = document.querySelectorAll('.ghost-card');
  let visible = 0;
  cards.forEach(card => {
    const matchFilter = currentFilter === 'all' || card.dataset.affinity === currentFilter;
    const matchSearch = searchTerm === '' || card.dataset.name.includes(searchTerm);
    const show = matchFilter && matchSearch;
    card.classList.toggle('hidden', !show);
    if (show) visible++;
  });
  updateCountBadge(visible);
}

function cycleSort(btn) {
  const sorts = ['rarity', 'atk', 'hp', 'name'];
  const labels = { rarity: 'Rarity', atk: 'ATK ↓', hp: 'HP ↓', name: 'Name' };
  const idx = sorts.indexOf(currentSort);
  currentSort = sorts[(idx + 1) % sorts.length];
  btn.textContent = `Sort: ${labels[currentSort]}`;
  renderCards();
  filterCards();
}

function updateCountBadge(count) {
  const badge = document.getElementById('countBadge');
  const total = GHOSTS.length;
  if (count === undefined) count = total;
  badge.innerHTML = `<span>${count}</span>/${total} ghosts`;
}

init();
</script>
