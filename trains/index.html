// E20 — canvas chrome rides the --ui dial too. Each painter scales by uiCard():
// the dial, clamped so the card still fits the rug viewport and NEVER drops
// below 1× (at --ui:1 every formula collapses to v2.8's exact numbers — the
// pixel-proof dial; on a small phone the clamp simply keeps today's size).
const uiCard=h0=>Math.max(1,Math.min(UIS,(H-BAR-24)/h0));
function drawHint(){
  if(PLAY.on) return;               // zero reading on the wind-up rug (E6)
  if(hintStage>=HINTS.length) return;
  const u=Math.max(1,UIS);
  cx.globalAlpha=0.7+0.3*Math.sin(perf()*4);
  cx.font='bold '+(20*u)+'px "Arial Black",Impact,sans-serif'; cx.textAlign='center'; cx.fillStyle='#F7E9C4';
  const txt=HINTS[hintStage], w=cx.measureText(txt).width;
  if(w>W-40) cx.font='bold '+Math.max(11,Math.floor(20*u*(W-40)/w))+'px "Arial Black",Impact,sans-serif';
  // E25: the bar is gone (BAR=0) — the words seat just above the corner toy
  // box's zone ((5+36)*--ui tall) so they never sit in the box's lap at sm
  cx.fillText(txt, W/2, H-BAR-16*u-41*UIS);
  cx.globalAlpha=1;
}
function drawLapCard(){
  if(lapCardT<=0) return;
  const k=Math.min(1,(2.8-lapCardT)*5), out=Math.min(1,lapCardT*2.5);
  cx.globalAlpha=Math.min(k,out);
  const u=uiCard(104);
  const cw=Math.min(360*u,W-60), chh=104*u, x=(W-cw)/2, y=(H-BAR)/2-70*u;
  cx.fillStyle='#1e1610'; rr(x,y,cw,chh,16*u); cx.fill();
  cx.strokeStyle='#F2C531'; cx.lineWidth=4*u; rr(x,y,cw,chh,16*u); cx.stroke();
  cx.fillStyle='#F2C531'; cx.textAlign='center';
  // E15: a NAMED railroad's first lap says so; unnamed = today's card, verbatim
  const title=NAME? signText()+' — FIRST LAP!' : 'FIRST LAP!';
  cx.font='bold '+(34*u)+'px "Arial Black",Impact,sans-serif';
  if(NAME){ const tw=cx.measureText(title).width;
    if(tw>cw-30) cx.font='bold '+Math.max(13,Math.floor(34*u*(cw-30)/tw))+'px "Arial Black",Impact,sans-serif'; }

}
// a kid who asked the OS for calm gets a steady ring instead of a breathing one
const RM=()=>{ try{ return matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } };
// FINISH THE TRACK's tell (E8): the missing cells breathe a soft gold ring so a
// five-year-old sees exactly where the pieces go. Empty cells only — the glow retires
// the instant a piece lands, which is its own little reward. Still under reduced motion.
function drawGaps(){
  if(!GAP_GLOW||!CAMP.on) return;
  const L=LEVELS[CAMP.level-1]; if(!L||!L.gaps) return;
  const k=RM()? 0.5 : 0.5+0.5*Math.sin(perf()*2.6);
  for(const [gx,gy] of L.gaps){
    if(pieceAt(gx,gy)) continue;
    const x=GX+gx*C, y=GY+gy*C;
    cx.globalAlpha=0.18+0.30*k; cx.strokeStyle='#F2C531'; cx.lineWidth=4;
    rr(x+7,y+7,C-14,C-14,12); cx.stroke();

function draw(){
  cx.setTransform(1,0,0,1,0,0); cx.clearRect(0,0,cvs.width,cvs.height);
  cx.setTransform(DPR*SC,0,0,DPR*SC,DPR*OX,DPR*OY);
  drawRug();
  if(buildGate()) drawNameSign(); else SIGN_RECT=null;   // E15: BUILD only — no sign in campaign or PLAY (E20: camGate opened, so the sign gates on buildGate now)
  drawRivers(); drawGorges(); drawPonds(); drawGaps();   // E30: the gorge is ground — every deck and bent stands over it
  // scenery slides in as the midHook: over the ground pass, under the decks and
  // the z-sorted cars — so a cow can graze beneath the high line
  drawTrackAll(grid,hgrid,PLAY.on? playCarItems():trailCarItems(),drawScen);   // E28: trailCarItems = the cars + the rainbow's z-items; PLAY's branch byte-untouched
  drawBoarders();   // E15: little walkers between platform and train, on the ground
  trailSparkPaint();   // E28: stardust floats OVER the cars (PLAY/none = early out, zero paint)
  drawArches();     // E9: balloon arches bow over the line — the train drives under them
  drawBflies();     // E31: the butterflies — the lowest of the fliers
  drawBalloons();   // E7: balloons fly above the whole rug, shadows drifting along
  drawEagles();     // E30: the eagle circles higher still
  for(const s of smoke){ const k=s.t/s.dur;
    cx.globalAlpha=(1-k)*(s.a||0.4); cx.fillStyle=s.c||'#bbb';   // E38: unstamped = today's exact math
    cx.beginPath(); cx.arc(s.x,s.y,s.r+9*k,0,7); cx.fill(); cx.globalAlpha=1; }
  for(const e of fx){ const k=e.t/e.dur;
    if(e.k==='puff'){ cx.globalAlpha=(1-k)*0.7; cx.fillStyle='#e8e0cc';
      cx.beginPath(); cx.arc(e.x,e.y,e.R*k+6,0,7); cx.fill(); cx.globalAlpha=1; }
    if(e.k==='rip'){ cx.globalAlpha=(1-k)*0.7; cx.strokeStyle=RIVER_GLINT; cx.lineWidth=2.5;
      cx.beginPath(); cx.arc(e.x,e.y,10+e.R*k,0,7); cx.stroke(); cx.globalAlpha=1; }
    if(e.k==='stars'){ cx.globalAlpha=1-k;         // the BONK halo — gold stars flung out (E6)
      for(let i=0;i<6;i++){ const a=e.a+i*TAU/6+k*2.4, r2=8+64*k;
        star5(e.x+Math.cos(a)*r2, e.y+Math.sin(a)*r2*0.6-16*k, 0.9-0.4*k, '#F2C531'); }
      cx.globalAlpha=1; } }
  drawWeather();    // E10: weather drifts over everything — but never over the ghost
  klGhost();        // E34: the continue-zone whisper — under the live drag ghost
  drawGhosts();
  cx.setTransform(DPR,0,0,DPR,0,0);
  for(const p of confetti){ cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot);
    cx.globalAlpha=Math.min(1,(p.dur-p.t)*2); cx.fillStyle=p.col; cx.fillRect(-4,-2.5,8,5); cx.restore(); }
  // E9: minted stars fly from the event to the HUD counter — that flight IS the teaching
  for(const f of flights){ if(f.t<=0) continue;
    const k=f.t/f.dur, e=k*k*(3-2*k);
    star5(f.x+(f.tx-f.x)*e, f.y+(f.ty-f.y)*e-Math.sin(Math.PI*k)*36, 0.9+0.35*(1-k), '#F2C531'); }
  cx.globalAlpha=1;
  drawHint(); drawLapCard(); drawCampCards();
}

const MRUG={x:350,y:180,w:620,h:470};                       // the crimson rug on the boards

            oy:MRUG.y+MRUG.h/2-96*ATT_SCALE };              // ...the rug's centre
function star5(px,py,k,col){                                // the toybox star, gone travelling
  cx.save(); cx.translate(px,py); cx.scale(k,k); cx.fillStyle=col;
  cx.beginPath(); cx.moveTo(0,-12);
  for(let i=1;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, r=i%2?5.2:12; cx.lineTo(Math.cos(a)*r,Math.sin(a)*r); }

function menuFloor(){
  // GVT bedroom floorboards, scaled from the 960×600 room to this 1296×912 world.
  // E26 THE ROOM FILLS THE SCREEN (Wyatt: "we need the room to fill up the whole
  // screen… what we're seeing on the left and right side is not a menu" — it was
  // the page's dark planks). The boards now run EDGE TO EDGE at every viewport:
  // the painting's own pixels stay exactly where they were, the floor simply
  // keeps going wherever the screen shows more world (the E23 whole-floor
  // spirit, in paint). Above the room's top edge the far WALL steps in — warm
  // plaster over a wood baseboard — so portrait screens read as a room too.
  const v=menuVis();
  cx.fillStyle='#C8A170'; cx.fillRect(v.x0,0,v.x1-v.x0,v.y1);
  if(v.y0<0){   // the wall band (visible only when the screen is taller than the room)
    cx.fillStyle='#E9DFC6'; cx.fillRect(v.x0,v.y0,v.x1-v.x0,-v.y0);

    cx.fillStyle='#6e5130'; cx.fillRect(v.x0,-4,v.x1-v.x0,4);
  }
  cx.strokeStyle='#B08A58'; cx.globalAlpha=0.6; cx.lineWidth=3.4;
  cx.beginPath(); for(let y=104;y<v.y1;y+=104){ cx.moveTo(v.x0,y); cx.lineTo(v.x1,y); } cx.stroke();
  cx.lineWidth=2.7; cx.beginPath();
  [[320,0],[944,104],[560,208],[240,312],[1024,416],[456,520],[832,624],[272,728],[672,832]]
    .forEach(p=>{ cx.moveTo(p[0],p[1]); cx.lineTo(p[0],p[1]+104); });
  // plank butts beyond the painting: deterministic per row band (no Math.random
  // near paint — the frozen-clock law), tiled only where the original nine don't live
  for(let y=0;y<v.y1;y+=104){

   the lit doorway, one sniff at the shop or the station, out the way he

   and the whole clock rides menuUpdate's dt — frozen-clock deterministic.
   ===================================================================== */
const ROOM={t:0,win:-1,fx:null,dog:null,lid:0,cards:false};
const DOG_T=[2.0,3.3,5.4,5.8];   // gag leg ends: trot-in · sniff · trot-out · gone (s)
function dogSpot(k){ return k? [648,838] : [1010,834]; }   // 1 = the station's turn · 0 = the shop's
function roomTick(dt){
  ROOM.t+=dt;
  const w=Math.floor(ROOM.t/PICKME_S);
  if(w!==ROOM.win){
    ROOM.win=w;
    if(ROOM_GAG==='dog' && w%DOG_EVERY===DOG_EVERY-1){
      if(!ROOM.dog) ROOM.dog={t:0,k:((w/DOG_EVERY)|0)%2};   // alternate sniff targets, deterministically
      ROOM.fx=null;
    } else if(!ROOM.dog){
      const seq=['station','toybox','store','tickets','piggy'];
      ROOM.fx={kind:seq[w%seq.length], t:0, stub:w%LEVELS.length};
      if(ROOM.fx.kind==='piggy') PIG.hop=Math.max(PIG.hop,0.55);   // her wiggle IS the E23 hop (paint, no save)
    }
  }
  if(ROOM.fx){ ROOM.fx.t+=dt; if(ROOM.fx.t>=1.6) ROOM.fx=null; }
  if(ROOM.dog){
    const d=ROOM.dog; const was=d.t; d.t+=dt;
    if(was<DOG_T[0]&&d.t>=DOG_T[0]) SND.yip();               // one soft yip at the sniff — a sound, never a word
    if(d.t>=DOG_T[3]) ROOM.dog=null;
  }
  // the box lid: leans right open for the cards, creaks in its pick-me window
  const tgt=ROOM.cards? 1 : (ROOM.fx&&ROOM.fx.kind==='toybox'? Math.sin(Math.PI*Math.min(1,ROOM.fx.t/1.4))*0.3 : 0);
  ROOM.lid+=(tgt-ROOM.lid)*Math.min(1,dt*8);
  if(Math.abs(ROOM.lid-tgt)<0.002) ROOM.lid=tgt;
}

function objHit(e){
  const mx=(e.clientX-OX)/SC, my=(e.clientY-OY)/SC;   // pigHit's own inverse
  for(const o of ROOM_OBJS){ const h=o.hit;
    if(mx>=h.x&&mx<=h.x+h.w&&my>=h.y&&my<=h.y+h.h) return o;
  }
  return null;

// ⚠ THE TAP'S TAIL (measured on 812×375): an object tap answers at POINTERDOWN,
// so the same touch still owes the page a synthesized CLICK — and that click
// lands on whatever surface the tap just opened (the storefront's tap fell on
// the bank's own CLOSE button; the board tap fell on ticket 1 and walked a kid
// into level 1). The GVT v2.12 recipe, lifted: ONE capture-phase swallow that
// EXPIRES, never lying in wait for the next honest tap.
function tapSwallow(){
  const eat=ev=>{ ev.stopPropagation(); ev.preventDefault(); };
  window.addEventListener('click',eat,{capture:true,once:true});
  setTimeout(()=>window.removeEventListener('click',eat,{capture:true}),350);
}

function drawRoomDog(){
  // THE GAG (GVT spirit, trainset-flavoured): the E2 dog trots in from the lit
  // doorway, sniffs the shop or the station, and wanders back out. Paint only.
  const d=ROOM.dog; if(!d) return;
  const dx=1262, dy=706, [sx2,sy2]=dogSpot(d.k);
  let x,y,flip=0,sniff=false;
  if(d.t<DOG_T[0]){ const k=d.t/DOG_T[0]; x=dx+(sx2-dx)*k; y=dy+(sy2-dy)*k; }
  else if(d.t<DOG_T[1]){ x=sx2; y=sy2; sniff=true; }
  else { const k=Math.min(1,(d.t-DOG_T[1])/(DOG_T[2]-DOG_T[1]));
    x=sx2+(dx-sx2)*k; y=sy2+(dy-sy2)*k; flip=1; }
  const a=d.t>DOG_T[2]? Math.max(0,1-(d.t-DOG_T[2])/(DOG_T[3]-DOG_T[2])) : 1;
  cx.save(); cx.translate(x,y); cx.scale(2.1,2.1);
  cx.globalAlpha=0.22*a; cx.fillStyle='#000';
  cx.beginPath(); cx.ellipse(2,17,16,4.5,0,0,7); cx.fill();
  cx.globalAlpha=a;
  if(!sniff) cx.translate(0,-Math.abs(Math.sin(d.t*9))*3);   // the trot bob
  else { cx.rotate(0.16); cx.translate(-2,3+Math.sin(d.t*10)*1.5); }   // nose to the boards
  drawDog({v:flip,wave:0},ROOM.t,0);
  cx.restore();
}

/* =====================================================================
   THE BEDROOM SET & THE SHY UI (E18) — the menu stops being a menu.
   Touch the attract rug and the chrome (title, the three big buttons,
   chips) fades away; leave it alone for UI_SHY_SEC and it fades back.
   While it's away the rug is a REAL little building floor: a mini
   palette (s/c/st) + the E16 train shelf, and every press routes into
   the SAME machinery BUILD's rug reads — swapped onto the attract grid
   by inBed(), which aliases the world globals for the duration of one
   call. THE EPHEMERAL LAW: save/toast/hintPass are inert inside the
   wrapper; nothing here ever touches localStorage. The bedroom floor
   is BR_GW×BR_GH cells with the stock oval at (1,1)-(4,2) — the paint
   transform shifts one cell so an untouched menu stays PIXEL-IDENTICAL.
   ===================================================================== */
const BR_LO=-1, BR_GW=5, BR_GH=3;     // the bedroom floor: cells (-1..4)×(-1..2) — 6×4 on the rug,
                                      // ringing the stock oval at its ORIGINAL keys (0,0)-(3,1)
const TFIELDS=['placed','cars','F','running','pauseT','stKey','dist','startSig','goDist','revSinceGo'];
const bedTrain0=()=>({placed:false,cars:[],F:true,running:false,pauseT:0,stKey:null,dist:0,startSig:null,goDist:0,revSinceGo:false});
const BED={ on:false, shy:false, a:1, idleT:0, ctx:0, s:null,
            train:bedTrain0(), consist:[], eng:'loco', boarders:[],
            fx:[], smoke:[], scen:new Map(), wheel:0,
            grav:{mul:1,crest:false}, clack:0,
            // E23 THE WHOLE FLOOR: the bedroom's live bounds (viewport-derived by
            // bedBounds; these defaults are E18's strip until the first resize)
            // and the blocked-cell set (the piggy's spot + the big-button rows).
            gx0:BR_LO, gy0:BR_LO, gw:BR_GW, gh:BR_GH, blk:null };
function bedAcq(){                    // swap the world globals for the bedroom's
  if(BED.ctx++) return;               // re-entrant: only the outermost call swaps
  BED.s={grid,hgrid,scen,RGRID,HGRID,GW,GH,GX0,GY0,consist,ENGINE,fx,smoke,BOARDERS,
         gm:GRAV.mul,gc:GRAV.crest,ca:clackAcc};
  grid=AT.grid; hgrid=AT.hg; RGRID=AT.grid; HGRID=AT.hg; scen=BED.scen;
  // E23: the floor is every cell the screen can hold (bedBounds re-derives on
  // resize). The OVAL NEVER MOVES — these are extend-only bounds, same keys.
  GW=BED.gw; GH=BED.gh; GX0=BED.gx0; GY0=BED.gy0;
  consist=BED.consist; ENGINE=BED.eng; fx=BED.fx; smoke=BED.smoke;
  BOARDERS=BED.boarders;
  GRAV.mul=BED.grav.mul; GRAV.crest=BED.grav.crest; clackAcc=BED.clack;
  for(const f of TFIELDS){ const v=TRAIN[f]; TRAIN[f]=BED.train[f]; BED.train[f]=v; }
}
function bedRel(){
  if(--BED.ctx) return;
  for(const f of TFIELDS){ const v=TRAIN[f]; TRAIN[f]=BED.train[f]; BED.train[f]=v; }
  BED.consist=consist; BED.eng=ENGINE; BED.fx=fx; BED.smoke=smoke; BED.boarders=BOARDERS;
  BED.grav.mul=GRAV.mul; BED.grav.crest=GRAV.crest; BED.clack=clackAcc;
  const s=BED.s; BED.s=null;
  grid=s.grid; hgrid=s.hgrid; scen=s.scen; RGRID=s.RGRID; HGRID=s.HGRID;
  GW=s.GW; GH=s.GH; GX0=s.GX0; GY0=s.GY0;
  consist=s.consist; ENGINE=s.ENGINE; fx=s.fx; smoke=s.smoke;
  BOARDERS=s.BOARDERS; GRAV.mul=s.gm; GRAV.crest=s.gc; clackAcc=s.ca;
}
function inBed(fn){ bedAcq(); try{ return fn(); } finally{ bedRel(); } }
const withBed=fn=>SCREEN==='menu'&&BED.on? inBed(fn) : fn();   // shelf handlers serve both rooms
const bedRun=fn=>()=>{ if(SCREEN==='menu'&&BED.on) inBed(fn); };   // deferred puffs re-enter the room
// ---- THE SHY UI ----
function shySync(){ document.body.classList.toggle('shy',BED.shy); }
function shyTouch(){ BED.idleT=0; if(!BED.shy){ BED.shy=true; shySync(); } }
function shyTick(dt){
  if(BED.shy){
    if(down||DRAG) BED.idleT=0;       // a held finger keeps the room cleared
    else{
      BED.idleT+=dt;
      // LAW: a child is NEVER locked out of the three big buttons for longer
      // than UI_SHY_SEC + the fade.
      if(BED.idleT>=UI_SHY_SEC){ BED.shy=false; shySync(); }
    }
  }
  const tgt=BED.shy?0:1, stp=dt*1000/SHY_FADE_MS;   // the canvas sign fades in step with the DOM
  BED.a=tgt>BED.a? Math.min(tgt,BED.a+stp) : Math.max(tgt,BED.a-stp);
}

  return false;
}
function atCellOn(cell){ return AT.cars.some(c=>c.rd.cx===cell[0]&&c.rd.cy===cell[1]); }
function atPlace(cxl,cyl){            // seat the stock toy back on the graph — placeTrainAt's probe law
  const pc=pieceTop(cxl,cyl); if(!pc) return false;
  const p0=pathsOf(pc)[0];
  const loco={cx:cxl,cy:cyl,pi:0,dir:1,s:p0.len/2,el:(pc.elev|0)?1:0};
  const tail=['tender','cab'], need=GAP*tail.length+34;
  const probe=clone(loco), r=back(probe,need);
  if(!r.ok){
    const f=advance(loco,need-r.moved+2);
    if(!f.ok) return false;
    if(!back(clone(loco),need).ok) return false;
  }
  AT.cars=[{type:'loco',rd:loco,face:1,squash:0}];
  for(let i=1;i<=tail.length;i++){ const rd=clone(loco); back(rd,GAP*i); AT.cars.push({type:tail[i-1],rd,face:1,squash:0}); }
  return true;
}
// every bedroom train moves by the attract law: one shared step, and a dead end
// simply turns the toy around (the BUILD tick's probe + partial-step recipe)
function attRun(cars,step){
  if(!cars.length) return;
  const probe=clone(cars[0].rd), r=advance(probe,step);
  if(r.ok){ for(const c of cars) advance(c.rd,step); return; }
  const part=Math.max(0,r.moved-0.5);
  if(part>1e-4) for(const c of cars) advance(c.rd,part);
  for(const c of cars){ c.rd.dir*=-1; c.face*=-1; }
  cars[0].squash=1; SND.boing();
}
// ---- a hand on the bedroom rug ----
function bedDown(e){
  // E23 THE WHOLE FLOOR IS YOURS — the E18 MRUG gate is OPEN: every board the
  // screen shows is building floor now (Wyatt: "build anywhere on the screen,
  // so you're not just limited to the carpet"). The DOM chrome still swallows
  // its own taps before the canvas ever sees them, and the piggy answered
  // first back in the pointerdown ladder.
  ac(); e.preventDefault();
  shyTouch();                          // the chrome gets out of the way
  if(DRAG||down) return;               // one hand at a time
  inBed(()=>{
    const [wx,wy]=worldXY(e);
    if(TRAIN.placed){
      const ci=trainHitAt(wx,wy);      // the kid's train reads exactly BUILD's ladder
      if(ci===1){ down={x:e.clientX,y:e.clientY,what:'loco'}; return; }
      if(ci>1){ down={x:e.clientX,y:e.clientY,what:'tcar',idx:ci-1}; return; }
    }
    if(atHitAt(wx,wy)){ down={x:e.clientX,y:e.clientY,what:'atrain'}; return; }
    const cell=cellXY(wx,wy);
    if(cell&&atCellOn(cell)){ down={x:e.clientX,y:e.clientY,what:'atrain'}; return; }   // track under the toy = the toy
    if(cell&&pieceTop(cell[0],cell[1])){ down={x:e.clientX,y:e.clientY,what:'piece',cell}; return; }
    down=null;                         // bare rug — the touch alone cleared the room
  });
}

/* =====================================================================
   DESIGN THE ROOM — THE ROOM REMEMBERS (E37). Wyatt: "It should also
   save whatever you have done to the room… you could make the room
   snowy… you can do anything you do in the build mode." The bedroom's
   mutations now persist under the room's OWN localStorage key (the
   game's TRAINSET key gets ZERO bedroom writes — the E18/E23 line, the
   wrapper, is unchanged; only where the wrapper's writes LAND changed).
   Write-through, synchronous: WKWebView flushes localStorage on
   BACKGROUND (the ios-shell trap) — a deferred save is a lost room.
   THE HEART LAW: the stock oval's 8 cells are never serialized and
   always come home on reset/reload; the stock attract toy likewise
   (the room's pet). A fresh profile = a stock room, byte-identical.
   ===================================================================== */
const ROOM_KEY='TRAINSET_ROOM';       // v:1 — separate from the game save: nothing existing migrates
const OVAL_KEYS=new Set(['0,0','1,0','2,0','3,0','0,1','1,1','2,1','3,1']);   // the heart — buildAttract's exact keys
let ROOMWX='clear';                   // the room's own sky (E35 words; persisted in the room save)
let BEDSKY=[];                        // the room's pill row (bedSkySync marks it)
function roomSave(){
  if(!BED.on) return;
  if(!BED.ctx){ if(SCREEN!=='menu') return; inBed(roomSave); return; }   // self-wrap: serWorld must read the ROOM
  try{
    const w=serWorld();
    localStorage.setItem(ROOM_KEY, JSON.stringify({ v:1,
      grid:w.grid.filter(r2=>!OVAL_KEYS.has(r2[0])),   // the heart is never written down
      scen:w.scen, consist:w.consist, eng:ENGINE, train:w.train, wx:ROOMWX }));
  }catch(e){}
}
function roomApply(){
  // the saved room dresses the stock floor — row-forgiving exactly like
  // appWorld: junk rows skip, valid rows land, a garbage blob is a stock room.
  let d=null;
  try{ d=JSON.parse(localStorage.getItem(ROOM_KEY)||'null'); }catch(e){}
  ROOMWX=(d&&WEATHERS.includes(d.wx))? d.wx : 'clear';
  WXR.key=null;                        // a fresh sky re-seeds its particles
  if(!d||d.v!==1) return;
  inBed(()=>{ try{
    for(const [k2,t,r,sel,elev] of (d.grid||[])){
      if(elev||!PATHS[t]||OVAL_KEYS.has(k2)||grid.has(k2)) continue;   // ground pieces only; the heart wins
      const [x,y]=String(k2).split(',').map(Number);
      if(!isFinite(x)||!isFinite(y)) continue;
      setTrackPiece(t,r|0,sel|0,0,x,y);
    }
    for(const [k2,t,v] of (d.scen||[])){
      if(!SCENDEF[t]) continue;
      const [x,y]=String(k2).split(',').map(Number);
      if(!isFinite(x)||!isFinite(y)) continue;
      scen.set(k2,{t,v:v|0,ra:null,pop:0,wave:0});
    }
    if(Array.isArray(d.consist)) consist=d.consist.filter(t=>CARDEF[t]).slice(0,MAXCARS);
    ENGINE=d.eng==='exp'? 'exp':'loco';
    if(d.train && d.train.cars && d.train.cars.length){
      let ok=true;                     // appWorld's exact validation recipe — every car must find its piece
      const cars=d.train.cars.map(c2=>{
        const rd={cx:c2.cx,cy:c2.cy,pi:c2.pi,dir:c2.dir>0?1:-1,s:+c2.s||0,el:0};
        const pc=pieceOf(rd);
        if(!pc || !pathsOf(pc)[c2.pi]) ok=false;
        return {type:c2.t,rd,face:c2.f<0?-1:1,squash:0};
      });
      if(ok){ TRAIN.cars=cars; TRAIN.placed=true; TRAIN.F=d.train.F!==false;
        TRAIN.running=true;            // the alive-room law: running is a bedroom train's nature
      }
    }
  }catch(e){} });
}

// ---- THE ROOM'S WEATHER (E37) — the three shipped recipes, room-span copies.
// The game's weatherSeed/drawWeather/WXP are UNTOUCHED (their byte proofs must
// hold with zero effort); the room seeds its own particles off menuVis() with
// the same seed chain, the same density dials, the same painters' constants.
// clear paints NOTHING — a fresh room stays byte-identical.
let WXR={key:null,flakes:[],motes:[],drops:[],rings:[],dress:[]};
function roomSeed(){
  const v0=menuVis();
  const v={x0:Math.round(v0.x0),y0:Math.round(v0.y0),x1:Math.round(v0.x1),y1:Math.round(v0.y1)};
  const k2=ROOMWX+':'+v.x0+','+v.y0+','+v.x1+','+v.y1;   // a resize re-seeds, deterministically
  if(WXR.key===k2) return v;
  let s=20260725; const rnd=()=>{ s=(s*9301+49297)%233280; return s/233280; };   // the GVT seed chain
  WXR={key:k2,flakes:[],motes:[],drops:[],rings:[],dress:[]};
  const w0=v.x1-v.x0, h0=v.y1-v.y0, cells=Math.max(1,Math.round(w0*h0/(C*C)));
  if(ROOMWX==='snowfall'){
    const n=Math.min(FLAKE_MAX,Math.round(cells*FLAKE_PER_CELL));
    for(let i=0;i<n;i++) WXR.flakes.push({ x:v.x0+rnd()*w0, y:v.y0+rnd()*h0,
      r:0.9+rnd()*1.5, v:(9+rnd()*16)*FLAKE_FALL, s:0.7+rnd()*1.1, p:rnd()*6.283 });
    // THE SNOW BLANKET — "make the room snowy" means the floor too: the E10
    // winter set (drift/clod/ice, the shipped painters verbatim) on the boards,
    // under the rug and the furniture. Only snow dresses the floor (dial).
    const fx0=v.x0+60, fx1=v.x1-60, fy0=Math.max(46,v.y0+46), fy1=v.y1-40;
    const nD=Math.max(3,Math.round(cells/DRIFT_CELLS));
    for(let i=0;i<nD;i++){
      const side=i%4, rx=60+rnd()*45, ry=28+rnd()*26;
      let x,y;
      if(side===0){ x=fx0+rnd()*(fx1-fx0); y=fy0+ry*0.5+rnd()*30; }
      else if(side===1){ x=fx0+rnd()*(fx1-fx0); y=fy1-ry*0.5-rnd()*30; }
      else if(side===2){ x=fx0+rx*0.4+rnd()*40; y=fy0+rnd()*(fy1-fy0); }
      else { x=fx1-rx*0.4-rnd()*40; y=fy0+rnd()*(fy1-fy0); }
      WXR.dress.push({t:'drift',x,y,rx,ry});
    }
    const nK=Math.round(cells*CLOD_PER_100/100);
    for(let i=0;i<nK;i++) WXR.dress.push({t:'clod', x:fx0+rnd()*(fx1-fx0), y:fy0+rnd()*(fy1-fy0), r:9+rnd()*6});
    const nI=cells>300?2:1;
    for(let i=0;i<nI;i++) WXR.dress.push({t:'ice', x:fx0+120+rnd()*Math.max(60,fx1-fx0-240),
      y:fy0+80+rnd()*Math.max(40,fy1-fy0-160), rx:70+rnd()*30, ry:40+rnd()*20});
  } else if(ROOMWX==='dust'){
    const n=Math.min(DUST_MAX,Math.round(cells*DUST_PER_CELL));
    for(let i=0;i<n;i++) WXR.motes.push({ x:v.x0+rnd()*w0, y:v.y0+66+rnd()*Math.max(40,h0-132),
      r:1.3+rnd()*2.1, v:14+rnd()*22, a:0.16+rnd()*0.18, s:0.5+rnd()*0.9, p:rnd()*6.283 });
  } else if(ROOMWX==='rain'){
    const n=Math.min(RAIN_MAX,Math.round(cells*RAIN_PER_CELL));   // the room rains full — soft is the jungle's
    for(let i=0;i<n;i++) WXR.drops.push({ x:v.x0+rnd()*w0, y:v.y0+rnd()*h0,
      l:9+rnd()*8, v:520+rnd()*260, p:rnd()*6.283 });
    const nr=Math.max(6,Math.round(n/14));
    for(let i=0;i<nr;i++) WXR.rings.push({ x:v.x0+80+rnd()*Math.max(60,w0-160),
      y:v.y0+80+rnd()*Math.max(60,h0-160), T:1.1+rnd()*1.6, p:rnd()*3 });
  }
  return v;
}
function roomGroundDress(){
  if(ROOMWX!=='snowfall') return;      // only snow dresses the floor (dial)
  roomSeed();
  for(const it of WXR.dress){
    if(it.t==='drift') drawDeepDrift(it);
    else if(it.t==='clod') drawSnowClod(it);
    else if(it.t==='ice') drawIceSheet(it);
  }
}
function menuWeather(){
  if(ROOMWX==='clear') return;         // a clear room paints NOTHING — the byte proofs' friend
  const v=roomSeed();
  const t=perf(), calm=RM();
  const k9=Math.max(1,1/SC);           // flakes hold their designed SCREEN size (the E10 camera law)
  const w0=v.x1-v.x0, h0=v.y1-v.y0;
  if(ROOMWX==='snowfall'){
    const F=WXR.flakes, n=calm? (F.length*0.4)|0 : F.length;
    const top=v.y0, span=h0, vs=h0/MENU_H;
    for(let i=0;i<n;i++){
      const f=F[i];
      const y=calm? f.y : top+(((f.y-top)+t*f.v*vs)%span);
      const x=calm? f.x : f.x+Math.sin(t*f.s+f.p)*7;
      cx.fillStyle='rgba(110,132,158,0.34)';
      cx.beginPath(); cx.arc(x,y+1.2*k9,(f.r+0.6)*k9,0,7); cx.fill();
      cx.fillStyle='#FFFFFF';
      cx.beginPath(); cx.arc(x,y,f.r*k9,0,7); cx.fill();
    }
  } else if(ROOMWX==='dust'){
    const M=WXR.motes, n=calm? (M.length*0.4)|0 : M.length;
    for(let i=0;i<n;i++){
      const m=M[i];
      const x=calm? m.x : v.x0+((m.x-v.x0)+t*m.v)%w0;
      const y=m.y+Math.sin(t*m.s+m.p)*9;
      cx.globalAlpha=m.a*(0.7+0.3*Math.sin(t*m.s*1.7+m.p));
      cx.fillStyle='#F2C584';
      cx.beginPath(); cx.arc(x,y,m.r*k9,0,7); cx.fill();
    }
    cx.globalAlpha=calm?0.05:0.05+0.02*Math.sin(t*1.3);
    cx.strokeStyle='#FFE9C0'; cx.lineWidth=5*k9;
    for(let k of [0,1,2]){
      const y=74+k*16*k9;
      cx.beginPath(); cx.moveTo(v.x0+60,y);
      for(let x=v.x0+60;x<v.x1-60;x+=48) cx.quadraticCurveTo(x+24,y+(calm?0:Math.sin(t*2+x*0.07+k)*3),x+48,y);
      cx.stroke();
    }
    cx.globalAlpha=1;
  } else if(ROOMWX==='rain'){
    const D=WXR.drops, n=calm? (D.length*0.4)|0 : D.length, sl=RAIN_SLANT;
    cx.strokeStyle='rgba(157,191,230,0.5)'; cx.lineWidth=1.6*k9; cx.lineCap='round';
    cx.beginPath();
    for(let i=0;i<n;i++){
      const f=D[i];
      const y=v.y0+((f.y-v.y0)+t*f.v)%h0;
      const x=v.x0+((f.x-v.x0)+t*f.v*sl)%w0;
      cx.moveTo(x,y); cx.lineTo(x-f.l*k9*sl,y-f.l*k9);
    }
    cx.stroke(); cx.lineCap='butt';
    if(!calm) for(const g of WXR.rings){
      const k=((t+g.p)%g.T)/g.T;
      if(k>=0.35) continue;
      const q=k/0.35;
      cx.globalAlpha=0.5*(1-q); cx.strokeStyle=RIVER_LIGHT; cx.lineWidth=2*k9;
      cx.beginPath(); cx.ellipse(g.x,g.y,(4+30*q)*k9,(4+30*q)*0.45*k9,0,0,7); cx.stroke();
      cx.globalAlpha=1;
    }
  }
}

/* =====================================================================
   THE PIGGY BEDROOM (E23) — GVT's daily free-stars piggy on the boards.
   One claim per calendar day; consecutive days build a streak; every
   PIG_TIER_DAYS days a fresh coat of paint (PIG_COLORS) raises the pay.
   Empty = hop + a puff out the back + TOMORROW! — never a menu.
   ⚠ THE EPHEMERAL LAW GETS ONE CARVED EXCEPTION (amends E18): bedroom
   BUILDS still write NOTHING — but the piggy claim is REAL. It mints
   into the actual bank and it saves, exactly once, through pigTap's
   starMint. pigTap runs OUTSIDE the inBed wrapper, so save()'s BED.ctx
   guard never sees it: the line between sandcastle and piggy is the
   wrapper itself. Shy-UI does NOT hide her — she's a toy on the floor,
   not chrome.
   ===================================================================== */
let PIGGY={claimed:'',streak:0};   // the save's piggy block (v:11); fresh = never claimed
const PIG={hop:0,puffs:[],dayOv:null,x:PIG_SPOT.x,y:PIG_SPOT.y};   // garnish + placement (never saved)
const pigFmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function todayStr(){ return PIG.dayOv || pigFmt(new Date()); }     // GVT recipe; dayOv = the battery's calendar
function dayBack(n){ const [y,m,dd]=todayStr().split('-').map(Number); return pigFmt(new Date(y,m-1,dd-n)); }
function pigTier(s){ return Math.min(PIG_COLORS.length-1, Math.floor((s|0)/PIG_TIER_DAYS)); }
function pigPayout(s){ return (MINT.piggy|0)+PIG_TIER_BONUS*pigTier(s==null? PIGGY.streak : s); }
// the streak a claim TODAY would set: consecutive extends, a skipped day
// restarts at 1 (GVT's pigCheck, folded in lazily — no writes outside a claim)
function pigNextStreak(){ return PIGGY.claimed===dayBack(1)? (PIGGY.streak|0)+1 : 1; }
// the paint she WEARS right now: a missed day pops her back to pink on sight,
// write-free — the save only ever changes on a claim
function pigLiveStreak(){ const c=PIGGY.claimed; return (c===todayStr()||c===dayBack(1))? PIGGY.streak|0 : 0; }
function pigClaimable(){ return PIGGY.claimed!==todayStr() && pigPayout(pigNextStreak())>0; }
function pigTodayPays(){ return pigPayout(PIGGY.claimed===todayStr()? PIGGY.streak : pigNextStreak()); }
function pigHit(e){
  if(!PIG_SHOW||SCREEN!=='menu') return false;
  const mx=(e.clientX-OX)/SC, my=(e.clientY-OY)/SC;   // the menu painting's own inverse
  return Math.abs(mx-PIG.x)<58*PIG_SPOT.s && Math.abs(my-(PIG.y-8*PIG_SPOT.s))<52*PIG_SPOT.s;
}
function pigTap(){
  ac();
  PIG.hop=1;                            // the hop answers EVERY tap (GVT law)
  if(BED.shy) BED.idleT=0;              // a hand on the piggy is still a hand in the room
  if(!pigClaimable()){
    // empty today: joy, not a menu — a hop, a puff out the back, one kid word
    SND.pop();
    for(let i=0;i<3;i++) PIG.puffs.push({t:-i*0.08,dur:0.8,i});
    toast('TOMORROW!');
    return;                             // and ZERO writes — the spy proves it
  }
  PIGGY={claimed:todayStr(), streak:pigNextStreak()};
  SND.boing();
  // starMint = coin + HUD sync + the star flight + THE ONE SAVE (PIGGY rides in it)
  starMint(pigPayout(), PIG.x, PIG.y-46*PIG_SPOT.s);
  voiceAt('piggy');                     // "Nice" — you were given something
}
// the pig herself — one molded painter for the floor pig and the bank ledger.
// RAINBOW (the top coat) paints per-part through RAIN_ORDER, exactly how the
// rainbow livery paints per-car.
function pigArt(t,coin){
  const rain=t===PIG_COLORS.length-1;
  const P=i=>rain? LIVERY[RAIN_ORDER[i%RAIN_ORDER.length]] : PIG_COLORS[t];
  cx.lineJoin='round'; cx.lineCap='round';
  let c=P(1);
  for(const px of [-20,11]){
    cx.fillStyle=c.m; rr(px,16,9,11,3); cx.fill();
    cx.strokeStyle=c.d; cx.lineWidth=2.5; rr(px,16,9,11,3); cx.stroke();
  }
  c=P(0);
  cx.fillStyle=c.m; cx.beginPath(); cx.ellipse(0,0,30,23,0,0,7); cx.fill();
  cx.strokeStyle=c.d; cx.lineWidth=2.5; cx.beginPath(); cx.ellipse(0,0,30,23,0,0,7); cx.stroke();
  c=P(2);
  cx.fillStyle=c.m; cx.beginPath(); cx.moveTo(14,-22); cx.lineTo(25,-29); cx.lineTo(24,-14); cx.closePath(); cx.fill();
  cx.strokeStyle=c.d; cx.beginPath(); cx.moveTo(14,-22); cx.lineTo(25,-29); cx.lineTo(24,-14); cx.closePath(); cx.stroke();
  c=P(3);
  cx.fillStyle=c.m; cx.beginPath(); cx.ellipse(27,3,7.5,6,0,0,7); cx.fill();
  cx.strokeStyle=c.d; cx.beginPath(); cx.ellipse(27,3,7.5,6,0,0,7); cx.stroke();
  cx.fillStyle=c.d; cx.beginPath(); cx.arc(25,3,1.6,0,7); cx.fill();
  cx.beginPath(); cx.arc(30,3,1.6,0,7); cx.fill();
  cx.fillStyle='#23211E'; cx.beginPath(); cx.arc(13,-7,2.2,0,7); cx.fill();
  c=P(4);
  cx.strokeStyle=c.d; cx.lineWidth=2.2;
  cx.beginPath(); cx.moveTo(-30,2); cx.quadraticCurveTo(-38,-2,-34,-7); cx.quadraticCurveTo(-30,-11,-34,-13); cx.stroke();
  cx.fillStyle='#7E5A0E'; rr(-8,-26,16,4.5,2); cx.fill();
  if(coin){   // the coin halfway in = there's pay waiting today (the gold tell)
    cx.fillStyle='#F2C531'; cx.beginPath(); cx.ellipse(0,-30,9,7,0,Math.PI,0); cx.closePath(); cx.fill();
    cx.strokeStyle='#8F6B1E'; cx.lineWidth=2; cx.beginPath(); cx.ellipse(0,-30,9,7,0,Math.PI,0); cx.stroke();
  }
  cx.lineCap='butt';
}
function drawPig(){
  const s=PIG_SPOT.s, j=1-PIG.hop, hy=PIG.hop>0? -22*Math.sin(Math.PI*j) : 0;
  cx.save(); cx.translate(PIG.x,PIG.y); cx.scale(s,s);
  // the shadow stays on the boards while she hops (the E4 shadow law)
  cx.globalAlpha=0.25; cx.fillStyle='#000';
  cx.beginPath(); cx.ellipse(0,26,34+hy*0.25,7+hy*0.06,0,0,7); cx.fill(); cx.globalAlpha=1;
  cx.translate(0,hy); if(PIG.hop>0) cx.rotate(0.05*Math.sin(j*9));
  pigArt(pigTier(pigLiveStreak()), pigClaimable());
  cx.restore();
  // the "nothing left today" answer — a little puff out of the back hole (GVT recipe)
  for(const p of PIG.puffs){ if(p.t<=0) continue;
    const k=Math.min(1,p.t/p.dur);
    cx.globalAlpha=0.9*(1-k); cx.fillStyle='#e8e0cc';
    cx.beginPath();
    cx.arc(PIG.x-(40+18*k+p.i*6)*s, PIG.y-(6+13*k-p.i*4)*s, (5+9*k)*s, 0, 7);
    cx.fill(); cx.globalAlpha=1;
  }
}
// THE WHOLE FLOOR IS YOURS (E23) — derive the bedroom bounds from the viewport
// at boot/resize: every cell the screen can hold, minus nothing (the button
// rows and the piggy are BLOCKED cells, not missing ones). Extend-only,
// anchored on the attract grid, so every existing cell keeps its key and the
// oval keeps its pixels (the float-ulp law). Shrinking a window strands toys
// off-screen — they wait there, never deleted (E10's shrink-law spirit).
function bedBounds(){
  const cs=C*ATT_SCALE, s=PIG_SPOT.s;
  // the piggy holds her spot unless the big buttons would ever reach it
  // (tall thin windows) — then she scoots up the wall, never under a button
  let py=PIG_SPOT.y;
  const menuUp=$('menu').style.display!=='none';
  // E26: the big-button row is FURNITURE now — the paint shop is the one DOM
  // row left that could ever climb up to her on a tall thin window
  const mb=menuUp? $('paint').getBoundingClientRect() : null;
  if(mb&&mb.height){
    const tx0=(mb.left-OX)/SC, tx1=(mb.right-OX)/SC, ty=(mb.top-OY)/SC;
    if(PIG_SPOT.x+44*s>tx0 && PIG_SPOT.x-44*s<tx1) py=Math.min(py, ty-46*s-6);
  }
  PIG.x=PIG_SPOT.x; PIG.y=Math.max(300,py);
  // bounds: the visible menu rect, in attract cells (extend-only vs E18's strip)
  const mx0=(0-OX)/SC, my0=(0-OY)/SC, mx1=(W-OX)/SC, my1=(H-OY)/SC;
  BED.gx0=Math.min(BR_LO, Math.floor((mx0-ATT.ox)/cs));
  BED.gy0=Math.min(BR_LO, Math.floor((my0-ATT.oy)/cs));
  BED.gw =Math.max(BR_GW, Math.floor((mx1-ATT.ox)/cs)+1);
  BED.gh =Math.max(BR_GH, Math.floor((my1-ATT.oy)/cs)+1);
  // blocked cells: the piggy's footprint + every #menu child block (the three
  // big buttons, the toybox/shop chips, the paint shop) — measured, per resize
  const blk=new Set();
  const addRect=(x0,y0,x1,y1)=>{
    for(let gx=Math.floor((x0-ATT.ox)/cs); gx<=Math.floor((x1-ATT.ox)/cs); gx++)
      for(let gy=Math.floor((y0-ATT.oy)/cs); gy<=Math.floor((y1-ATT.oy)/cs); gy++)
        blk.add(key(gx,gy));
  };
  addRect(PIG.x-44*s, PIG.y-40*s, PIG.x+40*s, PIG.y+30*s);
  if(menuUp) for(const el of $('menu').children){
    const r=el.getBoundingClientRect();
    if(r.width&&r.height) addRect((r.left-OX)/SC,(r.top-OY)/SC,(r.right-OX)/SC,(r.bottom-OY)/SC);
  }
  // E26: every object's footprint (pill included) is furniture — blocked cells
  // through THE predicate, exactly like the piggy's spot
  for(const o of ROOM_OBJS) addRect(o.hit.x,o.hit.y,o.hit.x+o.hit.w,o.hit.y+o.hit.h);
  BED.blk=blk;
}

// the attract loop: a REAL 4×2 oval of real pieces, ridden by real riders.
// E18: the oval keeps its EXACT keys and transform (any re-key shifts float
// operands and hairline AA — measured); the bedroom floor instead spreads to
// negative cells around it via the GX0/GY0 lower bound inside the wrapper.
function buildAttract(){
  AT.grid.clear(); AT.hg.clear();
  const put=(x,y,t,r)=>AT.grid.set(key(x,y),mkPiece(t,r));
  put(0,0,'c',1); put(1,0,'s',0); put(2,0,'s',0); put(3,0,'c',2);
  put(0,1,'c',0); put(1,1,'s',0); put(2,1,'s',0); put(3,1,'c',3);
  RGRID=AT.grid; HGRID=AT.hg;
  try{
    const loco={cx:1,cy:0,pi:0,dir:1,s:48,el:0};
    AT.cars=[{type:'loco',rd:loco,face:1,squash:0}];
    const tail=['tender','cab'];                       // the loco + 2 cars, both in livery
    for(let i=1;i<=tail.length;i++){
      const rd=clone(loco); back(rd,GAP*i);
      AT.cars.push({type:tail[i-1],rd,face:1,squash:0});
    }
  } finally { RGRID=grid; HGRID=hgrid; }
}
function menuUpdate(dt){
  if(SCREEN==='menu') shyTick(dt);     // E18: the board keeps the oval turning, but only the menu is shy
  inBed(()=>{                          // E18: the world globals ARE the bedroom's in here
    const step=ATT_SPEED*dt;
    attRun(AT.cars,step);              // the stock toy — a closed oval never turns around
    const kid=TRAIN.placed&&TRAIN.running;
    if(kid){ attRun(TRAIN.cars,step); BED.wheel+=step/8; TRAIN.dist+=step; }
    AT.wheel+=step/8;
    AT.smokeT-=dt;
    if(AT.smokeT<=0){
      AT.smokeT=0.34;
      for(const cars of (kid? [AT.cars,TRAIN.cars] : [AT.cars])){   // every running loco puffs
        if(!cars.length) continue;
        const loco=cars[0], p=pos(loco.rd);
        const artAng=p.ang+(loco.face<0?Math.PI:0);
        const flip=Math.cos(artAng)<0;
        const lx=18*KART, ly=(flip?28:-28)*KART;
        const ca=Math.cos(artAng), sa=Math.sin(artAng);
        AT.smoke.push({ x:p.x+ca*lx-sa*ly, y:p.y+sa*lx+ca*ly, t:0, dur:1.2,
                        vx:(Math.random()-0.5)*10, vy:-30, r:3+Math.random()*2 });
      }
    }
    // E18: the bedroom pieces pop/settle exactly like BUILD's (grid is AT.grid here)
    for(const pc of grid.values()){
      if(pc.ra){ pc.ra.k-=dt*8; if(pc.ra.k<=0) pc.ra=null; }
      if(pc.pop>0) pc.pop=Math.max(0,pc.pop-dt*5);
    }
    for(const c of AT.cars) if(c.squash>0) c.squash=Math.max(0,c.squash-dt*4);
    for(const c of TRAIN.cars) if(c.squash>0) c.squash=Math.max(0,c.squash-dt*4);
    for(let i=fx.length-1;i>=0;i--){ fx[i].t+=dt; if(fx[i].t>=fx[i].dur) fx.splice(i,1); }
  });
  for(const s of AT.smoke){ s.t+=dt; s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy-=8*dt; }
  // in place, never reassigned — BED.smoke aliases this array (whistle puffs land here)
  for(let i=AT.smoke.length-1;i>=0;i--) if(AT.smoke[i].t>=AT.smoke[i].dur) AT.smoke.splice(i,1);
  // E23: the piggy's garnish — hop decay, back-hole puffs, and the star
  // flights her pay rides on (update() ticks these for the game screens;
  // the menu ticks its own). All empty on an untouched menu: zero paint.
  roomTick(dt);   // E26: the alive-room clock — pick-mes, the dog, the box lid (dt only, frozen-clock safe)
  if(PIG.hop>0) PIG.hop=Math.max(0,PIG.hop-dt*2.6);
  for(const p of PIG.puffs) p.t+=dt;
  for(let i=PIG.puffs.length-1;i>=0;i--) if(PIG.puffs[i].t>=PIG.puffs[i].dur) PIG.puffs.splice(i,1);
  for(const f of flights) f.t+=dt;
  flights=flights.filter(f=>f.t<f.dur);
  if(MENU_MUSIC){ AT.musT-=dt; if(AT.musT<=0){ AT.musT=5.5; SND.lull(); } }
}

      if(e2.k==='puff'){ cx.globalAlpha=(1-k)*0.7; cx.fillStyle='#e8e0cc';
        cx.beginPath(); cx.arc(e2.x,e2.y,e2.R*k+6,0,7); cx.fill(); cx.globalAlpha=1; } }
    if(BED.scen.size) inBed(()=>{ drawArches(); drawBalloons(); });     // E37: fliers fly late (the game's layering law)
    if(DRAG&&BED.on) inBed(drawGhosts);                                 // E18: the SAME ghost pipeline, swapped in
  } finally { RGRID=grid; HGRID=hgrid; }
  cx.restore();
  drawRoomDog();   // E26: the gag trots in FRONT of the furniture, under the labels
  menuWeather();   // E37 THE ROOM SKY — over the room, under the labels (clear = zero paint)
  // E26: the pills — furniture labels, painted like the piggy: always on, never shy
  for(const o of ROOM_OBJS) drawPill(o.px,o.py,o.label());
  if(MENU_PROPS.includes('sign')){
    // E18 THE SHY UI: the painted title fades with the DOM chrome. An untouched
    // menu holds a===1 and paints the sign exactly as before — byte-identical.
    if(BED.a>=1) menuSign();
    else if(BED.a>0.002){ const k=BED.a*BED.a*(3-2*BED.a);
      cx.globalAlpha=k; menuSign(); cx.globalAlpha=1; }
  }
  // E23: minted stars fly on the menu too (the piggy's pay) — draw()'s exact
  // recipe in screen space. An empty list paints nothing: byte-proofs hold.
  cx.setTransform(DPR,0,0,DPR,0,0);
  for(const f of flights){ if(f.t<=0) continue;
    const k=f.t/f.dur, e2=k*k*(3-2*k);
    star5(f.x+(f.tx-f.x)*e2, f.y+(f.ty-f.y)*e2-Math.sin(Math.PI*k)*36, 0.9+0.35*(1-k), '#F2C531'); }
  cx.globalAlpha=1;

/* =====================================================================
   SOUND — small synth kit through one gate (GVT palette)
   ===================================================================== */
const AU={ctx:null,g:null,on:true};
function ac(){
  if(!AU.ctx){
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
    AU.ctx=new AC(); AU.g=AU.ctx.createGain(); AU.g.gain.value=0.5; AU.g.connect(AU.ctx.destination);
  }
  if(AU.ctx.state==='suspended') AU.ctx.resume();
  return AU.ctx;
}
function tone(f,dur,type,vol,slideTo,when){
  const a=ac(); if(!a||!AU.on) return;
  const t0=a.currentTime+(when||0);
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo),t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(vol,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(AU.g); o.start(t0); o.stop(t0+dur+0.05);
}
let NBUF=null;
function noise(dur,freq,vol,type,when,slideTo){
  const a=ac(); if(!a||!AU.on) return;
  if(!NBUF){ NBUF=a.createBuffer(1,a.sampleRate*0.5,a.sampleRate);
    const d=NBUF.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  const t0=a.currentTime+(when||0);
  const s=a.createBufferSource(); s.buffer=NBUF; s.loop=true;
  const f=a.createBiquadFilter(); f.type=type||'bandpass'; f.frequency.setValueAtTime(freq,t0); f.Q.value=1.1;
  if(slideTo) f.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo),t0+dur);   // E9: the fart falls
  const g=a.createGain();
  g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f); f.connect(g); g.connect(AU.g); s.start(t0); s.stop(t0+dur+0.05);
}
let chuffSide=false;
/* =====================================================================
   SOUND PACKS (E9) — the store's whole audio shelf. SND.whistle / .bonk
   / .ding are DISPATCHERS now: one line each, reading the equipped pack
   id out of `equip` and calling its recipe here. Every recipe is
   tone()/noise() only — sound PACKS stay pure synth (they are per-pack
   recipes and there are 16 of them; recording them would bloat the one
   file 16×). The one deliberate exception is E12's VOICE below: three
   recorded lines on their own bus — that is the game talking to the
   child, not a pack on the shelf. The three free packs
   (wh_peep / cr_bonk / bl_ding) are today's sounds, BYTE-IDENTICAL.
   ===================================================================== */
const PACKS={
  // WHISTLES — what the loco says
  wh_peep(){ tone(440,0.85,'triangle',0.22); tone(554,0.85,'triangle',0.2); noise(0.6,1200,0.05,'lowpass'); },
  wh_horn(){ tone(233,0.5,'square',0.14); tone(185,0.5,'square',0.13);                       // the low two-tone diesel
             tone(220,0.55,'square',0.12,undefined,0.42); tone(175,0.55,'square',0.11,undefined,0.42);
             noise(0.5,400,0.05,'lowpass'); },
  wh_chime(){ tone(523,0.9,'triangle',0.14); tone(659,0.9,'triangle',0.13,undefined,0.07);   // a real chord
              tone(784,1.0,'triangle',0.13,undefined,0.14); },
  wh_toot(){ tone(310,0.5,'sawtooth',0.11,930); noise(0.4,1500,0.06,'bandpass',0.05,3200);   // the kazoo slide up
             tone(620,0.16,'square',0.07,undefined,0.4); },
  wh_quack(){ tone(300,0.14,'square',0.16,200); tone(255,0.12,'square',0.13,180,0.16);
              tone(210,0.16,'square',0.11,150,0.3); },
  // THE FART HORN — a descending brap ≤0.5s. Four staggered DETUNED sawtooth pairs
  // (each pair beats at a few Hz — that beating IS the wobble), band-passed noise
  // air over the top, one sliding sub underneath. Same volume band as the other
  // whistles: it must never be the loudest thing in the game. FART_PITCH = Wyatt.
  wh_fart(){ const P=FART_PITCH;
             tone(105*P,0.16,'sawtooth',0.11,80*P);      tone(110*P,0.16,'sawtooth',0.1,83*P);
             tone(92*P,0.16,'sawtooth',0.11,72*P,0.11);  tone(96*P,0.16,'sawtooth',0.1,75*P,0.11);
             tone(80*P,0.16,'sawtooth',0.1,62*P,0.22);   tone(84*P,0.16,'sawtooth',0.09,65*P,0.22);
             tone(68*P,0.16,'sawtooth',0.09,50*P,0.33);  tone(71*P,0.16,'sawtooth',0.08,52*P,0.33);
             noise(0.1,280*P,0.2,'lowpass',0,180*P);
             noise(0.1,230*P,0.18,'lowpass',0.09,150*P);
             noise(0.1,190*P,0.17,'lowpass',0.18,120*P);
             noise(0.1,160*P,0.15,'lowpass',0.27,100*P);
             noise(0.13,130*P,0.13,'lowpass',0.36,80*P);
             tone(52*P,0.5,'triangle',0.15,36*P); },

/* =====================================================================

   human voice in the game. Not a PACK: the voice is the game talking
   to the child, so it gets its own bus and its own laws. One line, one
   meaning, everywhere: "You did it" = you finished something ·
   "Nice" = you were given something · "Okay" = the game heard you.

   autoplay-exempt — the audible ctx is still born on the first real
   tap); play through AU.g behind AU.on (the mute button mutes the

const VOICE_AT = {          // moment -> line. Wyatt re-aims the whole feature here (null = that moment goes quiet).
  win:'youdidit', firstLap:'youdidit', toy:'nice', buy:'okay',
  piggy:'nice',   // E23: the piggy GAVE you something — same word as the toy card
};
let voiceVol=VOICE_VOL, voiceCur=null, voiceNextOk=0;
const VOICE_LOG=[];         // append-only {id,t,dropped,why?} per request — how a battery proves the gap law
function voiceMark(id,dropped,why){ VOICE_LOG.push({id,t:performance.now()/1000,dropped,why}); }
(function voiceBoot(){      // decode all three NOW — the first win a child ever earns must speak
  try{
    const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
    if(!OAC) return;                       // no offline ctx: the voice sits out, the synth still sings
    const o=new OAC(1,1,44100);
    for(const id in VOICE){
      const v=VOICE[id], b=atob(v.b64.slice(v.b64.indexOf(',')+1));
      const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i);
      // callback form on purpose — every WebKit understands it (the promise form is
      // Safari 14.1+, and E11 is a WKWebView). Chrome returns a twin promise anyway;
      // swallow its rejection so a bad decode can never log-spam.
      const p=o.decodeAudioData(u.buffer,buf=>{ v.buf=buf; },()=>{});
      if(p&&p.catch) p.catch(()=>{});
    }
  }catch(e){}
})();
function voiceSay(id,delay){ // the one door every voice request walks through
  try{
    const v=VOICE[id]; if(!v){ voiceMark(id,true,'unknown'); return; }
    const now=performance.now()/1000;
    if(now<voiceNextOk){ voiceMark(id,true,'gap'); return; }   // inside the gap: dropped, NOT queued
    if(!v.buf){ voiceMark(id,true,'nobuf'); return; }          // still decoding / decode failed: silence
    const a=ac(); if(!a||!AU.on){ voiceMark(id,true,'mute'); return; }
    if(voiceCur){ try{ voiceCur.stop(); }catch(e){} }          // ONE VOICE AT A TIME
    const s=a.createBufferSource(); s.buffer=v.buf;            // decoded buffer is context-independent
    const g=a.createGain(); g.gain.value=voiceVol*(v.trim||1);
    s.connect(g); g.connect(AU.g);                             // the same bus as every synth note
    s.start(a.currentTime+(delay||0));
    voiceCur=s; voiceNextOk=now+(delay||0)+VOICE_GAP;
    voiceMark(id,false);
  }catch(e){}
}
function voiceAt(m){        // moment -> line through the re-aim table
  const id=VOICE_AT[m]; if(!id) return;
  voiceSay(id,(m==='win'||m==='firstLap')? VOICE_DELAY:0);     // the win line lands on top of the card, after the bugle's first note
}

// one serializer, three callers: the save file, the free-play stash the campaign
// swaps out (E5 — FREE PLAY IS SACRED), and the campaign WIP (which drops glued rows)
function serWorld(){
  const g=[];
  for(const [k,pc] of grid){ if(pc.t==='ref') continue; g.push([k,pc.t,pc.r,pc.sel|0,pc.elev|0]); }
  for(const [k,pc] of hgrid) g.push([k,pc.t,pc.r,pc.sel|0,1]);
  const sc=[]; for(const [k,s] of scen) sc.push([k,s.t,s.v|0]);
  return { grid:g, scen:sc, consist:consist.slice(),
    train: TRAIN.placed? { cars:TRAIN.cars.map(c=>({t:c.type,cx:c.rd.cx,cy:c.rd.cy,pi:c.rd.pi,dir:c.rd.dir,s:c.rd.s,f:c.face,e:c.rd.el?1:0})), F:TRAIN.F } : null };
}
// apply a serialized world verbatim (load + the campaign's free-play restore)
function appWorld(d){
  grid.clear(); hgrid.clear(); scen.clear();
  TRAIN.placed=false; TRAIN.running=false; TRAIN.cars=[]; trailClear();   // E28: a swapped world starts clean
  // v:1 rows are [k,t,r] (no sel, no scen block) — they load clean, scenery empty.
  // v:1/v:2 carry no colour — they migrate to v:3 as RED (today's exact art).
  // v:1/v:2/v:3 rows carry no elev — they migrate to v:4 all on the ground.
  for(const [k,t,r,sel,elev] of (d.grid||[])){
    if(!PATHS[t]) continue;
    const [x,y]=k.split(',').map(Number);

/* =====================================================================
   PLAY! — THE WIND-UP RUG (E6). The two-year-old's mode: a finished
   figure-8 already chugging when the lid opens, a tray of more trains
   to plop on, and exactly one rule — two trains that touch go BONK.
   No palette, no shed, no hints, no editing, no failure. PLAY persists
   NOTHING (stateless law): every visit boots this same lovely map with
   one red train, and the build/campaign saves are never read or

const PLAY={ on:false, trains:[], crashes:0, respawnT:0, nextId:1, loop:null, mapIdx:0, wx:null };   // wx = E35 sky-pill override, per visit
let PFREE=null;               // the stashed build-rug world while the wind-up rug is out
// E17: THE CYCLE — how many times the lid has opened. The map for a visit is
// PLAYMAPS[PLAYI%PLAY_CYCLE], stamped into PLAY.mapIdx at entry, then PLAYI
// advances and saves (v:10). The ONLY thing PLAY remembers; attract, campaign
// and BUILD never touch it.
let PLAYI=0;
// E30 — GRAVITY COMES TO PLAY (the E15 probe, verbatim, per train). Self-gating
// exactly like BUILD's: flat track ⇒ grade 0 ⇒ mul eases to (and HOLDS) exactly
// 1.0 ⇒ the three flat rugs step byte-identically (×1 is float-exact). One eased
// mul per consist, never per car; a climb latches the crest and the FIRST
// descent after it whooshes — once — and throws every rider's arms in the air.
function playGravTick(tr,dt){
  const lc=tr.cars[0].rd, f=clone(lc), b=clone(lc);

}
let playClackAcc=0;   // ONE chain-lift clock for the whole rug (the chug law) — flat maps never feed it
// E30 — the pass BOARDS: riders in PLAY ride a PER-MAP door, so maps 1-3 stay
// exactly the smash mode they always were (RIDERS_PLAY remains the global dial).
const playRiders=()=>PLAY.on&&(RIDERS_PLAY||!!playMap().riders);
function playPose(tr,p,t,pri){   // the E15 pose ladder, per PLAY train — poses are paint

function playYay(tr){            // the downhill whoosh, per train — arms UP + a tiny yay (riders only)

// Walk the glued circuit once and rule it: (cell,elev,path) -> arc coordinate. Every
// map's circuit is ONE closed path (a figure-8 crosses its own diamond twice on
// different paths), so every rider and every spawn lives on this single ruler.
function buildLoopMap(){
  const M=playMap();
  const st=M.track.find(row=>row[0]==='st')||M.track[0];
  const rd={cx:st[2],cy:st[3],pi:0,dir:1,s:0,el:0};
  const segs=[]; let d=0;
  for(let g=0; g<200; g++){
    const pc=pieceOf(rd), p=pathsOf(pc)[rd.pi];
    segs.push({k:key(rd.cx,rd.cy), el:rd.el|0, pi:rd.pi, dir:rd.dir, d0:d, len:p.len});
    d+=p.len;
    rd.s=rd.dir>0? p.len:0;
    if(!enter(rd, p.ports[rd.dir>0?1:0])) break;                      // can't happen on the glued loop
    if(rd.cx===st[2]&&rd.cy===st[3]&&rd.pi===0&&rd.dir===1) break;    // home again — the circuit closed
  }
  const by=new Map(); for(const sg of segs) by.set(sg.k+':'+sg.el+':'+sg.pi,sg);
  const home=by.get(key(M.start[0],M.start[1])+':0:0');
  PLAY.loop={ segs, by, len:d, home: home? home.d0+home.len/2 : 0 };

const loopCoord=rd=>{
  const sg=PLAY.loop && PLAY.loop.by.get(key(rd.cx,rd.cy)+':'+(rd.el?1:0)+':'+rd.pi);
  return sg? sg.d0+(sg.dir>0? rd.s : sg.len-rd.s) : null;
};
function riderAt(d){                  // materialize a rider at loop coordinate d
  const L=PLAY.loop.len; d=((d%L)+L)%L;

    if(d<sg.d0||d>sg.d0+sg.len) continue;
    const off=d-sg.d0, [x,y]=sg.k.split(',').map(Number);
    return {cx:x,cy:y,pi:sg.pi,dir:sg.dir,s:sg.dir>0? off : sg.len-off,el:sg.el};
  }
  const sg=PLAY.loop.segs[PLAY.loop.segs.length-1], [x,y]=sg.k.split(',').map(Number);

// THE SPAWN LAW: the new train lands on the free stretch FARTHEST from every train —
// maximize the minimum arc distance over every car it will drop — and never into a
// cell any rider occupies RIGHT NOW (the diamond shares one cell between two arcs
// that are far apart on the ruler, so arc distance alone isn't enough).
function playSpot(n){
  const L=PLAY.loop.len, occ=[], cells=new Set();
  for(const tr of PLAY.trains){ if(tr.dying) continue;
    for(const c of tr.cars){ const lc=loopCoord(c.rd); if(lc!=null) occ.push(lc);
      cells.add(key(c.rd.cx,c.rd.cy)+':'+(c.rd.el?1:0)); } }
  if(!occ.length) return PLAY.loop.home;      // an empty rug: the resident's home straight
  let best=-1, bestD=null;
  const STEPS=Math.max(96,Math.round(L/12));
  for(let i=0;i<STEPS;i++){
    const d0=L*i/STEPS; let mn=Infinity, ok=true;
    for(let ci=0;ci<n;ci++){

      if(cells.has(key(r.cx,r.cy)+':'+(r.el?1:0))){ ok=false; break; }
      for(const o of occ){ const ad=Math.abs(dc-o), dd=Math.min(ad,L-ad); if(dd<mn) mn=dd; }

// E32 — the finger follows BUILD's law (the E4 audit): pieceTop resolves the
// drop to the VISIBLE deck, so an over/under cell lands the train on the
// trestle the child sees, never the tunnel beneath it; the spiral's other
// cells deref to their anchor exactly like pieceAt, so the whole tower takes
// the drop. One deck may still host two arcs (the crossing); the first seg
// found takes it — either way the train lands on the diamond and runs, which
// is all a two-year-old asked.
function playDropD(cell){
  if(!PLAY.loop||!cell) return null;
  const pc=pieceTop(cell[0],cell[1]);

function playAdd(color,speed,cars,atD){

    for(let i=0;i<n;i++) o.push(PLAY_POOL[Math.floor(Math.random()*PLAY_POOL.length)]);
    return o; })();

// smoke, tumble-fade ~0.8s, gone. Everyone else keeps rolling. ⚠ (cell,elev) key,

function playCrash(a,b,ck){

  }

function playUpdate(dt){

  const dims={sm:[46,32],lg:[66,46],xl:[90,62]}[id], w=dims[0], h=dims[1];
  const x=(104-w)/2, y=(104-h)/2;
  g.fillStyle='#4A1A12'; g.fillRect(x-5,y-5,w+10,h+10);
  g.fillStyle='#63251C'; g.fillRect(x,y,w,h);
  g.strokeStyle='#8F4634'; g.lineWidth=2; g.strokeRect(x+4,y+4,w-8,h-8);
  g.globalAlpha=0.4; g.strokeStyle='#7A3627'; g.lineWidth=1.5;
  g.beginPath();
  for(let yy=y+10;yy<y+h-6;yy+=9){ g.moveTo(x+6,yy); g.lineTo(x+w-6,yy); }
  g.stroke(); g.globalAlpha=1;
}
function rugTileLand(g,id){

  g.fillStyle='#4A1A12'; g.fillRect(x-4,y-4,w+8,h+8);
  g.fillStyle= id==='west'? '#8B3E1E' : id==='snow'? '#E9EEF4' : id==='mountain'? '#7C9A55' : id==='jungle'? '#456F36' : '#63251C';
  g.fillRect(x,y,w,h);
  if(id==='rug'){
    g.strokeStyle='#8F4634'; g.lineWidth=2; g.strokeRect(x+5,y+5,w-10,h-10);
    g.globalAlpha=0.4; g.strokeStyle='#7A3627'; g.lineWidth=1.5;
    g.beginPath(); for(const yy of [y+22,y+34,y+46]){ g.moveTo(x+8,yy); g.lineTo(x+w-8,yy); } g.stroke();
    g.globalAlpha=1;
  } else if(id==='west'){
    g.globalAlpha=0.5; g.strokeStyle='#7A3318'; g.lineWidth=2;
    g.beginPath(); for(const yy of [y+16,y+34,y+52]){ g.moveTo(x+6,yy); g.quadraticCurveTo(x+w/2,yy-4,x+w-6,yy); } g.stroke();
    g.globalAlpha=1;
    g.strokeStyle='#4E7F46'; g.lineCap='round';
    g.lineWidth=8; g.beginPath(); g.moveTo(x+24,y+52); g.lineTo(x+24,y+18); g.stroke();
    g.lineWidth=5; g.beginPath(); g.moveTo(x+15,y+40); g.lineTo(x+15,y+27); g.moveTo(x+33,y+44); g.lineTo(x+33,y+31); g.stroke();
    g.lineCap='butt';
    g.fillStyle='#C9713C';
    g.beginPath(); g.moveTo(x+56,y+44); g.lineTo(x+62,y+22); g.lineTo(x+78,y+22); g.lineTo(x+84,y+44); g.closePath(); g.fill();
    g.fillStyle='#DB8B4C'; g.fillRect(x+61,y+18,18,6);

    // E30 — meadow combing, one snowcapped peak, one proud pine

    g.beginPath(); for(const yy of [y+42,y+54]){ g.moveTo(x+6,yy); g.quadraticCurveTo(x+w/2,yy-4,x+w-6,yy); } g.stroke();
    g.globalAlpha=1;
    g.fillStyle='#8C9096';
    g.beginPath(); g.moveTo(x+14,y+46); g.lineTo(x+38,y+8); g.lineTo(x+62,y+46); g.closePath(); g.fill();
    g.fillStyle='#787D85';
    g.beginPath(); g.moveTo(x+38,y+8); g.lineTo(x+62,y+46); g.lineTo(x+45,y+46); g.closePath(); g.fill();
    g.fillStyle='#F4F8FC';
    g.beginPath(); g.moveTo(x+38,y+8); g.lineTo(x+48,y+23); g.lineTo(x+42,y+20); g.lineTo(x+38,y+25);
    g.lineTo(x+33,y+19); g.lineTo(x+28,y+23); g.closePath(); g.fill();
    g.fillStyle='#6B4A2C'; g.fillRect(x+70,y+48,5,9);
    g.fillStyle='#33552F';
    g.beginPath(); g.moveTo(x+61,y+51); g.lineTo(x+83,y+51); g.lineTo(x+72,y+31); g.closePath(); g.fill();
    g.fillStyle='#3C6236';
    g.beginPath(); g.moveTo(x+64,y+41); g.lineTo(x+80,y+41); g.lineTo(x+72,y+23); g.closePath(); g.fill();
  } else if(id==='jungle'){
    // E31 — floor combing, one giant frond fan, a sun-dapple pool, one orchid dot
    g.globalAlpha=0.55; g.strokeStyle='#436B33'; g.lineWidth=2;
    g.beginPath(); for(const yy of [y+44,y+56]){ g.moveTo(x+6,yy); g.quadraticCurveTo(x+w/2,yy-4,x+w-6,yy); } g.stroke();

    g.globalAlpha=0.75; g.strokeStyle='#D7E1EC'; g.lineWidth=2;
    g.beginPath(); for(const yy of [y+16,y+32,y+48]){ g.moveTo(x+6,yy); g.quadraticCurveTo(x+w/2,yy+4,x+w-6,yy); } g.stroke();
    g.globalAlpha=1;
    g.fillStyle='#F9FCFF'; g.beginPath(); g.ellipse(x+26,y+46,16,9,0,0,7); g.fill();
    g.strokeStyle='#8C9AAD'; g.lineWidth=2; g.beginPath(); g.ellipse(x+26,y+46,16,9,0,0,7); g.stroke();

function rugTileWx(g,id){
  if(id==='clear'){
    g.fillStyle='#F2C531'; g.beginPath(); g.arc(52,50,18,0,7); g.fill();
    g.strokeStyle='#F2C531'; g.lineWidth=4; g.lineCap='round';
    for(let i=0;i<8;i++){ const a=i*Math.PI/4;
      g.beginPath(); g.moveTo(52+Math.cos(a)*26,50+Math.sin(a)*26);
      g.lineTo(52+Math.cos(a)*34,50+Math.sin(a)*34); g.stroke(); }
    g.lineCap='butt';
  } else if(id==='snowfall'){
    for(const [px,py,r] of [[30,28,4],[62,20,3],[80,42,4.5],[44,52,3.5],[22,66,4],[58,72,3],[84,78,3.5],[38,84,2.8]]){
      g.fillStyle='rgba(110,132,158,0.4)'; g.beginPath(); g.arc(px,py+2,r+0.8,0,7); g.fill();
      g.fillStyle='#FFFFFF'; g.beginPath(); g.arc(px,py,r,0,7); g.fill();
    }
  } else if(id==='dust'){
    g.strokeStyle='rgba(242,197,132,0.65)'; g.lineWidth=3; g.lineCap='round';
    g.beginPath(); g.moveTo(16,60); g.quadraticCurveTo(42,44,66,56); g.quadraticCurveTo(84,64,90,52); g.stroke();
    g.lineCap='butt';
    g.fillStyle='#F2C584';
    for(const [px,py,r] of [[28,40,3],[52,32,2.4],[74,38,3.2],[40,68,2.6],[64,74,3],[86,66,2.2]]){
      g.beginPath(); g.arc(px,py,r,0,7); g.fill();
    }
  } else {
    g.strokeStyle='#9DBFE6'; g.lineWidth=3; g.lineCap='round';
    g.beginPath();
    for(const [px,py] of [[30,18],[52,14],[74,20],[40,44],[64,40],[86,46]]){
      g.moveTo(px,py); g.lineTo(px-7,py+22);
    }
    g.stroke(); g.lineCap='butt';
    g.strokeStyle='#9DBFE6'; g.lineWidth=2.5;
    g.beginPath(); g.ellipse(46,82,16,6,0,0,7); g.stroke();
    g.beginPath(); g.ellipse(76,74,9,3.5,0,0,7); g.stroke();
  }
}
// the picked tile wears the gold border; called on every pick, load and mode swap
function rugSync(){
  for(const t of RUG_TILES){
    const on= t.kind==='size'? SIZE===t.id : t.kind==='land'? LAND===t.id : WEATHER===t.id;
    t.el.classList.toggle('on',on);
  }
  // E35: the sky pills mark by the ACTIVE sky — in BUILD that IS the kid's
  // WEATHER (RUG-tile parity), on a rug or level it's the visit's own sky.
  for(const m of MAGIC_TILES) m.el.classList.toggle('on',activeWeather()===m.id);
}
// ---- E35 THE SKY PILLS: the audit's headliners, pinned above every fold ----
// BUILD tap = the RUG weather tile's exact ceremony (WEATHER + tok + save —
// the deep path keeps working, this is promotion not relocation); PLAY and
// campaign taps land in the per-visit wx slots (paint-only, zero writes).
function buildMagic(){
  const wrap=$('magic');
  const skyTap=id=>{
    ac();
    if(activeWeather()===id){ SND.click(); return; }
    if(PLAY.on) PLAY.wx=id;
    else if(CAMP.on) CAMP.wx=id;
    else { WEATHER=id; save(); }
    SND.tok(); rugSync();
  };
  for(const [id,ico,name] of [['clear','☀️','CLEAR'],['snowfall','❄️','SNOW'],
                              ['rain','🌧','RAIN'],['dust','🌪','DUST']]){
    const b=document.createElement('button'); b.className='ptab'; b.type='button';
    b.textContent=ico+' '+name;
    b.addEventListener('click',()=>skyTap(id));
    wrap.appendChild(b); MAGIC_TILES.push({id,el:b});
  }
  rugSync();
}
function buildPalette(){
  buildMagic();   // E35: the sky pills seat first — pinned above the fold, part of the rail's boot
  const body=$('railBody');
  const groups={ track:document.createElement('span'), scen:document.createElement('span'),
                 town:document.createElement('span'), friends:document.createElement('span'),
                 rug:document.createElement('span') };
  // E33: each department's .rgrp span sits right after its plaque in the rail
  // column — an OPEN group is display:contents (stylesheet) so its cards
  // flatten into the column; a folded one is display:none inline. Same card
  // nodes as ever, new house (the accordion is railOpen below).
  for(const k2 in groups) groups[k2].className='rgrp';
  body.insertBefore(groups.track,$('tabScen'));
  body.insertBefore(groups.scen,$('tabTown'));
  body.insertBefore(groups.town,$('tabFriends'));
  body.insertBefore(groups.friends,$('tabTrains'));
  body.appendChild(groups.rug);
  groups.scen.style.display='none'; groups.town.style.display='none'; groups.friends.style.display='none';
  groups.rug.style.display='none';
  const mk=(layer,t,name,paint)=>{

    lb.textContent=name; b.appendChild(cv); b.appendChild(lb); groups[layer].appendChild(b);
    cv.width=104*ICON_RES; cv.height=104*ICON_RES;

    withCtx(g,()=>drawPieceArt({t,r:t==='c'?1:0,sel:0,elev:0,latch:null},0,0));
  });
  for(const t of SCEN_TAB) mk('scen',t,defOf(t).name,g=>scenIcon(g,t));
  for(const t of TOWN_TAB) mk('town',t,defOf(t).name,g=>scenIcon(g,t));
  for(const t of FRIEND_TAB) mk('friends',t,defOf(t).name,g=>scenIcon(g,t));
  // ---- THE RUG TAB (E10): SIZE · LAND · WEATHER — picture tiles, tap to pick ----
  const mkRug=(kind,id,name,paint)=>{
    const b=document.createElement('button'); b.className='pbtn'; b.type='button';
    b.style.touchAction='pan-y';   // E20→E27: a tap-tile is shelf wood — swipes scroll the (vertical) shelf, taps pick
    const cv=document.createElement('canvas'); const lb=document.createElement('small');
    lb.textContent=name; b.appendChild(cv); b.appendChild(lb); groups.rug.appendChild(b);
    cv.width=104*ICON_RES; cv.height=104*ICON_RES;
    const gr=cv.getContext('2d'); gr.scale(ICON_RES,ICON_RES);   // tiles paint absolute in 104-space
    paint(gr);
    b.addEventListener('click',()=>{
      if(barDragged()) return;     // E20: a scrolled shelf never picks (the E13 aisle law)
      ac();
      if(kind==='size'){ sizeSet(id); return; }
      if(kind==='land'){ if(LAND!==id){ LAND=id; SND.tok(); save(); } else SND.click(); }
      else { if(WEATHER!==id){ WEATHER=id; SND.tok(); save(); } else SND.click(); }
      rugSync();
    });
    RUG_TILES.push({kind,id,el:b});
  };
  for(const [id,name] of [['sm','SMALL'],['lg','BIG'],['xl','HUGE']]) mkRug('size',id,name,g=>rugTileSize(g,id));
  for(const [id,name] of [['rug','THE RUG'],['west','WESTERN'],['snow','WINTER'],['mountain','MOUNTAIN'],['jungle','JUNGLE']]) mkRug('land',id,name,g=>rugTileLand(g,id));   // E30 + E31
  for(const [id,name] of [['clear','CLEAR'],['snowfall','SNOW'],['dust','DUST'],['rain','RAIN']]) mkRug('weather',id,name,g=>rugTileWx(g,id));
  // TIDY UP (E16): the sweep-the-rug button, out of the retired shed's foot.
  // E33: the MORE TOYS… pill RETIRED — the corner chest is BUILD's look-book
  // door now, so the rail's pinned foot carries TIDY alone (outside the
  // scroll area: plain taps, no travelled-tap guard — the E27 law).
  // Still two taps — the first arms it, a moment of nothing disarms it.
  const tidy=document.createElement('button'); tidy.id='tidyBtn'; tidy.className='pbtn'; tidy.type='button';
  tidy.innerHTML='<b>🧹</b><small>TIDY UP</small>';
  let tidyArm=0;
  const tidyOff=()=>{ tidyArm=0; tidy.classList.remove('ask'); tidy.querySelector('small').textContent='TIDY UP'; };
  tidy.addEventListener('click',()=>{
    ac();
    if(tidyArm){
      clearTimeout(tidyArm); tidyOff();
      if(CAMP.on) clearPlayer();             // sweep the kid's line; the glued land stays put
      else { grid.clear(); hgrid.clear(); scen.clear(); trainHome(true); }
      SND.pop(); save(); toast('ALL TIDY!');
      eagerTry();   // E27: the sweep is a track mutation — a finished glued line may call her
    } else {
      SND.click(); tidy.classList.add('ask'); tidy.querySelector('small').textContent='TAP AGAIN';
      tidyArm=setTimeout(tidyOff,2600);
    }
  });
  $('railFoot').appendChild(tidy);
  // THE ACCORDION (E33): one department open at a time — tab null = all folded
  // (six plaques, tiny rail). Opening scrolls the plaque to the rail's top so
  // its cards fill the visible run. TRAINS is the E16 #shelf span — but only
  // when the shelf is HOME (the bedroom borrows the node and must never
  // inherit a folded display).
  const railOpen=tab=>{
    palTab=tab||null;
    for(const k2 in groups) groups[k2].style.display=palTab===k2?'':'none';   // '' = the stylesheet's display:contents
    if($('shelf').parentNode===body) $('shelf').style.display=palTab==='trains'?'':'none';
    const tabs={track:'tabTrack',scen:'tabScen',town:'tabTown',friends:'tabFriends',trains:'tabTrains',rug:'tabRug'};
    for(const k2 in tabs) $(tabs[k2]).classList.toggle('on',palTab===k2);
    if(palTab){ const p=$(tabs[palTab]);   // the open plaque rides to the top
      body.scrollTop=Math.max(0,p.offsetTop-body.offsetTop-4*UIS); }
  };
  buildPalette.sync=railOpen;
  // E33: the plaques live IN the scroll column — the travelled-tap guard is
  // BACK on them (a tap that scrolled ≥8px is a scroll, never a pick; BARSC
  // resets every pointerdown, so the E27 stale-moved trap cannot arm). Tap
  // the open plaque and it folds.
  const tabTap=(id,tab)=>$(id).addEventListener('click',()=>{
    if(barDragged()) return;
    ac(); SND.click(); railOpen(palTab===tab?null:tab);
  });
  tabTap('tabTrack','track'); tabTap('tabScen','scen'); tabTap('tabTown','town');
  tabTap('tabFriends','friends'); tabTap('tabTrains','trains'); tabTap('tabRug','rug');
}
/* =====================================================================
   THE BIG HAND'S SHELF (E20 → E25 → E33) — the one scroll column lives
   in the LEFT RAIL now, recipe unchanged: E13's aisle feel, touch pans
   natively (pan-y on the wood, the plaques and the tap-tiles), the
   mouse grabs and flings, and a tap that travelled >8px is a scroll,
   never a pick. DRAG-SOURCE toys keep touch-action:none and never
   start a grab-scroll — the hand lifting a piece out always wins.
   ===================================================================== */
let BARSC={down:false,moved:0,x:0,y:0,st:0,vy:0,ly:0,lt:0,id:null,mouse:false};
const barDragged=()=>BARSC.moved>8;
function barFling(v){               // a mouse flick keeps the rail rolling (touch gets this natively)
  const el=$('railBody'); let lt=performance.now();
  const step=t=>{
    const dt2=Math.min(0.05,(t-lt)/1000); lt=t;
    el.scrollTop+=v*dt2;
    v*=Math.pow(0.04,dt2);
    if(Math.abs(v)>40&&!BARSC.down) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function buildBarScroll(){          // E27→E33: the E13 recipe rotated 90° — the rail's column scrolls DOWN
  const el=$('railBody');
  el.addEventListener('pointerdown',e=>{
    if(e.target.closest&&e.target.closest('.drg')) return;   // a toy in the hand beats the shelf
    BARSC={down:true,moved:0,x:e.clientX,y:e.clientY,st:el.scrollTop,vy:0,
      ly:e.clientY,lt:performance.now(),id:e.pointerId,mouse:e.pointerType!=='touch'};
  });
  el.addEventListener('pointermove',e=>{
    const d2=BARSC; if(!d2.down) return;
    d2.moved=Math.max(d2.moved,Math.hypot(e.clientX-d2.x,e.clientY-d2.y));
    if(d2.mouse&&d2.moved>8){        // a mouse drags the shelf by hand; touch pans natively
      if(d2.id!=null){ try{ el.setPointerCapture(d2.id); }catch(err){} d2.id=null; }
      el.scrollTop=d2.st-(e.clientY-d2.y);
      const now=performance.now(), dt2=(now-d2.lt)/1000;
      if(dt2>0.001) d2.vy=0.7*d2.vy+0.3*((d2.ly-e.clientY)/dt2);
      d2.ly=e.clientY; d2.lt=now;
    }
  });
  const barUp=()=>{
    const d2=BARSC; if(!d2.down) return;
    d2.down=false;
    if(d2.mouse&&d2.moved>8&&Math.abs(d2.vy)>60) barFling(d2.vy);
  };
  el.addEventListener('pointerup',barUp);
  el.addEventListener('pointercancel',barUp);
}
/* =====================================================================
   THE TOY BOX ON THE RUG (E25 → E33 → E36) — the corner chest, screen-
   space DOM (it does NOT pan with the world), face painted in the
   game's own art (the E18 menu chest is the model). E36 FEWER
   COMPARTMENTS ended its PLAY job: the tray spread it used to raise is
   resident furniture now (THE TRAIN SHELF — see the #spread CSS), so
   the chest lives in BUILD only, where it opens THE TOY BOX — E7's big
   look-book (nothing gated behind it, pure looking); a level hides the
   chest (the board is its meta). The E25 dismiss laws and the pop-up
   lifecycle (tboxShow/TBOX.open/TBOX_MS) retired with the door — the
   shelf never shuts; it fades under the shy fold like the rail.
   Idle, the lid sits a hair ajar and breathes every TBOX_BREATH_S —
   a quiet pick-me, never a modal. Nothing in here ever saves.
   ===================================================================== */
const TBOX={k:-1};
// E27: 'handle' left with the train item — the only #shelfTrain alive is the
// bedroom's (the borrowed #shelf node), and the bedroom has no spread.
function tboxPaint(k){         // k = lid lift 0..1 (the breath; E36 — the lid never leans open, the door is gone)
  const cv=$('tboxCv'); if(!cv) return;
  const g=cv.getContext('2d'), u=cv.width/160;
  g.setTransform(u,0,0,u,0,0); g.clearRect(0,0,160,160);
  withCtx(g,()=>{                                  // the E18 menu chest, shrunk to a corner pick-me
    cx.globalAlpha=0.3; cx.fillStyle='#000';
    cx.beginPath(); cx.ellipse(80,148,62,8,0,0,7); cx.fill(); cx.globalAlpha=1;
    cx.fillStyle='#8f6b3f'; rr(20,62,120,84,8); cx.fill();
    cx.strokeStyle='#6e5130'; cx.lineWidth=5; rr(20,62,120,84,8); cx.stroke();
    cx.fillStyle='#170f08'; rr(26,62,108,10,4); cx.fill();   // the dark mouth the ajar lid shows
    star5(80,108,1.35,'#e8d9b0');
    const lift=4+10*k, tilt=-(0.035+0.10*k);
    cx.save(); cx.translate(20,62-lift); cx.rotate(tilt);
    cx.fillStyle='#a37c4a'; rr(-6,-26,136,28,8); cx.fill();
    cx.strokeStyle='#6e5130'; cx.lineWidth=5; rr(-6,-26,136,28,8); cx.stroke();
    cx.restore();
  });
}
function tboxBreath(tms){      // rides frame(): the idle lid sigh, skipped under reduced motion
  if(SCREEN!=='game') return;  // E36: the chest is BUILD furniture only
  const ph=(tms/1000)%TBOX_BREATH_S;
  const k=(RM()||ph>=0.9)? 0 : 0.5*Math.sin(Math.PI*ph/0.9);
  if(Math.abs(k-TBOX.k)>0.004){ TBOX.k=k; tboxPaint(k); }
}
