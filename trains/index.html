/* =====================================================================
   THE EAGER TRAIN (E27) — a finished line calls its own train.
   #shelfTrain left the spread; the ritual died with it. THE ARRIVAL
   LAW: after every track mutation (place / turn / remove / thrown
   points / tidy) and on every BUILD/campaign entry — if the line is
   DONE and no train is on the board, she ARRIVES: far whistle, puffs,
   seated AT THE STATION on that line (campaign with no station → the
   last-placed piece — levels must never soft-lock), and departs
   through goTrain(), never a hand-set flag (the E5 law; the exact
   drop-pipeline tail, hint passes included). No latch, no hidden
   state: mutation + finished + trainless = she comes. In BUILD a
   stationless finished line coaches once — PUT DOWN A STATION — then
   silence forever. The walk below is the train's OWN routing (enter();
   no new physics): DONE = the walk closes on itself, or caps at a
   bumper BOTH ways; the too-short law stays placeTrainAt's.
   ===================================================================== */
const EAGER={last:null};        // the hand's newest piece {x,y,el} — session-only
let stCoachT=false;             // the stationless coach — once a session, then silence
let EAGERC=null;                // the one gentle camera ease {t,x0,y0,x1,y1}
function eagerWalk(pc,x0,y0,dir){
  // one direction: port-hop the REAL graph from mid-piece. Verdicts:
  // 'loop' (a state repeats — the train would run forever) · 'cap' (a
  // bumper's null port) · 'open' (the line just stops). Collects the
  // pieces touched and the first station crossed (the arrival anchor).
  const rd={cx:pc.t==='sp'?pc.ax:x0, cy:pc.t==='sp'?pc.ay:y0, pi:0, dir, s:0, el:(pc.elev|0)?1:0};
  const seen=new Set(), pieces=new Set(); let st=null;
  for(let g=0; g<4096; g++){
    const cur=pieceOf(rd); if(!cur) return {end:'open',pieces,st};
    pieces.add(cur);
    if(cur.t==='st'&&!st) st={x:rd.cx,y:rd.cy,el:rd.el?1:0};
    const sig=rd.cx+','+rd.cy+':'+(rd.el?1:0)+':'+rd.pi+':'+rd.dir;
    if(seen.has(sig)) return {end:'loop',pieces,st};
    seen.add(sig);
    const p=pathsOf(cur)[rd.pi], ex=p.ports[rd.dir>0?1:0];
    if(ex==null) return {end:'cap',pieces,st};   // only the bumper owns a null port
    if(!enter(rd,ex)) return {end:'open',pieces,st};
  }
  return {end:'open',pieces,st};
}
function eagerVerdict(pc,x,y){  // both directions from one seed → done? station? pieces?
  const fwd=eagerWalk(pc,x,y,1);
  let ok=fwd.end==='loop', st=fwd.st;
  const pieces=fwd.pieces;
  if(fwd.end==='cap'){
    const bk=eagerWalk(pc,x,y,-1);
    for(const q of bk.pieces) pieces.add(q);
    if(!st) st=bk.st;
    ok= bk.end==='cap'||bk.end==='loop';
  }
  return ok? {pieces,st} : null;
}
/* =====================================================================
   E34 KEEP LAYING (FM-TS-37) — the Roller Coaster Tycoon move. The last
   piece the hand laid arms the cell(s) past its open end(s); a tap
   there lays the SAME piece again, continuing the heading (curves keep
   turning — one curve + three taps closes the circle and the eager
   train rolls in). A bonus gesture, never a MODE: zones derive fresh
   from the anchor on every ask, die by identity the moment it moves,
   and every other tap and drag stays byte-true. THE predicate
   (placeQuery) rules every lay — E1's water law included, reused never
   forked. Session-only; nothing here ever saves except the lay itself.
   ===================================================================== */
let KL=null;                    // {pc,x,y} the chain anchor — a HAND-laid piece, BUILD+campaign only
function klClear(){ KL=null; }
function klSeed(pc,x,y){        // sp = footprint set-piece, b = end-cap: neither says "onward"
  KL=(SCREEN==='game'&&!BED.ctx&&pc.t!=='sp'&&pc.t!=='b')? {pc,x,y} : null;
}
// one writer for the whole hand-lay ceremony — the drag drop and the
// continue-tap both speak it, so the eager train / hints / coach hear
// a chain tap exactly as they hear a drop
function layAt(t,r,sel,cx2,cy2,q){
  const pc=setTrackPiece(t,r,sel,q.elev,cx2,cy2); pc.pop=1;
  SND.tok(); puff(GX+cx2*C+C/2,GY+cy2*C+C/2,14);
  hintPass(0); if(grid.size>=3) hintPass(1);
  save();
  if(!BED.ctx) EAGER.last={x:cx2,y:cy2,el:q.elev?1:0};   // E27: the hand's newest piece — the arrival's fallback anchor
  eagerTry();                                            // E27: mutation + finished + trainless = she comes
  klSeed(pc,cx2,cy2);                                    // E34: the newest piece is the chain's head
  return pc;
}
function klZones(){
  if(!KL) return [];
  const pc=KL.pc, at=pc.elev? pieceHi(KL.x,KL.y) : pieceAt(KL.x,KL.y);
  if(at!==pc){ KL=null; return []; }        // moved / removed / tidied / new grid — died by identity
  const out=[];
  for(const p of pathsOf(pc)) for(const e of [0,1]){
    const side=p.ports[e], other=p.ports[1-e];
    if(side==null||other==null) continue;                 // a one-door path can't say "onward"
    const D=[[0,-1],[1,0],[0,1],[-1,0]][side];
    const nx=KL.x+D[0], ny=KL.y+D[1];
    if(pieceTop(nx,ny)) continue;                         // THE OBSTRUCTION LAW — never build into track
    if(out.some(z=>z.x===nx&&z.y===ny)) continue;         // sw shares its facing door — first path wins
    const delta=(side-((other+2)%4)+4)%4;                 // the anchor's own turn, walked out this door
    const entry=(side+2)%4, exit=(side+delta)%4;
    for(const rc of [pc.r,(pc.r+1)%4,(pc.r+2)%4,(pc.r+3)%4]){
      if(!PATHS[pc.t][rc].some(p2=>(p2.ports[0]===entry&&p2.ports[1]===exit)||(p2.ports[0]===exit&&p2.ports[1]===entry))) continue;
      const q=placeQuery(pc.t,rc,nx,ny);                  // THE predicate — terrain, water, elevation, all of it
      if(!q.ok) continue;                                 // a refused rotation keeps searching (the ramp's valley)
      out.push({x:nx,y:ny,t:pc.t,r:rc,elev:q.elev,sel:pc.t==='sw'?pc.sel:null});
      break;
    }
  }
  return out;
}
function klHot(gx,gy){ return klZones().some(z=>z.x===gx&&z.y===gy); }
function klTap(gx,gy){
  // the continue-tap: live zone -> lay the same piece, re-seed, consume.
  // A miss is SILENT (never a toast) — the tap falls through to today.
  for(const z of klZones()){
    if(z.x!==gx||z.y!==gy) continue;
    const q=placeQuery(z.t,z.r,gx,gy);
    if(!q.ok) return false;
    layAt(z.t,z.r,z.sel,gx,gy,q);
    return true;
  }
  return false;
}
function klGhost(){
  // PAINT-ONLY: a faint next-piece in every armed zone — much quieter
  // than the drag ghost, and hidden while a drag owns the hand.
  if(!KL_GHOST||!KL||DRAG||SCREEN!=='game') return;
  for(const z of klZones()){
    const mock={t:z.t,r:z.r,sel:z.sel|0,elev:z.elev,latch:null};
    cx.globalAlpha=KL_GHOST_A*0.5; cx.fillStyle='#F7E9C4';
    rr(GX+z.x*C+3,GY+z.y*C+3,C-6,C-6,10); cx.fill();
    cx.globalAlpha=KL_GHOST_A;
    drawPieceArt(mock,GX+z.x*C,GY+z.y*C);
    cx.globalAlpha=1;
  }
}
function lineDone(){
  // candidates in arrival-anchor order: every station first, the hand's
  // newest piece next, then the rest — the first DONE line wins. (No
  // component dedup: a splitter can route differently per seed, and the
  // board is small — correctness beats cleverness here.)
  const cands=[];
  for(const [k,pc] of grid) if(pc.t==='st') cands.push([pc,k]);
  for(const [k,pc] of hgrid) if(pc.t==='st') cands.push([pc,k]);
  const lp=EAGER.last;
  if(lp){ const pc=lp.el? pieceHi(lp.x,lp.y):pieceAt(lp.x,lp.y); if(pc) cands.push([pc,lp.x+','+lp.y]); }
  for(const [k,pc] of grid) cands.push([pc,k]);
  for(const [k,pc] of hgrid) cands.push([pc,k]);
  let stationless=false;
  for(const [pc,k] of cands){
    if(!pc||pc.t==='ref') continue;
    const i=k.indexOf(','), x=+k.slice(0,i), y=+k.slice(i+1);
    const hit=eagerVerdict(pc,x,y);
    if(!hit) continue;
    if(hit.st) return {done:true, x:hit.st.x, y:hit.st.y, el:hit.st.el};
    if(CAMP.on){
      // no station on the line → the last-placed piece (soft-lock law);
      // the walk's own seed if the hand's piece sits on another line
      if(lp){ const lpc=lp.el? pieceHi(lp.x,lp.y):pieceAt(lp.x,lp.y);
        if(lpc&&hit.pieces.has(lpc)) return {done:true, x:lp.x, y:lp.y, el:lp.el|0}; }
      return {done:true, x:pc.t==='sp'?pc.ax:x, y:pc.t==='sp'?pc.ay:y, el:(pc.elev|0)?1:0};
    }
    stationless=true;   // BUILD asks for a station — the coach's moment
  }
  return {done:false, coach:stationless};
}
function eagerArrive(ax,ay,el){
  if(TRAIN.placed) return false;
  if(CAMP.on) consist=surpriseRoll();   // E21's gift law — every arrival packs fresh cars, exactly as if dropped
  if(!placeTrainAt(ax,ay,el==null?null:(el?1:0))) return false;   // the too-short law lives in there
  for(const c of TRAIN.cars){ const p=pos(c.rd); c.squash=1; puff(p.x,p.y-8-LIFT*(p.z||0),14); }   // she rolls in on a breath of steam
  if(EAGER_WHISTLE) SND.whistle();      // the far whistle announces her
  hintPass(2); hintPass(3);             // the old drop's lesson ladder — the arrival IS the drop now
  goTrain();                            // the E5 law: startSig/revSinceGo/visited live in there
  hintPass(4);                          // exactly the drop-pipeline tail
  eagerPan();
  return true;
}
function eagerTry(){
  // THE ARRIVAL LAW — asked fresh after every mutation and entry; no latch.
  if(BED.ctx||SCREEN!=='game'||TRAIN.placed||PLAY.on) return false;
  const v=lineDone();
  if(v.done) return eagerArrive(v.x,v.y,v.el);
  if(v.coach&&!stCoachT){ stCoachT=true; toast(EAGER_COACH); }   // once, then silence forever
  return false;
}
function eagerSummon(gx,gy){
  // TAP THE STATION = CALL THE TRAIN — only a station on a finished
  // trainless line answers; everything else falls through to today's ladder.
  if(BED.ctx||SCREEN!=='game'||TRAIN.placed) return false;
  const pc=pieceTop(gx,gy); if(!pc||pc.t!=='st') return false;
  if(!eagerVerdict(pc,gx,gy)) return false;
  return eagerArrive(gx,gy,(pc.elev|0)?1:0);
}
function eagerPan(){
  // one gentle ease when she arrives off-screen (the E20 center-on-action
  // grammar, eased over EAGER_PAN) — any hand cancels it, entry cameras outrank it
  if(!TRAIN.placed||!TRAIN.cars.length) return;
  const p=pos(TRAIN.cars[0].rd), sx=OX+SC*p.x, sy=OY+SC*(p.y-LIFT*(p.z||0));
  const m=40;
  if(sx>=m&&sx<=W-m&&sy>=m&&sy<=H-m) return;     // she's already in view — stay put
  EAGERC={t:0, x0:VIEW.ox, y0:VIEW.oy,
          x1:W/2-p.x*VIEW.s, y1:(H-BAR)/2-(p.y-LIFT*(p.z||0))*VIEW.s};
}
function eagerCamTick(dt){
  if(!EAGERC) return;
  if(PINCH||DRAG||FOLLOW.on||(down&&down.what==='pan')){ EAGERC=null; return; }   // the hand always wins
  EAGERC.t+=dt;
  const k=Math.min(1,EAGERC.t/Math.max(0.001,EAGER_PAN)), e=k*k*(3-2*k);
  VIEW.ox=EAGERC.x0+(EAGERC.x1-EAGERC.x0)*e;
  VIEW.oy=EAGERC.y0+(EAGERC.y1-EAGERC.y0)*e;
  CAM.off=true; VIEW.vx=VIEW.vy=0;               // a camera move happened — HOME knows the way back (the followTick precedent)
  clampView(); viewApply();
  if(k>=1) EAGERC=null;
}
// THE GATE LAW (E7): BUILD's palette offers OWNED toys only. The campaign keeps the
// FULL palette in this version (its gate arrives in E8 with the new levels). Tabs with
// nothing to offer hide; PLAY has no palette at all.
function paletteSync(){
  // E8: THE GATE now covers the campaign too — a level offers the toys you own and
  // nothing else, which is what makes winning one mean something. The award schedule
  // guarantees solvability (every reference solution places only owned pieces), and
  // whatever the level needs beyond that arrives GLUED. E33: the chest is BUILD's
  // look-book door; an empty department hides its PLAQUE (a fresh kid's rail reads
  // TRACK · TRAINS · RUG and grows as the toys come home).
  const full=false;
  const vis={track:0,scen:0,town:0,friends:0};
  for(const b of PAL_BTNS){

  // departments — a level hides both (the game packs the cars; a level keeps

  // TRAINS honest in BUILD.
  $('tabTrains').style.display=CAMP.on?'none':'';
  vis.trains=CAMP.on?0:1;
  $('tabRug').style.display=CAMP.on?'none':'';
  vis.rug=CAMP.on?0:1;
  if(palTab&&!vis[palTab]) buildPalette.sync('track');
}

const SHELF_CAR_BTNS=[];   // [type, canvas, button] — repainted when the livery changes

function setEngine(t){

  if(ENGINE===t || (t==='exp'&&!coll.has('exp'))){ SND.click(); shelfSync(); return ENGINE; }
  ENGINE=t; SND.whistle();
  if(TRAIN.placed){
    const lc=TRAIN.cars[0].rd, wasCell=[lc.cx,lc.cy], wasEl=lc.el?1:0, run=TRAIN.running;
    TRAIN.running=false;
    for(const c of TRAIN.cars){ const p=pos(c.rd); puff(p.x,p.y-8-LIFT*(p.z||0),14); }
    if(!placeTrainAt(wasCell[0],wasCell[1],wasEl)){ trainHome(false); toast('TOO SHORT FOR THIS TRAIN!'); }

  shelfSync(); save();

}

function slotIcon(cv,id,fullCol){   // E9: fullCol=true skips the silhouette (the store dims by CSS instead)
  const g=cv.getContext('2d');
  // E20: resolution-aware — k=1 for the 96px toybox/ticket slots (byte-identical),
  // larger canvases (the NEW TOY! card's 192) paint the same art at full res
  const k=cv.width/96;
  g.setTransform(k,0,0,k,0,0); g.clearRect(0,0,96,96);
  const def=defOf(id);
  if(def.cat==='train'||def.cat==='paint'){
    g.setTransform(0.95*k,0,0,0.95*k,48*k,54*k);
    withCtx(g,()=>drawCar(def.cat==='paint'?'loco':id,0,0,0,0,0.6,
                          def.cat==='paint'? LIVERY[id.slice(3)] : null));
  } else if(def.cat==='track'){
    let s=96*k/(C+16), o=8;
    if(id==='sp'){ s=96*k/(SPS+28); o=14; }
    g.setTransform(s,0,0,s,o*s,o*s);
    withCtx(g,()=>drawPieceArt({t:id,r:id==='c'?1:0,sel:0,elev:0,latch:null},0,0));
  } else {
    const s=96*k/(C+16);
    g.setTransform(s,0,0,s,8*s,8*s);
    scenIcon(g,id);
  }
  if(!fullCol&&!coll.has(id)){   // locked = a dark silhouette on the shelf (SIL_DARK dial)
    g.setTransform(k,0,0,k,0,0);
    g.globalCompositeOperation='source-atop';
    g.fillStyle='rgba(16,10,5,'+SIL_DARK+')'; g.fillRect(0,0,96,96);
    g.globalCompositeOperation='source-over';
  }
}

function stIcon(cv,id,t){
  // E13: paints ANY canvas at ITS OWN resolution — card, stage, whatever size the
  // furniture asks for. Everything the E9 painters authored in a 96-box rescales by
  // k, so a 280px RAINBOW is repainted sharp, never a CSS-stretched 96px bitmap.
  // `t` drives the animated painters (fountain bobs, clock hands, flag ripples);
  // omitted = the old still frame (1.2), which is what the toybox keeps using.
  const g=cv.getContext('2d'), CW=cv.width, CH=cv.height, k=Math.min(CW,CH)/96;
  const ox=(CW-96*k)/2, oy=(CH-96*k)/2, tt=t==null?1.2:t;
  g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,CW,CH);
  if(id.startsWith('pt_')){          // liveries: the mini-loco swatch (RAINBOW gets its rainbow)
    g.setTransform(0.9*k,0,0,0.9*k,ox+48*k,oy+56*k);
    withCtx(g,()=>livPaint(id.slice(3)));
    return;
  }
  if(id.startsWith('tr_')){          // E28 trails: a tiny loco STREAMS the goods — the card is alive
    g.setTransform(0.8*k,0,0,0.8*k,ox+64*k,oy+58*k);
    withCtx(g,()=>{
      if(id==='tr_rain'){
        cx.lineCap='round';
        for(let b2=0;b2<5;b2++){
          cx.strokeStyle=LIVERY[RAIN_ORDER[b2]].m; cx.lineWidth=4.6; cx.globalAlpha=0.9;
          const yy=-12+(b2-2)*4.8;
          cx.beginPath(); cx.moveTo(-92,yy+Math.sin(tt*2.6+b2*0.9)*3);
          cx.quadraticCurveTo(-52,yy+Math.sin(tt*2.6+b2*0.9+1.4)*4,-16,yy);
          cx.stroke();
        }
        cx.globalAlpha=1; cx.lineCap='butt';
      } else {
        for(let i=0;i<8;i++){
          const dr=(tt*22+i*17)%64, a2=Math.max(0,1-dr/64);
          const tw=0.5+0.5*Math.sin(tt*8+i*2.3);
          star4(-20-dr,-12-((i*23)%22)+Math.sin(tt*3+i*2.1)*2.5,
            (0.55+(i*7)%3*0.22)*(0.6+0.6*tw),(i&1)?'#F7E9C4':'#F2C531',0.35+0.6*a2*tw);
        }
      }
      drawCar('loco',0,0,0,0,tt*2.2,LIVERY[COLOR==='rain'?'red':COLOR]);   // HER engine, wheels rolling
    });
    return;
  }
  if(sndSlot(id)){                   // sounds: the painted glyph shelf
    g.setTransform(k,0,0,k,ox+48*k,oy+50*k);
    withCtx(g,()=>drawSndIcon(id));
    return;
  }
  const def=defOf(id);               // models + the fifty: the real painter, live time
  if(def.cat==='train'){
    g.setTransform(0.95*k,0,0,0.95*k,ox+48*k,oy+54*k);
    withCtx(g,()=>drawCar(id,0,0,0,0,0.6,null));
  } else if(def.cat==='track'){
    let s=96/(C+16), o=8;
    if(id==='sp'){ s=96/(SPS+28); o=14; }
    g.setTransform(s*k,0,0,s*k,ox+o*s*k,oy+o*s*k);
    withCtx(g,()=>drawPieceArt({t:id,r:id==='c'?1:0,sel:0,elev:0,latch:null},0,0));
  } else {
    const s=96/(C+16);
    g.setTransform(s*k,0,0,s*k,ox+8*s*k,oy+8*s*k);
    scenIcon(g,id,tt);
  }
}
function storeBuy(id,el){

  const d=defOf(id); if(!d) return {ok:false,why:'unknown'};

    if(el) wiggle(el);

    return {ok:false,why:'stars',need:p,have:stars};
  }
  stars-=p; coll.add(id);
  const snd=sndSlot(id);
  if(snd) equip[snd]=id;                                        // a bought sound goes straight on the train
  if(id.startsWith('pt_')&&LIVERY[id.slice(3)]){ COLOR=id.slice(3); liveryChanged(); }   // wear it out of the shop
  if(id.startsWith('tr_')) trailWear(id);                       // E28: a bought trail streams out of the shop (same grammar)
  SND.coin(); SND.win();             // the coin-into-win flourish
  voiceAt('buy');                    // E12: "Okay" — the shopkeeper's nod (never on the can't-afford path)
  if(el) wiggle(el);

}
function storeRowTap(id,el){

    save(); storeSync();

function mkStItem(row){
  // E13: a CARD on the aisle. The price band picks the tier, the tier picks the
  // size and the frame — rarity you can read from across the room.
  const tier=stTier(row.price);
  const b=document.createElement('button');
  b.className='stcard '+tier; b.type='button'; b.dataset.id=row.id;
  b.style.setProperty('--ch',CARD_H[tier]);
  const cv=document.createElement('canvas'); cv.width=0; cv.height=0;   // sized to the card on first visible paint
  if(!row.owned&&UNOWNED_DIM<1) cv.style.opacity=UNOWNED_DIM;   // goods on a shelf look delicious (1.0); 0.4 = E9's ghosts
  b.appendChild(cv);
  const nm=document.createElement('small'); nm.textContent=row.name; b.appendChild(nm);
  const pc=document.createElement('span');
  pc.className='pc '+(row.owned?'own':'buy');
  pc.textContent=row.owned? (row.eq?'✓ ON':'✓') : '★ '+row.price;
  b.appendChild(pc);
  if(tier==='bg'){ const d2=document.createElement('span'); d2.className='bdg b'; d2.textContent='◆'; b.appendChild(d2); }
  if(tier==='star'){ const d2=document.createElement('span'); d2.className='bdg s'; d2.textContent='★'; b.appendChild(d2); }
  if(!row.owned){
    // THE TOUCH LAW: picture = look/hear, gold chip = buy — on every card. A locked
    // sound's picture previews (hear it before you own it — E9's law verbatim); a
    // locked toy's picture mounts the showcase. ONLY the gold chip ever debits.
    pc.addEventListener('click',ev=>{ ev.stopPropagation(); if(aisleDragged()) return; ac(); storeBuy(row.id,b); });
    b.addEventListener('click',()=>{ if(aisleDragged()) return; ac();
      if(sndSlot(row.id)){ PACKS[row.id](); wiggle(b); } else stageMount(row.id); });
  } else {
    // owned cards keep v1.9's charm byte-for-byte: storeRowTap is the spec
    b.addEventListener('click',()=>{ if(aisleDragged()) return; ac(); storeRowTap(row.id,b); });
  }
  return b;
}
// ---- the aisle machinery: who's on screen, live paint, drag-to-scroll ----
const AISLE_VIS=new Set();         // the cards on screen right now — the only ones painted
let AISLE_PAINTS={};               // id -> repaint count (the perf battery reads this via TS.store.paints)
let AISLE_IO=null;
let AISLE_DRAG={down:false,moved:0,x:0,y:0,sl:0,vx:0,lx:0,lt:0,id:null,mouse:false};
const aisleDragged=()=>AISLE_DRAG.moved>8;   // a tap that travelled is a scroll, not a tap

function aisleObserve(){
  if(AISLE_IO) AISLE_IO.disconnect();

  if(!window.IntersectionObserver){ for(const c2 of $('staisle').querySelectorAll('.stcard')) AISLE_VIS.add(c2); return; }
  AISLE_IO=new IntersectionObserver(es=>{
    for(const e of es){ if(e.isIntersecting) AISLE_VIS.add(e.target); else AISLE_VIS.delete(e.target); }
  },{root:$('staisle'),rootMargin:'0px 80px'});

}
function cardPaint(el,t){
  const cv=el.firstChild, r=cv.getBoundingClientRect();
  if(!r.width||!r.height) return;
  const w=Math.round(r.width*DPR), h=Math.round(r.height*DPR);
  if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; }
  stIcon(cv,el.dataset.id,t);
  AISLE_PAINTS[el.dataset.id]=(AISLE_PAINTS[el.dataset.id]|0)+1;
}
function aisleFrame(){             // rides frame() while the shop is open: VISIBLE cards only
  const t=perf();
  for(const el of AISLE_VIS) cardPaint(el,t);
  if(STAGE_ID){
    const sg=$('stgcv'), r=sg.getBoundingClientRect();
    if(r.width&&r.height){
      const w=Math.round(r.width*DPR), h=Math.round(r.height*DPR);
      if(sg.width!==w||sg.height!==h){ sg.width=w; sg.height=h; }
      stIcon(sg,STAGE_ID,t);
    }

}
function aisleFling(v){            // a mouse flick keeps rolling (touch gets this natively)
  const ai=$('staisle'); let lt=performance.now();
  const step=t=>{
    const dt2=Math.min(0.05,(t-lt)/1000); lt=t;
    ai.scrollLeft+=v*dt2;
    v*=Math.pow(0.04,dt2);
    if(Math.abs(v)>40&&!AISLE_DRAG.down&&!AJUMP) requestAnimationFrame(step);   // E22: a plaque tap outranks old momentum
  };
  requestAnimationFrame(step);

/* =====================================================================
   E22 TABS THAT JUMP — the GVT shopJump/shopMarkTabs lane on ONE truth:
   the aisle's scrollLeft. A plaque tap GLIDES the aisle to its shelf
   sign (the destination stays lit for the whole ride); free panning
   re-lights the nearest plaque from the scroll position; and ANY hand
   on the aisle mid-glide cancels the glide — the hand always wins.
   ===================================================================== */
let AJUMP=null;              // {k,from,to,t0,dur} — the live glide, or null
function stTabAt(){          // which category the aisle is standing in front of
  const ai=$('staisle');
  let cur=STORE_TABS[0][0];
  for(const sg of ai.querySelectorAll('.stsign'))
    if(sg.offsetLeft<=ai.scrollLeft+ai.clientWidth/2) cur=sg.dataset.k;
  return cur;
}
function aisleMark(k2){      // light one plaque; walk it into view if the row scrolls
  for(const b of document.querySelectorAll('#shTabs .shtab')){
    const on=b.dataset.k===k2;
    b.classList.toggle('on',on);
    if(on&&b.parentNode.scrollWidth>b.parentNode.clientWidth+1){
      try{ b.scrollIntoView({block:'nearest',inline:'nearest'}); }catch(e){}
    }
  }
}
function aisleJump(k2,smooth){
  const ai=$('staisle'), sg=ai.querySelector('.stsign[data-k="'+k2+'"]');
  if(!sg) return false;
  const to=Math.max(0,Math.min(sg.offsetLeft-10,ai.scrollWidth-ai.clientWidth));
  AJUMP=null;
  if(!smooth){ ai.scrollLeft=to; aisleMark(k2); return true; }   // rigs land instantly (GVT smooth=false)
  AJUMP={k:k2,from:ai.scrollLeft,to,t0:performance.now(),dur:Math.min(0.9,TAB_GLIDE+Math.abs(to-ai.scrollLeft)/4000)};
  aisleMark(k2);
  requestAnimationFrame(aisleGlide);
  return true;
}
function aisleGlide(){
  const j=AJUMP; if(!j) return;                       // a hand grabbed the aisle — it won
  const ai=$('staisle'), k=Math.min(1,(performance.now()-j.t0)/1000/j.dur);
  ai.scrollLeft=j.from+(j.to-j.from)*(1-Math.pow(1-k,3));
  if(k<1) requestAnimationFrame(aisleGlide);
  else AJUMP=null;                                    // landed — the aisle owns the light again
}
/* ---- E22 FILL THE SCREEN: pick 1 or 2 shelves for THIS geometry —

   stack two-high in the height the aisle actually gets; otherwise the
   .two class comes off and the shop is E13's single strip verbatim. ---- */
let AISLE2=0;                // 0 = one shelf; else the shelf-row height in px (the battery reads it)
const CARD_F=()=>matchMedia('(max-width:820px)').matches?0.55:1;   // the E13 phone card factor
const plkPx=()=>Math.max(3,Math.round(SHELF_PLK*UIS));
function aisleMeasure(){
  const p=$('stpanel'), ai=$('staisle');

  const inner=ai.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);

  // the hand always wins: any hand on the aisle kills a live glide, and the light
  // goes straight back to being a view of where the aisle actually stands
  const handWins=()=>{ if(AJUMP){ AJUMP=null; aisleMark(stTabAt()); } };
  ai.addEventListener('wheel',handWins,{passive:true});

    AISLE_DRAG={down:true,moved:0,x:e.clientX,y:e.clientY,sl:ai.scrollLeft,vx:0,

    }

    d2.down=false;
    if(d2.mouse&&d2.moved>8&&Math.abs(d2.vx)>60) aisleFling(d2.vx);
  };
  ai.addEventListener('pointerup',aisleUp);

}

    objs(){ return ROOM_OBJS.map(o=>({id:o.id, hit:{...o.hit}, pill:{x:o.px,y:o.py,label:o.label()}})); },
    state(){ return { t:+ROOM.t.toFixed(3), win:ROOM.win, lid:+ROOM.lid.toFixed(3), cards:ROOM.cards,
      fx:ROOM.fx? {kind:ROOM.fx.kind,t:+ROOM.fx.t.toFixed(3),stub:ROOM.fx.stub} : null,
      dog:ROOM.dog? {t:+ROOM.dog.t.toFixed(3),k:ROOM.dog.k} : null,
      gag:ROOM_GAG, every:DOG_EVERY, window:PICKME_S }; },
    sign(){ return { x:MENU_W/2-250*SIGN_K, y:SIGN_TOP, w:500*SIGN_K, h:88*SIGN_K, k:SIGN_K }; },
    vis(){ return menuVis(); },
    tap(id){ const o=ROOM_OBJS.find(o2=>o2.id===id); if(!o) return false; o.tap(); return true; },
    cards(b){ boxCards(b!==false); return ROOM.cards; },
    reset(){ ROOM.t=0; ROOM.win=-1; ROOM.fx=null; ROOM.dog=null; return true; },
    // E37 — the room-remembers doors: the sky dial, the memory state, the sweep
    wx(id){ if(id&&WEATHERS.includes(id)&&id!==ROOMWX){ ROOMWX=id; WXR.key=null; bedSkySync(); roomSave(); }
      return ROOMWX; },
    mem(){ let d=null; try{ d=JSON.parse(localStorage.getItem(ROOM_KEY)||'null'); }catch(e){}
      return { wx:ROOMWX, saved:!!d, key:ROOM_KEY,
        pieces:AT.grid.size, scen:BED.scen.size,
        train:!!(BED.ctx? TRAIN.placed : BED.train.placed),
        running:!!(BED.ctx? TRAIN.running : BED.train.running),
        consist:(BED.ctx? consist : BED.consist).slice(), eng:BED.ctx? ENGINE : BED.eng }; },
    clearRoom(){ try{ localStorage.removeItem(ROOM_KEY); }catch(e){}
      ROOMWX='clear'; WXR.key=null;
      if(SCREEN==='menu'||SCREEN==='board'){ BED.on=false; bedScreen(SCREEN); }
      return true; },
  },
  // E23 — THE predicate, asked from inside the bedroom wrapper (what the ghost
  // tint and the drop see on the menu floor). Battery doors, mutation-free.
  bedq(t,r,gx,gy){ return SCREEN==='menu'&&BED.on? inBed(()=>placeQuery(t,r|0,gx,gy)) : null; },
  bedscen(t,gx,gy){ return SCREEN==='menu'&&BED.on? inBed(()=>canPlaceScen(t,gx,gy)) : null; },
  // E19 — the lifted hand, for the battery: the live drag + hover cell, the lift
  // constants, and both pointer transforms (rug and attract) so a rig can aim a
  // REAL finger anywhere and compute where the lifted point must land.
  lift(){ return {
    drag: DRAG? { kind:DRAG.kind, x:DRAG.x, y:DRAG.y, pt:DRAG.pt||null, t0:DRAG.t0||0 } : null,
    hover: hover? hover.slice() : null,
    LIFT:DRAG_LIFT, RAMP:LIFT_RAMP,
    rug:{ ox:OX, oy:OY, s:SC, GX, GY, C },
    att:{ ox:ATT.ox, oy:ATT.oy, s:ATT_SCALE },
  }; },
  menu(){ showScreen('menu'); return SCREEN; },
  play(){ showScreen('game'); return SCREEN; },
  color(name){ if(!LIVERY[name]) return false; COLOR=name; liveryChanged(); save(); return COLOR; },
  // ---- the BIG COUNTRY rig (E10) ----
  size(id){ return sizeSet(id)? SIZE : false; },
  land(id){ if(!LANDS.includes(id)||CAMP.on||PLAY.on) return false;
    LAND=id; rugSync(); save(); return LAND; },
  weather(id){ if(!WEATHERS.includes(id)||CAMP.on||PLAY.on) return false;
    WEATHER=id; rugSync(); save(); return WEATHER; },
  // ---- the SKY PILLS rig (E35) — the pill tap's exact law, any floor ----
  sky:{ tap(id){ if(!WEATHERS.includes(id)) return false;
          if(activeWeather()!==id){
            if(PLAY.on) PLAY.wx=id; else if(CAMP.on) CAMP.wx=id;
            else { WEATHER=id; save(); } }
          rugSync(); return activeWeather(); },
        state(){ return { active:activeWeather(), build:WEATHER, play:PLAY.wx, camp:CAMP.wx }; } },
  view:{
    fit(){ viewFit(); return TS.view.get(); },
    base(){ viewBase(); return TS.view.get(); },   // E20: the big default, re-aimed on demand
    set(s,ox,oy){ VIEW.s=+s||fitScale(); if(ox!=null) VIEW.ox=+ox; if(oy!=null) VIEW.oy=+oy;
      VIEW.vx=VIEW.vy=0; clampView(); viewApply(); return TS.view.get(); },
    get(){ return { scale:SC, ox:OX, oy:OY, fit:fitScale(), max:zoomMax(), follow:FOLLOW.on,
      base:baseScale(), off:offBase(), bar:BAR, ui:UIS, aim:baseAim() }; },   // E15: follow rides along · E20: the big-default telemetry
    toRug(px,py){ return [ (px-OX)/SC, (py-OY)/SC ]; },   // THE one inverse, exposed for the rigs
  },
  // ---- the E15 rig: gravity · riders · ride-along · the name ----
  grav(){ return GRAV.mul; },                    // the current eased multiplier (flat = exactly 1)
  riders(){
    const waiting={}; for(const [k,p] of PLAT) waiting[k]=p.n;
    const ps=RIDERS.poseT>0? RIDERS.pose : null;
    const cars=PLAY.on? [] : TRAIN.cars;
    return { waiting, pose:ps,
      aboard: cars.filter(c=>RIDER_CAP[c.type]!=null).map(c=>({car:c.type,n:c.rid|0,pose:ps})) };
  },
  follow(on){ return followSet(on==null? !FOLLOW.on : !!on); },
  setName(w1,w2,sfx){ return nameApply(w1,w2,sfx); },   // null clears; returns the sign text or false
  step(dt){ const d=dt||1/60;
    if(SCREEN==='game') update(d);
    else if(SCREEN==='play'){ update(d); playUpdate(d); }
    else menuUpdate(d); },
  xy(gx,gy){ return { x:OX+SC*(GX+gx*C+C/2), y:OY+SC*(GY+gy*C+C/2) }; },   // cell centre in client px (pointer rigs)
  // E31 — the charm probe (rig-only): the scen at a cell with its live wave
  // timer, so a battery can assert a reaction armed on a REAL pass without
  // reading pixels. Mutation-free.
  charm(gx,gy){ const s=scen.get(key(gx,gy)); return s? {t:s.t, v:s.v|0, wave:+(s.wave||0).toFixed(3)} : null; },
  // ---- the wind-up rug rig (E6) ----
  play:{
    enter(){ return playEnter(); },
    exit(){ if(PLAY.on) playExit('menu'); return SCREEN; },
    // E17: the rotation rig. map() = the active rug + the persisted cycle;
    // set(i) forces a rug for screenshots/tests — rig-only: a forced entry
    // never advances playIdx and never saves.
    map(){ return { on:PLAY.on, i:PLAY.mapIdx, name:(PLAYMAPS[PLAY.mapIdx]||PLAYMAPS[0]).name, playIdx:PLAYI|0 }; },
    set(i){ if(CAMP.on) return false; if(PLAY.on) playExit('menu'); playEnter(i|0); return TS.play.map(); },
    add(color,speed,cars){ return playAdd(color,speed,cars); },   // speed/cars pinned only by batteries
    count(){ return PLAY.trains.filter(t=>!t.dying).length; },
    get crashes(){ return PLAY.crashes; },
    state(){ return { on:PLAY.on, cap:PLAY_CAP, crashes:PLAY.crashes, map:PLAY.mapIdx, playIdx:PLAYI|0,
      loopLen:PLAY.loop? PLAY.loop.len:0, respawnT:PLAY.respawnT,
      trains:PLAY.trains.map(tr=>({ id:tr.id, color:tr.color, speed:tr.speed, dying:!!tr.dying,
        pauseT:tr.pauseT, d:loopCoord(tr.cars[0].rd),
        grav:tr.grav, crest:!!tr.crest, pose:tr.poseT>0? tr.pose:null,   // E30: the hill-heart, readable
        rid:tr.cars.reduce((n,c)=>n+(c.rid|0),0),
        cars:tr.cars.map(c=>[c.rd.cx,c.rd.cy,c.rd.el?1:0]) })) }; },
  },
  // ---- the eager train rig (E27) — the predicate + the arrival, rig-forced ----
  eager:{
    done(){ const v=lineDone(); return { done:!!v.done, coach:!!v.coach,
      at:v.done? [v.x,v.y,v.el|0]:null }; },   // the raw predicate — mutates nothing
    arrive(){ return eagerTry(); },            // force one arrival check (the mutation hook's own path)
    summon(gx,gy){ return eagerSummon(gx,gy); },
    last(){ return EAGER.last? {...EAGER.last} : null; },
    coach(b){ if(b!=null) stCoachT=!!b; return stCoachT; },   // read/seed the once-a-session latch
  },
  // ---- the left rail rig (E33) — the accordion's whole truth ----
  rail:{
    tab(){ return palTab; },                   // the open department, null = all folded
    open(t){ buildPalette.sync(t||null); return palTab; },
    state(){ const r=$('rail').getBoundingClientRect();
      return { tab:palTab, vis:getComputedStyle($('rail')).display!=='none',
        x:r.left, y:r.top, w:r.width, h:r.height,
        scroll:$('railBody').scrollTop }; },
  },
  // ---- the magic trail rig (E28) — the one dial + the buffers, for the battery ----
  trail:{
    get(){ return { worn:equip.trail, pts:TRAIL.n, fade:+TRAIL.fade.toFixed(3),
      sparks:TRAIL.sparks.reduce((n,s)=>n+(s.on?1:0),0), cap:SPARK_MAX,
      pool:TRAIL.sparks.length, spawned:TRAIL.mk }; },
    set(id){ if(id!=='none'&&!(TRAIL_IDS.includes(id)&&stOwned(id))) return false;
      trailWear(id); save(); storeSync(); return TS.trail.get(); },
    list(){ return TRAIL_IDS.slice(); },
    pts(){ const N=TRAIL.n, i0=(TRAIL.head-N+TRAIL_PTS)%TRAIL_PTS, out=[];
      for(let i=0;i<N;i++){ const j=(i0+i)%TRAIL_PTS;
        out.push([+TRAIL.x[j].toFixed(2),+TRAIL.y[j].toFixed(2),+TRAIL.z[j].toFixed(2),TRAIL.b[j]]); }
      return { ribbon:out,   // oldest→newest world points + break flags
        sparks:TRAIL.sparks.filter(s=>s.on).map(s=>[+s.x.toFixed(2),+s.y.toFixed(2),+s.z.toFixed(2)]) }; },
  },
  // ---- the chest + TRAIN SHELF rig (E25 → E36) — state only; the pop-up's
  // open() door died with the pop-up (the shelf is resident furniture) ----
  tbox:{
    state(){
      const b=$('tbox').getBoundingClientRect(), s=$('spread').getBoundingClientRect();
      return { resident:SCREEN==='play', side:TBOX_SIDE, shy:document.body.classList.contains('shygame'),
        box:{x:b.left,y:b.top,w:b.width,h:b.height,vis:getComputedStyle($('tbox')).display},
        shelf:{x:s.left,y:s.top,w:s.width,h:s.height,
          vis:getComputedStyle($('spread')).display,
          cards:document.querySelectorAll('#spTray .tray').length} };
    },
  },
  // ---- the toy box rig (E7) ----
  coll:{
    list(){ return COLL.filter(r=>coll.has(r[0])).map(r=>r[0]); },
    has(id){ return coll.has(id); },
    grant(id){
      if(id==='all'){ for(const r of COLL) coll.add(r[0]); collChanged(); save(); return true; }
      if(!COLL_BY[id]||coll.has(id)) return false;
      coll.add(id); collChanged(); save(); return true;
    },
    reset(){ coll=baseColl(); if(!coll.has('exp')) ENGINE='loco'; collChanged(); save(); return true; },
    catalog(){ return COLL.map(r=>({id:r[0],name:r[1],cat:r[2],lvl:r[3],price:r[4]|0})); },
  },
  engine(t){ return setEngine(t); },
  // ---- the star bank rig (E9) ----
  stars:{
    get(){ return stars; },
    add(n){ stars+=n|0; starHudSync(); save(); return stars; },
    set(n){ stars=Math.max(0,n|0); starHudSync(); save(); return stars; },
  },
  // ---- the bank rig (E13) ----
  bank:{
    open(){ bankShow(true); return true; },
    close(){ bankShow(false); return true; },
    mint(p){ if(p) Object.assign(MINT,p); return {...MINT}; },   // the mint dial — re-tune it and the ledger must follow
  },
  // ---- the store rig (E9; E13 re-aims tab, adds select/paints/chip) ----
  store:{
    open(){ storeShow(true); return true; },
    close(){ storeShow(false); return true; },
    tab(k2){                     // E22: same name, the GVT lane — rig jumps land INSTANT (smooth=false)
      if(STORE_TABS.some(t2=>t2[0]===k2)){ aisleJump(k2,false); return k2; }
      return stTabAt();
    },
    tabs(){                      // E22 telemetry: the lit plaque, the live glide, the shelf mode
      const on=document.querySelector('#shTabs .shtab.on');
      return { lit:on? on.dataset.k:null, at:stTabAt(), jump:AJUMP? AJUMP.k:null,
        shelves:AISLE2?2:1, rowH:AISLE2 };
    },
    select(id){ return stageMount(id); },              // mount the showcase; returns the mounted id
    paints(reset){ const o={...AISLE_PAINTS}; if(reset) AISLE_PAINTS={}; return o; },
    chip(b){ if(b!=null){ stChipOn=!!b; $('stStars').style.display=stChipOn?'':'none'; } return stChipOn; },
    list(){
      const ids=[...SET_ROW_A,...SET_ROW_B,...TRAIL_IDS,...WHISTLE_IDS,...CRASH_IDS,...BELL_IDS,...MODEL_IDS,
        ...COLL.filter(r=>r[2]!=='paint'&&!coll.has(r[0])&&!COLL_NO_SALE.includes(r[0])).map(r=>r[0])];
      return ids.map(stRowOf);
    },
    buy(id){ return storeBuy(id,null); },
    equip(id){
      const snd=sndSlot(id);
      if(snd){ if(!coll.has(id)) return false; equip[snd]=id; save(); storeSync(); return {...equip}; }
      if(typeof id==='string'&&id.startsWith('pt_')&&LIVERY[id.slice(3)]&&stOwned(id)){
        COLOR=id.slice(3); liveryChanged(); save(); return COLOR; }
      if(id==='none'||(typeof id==='string'&&id.startsWith('tr_'))){   // E28: the trail slot
        if(id!=='none'&&!(TRAIL_IDS.includes(id)&&stOwned(id))) return false;
        trailWear(id); save(); storeSync(); return {...equip};
      }
      return false;
    },
    equipped(){ return {...equip, color:COLOR}; },
    prices(){ const o={}; for(const r of COLL) if(r[4]) o[r[0]]=r[4]; for(const r of STORE) o[r[0]]=r[3]|0; return o; },
  },
  // ---- the campaign rig (E5) ----
  camp:{
    winWindow:CAMP_WIN_WINDOW,
    open(){ showScreen('board'); return SCREEN; },
    enter(n){ return campEnter(n); },
    exit(){ campExit('board'); return SCREEN; },
    unlockAll(){ CAMP.all=true; save(); if(SCREEN==='board') boardSync(); return true; },
    reset(){ if(CAMP.on) campExit('board'); CAMP.done.clear(); CAMP.all=false; CAMP.wip=null; save(); boardSync(); return true; },
    // THE SOLVABILITY LAW: build level n's scripted reference solution, ready for GO.
    // Returns {ok:true} or {ok:false,why,at} — a level whose reference stops fitting refuses to ship.
    solve(n){
      if(!(CAMP.on&&CAMP.level===n)){ if(!campEnter(n)) return {ok:false,why:'locked'}; }
      clearPlayer();
      const S=SOLVE[n-1]; if(!S) return {ok:false,why:'no-solution'};
      // THE SOLVABILITY LAW (E8): a reference may place ONLY toys the kid owns by now.
      // With the campaign gated, a solution that reaches for an unearned piece is a
      // level nobody can finish — so it fails here, loudly, instead of on a kid's rug.
      for(const row of S.rows) if(!coll.has(row[0])) return {ok:false,why:'unowned:'+row[0],at:row};
      if(S.rows.length>SOLVE_CAP[n-1]) return {ok:false,why:'too-many:'+S.rows.length,at:SOLVE_CAP[n-1]};
      for(const row of S.rows){
        const [t,r,x,y]=row, q=placeQuery(t,r,x,y);
        if(!q.ok) return {ok:false,why:q.why,at:row};
        setTrackPiece(t,r,null,q.elev,x,y);
      }
      if(!placeTrainAt(S.start[0],S.start[1],0)) return {ok:false,why:'train'};
      shelfSync(); save();
      return {ok:true,rows:S.rows.length,cap:SOLVE_CAP[n-1]};
    },
    state(){ return { on:CAMP.on, level:CAMP.level, won:CAMP.won, all:CAMP.all,
      done:[...CAMP.done].sort((a,b)=>a-b), stations:CAMP.stations.slice(),
      visited:[...CAMP.visited], wip:CAMP.wip? CAMP.wip.level:null, tugToast:CAMP.tugT,
      crossed:CAMP.crossed, toyCard:toyCard, toyQueue:toyQ.slice() }; },
    // the ceremony's own door — the battery taps through the cards the way a kid does
    toyTap(){ return toyTap(); },
    hints(){ return LEVELS.map(L=>L.hint); },
    pretty(){ return campPretty().n; },   // E14: the kind-count the scenery bonus would see right now
    roll(){ return surpriseRoll(); },     // E21: sample the surprise (pure — mutates nothing; the battery reads the odds)
    pool(){ return SURPRISE_POOL.slice(); },   // E21: the first-drop words (the battery greps them against the kid list)
  },
  state(){ return { screen:SCREEN, color:COLOR,
    size:SIZE, land:LAND, weather:WEATHER, gw:GW, gh:GH,
    name:NAME? {w1:NAME.w1,w2:NAME.w2,s:NAME.s,text:signText()} : null,   // E15
    view:{ scale:SC, ox:OX, oy:OY },
    placed:TRAIN.placed, running:TRAIN.running, F:TRAIN.F,
    pieces:[...grid.values()].filter(pc=>pc.t!=='ref').length+hgrid.size,
    track:[...grid].filter(([k,pc])=>pc.t!=='ref').map(([k,pc])=>[k,pc.t,pc.r,pc.elev|0])
      .concat([...hgrid].map(([k,pc])=>[k,pc.t,pc.r,1])),
    consist:consist.slice(), lap:lapDone, hint:hintStage, pauseT:TRAIN.pauseT,
    scenery:scen.size, chirps:chirpN, toys:collN(), eng:ENGINE,
    stars:stars, equip:{...equip}, owned:coll.size,
    scen:[...scen].map(([k,s])=>[k,s.t,s.v,+(s.wave>0),s.t==='sig'?(s.red|0):(s.t==='whis'?(s.arm|0):0)]),
    sw:[...grid].filter(([k,pc])=>pc.t==='sw').map(([k,pc])=>[k,pc.r,pc.sel,pc.latch?1:0,0])
      .concat([...hgrid].filter(([k,pc])=>pc.t==='sw').map(([k,pc])=>[k,pc.r,pc.sel,pc.latch?1:0,1])),
    camp:{ on:CAMP.on, level:CAMP.level, won:CAMP.won, done:[...CAMP.done].sort((a,b)=>a-b) },
    play:{ on:PLAY.on, count:PLAY.trains.filter(t=>!t.dying).length, crashes:PLAY.crashes,
      map:PLAY.mapIdx, playIdx:PLAYI|0 },   // E17: the active rug + the persisted cycle
    at:(()=>{ if(SCREEN==='game'||!AT.cars.length) return null;   // E18: null while a hand holds the stock toy
      RGRID=AT.grid; HGRID=AT.hg; try{ const p=pos(AT.cars[0].rd); return {x:p.x,y:p.y}; } finally{ RGRID=grid; HGRID=hgrid; } })(),
    loco:TRAIN.placed? Object.assign({},TRAIN.cars[0].rd,pos(TRAIN.cars[0].rd)) : null,
    cars:TRAIN.cars.map(c=>{ const p=pos(c.rd); return {t:c.type,cx:c.rd.cx,cy:c.rd.cy,el:c.rd.el?1:0,x:p.x,y:p.y,z:p.z}; }) }; },
  // ---- the little voice rig (E12) ----
  voice:{
    say(id){ voiceSay(id,0); return !!(VOICE[id]&&VOICE[id].buf); },       // manual audition
    at(m){ voiceAt(m); return VOICE_AT[m]||null; },                        // fire a MOMENT through the re-aim table
    ready(){ const r={}; for(const k in VOICE) r[k]=!!VOICE[k].buf; return r; },
    log:VOICE_LOG,                                                         // append-only {id,t,dropped,why?} per request
    vol(n){ if(n!=null) voiceVol=+n; return voiceVol; },                   // live VOICE_VOL override — Wyatt's one-sitting dial
  },
  mute(b){ AU.on=!b; muteSync(); },
};
requestAnimationFrame(frame);
</script>
</body>
