  #stpanel.two{ display:flex; flex-direction:column; width:96vw; height:96vh; }

  /* ---- E25 THE TOY BOX ON THE RUG — #bar and #ptray are DEAD. The rug gets the
     whole screen; the only resident gameplay chrome is a little wooden toy box
     tucked bottom-left. Tap it and a wooden tray SPREAD rises out of it
     carrying EXACTLY what the bar carried — the E16 drag laws, THE GATE, the
     E13 lifted scroll — and it puts itself away the moment a drag leaves it or
     a finger lands on the map.
     E27 THE SQUARE BOX: the spread stops being a bench across the screen — a
     compact near-square panel (resize() stamps its width/height: the 40vh law
     where it's roomy, width- and chip-clearance-capped on phones, SPREAD_AR
     wide), tabs re-furnitured as a vertical plaque SPINE down the left wall
     (the E22 department grammar), cards in a BOX_COLS grid that scrolls
     VERTICALLY (the E13 recipe rotated 90°), TIDY UP + MORE TOYS pinned as a
     footer. #shelfTrain is DEAD here (E27 THE EAGER TRAIN) — the CSS scoping
     below hides it only while the #shelf node is home in the spread; the
     bedroom borrows the node and keeps the whole train shelf.
     E33 THE LEFT RAIL: the round-trip dies — in BUILD and the campaign the
     spread's whole cargo moves to a resident RAIL down the left wall (every
     department plaque always out, the open one unfolds in place), the spread
     keeps ONLY PLAY's tray, and the chest becomes BUILD's door to the E7
     look-book. "Get to work and keep just dragging from the left."
     E36 FEWER COMPARTMENTS: the pop-up dies too — the spread is PLAY's
     resident TRAIN SHELF, one flat row bottom-center, out from the moment
     the rug mounts. No door, no rise, no dismiss laws: see train, grab
     train, train is on the track ("we want almost a two-year-old to be able
     to play the 'Play Mode'"). The chest leaves PLAY with its job; it stays
     BUILD's look-book door. The shelf fades with the shy fold instead of
     dismissing. ---- */
  #tbox{ position:absolute; left:calc(var(--ui)*5px); bottom:calc(var(--ui)*5px + env(safe-area-inset-bottom));
    z-index:7; width:calc(var(--ui)*36px); height:calc(var(--ui)*36px);
    background:none; border:none; padding:0; cursor:pointer; touch-action:none; display:none; }
  #tbox canvas{ width:100%; height:100%; display:block; pointer-events:none;
    filter:drop-shadow(0 calc(var(--ui)*2px) calc(var(--ui)*4px) rgba(0,0,0,0.45)); }
  #spread{ position:absolute; left:50%; transform:translateX(-50%);
    bottom:calc(var(--ui)*5px + env(safe-area-inset-bottom));
    z-index:6; max-width:calc(100vw - var(--ui)*10px); overflow:hidden;
    background:linear-gradient(rgba(58,42,24,0.93),rgba(36,26,14,0.93));
    border:calc(var(--ui)*2px) solid #6e5130; border-radius:calc(var(--ui)*14px);
    box-shadow:0 calc(var(--ui)*7px) calc(var(--ui)*22px) rgba(0,0,0,0.5);

  body.shygame #spread *{ pointer-events:none; }
  /* ---- E33 THE LEFT RAIL: the toybox, unrolled down the left wall — resident
     BUILD/campaign chrome in the spread's own wood, seated exactly where the
     HANDY FIVE stood (clears the wordmark above, the chest below). The scroll
     column interleaves plaque/group/plaque/group; an OPEN group's wrapper is
     display:contents (stylesheet) so its cards flatten into the column, a
     folded one is display:none inline. Native pan-y for touch, grab-drag +
     fling for the mouse, a travelled tap is a scroll never a pick (the E13
     recipe, re-aimed). Cards ride the spread's own --bc dial so the pieces
     look identical to the square box they left. The shy fold fades the whole
     rail while a hand is live on the rug. ⚠ NO scrollbar skin here — the
     classic-scrollbar trap stays dead. ---- */
  #rail{ position:absolute; left:calc(var(--ui)*5px); top:60px;
    bottom:calc(var(--ui)*44px + env(safe-area-inset-bottom));
    z-index:5; display:none; flex-direction:column;

    transition:opacity var(--shygame,0.25s) ease; }

  body.shygame #rail *{ pointer-events:none; }
  /* E35 THE SKY PILLS — the four weathers pinned ABOVE the fold, one tap from
     any floor (the audit's headliner: PLAY had no sky at all, BUILD's sat 8

  #magic{ flex:0 0 auto; display:flex; flex-direction:column; gap:calc(var(--ui)*3px);

  #rail.magiconly{ bottom:auto; }

  #railBody{ flex:1; min-height:0; display:flex; flex-direction:column;
    align-items:center; gap:calc(var(--ui)*3px);
    padding:calc(var(--ui)*4px);
    overflow-y:auto; overflow-x:hidden; touch-action:pan-y; cursor:grab;

  /* E27→E33: the department plaques (the E22 .shtab grammar, active one lit)

  .ptab{ background:linear-gradient(#7A553A,#5C3F28); border:2px solid #3a2a18; border-radius:calc(var(--ui)*7px);

  /* ---- THE TRAIN SHELF (E16) — the shed's jobs, out in the open. Every item is

  #shelf{ display:flex; gap:calc(var(--ui)*8px); align-items:center; }

  /* ---- THE SHY UI (E18): touch the attract rug and the chrome gets out of the
     way — opacity + pointer-events ONLY, nothing moves or reflows, so the return
     is seamless. The bedroom tools fade IN with the chrome faded out; they are
     part of the shy state. Durations are stamped from SHY_FADE_MS at boot. ---- */
  #menu,#mute{ transition:opacity var(--shyms,0.3s) ease; }

  body.shy #menu>*,body.shy #mute{ pointer-events:none; }

/* =====================================================================

   for the WHOLE consist: the uniform-arc follower stays untouched, we
   only scale the shared step (modulating cars individually would break
   the couplings law and the game). The collision probe, the bumper,
   the station and the pause all see the SAME modified d — one variable,
   used everywhere the old d was. Flat track ⇒ grade 0 ⇒ mul eases to
   (and holds) EXACTLY 1.0 ⇒ byte-identical motion, so BUILD ovals,
   PLAY's figure-8, the attract oval and all ten campaign levels are
   provably untouched — the physics gates itself, no mode gates exist.
   GRAV_UP_MIN is THE NEVER-STALLS LAW: the engine always makes the
   hill, it just WORKS for it. No failure, no rollback — this is a toy.
   ===================================================================== */
const GRAV={mul:1,crest:false};
let clackAcc=0;
function gravTick(dt){
  const lc=TRAIN.cars[0].rd;                        // the LOCO reads the hill for everyone
  const f=clone(lc), b=clone(lc);
  const rf=advance(f,GRAV_PROBE), rb=back(b,GRAV_PROBE);
  const run=rf.moved+rb.moved;
  const grade=run>2? (pos(f).z-pos(b).z)*C/run : 0; // levels per cell of arc; >0 = climbing
  const tgt=Math.max(GRAV_UP_MIN,Math.min(GRAV_DN_MAX,1-GRAV_K*grade));
  GRAV.mul+=(tgt-GRAV.mul)*Math.min(1,GRAV_EASE*dt);
  // THE CREST: a climb latches, the first descent after it whooshes — ONCE.
  // Flat never latches and never whooshes (the byte-identical audio law).
  if(grade>0.08) GRAV.crest=true;
  else if(grade<-0.08 && GRAV.crest){ GRAV.crest=false; SND.whoosh(); riderYay(); }
  return GRAV.mul;
}

function platTick(dt){
  if(PLAY.on&&!playRiders()){ if(PLAT.size) PLAT.clear(); return; }   // E30: the per-map door (maps 1-3 keep empty platforms, byte-true)
  let n=0;
  for(const g of [grid,hgrid]) for(const [k,pc] of g){
    if(pc.t!=='st') continue; n++;
    const pk=k+':'+(pc.elev?1:0);
    let p=PLAT.get(pk);
    if(!p) PLAT.set(pk,p={n:WAIT_MAX,t:0,wv:0});
    if(p.n<WAIT_MAX){ p.t+=dt; if(p.t>=WAIT_REGROW){ p.t=0; p.n=Math.min(WAIT_MAX,p.n+1); } }
    else p.t=0;

    const i=pk.lastIndexOf(':'), k=pk.slice(0,i);

    if(!pc||pc.t!=='st') PLAT.delete(pk);

// seat)? The waiters just do the CHARM-LAW wave. Nothing refuses, nothing fails.
function boardAt(cars,lk){
  const p=PLAT.get(lk);
  let slot=0;
  for(const c of cars){
    if(!(c.rid>0)) continue;
    const cp=carPose(c);
    for(let i=0;i<c.rid;i++){
      const s2=platSlotXY(lk,slot++);
      BOARDERS.push({ x0:cp.x, y0:cp.y-LIFT*(cp.z||0), x1:s2.x, y1:s2.y,
        t:-0.06*BOARDERS.length, dur:0.5, col:PPL_COLS[(slot+i)%PPL_COLS.length], kind:'leave', car:null });
    }

      const i=--p.n, s2=platSlotXY(lk,i), cp=carPose(c);

// ---- piece geometry: port-to-port polylines with cumulative arc length ----
// ports: 0=N 1=E 2=S 3=W. Every path runs ports[0] -> ports[1].
// E4, AMENDED BY E15: a path may carry z (one 0..1 per point) and pcell (which
// cell of a multi-cell prefab each endpoint lives in; null for every 1×1 piece).
// THE Z LAW AS OF E15: z still NEVER touches the xy arc metric — every rider

function rotPtS(p,r,S){ let x=p[0],y=p[1]; for(let i=0;i<r;i++){ const t=x; x=S-y; y=t; } return [x,y]; }

  s :[ {ports:[3,1], pts:[[0,C/2],[C,C/2]]} ],

  b :[ {ports:[0,null], pts:[[C/2,0],[C/2,C/2+10]]} ],
  st:[ {ports:[3,1], pts:[[0,C/2],[C,C/2]]} ],
  br:[ {ports:[3,1], pts:[[0,C/2],[C,C/2]]} ],                              // a straight in fancy dress
  tun:[ {ports:[3,1], pts:[[0,C/2],[C,C/2]]} ],                             // E7: a straight under a little mountain
  sw:[ {ports:[3,1], pts:[[0,C/2],[C,C/2]]}, {ports:[3,2], pts:swArc} ],    // facing W; branches E / S

const PATHS={};
for(const t in BASE){ PATHS[t]=[]; for(let r=0;r<4;r++) PATHS[t].push(BASE[t].map(b=>mkPath(b.ports,b.pts,r,b.z))); }
// THE SPIRAL (E4): one SPIRAL_CELLS² prefab — a lead-in, SPIRAL_TURNS around the
// tower, a lead-out one level up. Internally just a longer polyline with z ramping,

const SPN=SPIRAL_CELLS, SPS=SPN*C;

function edgePort(x,y){        // block-edge point -> {side, cell offset within the prefab}
  const cl=v=>Math.max(0,Math.min(SPN-1,Math.floor(v/C)));
  if(y>=SPS-0.5) return {side:2, cell:[cl(x),SPN-1]};
  if(y<=0.5)     return {side:0, cell:[cl(x),0]};

}
{
  const M=SPS/2, R=M-C/2, lead=M, sweep=SPIRAL_TURNS*TAU;
  const pts=[], z=[];
  for(let i=0;i<=8;i++) pts.push([C/2, SPS-lead*i/8]);                      // in: S edge, heading N
  const NA=Math.max(24,Math.round(sweep/(Math.PI/24)));
  for(let i=1;i<=NA;i++){ const a=Math.PI+sweep*i/NA; pts.push([M+R*Math.cos(a),M+R*Math.sin(a)]); }
  const aE=Math.PI+sweep, hx=-Math.sin(aE), hy=Math.cos(aE);                // exit heading = arc tangent
  const ex=M+R*Math.cos(aE), ey=M+R*Math.sin(aE);
  for(let i=1;i<=8;i++) pts.push([ex+hx*lead*i/8, ey+hy*lead*i/8]);
  const cum=[0]; for(let i=1;i<pts.length;i++) cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  for(let i=0;i<pts.length;i++) z.push(cum[i]/cum[cum.length-1]);           // z climbs 0 -> 1 over the ride
  PATHS.sp=[];
  for(let r=0;r<4;r++){
    const P=pts.map(p=>rotPtS(p,r,SPS));
    const cu=[0]; for(let i=1;i<P.length;i++) cu.push(cu[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]));

function pieceAt(x,y){                            // the elev-0 layer (spiral stubs deref to the anchor)
  let pc=RGRID.get(key(x,y));
  if(pc&&pc.t==='ref') pc=RGRID.get(key(pc.ax,pc.ay));

}
const pieceHi=(x,y)=>HGRID.get(key(x,y))||null;   // the elev-1 layer
const pieceTop=(x,y)=>pieceHi(x,y)||pieceAt(x,y); // what a finger lands on: the visible top piece
const pieceOf=rd=>rd.el? pieceHi(rd.cx,rd.cy) : pieceAt(rd.cx,rd.cy);   // the piece a rider rides
const pathsOf=pc=>PATHS[pc.t][pc.r];

const scenAt=(x,y)=>scen.get(key(x,y))||null;
function mkPiece(t,r,sel,elev){

// one writer for track placement — spiral spreads 'ref' stubs over its footprint
function setTrackPiece(t,r,sel,elev,x,y){
  const pc=mkPiece(t,r,sel,elev);
  if(t==='sp'){ pc.ax=x; pc.ay=y;
    for(const [x2,y2] of spiralCells(x,y)) grid.set(key(x2,y2),(x2===x&&y2===y)?pc:{t:'ref',ax:x,ay:y});
  } else (elev?hgrid:grid).set(key(x,y),pc);

}
function removeTrackPiece(x,y,pc){
  if(pc.t==='sp'){ for(const [x2,y2] of spiralCells(pc.ax,pc.ay)) grid.delete(key(x2,y2)); }
  else (pc.elev?hgrid:grid).delete(key(x,y));

// THE ONE-PREDICATE LAW: the drag ghost tint and the drop both call these, nobody else decides.
// E2 generalized it: every scenery kind carries a blocks-track flag in SCENDEF; the river's
// bridge exception stays special-cased here. Animals don't block — a cow between the rails is the toy.
function cellBlocksTrack(t,x,y){
  // E23: on the bedroom floor the piggy's spot and the big-button rows are
  // FURNITURE — blocked cells through THE predicate, so the ghost tint and the
  // drop agree for free. BED.blk only exists inside the bedroom wrapper's world.
  if(BED.ctx&&BED.blk&&BED.blk.has(key(x,y))) return true;
  const s=scenAt(x,y); if(!s) return false;
  if(s.t==='rv'||s.t==='pond') return t!=='br';   // only a bridge may span water (E7: the pond is water too)
  return !!SCENDEF[s.t].blocks;
}
// E4 — ELEVATION IS INFERRED, NEVER CHOSEN. Every aligned mate votes for the level
// that would join it; the piece takes the level that joins the most (the ground on a
// tie, never floating without a vote). A mate at the WRONG height is merely passed
// by (that's how a line threads under or over — two pieces per cell), EXCEPT a
// ramp/spiral mate: its cells hold both levels, nothing can pass, the joint is a
// true abutment -> {ok:false, why:'ramp'} — NEEDS A RAMP!
// This is THE predicate: ghost tint, drop, and TS.place all ask it, nobody else decides.
function placeQuery(t,r,x,y){
  if(!PATHS[t]) return {ok:false,why:'oob'};
  r=(r|0)%4;
  const cells=t==='sp'? spiralCells(x,y) : [[x,y]];
  for(const [x2,y2] of cells){
    if(x2<GX0||y2<GY0||x2>=GW||y2>=GH) return {ok:false,why:'oob'};   // GX0/GY0 = 0 outside E18's bedroom
    if(cellBlocksTrack(t,x2,y2)) return {ok:false,why:'scenery'};
  }
  const own=new Set(cells.map(c2=>key(c2[0],c2[1])));
  const climber=(t==='rp'||t==='sp');
  const votes=[0,0], hard=[false,false];
  for(const p of PATHS[t][r]){
    for(const end of [0,1]){
      const side=p.ports[end]; if(side==null) continue;
      const pz=p.z? Math.round(p.z[end?p.z.length-1:0]) : 0;   // this port's climb within the piece
      const [px,py]=p.pcell? [x+p.pcell[end][0], y+p.pcell[end][1]] : [x,y];
      const D=[[0,-1],[1,0],[0,1],[-1,0]][side];
      const nx=px+D[0], ny=py+D[1];
      if(own.has(key(nx,ny))) continue;
      const lo=pieceAt(nx,ny), hi=pieceHi(nx,ny);
      let m0=false, m1=false, climberMate=false;       // mate elevations aligned at this port
      for(const q of (hi&&hi!==lo? [lo,hi] : [lo])){
        if(!q) continue;
        for(const qp of pathsOf(q)) for(const qe of [0,1]){
          if(qp.ports[qe]!==(side+2)%4) continue;
          if(qp.pcell){ const qx=q.ax+qp.pcell[qe][0], qy=q.ay+qp.pcell[qe][1]; if(qx!==nx||qy!==ny) continue; }
          const me=(q.elev|0)+(qp.z? Math.round(qp.z[qe?qp.z.length-1:0]) : 0);
          if(me===0) m0=true; else if(me===1) m1=true;
          if(spans2(q)) climberMate=true;
        }
      }
      if(!m0&&!m1) continue;                           // nothing aligned — this port is free air
      for(const e of [0,1]){
        const pe=e+pz;
        if(pe>1){ hard[e]=true; continue; }            // level 2 is reserved
        if(pe? m1:m0) votes[e]++;                      // a mate at this height — joined
        else if(climberMate) hard[e]=true;             // abutting a climber at the wrong height
      }

    for(const [x2,y2] of cells){

      if(climber){ if(lo||hi) return false; }
      else if(e){ if(hi||(lo&&spans2(lo))) return false; }
      else if(lo) return false;
    }
    return true;
  };

  const c0=okAt(0), c1=okAt(1);
  if(c0&&c1) return {ok:true,elev:votes[1]>votes[0]?1:0};   // the level that joins more; ground on ties
  if(c0) return {ok:true,elev:0};

}
function canPlaceTrack(t,x,y,r){ return placeQuery(t,r|0,x,y).ok; }
function canPlaceScen(t,x,y){
  if(BED.ctx&&BED.blk&&BED.blk.has(key(x,y))) return false;   // E23: the piggy + button cells refuse scenery too
  if(scenAt(x,y)) return false;
  const lo=pieceAt(x,y), hi=pieceHi(x,y);
  if(!lo&&!hi) return true;
  if(t==='rv'||t==='pond') return !!lo&&lo.t==='br'&&!hi;   // water may slide in under a ground bridge

// ---- riders on the graph (the GVT railPoint pattern) ----
// E4: riders carry el (which level's piece they ride). A joint only connects when the
// two port ELEVATIONS agree — a ramp's high port mates level-1 track, its low port the
// ground, and a mismatched joint is simply a dead end (boing), never a teleport.
function enter(rd,exitPort){
  const pc0=pieceOf(rd); if(!pc0) return false;
  const p0=pathsOf(pc0)[rd.pi];
  const end0=rd.dir>0?1:0;
  const exitElev=(pc0.elev|0)+(p0.z? Math.round(p0.z[end0?p0.z.length-1:0]) : 0);
  const fx=p0.pcell? rd.cx+p0.pcell[end0][0] : rd.cx;
  const fy=p0.pcell? rd.cy+p0.pcell[end0][1] : rd.cy;
  const D=[[0,-1],[1,0],[0,1],[-1,0]][exitPort];
  const nx=fx+D[0], ny=fy+D[1];
  if(nx<GX0||ny<GY0||nx>=GW||ny>=GH) return false;   // GX0/GY0 = 0 outside E18's bedroom
  const entry=(exitPort+2)%4;
  const lo=pieceAt(nx,ny), hi=pieceHi(nx,ny);
  for(const pc of (hi&&hi!==lo? [lo,hi] : [lo])){
    if(!pc) continue;
    const ps=pathsOf(pc), base=pc.elev|0;
    if(pc.t==='sw'){
      // Splitter routing law. facing = ports[0] of both branch paths.
      //  · facing entry  -> the lever picks the branch
      //  · branch entry  -> trailing move, merge out the facing port (no derail, toy kindness)
      //  · PASS LATCH: the first LIVE rider of the consist latches its port-pair on the piece;
      //    every rider entering while the latch is live rides the latched pair (kills the
      //    follower trap AND makes mid-pass reversals retrace their own entry path).
      if(base!==exitElev) continue;
      const facing=ps[0].ports[0];
      let pi=-1;
      if(pc.latch && (pc.latch.a===entry||pc.latch.b===entry)) pi=pc.latch.pi;
      else if(entry===facing) pi=pc.sel?1:0;
      else if(ps[0].ports[1]===entry) pi=0;
      else if(ps[1].ports[1]===entry) pi=1;
      if(pi<0) continue;
      const p=ps[pi];
      rd.cx=nx; rd.cy=ny; rd.pi=pi; rd.el=base?1:0;
      if(p.ports[0]===entry){ rd.dir=1; rd.s=0; } else { rd.dir=-1; rd.s=p.len; }
      if(LIVE) pc.latch={pi,a:p.ports[0],b:p.ports[1]};
      return true;
    }
    for(let i=0;i<ps.length;i++){
      const p=ps[i];
      for(const e2 of [0,1]){
        if(p.ports[e2]!==entry) continue;
        if(base+(p.z? Math.round(p.z[e2?p.z.length-1:0]) : 0)!==exitElev) continue;
        if(p.pcell){ if(pc.ax+p.pcell[e2][0]!==nx || pc.ay+p.pcell[e2][1]!==ny) continue; }
        rd.cx=p.pcell? pc.ax:nx; rd.cy=p.pcell? pc.ay:ny;
        rd.pi=i; rd.el=base?1:0;
        if(e2===0){ rd.dir=1; rd.s=0; } else { rd.dir=-1; rd.s=p.len; }

}
function advance(rd,dist){
  let moved=0;
  for(let guard=0; guard<400 && dist>1e-6; guard++){
    const pc=pieceOf(rd); if(!pc) return {ok:false,moved};
    const path=pathsOf(pc)[rd.pi];
    if(rd.dir>0){
      const room=path.len-rd.s;
      if(dist<=room){ rd.s+=dist; return {ok:true,moved:moved+dist}; }
      moved+=room; dist-=room;
      const ex=path.ports[1];
      if(ex==null || !enter(rd,ex)){ rd.s=path.len; return {ok:false,moved}; }
    } else {
      const room=rd.s;
      if(dist<=room){ rd.s-=dist; return {ok:true,moved:moved+dist}; }
      moved+=room; dist-=room;
      const ex=path.ports[0];
      if(!enter(rd,ex)){ rd.s=0; return {ok:false,moved}; }
    }
  }
  return {ok:true,moved};
}
function back(rd,dist){ rd.dir*=-1; const r=advance(rd,dist); rd.dir*=-1; return r; }
const clone=rd=>({cx:rd.cx,cy:rd.cy,pi:rd.pi,dir:rd.dir,s:rd.s,el:rd.el|0});
function pos(rd){
  const pc=pieceOf(rd); if(!pc) return {x:GX,y:GY,ang:0,z:0};
  const p=pathsOf(pc)[rd.pi], s=Math.max(0,Math.min(p.len,rd.s));
  let i=1; while(i<p.cum.length-1 && p.cum[i]<s) i++;
  const a=p.pts[i-1], b=p.pts[i], L=p.cum[i]-p.cum[i-1]||1, k=(s-p.cum[i-1])/L;
  let ang=Math.atan2(b[1]-a[1],b[0]-a[0]); if(rd.dir<0) ang+=Math.PI;
  const z=p.z? p.z[i-1]+(p.z[i]-p.z[i-1])*k : (pc.elev|0);
  return { x:GX+rd.cx*C+a[0]+(b[0]-a[0])*k, y:GY+rd.cy*C+a[1]+(b[1]-a[1])*k, ang, z };
}

// ---- train assembly / placement ----
// THE CELL-KEY AUDIT (E4): every cell-keyed behavior — this lock, the station re-arm,
// the splitter pass-latch, lap detection — now keys on (cell, elev), so a train crossing
// the top never trips the track beneath it, and vice versa.
function trainCells(){
  const s=new Set();
  for(const c of TRAIN.cars){
    const pc=pieceOf(c.rd);
    if(pc&&pc.t==='sp'){ for(const [x2,y2] of spiralCells(pc.ax,pc.ay)){ s.add(key(x2,y2)+':0'); s.add(key(x2,y2)+':1'); } }
    else{ s.add(key(c.rd.cx,c.rd.cy)+':'+(c.rd.el?1:0)); if(pc&&pc.t==='rp') s.add(key(c.rd.cx,c.rd.cy)+':1'); }
  }
  return s;
}
function trainOn(x,y,pc){                 // is the train using THIS piece (at its level)?
  if(!TRAIN.placed) return false;
  const tc=trainCells();
  if(spans2(pc)||pc.t==='sp') return tc.has(key(x,y)+':0')||tc.has(key(x,y)+':1');
  return tc.has(key(x,y)+':'+(pc.elev?1:0));
}
// E16 — which car a finger lands on: 1-based (1 = the loco, so the result is truthy),
// 0 = none. The loco wins ties by order — grab the LOCO = the whole train picks up.
function trainHitAt(wx,wy){
  if(!TRAIN.placed) return 0;
  for(let i=0;i<TRAIN.cars.length;i++){
    const p=pos(TRAIN.cars[i].rd);
    if(Math.hypot(wx-p.x, wy-(p.y-LIFT*(p.z||0)))<36) return i+1;
  }
  return 0;
}
// E16 — is this cell one the placed train is standing on (either level)?
function trainCellHit(cell){
  if(!TRAIN.placed||!cell) return false;
  const tc=trainCells(), k2=key(cell[0],cell[1]);
  return tc.has(k2+':0')||tc.has(k2+':1');
}
function placeTrainAt(cxl,cyl,prefEl){
  // prefEl asks for a specific level and FAILS if that slot is empty — placement
  // asserts stay elevation-aware; the kid's drop (no prefEl) takes the visible top
  const pc=prefEl==null? pieceTop(cxl,cyl) : (prefEl? pieceHi(cxl,cyl):pieceAt(cxl,cyl));
  if(!pc) return false;
  if(pc.t==='sp'){ cxl=pc.ax; cyl=pc.ay; }
  const p0=pathsOf(pc)[0];
  const loco={cx:cxl,cy:cyl,pi:0,dir:1,s:p0.len/2,el:(pc.elev|0)?1:0};
  const n=1+consist.length, need=GAP*(n-1)+34;
  const probe=clone(loco), r=back(probe,need);
  if(!r.ok){
    const extra=need-r.moved, f=advance(loco,extra+2);
    if(!f.ok) return false;
    const probe2=clone(loco), r2=back(probe2,need);
    if(!r2.ok) return false;
  }
  TRAIN.cars=[{type:ENGINE,rd:loco,face:1,squash:0}];   // E7: the owned engine of choice leads
  for(let i=1;i<n;i++){
    const rd=clone(loco); back(rd,GAP*i);
    TRAIN.cars.push({type:consist[i-1],rd,face:1,squash:0});
  }
  TRAIN.placed=true; TRAIN.F=true; TRAIN.pauseT=0; TRAIN.stKey=null; TRAIN.startSig=null;
  trailClear();                // E28: a fresh placement starts a fresh trail
  return true;
}
function trainHome(quiet){
  if(TRAIN.placed && !quiet){ for(const c of TRAIN.cars){ const p=pos(c.rd); puff(p.x,p.y-8-LIFT*(p.z||0),16); } SND.pop(); }
  TRAIN.placed=false; TRAIN.running=false; TRAIN.cars=[];
  trailClear();                // E28: home = gone — a grab-off keeps its fade, home doesn't
  for(const pc of grid.values()) pc.latch=null;
  for(const pc of hgrid.values()) pc.latch=null;
  BOARDERS=[]; poseReset();    // E15: riders live per-run — home = everyone's out
  shelfSync();
}
function reverseTrain(){
  const lead=TRAIN.F? TRAIN.cars[0] : TRAIN.cars[TRAIN.cars.length-1];
  lead.squash=1;
  for(const c of TRAIN.cars){ c.rd.dir*=-1; c.face*=-1; }
  TRAIN.F=!TRAIN.F; TRAIN.revSinceGo=true; SND.boing();
}
function goTrain(){
  if(!TRAIN.placed) return false;
  TRAIN.running=true;
  const lc=TRAIN.cars[0].rd;
  TRAIN.startSig=key(lc.cx,lc.cy)+':'+(lc.el?1:0)+':'+lc.pi+':'+lc.dir; TRAIN.goDist=0;
  TRAIN.revSinceGo=false;                  // a campaign win wants a TRUE loop, not a ping-pong
  GRAV.mul=1; GRAV.crest=false; clackAcc=0;   // E15: every run starts flat-hearted
  if(CAMP.on) CAMP.visited=new Set();      // station visits count "since GO" (E5 win law)
  shelfSync(); return true;
}

// ---- update ----
function update(dt){
  for(const pc of grid.values()){
    if(pc.ra){ pc.ra.k-=dt*8; if(pc.ra.k<=0) pc.ra=null; }
    if(pc.pop>0) pc.pop=Math.max(0,pc.pop-dt*5);
    if(pc.wob>0) pc.wob=Math.max(0,pc.wob-dt*2.5);
  }
  for(const pc of hgrid.values()){
    if(pc.ra){ pc.ra.k-=dt*8; if(pc.ra.k<=0) pc.ra=null; }
    if(pc.pop>0) pc.pop=Math.max(0,pc.pop-dt*5);
    if(pc.wob>0) pc.wob=Math.max(0,pc.wob-dt*2.5);
  }
  for(const s of scen.values()){
    if(s.ra){ s.ra.k-=dt*8; if(s.ra.k<=0) s.ra=null; }
    if(s.pop>0) s.pop=Math.max(0,s.pop-dt*5);
    if(s.wave>0) s.wave-=dt;
    // E39: the windows' little clock, and the head that answers then ducks — the
    // follower eases toward up while time remains, down when the duck moment comes,
    // so a re-knock mid-duck raises it smoothly and nothing ever snaps.
    if(s.lit>0) s.lit=Math.max(0,s.lit-dt);
    if(s.litH!==undefined&&(s.lit>0||s.litH>0.001))
      s.litH+=((s.lit>HEAD_DUCK_AT?1:0)-s.litH)*Math.min(1,dt*HEAD_EASE);
  }
  if(yayCd>0) yayCd-=dt;
  platTick(dt);                // E15: the platforms keep their little crowds
  boardTick(dt);               // ...and the walkers walk even while the train waits
  // E10: the rain's single distant rumble — long random timer, quiet. E31: the
  // jungle's soft rain NEVER rumbles (cozy drizzle, no thunder) — BUILD's
  // kid-chosen rain keeps its distant thunder byte-identically (softRain is
  // false whenever PLAY is off).
  if(activeWeather()==='rain'&&!softRain()){
    rainT-=dt;
    if(rainT<=0){ rainT=RAIN_RUMBLE[0]+Math.random()*(RAIN_RUMBLE[1]-RAIN_RUMBLE[0]); SND.rumble(); }
  }
  for(const c of TRAIN.cars) if(c.squash>0) c.squash=Math.max(0,c.squash-dt*4);
  trailTick(dt);               // E28: the grab-off fade + the sparkles' little lives — sim-clocked

  if(TRAIN.placed && TRAIN.running){
    if(TRAIN.pauseT>0){ TRAIN.pauseT-=dt; }
    else{
      const d=SPEED*gravTick(dt)*dt;   // E15: the hill modulates the ONE shared step
      const lead=TRAIN.F? TRAIN.cars[0] : TRAIN.cars[TRAIN.cars.length-1];
      const probe=clone(lead.rd), r=advance(probe,d);
      const step=r.ok? d : Math.max(0,r.moved-0.5);
      if(step>1e-4){
        const lr0=TRAIN.cars[0].rd, locoPrev=key(lr0.cx,lr0.cy)+':'+(lr0.el?1:0);
        LIVE=true; for(const c of TRAIN.cars) advance(c.rd,step); LIVE=false;
        TRAIN.dist+=step; TRAIN.goDist+=step;
        wheelPhase+=step/8;
        trailEmit(step);       // E28 THE MAGIC TRAIL — exhaust, not physics: reads poses, writes nothing back
        chugAcc+=step; if(chugAcc>52){ chugAcc=0;
          const lp=pieceOf(TRAIN.cars[0].rd);
          SND.chuff(!!lp&&lp.t==='br', !!lp&&lp.t==='tun'); }   // E7: the tunnel muffles the chuff
        // E15: the chain lift — dry clacks while the engine is working the climb.
        // Distance-based like the chuff (which already quickens downhill for free),
        // so nothing ever clacks on the flat: the byte-identical audio law.
        if(GRAV.mul<CLACK_BELOW){ clackAcc+=step; if(clackAcc>CLACK_SPACE){ clackAcc=0; SND.clack(); } }
        else clackAcc=0;
        // THE CHARM LAW: people wave, cows look up, sheep hop, chickens flap at a passing
        // train — one shared chirp gate (yayCd) so passes never stack noise. E7's cat and
        // snowman charm silently, so they neither spend nor need the gate.
        let charmed=false;
        for(const c of TRAIN.cars){
          for(let dy=-REACT_R;dy<=REACT_R;dy++) for(let dx=-REACT_R;dx<=REACT_R;dx++){
            const s=scen.get(key(c.rd.cx+dx,c.rd.cy+dy));
            if(s && SCENDEF[s.t].react && !(s.wave>0)){
              s.wave=1.3; charmed=true;
              const ch=CHIRP[s.t];
              if(ch && yayCd<=0){ yayCd=3; chirpN++; SND[ch](); }
            }
          }
        }
        // E15 THE REACTION LAW — riders respond to the layout (paint-only, ONE
        // pose timer per train): through a tunnel they duck, over a bridge they
        // look down, at a charmed scene they wave BACK at the ground people. The
        // downhill arms-up (+ SND.yay) rides the crest whoosh in gravTick.
        if(aboardN(TRAIN.cars)){
          if(charmed) poseSet('wave',1.3,1);
          let tun=false, brg=false;
          for(const c of TRAIN.cars){ if(!(c.rid>0)) continue;
            const p2=pieceOf(c.rd); if(p2){ if(p2.t==='tun') tun=true; else if(p2.t==='br') brg=true; } }
          if(tun) poseSet('duck',0.4,4);
          else if(brg) poseSet('look',0.4,2);
        }
        smokeT-=dt; if(smokeT<=0){ smokeT=0.16; stackPuff(); }
        // station: the loco crossing a platform's centre — keyed (cell, elev), so a
        // high train crossing above a ground station never dings it (the E4 audit)
        const lc=TRAIN.cars[0].rd, lpc=pieceOf(lc), lk=key(lc.cx,lc.cy)+':'+(lc.el?1:0);
        if(lpc && lpc.t==='st'){
          const mid=pathsOf(lpc)[lc.pi].len/2;
          if(Math.abs(lc.s-mid)<step+0.6 && TRAIN.stKey!==lk){
            TRAIN.stKey=lk; TRAIN.pauseT=STATION_PAUSE; SND.ding();
            boardAt(TRAIN.cars,lk);                 // E15: riders off, waiters aboard — inside the pause
            if(CAMP.on) CAMP.visited.add(lk);       // pause-visited, since GO (the E5 win check)
            // E9: a station stop pays 1★ in BUILD (the campaign pays per first clear
            // instead). Re-armed by the stKey cell-exit law — no parking-on-the-station farm.
            else { const sp=pos(lc); starMint(MINT.station,sp.x,sp.y-LIFT*(sp.z||0)); }
          }
        }
        // the diamond (E8, level 7): the loco having ridden a named cell since GO.
        // Cell-keyed like everything else the E4 audit touched — a high train passing
        // over the crossing is not the same thing as going through it.
        if(CAMP.on && !CAMP.crossed){
          const L8=LEVELS[CAMP.level-1];
          if(L8 && L8.cross && lc.cx===L8.cross[0] && lc.cy===L8.cross[1] && !lc.el) CAMP.crossed=true;
        }
        if(lk!==locoPrev){
          if(TRAIN.stKey && TRAIN.stKey!==lk) TRAIN.stKey=null;
          // a lap — the loco re-enters where GO was pressed, same heading, SAME LEVEL.
          // Free play keeps its once-per-save FIRST LAP! card; the campaign listens to the
          // very same machinery every lap and never touches the free-play flag.
          const sig=lk+':'+lc.pi+':'+lc.dir;
          if(TRAIN.startSig && sig===TRAIN.startSig && TRAIN.goDist>3*C){
            if(CAMP.on) campLap();
            else {
              // E9: every TRUE lap pays 1★ (ping-pong bounces don't — press GO to re-arm);
              // the once-per-save FIRST LAP! card rides its own +5 on top.
              if(!TRAIN.revSinceGo){ const lp2=pos(lc); starMint(MINT.lap,lp2.x,lp2.y-LIFT*(lp2.z||0)); }
              if(!lapDone){ lapDone=true; firstLap(); }
            }
          }
        }
      }
      if(!r.ok) reverseTrain();
    }
  }
  // pass-latch upkeep: a latch lives while any car BODY overlaps the splitter cell.
  // Body = rider centre probed ±30px along its own path — this bridges the tiny
  // between-cars gap on the short curve branch (no mid-consist lever flip can tear
  // the train) yet releases the points the moment the train is truly clear.
  let hasLatch=false;
  for(const pc of grid.values()) if(pc.latch){ hasLatch=true; break; }
  if(!hasLatch) for(const pc of hgrid.values()) if(pc.latch){ hasLatch=true; break; }
  if(hasLatch){
    const occ=new Set();
    if(TRAIN.placed) for(const c of TRAIN.cars){
      occ.add(key(c.rd.cx,c.rd.cy)+':'+(c.rd.el?1:0));
      const f=clone(c.rd); if(advance(f,30).moved>0) occ.add(key(f.cx,f.cy)+':'+(f.el?1:0));
      const b=clone(c.rd); if(back(b,30).moved>0) occ.add(key(b.cx,b.cy)+':'+(b.el?1:0));
    }
    for(const [k,pc] of grid) if(pc.latch && !occ.has(k+':0')) pc.latch=null;
    for(const [k,pc] of hgrid) if(pc.latch && !occ.has(k+':1')) pc.latch=null;
  }
  trackSideWatch();
  for(const s of smoke){ s.t+=dt; s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy-=8*dt; }
  smoke=smoke.filter(s=>s.t<s.dur);
  for(const e of fx) e.t+=dt;
  fx=fx.filter(e=>e.t<e.dur);
  for(const p of confetti){ p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=260*dt; p.rot+=p.vr*dt; }
  confetti=confetti.filter(p=>p.t<p.dur);
  for(const f of flights) f.t+=dt;
  flights=flights.filter(f=>f.t<f.dur);
  if(lapCardT>0) lapCardT-=dt;
  if(goalT>0) goalT-=dt;
  if(winT>0){ winT-=dt; if(winT<0) winT=0;
    if(!winT&&prettyPend){ prettyPend=false; prettyT=PRETTY_T; SND.ding(); } }   // E14: the compliment follows the win card out
  if(prettyT>0){ prettyT-=dt; if(prettyT<0) prettyT=0; }
  if(CAMP.on) toyTick(dt);
}
// E7 — trackside furniture watches the trains go by, keyed (cell, elev) like everything:
// a WHISTLE POST toots once when a loco enters its patch and re-arms on exit (the
// station's stKey law); a SIGNAL shows red while any car is passing, green after.
function trackSideWatch(){
  let has=false;
  for(const s of scen.values()) if(s.t==='whis'||s.t==='sig'){ has=true; break; }
  if(!has) return;
  const locos=[], cars=[];
  if(PLAY.on){
    for(const tr of PLAY.trains){ if(tr.dying) continue;
      locos.push(tr.cars[0].rd); for(const c of tr.cars) cars.push(c.rd); }
  } else if(TRAIN.placed){
    if(TRAIN.running) locos.push(TRAIN.cars[0].rd);
    for(const c of TRAIN.cars) cars.push(c.rd);
  }
  const near=(list,px,py)=>{
    for(const rd of list) if(!(rd.el|0) && Math.abs(rd.cx-px)<=1 && Math.abs(rd.cy-py)<=1) return true;
    return false;
  };
  for(const [k,s] of scen){
    if(s.t!=='whis'&&s.t!=='sig') continue;
    const [px,py]=k.split(',').map(Number);
    if(s.t==='whis'){
      if(near(locos,px,py)){ if(!s.arm){ s.arm=1; s.ra={k:1}; SND.toot(); } }
      else s.arm=0;
    } else s.red=near(cars,px,py)?1:0;
  }
}
function puffLoco(loco,mul){             // one stack puff from any loco (E6: play trains puff too)
  const tp=pieceOf(loco.rd);
  if(tp&&tp.t==='tun') return;           // E7: the smoke holds its breath inside the mountain
  const p=pos(loco.rd);
  const artAng=p.ang+(loco.face<0?Math.PI:0);
  const flip=Math.cos(artAng)<0;
  const lx=18*KART, ly=(flip?28:-28)*KART;
  const ca=Math.cos(artAng), sa=Math.sin(artAng);
  const s={ x:p.x+ca*lx-sa*ly, y:p.y+sa*lx+ca*ly-LIFT*(p.z||0), t:0, dur:1.1,
            vx:(Math.random()-0.5)*14, vy:-34, r:3+Math.random()*2 };
  const w=smokeW(mul);                   // E38: the hill writes the exhaust (flat = exactly 0)
  if(w) smokeDress(s,w);
  smoke.push(s);
}
function stackPuff(){
  if(!TRAIN.placed||!TRAIN.cars.length) return;
  puffLoco(TRAIN.cars[0]);
}
/* =====================================================================
   THE WHISTLE YOU CAN SEE (E38, NEMO frame 01) — the loco tap already
   whistles; now the whistle is VISIBLE: one wide white burst venting
   SIDEWAYS from the boiler the same instant. Gated on the TAP BRANCHES,
   NEVER on SND.whistle (nine call sites — hook the sound and every
   ceremony in the game vents). Particles ride the existing smoke pool:
   existing tick, existing painters, zero new systems.
   TWO COLOURS OF SMOKE (frame 04) — the hill writes the exhaust: each
   puff stamps colour/weight at spawn from the gravity mul. Flat track
   holds mul EXACTLY 1.0 (the E15 float law) ⇒ w exactly 0 ⇒ nothing
   stamped ⇒ byte-identical — the physics gates itself.
   ===================================================================== */
function smokeW(mul){                  // effort → colour weight; 0 = untouched puff
  if(BED.ctx) return 0;                              // the room's toy stays storybook-grey
  if(PLAY.on&&!SMOKE_PLAY) return 0;                 // THE GUARD (the study's) — SMOKE_PLAY relaxes
  const w=SMOKE_RAMP_K*(1-(mul!=null?mul:GRAV.mul));
  if(Math.abs(w)<SMOKE_W_EPS) return 0;              // post-hill float dust never stamps (the byte law stays strict)
  return Math.max(SMOKE_W_MIN,Math.min(SMOKE_W_MAX,w));
}
function smokeDress(s,w){              // stamps c/a/r — absent at w 0 (the byte law)
  const g=Math.round(187+((w>0?SMOKE_HARD:SMOKE_SOFT)-187)*Math.abs(w));
  s.c='rgb('+g+','+g+','+g+')';
  s.a=0.4+(w>0?0.22:0.14)*w;
  s.r=Math.max(2,s.r+(w>0?1.8:1.2)*w);
}
function whistleBurst(loco){
  const tp=pieceOf(loco.rd);
  if(tp&&tp.t==='tun') return;         // the burst holds its breath too (puffLoco's law)
  const p=pos(loco.rd);
  const artAng=p.ang+(loco.face<0?Math.PI:0);
  const flip=Math.cos(artAng)<0;
  const ca=Math.cos(artAng), sa=Math.sin(artAng);
  const by=(flip?WHISTLE_PUFF.ly:-WHISTLE_PUFF.ly)*KART;   // boiler height (the stack sits ±28)
  for(let i=0;i<WHISTLE_PUFF.n;i++){
    const side=i%2?1:-1;                                    // vents BOTH ways = wide
    const lx=(6+side*(4+Math.random()*WHISTLE_PUFF.spread))*KART;
    const sp=WHISTLE_PUFF.sp*(0.55+Math.random()*0.45)*side;
    smoke.push({ x:p.x+ca*lx-sa*by, y:p.y+sa*lx+ca*by-LIFT*(p.z||0),
                 t:0, dur:WHISTLE_PUFF.dur*(0.8+Math.random()*0.4),
                 vx:ca*sp, vy:sa*sp-WHISTLE_PUFF.up*(0.5+Math.random()*0.8),
                 r:WHISTLE_PUFF.r+Math.random()*WHISTLE_PUFF.rj,
                 c:'#fff', a:WHISTLE_PUFF.a });
  }
}
const whistleVent=()=>{ if(TRAIN.placed&&TRAIN.cars.length) whistleBurst(TRAIN.cars[0]); };
function puff(x,y,R){ fx.push({k:'puff',x,y,R,t:0,dur:0.4}); }
function confettiBurst(n){
  for(let i=0;i<n;i++) confetti.push({
    x:Math.random()*W, y:-14-Math.random()*90,
    vx:(Math.random()-0.5)*70, vy:60+Math.random()*130, vr:(Math.random()-0.5)*9,
    rot:Math.random()*TAU, t:0, dur:2.4+Math.random(),
    col:['#F2C531','#C0392B','#4E7F46','#F7E9C4','#7CA7D8'][Math.floor(Math.random()*5)] });
}
function firstLap(){
  lapCardT=2.8; SND.bugle(); SND.whistle();
  voiceAt('firstLap');   // E12: the single proudest moment in free play — "You did it"
  confettiBurst(90);
  // E9: the gold card pays +5★, riding the celebration that already exists — once per save
  const p=TRAIN.placed? pos(TRAIN.cars[0].rd) : {x:GX+GW*C/2,y:GY+GH*C/2,z:0};
  starMint(MINT.firstLap,p.x,p.y-LIFT*(p.z||0));
  save();
}

/* =====================================================================
   THE NAME PLATE (E15) — it's YOURS now. A wooden sign on the BUILD
   rug's top frame (the frame is OUTSIDE the grid: no cell, blocks
   nothing, needs no audit). Naming = the word bank, NEVER a keyboard —
   no text input element exists anywhere in this game. The name shows
   up where pride lives: the sign and the FIRST LAP card (E16 note: the
   shed header wore it too, until the shed retired).
   Save v:9 carries it; BUILD only — campaign and PLAY never show a
   sign. Paint = the E5/E3 wooden board recipe.
   ===================================================================== */
let NAME=null;                 // {w1,w2,s} straight off the word bank — save v:9; null = MY RAILROAD
const signText=()=>NAME? 'THE '+NAME.w1+' '+NAME.w2+' '+NAME.s : 'MY RAILROAD';
let SIGN_RECT=null;            // world-px rect of the painted sign — the tap target
function drawNameSign(){
  // ⚠ save/restore is LAW here — leak no state into the world's painters.
  // ⚠ THE PROOF LAW (E15): ANY extra op in a shared frame shifts hairline AA
  // batching elsewhere in that frame (Skia), so migration byte-proofs run with
  // THIS painter suppressed (drawNameSign=()=>{}) and the chip hidden; the real
  // frame is then proven to a ≤hairline tolerance. Menu/campaign frames carry
  // no sign and stay raw byte-identical.
  cx.save();
  const txt=signText();
  let f=19; cx.font='bold '+f+'px "Arial Black",Impact,sans-serif';
  const w=Math.min(Math.max(cx.measureText(txt).width+64,240),WORLD_W-220), h=38, x=(WORLD_W-w)/2, y=6;
  cx.fillStyle='#8f6b3f'; rr(x,y,w,h,8); cx.fill();
  cx.strokeStyle='#6e5130'; cx.lineWidth=3; rr(x,y,w,h,8); cx.stroke();
  cx.fillStyle='#a37c4a'; rr(x+5,y+5,w-10,h-10,5); cx.fill();
  cx.fillStyle='#F2C531';      // two gold tacks — it's a plaque, tap it
  cx.beginPath(); cx.arc(x+14,y+h/2,2.6,0,7); cx.fill();
  cx.beginPath(); cx.arc(x+w-14,y+h/2,2.6,0,7); cx.fill();
  cx.fillStyle='#F7E9C4'; cx.textAlign='center';
  const mw=cx.measureText(txt).width;
  if(mw>w-56){ f=Math.max(10,Math.floor(f*(w-56)/mw)); cx.font='bold '+f+'px "Arial Black",Impact,sans-serif'; }
  cx.fillText(txt, x+w/2, y+h/2+f*0.36);
  cx.restore();
  SIGN_RECT={x,y,w,h};
}
// ---- the word-bank picker (DOM, the gold-card recipe — see #namer) ----
const NM={w1:0,w2:0,si:0};
function nmSync(){
  document.querySelectorAll('#nmc1 .nmw').forEach((b,i)=>b.classList.toggle('on',i===NM.w1));
  document.querySelectorAll('#nmc2 .nmw').forEach((b,i)=>b.classList.toggle('on',i===NM.w2));
  $('nmsfx').textContent='🔁 '+NAME_SUFFIX[NM.si];
  $('nmprev').textContent='THE '+NAME_WORDS[0][NM.w1]+' '+NAME_WORDS[1][NM.w2]+' '+NAME_SUFFIX[NM.si];
}
function namerShow(b){
  const el=$('namer'); if(!el) return;
  el.style.display=b?'flex':'none';
  if(b){
    NM.w1=NAME? Math.max(0,NAME_WORDS[0].indexOf(NAME.w1)) : 0;
    NM.w2=NAME? Math.max(0,NAME_WORDS[1].indexOf(NAME.w2)) : 0;
    NM.si=NAME? Math.max(0,NAME_SUFFIX.indexOf(NAME.s)) : 0;
    nmSync();
  }
}
function nameApply(w1,w2,sfx){ // the ONE writer — the rig and the DONE button both use it
  if(w1==null){ NAME=null; save(); return signText(); }
  if(!NAME_WORDS[0].includes(w1)||!NAME_WORDS[1].includes(w2)||!NAME_SUFFIX.includes(sfx)) return false;
  NAME={w1,w2,s:sfx};
  save();
  return signText();
}
function buildNamer(){
  const mkw=(wrap,col,pick)=>{
    NAME_WORDS[col].forEach((w,i)=>{
      const b=document.createElement('button'); b.className='nmw'; b.type='button'; b.textContent=w;
      b.addEventListener('click',()=>{ ac(); SND.tok(); pick(i); nmSync(); });
      wrap.appendChild(b);
    });
  };
  mkw($('nmc1'),0,i=>NM.w1=i);
  mkw($('nmc2'),1,i=>NM.w2=i);
  $('nmsfx').addEventListener('click',()=>{ ac(); SND.click(); NM.si=(NM.si+1)%NAME_SUFFIX.length; nmSync(); });
  $('nmdone').addEventListener('click',()=>{
    ac();
    nameApply(NAME_WORDS[0][NM.w1],NAME_WORDS[1][NM.w2],NAME_SUFFIX[NM.si]);
    SND.ding(); namerShow(false);
  });
  $('nmback').addEventListener('click',()=>{ ac(); SND.click(); namerShow(false); });
}

/* =====================================================================
   PAINT — the GVT recipes
   ===================================================================== */
function rr(x,y,w,h,r){
  cx.beginPath();
  cx.moveTo(x+r,y); cx.lineTo(x+w-r,y); cx.quadraticCurveTo(x+w,y,x+w,y+r);
  cx.lineTo(x+w,y+h-r); cx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  cx.lineTo(x+r,y+h); cx.quadraticCurveTo(x,y+h,x,y+h-r);
  cx.lineTo(x,y+r); cx.quadraticCurveTo(x,y,x+r,y); cx.closePath();
}
// the GVT bedroom rug, verbatim recipe (v1.47 crimson). E10: THREE LANDS —
// the GVT stage law, lifted whole: THE SNOW (and the sand) LIES ON THE RUG.
// The carpet frame stays, the stage field fills inside it, wind combing over
// the top — sand #8B3E1E/#7A3318 and snow #E9EEF4/#D7E1EC are GVT's own
// measured hexes. Land is PAINT ONLY: zero effect on placement or physics.
function drawRug(){
  const land=activeLand();
  cx.fillStyle='#63251C'; cx.fillRect(0,0,WORLD_W,WORLD_H);
  cx.strokeStyle='#4A1A12'; cx.lineWidth=56; cx.strokeRect(0,0,WORLD_W,WORLD_H);
  cx.strokeStyle='#8F4634'; cx.lineWidth=7; cx.strokeRect(42,42,WORLD_W-84,WORLD_H-84);
  if(land==='west'){ drawLandField('#8B3E1E','#7A3318',0.5); return; }
  if(land==='snow'){ drawLandField('#E9EEF4','#D7E1EC',0.75); return; }
  if(land==='mountain'){ drawLandField('#7C9A55','#6C8A49',0.55); return; }   // E30: the alpine meadow
  if(land==='jungle'){ drawLandField('#456F36','#3A6130',0.55); return; }     // E31: the jungle floor — deep, cozy, never dark
  cx.globalAlpha=0.5; cx.fillStyle='#4A1A12';
  [[112,112],[WORLD_W-112,112],[112,WORLD_H-112],[WORLD_W-112,WORLD_H-112]]
    .forEach(p=>{ cx.beginPath(); cx.arc(p[0],p[1],13,0,7); cx.fill(); });
  cx.globalAlpha=0.35; cx.strokeStyle='#7A3627'; cx.lineWidth=2;
  for(let y=90;y<WORLD_H-60;y+=56){ cx.beginPath(); cx.moveTo(30,y); cx.lineTo(WORLD_W-30,y); cx.stroke(); }
  cx.globalAlpha=1;
}
function drawLandField(field,comb,a){
  cx.fillStyle=field; cx.fillRect(56,56,WORLD_W-112,WORLD_H-112);
  cx.globalAlpha=a; cx.strokeStyle=comb; cx.lineWidth=3;     // the GVT wind combing
  for(let y=96;y<WORLD_H-70;y+=48){
    cx.beginPath(); cx.moveTo(60,y);
    for(let x=60;x<WORLD_W-60;x+=60) cx.quadraticCurveTo(x+30,y+((x/60)%2?5:-5),x+60,y);
    cx.stroke();
  }
  cx.globalAlpha=1;
  drawLandDecor();
}
/* =====================================================================
   GROUND DECORATIONS (E10) — seeded ONCE per (land, size, seed), the
   GVT snowFlakes discipline: never inside a draw call. They paint with
   the ground, UNDER every piece, train and ghost, and they block
   nothing: a cactus is the land talking, not a toy in the way.
   Mesa / cactus / drift / clod / ice painters are GVT's shipped
   recipes, lifted hex-for-hex from the blob.
   ===================================================================== */
let LDEC={key:null,items:[]};
function landDecor(){
  const land=activeLand(), k2=land+':'+GW+'x'+GH;
  if(LDEC.key===k2) return LDEC.items;
  let s=LAND_SEED; const rnd=()=>{ s=(s*9301+49297)%233280; return s/233280; };
  const items=[], cells=GW*GH;
  const fx0=80, fx1=WORLD_W-80, fy0=86, fy1=WORLD_H-86;
  if(land==='west'){
    const nM=Math.max(2,Math.round(cells/MESA_CELLS));       // a couple of low mesas on the far edge
    for(let i=0;i<nM;i++){
      const r=34+rnd()*14;                                   // the whole butte sits INSIDE the field
      items.push({t:'mesa', x:fx0+120+(fx1-fx0-240)*(nM===1?0.5:i/(nM-1))+ (rnd()-0.5)*90,
                  y:66+r*1.3+rnd()*22, r});
    }
    const nC=Math.round(cells*CACTI_PER_100/100);
    for(let i=0;i<nC;i++) items.push({t:'cactus', x:fx0+rnd()*(fx1-fx0), y:fy0+rnd()*(fy1-fy0), r:11+rnd()*3});
    const nB=Math.round(cells*BRUSH_PER_100/100);
    for(let i=0;i<nB;i++) items.push({t:'brush', x:fx0+rnd()*(fx1-fx0), y:fy0+rnd()*(fy1-fy0), r:6+rnd()*4});
  } else if(land==='snow'){
    const nD=Math.max(3,Math.round(cells/DRIFT_CELLS));      // deep-snow drifts along the edges
    for(let i=0;i<nD;i++){
      const side=i%4, rx=60+rnd()*45, ry=28+rnd()*26;
      let x,y;
      if(side===0){ x=fx0+rnd()*(fx1-fx0); y=fy0+ry*0.5+rnd()*30; }
      else if(side===1){ x=fx0+rnd()*(fx1-fx0); y=fy1-ry*0.5-rnd()*30; }
      else if(side===2){ x=fx0+rx*0.4+rnd()*40; y=fy0+rnd()*(fy1-fy0); }
      else { x=fx1-rx*0.4-rnd()*40; y=fy0+rnd()*(fy1-fy0); }
      items.push({t:'drift',x,y,rx,ry});
    }
    const nK=Math.round(cells*CLOD_PER_100/100);
    for(let i=0;i<nK;i++) items.push({t:'clod', x:fx0+rnd()*(fx1-fx0), y:fy0+rnd()*(fy1-fy0), r:9+rnd()*6});
    const nI=cells>300?2:1;                                  // the frozen-pond sheen
    for(let i=0;i<nI;i++) items.push({t:'ice', x:fx0+120+rnd()*(fx1-fx0-240), y:fy0+80+rnd()*(fy1-fy0-160),
                                      rx:70+rnd()*30, ry:40+rnd()*20});
  } else if(land==='mountain'){
    // E30 — snowcapped PEAKS on the horizon (the mesa placement law: big, far
    // edge, whole silhouette inside the field), granite crags + meadow-flower
    // dots scattered light, so the middle stays a calm canvas for the kid's line.
    const nP=Math.max(2,Math.round(cells/PEAK_CELLS));
    for(let i=0;i<nP;i++){
      const r=38+rnd()*16;
      items.push({t:'peak', x:fx0+110+(fx1-fx0-220)*(nP===1?0.5:i/(nP-1))+(rnd()-0.5)*80,
                  y:66+r*1.55+rnd()*14, r});
    }
    const nG=Math.round(cells*CRAG_PER_100/100);
    for(let i=0;i<nG;i++) items.push({t:'crag', x:fx0+rnd()*(fx1-fx0), y:fy0+rnd()*(fy1-fy0), r:9+rnd()*7});
    const nF=Math.round(cells*MFLW_PER_100/100);
    for(let i=0;i<nF;i++) items.push({t:'mflw', x:fx0+rnd()*(fx1-fx0), y:fy0+rnd()*(fy1-fy0), r:3+rnd()*2.5, v:i%3});
  } else if(land==='jungle'){
    // E31 — sun-dapple pools FIRST (the canopy light on the floor, under every
    // other decoration), giant FRONDS reaching in from the rug edges (the drift
    // edge-placement law — "giant leaves at the rug edges" on every jungle rug
    // at every size), mossy round stones, orchid dots scattered light. The
    // middle stays a calm canvas for the kid's own line.
    const nD=Math.round(cells*DAPL_PER_100/100);
    for(let i=0;i<nD;i++) items.push({t:'dapl', x:fx0+rnd()*(fx1-fx0), y:fy0+rnd()*(fy1-fy0), rx:26+rnd()*30});
    const nF=Math.max(3,Math.round(cells/FROND_CELLS));
    for(let i=0;i<nF;i++){
      const side=i%4; let x,y,a;
      if(side===0){ x=fx0+rnd()*(fx1-fx0); y=fy0+6+rnd()*14; a=Math.PI; }
      else if(side===1){ x=fx0+rnd()*(fx1-fx0); y=fy1-6-rnd()*14; a=0; }
      else if(side===2){ x=fx0+6+rnd()*14; y=fy0+rnd()*(fy1-fy0); a=Math.PI/2; }
      else { x=fx1-6-rnd()*14; y=fy0+rnd()*(fy1-fy0); a=-Math.PI/2; }
      items.push({t:'frond', x, y, r:30+rnd()*16, a:a+(rnd()-0.5)*0.5, v:i%2});
    }
    const nM=Math.round(cells*MOSS_PER_100/100);
    for(let i=0;i<nM;i++) items.push({t:'moss', x:fx0+rnd()*(fx1-fx0), y:fy0+rnd()*(fy1-fy0), r:8+rnd()*6});
    const nO=Math.round(cells*ORCH_PER_100/100);
    for(let i=0;i<nO;i++) items.push({t:'orch', x:fx0+rnd()*(fx1-fx0), y:fy0+rnd()*(fy1-fy0), r:3+rnd()*2, v:i%3});
  }
  LDEC={key:k2,items};
  return items;
}
function drawLandDecor(){
  for(const it of landDecor()){
    if(it.t==='mesa') drawMesa(it);
    else if(it.t==='cactus') drawCactusDec(it);
    else if(it.t==='brush') drawBrush(it);
    else if(it.t==='drift') drawDeepDrift(it);
    else if(it.t==='clod') drawSnowClod(it);
    else if(it.t==='ice') drawIceSheet(it);
    else if(it.t==='peak') drawPeakDec(it);
    else if(it.t==='crag') drawCragDec(it);
    else if(it.t==='mflw') drawMFlwDec(it);
    else if(it.t==='dapl') drawDaplDec(it);
    else if(it.t==='frond') drawFrondDec(it);
    else if(it.t==='moss') drawMossDec(it);
    else if(it.t==='orch') drawOrchDec(it);
  }
}
// A flat-topped butte in toy plastic: stacked bands, a cream caprock, its own
// long shadow (GVT WESTERN LAND recipe).
function drawMesa(rk){
  const r=rk.r;
  cx.fillStyle='rgba(60,26,10,0.25)';
  cx.beginPath(); cx.ellipse(rk.x+r*0.22,rk.y+r*0.62,r*1.12,r*0.42,0,0,7); cx.fill();
  cx.fillStyle='#A64B28'; cx.beginPath(); cx.ellipse(rk.x,rk.y+r*0.28,r,r*0.5,0,0,7); cx.fill();
  cx.fillStyle='#B4552E'; rr(rk.x-r*0.86,rk.y-r*0.62,r*1.72,r*0.95,r*0.2); cx.fill();
  cx.fillStyle='#C9713C'; rr(rk.x-r*0.78,rk.y-r*1.02,r*1.56,r*0.5,r*0.16); cx.fill();
  cx.fillStyle='#DB8B4C'; cx.beginPath(); cx.ellipse(rk.x,rk.y-r*1.02,r*0.8,r*0.26,0,0,7); cx.fill();
  cx.strokeStyle='rgba(90,38,16,0.5)'; cx.lineWidth=2;
  cx.beginPath(); cx.moveTo(rk.x-r*0.6,rk.y-r*0.28); cx.lineTo(rk.x-r*0.6,rk.y+r*0.2);
  cx.moveTo(rk.x+r*0.34,rk.y-r*0.44); cx.lineTo(rk.x+r*0.34,rk.y+r*0.24); cx.stroke();
}
// A saguaro off the toy shelf: trunk, two arms, moulding ridges (GVT recipe).
function drawCactusDec(rk){
  const r=rk.r;
  cx.fillStyle='rgba(60,26,10,0.25)';
  cx.beginPath(); cx.ellipse(rk.x+2,rk.y+r*0.5,r*1.1,r*0.4,0,0,7); cx.fill();
  cx.strokeStyle='#4E7F46'; cx.lineCap='round';
  cx.lineWidth=r*0.85;
  cx.beginPath(); cx.moveTo(rk.x,rk.y+r*0.4); cx.lineTo(rk.x,rk.y-r*1.7); cx.stroke();
  cx.lineWidth=r*0.6;
  cx.beginPath(); cx.moveTo(rk.x-r*0.75,rk.y-r*0.2); cx.lineTo(rk.x-r*0.75,rk.y-r*1.05); cx.stroke();
  cx.beginPath(); cx.moveTo(rk.x+r*0.75,rk.y+r*0.1); cx.lineTo(rk.x+r*0.75,rk.y-r*0.75); cx.stroke();
  cx.strokeStyle='rgba(34,64,30,0.6)'; cx.lineWidth=1.2;
  cx.beginPath(); cx.moveTo(rk.x-r*0.14,rk.y+r*0.2); cx.lineTo(rk.x-r*0.14,rk.y-r*1.5);
  cx.moveTo(rk.x+r*0.14,rk.y+r*0.2); cx.lineTo(rk.x+r*0.14,rk.y-r*1.5); cx.stroke();
  cx.lineCap='butt';
}
// dry brush: a fan of little dead-grass arcs, molded-plastic weight
function drawBrush(b){
  cx.globalAlpha=0.9; cx.lineCap='round';
  cx.strokeStyle='#8F6B1E'; cx.lineWidth=2.2;
  cx.beginPath();
  for(let i=-2;i<=2;i++){
    cx.moveTo(b.x,b.y);
    cx.quadraticCurveTo(b.x+i*b.r*0.5,b.y-b.r*1.2,b.x+i*b.r*0.8,b.y-b.r*(1.5+((i&1)?0.3:0)));
  }
  cx.stroke();
  cx.strokeStyle='#B08427'; cx.lineWidth=1.6;
  cx.beginPath(); cx.moveTo(b.x,b.y); cx.quadraticCurveTo(b.x-1,b.y-b.r,b.x+1,b.y-b.r*1.7);
  cx.moveTo(b.x,b.y); cx.quadraticCurveTo(b.x+3,b.y-b.r*0.8,b.x+b.r*0.5,b.y-b.r*1.35); cx.stroke();
  cx.globalAlpha=1; cx.lineCap='butt';
}
// DEEP SNOW: a feathered edge and wind scallops combed across it (GVT recipe —
// deliberately NOT concentric rings; rings read as water).
function drawDeepDrift(d){
  cx.globalAlpha=0.35; cx.fillStyle='#B4C8DE';
  cx.beginPath(); cx.ellipse(d.x,d.y,d.rx+7,d.ry+6,0,0,7); cx.fill(); cx.globalAlpha=1;
  cx.fillStyle='#D6E2F0'; cx.beginPath(); cx.ellipse(d.x,d.y,d.rx,d.ry,0,0,7); cx.fill();
  cx.strokeStyle='#B4C8DE'; cx.lineWidth=2.4; cx.stroke();
  cx.globalAlpha=0.75; cx.lineWidth=2;
  for(let k=-2;k<=2;k++){
    const yy=d.y+k*d.ry*0.34, w=d.rx*Math.sqrt(Math.max(0.08,1-(k*0.34)*(k*0.34)))*0.82;
    cx.beginPath(); cx.moveTo(d.x-w,yy);
    cx.quadraticCurveTo(d.x-w*0.5,yy-7,d.x,yy);
    cx.quadraticCurveTo(d.x+w*0.5,yy+7,d.x+w,yy); cx.stroke();
  }
  cx.globalAlpha=1; cx.fillStyle='#FFFFFF';
  cx.beginPath(); cx.arc(d.x-d.rx*0.42,d.y+d.ry*0.4,1.9,0,7); cx.fill();
  cx.beginPath(); cx.arc(d.x+d.rx*0.48,d.y-d.ry*0.34,1.6,0,7); cx.fill();
}
function drawSnowClod(rk){
  cx.fillStyle='rgba(60,74,92,0.22)'; cx.beginPath(); cx.arc(rk.x+2,rk.y+4,rk.r,0,7); cx.fill();
  cx.fillStyle='#F9FCFF'; cx.beginPath(); cx.arc(rk.x,rk.y,rk.r,0,7); cx.fill();
  cx.strokeStyle='#8C9AAD'; cx.lineWidth=2; cx.stroke();
}
// the village set's mirror tile — the frozen-pond sheen (GVT ice recipe)
function drawIceSheet(i){
  cx.fillStyle='#BFD9E8'; cx.beginPath(); cx.ellipse(i.x,i.y,i.rx,i.ry,0,0,7); cx.fill();
  cx.save(); cx.beginPath(); cx.ellipse(i.x,i.y,i.rx,i.ry,0,0,7); cx.clip();
  cx.strokeStyle='#8FBFDA'; cx.lineWidth=2.6; cx.lineCap='round';
  cx.beginPath(); cx.moveTo(i.x-i.rx*0.8,i.y-i.ry*0.2); cx.lineTo(i.x-i.rx*0.1,i.y+i.ry*0.45);
  cx.lineTo(i.x+i.rx*0.55,i.y-i.ry*0.3); cx.lineTo(i.x+i.rx*0.85,i.y+i.ry*0.1); cx.stroke();
  cx.globalAlpha=0.75; cx.lineWidth=1.8;
  cx.beginPath(); cx.moveTo(i.x-i.rx*0.45,i.y+i.ry*0.7); cx.lineTo(i.x+i.rx*0.2,i.y-i.ry*0.6); cx.stroke();
  cx.globalAlpha=0.8; cx.fillStyle='#FFFFFF';
  cx.beginPath(); cx.ellipse(i.x-i.rx*0.36,i.y-i.ry*0.42,i.rx*0.3,i.ry*0.2,0,0,7); cx.fill();
  cx.globalAlpha=1; cx.restore();
  cx.strokeStyle='#6E93AC'; cx.lineWidth=2.4; cx.lineCap='butt';
  cx.beginPath(); cx.ellipse(i.x,i.y,i.rx,i.ry,0,0,7); cx.stroke();
}
// E30 THE MOUNTAIN — the molded-toy alpine set. A peak is granite in two facets
// with a snow cap and a treeline of tiny pines at its feet: the horizon, not a wall.
function drawPeakDec(pk){
  const r=pk.r, ax=pk.x, ay=pk.y-r*1.55;
  cx.fillStyle='rgba(40,52,34,0.22)';
  cx.beginPath(); cx.ellipse(pk.x+r*0.18,pk.y+3,r*1.15,r*0.22,0,0,7); cx.fill();
  cx.fillStyle='#8C9096';                     // the sunny face
  cx.beginPath(); cx.moveTo(pk.x-r*1.1,pk.y); cx.lineTo(ax,ay); cx.lineTo(pk.x+r*0.16,pk.y); cx.closePath(); cx.fill();
  cx.fillStyle='#787D85';                     // the shaded face
  cx.beginPath(); cx.moveTo(pk.x+r*0.16,pk.y); cx.lineTo(ax,ay); cx.lineTo(pk.x+r*1.1,pk.y); cx.closePath(); cx.fill();

/* =====================================================================
   THE WEATHER (E10) — paint only, NEVER physics. Nothing in this game
   ever slows down, slips or fails. Particles are seeded ONCE per
   (weather, size) — snowFlakes lifted verbatim from the GVT blob, same
   LCG, same field ranges — and every frame is a PURE FUNCTION of the
   clock off that seed: no per-frame state, nothing to drift. Counts are
   CAPPED by rug area so xl + snow still holds 60fps on a phone.
   ===================================================================== */
let WXP={key:null,flakes:[],motes:[],drops:[],rings:[]};
let rainT=0;                 // the one distant rumble, on a long random timer
function weatherSeed(){
  // E31: soft rain (the jungle's hush) seeds FEWER drops and must never share a
  // particle set with full rain on the same dims — the key carries the gate.
  const w=activeWeather(), k2=w+(softRain()?'!s':'')+':'+GW+'x'+GH;
  if(WXP.key===k2) return;
  let s=20260725; const rnd=()=>{ s=(s*9301+49297)%233280; return s/233280; };   // the GVT snowFlakes seed
  WXP={key:k2,flakes:[],motes:[],drops:[],rings:[]};
  const cells=GW*GH;
  if(w==='snowfall'){
    const n=Math.min(FLAKE_MAX,Math.round(cells*FLAKE_PER_CELL));
    for(let i=0;i<n;i++) WXP.flakes.push({ x:70+rnd()*(WORLD_W-140), y:60+rnd()*(WORLD_H-120),
      r:0.9+rnd()*1.5, v:(9+rnd()*16)*FLAKE_FALL, s:0.7+rnd()*1.1, p:rnd()*6.283 });
  } else if(w==='dust'){
    const n=Math.min(DUST_MAX,Math.round(cells*DUST_PER_CELL));
    for(let i=0;i<n;i++) WXP.motes.push({ x:rnd()*WORLD_W, y:66+rnd()*(WORLD_H-132),
      r:1.3+rnd()*2.1, v:14+rnd()*22, a:0.16+rnd()*0.18, s:0.5+rnd()*0.9, p:rnd()*6.283 });
  } else if(w==='rain'){
    const n=Math.min(RAIN_MAX,Math.round(cells*RAIN_PER_CELL*(softRain()?JRAIN_K:1)));
    for(let i=0;i<n;i++) WXP.drops.push({ x:rnd()*WORLD_W, y:rnd()*WORLD_H,
      l:9+rnd()*8, v:520+rnd()*260, p:rnd()*6.283 });
    const nr=Math.max(6,Math.round(n/14));
    for(let i=0;i<nr;i++) WXP.rings.push({ x:80+rnd()*(WORLD_W-160), y:80+rnd()*(WORLD_H-160),
      T:1.1+rnd()*1.6, p:rnd()*3 });
  }
}
function drawWeather(){
  const w=activeWeather(); if(w==='clear') return;
  weatherSeed();
  const t=perf(), calm=RM();
  // GVT authored its particles for a 1:1 view; under the camera they keep their
  // WORLD positions (the rug-span seeding law) but draw at k× so they hold their
  // designed SCREEN size at any zoom — at 1× k=1 and the recipe is verbatim.
  const k9=Math.max(1,1/SC);
  if(w==='snowfall'){
    // GVT drawSnowFall, lifted: every flake carries its cool shadow (the
    // white-on-white law), and the size/speed spread IS the gentle parallax —
    // big flakes fall fast up front, small ones drift slow behind.
    const F=WXP.flakes, n=calm? (F.length*0.4)|0 : F.length, top=56, bot=WORLD_H-56, span=bot-top;
    const vs=WORLD_H/MENU_H;                     // a taller rug falls proportionally faster
    for(let i=0;i<n;i++){
      const f=F[i];
      const y=calm? f.y : top+(((f.y-top)+t*f.v*vs)%span);
      const x=calm? f.x : f.x+Math.sin(t*f.s+f.p)*7;
      cx.fillStyle='rgba(110,132,158,0.34)';
      cx.beginPath(); cx.arc(x,y+1.2*k9,(f.r+0.6)*k9,0,7); cx.fill();
      cx.fillStyle='#FFFFFF';
      cx.beginPath(); cx.arc(x,y,f.r*k9,0,7); cx.fill();
    }
  } else if(w==='dust'){
    // slow warm motes riding east + a faint heat shimmer along the horizon
    const M=WXP.motes, n=calm? (M.length*0.4)|0 : M.length;
    for(let i=0;i<n;i++){
      const m=M[i];
      const x=calm? m.x : (m.x+t*m.v)%WORLD_W;
      const y=m.y+Math.sin(t*m.s+m.p)*9;
      cx.globalAlpha=m.a*(0.7+0.3*Math.sin(t*m.s*1.7+m.p));
      cx.fillStyle='#F2C584';
      cx.beginPath(); cx.arc(x,y,m.r*k9,0,7); cx.fill();
    }
    cx.globalAlpha=calm?0.05:0.05+0.02*Math.sin(t*1.3);
    cx.strokeStyle='#FFE9C0'; cx.lineWidth=5*k9;
    for(let k of [0,1,2]){
      const y=74+k*16*k9;
      cx.beginPath(); cx.moveTo(60,y);
      for(let x=60;x<WORLD_W-60;x+=48) cx.quadraticCurveTo(x+24,y+(calm?0:Math.sin(t*2+x*0.07+k)*3),x+48,y);
      cx.stroke();
    }
    cx.globalAlpha=1;
  } else if(w==='rain'){
    // thin slanted strokes + occasional ring-splashes on the ground. E31: under
    // the soft gate (the jungle only) the drops fall gentler — half the slant,
    // warm green-silver, quieter rings; ungated, every string and const is the
    // live recipe verbatim.
    const soft=softRain(), sl=soft? RAIN_SLANT*JRAIN_SLK : RAIN_SLANT;
    const D=WXP.drops, n=calm? (D.length*0.4)|0 : D.length;
    cx.strokeStyle=soft? JRAIN_COL : 'rgba(157,191,230,0.5)'; cx.lineWidth=1.6*k9; cx.lineCap='round';
    cx.beginPath();
    for(let i=0;i<n;i++){
      const f=D[i];
      const y=calm? f.y : (f.y+t*f.v)%WORLD_H;
      const x=calm? f.x : (f.x+t*f.v*sl)%WORLD_W;
      cx.moveTo(x,y); cx.lineTo(x-f.l*k9*sl,y-f.l*k9);
    }
    cx.stroke(); cx.lineCap='butt';
    if(!calm) for(const g of WXP.rings){
      const k=((t+g.p)%g.T)/g.T;
      if(k>=0.35) continue;
      const q=k/0.35;
      cx.globalAlpha=(soft?0.35:0.5)*(1-q); cx.strokeStyle=RIVER_LIGHT; cx.lineWidth=2*k9;
      cx.beginPath(); cx.ellipse(g.x,g.y,(4+30*q)*k9,(4+30*q)*0.45*k9,0,0,7); cx.stroke();
      cx.globalAlpha=1;
    }
  }
}

// ---- rivers: cell water that reads its shape from its neighbours (track-connectivity idea) ----
function riverMask(x,y){
  // E31: the WATERFALL is water to the PAINT (the channel arm reaches its plunge
  // pool so the seam is perfect by construction) but NOT to the predicate — no
  // shipped rug and no palette can make a wfall, so every other mask is byte-true.
  const wet=s=>s.t==='rv'||s.t==='wfall';
  let m=0, s;
  if((s=scenAt(x,y-1))&&wet(s)) m|=1;
  if((s=scenAt(x+1,y))&&wet(s)) m|=2;
  if((s=scenAt(x,y+1))&&wet(s)) m|=4;
  if((s=scenAt(x-1,y))&&wet(s)) m|=8;
  return m;
}
// the fence reads its shape from its neighbours exactly like the river — no rotation verb
function fenceMask(x,y){
  let m=0, s;
  if((s=scenAt(x,y-1))&&s.t==='fence') m|=1;
  if((s=scenAt(x+1,y))&&s.t==='fence') m|=2;
  if((s=scenAt(x,y+1))&&s.t==='fence') m|=4;
  if((s=scenAt(x-1,y))&&s.t==='fence') m|=8;
  return m;
}
function drawRivers(){
  let any=false;
  const chan=new Path2D(), ponds=[], fills=[];
  for(const [k,s] of scen){
    if(s.t!=='rv') continue; any=true;
    const [x,y]=k.split(',').map(Number), mx=GX+x*C+C/2, my=GY+y*C+C/2, m=riverMask(x,y);
    // a 2×2 (or bigger) block of water: fill the square between the four cell centres,
    // else the channel strokes leave a rug-coloured hole in the pond's middle (E5 ponds)
    if((m&2)&&(m&4)){ const d=scenAt(x+1,y+1); if(d&&d.t==='rv') fills.push([mx,my]); }
    if(!m){ ponds.push([mx,my]); continue; }
    if(m&1){ chan.moveTo(mx,my); chan.lineTo(mx,my-C/2); }
    if(m&2){ chan.moveTo(mx,my); chan.lineTo(mx+C/2,my); }
    if(m&4){ chan.moveTo(mx,my); chan.lineTo(mx,my+C/2); }
    if(m&8){ chan.moveTo(mx,my); chan.lineTo(mx-C/2,my); }
  }
  if(!any) return;
  cx.lineCap='round'; cx.lineJoin='round';
  cx.strokeStyle=RIVER_BANK; cx.lineWidth=58; cx.stroke(chan);
  cx.fillStyle=RIVER_BLUE;
  for(const [mx,my] of fills) cx.fillRect(mx-1,my-1,C+2,C+2);
  cx.strokeStyle=RIVER_BLUE; cx.lineWidth=46; cx.stroke(chan);
  cx.globalAlpha=0.55; cx.strokeStyle=RIVER_LIGHT; cx.lineWidth=24; cx.stroke(chan); cx.globalAlpha=1;
  // sparkle combing — the GVT snow-combing recipe, in blue
  cx.globalAlpha=0.75; cx.strokeStyle=RIVER_GLINT; cx.lineWidth=3; cx.lineCap='butt';
  cx.setLineDash([7,21]); cx.stroke(chan); cx.setLineDash([]); cx.globalAlpha=1;
  for(const [mx,my] of ponds){
    cx.fillStyle=RIVER_BANK; cx.beginPath(); cx.arc(mx,my,31,0,7); cx.fill();
    cx.fillStyle=RIVER_BLUE; cx.beginPath(); cx.arc(mx,my,25,0,7); cx.fill();
    cx.globalAlpha=0.55; cx.fillStyle=RIVER_LIGHT; cx.beginPath(); cx.arc(mx,my,14,0,7); cx.fill();
    cx.globalAlpha=0.75; cx.strokeStyle=RIVER_GLINT; cx.lineWidth=3; cx.setLineDash([6,10]);
    cx.beginPath(); cx.arc(mx,my,17,0,7); cx.stroke(); cx.setLineDash([]); cx.globalAlpha=1;
  }
}

  for(const [dx,r2] of [[-11,7],[1,8],[12,6.5]]){
    cx.beginPath(); cx.arc(dx,24,r2,Math.PI,TAU); cx.stroke();

  cx.lineCap='butt';
  for(const [mx,my,r2,p3] of [[-17,10,10,0],[16,6,8,2.1],[0,14,12,4.2]]){

// E31 — the monkey under its branch (the goat's carry-your-ledge law: the

  cx.fillStyle='#5C4326'; cx.beginPath(); cx.arc(19.5,14.5+Math.sin(t*2.4+ph),1.8,0,7); cx.fill();

// drop-shadow ellipse per kind: [y, rx] (v1.1 values for bush/tree/ppl kept verbatim;

const SCEN_SH={ bush:[27,24], tree:[27,20], ppl:[21,24],

// glow and the head ride the wiggle like every charm. Pure f(s.lit, s.litH): no perf
// clock, no random — a stepped frame is a deterministic frame. Untapped buildings

function drawScenLit(s){
  const L=LIT[s.t]; if(!L) return;
  const g=Math.min(1,(s.lit||0)/LIT_FADE);            // lights snap ON, fade at the tail
  if(g>0) for(const [x,y,w,h] of L.win){
    cx.globalAlpha=g*0.92; cx.fillStyle='#FFDF7E';
    rr(x+1.2,y+1.2,w-2.4,h-2.4,1.5); cx.fill();
    const hx=x+w/2, hy=y+h/2, R=Math.max(w,h)*1.35;   // the warm halo past the frame
    const gr=cx.createRadialGradient(hx,hy,1,hx,hy,R);
    gr.addColorStop(0,'rgba(255,215,110,0.55)'); gr.addColorStop(1,'rgba(255,215,110,0)');
    cx.globalAlpha=g; cx.fillStyle=gr;
    cx.beginPath(); cx.arc(hx,hy,R,0,7); cx.fill();
  }
  const up=s.litH||0;
  if(up>0.02){                                        // the head, clipped to its pane
    const [x,y,w,h]=L.peek, r=L.r, hx=x+w/2;
    cx.globalAlpha=1;
    cx.save(); cx.beginPath(); cx.rect(x+1,y+1,w-2,h-2); cx.clip();
    const hidden=y+h+r*1.1, upTo=y+h-h*0.62;          // below the sill → 62% up the pane
    const heady=hidden+(upTo-hidden)*up;
    cx.fillStyle=L.head==='chick'? '#F2C531' : '#E8C39A';
    cx.beginPath(); cx.arc(hx,heady,r,0,7); cx.fill();
    if(L.head==='keeper'){                            // a cap of dark hair for the keeper
      cx.fillStyle='#6B4A2C';
      cx.beginPath(); cx.arc(hx,heady,r,Math.PI*1.12,Math.PI*1.88); cx.fill();
    }
    if(L.head==='chick'){                             // the little beak, face-on
      cx.fillStyle='#E8892B';
      cx.beginPath(); cx.moveTo(hx-1.2,heady+0.5); cx.lineTo(hx+1.2,heady+0.5);
      cx.lineTo(hx,heady+2.3); cx.closePath(); cx.fill();
    }
    cx.fillStyle='#23211E';                           // the eyes — looking at YOU
    const ey=heady-r*0.22, ex=r*0.38, er=Math.max(0.75,r*0.24);

    cx.restore();
  }

}

// ---- THE FENCE (E2): posts + two rails, auto-connecting like the river ----
function drawFence(m){
  const dirs=[[0,-C/2],[C/2,0],[0,C/2],[-C/2,0]];
  let segs=[]; for(let i=0;i<4;i++) if(m&(1<<i)) segs.push(dirs[i]);
  if(!segs.length) segs=[[-26,0],[26,0]];        // a lone bit of fence: little E–W run
  cx.lineCap='round'; cx.lineJoin='round';
  // ground shadow (no ellipse for the fence — it lays its own line)
  cx.globalAlpha=0.16; cx.strokeStyle='#000'; cx.lineWidth=10;
  cx.beginPath(); for(const [px,py] of segs){ cx.moveTo(0,5); cx.lineTo(px,py+5); } cx.stroke();
  cx.globalAlpha=1;
  // two rails out each run
  cx.strokeStyle=FENCE_COL; cx.lineWidth=3;
  cx.beginPath();
  for(const [px,py] of segs){
    const L=Math.hypot(px,py)||1, nx=-py/L*4, ny=px/L*4;
    cx.moveTo(nx,ny); cx.lineTo(px+nx,py+ny);
    cx.moveTo(-nx,-ny); cx.lineTo(px-nx,py-ny);
  }
  cx.stroke();
  // posts: centre + every 24px — neighbours re-draw the shared edge post in the same spot
  cx.lineWidth=5;
  cx.beginPath();
  const post=(px,py)=>{ cx.moveTo(px,py+5); cx.lineTo(px,py-8); };
  post(0,0);
  for(const [px,py] of segs){
    const L=Math.hypot(px,py), ux=px/L, uy=py/L;
    for(let d=24;d<=L+0.1;d+=24) post(ux*d,uy*d);
  }
  cx.stroke();
}

// own z). Within each level the three-pass seamless-join recipe holds untouched.
const EMPTY_MAP=new Map();
function batchTrack(list){            // the three-pass recipe over [ox,oy,pc] rows
  const bed=new Path2D(), rails=new Path2D();
  for(const [ox,oy,pc] of list){
    for(const p of pathsOf(pc)){
      addPoly(bed,p.pts,ox,oy);
      for(let i=0;i<p.pts.length-1;i++){
        const ax=ox+p.pts[i][0], ay=oy+p.pts[i][1], bx=ox+p.pts[i+1][0], by=oy+p.pts[i+1][1];
        const L=Math.hypot(bx-ax,by-ay)||1, nx=-(by-ay)/L*5.5, ny=(bx-ax)/L*5.5;
        rails.moveTo(ax+nx,ay+ny); rails.lineTo(bx+nx,by+ny);
        rails.moveTo(ax-nx,ay-ny); rails.lineTo(bx-nx,by-ny);
      }
    }
  }
  cx.lineJoin='round'; cx.lineCap='round';
  cx.strokeStyle='#9A8266'; cx.lineWidth=34; cx.globalAlpha=0.9; cx.stroke(bed); cx.globalAlpha=1;
  cx.lineCap='butt';
  cx.strokeStyle='#6B4A2C'; cx.lineWidth=24; cx.setLineDash([6,12]); cx.stroke(bed); cx.setLineDash([]);
  cx.strokeStyle='#4A423A'; cx.lineWidth=3; cx.stroke(rails);
  for(const [ox,oy,pc] of list) drawPieceDecor(pc,ox,oy);
}
function pathPD(p,s){                 // point + unit direction + z at arc length s
  s=Math.max(0,Math.min(p.len,s));
  let i=1; while(i<p.cum.length-1 && p.cum[i]<s) i++;
  const a=p.pts[i-1], b=p.pts[i], L=p.cum[i]-p.cum[i-1]||1, k=(s-p.cum[i-1])/L;
  return { x:a[0]+(b[0]-a[0])*k, y:a[1]+(b[1]-a[1])*k,
           dx:(b[0]-a[0])/L, dy:(b[1]-a[1])/L,
           z:p.z? p.z[i-1]+(p.z[i]-p.z[i-1])*k : 0 };
}

// the soft shadow STAYS ON THE GROUND and shrinks with height — free depth
function slopeShadow(pc,ox,oy){

function drawTrackAll(g,hg,carItems,midHook){
  const flat=[], anim=[], sloped=[], hflat=[], hanim=[];
  for(const [k,pc] of g){
    if(pc.t==='ref') continue;
    const [gx,gy]=k.split(',').map(Number), row=[GX+gx*C,GY+gy*C,pc];
    if(pc.t==='rp'||pc.t==='sp') sloped.push(row);
    else if(pc.ra||pc.pop>0||pc.wob>0) anim.push(row);
    else flat.push(row);
  }
  for(const [k,pc] of hg){
    const [gx,gy]=k.split(',').map(Number), row=[GX+gx*C,GY+gy*C,pc];
    if(pc.ra||pc.pop>0||pc.wob>0) hanim.push(row); else hflat.push(row);
  }
  batchTrack(flat);
  for(const row of anim) drawAnimPiece(row,C,0);
  for(const row of sloped) slopeShadow(row[2],row[0],row[1]);
  hiShadow(hflat.concat(hanim));
  for(const row of sloped) slopeTrestles(row[2],row[0],row[1]);
  for(const row of hflat) hiTrestles(row[2],row[0],row[1]);
  for(const row of hanim) hiTrestles(row[2],row[0],row[1]);
  if(midHook) midHook();
  const items=[];
  for(const row of sloped){
    if(row[2].ra||row[2].pop>0) items.push({z:0.0001, fn:()=>drawAnimPiece(row,row[2].t==='sp'?SPS:C,0)});
    else slopeItems(row[2],row[0],row[1],items);
  }
  if(hflat.length) items.push({z:1, fn(){ cx.save(); cx.translate(0,-LIFT); batchTrack(hflat); cx.restore(); }});
  for(const row of hanim) items.push({z:1.001, fn:()=>drawAnimPiece(row,C,LIFT)});
  if(carItems) for(const it of carItems) items.push(it);
  // E7: tunnel shells repaint ABOVE the cars at their level (cars ride z+0.05, decks z 1)
  for(const row of flat) if(row[2].t==='tun')

// sub-polyline of a path between arc lengths s0..s1 (for the frog gap + points blade)
function pathSeg(p,s0,s1){
  s0=Math.max(0,Math.min(p.len,s0)); s1=Math.max(0,Math.min(p.len,s1));
  const at=s=>{ let i=1; while(i<p.cum.length-1&&p.cum[i]<s) i++;
    const a=p.pts[i-1],b=p.pts[i],L=p.cum[i]-p.cum[i-1]||1,k=(s-p.cum[i-1])/L;
    return [a[0]+(b[0]-a[0])*k, a[1]+(b[1]-a[1])*k]; };
  const out=[at(s0)];
  for(let i=0;i<p.pts.length;i++) if(p.cum[i]>s0&&p.cum[i]<s1) out.push(p.pts[i]);
  out.push(at(s1));
  return out;
}

// cars-on-rails: pose sampled two axle points apart so headings stay honest in curves;
// on a climb the LIFTED axle points set the tilt, and z rides along for paint order
function carPose(c){
  const f=clone(c.rd), b=clone(c.rd);
  const rf=advance(f,AX), rb=back(b,AX);
  let ang,x,y,z;
  if(rf.moved>1||rb.moved>1){
    const pf=rf.ok||rf.moved>1? pos(f):pos(c.rd), pb=rb.ok||rb.moved>1? pos(b):pos(c.rd);
    ang=Math.atan2((pf.y-LIFT*pf.z)-(pb.y-LIFT*pb.z),pf.x-pb.x);
    x=(pf.x+pb.x)/2; y=(pf.y+pb.y)/2; z=(pf.z+pb.z)/2;
  } else { const p=pos(c.rd); ang=p.ang; x=p.x; y=p.y; z=p.z; }
  return {x,y,ang,z:z||0};
}
function drawCarsOnRails(cars,wheelRot){
  for(let i=cars.length-1;i>=0;i--){
    const c=cars[i], p=carPose(c);
    const artAng=p.ang+(c.face<0?Math.PI:0);
    drawCar(c.type,p.x,p.y,artAng,c.squash||0,wheelRot*(c.face<0?-1:1),livFor(i),p.z);
  }
}
// the rug train as z-items: TRAINS SORT INTO PAINT ORDER BY THEIR CURRENT z (E4 law),
// so a train slips under the high line and rides over it, fractional mid-ramp
function trainCarItems(){
  if(!TRAIN.placed) return null;
  const items=[], ps=RIDERS.poseT>0? RIDERS.pose : null;   // E15: one pose, whole train
  for(let i=TRAIN.cars.length-1;i>=0;i--){
    const c=TRAIN.cars[i], p=carPose(c), liv=livFor(i);
    const artAng=p.ang+(c.face<0?Math.PI:0);
    const rid=RIDER_CAP[c.type]!=null? (c.rid|0) : undefined;   // E15: real occupancy on the rug
    items.push({z:p.z+0.05, fn:()=>drawCar(c.type,p.x,p.y,artAng,c.squash||0,wheelPhase*(c.face<0?-1:1),liv,p.z,undefined,rid,ps)});
  }
  return items;
}
/* =====================================================================
   E28 THE MAGIC TRAIL — shop-bought exhaust. LAW: a trail is PAINT, not
   physics. It is emitted from the coupling face that trails the MOTION
   (reverseTrain flips every rd.dir, so back() re-aims for free), in
   world space, from the existing per-frame step — advance, collision,
   lap/startSig, gravity and every cell-keyed law never hear of it.
   equip.trail is the ONE dial: 'none' and the whole feature vanishes.
   Campaign wears the kid's equip (the gift is HER train); PLAY wears
   NOTHING (five stateless tray trains × particles = mud); the menu
   room and bedroom never tick or paint any of this by construction.
   ===================================================================== */
const TRAIL_LEN=260;          // px of ridden path the rainbow covers (Wyatt dial)
const TRAIL_PTS=48;           // ribbon ring slots — allocated once, reused forever
const TRAIL_FADE=1;           // seconds the ribbon lets go after a grab-off (Wyatt dial)
const SPARK_MAX=40;           // stardust cap — the pool IS the allocation, made once here
const TRAIL_SPC=TRAIL_LEN/TRAIL_PTS;   // px between ribbon samples (~5.4 — hugs the curves)
const TRAIL={ n:0, head:0, acc:0, fade:0, sTick:0, mk:0,
  x:new Float32Array(TRAIL_PTS), y:new Float32Array(TRAIL_PTS),
  z:new Float32Array(TRAIL_PTS), b:new Uint8Array(TRAIL_PTS),   // b = break: no segment back to the previous point
  sparks:[] };
for(let i=0;i<SPARK_MAX;i++) TRAIL.sparks.push({on:false,x:0,y:0,z:0,vx:0,vy:0,t:0,life:0.8,sz:1,ph:0,gold:false});
function trailClear(){ TRAIL.n=0; TRAIL.head=0; TRAIL.acc=0; TRAIL.fade=0;
  for(const s of TRAIL.sparks) s.on=false; }
function trailWear(id){       // the ONE wear door — buy, tap, rig all walk through here
  const w=TRAIL_IDS.includes(id)? id : 'none';
  if(equip.trail!==w){ equip.trail=w; trailClear(); }   // the dial turns → the old magic vanishes at once
  return equip.trail;
}
function trailTailRd(){       // the rider at the coupling face that trails the direction of travel
  const c=TRAIN.F? TRAIN.cars[TRAIN.cars.length-1] : TRAIN.cars[0];
  const rd=clone(c.rd); back(rd,GAP*0.55);
  return rd;
}
function trailEmit(step){     // called ONLY from the running step, after the cars advanced
  if(equip.trail==='none'||!TRAIN.cars.length) return;
  TRAIL.fade=1;
  const rd=trailTailRd(), p=pos(rd);
  if(equip.trail==='tr_rain'){
    TRAIL.acc+=step;
    if(TRAIL.acc>=TRAIL_SPC){
      TRAIL.acc%=TRAIL_SPC;
      const h=TRAIL.head, pv=(h-1+TRAIL_PTS)%TRAIL_PTS;
      const jump=TRAIL.n>0? Math.hypot(p.x-TRAIL.x[pv],p.y-TRAIL.y[pv]) : 0;
      TRAIL.x[h]=p.x; TRAIL.y[h]=p.y; TRAIL.z[h]=p.z||0;
      TRAIL.b[h]=(TRAIL.n===0||jump>TRAIL_SPC*3)?1:0;   // a jumping tail (re-place, ping-pong flip) BREAKS the ribbon, never bridges it
      TRAIL.head=(h+1)%TRAIL_PTS; if(TRAIL.n<TRAIL_PTS) TRAIL.n++;
    }
  } else {
    // STARDUST — 2-3 a frame at the tail while she moves; the cap caps the fleet
    const bx=Math.cos(p.ang+Math.PI), by=Math.sin(p.ang+Math.PI);
    const want=2+(TRAIL.sTick++&1);
    for(let i=0,made=0;i<SPARK_MAX&&made<want;i++){
      const s=TRAIL.sparks[i]; if(s.on) continue;
      s.on=true; s.t=0; s.life=0.65+Math.random()*0.3;
      s.x=p.x+(Math.random()-0.5)*10; s.y=p.y+(Math.random()-0.5)*8; s.z=p.z||0;
      s.vx=bx*(14+Math.random()*18)+(Math.random()-0.5)*10;
      s.vy=by*(14+Math.random()*18)*0.4-(26+Math.random()*18);   // up-and-back
      s.sz=0.8+Math.random()*0.7; s.ph=Math.random()*TAU; s.gold=(TRAIL.mk&1)===0;
      TRAIL.mk++; made++;
    }
  }
}
function trailTick(dt){       // sim-clocked decay — deterministic under the battery's TS.step
  if(TRAIL.fade>0&&!TRAIN.placed){          // grabbed off: the ribbon lets go over TRAIL_FADE
    TRAIL.fade=Math.max(0,TRAIL.fade-dt/TRAIL_FADE);
    if(TRAIL.fade===0){ TRAIL.n=0; TRAIL.head=0; TRAIL.acc=0; }
  }
  for(const s of TRAIL.sparks){ if(!s.on) continue;
    s.t+=dt; if(s.t>=s.life){ s.on=false; continue; }
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy-=dt*8;   // a little buoyancy — sparkles float
  }
}
function star4(px,py,k,col,a){   // a 4-point twinkle — the sparkle's whole anatomy
  cx.globalAlpha=a; cx.fillStyle=col;
  cx.beginPath();
  cx.moveTo(px,py-7*k); cx.quadraticCurveTo(px+1.6*k,py-1.6*k,px+7*k,py);
  cx.quadraticCurveTo(px+1.6*k,py+1.6*k,px,py+7*k);
  cx.quadraticCurveTo(px-1.6*k,py+1.6*k,px-7*k,py);
  cx.quadraticCurveTo(px-1.6*k,py-1.6*k,px,py-7*k);
  cx.closePath(); cx.fill(); cx.globalAlpha=1;
}
function trailRunPaint(i0,N,a,b2){ return ()=>{   // one contiguous same-shelf run of ribbon segments
  cx.lineCap='round'; cx.lineJoin='round';
  for(let i=a;i<=b2;i++){
    const pv=(i0+i-1+TRAIL_PTS)%TRAIL_PTS, cu=(i0+i)%TRAIL_PTS;
    const x0=TRAIL.x[pv], y0=TRAIL.y[pv]-LIFT*TRAIL.z[pv];
    const x1=TRAIL.x[cu], y1=TRAIL.y[cu]-LIFT*TRAIL.z[cu];
    const L=Math.hypot(x1-x0,y1-y0)||1, nx=-(y1-y0)/L, ny=(x1-x0)/L;
    cx.globalAlpha=(i/(N-1))*TRAIL.fade*0.85;     // alpha ramps to 0 at the old end
    for(let b3=0;b3<5;b3++){
      const o=(b3-2)*3.3;
      cx.strokeStyle=LIVERY[RAIN_ORDER[b3]].m; cx.lineWidth=3.4;
      cx.beginPath(); cx.moveTo(x0+nx*o,y0+ny*o); cx.lineTo(x1+nx*o,y1+ny*o); cx.stroke();
    }
  }

function trailRibbonItems(out){   // ribbon segments as z-ITEMS: under the cars (+0.05), over the
  const N=TRAIL.n, i0=(TRAIL.head-N+TRAIL_PTS)%TRAIL_PTS;   // track — the E4 paint-z law for free
  let runA=-1, runZ=0;
  const flush=(a,b2,zq)=>{ if(a>=0&&b2>=a) out.push({z:zq+0.02, fn:trailRunPaint(i0,N,a,b2)}); };
  for(let i=1;i<N;i++){
    const cu=(i0+i)%TRAIL_PTS;
    if(TRAIL.b[cu]){ flush(runA,i-1,runZ); runA=-1; continue; }
    const zq=Math.round(Math.max(TRAIL.z[(i0+i-1+TRAIL_PTS)%TRAIL_PTS],TRAIL.z[cu])*4)/4;
    if(runA<0){ runA=i; runZ=zq; }
    else if(zq!==runZ){ flush(runA,i-1,runZ); runA=i; runZ=zq; }
  }
  flush(runA,N-1,runZ);

function trailCarItems(){     // the rug train's items + the rainbow's — draw()'s one seam

  if(equip.trail==='tr_rain'&&TRAIL.n>1&&TRAIL.fade>0) trailRibbonItems(out);

function trailSparkPaint(){   // stardust floats OVER the cars — same world transform, camera free
  if(PLAY.on||equip.trail!=='tr_spark') return;   // PLAY wears NOTHING — the law in writing
  const t=perf();

    const span=DRAG.t==='sp'? SPN:1;
    if(hover){
      // the ghost tint asks THE predicate — and paints at the elevation it infers
      let ok;
      if(isPiece){ const q=placeQuery(DRAG.t,DRAG.r,hover[0],hover[1]); ok=q.ok; if(q.ok) mock.elev=q.elev; }
      else ok=canPlaceScen(DRAG.t,hover[0],hover[1]);
      cx.globalAlpha=0.28; cx.fillStyle=ok?'#7CFC66':'#FF5A44';
      rr(GX+hover[0]*C+3,GY+hover[1]*C+3,C*span-6,C*span-6,10); cx.fill(); cx.globalAlpha=1;

      cx.globalAlpha=0.8; cx.save(); cx.translate(DRAG.x-C*span/2,DRAG.y-C*span/2);

  }
  if(DRAG.kind==='train' && DRAG.x!=null){
    if(hover && pieceTop(hover[0],hover[1])){
      cx.globalAlpha=0.28; cx.fillStyle='#7CFC66';
      rr(GX+hover[0]*C+3,GY+hover[1]*C+3,C-6,C-6,10); cx.fill(); cx.globalAlpha=1;

    const gcars=CAMP.on? (DRAG.prev? DRAG.prev.slice(1).map(c=>c.type) : SURPRISE_STOCK) : consist;
    const n=1+gcars.length;
    for(let i=n-1;i>=0;i--){

      cx.globalAlpha=0.28; cx.fillStyle='#7CFC66';
      rr(GX+hover[0]*C+3,GY+hover[1]*C+3,C-6,C-6,10); cx.fill(); cx.globalAlpha=1;
    }

      cx.globalAlpha=1;

      rr(GX+hover[0]*C+3,GY+hover[1]*C+3,C-6,C-6,10); cx.fill(); cx.globalAlpha=1;
    }
    drawCar(DRAG.t, DRAG.x, DRAG.y+Math.sin(perf()*6)*2, 0, 0, wheelPhase,
            DRAG.kind==='car'? livFor(1+consist.length) : undefined);

// E16: the shed and GO hints died with their chrome. Stages 2 and 3 both pass on

const HINTS=[
