<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overworld Online — Map Designer</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e1117;
  --panel: #161b22;
  --border: #21262d;
  --border-lit: #30363d;
  --text: #c9d1d9;
  --text-dim: #484f58;
  --text-bright: #e6edf3;
  --accent: #58a6ff;
  --accent-dim: #1f6feb;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d29922;
  --orange: #db6d28;
  --purple: #a371f7;
  --blue-build: #58a6ff;
  --green-tree: #3fb950;
  --red-npc: #f47067;
  --yellow-deco: #d29922;
  --white-special: #e6edf3;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Outfit', sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:13px; }
::selection { background:var(--accent-dim); color:#fff; }
::-webkit-scrollbar { width:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border-lit); border-radius:3px; }

#app { display:flex; height:100vh; }

/* ═══ SIDEBAR ═══ */
#sidebar { width:260px; min-width:260px; background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; z-index:10; }
#sidebar-header { padding:14px 16px; border-bottom:1px solid var(--border); }
#sidebar-header h1 { font-size:14px; font-weight:600; color:var(--text-bright); letter-spacing:-.2px; }
#sidebar-header h1 span { color:var(--accent); }
#sidebar-header .sub { font-family:var(--mono); font-size:10px; color:var(--text-dim); margin-top:2px; letter-spacing:.5px; }

#palette { flex:1; overflow-y:auto; padding:8px 0; }
.cat { border-bottom:1px solid var(--border); }
.cat-head { display:flex; align-items:center; gap:6px; padding:8px 16px; cursor:pointer; user-select:none; font-size:11px; font-weight:500; color:var(--text-dim); text-transform:uppercase; letter-spacing:.8px; transition:color .15s; }
.cat-head:hover { color:var(--text); }
.cat-head .dot { width:8px; height:8px; border-radius:2px; flex-shrink:0; }
.cat-head .ct { margin-left:auto; font-family:var(--mono); font-size:10px; }
.cat-head .arr { transition:transform .2s; font-size:9px; }
.cat.closed .cat-items { display:none; }
.cat.closed .arr { transform:rotate(-90deg); }
.cat-items { padding:2px 10px 8px; }

.prefab { display:flex; align-items:center; gap:8px; padding:5px 8px; border-radius:4px; cursor:pointer; transition:background .1s; font-size:12px; }
.prefab:hover { background:rgba(255,255,255,.04); }
.prefab.selected { background:var(--accent-dim); color:#fff; }
.prefab .ico { width:18px; height:18px; border-radius:3px; display:flex; align-items:center; justify-content:center; font-size:10px; flex-shrink:0; }
.prefab .nm { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* ═══ TOOLBAR ═══ */
#toolbar { height:40px; background:var(--panel); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 12px; gap:6px; z-index:5; }
.tb-group { display:flex; align-items:center; gap:2px; background:var(--bg); border-radius:6px; padding:2px; }
.tb { padding:4px 10px; border-radius:4px; border:none; background:transparent; color:var(--text-dim); font-family:var(--sans); font-size:11px; font-weight:500; cursor:pointer; transition:all .12s; white-space:nowrap; }
.tb:hover { color:var(--text); background:rgba(255,255,255,.05); }
.tb.active { background:var(--accent-dim); color:#fff; }
.tb.danger:hover { color:var(--red); }
.sep { width:1px; height:20px; background:var(--border); margin:0 6px; }
.tb-label { font-family:var(--mono); font-size:10px; color:var(--text-dim); padding:0 6px; letter-spacing:.5px; }
#snap-toggle { display:flex; align-items:center; gap:5px; cursor:pointer; font-size:11px; color:var(--text-dim); user-select:none; }
#snap-toggle input { accent-color:var(--accent); }
.spacer { flex:1; }

/* ═══ CANVAS ═══ */
#canvas-wrap { flex:1; display:flex; flex-direction:column; position:relative; overflow:hidden; }
#canvas-area { flex:1; position:relative; overflow:hidden; }
canvas#map { position:absolute; top:0; left:0; }

/* ═══ HUD OVERLAYS ═══ */
.hud { position:absolute; z-index:4; pointer-events:none; font-family:var(--mono); font-size:10px; color:var(--text-dim); background:rgba(14,17,23,.8); padding:3px 8px; border-radius:4px; border:1px solid var(--border); letter-spacing:.5px; }
#hud-coords { top:8px; left:8px; }
#hud-zoom { top:8px; right:8px; }
#hud-tool { bottom:8px; left:8px; }
#hud-sel { bottom:8px; right:8px; pointer-events:auto; }
#hud-sel button { background:none; border:1px solid var(--border); color:var(--red); font-family:var(--mono); font-size:10px; padding:2px 8px; border-radius:3px; cursor:pointer; margin-left:8px; }
#hud-sel button:hover { background:rgba(248,81,73,.1); }

/* ═══ MINIMAP ═══ */
#minimap { position:absolute; bottom:12px; right:12px; width:180px; height:130px; border:1px solid var(--border); border-radius:6px; background:rgba(14,17,23,.9); z-index:5; overflow:hidden; }
canvas#mini { width:100%; height:100%; display:block; }
#mvp { position:absolute; border:1px solid var(--accent); opacity:.4; pointer-events:none; border-radius:1px; }

/* ═══ MODALS ═══ */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
.modal { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:20px; min-width:400px; max-width:600px; max-height:80vh; }
.modal h2 { font-size:14px; font-weight:600; margin-bottom:12px; color:var(--text-bright); }
.modal textarea { width:100%; height:300px; background:var(--bg); border:1px solid var(--border); border-radius:4px; color:var(--text); font-family:var(--mono); font-size:11px; padding:10px; resize:vertical; }
.modal .btns { display:flex; gap:8px; margin-top:12px; justify-content:flex-end; }
.modal .btn { padding:6px 16px; border-radius:4px; border:1px solid var(--border); background:transparent; color:var(--text); font-family:var(--sans); font-size:12px; cursor:pointer; }
.modal .btn:hover { background:rgba(255,255,255,.05); }
.modal .btn.primary { background:var(--accent-dim); border-color:var(--accent-dim); color:#fff; }
.modal .btn.primary:hover { background:var(--accent); }
</style>
</head>
<body>
<div id="app">

<!-- SIDEBAR -->
<div id="sidebar">
  <div id="sidebar-header">
    <h1>Overworld <span>Designer</span></h1>
    <div class="sub">PREFAB PLACEMENT TOOL</div>
  </div>
  <div id="palette"></div>
</div>

<!-- MAIN AREA -->
<div id="canvas-wrap">
  <!-- TOOLBAR -->
  <div id="toolbar">
    <div class="tb-group">
      <button class="tb active" data-tool="select" title="V">Select</button>
      <button class="tb" data-tool="place" title="P">Place</button>
      <button class="tb" data-tool="pan" title="Space">Pan</button>
    </div>
    <div class="sep"></div>
    <label id="snap-toggle"><input type="checkbox" id="snap-cb" checked> Snap 2u</label>
    <div class="sep"></div>
    <button class="tb" id="btn-export">Export JSON</button>
    <button class="tb" id="btn-import">Import JSON</button>
    <div class="sep"></div>
    <button class="tb" id="btn-reset">Reset to Default</button>
    <button class="tb danger" id="btn-clear">Clear All</button>
    <div class="spacer"></div>
    <span class="tb-label" id="obj-count">0 objects</span>
  </div>

  <!-- CANVAS -->
  <div id="canvas-area">
    <canvas id="map"></canvas>
    <div class="hud" id="hud-coords">0, 0</div>
    <div class="hud" id="hud-zoom">100%</div>
    <div class="hud" id="hud-tool">SELECT</div>
    <div class="hud" id="hud-sel" style="display:none"></div>
    <div id="minimap"><canvas id="mini"></canvas><div id="mvp"></div></div>
  </div>
</div>
</div>

<script>
// ═══════════════════════════════════════
// PREFAB DEFINITIONS
// ═══════════════════════════════════════
const CATEGORIES = [
  { name:'Buildings', color:'var(--blue-build)', hex:'#58a6ff', icon:'🏠', items:[
    'Town Hall','Farm House','Start House','Snowy Keep','Mountain Hideaway','Ice Castle','Abandoned Mines','Ruins'
  ]},
  { name:'Trees', color:'var(--green-tree)', hex:'#3fb950', icon:'🌲', items:[
    'Pine Tree 1','Pine Tree Snow 1','Bush 1','Tree Stump 1','Tree Stump Snow 1'
  ]},
  { name:'Decorations', color:'var(--yellow-deco)', hex:'#d29922', icon:'✦', items:[
    'Farm Fence','Farm Fence Middle','Scarecrow','Orange Flower','Red Flower','Yellow Flower','Pumpkin','Pumpkin Vine','Grass 1'
  ]},
  { name:'NPCs', color:'var(--red-npc)', hex:'#f47067', icon:'👤', items:[
    'Elder Frost','Smith Ember','Keeper Zara','Brawler Jax','Ice Queen Vera','Farmer Bea','Captain Rex'
  ]},
  { name:'Special', color:'var(--white-special)', hex:'#e6edf3', icon:'⬟', items:[
    'Player Spawn Point'
  ]},
];

// Build lookup: prefab name → category info
const PREFAB_CAT = {};
CATEGORIES.forEach(cat => cat.items.forEach(item => PREFAB_CAT[item] = cat));

// ═══════════════════════════════════════
// TERRAIN DATA
// ═══════════════════════════════════════
const TILE = 55;
const TILES = [
  {x:-188.26,z:-29.11,r:'frost_valley'},{x:-188.26,z:25.89,r:'frost_valley'},
  {x:-133.26,z:-29.11,r:'frost_valley'},{x:-133.26,z:25.89,r:'frost_valley'},
  {x:-78.26,z:-29.11,r:'rolling_hills'},{x:-78.26,z:25.89,r:'rolling_hills'},
  {x:-23.26,z:25.89,r:'rolling_hills'},{x:-23.26,z:-84.11,r:'forest'},
  {x:31.74,z:25.89,r:'rolling_hills'},{x:31.74,z:-29.11,r:'rolling_hills'},
  {x:31.74,z:-84.11,r:'forest'},{x:86.74,z:-84.11,r:'volcanic'},
  {x:141.74,z:-84.11,r:'volcanic'},
];
const REG_COLORS = {
  frost_valley:'#6aa0c0', rolling_hills:'#4a8c3f', forest:'#2d6b3a', volcanic:'#c44a10'
};

const WORLD = { minX:-200, maxX:210, minZ:-170, maxZ:100 };

// ═══════════════════════════════════════
// STATE
// ═══════════════════════════════════════
let objects = []; // {id, prefab, x, y(always 0), z, rotY}
let nextId = 1;
let selectedPrefab = null; // name from palette
let selectedObj = null;    // placed object
let hoveredObj = null;
let tool = 'select';
let snapGrid = true;
let cam = { x:0, z:0, zoom:3 }; // zoom = pixels per world unit
let dragging = null; // {obj, offX, offZ}
let panning = null;
let spaceHeld = false;

// ═══════════════════════════════════════
// CANVAS SETUP
// ═══════════════════════════════════════
const cv = document.getElementById('map');
const ctx = cv.getContext('2d');
const mcv = document.getElementById('mini');
const mctx = mcv.getContext('2d');
const area = document.getElementById('canvas-area');

function resize() {
  const r = devicePixelRatio || 1;
  cv.width = area.clientWidth * r;
  cv.height = area.clientHeight * r;
  cv.style.width = area.clientWidth + 'px';
  cv.style.height = area.clientHeight + 'px';
  ctx.setTransform(r,0,0,r,0,0);
  mcv.width = 180*r; mcv.height = 130*r;
  mctx.setTransform(r,0,0,r,0,0);
}
addEventListener('resize', resize);
resize();

// World → Screen
function w2s(wx, wz) {
  const cx = area.clientWidth/2, cy = area.clientHeight/2;
  return { x: cx + (wx - cam.x)*cam.zoom, y: cy - (wz - cam.z)*cam.zoom };
}
// Screen → World
function s2w(sx, sy) {
  const cx = area.clientWidth/2, cy = area.clientHeight/2;
  return { x: cam.x + (sx - cx)/cam.zoom, z: cam.z - (sy - cy)/cam.zoom };
}
function snap(v) { return snapGrid ? Math.round(v/2)*2 : v; }

// ═══════════════════════════════════════
// DRAWING
// ═══════════════════════════════════════
function draw() {
  const W = area.clientWidth, H = area.clientHeight;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#080b10';
  ctx.fillRect(0,0,W,H);

  // Grid
  drawGrid(W,H);
  // Terrain (procedural topographic)
  getTerrainImage();
  // Placed objects
  drawObjects();
  // Ghost preview (when placing)
  drawGhost();
  // Minimap
  drawMinimap();

  requestAnimationFrame(draw);
}

function drawGrid(W,H) {
  const step = snapGrid ? 2 : 5;
  const tl = s2w(0,0), br = s2w(W,H);
  const minX = Math.floor(tl.x/step)*step, maxX = Math.ceil(br.x/step)*step;
  const minZ = Math.floor(br.z/step)*step, maxZ = Math.ceil(tl.z/step)*step;

  if (cam.zoom < 0.8) return; // too zoomed out for grid

  ctx.strokeStyle = cam.zoom > 3 ? 'rgba(255,255,255,.03)' : 'rgba(255,255,255,.015)';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  for (let x = minX; x <= maxX; x += step) {
    const s = w2s(x,0);
    ctx.moveTo(s.x, 0); ctx.lineTo(s.x, H);
  }
  for (let z = minZ; z <= maxZ; z += step) {
    const s = w2s(0,z);
    ctx.moveTo(0, s.y); ctx.lineTo(W, s.y);
  }
  ctx.stroke();

  // Origin crosshair
  const o = w2s(0,0);
  ctx.strokeStyle = 'rgba(255,255,255,.08)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(o.x-12,o.y); ctx.lineTo(o.x+12,o.y);
  ctx.moveTo(o.x,o.y-12); ctx.lineTo(o.x,o.y+12);
  ctx.stroke();
}

// Simple noise for terrain texture
function hash(x,y){let h=x*374761393+y*668265263;h=(h^(h>>13))*1274126177;return((h^(h>>16))&0xffff)/65535;}

// Region fill colors — bright and readable
const REG_FILL = {
  frost_valley:  { base:'#2a5c4a', light:'#3a7a62', label:'FROST VALLEY' },
  rolling_hills: { base:'#2d5a28', light:'#3d7a38', label:'ROLLING HILLS' },
  forest:        { base:'#1a4020', light:'#2a5a30', label:'FOREST' },
  volcanic:      { base:'#5a3820', light:'#7a4a28', label:'VOLCANIC ISLES' },
};

// Pre-rendered terrain texture (offscreen canvas, regenerated on resize)
let _terrainOC = null;
let _terrainKey = '';

function prerenderTerrain() {
  // Build at fixed resolution: 2px per world unit
  const ppu = 2;
  const minX = -200, maxX = 210, minZ = -100, maxZ = 90;
  const w = (maxX - minX) * ppu, h = (maxZ - minZ) * ppu;

  const key = `${w}x${h}`;
  if (_terrainOC && _terrainKey === key) return _terrainOC;

  const oc = document.createElement('canvas');
  oc.width = w; oc.height = h;
  const octx = oc.getContext('2d');

  // Ocean base
  octx.fillStyle = '#0a1520';
  octx.fillRect(0, 0, w, h);

  // Draw each tile with noise texture
  TILES.forEach(t => {
    const rf = REG_FILL[t.r] || REG_FILL.rolling_hills;
    const tx = (t.x - minX) * ppu;
    const ty = (maxZ - t.z - TILE) * ppu;
    const tw = TILE * ppu;
    const th = TILE * ppu;

    // Base fill
    octx.fillStyle = rf.base;
    octx.fillRect(tx, ty, tw, th);

    // Noise overlay for terrain variation
    for (let px = 0; px < tw; px += 3) {
      for (let py = 0; py < th; py += 3) {
        const wx = t.x + px / ppu;
        const wz = t.z + TILE - py / ppu;
        const n = hash(Math.floor(wx * 3.7), Math.floor(wz * 3.7));
        const n2 = hash(Math.floor(wx * 0.8), Math.floor(wz * 0.8));

        // Elevation: lighter patches = hills/mountains
        if (n2 > 0.6) {
          octx.fillStyle = `rgba(255,255,255,${(n2 - 0.6) * 0.15})`;
          octx.fillRect(tx + px, ty + py, 3, 3);
        }
        // Dark patches = valleys/shadows
        if (n < 0.3) {
          octx.fillStyle = `rgba(0,0,0,${(0.3 - n) * 0.2})`;
          octx.fillRect(tx + px, ty + py, 3, 3);
        }
      }
    }

    // Subtle inner border
    octx.strokeStyle = 'rgba(255,255,255,.06)';
    octx.lineWidth = 1;
    octx.strokeRect(tx + 0.5, ty + 0.5, tw - 1, th - 1);
  });

  // Coastline
  const tileSet = new Set(TILES.map(t => `${t.x},${t.z}`));
  octx.strokeStyle = 'rgba(100,180,220,.35)';
  octx.lineWidth = 2;
  TILES.forEach(t => {
    const tx = (t.x - minX) * ppu, ty = (maxZ - t.z - TILE) * ppu, tw = TILE*ppu, th = TILE*ppu;
    if(!tileSet.has(`${t.x},${t.z+TILE}`)) { octx.beginPath(); octx.moveTo(tx,ty); octx.lineTo(tx+tw,ty); octx.stroke(); }
    if(!tileSet.has(`${t.x},${t.z-TILE}`)) { octx.beginPath(); octx.moveTo(tx,ty+th); octx.lineTo(tx+tw,ty+th); octx.stroke(); }
    if(!tileSet.has(`${t.x+TILE},${t.z}`)) { octx.beginPath(); octx.moveTo(tx+tw,ty); octx.lineTo(tx+tw,ty+th); octx.stroke(); }
    if(!tileSet.has(`${t.x-TILE},${t.z}`)) { octx.beginPath(); octx.moveTo(tx,ty); octx.lineTo(tx,ty+th); octx.stroke(); }
  });

  // Region labels baked into texture
  const centers = {};
  TILES.forEach(t => {
    if (!centers[t.r]) centers[t.r] = {sx:0,sz:0,n:0};
    centers[t.r].sx += t.x + TILE/2;
    centers[t.r].sz += t.z + TILE/2;
    centers[t.r].n++;
  });
  octx.textAlign = 'center'; octx.textBaseline = 'middle';
  Object.entries(centers).forEach(([k, ct]) => {
    const rf = REG_FILL[k];
    if (!rf) return;
    const lx = (ct.sx/ct.n - minX) * ppu;
    const ly = (maxZ - ct.sz/ct.n) * ppu;
    octx.font = `600 ${ppu * 8}px 'Outfit',sans-serif`;
    octx.fillStyle = 'rgba(0,0,0,.25)';
    octx.fillText(rf.label, lx+1, ly+1);
    octx.fillStyle = 'rgba(255,255,255,.12)';
    octx.fillText(rf.label, lx, ly);
  });

  _terrainOC = oc;
  _terrainKey = key;
  _terrainOC._minX = minX; _terrainOC._maxZ = maxZ; _terrainOC._ppu = ppu;
  return oc;
}

function getTerrainImage() {
  const oc = prerenderTerrain();
  // Map the prerendered canvas onto the main canvas using world coords
  const ppu = oc._ppu, minX = oc._minX, maxZ = oc._maxZ;

  // World corners of the prerendered image
  const tlWorld = w2s(minX, maxZ);
  const brWorld = w2s(minX + oc.width / ppu, maxZ - oc.height / ppu);
  const dw = brWorld.x - tlWorld.x;
  const dh = brWorld.y - tlWorld.y;

  ctx.drawImage(oc, tlWorld.x, tlWorld.y, dw, dh);
}

function drawObjects() {
  objects.forEach(obj => {
    const cat = PREFAB_CAT[obj.prefab];
    const s = w2s(obj.x, obj.z);
    const sel = selectedObj === obj;
    const hov = hoveredObj === obj;
    const color = cat ? cat.hex : '#888';

    // Size based on category
    let r = 5;
    if (cat?.name === 'Buildings') r = 10;
    else if (cat?.name === 'Trees') r = 6;
    else if (cat?.name === 'NPCs') r = 7;
    else if (cat?.name === 'Decorations') r = 4;
    else if (cat?.name === 'Special') r = 8;
    r *= cam.zoom / 3;
    r = Math.max(r, 3);

    // Selection ring
    if (sel) {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(s.x, s.y, r+4, 0, Math.PI*2); ctx.stroke();
    }
    if (hov && !sel) {
      ctx.strokeStyle = color + '80';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(s.x, s.y, r+3, 0, Math.PI*2); ctx.stroke();
    }

    // Rotation indicator
    if (obj.rotY !== 0 && r > 5) {
      const rad = -obj.rotY * Math.PI / 180;
      ctx.strokeStyle = color + '60';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x + Math.sin(rad)*(r+6), s.y - Math.cos(rad)*(r+6));
      ctx.stroke();
    }

    // Main dot
    ctx.fillStyle = color;
    ctx.globalAlpha = (sel || hov) ? 1 : 0.8;
    ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;

    // Label
    if (cam.zoom > 1.5 || sel || hov) {
      ctx.font = `${sel?'600 ':''}${Math.max(9, 10 * cam.zoom/3)}px 'Outfit',sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(0,0,0,.6)';
      ctx.fillText(obj.prefab, s.x+1, s.y + r + 12 + 1);
      ctx.fillStyle = (sel||hov) ? '#fff' : color + 'cc';
      ctx.fillText(obj.prefab, s.x, s.y + r + 12);
    }
  });
}

function drawGhost() {
  if ((tool !== 'place' || !selectedPrefab) && !spaceHeld) return;
  if (!lastMouse || tool !== 'place') return;

  const w = s2w(lastMouse.x, lastMouse.y);
  const wx = snap(w.x), wz = snap(w.z);
  const s = w2s(wx, wz);
  const cat = PREFAB_CAT[selectedPrefab];
  const color = cat ? cat.hex : '#888';

  ctx.globalAlpha = 0.4;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(s.x, s.y, 8, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;

  ctx.font = '10px Outfit,sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = color + '80';
  ctx.fillText(selectedPrefab, s.x, s.y + 18);
  ctx.fillStyle = '#ffffff40';
  ctx.fillText(`(${wx.toFixed(0)}, ${wz.toFixed(0)})`, s.x, s.y + 30);
}

function drawMinimap() {
  const mw=180, mh=130;
  const worldW = WORLD.maxX - WORLD.minX;
  const worldH = WORLD.maxZ - WORLD.minZ;
  const sc = Math.min(mw/worldW, mh/worldH) * 0.9;
  const ox = (mw - worldW*sc)/2;
  const oy = (mh - worldH*sc)/2;

  mctx.fillStyle = '#080b10';
  mctx.fillRect(0,0,mw,mh);

  // Tiles — match terrain colors
  const miniPalMap = { frost_valley:'#3c7858', rolling_hills:'#326e2d', forest:'#1e5023', volcanic:'#503c28' };
  TILES.forEach(t => {
    const x = ox + (t.x - WORLD.minX)*sc;
    const y = oy + (WORLD.maxZ - t.z - TILE)*sc;
    mctx.fillStyle = miniPalMap[t.r] || '#335';
    mctx.fillRect(x, y, TILE*sc, TILE*sc);
    mctx.strokeStyle = 'rgba(255,255,255,.06)';
    mctx.lineWidth = 0.5;
    mctx.strokeRect(x, y, TILE*sc, TILE*sc);
  });

  // Objects
  objects.forEach(obj => {
    const cat = PREFAB_CAT[obj.prefab];
    mctx.fillStyle = cat ? cat.hex : '#888';
    const mx = ox + (obj.x - WORLD.minX)*sc;
    const my = oy + (WORLD.maxZ - obj.z)*sc;
    mctx.beginPath(); mctx.arc(mx, my, 1.5, 0, Math.PI*2); mctx.fill();
  });

  // Viewport rect
  const vw = area.clientWidth / cam.zoom;
  const vh = area.clientHeight / cam.zoom;
  const vp = document.getElementById('mvp');
  vp.style.left = (ox + (cam.x - vw/2 - WORLD.minX)*sc) + 'px';
  vp.style.top = (oy + (WORLD.maxZ - cam.z - vh/2)*sc) + 'px';
  vp.style.width = (vw*sc) + 'px';
  vp.style.height = (vh*sc) + 'px';
}

// ═══════════════════════════════════════
// BUILD SIDEBAR
// ═══════════════════════════════════════
function buildPalette() {
  const pal = document.getElementById('palette');
  pal.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const div = document.createElement('div');
    div.className = 'cat';
    div.innerHTML = `<div class="cat-head">
      <div class="dot" style="background:${cat.hex}"></div>
      ${cat.name}
      <span class="ct">${cat.items.length}</span>
      <span class="arr">▼</span>
    </div><div class="cat-items"></div>`;

    const head = div.querySelector('.cat-head');
    head.onclick = () => div.classList.toggle('closed');

    const items = div.querySelector('.cat-items');
    cat.items.forEach(name => {
      const p = document.createElement('div');
      p.className = 'prefab';
      p.innerHTML = `<div class="ico" style="background:${cat.hex}22;color:${cat.hex}">${cat.icon}</div><span class="nm">${name}</span>`;
      p.onclick = (e) => {
        e.stopPropagation();
        document.querySelectorAll('.prefab.selected').forEach(el => el.classList.remove('selected'));
        p.classList.add('selected');
        selectedPrefab = name;
        setTool('place');
      };
      items.appendChild(p);
    });
    pal.appendChild(div);
  });
}
buildPalette();

// ═══════════════════════════════════════
// TOOLS
// ═══════════════════════════════════════
function setTool(t) {
  tool = t;
  document.querySelectorAll('#toolbar .tb[data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool === t));
  document.getElementById('hud-tool').textContent = t.toUpperCase();
  cv.style.cursor = t==='place'?'crosshair':t==='pan'?'grab':'default';
}

document.querySelectorAll('#toolbar .tb[data-tool]').forEach(b => {
  b.onclick = () => setTool(b.dataset.tool);
});

document.getElementById('snap-cb').onchange = (e) => { snapGrid = e.target.checked; };

// ═══════════════════════════════════════
// INTERACTION
// ═══════════════════════════════════════
let lastMouse = null;

function findObj(wx, wz) {
  const thresh = 8 / cam.zoom;
  let best = null, bestD = thresh;
  objects.forEach(obj => {
    const d = Math.hypot(obj.x - wx, obj.z - wz);
    if (d < bestD) { bestD = d; best = obj; }
  });
  return best;
}

function updateObjCount() {
  document.getElementById('obj-count').textContent = `${objects.length} object${objects.length===1?'':'s'}`;
}

function updateSelHud() {
  const h = document.getElementById('hud-sel');
  if (!selectedObj) { h.style.display = 'none'; return; }
  h.style.display = 'block';
  h.innerHTML = `<b>${selectedObj.prefab}</b> (${selectedObj.x.toFixed(1)}, ${selectedObj.z.toFixed(1)}) rot:${selectedObj.rotY}° <button id="del-btn">✕ DEL</button>`;
  document.getElementById('del-btn').onclick = () => deleteSelected();
}

function deleteSelected() {
  if (!selectedObj) return;
  objects = objects.filter(o => o !== selectedObj);
  selectedObj = null;
  updateSelHud(); updateObjCount();
}

cv.addEventListener('mousedown', e => {
  const rect = cv.getBoundingClientRect();
  const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  const w = s2w(sx, sy);

  if (e.button === 1 || (e.button === 0 && spaceHeld)) {
    panning = { sx: e.clientX, sy: e.clientY, cx: cam.x, cz: cam.z };
    cv.style.cursor = 'grabbing';
    return;
  }

  if (e.button !== 0) return;

  if (tool === 'select') {
    const obj = findObj(w.x, w.z);
    if (obj) {
      selectedObj = obj;
      dragging = { obj, offX: obj.x - w.x, offZ: obj.z - w.z };
      cv.style.cursor = 'grabbing';
    } else {
      selectedObj = null;
      panning = { sx: e.clientX, sy: e.clientY, cx: cam.x, cz: cam.z };
    }
    updateSelHud();
  } else if (tool === 'place' && selectedPrefab) {
    const nx = snap(w.x), nz = snap(w.z);
    const obj = { id: nextId++, prefab: selectedPrefab, x: nx, y: 0, z: nz, rotY: 0 };
    objects.push(obj);
    selectedObj = obj;
    updateObjCount(); updateSelHud();
  } else if (tool === 'pan') {
    panning = { sx: e.clientX, sy: e.clientY, cx: cam.x, cz: cam.z };
    cv.style.cursor = 'grabbing';
  }
});

cv.addEventListener('mousemove', e => {
  const rect = cv.getBoundingClientRect();
  const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  lastMouse = { x: sx, y: sy };
  const w = s2w(sx, sy);

  document.getElementById('hud-coords').textContent = `${w.x.toFixed(1)}, ${w.z.toFixed(1)}`;

  if (dragging) {
    dragging.obj.x = snap(w.x + dragging.offX);
    dragging.obj.z = snap(w.z + dragging.offZ);
    updateSelHud();
  } else if (panning) {
    cam.x = panning.cx - (e.clientX - panning.sx) / cam.zoom;
    cam.z = panning.cz + (e.clientY - panning.sy) / cam.zoom;
  } else {
    hoveredObj = findObj(w.x, w.z);
    if (tool === 'select') cv.style.cursor = hoveredObj ? 'pointer' : 'default';
  }
});

cv.addEventListener('mouseup', () => {
  dragging = null; panning = null;
  if (tool === 'select') cv.style.cursor = hoveredObj ? 'pointer' : 'default';
  else if (tool === 'pan') cv.style.cursor = 'grab';
  else if (tool === 'place') cv.style.cursor = 'crosshair';
});

cv.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 0.9 : 1.1;
  const newZoom = Math.max(0.3, Math.min(20, cam.zoom * factor));

  // Zoom toward mouse
  const rect = cv.getBoundingClientRect();
  const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  const w1 = s2w(sx, sy);
  cam.zoom = newZoom;
  const w2 = s2w(sx, sy);
  cam.x -= (w2.x - w1.x);
  cam.z -= (w2.z - w1.z);

  document.getElementById('hud-zoom').textContent = `${Math.round(cam.zoom * 33)}%`;
}, {passive:false});

cv.addEventListener('contextmenu', e => {
  e.preventDefault();
  if (selectedObj) {
    selectedObj.rotY = (selectedObj.rotY + 15) % 360;
    updateSelHud();
  }
});

// Minimap click
document.getElementById('minimap').addEventListener('click', e => {
  const rect = mcv.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const mw=180, mh=130;
  const worldW = WORLD.maxX - WORLD.minX;
  const worldH = WORLD.maxZ - WORLD.minZ;
  const sc = Math.min(mw/worldW, mh/worldH)*0.9;
  const ox = (mw-worldW*sc)/2, oy = (mh-worldH*sc)/2;
  cam.x = (mx-ox)/sc + WORLD.minX;
  cam.z = WORLD.maxZ - (my-oy)/sc;
});

// ═══════════════════════════════════════
// KEYBOARD
// ═══════════════════════════════════════
addEventListener('keydown', e => {
  if (e.key === ' ') { spaceHeld = true; e.preventDefault(); }
  if (e.key === 'Escape') { selectedObj = null; selectedPrefab = null; document.querySelectorAll('.prefab.selected').forEach(el=>el.classList.remove('selected')); setTool('select'); updateSelHud(); }
  if (e.key === 'Delete' || e.key === 'Backspace') { deleteSelected(); }
  if (e.key === 'r' || e.key === 'R') { if(selectedObj){selectedObj.rotY=(selectedObj.rotY+15)%360;updateSelHud();} }
  if (e.key === 'v' || e.key === 'V') setTool('select');
  if (e.key === 'p' || e.key === 'P') setTool('place');
});
addEventListener('keyup', e => {
  if (e.key === ' ') spaceHeld = false;
});

// ═══════════════════════════════════════
// EXPORT / IMPORT
// ═══════════════════════════════════════
document.getElementById('btn-export').onclick = () => {
  const data = {
    version: 1,
    objects: objects.map(o => ({ prefab: o.prefab, x: Math.round(o.x*10)/10, y: 0, z: Math.round(o.z*10)/10, rotY: o.rotY }))
  };
  const json = JSON.stringify(data, null, 2);

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal">
    <h2>Export Layout — ${objects.length} objects</h2>
    <textarea readonly>${json}</textarea>
    <div class="btns">
      <button class="btn" onclick="this.closest('.modal-overlay').remove()">Close</button>
      <button class="btn primary" id="copy-btn">Copy to Clipboard</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#copy-btn').onclick = () => {
    navigator.clipboard.writeText(json);
    overlay.querySelector('#copy-btn').textContent = 'Copied!';
  };
  overlay.onclick = e => { if(e.target===overlay) overlay.remove(); };
};

document.getElementById('btn-import').onclick = () => {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal">
    <h2>Import Layout JSON</h2>
    <textarea id="import-ta" placeholder="Paste JSON here..."></textarea>
    <div class="btns">
      <button class="btn" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
      <button class="btn primary" id="do-import">Import</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#do-import').onclick = () => {
    try {
      const data = JSON.parse(overlay.querySelector('#import-ta').value);
      if (data.objects) {
        objects = data.objects.map(o => ({ id: nextId++, prefab: o.prefab, x: o.x, y: o.y||0, z: o.z, rotY: o.rotY||0 }));
        updateObjCount(); updateSelHud();
      }
      overlay.remove();
    } catch(err) { alert('Invalid JSON: ' + err.message); }
  };
  overlay.onclick = e => { if(e.target===overlay) overlay.remove(); };
};

document.getElementById('btn-reset').onclick = () => {
  if (confirm('Reset to default game layout? Your changes will be lost.')) {
    objects = DEFAULT_LAYOUT.objects.map(o => ({ id: nextId++, prefab: o.prefab, x: o.x, y: o.y||0, z: o.z, rotY: o.rotY||0 }));
    localStorage.removeItem('mapdesigner_layout');
    selectedObj = null; updateObjCount(); updateSelHud();
    cam = { x: TC.x, z: TC.z, zoom: 4 };
  }
};

document.getElementById('btn-clear').onclick = () => {
  if (objects.length && confirm(`Delete all ${objects.length} objects?`)) {
    objects = []; selectedObj = null; updateObjCount(); updateSelHud();
  }
};

// ═══════════════════════════════════════

    { prefab:"Town Hall",    x:TC.x+0,   y:0, z:TC.z+0,    rotY:0 },

    { prefab:"Start House",  x:TC.x-6,   y:0, z:TC.z-10,   rotY:-10 },

    { prefab:"Elder Frost",     x:-15, y:0, z:3,   rotY:0 },

  ]
};

// ═══════════════════════════════════════
// INIT — load from localStorage, fallback to default
// ═══════════════════════════════════════
try {
  const saved = localStorage.getItem('mapdesigner_layout');
  if (saved) {
    const data = JSON.parse(saved);
    if (data.objects && data.objects.length > 0) {
      objects = data.objects.map(o => ({ id: nextId++, prefab: o.prefab, x: o.x, y: o.y||0, z: o.z, rotY: o.rotY||0 }));
    } else {
      throw 'empty';
    }
  } else {
    throw 'no save';
  }
} catch(e) {
  // Load default layout
  objects = DEFAULT_LAYOUT.objects.map(o => ({ id: nextId++, prefab: o.prefab, x: o.x, y: o.y||0, z: o.z, rotY: o.rotY||0 }));
}

// Start camera centered on the town
cam = { x: TC.x, z: TC.z, zoom: 4 };

// Autosave every 10s
setInterval(() => {
  const data = { version:1, objects: objects.map(o => ({ prefab:o.prefab, x:Math.round(o.x*10)/10, y:0, z:Math.round(o.z*10)/10, rotY:o.rotY })) };
  localStorage.setItem('mapdesigner_layout', JSON.stringify(data));
}, 10000);

updateObjCount();
draw();
</script>
