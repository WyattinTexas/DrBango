<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battle of Origins — Board Game</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <!-- TITLE SCREEN -->
  <div class="screen active" id="titleScreen">
    <div class="title-main">Battle of Origins</div>
    <div class="title-divider"></div>
    <div class="title-sub">The Board Game</div>
    <div class="title-desc">
      Travel the spirit world. Find items. Make choices. Battle monsters. Defeat the Mountain King.
    </div>
    <div class="title-buttons">
      <button class="action-btn cyan ready" onclick="startNewGame()">New Adventure</button>
      <button class="action-btn gold ready" id="continueBtn" onclick="continueGame()" style="display:none;font-size:1.1rem;padding:10px 36px;">Continue</button>
    </div>
    <div class="version-tag">v0.3</div>
  </div>

  <!-- STARTER PICK -->
  <div class="screen" id="pickScreen">
    <div class="pick-header">Choose Your Spiritkin</div>
    <div class="pick-grid" id="pickGrid"></div>
    <div class="pick-info" id="pickInfo"></div>
    <button class="action-btn cyan" id="pickBtn" onclick="confirmStarter()">Choose</button>
  </div>

  <!-- MAP SCREEN -->
  <div class="screen" id="mapScreen">
    <div class="team-hud" id="teamHud"></div>
    <div class="resource-strip" id="resourceStrip"></div>
    <div class="map-container" id="mapContainer">
      <div class="map-terrain" id="mapTerrain"></div>
      <div class="region-banner" id="regionBanner"></div>
      <canvas id="mapCanvas"></canvas>
      <div class="map-nodes" id="mapNodes"></div>
    </div>
    <div class="map-info-panel" id="mapInfoPanel"></div>
  </div>

  <!-- EVENT SCREEN -->
  <div class="screen" id="eventScreen">
    <div class="event-title" id="eventTitle"></div>
    <div class="event-desc" id="eventDesc"></div>
    <div class="event-choices" id="eventChoices"></div>
  </div>

  <!-- PRE-BATTLE -->
  <div class="screen" id="prebattleScreen">
    <div class="pb-title" id="pbTitle"></div>
    <div class="pb-vs-row">
      <div class="pb-side">
        <div class="pb-card player-side" id="pbPlayerCard"></div>
        <div class="pb-label player-label" id="pbPlayerName"></div>
      </div>
      <div class="pb-vs-text">VS</div>
      <div class="pb-side">
        <div class="pb-card enemy-side" id="pbEnemyCard"></div>
        <div class="pb-label enemy-label" id="pbEnemyName"></div>
      </div>
    </div>
    <div class="pb-stats" id="pbStats"></div>
    <div class="pb-ghost-select" id="pbGhostSelect"></div>
    <button class="action-btn cyan ready" onclick="startBattle()">Fight!</button>
  </div>

  <!-- BATTLE SCREEN -->
  <div class="screen" id="battleScreen">
    <!-- Enemy side -->
    <div class="battle-top">
      <div class="battle-card-zone enemy-zone">
        <div class="battle-card" id="enemyCard"></div>
        <div class="battle-info-stack">
          <div class="battle-name enemy-name" id="enemyNameText"></div>
          <div class="battle-ability-tag" id="enemyAbilityTag"></div>
          <div class="hp-bar-wrap"><div class="hp-bar enemy-hp" id="enemyHpBar"></div></div>
          <div class="hp-label"><span id="enemyHpText"></span></div>
        </div>
      </div>
    </div>

    <!-- Dice arena -->
    <div class="battle-arena">
      <div class="dice-section">
        <div class="dice-owner-label enemy-label-sm" id="enemyDiceLabel"></div>
        <div class="dice-row" id="enemyDiceRow">
          <div class="die e" id="eDie0"></div>
          <div class="die e" id="eDie1"></div>
          <div class="die e" id="eDie2"></div>
          <div class="die e bonus" id="eDie3"></div>
          <div class="die e bonus" id="eDie4"></div>
          <div class="die e bonus" id="eDie5"></div>
          <div class="die e bonus" id="eDie6"></div>
        </div>
        <div class="roll-type-tag" id="enemyRollTag"></div>
      </div>

      <div class="vs-divider">VS</div>

      <div class="dice-section">
        <div class="dice-row" id="playerDiceRow">
          <div class="die p" id="pDie0"></div>
          <div class="die p" id="pDie1"></div>
          <div class="die p" id="pDie2"></div>
          <div class="die p bonus" id="pDie3"></div>
          <div class="die p bonus" id="pDie4"></div>
          <div class="die p bonus" id="pDie5"></div>
          <div class="die p bonus" id="pDie6"></div>
        </div>
        <div class="roll-type-tag player-tag" id="playerRollTag"></div>
        <div class="dice-owner-label player-label-sm" id="playerDiceLabel"></div>
      </div>
    </div>

    <!-- Narrator log — the story of the battle -->
    <div class="battle-narrator">
      <div class="narrator-log" id="narratorLog"></div>
    </div>

    <!-- Resource bar -->
    <div class="battle-resources" id="battleResources"></div>

    <!-- Items + Roll button -->
    <div class="battle-controls">
      <div class="battle-items" id="battleItems"></div>
      <button class="roll-btn" id="rollBtn" onclick="doPlayerRoll()">Roll Your Dice!</button>
    </div>

    <!-- Player side -->
    <div class="battle-bottom">
      <div class="battle-card-zone player-zone">
        <div class="battle-card" id="playerCard"></div>
        <div class="battle-info-stack">
          <div class="battle-name player-name" id="playerNameText"></div>
          <div class="battle-ability-tag player-ability" id="playerAbilityTag"></div>
          <div class="hp-bar-wrap"><div class="hp-bar player-hp" id="playerHpBar"></div></div>
          <div class="hp-label"><span id="playerHpText"></span></div>
        </div>
        <div class="battle-sideline" id="battleSideline"></div>
      </div>
    </div>
  </div>

  <!-- REWARD SCREEN -->
  <div class="screen" id="rewardScreen">
    <div class="reward-title" id="rewardTitle">Victory!</div>
    <div class="reward-loot" id="rewardLoot"></div>
    <div class="reward-ghost-pick" id="rewardGhostPick"></div>
    <button class="action-btn cyan ready" onclick="collectAndReturn()">Continue</button>
  </div>

  <!-- GAME OVER -->
  <div class="screen" id="gameoverScreen">
    <div class="gameover-title">Game Over</div>
    <div class="gameover-stats" id="gameoverStats"></div>
    <button class="action-btn red ready" onclick="startNewGame()">Try Again</button>
  </div>

  <!-- VICTORY -->
  <div class="screen" id="winScreen">
    <div class="win-title">Champion!</div>
    <div class="win-stats" id="winStats"></div>
    <button class="action-btn cyan ready" onclick="startNewGame()">Play Again</button>
    <div class="cta-footer"><a href="https://www.BattleOfOrigins.com" target="_blank">BattleOfOrigins.com</a></div>
  </div>
</div>

<!-- Reserve panel -->
<div class="reserve-overlay" id="reserveOverlay">
  <div class="reserve-panel">
    <div class="reserve-header">
      <div class="reserve-title">Reserve Inventory</div>
      <button class="reserve-close" onclick="closeReservePanel()">×</button>
    </div>
    <div class="reserve-subtitle">Swap any ghost into your sideline</div>
    <div class="reserve-list" id="reserveList"></div>
  </div>
</div>

<!-- Overlays -->
<div class="overlay" id="readyGoOverlay"><div class="overlay-text" id="readyGoText"></div></div>
<div class="impact-flash" id="impactFlash"></div>
<div class="ability-splash" id="abilitySplash">
  <div class="ability-splash-inner">
    <div class="ability-splash-name" id="splashName"></div>
    <div class="ability-splash-desc" id="splashDesc"></div>
  </div>
</div>
<div class="triples-banner" id="triplesBanner">TRIPLES!</div>

<!-- Boss Ceremony Overlay — Zelda-style relic acquisition -->
<div class="boss-ceremony" id="bossCeremony">
  <div class="ceremony-particles" id="ceremonyParticles"></div>
  <div class="ceremony-light-beam" id="ceremonyBeam"></div>
  <div class="ceremony-relic-wrap">
    <div class="ceremony-relic" id="ceremonyRelic"></div>
    <div class="ceremony-relic-glow" id="ceremonyGlow"></div>
  </div>
  <div class="ceremony-label" id="ceremonyLabel"></div>
  <div class="ceremony-sublabel" id="ceremonySublabel"></div>
</div>

<audio id="sfxDiceRoll" src="../boo/DiceRoll.mp3" preload="auto"></audio>
<audio id="sfx1Damage" src="../boo/1Damage.mp3" preload="auto"></audio>
<audio id="sfx2Damage" src="../boo/2Damage.mp3" preload="auto"></audio>
<audio id="sfx3Damage" src="../boo/3Damage.mp3" preload="auto"></audio>
<audio id="sfxSpecial" src="../boo/Special.mp3" preload="auto"></audio>

<div class="watermark">CORKSCREW GAMES</div>

<script src="data.js"></script>
<script src="map.js"></script>
<script src="battle.js"></script>
<script src="game.js"></script>
</body>
</html>
