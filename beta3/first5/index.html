<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>STARSPELL</title>
<style>
  html, body { margin:0; padding:0; background:#0a0d1c; height:100%; overflow:hidden; overscroll-behavior:none; }
  canvas { display:block; }
  /* portrait-only on touch devices: the night sky is tall. Pure CSS — pointer:coarse
     keeps desktop landscape windows (which letterbox fine) out of it. The veil sits
     over the canvas and swallows the touches; rotating back resumes where you were. */
  #rotate-veil { display:none; position:fixed; inset:0; z-index:99; background:#0a0d1c;
    flex-direction:column; align-items:center; justify-content:center; gap:16px;
    color:#f3e5b4; font:italic bold 17px Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    text-align:center; padding:0 34px; }
  #rotate-veil .ph { font-size:42px; font-style:normal; animation:ssrot 1.8s ease-in-out infinite alternate; }
  @keyframes ssrot { 0%, 35% { transform:rotate(90deg); } 75%, 100% { transform:rotate(0deg); } }
  @media (orientation: landscape) and (pointer: coarse) { #rotate-veil { display:flex; } }
</style>
</head>
<body>
<div id="rotate-veil"><div class="ph">📱</div><p id="rotate-msg">turn your phone upright to play</p></div>
<!-- FIRST5 sandbox (v0.7.0 — THE CLEAN REFRESH). Local copies carry ?v=f5-*
     stamps; shared assets (../vendor, ../words*, ../art via game.js) keep live
     beta3's stamps so the phone cache is shared. first5.js MUST stay the first
     script: it namespaces all storage before anything can touch it, and — ON
     THIS STAGE ONLY, never the live game — wipes the namespace on every fresh
     visit, so a pull-to-refresh is a true first open (scripted reloads carry
     the night via __f5survive, tagged F5-FIX1-01). NO Firebase here — net.js's
     own guard drops it to local mode: a test night never litters the live sky
     (no leaderboards, no presence, no versus rooms). -->
<script src="first5.js?v=f5-0.7.0"></script>
<script src="compat.js?v=f5-0.7.0"></script>
<script src="../vendor/phaser.min.js"></script>
<script src="../words.js?v=0.111.1"></script>
<script src="strings.js?v=f5-0.7.0"></script>
<script>try { document.getElementById('rotate-msg').textContent = SS_T('rotate'); } catch (e) { }</script>
<script src="packs.js?v=f5-0.7.0"></script>
<!-- boot() document.writes ../words-<lang>.js here for non-English gameplay
     languages, so the dictionary is resident before game.js parses -->
<script>SS_DICT.boot('0.31.1');</script>
<script src="data.js?v=f5-0.7.0"></script>
<script src="seed-names.js?v=f5-0.7.0"></script>
<script src="net.js?v=f5-0.7.0"></script>
<script src="audio.js?v=f5-0.7.0"></script>
<script src="game.js?v=f5-0.7.0"></script>
<script src="versus.js?v=f5-0.7.0"></script>
<script src="rival.js?v=f5-0.7.0"></script>
</body>
</html>
