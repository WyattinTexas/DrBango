<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07060f">
<link rel="icon" href="data:,">
<title>Battle of Origins — Playable</title>
<style>
@font-face{font-family:'Lucky';src:url(assets/font/LuckiestGuy.woff2) format('woff2');font-display:swap}
:root{--w:390px;--h:844px;--u:calc(var(--w)/100);--v:calc(var(--h)/100)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#07060f;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;font-family:'Lucky','Arial Rounded MT Bold','Helvetica Neue',Arial,sans-serif;color:#fff}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#07060f}
#col{position:relative;width:var(--w);height:var(--h);overflow:hidden;background:#0d1320}
.screen{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .5s}
.screen.on{opacity:1;pointer-events:auto}
.fill{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
img{display:block;-webkit-user-drag:none}
.lucky{font-family:'Lucky','Arial Rounded MT Bold','Helvetica Neue',Arial,sans-serif;letter-spacing:.02em}
.stroke{-webkit-text-stroke:calc(var(--u)*.45) #1b0b2e;paint-order:stroke fill;text-shadow:0 calc(var(--u)*.6) 0 #1b0b2e,0 calc(var(--u)*1.2) calc(var(--u)*2) rgba(0,0,0,.6)}

/* ── TAP SCREEN ── */
#s-tap{cursor:pointer}
#s-tap .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.55) 100%)}
#tap-cta{position:absolute;left:0;right:0;top:62%;text-align:center;font-size:calc(var(--u)*11);color:#ffd84a;animation:tapPulse 1.4s ease-in-out infinite}
#tap-sub{position:absolute;left:0;right:0;top:73%;text-align:center;font-size:calc(var(--u)*4.2);color:#cfe6ff;letter-spacing:.08em;opacity:.9}
#tap-ring{position:absolute;left:50%;top:82%;width:calc(var(--u)*26);height:calc(var(--u)*26);margin-left:calc(var(--u)*-13);border-radius:50%;background:url(assets/ui/dice_bg.webp) center/contain no-repeat;animation:spinSlow 6s linear infinite}
#tap-ring img{position:absolute;left:19%;top:19%;width:62%;height:62%;object-fit:contain;animation:spinBack 6s linear infinite}
@keyframes tapPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes spinBack{to{transform:rotate(-360deg)}}

/* ── OPENER / OUTRO VIDEO ── */
#s-open,#s-cta{background:#000}
video.fill{background:#000}
#skip{position:absolute;right:4%;top:3%;font-size:calc(var(--u)*3.6);color:rgba(255,255,255,.7);padding:.4em .9em;border:1px solid rgba(255,255,255,.35);border-radius:2em;opacity:0;transition:opacity .4s}
#skip.on{opacity:1}

/* ── GAME ── */
#s-game{transition:opacity .6s}
#bg .bgimg{transition:transform 1.6s cubic-bezier(.2,.7,.2,1)}
#bg-mountains{position:absolute;left:50%;top:29%;width:150%;transform:translate(-50%,40%);opacity:0;transition:transform 1.4s cubic-bezier(.2,.8,.2,1),opacity 1s}
#bg-mountains.up{transform:translate(-50%,0);opacity:1}
#dark{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 28%,rgba(30,10,50,.2),rgba(4,2,14,.82) 75%);opacity:0;transition:opacity 1.2s;pointer-events:none}
#dark.on{opacity:1}
#mk{position:absolute;inset:0;pointer-events:none}
#mk img{position:absolute;opacity:0;transition:transform 1.5s cubic-bezier(.2,.8,.2,1),opacity 1s}
#mk-head{left:50%;top:3%;width:64%;transform:translate(-50%,60%) scale(.8);filter:drop-shadow(0 0 calc(var(--u)*6) rgba(180,220,255,.55))}
#mk.on #mk-head{transform:translate(-50%,0) scale(1);opacity:1}
#mk-cloud-l{left:-8%;top:25%;width:66%;transform:translateX(-40%)}
#mk-cloud-r{right:-8%;top:25%;width:66%;transform:translateX(40%)}
#mk.on #mk-cloud-l,#mk.on #mk-cloud-r{transform:translateX(0);opacity:1}
#mk-hands{position:absolute;inset:0;pointer-events:none;z-index:12}
#mk-hands img{position:absolute;opacity:0;transition:transform 1.5s cubic-bezier(.2,.8,.2,1),opacity 1s;filter:drop-shadow(0 calc(var(--u)*1.5) calc(var(--u)*2) rgba(0,0,0,.55))}
#mk-hand-l{left:-4%;top:29%;width:40%;transform:translateY(50%) rotate(-10deg);transform-origin:50% 100%}
#mk-hand-r{right:-4%;top:29%;width:40%;transform:translateY(50%) rotate(10deg);transform-origin:50% 100%}
#mk-hands.on #mk-hand-l,#mk-hands.on #mk-hand-r{transform:translateY(0) rotate(0);opacity:1;transition-delay:.35s}
#mk-swipe{position:absolute;right:-45%;top:38%;width:52%;opacity:0;pointer-events:none;z-index:40;transform:rotate(-15deg);filter:drop-shadow(0 0 calc(var(--u)*4) rgba(180,230,255,.7))}
#mk-swipe.go{animation:swipe .75s cubic-bezier(.3,.1,.2,1) forwards}
@keyframes swipe{0%{opacity:0;transform:translateX(0) rotate(-15deg)}15%{opacity:1}55%{opacity:1;transform:translateX(-120%) rotate(15deg) scale(1.15)}100%{opacity:0;transform:translateX(-200%) rotate(30deg) scale(1.2)}}
#rocks{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#rocks img{position:absolute;width:60%;opacity:0}
#rocks img.fall{animation:rockFall 1.5s cubic-bezier(.4,0,.8,.4) forwards}
@keyframes rockFall{0%{opacity:0;transform:translateY(-40%)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translateY(120%)}}
.flame{position:absolute;width:15%;mix-blend-mode:screen;opacity:.92;pointer-events:none}
#fl-tl{left:1%;top:19%}#fl-tr{right:1%;top:19%}#fl-bl{left:-1%;top:62%}#fl-br{right:-1%;top:62%}

/* enemy zone */
.ghost{position:absolute;filter:drop-shadow(0 calc(var(--u)*2) calc(var(--u)*2) rgba(0,0,0,.45));transition:opacity .6s,transform .6s;opacity:0;transform:translateY(40%)}
.ghost.in{opacity:1;transform:translateY(0)}
#g-left{left:7%;top:13%;height:12%;animation:bob 3.2s ease-in-out infinite}
#g-center{left:50%;top:12.5%;height:15.5%;margin-left:-7.5%;animation:bob 2.6s ease-in-out infinite .4s}
#g-right{right:5%;top:12.5%;height:13%;animation:bob 3.5s ease-in-out infinite .9s}
.ghost.in{animation-play-state:running}
@keyframes bob{0%,100%{margin-top:0}50%{margin-top:calc(var(--v)*-1.2)}}
.ghost.hit{animation:hitShake .5s ease-out 1!important;filter:brightness(1.8) saturate(.3) drop-shadow(0 0 calc(var(--u)*3) #fff)}
.ghost.ko{transition:opacity 1s,transform 1s;opacity:0!important;transform:translateY(-10%) scale(1.25)!important;filter:brightness(2.5)}
.ghost.flee{transition:opacity .8s,transform .8s;opacity:0!important;transform:translateY(-90%) scale(.8)!important}
@keyframes hitShake{0%{transform:translate(0,0)}20%{transform:translate(-4%,2%)}40%{transform:translate(4%,-2%)}60%{transform:translate(-3%,1%)}80%{transform:translate(3%,0)}100%{transform:translate(0,0)}}
#e-burst{position:absolute;left:50%;top:15%;width:36%;margin-left:-18%;opacity:0;pointer-events:none;z-index:30}
#e-burst.go{animation:burst .9s ease-out forwards}
@keyframes burst{0%{opacity:0;transform:scale(.3)}25%{opacity:1;transform:scale(1.1)}60%{opacity:1;transform:translateY(120%) scale(.7)}100%{opacity:0;transform:translateY(190%) scale(.5)}}
.orb{position:absolute;width:30%;left:50%;top:14%;margin-left:-15%;opacity:0;pointer-events:none;z-index:29}
.orb.go{animation:orb .8s ease-out forwards}
@keyframes orb{0%{opacity:0;transform:scale(.4)}30%{opacity:.95;transform:scale(1.15)}100%{opacity:0;transform:scale(1.8)}}

/* HUDs */
.hud{position:absolute;left:3%;width:94%;height:9.2%;opacity:0;transform:translateX(-30%);transition:opacity .6s,transform .6s}
.hud.in{opacity:1;transform:none}
.hud .plate{position:absolute;left:0;top:0;height:92%;filter:drop-shadow(0 calc(var(--u)*.8) calc(var(--u)*1) rgba(0,0,0,.6))}
#hud-e,#hud-mk{top:2%}
#hud-mk{transform:translateX(30%)}
#hud-mk.in{transform:none}
.bar{position:absolute;top:22%;height:34%;border-radius:.5em;background:rgba(10,6,20,.78);border:calc(var(--u)*.5) solid rgba(255,255,255,.25);box-shadow:inset 0 0 calc(var(--u)*1.5) rgba(0,0,0,.9)}
.bar-fill{position:absolute;left:2%;top:12%;width:96%;height:76%;object-fit:fill;transition:clip-path .7s cubic-bezier(.2,.8,.2,1)}
.bar-fill.low{filter:hue-rotate(-40deg) saturate(1.4)}
.bar-txt{position:absolute;right:5%;top:-115%;font-size:calc(var(--u)*3.4);color:#fff;letter-spacing:.06em}
.hud-name{position:absolute;font-size:calc(var(--u)*3.6);color:#ffe9a8;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud-e .bar{left:44%;width:53%}
#hud-e .hud-name{left:44%;top:58%;width:53%}
#hud-mk .plate{height:88%}
#hud-mk .bar{left:57%;width:41%;top:16%}
#hud-mk .hud-name{left:57%;top:55%;width:41%}
#hud-p{top:76.5%;height:11%;transform:translateX(-30%)}
#hud-p.in{transform:none}
#hud-p .plate{height:58%;top:2%}
#hud-p .bar{left:36%;width:40%;top:14%;height:26%}
#hud-p .hud-name{left:36%;top:44%;width:40%}
#shards{position:absolute;left:1%;top:64%;height:34%;display:flex;align-items:center;gap:.5em;padding:0 .7em 0 .3em;border-radius:2em;background:rgba(10,20,40,.72);border:calc(var(--u)*.4) solid rgba(120,200,255,.45);transition:box-shadow .4s}
#shards img{height:120%;filter:drop-shadow(0 0 calc(var(--u)*1) rgba(120,220,255,.8))}
#shards-n{font-size:calc(var(--u)*4.4);color:#bff1ff;min-width:1.1em;text-align:center}
#shards-l{font-size:calc(var(--u)*2.6);color:#8fd3ff;letter-spacing:.08em}
#shards.ready{box-shadow:0 0 calc(var(--u)*3) rgba(120,220,255,.95),0 0 calc(var(--u)*8) rgba(80,180,255,.6);animation:readyPulse 1s ease-in-out infinite}
@keyframes readyPulse{50%{box-shadow:0 0 calc(var(--u)*5) #bff1ff,0 0 calc(var(--u)*12) rgba(80,180,255,.8)}}
#shards.gain{animation:gain .5s ease-out 1}
@keyframes gain{50%{transform:scale(1.18)}}

/* flag */
#flag{position:absolute;right:26%;top:69.5%;width:13%;transform-origin:50% 0;opacity:0;transition:opacity .4s;pointer-events:none;filter:drop-shadow(0 calc(var(--u)*.8) calc(var(--u)*1) rgba(0,0,0,.5))}
#flag.on{opacity:1;animation:swing 1.6s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}

/* dice */
#dice-arena{position:absolute;top:30.5%;left:4%;width:92%;height:27%;z-index:20;pointer-events:none}
.die-physics{position:absolute;z-index:10;perspective:350px;pointer-events:none}
.die-cube{width:100%;height:100%;position:relative;transform-style:preserve-3d}
.die-face{position:absolute;width:100%;height:100%;border-radius:18%;box-sizing:border-box;backface-visibility:hidden;border:1px solid rgba(0,0,0,.35);box-shadow:inset 0 -3px 5px rgba(0,0,0,.28),inset 0 2px 3px rgba(255,255,255,.55)}
.die-face.face-green{background:radial-gradient(circle at 32% 28%,#e2ffb8 0%,#9be85e 38%,#5cb52a 75%,#2f7a14 100%)}
.die-face.face-blue{background:radial-gradient(circle at 32% 28%,#e0f6ff 0%,#6cc4ff 38%,#2f8be0 75%,#164f9c 100%)}
.face-front{transform:translateZ(var(--dh))}.face-back{transform:rotateY(180deg) translateZ(var(--dh))}
.face-right{transform:rotateY(90deg) translateZ(var(--dh))}.face-left{transform:rotateY(-90deg) translateZ(var(--dh))}
.face-top{transform:rotateX(-90deg) translateZ(var(--dh))}.face-bottom{transform:rotateX(90deg) translateZ(var(--dh))}
.pip3d{position:absolute;width:19%;height:19%;border-radius:50%;box-shadow:inset 0 2px 2px rgba(0,0,0,.65),0 1px 0 rgba(255,255,255,.35)}
.face-green .pip3d{background:#1d4a0e}.face-blue .pip3d{background:#0b2d5c}
.die-physics.settling .die-cube{transition:transform .35s cubic-bezier(.25,.1,.25,1)}
.die-physics.settling{transition:left .7s cubic-bezier(.25,1.1,.5,1),top .7s cubic-bezier(.25,1.1,.5,1)}
.die-physics::after{content:'';position:absolute;bottom:-12%;left:8%;width:84%;height:18%;background:radial-gradient(ellipse,rgba(0,0,0,.45),transparent 70%);border-radius:50%}
.die-physics.win{transform:scale(1.15);filter:drop-shadow(0 0 6px rgba(255,215,80,.95)) drop-shadow(0 0 16px rgba(255,190,50,.6));animation:winPulse 1.1s ease-in-out infinite}
.die-physics.win .die-face{border-color:#ffd54a!important;box-shadow:inset 0 0 0 2px #ffd54a,inset 0 -3px 5px rgba(0,0,0,.28)}
.die-physics.win3{transform:scale(1.25);animation:winPulse .8s ease-in-out infinite}
.die-physics.lose{opacity:.6;transform:scale(.9);filter:brightness(.6) saturate(.5);transition:opacity .4s,transform .4s,filter .4s}
@keyframes winPulse{50%{filter:drop-shadow(0 0 10px rgba(255,225,110,1)) drop-shadow(0 0 24px rgba(255,200,60,.8))}}

/* banner + narrator */
#banner{position:absolute;left:0;right:0;top:41.5%;text-align:center;font-size:calc(var(--u)*9);z-index:35;opacity:0;transform:scale(.5);transition:opacity .25s,transform .25s;pointer-events:none;letter-spacing:.03em}
#banner.on{opacity:1;transform:scale(1)}
#banner.win{color:#ffd84a}#banner.lose{color:#ff6a5a}#banner.tie{color:#dfe6ee}#banner.big{font-size:calc(var(--u)*12);color:#ffe98a}
#narr{position:absolute;left:4%;width:92%;top:58%;min-height:5.5%;z-index:36;display:flex;align-items:center;justify-content:center;text-align:center;padding:.35em .8em;border-radius:1.2em;background:rgba(8,5,20,.72);border:calc(var(--u)*.4) solid rgba(255,255,255,.18);font-size:calc(var(--u)*4.3);line-height:1.15;letter-spacing:.04em;color:#fff;opacity:0;transition:opacity .3s}
#narr.on{opacity:1}
#s-game.splashing #narr{opacity:0}
#narr b{color:#ffd84a}

/* player zone */
.pchar{position:absolute;filter:drop-shadow(0 calc(var(--u)*2) calc(var(--u)*2) rgba(0,0,0,.5));opacity:0;transform:translateY(30%);transition:opacity .6s,transform .6s}
.pchar.in{opacity:1;transform:translateY(0)}
#p-gary{left:50%;top:60.5%;height:17%;margin-left:-6%;z-index:22}
#p-larry{left:6%;top:68.5%;width:23%;z-index:21}
#p-dealer{right:8%;top:62.5%;height:13%;z-index:21}
.pchar.hit{animation:hitShake .5s ease-out 1!important;filter:brightness(1.6) sepia(1) saturate(4) hue-rotate(-30deg) drop-shadow(0 0 calc(var(--u)*3) #ff5a3a)}
.pchar.down{transition:opacity 1s,transform 1s;opacity:0!important;transform:translateY(25%) rotate(25deg) scale(.85)!important}
#p-power{position:absolute;left:50%;top:57%;width:44%;aspect-ratio:138/107;margin-left:-22%;z-index:23;background:url(assets/fx/gary_power_sheet.webp) 0 0/600% 400% no-repeat;opacity:0;pointer-events:none;mix-blend-mode:screen}

/* roll button */
#roll{position:absolute;right:3.5%;top:75.5%;width:21%;aspect-ratio:1;border:0;padding:0;background:none;cursor:pointer;z-index:40;opacity:.55;filter:grayscale(.7);transition:opacity .3s,filter .3s;font-family:inherit}
#roll .roll-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#roll .roll-die{position:absolute;left:18%;top:15%;width:64%;height:64%;object-fit:contain;transition:transform .2s}
#roll .roll-t{position:absolute;left:0;right:0;bottom:-28%;text-align:center;font-size:calc(var(--u)*4.2);color:#ffd84a;letter-spacing:.06em}
#roll.ready{opacity:1;filter:none;animation:rollPulse 1.1s ease-in-out infinite}
#roll.ready .roll-die{animation:dieWiggle 1.1s ease-in-out infinite}
#roll:active .roll-die{transform:scale(.9)}
@keyframes rollPulse{50%{transform:scale(1.08)}}
@keyframes dieWiggle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}

/* hand */
#hand{position:absolute;left:0;width:100%;top:88.5%;height:11%;display:flex;justify-content:center;align-items:flex-end;gap:2.5%;z-index:30}
.card{height:100%;border-radius:6%;filter:drop-shadow(0 calc(var(--u)*.8) calc(var(--u)*1.2) rgba(0,0,0,.6));opacity:0;transform:translateY(120%);transition:opacity .5s,transform .5s cubic-bezier(.2,.8,.2,1)}
.card.in{opacity:1;transform:translateY(0)}
#c-gary.in{transform:translateY(-8%) scale(1.08);box-shadow:0 0 calc(var(--u)*3) rgba(255,216,74,.9)}
.card.off{filter:grayscale(1) brightness(.7)}

/* ability splash */
#splash{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 45%,rgba(40,120,220,.55),rgba(5,10,30,.85) 70%);opacity:0;pointer-events:none;transition:opacity .3s}
#splash.on{opacity:1}
#sp-wrap{position:relative;width:60%;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
#sp-ring{position:absolute;width:118%;animation:spinSlow 5s linear infinite;filter:drop-shadow(0 0 calc(var(--u)*3) rgba(120,220,255,.9))}
#sp-card{position:relative;width:62%;border-radius:5%;box-shadow:0 0 calc(var(--u)*6) rgba(120,220,255,.9);transform:rotateY(90deg);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#splash.on #sp-card{transform:rotateY(0)}
#sp-shards{position:absolute;width:45%;left:52%;top:52%;opacity:0;transform:scale(.3) rotate(-30deg);transition:opacity .3s,transform .4s cubic-bezier(.2,.8,.2,1) .35s}
#splash.on #sp-shards{opacity:1;transform:scale(1) rotate(0)}
#sp-title{margin-top:calc(var(--v)*3);font-size:calc(var(--u)*11);color:#bff1ff;letter-spacing:.04em}
#sp-sub{font-size:calc(var(--u)*4.6);color:#fff;letter-spacing:.05em;text-align:center;padding:0 8%}
#sp-title.fire{color:#ff9a6a}#splash.fire{background:radial-gradient(ellipse at 50% 45%,rgba(220,80,60,.55),rgba(30,5,10,.85) 70%)}
#splash.purple{background:radial-gradient(ellipse at 50% 45%,rgba(160,60,220,.55),rgba(15,5,30,.88) 70%)}
#splash.purple #sp-title{color:#e6b3ff}

/* damage pops, flash, shard shots */
.pop{position:absolute;z-index:50;display:flex;align-items:center;gap:.15em;font-size:calc(var(--u)*7.5);color:#ff6a5a;pointer-events:none;animation:popUp 1.1s ease-out forwards;transform:translate(-50%,-50%)}
.pop img{height:1.1em}
.pop.heal{color:#8dffb0}
@keyframes popUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-150%) scale(1)}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:70}
#flash.go{animation:flash .45s ease-out 1}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
#col.shake{animation:colShake .5s ease-out 1}
@keyframes colShake{0%{transform:translate(0,0)}20%{transform:translate(-2%,1%)}40%{transform:translate(2%,-1%)}60%{transform:translate(-1.5%,1%)}80%{transform:translate(1.5%,-.5%)}100%{transform:translate(0,0)}}
.shot{position:absolute;width:16%;z-index:45;pointer-events:none;left:14%;top:78%;animation:shot .6s cubic-bezier(.3,0,.7,1) forwards;filter:drop-shadow(0 0 calc(var(--u)*1.5) rgba(140,230,255,.9))}
@keyframes shot{0%{opacity:0;transform:translate(0,0) rotate(20deg) scale(.6)}20%{opacity:1}100%{opacity:1;transform:translate(var(--dx),var(--dy)) rotate(-60deg) scale(1.1)}}
.spark{position:absolute;width:2.2%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#dfffb0,#7ddc3f 60%,transparent 70%);z-index:31;pointer-events:none;animation:spark .9s ease-out forwards}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}

/* CTA */
#cta-btn{position:absolute;left:25%;top:73.5%;width:50%;height:9%;border-radius:1.2em;text-decoration:none;opacity:0;pointer-events:none;transition:opacity .5s;box-shadow:0 0 0 rgba(120,200,255,0)}
#cta-btn.on{opacity:1;pointer-events:auto;animation:ctaGlow 1.4s ease-in-out infinite}
@keyframes ctaGlow{0%,100%{box-shadow:0 0 calc(var(--u)*2) rgba(140,210,255,.35)}50%{box-shadow:0 0 calc(var(--u)*7) rgba(140,210,255,.95)}}
#again{position:absolute;left:50%;top:94.6%;transform:translateX(-50%);padding:.35em 1.4em;border-radius:2em;border:calc(var(--u)*.4) solid rgba(255,255,255,.5);background:rgba(10,6,24,.7);color:#fff;font-family:inherit;font-size:calc(var(--u)*4.2);letter-spacing:.06em;opacity:0;pointer-events:none;transition:opacity .5s;cursor:pointer}
#again.on{opacity:1;pointer-events:auto}
#cta-fallback{position:absolute;left:0;right:0;top:12%;text-align:center;font-size:calc(var(--u)*7);line-height:1.1;display:none}
</style>
</head>

<script>
(function(){
'use strict';
const Q=new URLSearchParams(location.search);
const AUTO=Q.has('auto'), LONG=Q.has('longname'), SKIP=Q.has('skip'), LIVE=Q.has('live');
const $=id=>document.getElementById(id);
const col=$('col'), body=document.body;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=n=>Math.floor(Math.random()*n);
const CTA_URL='https://www.BattleOfOrigins.com';

/* ── column sizing: portrait column, full height, never scrolls ── */
function size(){const h=window.innerHeight,w=Math.min(window.innerWidth,Math.round(h*0.5625));
  document.documentElement.style.setProperty('--w',w+'px');document.documentElement.style.setProperty('--h',h+'px');}
size();addEventListener('resize',size);addEventListener('orientationchange',()=>setTimeout(size,80));

/* ── audio ── */
const SFX={};
[['click','click',.55],['shake','dice_shake',.7],['throw','dice_throw',.75],['water1','water1',.8],['water2','water2',.8],['water3','water3',.8],
 ['shine','shine',.65],['rocks','rocks',.7],['whoosh1','whoosh1',.5],['whoosh2','whoosh2',.55]].forEach(([k,f,v])=>{
  const a=new Audio('assets/sfx/'+f+'.mp3');a.preload='auto';a.volume=v;SFX[k]={a,v};});
let audioOK=false;
function unlock(){audioOK=true;Object.values(SFX).forEach(({a,v})=>{try{a.volume=0;const p=a.play();if(p)p.then(()=>{a.pause();a.currentTime=0;a.volume=v;}).catch(()=>{a.volume=v;});}catch(e){}});}
function sfx(k){if(!audioOK)return;const s=SFX[k];if(!s)return;try{s.a.currentTime=0;s.a.volume=s.v;s.a.play().catch(()=>{});}catch(e){}}
function stopSfx(k){const s=SFX[k];if(s){try{s.a.pause();s.a.currentTime=0;}catch(e){}}}

/* ── state ── */
const NAMES={p:LONG?'The Mountain King':'Gary',e:LONG?'The Mountain King':'Kodako',m:'The Mountain King'};
const S={screen:'tap',phase:'',round:0,scripted:true,p:{hp:6,max:6},e:{hp:6,max:6},m:{hp:24,max:24},shards:0,games:+(localStorage.getItem('boo_pl_games')||0),busy:false,boss:false};
S.scripted=!LIVE&&S.games===0;
function setScreen(n){S.screen=n;body.dataset.screen=n;['tap','open','game','cta'].forEach(k=>$('s-'+k).classList.toggle('on',k===n));}
function setPhase(p){S.phase=p;body.dataset.phase=p;}

/* ── HUD ── */
function bar(who){const c=S[who],fill=$({p:'p-fill',e:'e-fill',m:'m-fill'}[who]),txt=$({p:'p-hp',e:'e-hp',m:'m-hp'}[who]);
  const pct=Math.max(0,c.hp/c.max);fill.style.clipPath=`inset(0 ${Math.round((1-pct)*100)}% 0 0)`;fill.classList.toggle('low',pct<=.34);txt.textContent=`${Math.max(0,c.hp)}/${c.max}`;}
function names(){$('p-name').textContent=NAMES.p.toUpperCase();$('e-name').textContent=NAMES.e.toUpperCase();$('m-name').textContent=NAMES.m.toUpperCase();}
function shards(n,gain){S.shards=Math.max(0,n);$('shards-n').textContent=S.shards;const el=$('shards');el.classList.toggle('ready',S.shards>=4);
  if(gain){el.classList.remove('gain');void el.offsetWidth;el.classList.add('gain');}}
function narr(html){const n=$('narr');$('narr-t').innerHTML=html;n.classList.add('on');}
function banner(txt,cls){const b=$('banner');b.className='lucky stroke '+(cls||'');b.textContent=txt;void b.offsetWidth;b.classList.add('on');}
function hideBanner(){$('banner').classList.remove('on');}
function setReady(on){$('roll').classList.toggle('ready',on);$('flag').classList.toggle('on',on);setPhase(on?(S.boss?'mkready':'ready'):S.phase);if(on&&AUTO)setTimeout(()=>{if($('roll').classList.contains('ready'))onRoll();},700);}
function flash(){const f=$('flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');}
function shake(){col.classList.remove('shake');void col.offsetWidth;col.classList.add('shake');}
function pop(x,y,txt,heal){const d=document.createElement('div');d.className='pop lucky stroke'+(heal?' heal':'');d.style.left=x+'%';d.style.top=y+'%';
  d.innerHTML=(heal?'':'<img src="assets/ui/red_gem.webp" alt="">')+'<span>'+txt+'</span>';$('s-game').appendChild(d);setTimeout(()=>d.remove(),1200);}
function hitEl(el){el.classList.remove('hit');void el.offsetWidth;el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),600);}
function sparks(x,y,n){for(let i=0;i<n;i++){const s=document.createElement('div');s.className='spark';s.style.left=x+'%';s.style.top=y+'%';
  const a=Math.random()*Math.PI*2,r=18+Math.random()*26;s.style.setProperty('--dx',Math.cos(a)*r+'vmin');s.style.setProperty('--dy',Math.sin(a)*r+'vmin');
  s.style.animationDelay=(Math.random()*.2)+'s';$('s-game').appendChild(s);setTimeout(()=>s.remove(),1300);}}
function powerAnim(){const el=$('p-power');let i=0;el.style.opacity=1;const t=setInterval(()=>{el.style.backgroundPosition=`${(i%6)*20}% ${Math.floor(i/6)*33.333}%`;i++;if(i>=24){clearInterval(t);el.style.opacity=0;}},40);}
function orb(id){const o=$(id);o.classList.remove('go');void o.offsetWidth;o.classList.add('go');}

/* ── dice rules (the Battle of Origins duel, as /boo) ── */
function roll3(){return[1+rnd(6),1+rnd(6),1+rnd(6)];}
function analyze(d){const s=[...d].sort((a,b)=>b-a),c={};d.forEach(v=>c[v]=(c[v]||0)+1);let mv=0,mc=0;for(const v in c){if(c[v]>mc||(c[v]===mc&&+v>mv)){mc=c[v];mv=+v;}}
  if(mc>=3)return{type:'triples',rank:3,value:mv,damage:3,dice:s};
  if(mc===2){const k=s.find(v=>v!==mv)||0;return{type:'doubles',rank:2,value:mv,kicker:k,damage:2,dice:s};}
  return{type:'singles',rank:1,value:s[0],damage:1,dice:s};}
function compare(a,b){if(a.rank!==b.rank)return a.rank>b.rank?1:-1;if(a.value!==b.value)return a.value>b.value?1:-1;
  for(let i=0;i<3;i++){if(a.dice[i]!==b.dice[i])return a.dice[i]>b.dice[i]?1:-1;}return 0;}
const TYPE={singles:'SINGLES',doubles:'DOUBLES!',triples:'TRIPLES!'};
/* hidden player-favouring boosts for live (replay) games */
function rollPlayerLive(){let d=roll3();const desperate=S.p.hp<=2,finishing=S.e.hp<=1;
  let pT=finishing?.03:.06,pD=finishing?.03:.08;if(desperate){pT+=.08;pD+=.08;}
  const r=Math.random();if(r<pT){const v=4+rnd(3);d=[v,v,v];}else if(r<pT+pD){const v=3+rnd(4);let k=1+rnd(6);if(k===v)k=k%6+1;d=[v,v,k];}return d;}
function rollEnemyLive(pr){let d=roll3();const er=analyze(d);
  if(er.rank===2&&er.value>=4&&Math.random()<.2&&pr.rank<2){/* soften a high enemy pair now and then */const v=1+rnd(3);d=[v,v,er.dice[2]];}return d;}
/* scripted first play (values vary ±1 without changing any outcome) */
const SCRIPT=[{p:[5,3,2],e:[4,2,1]},{p:[6,2,1],e:[3,3,5]},{p:[1,1,4],e:[6,3,2]},{p:[4,2,2],e:[5,5,3]},{p:[4,4,1],e:[6,5,2]}];
function vary(mine,other){const base=analyze(mine),ob=analyze(other),cmp=compare(base,ob),ones=mine.filter(v=>v===1).length;
  for(let t=0;t<12;t++){const d=mine.slice(),i=rnd(3),v=d[i]+(Math.random()<.5?-1:1);if(v<1||v>6)continue;d[i]=v;const a=analyze(d);
    if(a.type===base.type&&a.value===base.value&&compare(a,ob)===cmp&&d.filter(x=>x===1).length===ones)return d;}
  return mine;}

/* ── 3D dice (the /hype CSS-3D system, resized for this column) ── */
const Dice3D=(function(){
  const PIP={1:['c'],2:['tr','bl'],3:['tr','c','bl'],4:['tl','tr','bl','br'],5:['tl','tr','c','bl','br'],6:['tl','ml','bl','tr','mr','br']};
  const PS={tl:'top:16%;left:16%',tr:'top:16%;right:16%',ml:'top:50%;left:16%;transform:translateY(-50%)',c:'top:50%;left:50%;transform:translate(-50%,-50%)',mr:'top:50%;right:16%;transform:translateY(-50%)',bl:'bottom:16%;left:16%',br:'bottom:16%;right:16%'};
  const FT={1:{rx:0,ry:0},2:{rx:0,ry:-90},3:{rx:90,ry:0},4:{rx:-90,ry:0},5:{rx:0,ry:90},6:{rx:0,ry:180}};
  const snap=(c,t)=>t+Math.round((c-t)/360)*360;
  const pips=v=>(PIP[v]||PIP[1]).map(p=>`<span class="pip3d" style="${PS[p]}"></span>`).join('');
  const cube=c=>[['front',1],['back',6],['right',2],['left',5],['top',3],['bottom',4]].map(([f,v])=>`<div class="die-face face-${c} face-${f}">${pips(v)}</div>`).join('');
  const PROF=[(i,n)=>{const t=n>1?i/(n-1):.5;return{vx:13+t*15,vy:-(25-t*20)};},(i,n)=>{const t=n>1?i/(n-1):.5;return{vx:10+t*14,vy:-(20+t*4)};},
    (i,n)=>{const t=n>1?i/(n-1):.5;return{vx:24+t*6,vy:-(8+t*10)};},(i,n)=>{const t=n>1?i/(n-1):.5;return{vx:28-t*18,vy:-(10+t*12)};},
    (i,n)=>{const a=[.15,.55,.85][i%3];return{vx:14+a*14,vy:-(6+(1-a)*20)};}];
  const P={};const arena=()=>$('dice-arena');
  function scale(){return arena().offsetWidth/340;}
  function showRolling(team,count){const A=arena(),W=A.offsetWidth,H=A.offsetHeight,k=scale(),ds=Math.round(50*k),pad=6;
    if(P[team]){cancelAnimationFrame(P[team].raf);P[team].els.forEach(e=>e.remove());}
    const minX=pad,maxX=W-pad-ds,minY=pad,maxY=H-pad-ds,en=team==='enemy';
    const hx=en?maxX-8:minX+8,hy=en?minY+4:maxY-4,prof=PROF[rnd(PROF.length)],noise=()=>1+(Math.random()-.5)*.25;
    const dice=[],els=[];
    for(let i=0;i<count;i++){const el=document.createElement('div');el.className='die-physics';el.style.width=el.style.height=ds+'px';el.style.zIndex='100';
      el.style.setProperty('--dh',(ds/2)+'px');el.innerHTML=`<div class="die-cube">${cube(en?'green':'blue')}</div>`;A.appendChild(el);els.push(el);
      const v=prof(i,count);dice.push({el,cube:el.querySelector('.die-cube'),x:hx+(Math.random()-.5)*6,y:hy+(Math.random()-.5)*6,
        vx:(en?-1:1)*v.vx*noise()*1.15*k,vy:(en?1:-1)*Math.abs(v.vy)*noise()*1.15*k,rx:rnd(720),ry:rnd(720),rz:rnd(360),
        vrx:(Math.random()-.5)*55,vry:(Math.random()-.5)*55,vrz:(Math.random()-.5)*40,b:0,value:0});}
    function step(){for(let a=0;a<dice.length;a++)for(let b=a+1;b<dice.length;b++){const da=dice[a],db=dice[b],dx=da.x-db.x,dy=da.y-db.y,dist=Math.hypot(dx,dy);
        if(dist<ds&&dist>.1){const push=(ds-dist)*.15,nx=dx/dist,ny=dy/dist;da.vx+=nx*push;da.vy+=ny*push;db.vx-=nx*push;db.vy-=ny*push;}}
      dice.forEach(d=>{d.x+=d.vx;d.y+=d.vy;d.rx+=d.vrx;d.ry+=d.vry;d.rz+=d.vrz;const sp=Math.abs(d.vx)+Math.abs(d.vy),bc=Math.max(.3,.65*Math.pow(.8,d.b));
        if(d.x<minX){d.x=minX;d.vx=Math.abs(d.vx)*bc;d.vry*=1.4;d.b++;}if(d.x>maxX){d.x=maxX;d.vx=-Math.abs(d.vx)*bc;d.vry*=1.4;d.b++;}
        if(d.y<minY){d.y=minY;d.vy=Math.abs(d.vy)*bc;d.vrx*=1.4;d.b++;}if(d.y>maxY){d.y=maxY;d.vy=-Math.abs(d.vy)*bc;d.vrx*=1.4;d.b++;}
        const f=sp>8?.982:sp>3?.965:.935,rf=sp>8?.972:sp>3?.95:.92;d.vx*=f;d.vy*=f;d.vrx*=rf;d.vry*=rf;d.vrz*=rf;
        if(sp<6){const s=.08*(1-sp/6);d.rx+=(Math.round(d.rx/90)*90-d.rx)*s;d.ry+=(Math.round(d.ry/90)*90-d.ry)*s;d.rz+=(Math.round(d.rz/90)*90-d.rz)*s;}
        d.el.style.left=d.x+'px';d.el.style.top=d.y+'px';d.cube.style.transform=`rotateX(${d.rx}deg) rotateY(${d.ry}deg) rotateZ(${d.rz}deg)`;});
      P[team].raf=requestAnimationFrame(step);}
    P[team]={raf:requestAnimationFrame(step),dice,els,settled:false};}
  function reveal(team,values){return new Promise(res=>{const p=P[team];if(!p){res();return;}cancelAnimationFrame(p.raf);
    const A=arena(),W=A.offsetWidth,H=A.offsetHeight,k=scale(),ds=Math.round(50*k),gap=Math.round(18*k),en=team==='enemy';
    const tw=values.length*ds+(values.length-1)*gap,sx=W/2-tw/2,ty=en?H*.16:H*.62;
    values.forEach((v,i)=>{const d=p.dice[i];if(!d)return;const t=FT[v],frx=snap(d.rx,t.rx),fry=snap(d.ry,t.ry),frz=snap(d.rz,0);d.rx=frx;d.ry=fry;d.rz=frz;d.value=v;
      setTimeout(()=>{d.el.classList.add('settling');d.el.style.left=(sx+i*(ds+gap))+'px';d.el.style.top=ty+'px';d.cube.style.transform=`rotateX(${frx}deg) rotateY(${fry}deg) rotateZ(${frz}deg)`;},i*80);});
    setTimeout(()=>{p.settled=true;p.els.forEach(e=>e.style.zIndex='10');res();},values.length*80+750);});}
  function win(team,r){const p=P[team];if(!p)return;p.dice.forEach(d=>{d.el.className='die-physics settling';if(d.value===r.value){d.el.classList.add('win');if(r.type==='triples')d.el.classList.add('win3');}});}
  function lose(team){const p=P[team];if(!p)return;p.dice.forEach(d=>d.el.classList.add('lose'));}
  function clear(team){if(P[team]){cancelAnimationFrame(P[team].raf);P[team].els.forEach(e=>e.remove());delete P[team];}}
  return{showRolling,reveal,win,lose,clear,clearAll(){clear('player');clear('enemy');}};
})();

/* ── flow: tap → opener → arena ── */
$('s-tap').addEventListener('click',()=>{if(S.screen!=='tap')return;unlock();sfx('click');startOpener();});
function startOpener(){const v=$('opener');if(SKIP){enterArena();return;}
  setScreen('open');v.muted=false;v.currentTime=0;let done=false;const finish=()=>{if(done)return;done=true;v.pause();enterArena();};
  v.onended=finish;const p=v.play();if(p)p.catch(()=>{v.muted=true;v.play().catch(finish);});
  setTimeout(()=>$('skip').classList.add('on'),1200);$('skip').onclick=finish;$('s-open').onclick=e=>{if(e.target.id==='skip')return;};
  setTimeout(()=>{if(!done)finish();},6500);}

async function enterArena(){setScreen('game');setPhase('intro');S.busy=true;S.boss=false;
  ['fl-tl','fl-tr','fl-bl','fl-br'].forEach(id=>{try{$(id).play().catch(()=>{});}catch(e){}});
  names();bar('p');bar('e');bar('m');shards(0);
  sfx('whoosh1');
  await wait(350);['g-left','g-center','g-right'].forEach((id,i)=>setTimeout(()=>$(id).classList.add('in'),i*140));
  await wait(300);$('hud-e').classList.add('in');
  await wait(250);['p-larry','p-gary','p-dealer'].forEach((id,i)=>setTimeout(()=>$(id).classList.add('in'),i*120));
  await wait(300);$('hud-p').classList.add('in');['c-larry','c-gary','c-dealer'].forEach((id,i)=>setTimeout(()=>$(id).classList.add('in'),i*110));
  narr(`<b>${NAMES.e.toUpperCase()}'S CREW</b> WANTS A FIGHT!`);
  await wait(1400);narr('ROLL THE MOST MATCHING DICE TO WIN · <b>TAP THE DIE</b>');
  S.busy=false;setReady(true);}

/* ── a round ── */
$('roll').addEventListener('click',onRoll);
async function onRoll(){if(S.busy||!$('roll').classList.contains('ready'))return;S.busy=true;setReady(false);setPhase('rolling');
  sfx('click');sfx('shake');
  let p,e;
  if(S.boss){p=vary([5,5,2],[6,3,1]);e=vary([6,3,1],[5,5,2]);}
  else if(S.scripted&&SCRIPT[S.round]){const sc=SCRIPT[S.round];p=vary(sc.p,sc.e);e=vary(sc.e,sc.p);}
  else{p=rollPlayerLive();e=rollEnemyLive(analyze(p));}
  Dice3D.clearAll();hideBanner();
  Dice3D.showRolling('enemy',3);await wait(160);Dice3D.showRolling('player',3);
  await wait(950);stopSfx('shake');sfx('throw');
  await Promise.all([Dice3D.reveal('enemy',e),Dice3D.reveal('player',p)]);
  const pr=analyze(p),er=analyze(e),cmp=compare(pr,er);
  await wait(300);
  if(S.boss){await bossRound(pr,er,cmp);return;}
  const ones=p.filter(v=>v===1).length;
  if(ones){await luckyNovice(ones);}
  if(cmp===0){banner('TIE!','tie');narr('TIE! <b>ROLL AGAIN</b>');await wait(1300);S.busy=false;setReady(true);return;}
  if(cmp>0){Dice3D.win('player',pr);Dice3D.lose('enemy');banner(TYPE[pr.type],pr.type==='triples'?'win big':'win');if(pr.type==='triples'){flash();sfx('shine');}
    let dmg=pr.damage;narr(`<b>${NAMES.p.toUpperCase()}</b> WINS THE ROLL · ${TYPE[pr.type].replace('!','')} · <b>${dmg} DAMAGE</b>`);
    await wait(900);
    if(S.shards>=4){dmg+=2;await iceShards();}
    await hitEnemy(dmg);
  }else{Dice3D.win('enemy',er);Dice3D.lose('player');banner(TYPE[er.type],'lose');
    narr(`<b>${NAMES.e.toUpperCase()}</b> WINS THE ROLL · ${TYPE[er.type].replace('!','')} · <b>${er.damage} DAMAGE</b>`);
    await wait(800);await enemyAttack(er.damage);}
  S.round++;
  if(S.e.hp<=0){await koSequence();return;}
  if(S.p.hp<=0){await lossSequence();return;}
  await wait(700);hideBanner();narr('<b>TAP THE DIE</b> TO ROLL');S.busy=false;setReady(true);}

async function luckyNovice(ones){const n=ones*2;const sp=$('splash');sp.className='';$('sp-title').className='lucky stroke';$('sp-title').textContent='LUCKY NOVICE';
  $('sp-sub').innerHTML=`${NAMES.p.toUpperCase()} ROLLED ${ones===1?'A 1':ones+' ONES'} · <b>+${n} ICE SHARDS</b>`;
  sfx('water1');sp.classList.add('on');$('s-game').classList.add('splashing');setPhase('splash');await wait(1500);sp.classList.remove('on');$('s-game').classList.remove('splashing');
  powerAnim();sfx('water3');await wait(250);shards(S.shards+n,true);await wait(500);setPhase('rolling');}
async function iceShards(){narr(`<b>ICE SHARDS!</b> ${NAMES.p.toUpperCase()} SPENDS 4 · <b>+2 DAMAGE</b>`);shards(S.shards-4,true);sfx('water2');powerAnim();
  for(let i=0;i<3;i++){const s=document.createElement('img');s.className='shot';s.src='assets/ui/ice_shards.webp';s.style.setProperty('--dx',`${(180+i*30)}%`);s.style.setProperty('--dy',`-${(560+i*40)}%`);s.style.animationDelay=(i*.08)+'s';$('s-game').appendChild(s);setTimeout(()=>s.remove(),900);}
  await wait(650);}
async function hitEnemy(dmg){S.e.hp-=dmg;hitEl($('g-center'));pop(50,17,'-'+dmg);shake();sfx(dmg>=3?'shine':'click');bar('e');await wait(700);}
async function enemyAttack(dmg){orb('orb-g');const b=$('e-burst');b.classList.remove('go');void b.offsetWidth;b.classList.add('go');sfx('rocks');await wait(520);
  S.p.hp-=dmg;hitEl($('p-gary'));pop(50,64,'-'+dmg);shake();flash();bar('p');await wait(800);stopSfx('rocks');}

/* ── Kodako goes down → the Mountain King rises ── */
async function koSequence(){setPhase('ko');narr(`<b>${NAMES.e.toUpperCase()} IS DOWN!</b>`);flash();sfx('shine');
  const g=$('g-center');g.classList.add('ko');sparks(50,20,16);await wait(500);$('g-left').classList.add('flee');$('g-right').classList.add('flee');
  await wait(900);banner('ROUND WON!','win big');narr(`<b>TEAM ${NAMES.p.toUpperCase()}</b> TAKES THE ROUND!`);$('hud-e').classList.remove('in');
  await wait(1900);hideBanner();Dice3D.clearAll();await bossRise();}
async function bossRise(){S.boss=true;setPhase('mk');sfx('whoosh2');$('dark').classList.add('on');
  narr('THE GROUND SHAKES…');await wait(500);shake();sfx('rocks');
  const R=$('rocks');for(let i=0;i<3;i++){const r=document.createElement('img');r.src='assets/fx/rocks_fall.webp';r.style.left=(i*30-10)+'%';r.style.top=(8+i*9)+'%';r.style.animationDelay=(i*.25)+'s';R.appendChild(r);setTimeout(()=>r.classList.add('fall'),20);setTimeout(()=>r.remove(),2200);}
  $('bg-mountains').classList.add('up');await wait(900);$('mk').classList.add('on');$('mk-hands').classList.add('on');
  await wait(900);banner(NAMES.m.toUpperCase(),'lose big');narr(`<b>${NAMES.m.toUpperCase()}</b> RISES!`);$('hud-mk').classList.add('in');shake();flash();
  await wait(2000);hideBanner();narr(`YOU'VE GOT ONE SHOT · <b>TAP THE DIE</b>`);S.busy=false;setReady(true);}
async function bossRound(pr,er,cmp){
  Dice3D.win('player',pr);Dice3D.lose('enemy');banner(TYPE[pr.type],'win');narr(`<b>${NAMES.p.toUpperCase()}</b> WINS THE ROLL · <b>${pr.damage} DAMAGE</b>`);
  await wait(900);S.m.hp-=pr.damage;bar('m');hitEl($('mk-head'));pop(50,14,'-'+pr.damage);sfx('click');
  await wait(900);hideBanner();narr('…BARELY A SCRATCH.');await wait(1300);
  narr(`<b>${NAMES.m.toUpperCase()}</b> ROLLS…`);Dice3D.clearAll();sfx('shake');Dice3D.showRolling('enemy',3);await wait(950);stopSfx('shake');sfx('throw');
  await Dice3D.reveal('enemy',[6,6,6]);await wait(300);Dice3D.win('enemy',{type:'triples',value:6});
  const sp=$('splash');sp.className='purple';$('sp-title').className='lucky stroke';$('sp-title').textContent='BEAST MODE';$('sp-sub').innerHTML='MATCHING DICE HIT <b>TWICE AS HARD</b> · TRIPLES = 6 DAMAGE';
  $('sp-card').style.visibility='hidden';$('sp-shards').style.visibility='hidden';$('sp-ring').style.visibility='hidden';orb('orb-p');sfx('shine');sp.classList.add('on');$('s-game').classList.add('splashing');
  await wait(1500);sp.classList.remove('on');$('s-game').classList.remove('splashing');$('sp-card').style.visibility='';$('sp-shards').style.visibility='';$('sp-ring').style.visibility='';
  banner('TRIPLES!','lose big');narr(`<b>${NAMES.m.toUpperCase()}</b> · BEAST MODE · <b>6 DAMAGE</b>`);
  const h=$('mk-swipe');h.classList.remove('go');void h.offsetWidth;h.classList.add('go');sfx('rocks');await wait(380);
  S.p.hp=0;bar('p');hitEl($('p-gary'));pop(50,64,'-6');flash();shake();await wait(600);$('p-gary').classList.add('down');$('c-gary').classList.add('off');
  await wait(900);hideBanner();narr(`<b>${NAMES.p.toUpperCase()} IS DOWN!</b>`);setPhase('down');await wait(1600);endGame();}
async function lossSequence(){setPhase('down');narr(`<b>${NAMES.p.toUpperCase()} IS DOWN!</b> ${NAMES.e.toUpperCase()} TAKES THIS ONE…`);flash();
  $('p-gary').classList.add('down');$('c-gary').classList.add('off');await wait(2000);endGame();}

/* ── outro / CTA ── */
function endGame(){S.games++;localStorage.setItem('boo_pl_games',S.games);setScreen('cta');setPhase('cta');
  const v=$('outro');v.muted=false;v.currentTime=0;const p=v.play();if(p)p.catch(()=>{v.muted=true;v.play().catch(()=>{$('cta-fallback').style.display='block';});});
  setTimeout(()=>{$('cta-btn').classList.add('on');$('again').classList.add('on');},3200);
  v.onended=()=>{$('cta-btn').classList.add('on');$('again').classList.add('on');};}
$('cta-btn').addEventListener('click',()=>sfx('click'));
$('again').addEventListener('click',()=>{sfx('click');const v=$('outro');v.pause();reset();enterArena();});
function reset(){S.round=0;S.scripted=!LIVE&&S.games===0;S.p.hp=S.p.max;S.e.hp=S.e.max;S.m.hp=S.m.max;S.shards=0;S.boss=false;S.busy=false;
  Dice3D.clearAll();hideBanner();$('narr').classList.remove('on');
  ['g-left','g-center','g-right','p-larry','p-gary','p-dealer','c-larry','c-gary','c-dealer','hud-e','hud-p','hud-mk'].forEach(id=>{$(id).className=$(id).className.replace(/\b(in|ko|flee|hit|down|off)\b/g,'').trim();});
  $('mk').classList.remove('on');$('mk-hands').classList.remove('on');$('dark').classList.remove('on');$('bg-mountains').classList.remove('up');$('cta-btn').classList.remove('on');$('again').classList.remove('on');
  $('rocks').innerHTML='';$('splash').classList.remove('on');}

/* auto-drive for the verification rig */
if(AUTO)setTimeout(()=>$('s-tap').click(),1500);
window.BOO={S,onRoll,enterArena,endGame,reset};
})();
</script>
