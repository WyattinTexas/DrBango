/* ═══ V2 "FIRST THROW" · design doc ~/bo-playable-src/design-v2-1015.md · built on V1 (index.html) ═══ */

/* ── THE WORLD (everything that zooms and shakes) ── */
#world{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform}

#dark.on{opacity:1}

/* the Mountain King: dim in the clouds from frame 1 (the tease), risen for the boss */
#mk{position:absolute;inset:0;pointer-events:none;z-index:3}

/* Kodako's crew (V1's loops; the stills show until a loop can play through) */
.ghost{position:absolute;z-index:6;transition:opacity .6s,transform .6s;opacity:0;transform:translateY(40%)}

#tray{position:absolute;z-index:14;border-radius:50%;pointer-events:none;background:radial-gradient(ellipse at 50% 36%,rgba(16,7,3,.6) 0%,rgba(38,20,9,.62) 58%,rgba(70,42,20,.55) 100%);border:calc(var(--u)*.5) solid rgba(255,226,170,.32);box-shadow:inset 0 calc(var(--v)*.9) calc(var(--v)*1.3) rgba(0,0,0,.6),inset 0 calc(var(--v)*-.3) calc(var(--v)*.5) rgba(255,220,160,.18),0 calc(var(--v)*.25) 0 rgba(0,0,0,.25)}

.fighter{position:absolute;left:50%;bottom:12.5%;z-index:16;pointer-events:none;opacity:0;transform:translate(-50%,14%) scale(.9);transform-origin:50% 100%;transition:opacity .25s,transform .35s cubic-bezier(.2,.8,.2,1)}
.fighter.on{opacity:1;transform:translate(-50%,0) scale(1)}

@keyframes kick{0%{transform:translate(0,0) rotate(0)}22%{transform:translate(-4%,6%) rotate(8deg) scale(.95)}55%{transform:translate(6%,-150%) rotate(-16deg) scale(1.18)}75%{transform:translate(4%,-120%) rotate(-10deg) scale(1.12)}100%{transform:translate(0,0) rotate(0)}}

/* canvases: under the dice (shadows, dust, vignette) and over them (sparks, tethers, cracks, the aim cone, the band) */
#cv-lo,#cv-hi{position:absolute;left:0;top:0;pointer-events:none}
#cv-lo{z-index:18}#cv-hi{z-index:22}

/* the dice (V1's CSS-3D cube, FT + snap): only transform and opacity animate */
#dice-arena{position:absolute;top:27%;left:4%;width:92%;height:38%;z-index:20;pointer-events:none}
.die{position:absolute;left:0;top:0;perspective:360px;will-change:transform,opacity;pointer-events:none}
.die::before{content:'';position:absolute;left:-38%;top:-38%;width:176%;height:176%;border-radius:50%;background:radial-gradient(circle,rgba(255,232,130,.9) 0%,rgba(255,196,60,.45) 34%,rgba(255,180,40,0) 68%);opacity:0;transition:opacity .2s}

.face-front{transform:translateZ(var(--dh))}.face-back{transform:rotateY(180deg) translateZ(var(--dh))}

/* chip, prompt, stamps, callouts */
#chip{position:absolute;left:50%;top:44.4%;z-index:24;padding:.42em 1em .3em;border-radius:2em;background:rgba(14,40,12,.9);border:calc(var(--u)*.45) solid #9be85e;color:#eaffd4;font-size:max(calc(var(--u)*4.4),11px);letter-spacing:.05em;white-space:nowrap;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(0)}

/* ═══════════════ 3 · the game clock: fixed 1/120 s physics steps with an accumulator, slow-mo, hit-stop ═══════════════ */

/* ═══════════════ 4 · audio: the 10 mp3s as WebAudio buffers through an 8-voice pool + synth voices; V1's HTMLAudio stays as the fallback ═══════════════ */

/* ═══════════════ 5 · the team's alpha clips (V1's FX) + the flame sprite sheets ═══════════════ */
const FX=(function(){const ua=navigator.userAgent;

/* ═══════════════ 9 · the rules (V1, the /boo duel) + live odds + the director's helpers ═══════════════ */
function roll3(){return[1+rnd(6),1+rnd(6),1+rnd(6)];}
function analyze(d){const s=[...d].sort((a,b)=>b-a),c={};d.forEach(v=>c[v]=(c[v]||0)+1);let mv=0,mc=0;for(const v in c){if(c[v]>mc||(c[v]===mc&&+v>mv)){mc=c[v];mv=+v;}}
  if(mc>=3)return{type:'triples',rank:3,value:mv,damage:3,dice:s};
  if(mc===2){const k=s.find(v=>v!==mv)||0;return{type:'doubles',rank:2,value:mv,kicker:k,damage:2,dice:s};}
  return{type:'singles',rank:1,value:s[0],damage:1,dice:s};}
function compare(a,b){if(a.rank!==b.rank)return a.rank>b.rank?1:-1;if(a.value!==b.value)return a.value>b.value?1:-1;
  for(let i=0;i<3;i++){if(a.dice[i]!==b.dice[i])return a.dice[i]>b.dice[i]?1:-1;}return 0;}
const TYPE={singles:'SINGLES',doubles:'DOUBLES!',triples:'TRIPLES!'};
function fmt(v){const r=analyze(v);if(r.rank===3)return`${r.value}-${r.value}-${r.value}`;if(r.rank===2)return`${r.value}-${r.value}-${r.kicker}`;return r.dice.join('-');}
function scoring(vals,r){const idx=[0,1,2];if(r.rank>=2)return idx.filter(i=>vals[i]===r.value);let m=0;vals.forEach((v,i)=>{if(v>vals[m])m=i;});return[m];}
/* V1's hidden player-favouring boosts for live (replay) rolls */
function rollPlayerLive(){let d=roll3();const desperate=S.hp<=2,finishing=(S.enemy==='king'?S.m.hp:S.e.hp)<=1;
  let pT=finishing?.05:.10,pD=finishing?.06:.16;if(desperate){pT+=.08;pD+=.10;}
  const r=rand();if(r<pT){const v=4+rnd(3);d=[v,v,v];}else if(r<pT+pD){const v=3+rnd(4);let k=1+rnd(6);if(k===v)k=k%6+1;d=[v,v,k];}return D.shuffle(d);}
function rollEnemyLive(){let d=roll3();const er=analyze(d);if(er.rank===2&&er.value>=4&&rand()<.3){const v=1+rnd(3);d=[v,v,er.dice.find(x=>x!==er.value)||1];}return D.shuffle(d);}
const D={
  shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;},
  doubles(v,k){if(k==null||k===v){do{k=1+rnd(6);}while(k===v);}return D.shuffle([v,v,k]);},
  /* the narrowest roll that still loses to e (the director's near-miss) */
  narrowLoss(e){const er=analyze(e);let best=[],top=-1;for(let a=1;a<=6;a++)for(let b=1;b<=6;b++)for(let c=1;c<=6;c++){const p=[a,b,c],pr=analyze(p);if(compare(pr,er)>=0)continue;
      const sc=pr.rank*1000+pr.value*100+pr.dice[0]*10+pr.dice[1]+pr.dice[2]*.1;if(sc>top+1e-9){top=sc;best=[p];}else if(Math.abs(sc-top)<1e-9)best.push(p);}
    return D.shuffle(best.length?best[rnd(best.length)]:[1,2,3]);},
  /* a roll that beats e (V1's beat) */
  winOver(e){for(let n=0;n<200;n++){const p=roll3();if(compare(analyze(p),analyze(e))>0)return p;}return[6,6,6];}
};
/* the Flick's face pickers: the lesson is scripted; attempt 2 favours the player on any contact */
function solveFavour(p,e,fi,hits,prefer){const cand=[];const vals=[1,2,3,4,5,6];
  const rec=(k,cur)=>{if(k===hits.length){for(const fv of vals){const pp=p.slice();pp[fi]=fv;const ee=e.slice();hits.forEach((h,j)=>ee[h]=cur[j]);const pr=analyze(pp),er=analyze(ee);if(compare(pr,er)<=0)continue;
        let sc=0;if(er.rank===1)sc+=4;if(pr.rank===2)sc+=2;if(pr.rank===3)sc-=1;hits.forEach((h,j)=>{if(cur[j]!==e[h])sc+=1;});if(prefer)sc+=prefer(pp,ee);cand.push({sc,fv,cur:cur.slice()});}return;}

const CARD={larry:{src:'assets/cards/larry.webp',ar:.7518},charlie:{src:'assets/cards/charlie.webp',ar:.6906,txt:'Upon losing a roll, you may Flick one of your dice. Any die hit changes its result on contact.'},buttons:{src:'assets/cards/buttons.webp',ar:.7518}};

/* the tutorial finger: presses the tray on frame 1; draws the dotted arc for the Flick lesson */
const FINGER=(function(){const el=$('finger');let mode=null,t0=0,path=null;
  function at(x,y,s,o){const w=el.offsetWidth||L.W*.17,h=w*160/120;el.style.transform=`translate3d(${(x-w*.4).toFixed(1)}px,${(y-h*.03).toFixed(1)}px,0) scale(${s||1})`;if(o!=null)el.style.opacity=o;}
  function press(x,y){mode='press';el.style.opacity='';el.className='press';at(x,y,1);}
  function flick(a,b){mode='flick';t0=performance.now();el.className='';const cx=(a.x+b.x)/2+(b.y-a.y)*.22,cy=(a.y+b.y)/2-(b.x-a.x)*.22;path={x0:a.x,y0:a.y,cx,cy,x1:b.x,y1:b.y};CV.arc(path);}
  function hide(){if(!mode)return;mode=null;el.className='';el.style.opacity=0;CV.arc(null);}
  function tick(rdt,gdt,now){if(mode!=='flick')return;const cyc=1700,t=(now-t0)%cyc;let p,o=1,s=1;
    if(t<250){p=0;o=t/250;s=1.08-.1*t/250;}else if(t<850){p=E.io2((t-250)/600);s=.98;}else if(t<1100){p=1;o=1-(t-850)/250;s=.98+.1*(t-850)/250;}else{p=1;o=0;}
    const q=1-p,x=q*q*path.x0+2*q*p*path.cx+p*p*path.x1,y=q*q*path.y0+2*q*p*path.cy+p*p*path.y1;at(x,y,s,o);}
  return{press,flick,hide,tick,get on(){return!!mode;}};})();

/* ═══════════════ 11 · input: hold → shake → release (the tap fallback, the 1200 ms self-throw) ═══════════════ */
const IN={mode:'off',holding:false,id:null,t0:0,samples:[],res:null,chargeMs:900,full:false,lastBuzz:0,lastShake:0,first:false};
const play=$('play'),ring=$('ring');
function firstTouch(){if(IN.first)return;IN.first=true;FINGER.hide();AU.unlock();FX.warm(['burst','rockfall','mkhand']);mark('first-touch');}
play.addEventListener('pointerdown',e=>{if(e.button>0)return;firstTouch();
  if(IN.mode==='roll'&&!IN.holding){e.preventDefault();IN.holding=true;IN.id=e.pointerId;const p=pt(e);IN.t0=p.t;IN.samples=[p];IN.full=false;IN.lastShake=0;IN.lastBuzz=0;ring.classList.add('on');ring.classList.remove('full');FINGER.hide();prompt(false);return;}
  if(IN.mode==='flick')FL.down(e);},{passive:false});
addEventListener('pointermove',e=>{if(IN.holding&&e.pointerId===IN.id){const p=pt(e);IN.samples.push(p);while(IN.samples.length>2&&p.t-IN.samples[0].t>200)IN.samples.shift();return;}if(IN.mode==='flick')FL.move(e);},{passive:false});

addEventListener('pointerup',onUp);addEventListener('pointercancel',onUp);
function armRoll(){return new Promise(res=>{note('ready');IN.mode='roll';IN.res=res;IN.chargeMs=S.chargeMs;IN.armT=performance.now();IN.hint=false;ring.style.setProperty('--p','0');ring.classList.add('on');prompt(true,'HOLD TO ROLL');DICE.wobble(true);setPhase('ready');if(AUTO)AUTOP.hold();});}
/* the backstop for every roll after the first touch (before it, the hold IS the start, §9.9, and the finger never stops pressing):
   2 s with no touch re-shows the drawn finger + HOLD TO ROLL; 4.5 s throws by itself at 60 % power, the way the Flick flicks itself at 3 s */
function fingerTray(){const c=trayCenter();FINGER.press(L.ax+c.x+DICE.sizeOf('p')*.15,L.ay+c.y);}
function idleTick(rdt,gdt,now){if(IN.mode!=='roll'||IN.holding||!IN.first)return;const idle=now-IN.armT;
  if(idle>=2000&&!IN.hint){IN.hint=true;fingerTray();prompt(true,'HOLD TO ROLL');}
  if(idle>=4500)selfThrow();}
function selfThrow(){if(IN.mode!=='roll'||IN.holding)return;IN.mode='off';FINGER.hide();DICE.jitter(-1);DICE.wobble(false);ring.classList.remove('on','full');prompt(false);mark('self-throw');
  const r=IN.res;IN.res=null;if(r)r({power:.6,dir:null,charge:0,auto:true});}
function release(auto){if(!IN.holding)return;IN.holding=false;const now=performance.now(),c=clamp((now-IN.t0)/IN.chargeMs,0,1);
  let dir=null;const recent=IN.samples.filter(s=>now-s.t<=60);if(recent.length>=2){const a=recent[0],b=recent[recent.length-1],dx=b.x-a.x,dy=b.y-a.y,m=Math.hypot(dx,dy);if(m>6)dir={x:dx/m,y:dy/m};}
  IN.mode='off';DICE.jitter(-1);DICE.wobble(false);ring.classList.remove('on','full');prompt(false);
  const r=IN.res;IN.res=null;if(r)r({power:.6+.4*c,dir,charge:c,auto:!!auto});}
function chargeTick(rdt,gdt,now){if(!IN.holding)return;const c=clamp((now-IN.t0)/IN.chargeMs,0,1);ring.style.setProperty('--p',c.toFixed(3));DICE.jitter(c);
  const hz=8+8*c;if(now-IN.lastShake>=1000/hz){IN.lastShake=now;AU.slice('shake',.07,{vol:.5,rate:vr(.88,1.12)});}
  if(now-IN.lastBuzz>=120){IN.lastBuzz=now;buzz(6);}
  if(c>=1&&!IN.full){IN.full=true;AU.play('click');buzz(15);ring.classList.add('full');}
  if(now-IN.t0>=1200)release(true);}

    B.forEach(b=>{b.d.phase='flick';b.d.h=0;});
    const td=DICE.die('e',o.target),tb=B.find(b=>b.d===td)||B[1];
    if(!tb){B.forEach(b=>{b.d.phase='rest';});resolve({contact:false,chain:false,hits:[],dropped:true,assisted:false,player:S.pVals.slice(),enemy:S.eVals.slice()});return;}

    FLOG.push({t:+((performance.now()-T0)/1000).toFixed(2),sp:+sp.toFixed(3),assisted:!!st.assisted,ang:sp?+angBetween(v,{x:st.tgt.x-F.x,y:st.tgt.y-F.y}).toFixed(1):null,dist:+Math.hypot(st.tgt.x-F.x,st.tgt.y-F.y).toFixed(0),n:st.samples.length,forced:!!forced});if(FLOG.length>40)FLOG.shift();

async function recap(){mark('recap');setPhase('recap');hideStamp();sub(null);VIEW.zoomTo(1.04,L.W/2,L.H*.42,3000);

  $('rw').innerHTML=words.map(w=>`<span>${w}</span>`).join('<i>·</i>');$('rh').innerHTML=`FIRST HIT <b>${S.firstHit||0}</b> → LAST HIT <b>${S.lastHit||0}</b>`;$('rh').classList.remove('on');
  $('recap').classList.add('on');const sp=$('rw').querySelectorAll('span');
  for(let i=0;i<sp.length;i++){await gwait(260);sp[i].classList.add('on');AU.syn.chime(659+i*110,.35,.14);}
  await gwait(300);$('rh').classList.add('on');AU.syn.ceg();await gwait(1300);}
function endCard(win){if(S.ended)return;S.ended=true;mark('cta');setPhase('cta');IN.mode='off';
  S.games++;store('boo_pl_games',S.games);FX.pauseLoops();flames(false);$('recap').classList.remove('on');hideStamp();sub(null);hideChip();body.classList.add('endscreen');
  $('s-cta').classList.add('on');$('win-tag').classList.toggle('on',!!win);
  setTimeout(()=>{$('cta').classList.add('on');$('again').classList.add('on');},450);}
/* ?cut=short: the CTA floats right after the Kodako KO; the King stays a tease */
async function shortEnd(){S.ended=true;setPhase('cta');IN.mode='off';S.games++;store('boo_pl_games',S.games);
  await gwait(150);$('mk').classList.add('peek');stamp('THE KING AWAITS…','info mid','pop');mark('cta');$('cta').classList.add('on');$('again').classList.add('on');}

/* ═══════════════ 15 · the director: one beat array (first run) + replay mode ═══════════════ */
const BEATS=[
  ['r1',async()=>{mark('r1');setPhase('ready');
    await turn({p:[5,5,2]});                                     /* R1, Larry: 5-5-2 doubles; the two 5s hit Kodako for 2 */
    await Promise.all([tagIn('charlie','CHARLIE · RUSH'),enemyRoll([4,4,6])]);}],   /* Charlie's slam and Kodako's roll start at the hit */
  ['r2',async()=>{mark('r2');
    /* the lesson: the scripted faces (6 → 1, the flung die → 5) only on a real contact; a miss is a retry with the finger, a drop re-arms */
    S.rush=1;await turn({p:[2,3,5],flick:{assist:25,finger:true,lit:true,respin:true,retry:true,keepOnMiss:true,target:idxOf(S.eVals,6),
      pick:(hits,fi,contact)=>{if(!contact)return null;const out={flung:5,hits:{}};hits.forEach((h,j)=>{out.hits[h]=j===0?1:[2,3][j-1]||2;});return out;}}});
    pip(0);AU.play('water3',{vol:.7});DICE.clearMarks('p');
    const silver=DICE.gather().then(()=>{S.skin=1;S.chargeMs=750;DICE.reskin('p',1);});   /* the dice come home, then turn silver in the tray */
    await Promise.all([silver,tagIn('larry','LARRY · FLYING KICK'),enemyRoll([2,2,6],{keepPlayer:true})]);}],
  ['r3',async()=>{mark('r3');
    await turn({p:[3,3,3],ant:{idx:2,tease:2,ms:115}});}],         /* R3: 3, 3, the deciding die teeters 3/2 and falls on 3 → Flying Kick 9 */
  ['ko',async()=>{await koSequence();}],
  ['rise',async()=>{await bossRise();
    mark('king-roll');await Promise.all([tagIn('charlie','CHARLIE · RUSH 1/1',true),enemyRoll([5,5,3],{ant:{idx:2,tease:5,ms:115}})]);}],
  ['boss1',async()=>{mark('boss1');S.attempt=1;S.cap=7;S.rush=1;rushHud();
    /* roll A (Charlie): a narrow doubles loss whose odd die is the one Charlie flicks, so a Flick (12°, honest faces) that breaks the King's pair
       wins honestly, capped at 7. A whiff or an unbroken pair loses to the claw right here and there is no roll B. */
    await turn({p:()=>attempt1Roll(S.eVals),flick:{assist:12,almost:true}});
    let n=0;while(S.hp>0&&n++<3){mark('boss1-rollB');const k2=D.doubles(4+rnd(3));await enemyRoll(k2);   /* roll B: the King lands doubles again with RUSH 0/1 */
      await turn({p:()=>{const p=rollPlayerLive();return compare(analyze(p),analyze(k2))<0?p:D.narrowLoss(k2);}});}
    sub(S.bestBossHit>0?`YOUR BEST HIT <b>${S.bestBossHit}</b> · KING <b>${S.m.hp} HP</b>`:'NOT A SCRATCH ON <b>THE KING</b>');await teamDown();await gwait(420);sub(null);}],
  ['levelup',async()=>{await levelUp();}],
  ['boss2',async()=>{mark('boss2');S.attempt=2;S.cap=0;S.rush=1;rushHud();
    await enemyRoll([4,4,1]);
    await turn({p:[3,3,1],flick:{assist:18,chain:true,pick:(hits,fi,contact)=>contact?solveFavour(S.pVals,S.eVals,fi,hits):null}});}],
  ['finale',async()=>{mark('finale');
    await Promise.all([tagIn('buttons','BUTTONS · PERFECT PLAN'),enemyRoll([6,6,2])]);
    await turn({p:[6,6,6],ant:{idx:2,tease:5,ms:145}});           /* the longest slow-mo of the ad: teeters 5/6, lands 6 */
    if(S.m.hp<=0)await bossFalls();}],
  ['recap',async()=>{await recap();}],
  ['outro',async()=>{endCard(true);}]];
function idxOf(v,x){const i=v.indexOf(x);return i<0?0:i;}
/* attempt 1, roll A: a pair under the King's pair with its odd die lowest (Charlie flicks the lowest die): breaking his pair turns the compare honestly */
function attempt1Roll(kv){const K=analyze(kv),opts=[4,3].filter(v=>K.rank===2&&v<K.value);if(!opts.length)return D.narrowLoss(kv);
  const v=opts[rnd(opts.length)],k=1+rnd(v-1);return D.shuffle([v,v,k]);}
async function runFirst(from){let i=Math.max(0,BEATS.findIndex(b=>b[0]===from));if(i>0)jumpTo(BEATS[i][0]);
  for(;i<BEATS.length;i++){await BEATS[i][1]();if(SHORT&&BEATS[i][0]==='ko'){await shortEnd();return;}if(S.ended)return;}}
/* PLAY AGAIN: no scripted openers, live odds, a Flick on every loss at 0°, one boss attempt, gold dice and Buttons from the start */
async function runReplay(){S.mode='replay';S.run=load('boo_pl_run')+1;store('boo_pl_run',S.run);mark('replay');
  S.team=['larry','charlie','buttons'];S.hpMax=5;S.hp=5;S.skin=2;S.chargeMs=600;S.rush=99;S.rushShown=false;
  DICE.reskin('p',2);handSet();setActive('larry');gems();$('gems').classList.add('on');rushHud();
  stamp(`RUN ${S.run+1}: STRONGER`,'win mid','slam');await gwait(900);hideStamp();
  const order=['larry','buttons','charlie'];let k=0,guard=0;
  const fight=async(isKing)=>{while((isKing?S.m.hp:S.e.hp)>0&&S.hp>0&&guard++<16){const who=order[k++%3];if(S.active!==who)await tagIn(who,TAG[who],true);
      const ev=rollEnemyLive();await enemyRoll(ev);
      let pv=rollPlayerLive();if(guard>9&&compare(analyze(pv),analyze(ev))<=0)pv=D.winOver(ev);
      const r=await turn({p:pv,ant:liveAnt(pv),flick:{assist:0}});
      if(r.tie)continue;}};
  await fight(false);
  if(S.hp<=0){await teamDown();endCard(false);return;}
  await koSequence();if(SHORT){await shortEnd();return;}await bossRise();guard=0;S.cap=0;
  await fight(true);
  if(S.m.hp<=0){await bossFalls();await recap();endCard(true);}else{await teamDown();endCard(false);}}
const TAG={larry:'LARRY · FLYING KICK',charlie:'CHARLIE · RUSH',buttons:'BUTTONS · PERFECT PLAN'};
/* live anticipation: when a pair lands first, the deciding die teeters (35 %); the tease face must touch the final face (opposites sum to 7) */
function liveAnt(v){const r=analyze(v);if(r.rank<2||rand()>=.35)return null;let idx=v.findIndex(x=>x!==r.value);if(idx<0)idx=2;const fin=v[idx];
  let tease=r.rank===3?(fin===1||fin===6?2:1):r.value;if(tease===fin||tease+fin===7)tease=[1,2,3,4,5,6].find(x=>x!==fin&&x+fin!==7);return{idx,tease,ms:115};}
/* ?beat=: put the world where that beat starts (rigs) */
function jumpTo(b){const at=n=>BEATS.findIndex(x=>x[0]===n),i=at(b);if(i<0)return;
  if(i>=at('r2')){S.e.hp=4;S.team=['larry','charlie'];setActive('charlie');DICE.placeEnemy([4,4,6]);S.eVals=[4,4,6];chip('BEAT 4-4-6!');}
  if(i>=at('r3')){S.e.hp=2;pip(0);S.skin=1;S.chargeMs=750;DICE.reskin('p',1);setActive('larry');DICE.placeEnemy([2,2,6]);S.eVals=[2,2,6];chip('BEAT 2-2-6!');S.firstHit=2;S.ev.flicked=true;S.ev.lost=true;}
  if(i>=at('ko')){S.e.hp=0;pip(1);S.ev.tripled=true;hideChip();}
  if(i>=at('rise')){S.crewGone=true;['g-left','g-center','g-right'].forEach(id=>$(id).classList.add('flee'));$('hud-e').classList.remove('in');if(i<at('boss1'))DICE.fade('e');}
  if(i>=at('boss1')){S.enemy='king';$('bg').classList.add('mkset');$('mk').classList.remove('tease');$('mk').classList.add('on');$('mk-hands').classList.add('on');$('dark').classList.add('on');$('hud-mk').classList.add('in');$('beast').classList.add('on');
    S.rushShown=true;S.rush=1;rushHud();$('gems').classList.add('on');setActive('charlie');DICE.reskin('e',0,56,'sk-stone');DICE.placeEnemy([5,5,3]);S.eVals=[5,5,3];chip('BEAT 5-5-3 · 4 DMG INCOMING','red');}
  if(i>=at('levelup')){S.m.hp=7;S.bestBossHit=2;S.hp=0;S.rush=0;rushHud();}
  if(i>=at('boss2')){S.hp=5;S.hpMax=5;S.team=['larry','charlie','buttons'];S.skin=2;S.chargeMs=600;DICE.reskin('p',2);pip(2);$('crack').style.left='78%';$('crack').classList.add('on');setActive('charlie');handSet();}
  if(i>=at('finale')){S.m.hp=5;S.ev.flicked=true;}
  if(i>=at('recap')){S.m.hp=0;pip(3);S.ev.perfect=true;S.lastHit=18;$('mk').classList.add('ko');$('mk-hands').classList.add('ko');$('hud-mk').classList.remove('in');$('beast').classList.remove('on');DICE.fade('e');}
  bar('e');bar('m');gems();rushHud();}

/* ═══════════════ 16 · auto=1: the page plays itself through the REAL pointer handlers (synthetic PointerEvents on #play) ═══════════════ */
const AUTOP=(function(){let n=0;
  function fire(type,p){try{const ev=new PointerEvent(type,{bubbles:true,cancelable:true,composed:true,pointerId:11,pointerType:'touch',isPrimary:true,clientX:p.x,clientY:p.y,button:0,buttons:type==='pointerup'?0:1});play.dispatchEvent(ev);}catch(e){report(e);}}
  function hold(){const delay=320+Math.random()*260,holds=[300,650,900,1260],hd=holds[n++%holds.length];
    setTimeout(()=>{if(IN.mode!=='roll'||IN.holding)return;const c=trayCenter(),p=toClient(L.ax+c.x+vr(-18,18),L.ay+c.y+vr(-5,5));fire('pointerdown',p);
      setTimeout(()=>{if(!IN.holding)return;fire('pointermove',{x:p.x+2,y:p.y-8});setTimeout(()=>{fire('pointermove',{x:p.x+vr(-6,6),y:p.y-24});setTimeout(()=>fire('pointerup',{x:p.x,y:p.y-30}),16);},22);},hd);},delay);}
  function flick(){setTimeout(()=>{const q=FL.pos();if(!q||!FL.waiting())return;const err=vr(-8,8)*Math.PI/180,ang=Math.atan2(q.t.y-q.f.y,q.t.x-q.f.x)+err;
      const s=toClient(L.ax+q.f.x,L.ay+q.f.y),r=col.getBoundingClientRect(),sc=r.width/L.W,dist=95*L.k*sc;fire('pointerdown',s);
      for(let i=1;i<=7;i++)setTimeout(()=>{const d=dist*i/7,p={x:s.x+Math.cos(ang)*d,y:s.y+Math.sin(ang)*d};fire('pointermove',p);if(i===7)setTimeout(()=>fire('pointerup',p),10);},i*18);},650);}
  function go(){setTimeout(()=>{const g=$('go');if(g.classList.contains('on'))g.click();},1050);}
  return{hold,flick,go};})();

/* ═══════════════ 17 · reset (PLAY AGAIN), the ✕, the CTA ═══════════════ */
function resetWorld(){G.gen++;G.timers=[];G.tweens=[];G.scale=1;ANT.on=false;IN.mode='off';IN.holding=false;$('close').style.display='';body.classList.remove('endscreen');FINGER.hide();S.ended=false;S.crewGone=false;S.enemy='kodako';S.e.hp=S.e.max;S.m.hp=S.m.max;S.cap=0;S.attempt=0;S.bestBossHit=0;S.firstHit=0;S.lastHit=0;S.ev={lost:false,flicked:false,tripled:false,perfect:false};
  $('s-cta').classList.remove('on');$('win-tag').classList.remove('on');$('cta').classList.remove('on');$('again').classList.remove('on');$('recap').classList.remove('on');$('lvl').classList.remove('on');
  ['g-left','g-center','g-right'].forEach(id=>{const g=$(id);g.classList.remove('ko','flee','hit','vid');g.classList.add('in');});
  $('hud-e').classList.add('in');$('hud-mk').classList.remove('in');$('beast').classList.remove('on');$('crack').classList.remove('on');
  ['on','beast','ko','peek'].forEach(c=>$('mk').classList.remove(c));$('mk').classList.add('tease');['on','strike','ko'].forEach(c=>$('mk-hands').classList.remove(c));
  $('dark').classList.remove('on');$('bg').classList.remove('mkset');$('rocks').innerHTML='';
  hideStamp();sub(null);hideChip();VIEW.zoomTo(1,L.W/2,L.H/2,10);flames(true);
  document.querySelectorAll('.ghost>video.ready').forEach(v=>{if(!FX.crewOff){v.parentNode.classList.add('vid');const p=v.play();if(p)p.catch(()=>{});}});
  DICE.reskin('e',0,50,'sk-green');DICE.placeEnemy(D.shuffle(roll3()));DICE.clearMarks('e');DICE.clearMarks('p');DICE.placeTray();bar('e');bar('m');}
$('again').addEventListener('click',e=>{e.stopPropagation();AU.unlock();AU.play('click');resetWorld();runReplay().catch(report);});
$('cta').addEventListener('click',()=>{AU.play('click');mark('cta-click');});
$('close').addEventListener('click',e=>{e.stopPropagation();try{if(window.mraid&&typeof mraid.close==='function'){mraid.close();return;}}catch(err){}if(!S.ended)endCard(false);else $('close').style.display='none';});

/* ═══════════════ 18 · frame monitor (V1) + ?debug=1 ═══════════════ */
const PERF=(function(){const F=[];let last=0;const byPhase={};function loop(t){if(last){const d=t-last;F.push(d);if(F.length>120)F.shift();const k=S.phase;const b=byPhase[k]||(byPhase[k]={n:0,sum:0,long:0,max:0});b.n++;b.sum+=d;if(d>34)b.long++;if(d>b.max)b.max=d;}last=t;requestAnimationFrame(loop);}requestAnimationFrame(loop);
  return{fps(){if(!F.length)return 0;return Math.round(1000/(F.reduce((a,b)=>a+b,0)/F.length));},longs(){return F.filter(d=>d>34).length;},byPhase};})();
if(DEBUG){const d=document.createElement('div');d.style.cssText='position:absolute;left:0;top:0;z-index:999;background:rgba(0,0,0,.75);color:#0f0;font:10px/1.3 monospace;padding:4px;white-space:pre;pointer-events:none;max-width:100%';col.appendChild(d);
  setInterval(()=>{d.textContent=`fx=${FX.codec} seed=${SEED} beat=${S.beat} ph=${S.phase} FPS ${PERF.fps()} long ${PERF.longs()}\nhp ${S.hp}/${S.hpMax} kodako ${S.e.hp} king ${S.m.hp} rush ${S.rush} p=${S.pVals} e=${S.eVals}\nerrs=${ERR.length} ${ERR.slice(-2).join(' | ').slice(0,160)}`;},250);}
if(Q.has('css')){const st=document.createElement('style');st.textContent=Q.get('css');document.head.appendChild(st);}

/* ═══════════════ 19 · boot: the first frame IS the arena (no tap screen, no opener) ═══════════════ */
G.steppers.push(DICE.step,FL.step);
G.renderers.push(chargeTick,idleTick,(r,g,n)=>VIEW.tick(r,g,n),DICE.render,FINGER.tick,CV.draw);
DICE.init();size();addEventListener('resize',size);addEventListener('orientationchange',()=>setTimeout(size,80));
FX.init();FX.warm(['kodako','ghostl','ghostr']);flames(true);
bar('e');bar('m');gems();rushHud();setActive('larry');handSet();
DICE.placeTray([6,3,1]);DICE.placeEnemy(D.shuffle([4,3,1]));S.eVals=null;
/* Kodako's dice already rest on 4-3-1: read them back in index order */
S.eVals=DICE.team('e').map(d=>d.value);chip('BEAT 4-3-1!');
requestAnimationFrame(frame);
const startT=performance.now();
setTimeout(()=>{if(!BEAT||BEAT==='r1'){fingerTray();prompt(true,'HOLD TO ROLL');}},0);   /* ?beat= jumps (rigs) start past the first frame */
window.BOO={S,LOG,FLOG,ERR,PERF,SEED,G,get beat(){return S.beat;},version:'v2-1015',cost(){const C=G.cost;return{frames:C.n,avgMs:+(C.sum/Math.max(1,C.n)).toFixed(3),maxMs:+C.max.toFixed(2),over2ms:C.over2};},
  rig:{tray(){const c=trayCenter();return toClient(L.ax+c.x,L.ay+c.y);},flick(){const q=FL.pos();if(!q||!FL.waiting())return null;return{f:toClient(L.ax+q.f.x,L.ay+q.f.y),t:toClient(L.ax+q.t.x,L.ay+q.t.y)};}}};
(async()=>{try{
  if(REPLAY_Q||BEAT==='replay'){await runReplay();}else await runFirst(BEAT);
}catch(e){report(e);}})();
})();
