<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Battle of Origins</title>
<link rel="shortcut icon" href="TemplateData/favicon.ico">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; }

  #unity-container {
    width: 100%; height: 100%;
    position: absolute; top: 0; left: 0;
  }
  #unity-canvas {
    width: 100%; height: 100%;
    background: #0a0a0f;
    cursor: default;
  }

  /* Loading screen */
  #loading-screen {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 50%, #0f0f23 100%);
    z-index: 100;
    transition: opacity 0.5s;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #e0e0ff;
  }
  #loading-screen.hidden { opacity: 0; pointer-events: none; }

  #loading-title {
    font-size: 3rem;
    font-weight: 300;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
    background: linear-gradient(90deg, #7eb8ff, #c4a8ff, #7eb8ff);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 3s linear infinite;
  }
  #loading-subtitle {
    font-size: 0.9rem;
    letter-spacing: 0.15em;
    color: #8888aa;
    margin-bottom: 3rem;
  }

  #loading-bar-outer {
    width: 300px; height: 4px;
    background: #1a1a2e;
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 1rem;
  }
  #loading-bar-inner {
    width: 0%; height: 100%;
    background: linear-gradient(90deg, #4a6fa5, #7eb8ff);
    border-radius: 2px;
    transition: width 0.3s;
  }
  #loading-percent {
    font-size: 0.8rem;
    color: #6666aa;
    letter-spacing: 0.1em;
  }

  @keyframes shimmer {
    to { background-position: 200% center; }
  }

  /* Mobile warning */
  #mobile-warning {
    display: none;
    position: absolute; bottom: 2rem;
    font-size: 0.75rem; color: #666;
    text-align: center; padding: 0 2rem;
  }

  @media (max-width: 768px) {
    #loading-title { font-size: 1.8rem; }
    #mobile-warning { display: block; }
  }
</style>

<!-- Firebase JS SDK (compat for v8 API) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <div id="loading-screen">
    <div id="loading-title">Battle of Origins</div>
    <div id="loading-subtitle">Corkscrew Games</div>
    <div id="loading-bar-outer">
      <div id="loading-bar-inner"></div>
    </div>
    <div id="loading-percent">Loading...</div>
    <div id="mobile-warning">Best played in landscape on mobile devices</div>
  </div>

  <script>
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/world-unity.loader.js";
    var config = {
      dataUrl: buildUrl + "/world-unity.data.unityweb",
      frameworkUrl: buildUrl + "/world-unity.framework.js.unityweb",
      codeUrl: buildUrl + "/world-unity.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Corkscrew Games",
      productName: "Battle of Origins",
      productVersion: "1.0.2",
    };

    var loadingBar = document.getElementById("loading-bar-inner");
    var loadingPercent = document.getElementById("loading-percent");
    var loadingScreen = document.getElementById("loading-screen");
    var canvas = document.getElementById("unity-canvas");

    // Resize canvas to fill viewport
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function() {
      createUnityInstance(canvas, config, function(progress) {
        var pct = Math.round(progress * 100);
        loadingBar.style.width = pct + "%";
        loadingPercent.textContent = pct + "%";
      }).then(function(unityInstance) {
        window.unityInstance = unityInstance;
        loadingScreen.classList.add("hidden");
        setTimeout(function() { loadingScreen.style.display = "none"; }, 600);
      }).catch(function(message) {
        loadingPercent.textContent = "Error: " + message;
        console.error(message);
      });
    };
    document.body.appendChild(script);

    // Prevent right-click context menu on canvas
    canvas.addEventListener("contextmenu", function(e) { e.preventDefault(); });

    // ── Terrain Height Slider — dial in the exact grass-to-road match ──
    var sliderDiv = document.createElement('div');
    sliderDiv.innerHTML = [
      '<div style="position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:9999;',
      'background:rgba(0,0,0,.85);padding:10px 20px;border-radius:8px;display:flex;align-items:center;gap:12px;',
      'font-family:monospace;font-size:13px;color:#fff;border:1px solid #333">',
      '<span>Terrain Offset:</span>',
      '<input type="range" id="t-slider" min="-0.5" max="2.0" step="0.05" value="0" style="width:250px;cursor:pointer">',
      '<span id="t-value" style="min-width:40px;color:#58a6ff">0.00</span>',
      '<button id="t-apply" style="padding:4px 12px;background:#238636;border:1px solid #2ea043;color:#fff;border-radius:4px;cursor:pointer;font-family:monospace">Apply</button>',
      '</div>'
    ].join('');
    document.body.appendChild(sliderDiv);

    var tSlider = document.getElementById('t-slider');
    var tValue = document.getElementById('t-value');
    var tApply = document.getElementById('t-apply');

    tSlider.addEventListener('input', function() {
      tValue.textContent = parseFloat(tSlider.value).toFixed(2);
    });
    tApply.addEventListener('click', function() {
      if (window.unityInstance) {
        window.unityInstance.SendMessage('JSBridge', 'SetTerrainOffset', tSlider.value);
        tValue.textContent = parseFloat(tSlider.value).toFixed(2) + ' ✓';
        tValue.style.color = '#3fb950';
        setTimeout(function() { tValue.style.color = '#58a6ff'; }, 1500);
      }
    });
    // Also apply on Enter key
    tSlider.addEventListener('change', function() {
      tApply.click();
    });
  </script>
</body>
</html>
