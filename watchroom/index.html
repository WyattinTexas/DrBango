<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watchroom — Corkscrew Agents</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #06060e;
            --bg2: #0c0c1a;
            --bg3: #121228;
            --border: rgba(60, 80, 160, 0.15);
            --text: #b0b0d0;
            --text2: #5a5a80;
            --green: #40c878;
            --amber: #e0b040;
            --blue: #5080e0;
            --red: #e05050;
            --purple: #9060e0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                transparent 0px, transparent 2px,
                rgba(0, 0, 0, 0.03) 2px, rgba(0, 0, 0, 0.03) 4px
            );
            pointer-events: none;
            z-index: 100;
        }

        header {
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            color: var(--green);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .pulse {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--green);
            display: inline-block;
            margin-right: 10px;
            animation: pulse 2s ease-in-out infinite;
        }

        .pulse.idle { background: var(--text2); animation: none; }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 4px var(--green); }
            50% { opacity: 0.4; box-shadow: 0 0 12px var(--green); }
        }

        .badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--text2);
            background: var(--bg3);
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid var(--border);
        }

        .container { max-width: 960px; margin: 0 auto; padding: 24px; }

        .section-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        /* === LIVE TICKER === */
        .ticker {
            background: linear-gradient(135deg, rgba(64, 200, 120, 0.06), rgba(80, 128, 224, 0.04));
            border: 1px solid rgba(64, 200, 120, 0.15);
            border-radius: 10px;
            padding: 16px 20px;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }

        .ticker::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--green), transparent);
            animation: tickerSweep 3s linear infinite;
        }

        @keyframes tickerSweep {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .ticker-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            color: var(--green);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ticker-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--green);
            animation: tickerBlink 1.5s ease-in-out infinite;
        }

        @keyframes tickerBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .ticker-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(60, 80, 160, 0.08);
        }

        .ticker-item:last-child { border-bottom: none; }

        .ticker-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--text2);
            white-space: nowrap;
            min-width: 55px;
            padding-top: 1px;
        }

        .ticker-agent {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--purple);
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(144, 96, 224, 0.1);
            padding: 2px 6px;
            border-radius: 3px;
            white-space: nowrap;
        }

        .ticker-text {
            font-size: 0.8rem;
            color: var(--text);
            line-height: 1.4;
        }

        /* === REFINER CARDS === */
        .refiners { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }

        .refiner-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-left: 3px solid var(--green);
            border-radius: 8px;
            padding: 14px 18px;
        }

        .refiner-card.done { border-left-color: var(--blue); }

        .refiner-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .refiner-card .target {
            font-weight: 700;
            color: var(--blue);
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .refiner-card .meta {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--text2);
            text-align: right;
        }

        .refiner-last-action {
            background: rgba(224, 176, 64, 0.06);
            border: 1px solid rgba(224, 176, 64, 0.12);
            border-radius: 6px;
            padding: 10px 12px;
            margin-bottom: 8px;
        }

        .refiner-last-action .action-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.55rem;
            font-weight: 700;
            color: var(--amber);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .refiner-last-action .action-text {
            font-size: 0.78rem;
            color: var(--text);
            line-height: 1.5;
        }

        .refiner-plan {
            padding: 8px 12px;
            background: rgba(64, 200, 120, 0.04);
            border: 1px solid rgba(64, 200, 120, 0.08);
            border-radius: 6px;
            font-size: 0.72rem;
            line-height: 1.6;
        }

        .lookahead .label, .refiner-plan .label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-right: 4px;
        }

        .lookahead .next-label, .refiner-plan .next-label { color: var(--green); }
        .lookahead .after-label, .refiner-plan .after-label { color: var(--text2); }
        .lookahead .plan-text, .refiner-plan .plan-text { color: var(--text2); }

        /* === PROGRESS BAR === */
        .progress-bar {
            height: 3px;
            background: var(--bg3);
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--green), var(--blue));
            border-radius: 2px;
            transition: width 0.5s ease;
        }

        /* === FEED === */
        .feed { display: flex; flex-direction: column; gap: 6px; }

        .feed-item {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            animation: slideIn 0.3s ease-out;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .feed-item:hover { border-color: rgba(60, 80, 160, 0.3); }

        .feed-item.new-entry {
            animation: flashNew 1s ease-out;
        }

        @keyframes flashNew {
            0% { border-color: var(--green); background: rgba(64, 200, 120, 0.08); }
            100% { border-color: var(--border); background: var(--bg2); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feed-item .cycle-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .feed-item .cycle-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--amber);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .feed-item .cycle-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            color: var(--text2);
        }

        .feed-item .summary {
            font-size: 0.8rem;
            color: var(--text);
            line-height: 1.5;
        }

        .feed-item .summary.empty {
            color: var(--text2);
            font-style: italic;
        }

        .feed-item .lookahead {
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid var(--border);
            font-size: 0.7rem;
            line-height: 1.5;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, padding-top 0.3s ease, margin-top 0.3s ease;
            margin-top: 0;
            padding-top: 0;
        }

        .feed-item.expanded .lookahead {
            max-height: 200px;
            margin-top: 6px;
            padding-top: 6px;
        }

        .feed-expand-hint {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.55rem;
            color: var(--text2);
            margin-left: 8px;
            opacity: 0.5;
        }

        .spinner {
            display: inline-block;
            width: 10px; height: 10px;
            border: 2px solid var(--border);
            border-top-color: var(--green);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .no-data {
            text-align: center;
            padding: 60px 20px;
            color: var(--text2);
        }

        .no-data .big {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            color: var(--text2);
            margin-bottom: 8px;
        }

        .cycle-count-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.55rem;
            color: var(--green);
            background: rgba(64, 200, 120, 0.1);
            padding: 2px 6px;
            border-radius: 3px;
            margin-left: 8px;
        }

        @media (max-width: 600px) {
            .container { padding: 16px; }
            header h1 { font-size: 0.85rem; }
            .refiner-top { flex-direction: column; align-items: flex-start; gap: 6px; }
            .ticker-item { flex-direction: column; gap: 4px; }
        }
    </style>
</head>
<body>
    <header>
        <h1><span class="pulse" id="pulse"></span>Watchroom</h1>
        <div class="badge" id="badge">loading...</div>
    </header>

    <div class="container">
        <!-- Live ticker: most recent activity at a glance -->
        <div class="ticker" id="ticker" style="display:none">
            <div class="ticker-label"><span class="ticker-dot"></span> Latest Activity</div>
            <div id="ticker-items"></div>
        </div>

        <div class="section-label">Active Refiners</div>
        <div class="refiners" id="refiners">
            <div class="no-data"><div class="big">Scanning...</div></div>
        </div>

        <div class="section-label">Activity Log <span class="cycle-count-badge" id="total-cycles"></span></div>
        <div class="feed" id="feed">
            <div class="no-data">
                <div class="big">Waiting for agents...</div>
                Improvements will appear here as refiners complete cycles
            </div>
        </div>
    </div>

    <script>
        const pulse = document.getElementById('pulse');
        const badge = document.getElementById('badge');
        const refinersEl = document.getElementById('refiners');
        const feedEl = document.getElementById('feed');
        const tickerEl = document.getElementById('ticker');
        const tickerItemsEl = document.getElementById('ticker-items');
        const totalCyclesEl = document.getElementById('total-cycles');

        let lastFeedHash = '';
        let seenCycles = new Set();
        let firstLoad = true;

        function esc(t) { const d = document.createElement('span'); d.textContent = t; return d.innerHTML; }

        function timeAgo(isoStr) {
            const secs = Math.floor((Date.now() - new Date(isoStr).getTime()) / 1000);
            if (secs < 60) return secs + 's ago';
            if (secs < 3600) return Math.floor(secs / 60) + 'm ago';
            return Math.floor(secs / 3600) + 'h ago';
        }

        function formatTime(timeStr) {
            // Convert "01:35:35" to "1:35 AM"
            const parts = timeStr.split(':');
            let h = parseInt(parts[0]);
            const m = parts[1];
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            return h + ':' + m + ' ' + ampm;
        }

        // Calculate time elapsed percentage for progress bar
        function calcProgress(r) {
            if (r.status !== 'running' || !r.remaining_mins) return 100;
            // Estimate total from cycles and remaining
            const totalEstimate = r.remaining_mins + (r.cycles * 2); // rough estimate
            return Math.min(100, Math.max(5, ((totalEstimate - r.remaining_mins) / totalEstimate) * 100));
        }

        function findLastSummary(feed, target) {
            return feed.find(e => e.target === target);
        }

        async function refresh() {
            try {
                const res = await fetch('status.json?t=' + Date.now());
                if (!res.ok) throw new Error('No status');
                const data = await res.json();

                const refs = Object.entries(data.refiners || {});
                const activeCount = refs.filter(([_, r]) => r.status === 'running').length;
                const feed = data.feed || [];

                // Badge
                if (activeCount > 0) {
                    pulse.classList.remove('idle');
                    badge.textContent = 'LIVE — ' + activeCount + ' agent(s)';
                } else if (refs.length > 0) {
                    pulse.classList.add('idle');
                    badge.textContent = refs.length + ' refiner(s) — idle';
                } else {
                    pulse.classList.add('idle');
                    badge.textContent = 'no agents';
                }

                // === LIVE TICKER: last 3 completed actions ===
                if (feed.length > 0) {
                    tickerEl.style.display = '';
                    const recent = feed.slice(0, 3);
                    tickerItemsEl.innerHTML = recent.map(e => `
                        <div class="ticker-item">
                            <div class="ticker-time">${formatTime(e.time)}</div>
                            <div class="ticker-agent">${esc(e.target)}</div>
                            <div class="ticker-text">${esc(e.summary)}</div>
                        </div>
                    `).join('');
                }

                // === REFINER CARDS: show last action + what's next ===
                if (refs.length > 0) {
                    refinersEl.innerHTML = refs.map(([key, r]) => {
                        const lastAction = findLastSummary(feed, key);
                        const progress = calcProgress(r);

                        return `
                        <div class="refiner-card ${r.status === 'done' ? 'done' : ''}">
                            <div class="refiner-top">
                                <div class="target">
                                    ${r.status === 'running' ? '<span class="spinner"></span>' : ''}
                                    ${esc(r.name || key)}
                                </div>
                                <div class="meta">
                                    ${r.cycles} cycles<br>
                                    ${r.status === 'running' ? r.remaining_mins + 'm left &middot; until ' + esc(r.until) : 'completed'}<br>
                                    ${timeAgo(r.last_update)}
                                </div>
                            </div>

                            ${lastAction ? `
                            <div class="refiner-last-action">
                                <div class="action-label">Last Completed — Cycle #${lastAction.cycle}</div>
                                <div class="action-text">${esc(lastAction.summary)}</div>
                            </div>` : ''}

                            ${r.next_up || r.after_that ? `
                            <div class="refiner-plan">
                                ${r.next_up ? `<span class="label next-label">Next:</span> <span class="plan-text">${esc(r.next_up)}</span><br>` : ''}
                                ${r.after_that ? `<span class="label after-label">Then:</span> <span class="plan-text">${esc(r.after_that)}</span>` : ''}
                            </div>` : ''}

                            ${r.status === 'running' ? `
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${progress}%"></div>
                            </div>` : ''}
                        </div>`;
                    }).join('');
                }

                // === FEED: compact, expandable, with new-entry flash ===
                totalCyclesEl.textContent = feed.length + ' cycles total';

                const newHash = feed.length > 0 ? feed[0].target + feed[0].cycle : '';
                const hasNewEntry = !firstLoad && newHash !== lastFeedHash;

                if (feed.length > 0) {
                    feedEl.innerHTML = feed.map((e, i) => {
                        const cycleKey = e.target + '#' + e.cycle;
                        const isNew = hasNewEntry && i === 0;
                        if (!firstLoad) seenCycles.add(cycleKey);

                        return `
                        <div class="feed-item ${isNew ? 'new-entry' : ''}" onclick="this.classList.toggle('expanded')">
                            <div class="cycle-header">
                                <div class="cycle-tag">
                                    ${esc(e.target)} #${e.cycle}
                                    ${e.next_up ? '<span class="feed-expand-hint">click to expand</span>' : ''}
                                </div>
                                <div class="cycle-time">${formatTime(e.time)} &middot; ${timeAgo(e.timestamp)}</div>
                            </div>
                            <div class="summary ${e.summary.includes('no summary') ? 'empty' : ''}">
                                ${esc(e.summary)}
                            </div>
                            ${e.next_up || e.after_that ? `
                            <div class="lookahead">
                                ${e.next_up ? `<span class="label next-label">Next:</span> <span class="plan-text">${esc(e.next_up)}</span><br>` : ''}
                                ${e.after_that ? `<span class="label after-label">Then:</span> <span class="plan-text">${esc(e.after_that)}</span>` : ''}
                            </div>` : ''}
                        </div>`;
                    }).join('');
                }

                lastFeedHash = newHash;
                firstLoad = false;

            } catch (err) {
                badge.textContent = 'waiting for data';
                pulse.classList.add('idle');
            }
        }

        refresh();
        setInterval(refresh, 5000); // Poll every 5s for responsiveness
    </script>
</body>
</html>
